<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — DT การเปลี่ยนผ่านดิจิทัล ปี 2569</title>
<style>
@font-face{font-family:'Anakotmai';font-weight:300;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-light.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:500;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-medium.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:700;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-bold.woff2') format('woff2');}
</style>
<style>
/* ── PAT Editorial Light ── */
:root{
  --bg:#f8f7f4;--bg2:#f1efe9;--card:#ffffff;
  --border:#e6e3dc;--border-s:#ece9e1;
  --text:#1c1f24;--text2:#5a5f68;--text3:#9a9da3;
  --navy:#1e3a5c;--gold:#b8862f;
  --lv1:#e2554f;--lv2:#ef9483;--lv3:#e3a82e;--lv4:#5bc69a;--lv5:#1f9d6f;
  --shadow:0 1px 3px rgba(28,31,36,.06);
  --shadow-h:0 4px 12px rgba(28,31,36,.10);
  --radius:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Anakotmai',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Anakotmai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--navy);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold);}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* DIM HEADER */
.dim-hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);}

/* CHIPS */
.chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.cn{background:var(--bg2);color:var(--text2);}
.ct{background:rgba(31,157,111,.12);color:#0f7a55;}
.cr{background:rgba(226,85,79,.10);color:#b91c1c;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 97px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--navy);color:rgba(255,255,255,.9);letter-spacing:.2px;}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:12px;font-weight:700;color:var(--navy);min-width:16px;}
.grp-name{font-size:12px;font-weight:600;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:500;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.chk-all{background:#e4f5e4;color:#ea580c;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:4px;background:#d8d4cc;border-radius:2px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;border-radius:2px;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1px solid var(--border-s);transition:background .12s;}
.sub:hover{background:rgba(30,58,92,.04);}
.sub.focus-cg{background:rgba(30,58,92,.07);border-left:3px solid var(--navy);}
.sub.focus-cg .sub-target{border-left-color:var(--navy);}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:700;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--navy);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(30,58,92,.12);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.s0{background:var(--bg2);color:var(--text3);}
.s1{background:rgba(227,168,46,.15);color:#92400e;}
.s2{background:rgba(31,157,111,.12);color:#0f7a55;}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:2px solid var(--navy);background:var(--card);flex-shrink:0;box-shadow:0 -2px 8px rgba(28,31,36,.04);}
.cl-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--navy);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1px solid var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--navy);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:600;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--card);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.frame{border-bottom:1px solid var(--border);}
.frame-hd{padding:8px 16px;font-size:12px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:12px 16px;font-size:13px;line-height:1.65;}
.ftag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.fa-hd{background:rgba(30,58,92,.06);}.fa-tag{background:rgba(30,58,92,.14);color:var(--navy);}
.fb-hd{background:rgba(2,132,199,.06);}.fb-tag{background:rgba(2,132,199,.14);color:#0369a1;}
.fc-hd{background:rgba(184,134,47,.08);}.fc-tag{background:rgba(184,134,47,.18);color:#92400e;}
.fd-hd{background:rgba(71,85,105,.06);}.fd-tag{background:rgba(71,85,105,.14);color:#475569;}
.fe-hd{background:rgba(31,157,111,.07);}.fe-tag{background:rgba(31,157,111,.14);color:#0f7a55;}

.box{border-radius:5px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;}
.box-red{background:rgba(226,85,79,.08);color:#7a1010;border-left:3px solid var(--lv1);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--navy);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;}
.exp-btn:hover{background:var(--border);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:rgba(30,58,92,.05);border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;}
.cg-lvl-row{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--navy);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;overflow:hidden;min-width:0;}
.cg-lvl-summ .kt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
.cg-toggle{background:none;border:1px solid #c0b0e0;border-radius:4px;cursor:pointer;font-size:11px;color:#5a20a0;padding:1px 6px;flex-shrink:0;transition:background .1s;}
.cg-toggle:hover{background:#ece6ff;}
.cl-short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
.cl-exp-btn{font-size:9.5px;color:#5a20a0;cursor:pointer;user-select:none;margin-top:2px;display:inline-block;}
.dep-count-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px 5px;background:#f8f5ff;border-bottom:1px solid #d8ccee;}
.dep-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap;}
.dep-pill span{font-weight:400;opacity:.85;}
.cg-lvl-summ .kt{font-weight:700;color:var(--navy);}
.cg-lvl-detail{padding:8px 14px 10px;background:rgba(30,58,92,.04);border-top:1px dashed var(--border);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:5px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--navy);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--navy);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 4px 4px 0;background:rgba(226,85,79,.05);line-height:1.55;}
.cg-prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:8px;}
.cg-prog-fill{height:4px;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:5px;border:1px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:700;color:var(--navy);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(2,132,199,.06);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:rgba(2,132,199,.10);}
.doc-lvl-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#0369a1;color:#fff;flex-shrink:0;}
.doc-lvl-title{font-size:13px;font-weight:600;color:#0369a1;flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1px solid var(--border);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:#0369a1;font-weight:700;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:rgba(184,134,47,.08);border:1px dashed rgba(184,134,47,.4);border-radius:5px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:rgba(30,58,92,.05);border:1px solid rgba(30,58,92,.15);border-radius:5px;padding:8px 12px;font-size:13px;color:var(--navy);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:#0369a1;color:#fff;text-decoration:none;font-weight:600;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.fb-prog-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);}
.fb-prog-track{flex:1;height:4px;background:#e0ddd8;border-radius:2px;overflow:hidden;}
.fb-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.55;margin:2px 0;border:1px solid transparent;transition:background .12s;}
.fb-item:hover{background:rgba(2,132,199,.05);}
.fb-item-done{background:#f0faf0 !important;border-color:#c3e6cb !important;}
.fb-item-done .fb-item-text{color:#ea580c;text-decoration:line-through;opacity:.7;}
.fb-item-gap{border-left:3px solid #d97706;}
.fb-gap-tag{font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;padding:1px 5px;border-radius:10px;flex-shrink:0;white-space:nowrap;margin-top:1px;}
.fb-item input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#0369a1;width:14px;height:14px;cursor:pointer;}
.fb-item-text{color:var(--text2);flex:1;}

/* FRAME E — Self-Assessment Input + Gen */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap;}
.fe-sect-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;}
.fe-lvl-block{margin-bottom:5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.fe-lvl-active{border-color:#86efac;}
.fe-lvl-hd{display:flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;transition:background .12s;background:var(--bg2);}
.fe-lvl-hd:hover{background:rgba(0,0,0,.03);}
.fe-lvl-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.fe-doc-ref{font-size:11px;color:#0369a1;font-weight:600;flex-shrink:0;}
.fe-lvl-body{padding:8px 11px 10px;display:none;border-top:1px solid var(--border);background:var(--bg);}
.fe-lvl-body.open{display:block;}
.fe-textarea{width:100%;box-sizing:border-box;padding:7px 10px;font-size:12.5px;line-height:1.65;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:#0369a1;box-shadow:0 0 0 2px rgba(3,105,161,.1);}
.fe-gap-item{padding:8px 11px 10px;margin-bottom:5px;background:rgba(217,119,6,.05);border:1px solid rgba(217,119,6,.22);border-radius:var(--radius);}
.fe-gap-text{font-size:12.5px;color:#92400e;margin-bottom:6px;line-height:1.55;}
.fe-gap-status{display:flex;gap:14px;margin-bottom:7px;}
.fe-radio-lbl{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2);}
.fe-radio-lbl input{accent-color:#ea580c;cursor:pointer;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:#1e3a5c;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.fe-gen-btn:hover{opacity:.85;}
.fe-output{width:100%;box-sizing:border-box;padding:10px 12px;font-size:12px;line-height:1.75;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;}
.fe-copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 14px;border-radius:20px;background:#0369a1;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;margin-top:6px;}
.fe-copy-btn:hover{opacity:.85;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#c9c5bc;}

/* ── Cross-Dimension Linkage Badges ── */
.dim-badge{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;letter-spacing:.4px;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .15s;}
.dim-badge:hover{opacity:.75;}
.dim-gap-tag{font-size:9px;font-weight:700;color:#b05000;padding:1px 5px;border-radius:3px;background:#fff3e0;border:1px solid #e07000;white-space:nowrap;}
.crosslink-summ{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 12px;background:#f5f0ff;border-bottom:1px solid #d8ccee;font-size:9.5px;color:#4a3a6a;}

  {id:"3.1",grp:"3",gname:"การบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงาน (Government Integration)",gw:10,gs68:3.0,name:"การบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงาน",w:10,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:[],good:["กำหนดกระบวนการบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงานทั้งภาครัฐและเอกชนอย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","มีเกณฑ์การพิจารณาเลือกคู่ความร่วมมือ (Partner Selection) อย่างเหมาะสม","มีหลักฐาน Implementation ที่ชัดเจน: เช่น การทำ MOU แลกเปลี่ยนข้อมูลกับกรมการขนส่งทางบก (ขบ.) เพื่อติดตามรถบรรทุกและควบคุมความปลอดภัย","มีการถ่ายทอดกระบวนการ วิเคราะห์ผู้มีส่วนได้ส่วนเสีย ทำแผนสื่อสาร และประเมินผลการรับรู้ครบถ้วน"],gaps:["ช่องว่าง Level 4-5: TRIS มองว่า 'แบบสำรวจความพึงพอใจ' หรือ 'จำนวน MOU ที่ทำสำเร็จ' เป็นเพียง Output — TRIS ต้องการ Outcome เช่น การเชื่อมโยงข้อมูลกับ ขบ. ทำให้ลดเวลาดำเนินงานได้กี่เปอร์เซ็นต์ ลดความผิดพลาด หรือลดต้นทุนทางสังคมได้เท่าไร","ขาด Leading/Lagging Indicator และขาดการนำระบบดิจิทัล/บูรณาการข้อมูลไปยกระดับกลยุทธ์องค์กร"],results:["(L1-2) มี 'คู่มือและนโยบายการบูรณาการเชื่อมโยงข้อมูล' กำหนดเกณฑ์เลือกคู่ความร่วมมือ และมีการต่ออายุ/จัดทำ MOU ร่วมกับหน่วยงานภายนอก","(L3) มี RACI Matrix วิเคราะห์ผู้มีส่วนได้ส่วนเสีย สื่อสารให้พนักงานภายในและหน่วยงานภายนอกรับทราบ และมีการประเมินการรับรู้ครบถ้วน","(L4-5) มีการกำหนดตัวชี้วัดผลลัพธ์ ทำแบบสำรวจความพึงพอใจคู่ความร่วมมือ (เช่น กรมการขนส่งทางบก) และนำรายงานผลประเมินเสนอต่อผู้บริหาร"],tris:[],suggest:[],docs:[],bestprac:[],minReqs:{},subComps:{}},
  {id:"4.1",grp:"4",gname:"การกำกับดูแลข้อมูลและการบริหารจัดการข้อมูลขนาดใหญ่ขององค์กร (Data Governance and Big Data)",gw:10,gs68:3.0,name:"การดำเนินการด้านการกำกับดูแลข้อมูลและการบริหารจัดการข้อมูลขนาดใหญ่ขององค์กร",w:10,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:[],good:["วางโครงสร้างการกำกับดูแลข้อมูล (Data Governance Council และ Data Steward Team) ที่ชัดเจน มีส่วนงานกลางประกอบด้วยบุคลากรด้านธุรกิจและไอที","มีคู่มือและกระบวนการทำงานที่เป็นระบบ (Repeatable) เป็นมาตรฐาน และบังคับใช้นโยบายข้อมูลทั่วองค์กร","มีการวัดประสิทธิภาพกระบวนการ ตรวจสอบคุณภาพข้อมูล และประเมิน ROI จากการบริหารข้อมูล","มี Implementation เชิงประจักษ์: คัดเลือกชุดข้อมูลสำคัญ (Critical Knowledge) จาก ERP, VCMS และ CTMS มาบริหารเป็น Big Data","มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสียครบถ้วนตลอด Value Chain สื่อสารได้ดี และมีการประเมินผลการรับรู้"],gaps:["ตกม้าตายเรื่อง GFMIS-SOE: การนำส่งข้อมูลเข้าระบบ GFMIS-SOE ของ สคร. 'ล่าช้า' — นี่คือจุดตายเชิงประจักษ์ที่ทำให้ กทท. ไม่สามารถหลุดพ้นระดับ 3 ขึ้นไปได้","KPIs ยังไม่เป็น Outcome: ตัวชี้วัดที่ส่งให้ TRIS ยังถูกมองว่าเป็นแค่ Output ไม่ได้แสดงว่า กทท. ตัดสินใจทางธุรกิจดีขึ้นแค่ไหนจากข้อมูลชุดนี้","ขาดการประยุกต์ใช้ AI และ Big Data เชิงวิเคราะห์/พยากรณ์"],results:["(L1-2) โครงสร้างคู่มือกำกับดูแล (V4.0) ตั้งคณะกรรมการ นโยบาย แบบประเมินคุณภาพ (DQA Checklist, DQA Self-Assessment) และวัดความคุ้มทุน (ROI) ครบถ้วน","(L3) สื่อสาร ถ่ายทอด วิเคราะห์ผู้มีส่วนได้ส่วนเสียผ่าน Value Chain และ RACI Chart รวมถึงมีหลักฐานการปฏิบัติงานจริงในฐานข้อมูลระดับองค์กร","(L4-5) มีการติดตามประเมินผลตามตัวชี้วัด นำเข้าสู่ที่ประชุมคณะทำงาน และนำผลลัพธ์ไปทบทวนเพื่อบรรจุลงในแผนปฏิบัติการดิจิทัล ปี 2568"],tris:[],suggest:[],docs:[],bestprac:[],minReqs:{},subComps:{}},

// ── STATE ────────────────────────────────────────────────────────────
let dtMrChk={};   // dtMrChk[sid][L][ri] = bool — minReqs gating
let dtScChk={};   // dtScChk[sid][L][si] = bool — subComps partial credit
let dtDimMlt={};  // dtDimMlt[sid][L] = 0|0.5|1.0 — fallback when no subComps

let targets={dt:{}};let focusId=null;

DATA.dt.subs.forEach(s=>{
  dtMrChk[s.id]={};dtScChk[s.id]={};dtDimMlt[s.id]={};
  targets.dt[s.id]=s.s68;
  for(let L=1;L<=5;L++){
    dtMrChk[s.id][L]={};
    dtScChk[s.id][L]=(s.subComps&&s.subComps[L])?s.subComps[L].map(()=>false):[];

  }
});

// ── LOAD ─────────────────────────────────────────────────────────────
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    if(d.mr)Object.assign(dtMrChk,d.mr);
    if(d.sc)Object.assign(dtScChk,d.sc);
    if(d.dm)Object.assign(dtDimMlt,d.dm);
    if(d.cl)Object.assign(clChecked,d.cl);
    if(d.dc)Object.assign(docCk,d.dc);
    if(d.fe)Object.assign(feInput,d.fe);
  }catch(e){}
  DATA.dt.subs.forEach(s=>{targets.dt[s.id]=dtCalcRaw(s.id)||s.s68;});
}

// ── SAVE / EXPORT / IMPORT ───────────────────────────────────────────
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({mr:dtMrChk,sc:dtScChk,dm:dtDimMlt,cl:clChecked,dc:docCk,fe:feInput}));}catch(e){}
  syncHomeStatus();
}
function exportProgress(){
  const payload=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  payload._exported=new Date().toISOString();payload._dim='DT';
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='SM_progress_'+new Date().toLocaleDateString('th-TH').replace(/\//g,'')+'.json';
  a.click();
}
function importProgress(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const exp=d._exported?new Date(d._exported).toLocaleString('th-TH'):'ไม่ระบุ';
      if(!confirm('นำเข้าข้อมูล DT (ส่งออกเมื่อ '+exp+')\nจะทับข้อมูลปัจจุบัน — ยืนยัน?'))return;
      delete d._exported;delete d._dim;
      localStorage.setItem(LS_KEY,JSON.stringify(d));
      loadState();renderAll();
    }catch(err){alert('ไฟล์ไม่ถูกต้อง');}
  };
  reader.readAsText(file);input.value='';
}
function syncHomeStatus(){
  try{
    const home=JSON.parse(localStorage.getItem('seam_status_69')||'{}');
    if(!home.sm)home.sm={};
    DATA.dt.subs.forEach(s=>{
      const score=dtCalcRaw(s.id);
      const gc=(s.gaps||[]).length;
      home.sm[s.id]={level:score,hasOpenGap:gc>0,gapCount:gc};
    });
    localStorage.setItem('seam_status_69',JSON.stringify(home));
  }catch(e){}
}

// ── SCORING ──────────────────────────────────────────────────────────
function dtCalcLevel(sid,L){
  const s=DATA.dt.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(dtDimMlt[sid]&&dtDimMlt[sid][L])||0;
}
function dtCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=dtCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

// ── SETTERS ──────────────────────────────────────────────────────────
function dtToggleMR(sid,L,ri,val){
  if(!dtMrChk[sid])dtMrChk[sid]={};
  if(!dtMrChk[sid][L])dtMrChk[sid][L]={};
  dtMrChk[sid][L][ri]=val;
  targets.dt[sid]=dtCalcRaw(sid);save();renderAll();
}
function dtToggleSC(sid,L,si,val){
  if(!dtScChk[sid])dtScChk[sid]={};
  if(!dtScChk[sid][L])dtScChk[sid][L]=[];
  dtScChk[sid][L][si]=val;
  targets.dt[sid]=dtCalcRaw(sid);save();renderAll();
}
function dtSetDim(sid,L,val){
  if(!dtDimMlt[sid])dtDimMlt[sid]={};
  dtDimMlt[sid][L]=parseFloat(val);
  targets.dt[sid]=dtCalcRaw(sid);save();renderAll();
}
function dtClearAll(){
  DATA.dt.subs.forEach(s=>{
    dtMrChk[s.id]={};dtScChk[s.id]={};dtDimMlt[s.id]={};
    [1,2,3,4,5].forEach(L=>{dtMrChk[s.id][L]={};dtScChk[s.id][L]=[];dtDimMlt[s.id][L]=0;});
    delete docCk[s.id];delete feInput[s.id];delete clChecked[s.id];
  });
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  DATA.dt.subs.forEach(s=>{targets.dt[s.id]=s.s68;});
  renderAll();
}

function docGetChk(sid,L,i){return !!(docCk[sid]&&docCk[sid][L]&&docCk[sid][L][i]);}
function feGet(sid,field,key){return(feInput[sid]&&feInput[sid][field]&&feInput[sid][field][key])||'';}
function feSet(sid,field,key,val){if(!feInput[sid])feInput[sid]={};if(!feInput[sid][field])feInput[sid][field]={};feInput[sid][field][key]=val;save();}
function feGapClosed(sid,i){const fi=feInput[sid];if(!fi||!fi.gapClosed)return null;return fi.gapClosed.hasOwnProperty(i)?fi.gapClosed[i]:null;}
function feCopyOut(outId,btn){
  const el=document.getElementById(outId);if(!el)return;
  const orig=btn.textContent;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(el.value).then(()=>{btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent=orig,1500);}).catch(()=>{el.select();document.execCommand('copy');});}
  else{el.select();document.execCommand('copy');btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent=orig,1500);}
}
function docToggle(sid,L,i,v){
  if(!docCk[sid])docCk[sid]={};if(!docCk[sid][L])docCk[sid][L]={};
  docCk[sid][L][i]=v;save();
  const inp=document.getElementById(`dck-${sid}-${L}-${i}`);
  if(inp){const lbl=inp.closest('label');if(lbl){if(v)lbl.classList.add('fb-item-done');else lbl.classList.remove('fb-item-done');}}
  updateDocProgress(sid);
}
function updateDocProgress(sid){
  const s=DATA.dt.subs.find(x=>x.id===sid);if(!s)return;
  const mr=s.minReqs||{};let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];total+=items.length;
    const lvlDone=items.filter((_,i)=>docGetChk(sid,L,i)).length;done+=lvlDone;
    const cntEl=document.getElementById(`fb-cnt-${sid}-${L}`);

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.dt.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>dtCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${dtCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=dtCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(dtDimMlt[sid]&&dtDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.dt[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.dt[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#ea580c':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#ea580c':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#ea580c;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#ea580c':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';

      });

    }
    const dimStrip=ints.length?`<div class="lvl-dim-strip">${ints.map(dimBadge).join(' ')}</div>`:'';
    lvlHTML+=`<div class="cg-lvl-row${ls.bl?' blocked':L===gapL?' is-gap':''}">

    gaps.forEach((gap,i)=>{
      const cl=feGapClosed(sid,i);const gNote=feGet(sid,'gapNotes',i);
      html+=`<div class="fe-gap-item"><div class="fe-gap-text">⚠️ ${gap}</div><div class="fe-gap-status"><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="1"${cl===true?' checked':''} onchange="feSet('${sid}','gapClosed',${i},true)">✓ ปิดได้แล้ว</label><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="0"${cl===false?' checked':''} onchange="feSet('${sid}','gapClosed',${i},false)">○ อยู่ระหว่างดำเนินการ</label></div><textarea class="fe-textarea" rows="2" placeholder="อธิบายสิ่งที่ทำเพื่อปิด Gap นี้..." onchange="feSet('${sid}','gapNotes',${i},this.value)" onblur="feSet('${sid}','gapNotes',${i},this.value)">${gNote}</textarea></div>`;
    });
  }
  html+=`<div style="margin-top:14px;"><button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button><span style="font-size:11px;color:var(--text3);margin-left:8px;">รวม Simulator + เอกสาร Frame B + Notes ทั้งหมด</span></div><div style="margin-top:8px;"><textarea class="fe-output" id="${outId}" rows="14" placeholder="กด Gen Script เพื่อสร้างคำตอบ — แก้ไขได้ก่อน Copy"></textarea><button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button></div>`;
  return html;
}

// ── renderRight ──────────────────────────────────────────────────────
function renderRight(){
  const body=document.getElementById('rightBody');
  if(!focusId){body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:13px;">คลิก sub-item ด้านซ้ายเพื่อดูรายละเอียด</div>';return;}
  const s=DATA.dt.subs.find(x=>x.id===focusId);if(!s){body.innerHTML='';return;}
  const simHTML=renderSim(s);const tval=targets.dt[s.id];
  const gA=(s.gaps||[]).map(g=>`<div class="box box-red" style="margin-bottom:4px;">• ${exp(g,90)}</div>`).join('');
  const rC=(s.results||[]).map(r=>`<div class="match-row m-ok"><span>✓</span><span>${exp(r,80)}</span></div>`).join('');
  const lC=(s.gaps||[]).slice(0,3).map(g=>`<div class="match-row m-no"><span>✗</span><span style="font-size:10.5px;">${g.split(' —')[0].slice(0,70)}</span></div>`).join('');
  const dD=(s.actions||[]).map(a=>`<div style="display:flex;align-items:flex-start;gap:5px;font-size:11px;color:#333;padding:3px 0;"><span style="color:#ea580c;flex-shrink:0;">→</span><span>${exp(a,100)}</span></div>`).join('');
  body.innerHTML=`
    <div style="padding:5px 12px;font-size:11px;background:#e8f5ee;border-bottom:1px solid #c0dac8;display:flex;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:2;">
      <span style="font-weight:700;color:#0a4a2a;">ข้อ ${s.id}</span>
      <span style="color:#555;font-size:10.5px;">${s.name}</span>
      <span style="margin-left:auto;font-size:10px;background:#e0ddd4;color:#444;padding:1px 7px;border-radius:8px;">ปัจจุบัน ${fmt(s.s68)}</span>
      <span style="font-size:10px;">→</span>
      <span style="font-size:10px;background:#c5e8d5;color:#0a4a2a;padding:1px 7px;border-radius:8px;font-weight:700;">คำนวณ ${fmt(tval)}</span>
    </div>
    ${simHTML}
    <div class="frame"><div class="frame-hd fa-hd"><span class="ftag fa-tag">A</span><span style="color:#7a1010;">ช่องว่างที่ต้องปิด (TRIS)</span></div><div class="frame-bd">${gA||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame"><div class="frame-hd fb-hd"><span class="ftag fb-tag">B</span><span style="color:#102070;">เอกสารลงระบบ — แยกตามระดับ</span><a href="${DOC_DETAIL_URL}" target="_blank" style="margin-left:auto;font-size:9.5px;padding:2px 9px;border-radius:5px;background:#2a4a9a;color:#fff;text-decoration:none;font-weight:600;">📋 ดูทั้งหมด</a></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameB(s)}</div></div>
    <div class="frame"><div class="frame-hd fc-hd"><span class="ftag fc-tag">C</span><span style="color:#4a4a00;">กทท. ตอบอะไรไป / จุดแข็ง</span></div><div class="frame-bd"><div class="box box-gray" style="margin-bottom:6px;font-size:11px;">${exp((s.good||[''])[0]||'—',100)}</div><div style="font-size:9.5px;color:#888;margin:4px 0 2px;font-weight:600;">ผลที่นำเสนอ:</div>${rC}<div style="font-size:9.5px;color:#888;margin:6px 0 2px;font-weight:600;">ช่องว่างที่ยังขาด:</div>${lC}</div></div>
    <div class="frame"><div class="frame-hd fd-hd"><span class="ftag fd-tag">D</span><span style="color:#102848;">สิ่งที่ต้องดำเนินการปี 69</span></div><div class="frame-bd">${dD||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame" style="border-bottom:none;"><div class="frame-hd fe-hd"><span class="ftag fe-tag">E</span><span style="color:#0a4030;">Self-Assessment Script — ร่างคำตอบระบบ สคร.</span></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameE(s)}</div></div>`;
}

// ── renderLeft ───────────────────────────────────────────────────────
function renderLeft(){
  const body=document.getElementById('leftBody');body.innerHTML='';
  document.getElementById('dimTitle').textContent=DATA.dt.dimName;
  document.getElementById('dimOrig').textContent='ปัจจุบัน '+fmt(DATA.dt.orig);
  document.getElementById('totalLbl').textContent='คะแนนรวม '+DATA.dt.dimId;
  document.getElementById('totalOrig').textContent=fmt(DATA.dt.orig);
  const grps=[...new Set(DATA.dt.subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=DATA.dt.subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.dt[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const assessed=ss.filter(s=>dtCalcRaw(s.id)>0).length;
    const tot=ss.length;const fillPct=Math.round(gs/5*100);
    const fillCol=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';
    const chkCls=assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none';
    const chkLbl=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;
    const gDiv=document.createElement('div');gDiv.className='grp';
    gDiv.innerHTML=`<div class="grp-row1"><span class="grp-id">${gid}</span><span class="grp-name">${first.gname}</span><span class="grp-wt">(${first.gw}%)</span><div class="grp-scores"><span class="chip cn" style="font-size:10px;">${fmt(first.gs68)}</span><span style="color:#999;font-size:10px;">→</span><span class="chip ${diff<-0.001?'cr':diff>0.001?'ct':'cn'}" style="font-size:10px;" id="gs-cg-${gid}">${fmt(gs)}</span></div></div><div class="grp-row2"><span class="grp-chk ${chkCls}" id="rollup-chk-${gid}">${chkLbl}</span><span class="grp-score2"><strong id="rollup-gs-${gid}" style="color:${diff>0.001?'#ea580c':diff<-0.001?'#c03020':'#555'};">${gs.toFixed(4)}</strong><span id="rollup-delta-${gid}" style="font-size:9px;color:${diff>0.001?'#ea580c':diff<-0.001?'#c03020':'#aaa'};">(${diff>=0?'+':''}${diff.toFixed(4)})</span></span><div class="grp-prog"><div class="grp-prog-fill" id="rollup-bar-${gid}" style="width:${fillPct}%;background:${fillCol};"></div></div></div>`;
    body.appendChild(gDiv);
    ss.forEach(s=>{
      const row=document.createElement('div');row.className='sub'+(focusId===s.id?' focus-cg':'');row.id='subrow-'+s.id;
      row.innerHTML=`<div class="sub-left"><div class="sub-meta"><span class="sub-num">${s.id}</span><span class="sub-name">${s.name}</span><span class="sub-wt">(${s.w}%)</span><span class="sub-now">ปี 68: ${fmt(s.s68)}</span></div></div><div class="sub-target" id="st-${s.id}"><span class="target-lbl">คำนวณ</span><input class="target-inp" id="ti-${s.id}" type="text" value="${fmt(targets.dt[s.id])}" readonly style="border-color:#ccc;"><span class="dot ${dotColor(s)}" id="dot-${s.id}"></span></div>`;
      row.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(row);
      const strip=document.createElement('div');strip.className='sstrip';
      strip.innerHTML=`<span class="sbadge ${sClass(s.status)}">${sIcon(s.status)} ${s.status}</span><span style="font-size:10px;color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px;">${s.statusNote||'ยังไม่มีข้อมูล'}</span>`;
      strip.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(strip);
    });
  });
}

// ── renderChecklist ──────────────────────────────────────────────────
function renderChecklist(){
  if(!focusId){document.getElementById('clTitle').textContent='เลือก sub-item เพื่อดู Action Checklist';document.getElementById('clItems').innerHTML='';return;}
  const s=DATA.dt.subs.find(x=>x.id===focusId);if(!s)return;
  document.getElementById('clTitle').textContent=`Action Checklist — ข้อ ${s.id} · ปัจจุบัน ${fmt(targets.dt[s.id])}`;
  if(!clChecked[s.id])clChecked[s.id]=(s.actions||[]).map(()=>false);
  document.getElementById('clItems').innerHTML=(s.actions||[]).map((a,i)=>{
    const chk=clChecked[s.id][i];
    const sty=chk?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
    return `<div class="cl-item" id="clrow-${s.id}-${i}" style="${sty}"><input type="checkbox" id="cl-${s.id}-${i}" ${chk?'checked':''} onchange="toggleCL('${s.id}',${i},this.checked)"><label for="cl-${s.id}-${i}" style="flex:1;"><span id="cls-${s.id}-${i}" class="cl-short" style="-webkit-line-clamp:2;">${a}</span><span id="clb-${s.id}-${i}" class="cl-exp-btn" onclick="event.preventDefault();clExpand('${s.id}',${i})">อ่านเพิ่ม ▼</span></label></div>`;
  }).join('');
}
function toggleCL(id,i,val){
  if(!clChecked[id])clChecked[id]=[];clChecked[id][i]=val;save();
  const r=document.getElementById('clrow-'+id+'-'+i);if(!r)return;
  r.style.cssText=val?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
}

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.dt.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*dtCalcRaw(s.id),0);
  const delta=total-DATA.dt.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.dt[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#ea580c':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#ea580c':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>dtCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
loadState();
renderAll();
syncHomeStatus();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
</script>
