ุมคณะกรรมการ CMC ที่แสดงให้เห็นการพิจารณาวาระ การติดตาม และแก้ปัญหาการจัดการสายอาชีพ"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างแผนจัดการสายอาชีพ กับ แผนยุทธศาสตร์องค์กร, แผนอัตรากำลัง, แผนสืบทอดตำแหน่ง, ระบบประเมินผล และการสร้างประสบการณ์ที่ดีของบุคลากร (EX)"],"5":["ตารางสรุปการนำข้อมูลป้อนกลับ (Feedback Table) มาทบทวนและปรับปรุงกระบวนการสายอาชีพ","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการประเมินประสิทธิผลการทำหน้าที่ของคณะกรรมการจัดการสายอาชีพ (CMC)","[สิ่งที่ต้องเพิ่มในปี 69] ตาราง Before & After แสดงผลลัพธ์ของ Job Rotation ที่ส่งผลต่อ Career Path อย่างเป็นรูปธรรม"]},subComps:{"1":["Job Rotation ต้องวัดผลกระทบ (Impact) ต่อความก้าวหน้า (Level 1): การหมุนเวียนงานไม่ได้จบแค่การสลับตำแหน่ง แต่ TRIS ระบุชัดเจนว่า ต้องมีการ \"ติดตามผลและประเมินประสิทธิผลของการหมุนเวียนงาน (Job Rotation) ให้เกิดผลต่อ Career Path จริง\" หมายความว่า ต้องมีข้อมูลยืนยันว่าพนักงานที่ถูกหมุนเวียนงาน มีการพัฒนาทักษะ (Multi-skill) ได้เติบโตขึ้น และมีความก้าวหน้าตามสายอาชีพ","เปลี่ยนวิธีการนำเสนอจาก \"งานธุรการ\" สู่ \"ผลกระทบเชิงระบบ (Systemic Impact)\" (Level 1): ในปี 68 กทท. นำเสนอเรื่องการแก้ไขคุณสมบัติของตำแหน่งงาน (Job Specification) โดยยกตัวอย่างการตัดคำว่า \"ว่ายน้ำเป็น\" ออก หรือการเพิ่มคุณวุฒิรายตำแหน่ง ซึ่งดูเป็นงาน Routine ระดับปฏิบัติการมากเกินไป ในปี 69 ควรเขียนสรุปในเชิงกลยุทธ์ เช่น \"การปลดล็อกข้อจำกัดทางเพศ (จากชายล้วนเป็นไม่จำกัดเพศ) ส่งผลให้พนักงานมีโอกาสเติบโตในเส้นทางอาชีพและส่งเสริมความเสมอภาค (DEI&B) ในภาพรวมองค์กร\" เป็นต้น"],"2":["ตั้งกรรมการ CMC แล้วต้อง \"ประเมินผลกรรมการ\" ด้วย (Level 2): กทท. มีคณะกรรมการ กนบ. ทำหน้าที่ดูแลเรื่อง CMC แล้ว แต่ผู้ตรวจให้ Feedback ว่า \"ควรมีการประเมินประสิทธิผลของการทำหน้าที่ของคณะกรรมการฯ ชุดดังกล่าว และทบทวนบทบาท\" เพื่อให้การบริหารจัดการสายอาชีพเกิดขึ้นอย่างเป็นระบบและเป็นรูปธรรม","กลุ่มที่ปรึกษาสายอาชีพ (Career Counselor) (Level 2): ผู้ตรวจให้ความสำคัญกับกลุ่มนี้มาก โดยระบุในคู่มือว่าองค์กรควรมีที่ปรึกษาสายอาชีพ (อาจเป็นบุคลากร HR ร่วมกับหัวหน้างาน) คอยให้คำแนะนำพนักงานเรื่องการวางแผนเติบโต ซึ่งกลุ่มที่ปรึกษาเหล่านี้ต้องได้รับการพัฒนาทักษะอย่างสม่ำเสมอด้วย"],"3":["Job Rotation ต้องวัดผลกระทบ (Impact) ต่อความก้าวหน้า (Level 3): การหมุนเวียนงานไม่ได้จบแค่การสลับตำแหน่ง แต่ TRIS ระบุชัดเจนว่า ต้องมีการ \"ติดตามผลและประเมินประสิทธิผลของการหมุนเวียนงาน (Job Rotation) ให้เกิดผลต่อ Career Path จริง\" หมายความว่า ต้องมีข้อมูลยืนยันว่าพนักงานที่ถูกหมุนเวียนงาน มีการพัฒนาทักษะ (Multi-skill) ได้เติบโตขึ้น และมีความก้าวหน้าตามสายอาชีพ"],"5":["ตั้งกรรมการ CMC แล้วต้อง \"ประเมินผลกรรมการ\" ด้วย (Level 5): กทท. มีคณะกรรมการ กนบ. ทำหน้าที่ดูแลเรื่อง CMC แล้ว แต่ผู้ตรวจให้ Feedback ว่า \"ควรมีการประเมินประสิทธิผลของการทำหน้าที่ของคณะกรรมการฯ ชุดดังกล่าว และทบทวนบทบาท\" เพื่อให้การบริหารจัดการสายอาชีพเกิดขึ้นอย่างเป็นระบบและเป็นรูปธรรม","เปลี่ยนวิธีการนำเสนอจาก \"งานธุรการ\" สู่ \"ผลกระทบเชิงระบบ (Systemic Impact)\" (Level 5): ในปี 68 กทท. นำเสนอเรื่องการแก้ไขคุณสมบัติของตำแหน่งงาน (Job Specification) โดยยกตัวอย่างการตัดคำว่า \"ว่ายน้ำเป็น\" ออก หรือการเพิ่มคุณวุฒิรายตำแหน่ง ซึ่งดูเป็นงาน Routine ระดับปฏิบัติการมากเกินไป ในปี 69 ควรเขียนสรุปในเชิงกลยุทธ์ เช่น \"การปลดล็อกข้อจำกัดทางเพศ (จากชายล้วนเป็นไม่จำกัดเพศ) ส่งผลให้พนักงานมีโอกาสเติบโตในเส้นทางอาชีพและส่งเสริมความเสมอภาค (DEI&B) ในภาพรวมองค์กร\" เป็นต้น"]}},
  {id:"4.1",grp:"4",gname:"กลไกที่สนับสนุนการบริหารและพัฒนาทุนมนุษย์",gw:20.0,gs68:3.17,name:"การสร้างประสบการณ์ที่ดีฯ / ค่านิยม / การเปลี่ยนแปลง",w:5.0,s68:3.15,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมินการสร้างสภาพแวดล้อมที่สนับสนุนบุคลากรอย่างรอบด้าน ประกอบด้วย 5 มิติหลัก ได้แก่ 1) ความผูกพันองค์กร (Engagement) 2) การสร้างประสบการณ์พนักงาน (Employee Experience) ตั้งแต่เริ่มงานจนถึงเกษียณอายุ 3) ค่านิยมองค์กร (Core Value) ที่ส่งเสริมความหลากหลาย (DEI&B) 4) การจัดการการเปลี่ยนแปลง (Change Management) อย่างเป็นระบบ และ 5) การสื่อสารภายในองค์กร (Internal Communication) ที่ออกแบบสารให้เหมาะสมกับพฤติกรรมของบุคลากรแต่ละกลุ่ม",levelSumm:["มีแนวทางในการสร้างสภาพแวดล้อมที่สนับสนุนการบริหารและพัฒนาทุนมนุษย์ ได้แก่ ความผูกพันองค์กร ค่านิยมองค์กร และการจัดการการเปลี่ยนแปลง","สภาพแวดล้อมมีลักษณะครอบคลุม 5 ด้าน คือ 1. ทราบระดับ/ปัจจัยความผูกพัน 2. สร้าง EX ตลอด Employee Journey 3. เสริมสร้างค่านิยมที่สะท้อน DEI&B และมุ่งเน้นคุณภาพ 4. จัดการการเปลี่ยนแปลงอย่างเป็นระบบ 5. สื่อสารภายในอย่างเหมาะสมตามกลุ่มผู้รับสาร","การดำเนินงานตามแผนงานประจำปีครบถ้วน โดยมีกลไก/กระบวนการติดตามและประเมินผลที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แผนงานมีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนงาน/ระบบงานที่สำคัญ เช่น ระบบการเรียนรู้ แผนสร้างความผูกพัน ระบบธรรมาภิบาล (CG) เป็นต้น","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่นๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ และมุ่งเน้นการพัฒนาอย่างต่อเนื่อง"],good:["กทท. ทำคะแนนยืนพื้นผ่านระดับ 3 ได้อย่างสวยงาม เพราะมีกระบวนการครบทุกมิติ (Engagement, EX, Core Value, Change Management) และมีตัวเลขผลสำรวจความผูกพันที่สูงมากเป็นตัวการันตีผลลัพธ์ (Outcome) ขั้นต้น นอกจากนี้การนำเครื่องมือสากลมาใช้บริหารการเปลี่ยนแปลงถือเป็นการวางระบบ (Process) ที่แข็งแกร่ง ผู้ประเมินจึงให้คะแนนจำลองไว้สูงถึง 3.1500","คะแนน 3.1500 ถือเป็นคะแนนที่สูงและเหมาะสมแล้วครับ กทท. มีความโดดเด่นมากในด้านทฤษฎีและการทำแผน (มี Framework ครบถ้วน)"],gaps:["ในระดับปฏิบัติการ (Implementation) ผู้ประเมินยังต้องการเห็น \"ความเฉพาะเจาะจง (Personalization)\" มากขึ้น ทั้งในการวิเคราะห์พนักงานเป็นรายกลุ่ม (Persona) และการระบุพฤติกรรมความหลากหลาย (DEI&B) ลงไปในคู่มือการทำงานจริงๆ"],results:["การสร้างความผูกพัน (Engagement) : ผลสำรวจความผูกพันของพนักงานสูงถึง 97.0% และความพึงพอใจ 94.1% และมีการนำผลมาทำแผนพัฒนาระดับความพึงพอใจครอบคลุม 19 ฝ่าย/สำนัก","การสร้างประสบการณ์ (EX) : มีการออกแบบเส้นทางการให้บริการตลอดช่วงชีวิตของพนักงาน (PAT Employee Journey) ครอบคลุม 5 Touch points ตั้งแต่รับสมัครงานจนถึงออกจากองค์กร (Retire)","ค่านิยมและวัฒนธรรม (Core Value) : เปิดตัวค่านิยมใหม่ \"SMART PAT\" มีการตั้ง Role Model จัดทำคู่มือพฤติกรรมพึงประสงค์ (Do/Don't) และมีการระบุถึงการส่งเสริมความหลากหลายและเสมอภาค (DEI&B) เช่น เรื่องสมรสเท่าเทียม","การจัดการการเปลี่ยนแปลง (Change Management) : มีการใช้โมเดลระดับโลกอย่าง Kotter’s 8 Steps และ McKinsey 7S Framework ในการจัดทำแผน People Transformation อย่างเป็นระบบ"],tris:["การออกแบบ Employee Experience (EX) ยังขาดการวิเคราะห์ Persona เชิงลึก : กทท. มีการแบ่ง 5 Touch points ตามช่วงชีวิตการทำงาน (Life Cycle) แล้ว แต่ผู้ประเมินมองว่า กทท. ต้องวิเคราะห์ลงลึกไปถึง \"บุคลิกลักษณะ (Persona)\" ของพนักงานแต่ละกลุ่มด้วย เพื่อให้สามารถออกแบบกิจกรรมประสบการณ์ที่แตกต่างกันตามความเหมาะสม (Personalization) ไม่ใช่จัดกิจกรรมเดียวแล้วให้ทุกคนเข้าร่วมเหมือนกันหมด","พฤติกรรมพึงประสงค์ยังไม่สะท้อน DEI&B อย่างแท้จริง : แม้ กทท. จะมีการอ้างถึงเรื่อง DEI&B (ความหลากหลาย ความเสมอภาค การมีส่วนร่วม) เช่น การให้สิทธิสมรสเท่าเทียม แต่ผู้ประเมินระบุว่า ในคู่มือ \"พฤติกรรมที่พึงประสงค์\" ของค่านิยมองค์กร ยังไม่ได้มีการเขียนระบุพฤติกรรมที่สะท้อนเรื่อง DEI&B ให้เห็นภาพชัดเจนว่าพนักงานต้องปฏิบัติตัวอย่างไร","การบริหารการเปลี่ยนแปลง (Change Management) ยังขาดความเชื่อมโยงกับระบบประเมินผล : จากเอกสารตาราง Roadmap การที่จะทำให้การเปลี่ยนแปลงหรือค่านิยมใหม่เกิดขึ้นได้จริง ต้องมีการผูกนโยบายการทำงาน (เช่น นโยบาย Hybrid Work หรือ พฤติกรรมใหม่ๆ) เข้ากับระบบประเมินผลการปฏิบัติงาน (PMS) อย่างเป็นรูปธรรม"],suggest:["ทำ Persona Analysis: แบ่งกลุ่มพนักงาน (เช่น พนักงาน Gen Z ที่เพิ่งจบใหม่ vs พนักงาน Gen X ที่เตรียมเกษียณ) และออกแบบ EX ที่ตอบโจทย์คน 2 กลุ่มนี้ให้เห็นความแตกต่างชัดเจน","ทบทวนคู่มือ Do/Don't: ปรับปรุงคู่มือพฤติกรรมค่านิยม SMART PAT โดยเพิ่มหัวข้อพฤติกรรมเชิง DEI&B ลงไปให้ชัดเจน เช่น \"พฤติกรรมที่พึงประสงค์: เคารพความคิดเห็นของเพื่อนร่วมงานทุกเพศทุกวัยอย่างเท่าเทียมกัน\"","นำพฤติกรรมไปผูกกับ KPI: ให้มีการประเมินพฤติกรรมเหล่านี้เป็นส่วนหนึ่งของการประเมินผลงาน (PMS) ประจำปี"],docs:["รายงานวิเคราะห์กลุ่มบุคคล (Persona Analysis Report): เอกสารการวิเคราะห์ลักษณะบุคคลเชิงลึกของพนักงานแต่ละกลุ่ม เพื่อออกแบบการดูแล (Employee Experience) ตั้งแต่ก่อนเข้าทำงานจนถึงหลังเกษียณให้ตอบโจทย์ Life Journey","คู่มือพฤติกรรมองค์กร (Do/Don't) ฉบับอัปเดต: เอกสารคู่มือที่เพิ่มการระบุพฤติกรรมที่สะท้อนถึงหลักการความหลากหลายและความเสมอภาค (DEI&B) อย่างชัดเจน","หลักฐานการเชื่อมโยงนโยบายลงใน PMS: เช่น การนำนโยบาย Hybrid Work หรือพฤติกรรมค่านิยมใหม่ ไประบุเป็นส่วนหนึ่งของระบบการประเมินผลงาน"],bestprac:["สร้างประสบการณ์พนักงานตลอดช่วงชีวิตการทำงาน (Full Employee Life Cycle): รฟม. และ กทพ. มีการนำปัจจัยความผูกพันมาวิเคราะห์เพื่อออกแบบและสร้างประสบการณ์ที่ดีให้แก่บุคลากร โดยทำให้ครอบคลุม \"ตลอดช่วงชีวิตการทำงานอย่างแท้จริง\" (Employee Journey) และเชื่อมโยงเป้าหมายเหล่านี้เข้ากับยุทธศาสตร์การบริหารทุนมนุษย์ระดับองค์กรอย่างเป็นระบบ","การจัดการการเปลี่ยนแปลงที่เชื่อมโยงกับแผนยุทธศาสตร์องค์กร: มีแนวทางการจัดการการเปลี่ยนแปลง (Change Management) ที่ชัดเจน และสื่อสารเรื่องสำคัญให้บุคลากรทราบ โดยบูรณาการเชื่อมโยงกับการเสริมสร้างความผูกพันและค่านิยมองค์กร เพื่อให้บุคลากรสามารถปรับตัวต่อการเปลี่ยนแปลงต่างๆ ที่จะเกิดขึ้น (Changing Capability)"],minReqs:{"1":["นโยบาย/คู่มือ/แผนงานด้านการสร้างความผูกพันองค์กร ค่านิยมองค์กร และการจัดการการเปลี่ยนแปลง"],"2":["รายงานการวิเคราะห์ปัจจัยความผูกพันองค์กร","แผนการสร้างประสบการณ์ที่ดีของบุคลากรตลอดช่วงชีวิตการทำงาน (Employee Journey) ที่ครอบคลุมทุกจุดสัมผัส (Touchpoints)","คู่มือค่านิยมองค์กร (Core Value) ที่ระบุพฤติกรรมพึงประสงค์ และ [สิ่งที่ต้องเพิ่มในปี 69] ต้องมีการระบุหรือสอดแทรกหลักการ DEI&B อย่างชัดเจน","แผนบริหารการเปลี่ยนแปลง (Change Management Plan) และแผนการสื่อสารภายในองค์กร"],"3":["รายงานผลการดำเนินงานตามแผนงานประจำปี และสถิติผลลัพธ์ (เช่น คะแนนความผูกพันองค์กรประจำปี)","รายงานการประชุมคณะทำงาน หรือ กนบ. ที่มีการติดตามประเมินผลการดำเนินงานในด้านนี้"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างแผนงานการสร้างความผูกพัน/ค่านิยม/การเปลี่ยนแปลง กับแผนยุทธศาสตร์องค์กร และระบบงานอื่นๆ (เช่น แผนการเรียนรู้, ระบบธรรมาภิบาล)"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) เพื่อนำมาปรับปรุงกระบวนการ","[สิ่งที่ต้องเพิ่มในปี 69] รายงานผลการวิเคราะห์ \"Persona ของพนักงานเชิงลึก\" เพื่อนำมาปรับปรุงแผนประสบการณ์พนักงาน (EX) แบบเจาะจงกลุ่มเป้าหมาย"]},subComps:{"2":["จุดตายเรื่อง Persona ในการทำ EX (Level 2): กทท. มีการทำเส้นทาง Employee Journey แล้ว แต่ TRIS วิจารณ์ใน Feedback Report ว่า \"ยังขาดการวิเคราะห์ Persona ของพนักงานอย่างลึกซึ้ง\" ดังนั้น กทท. ต้องวิเคราะห์พฤติกรรมพนักงาน (เช่น แบ่งตาม Gen Z, Gen Y) เพื่อหาว่าแต่ละกลุ่มชอบสวัสดิการหรือประสบการณ์แบบไหน แล้วนำไปออกแบบกิจกรรมให้ตรงใ","ค่านิยมองค์กร ต้องพ่วงเรื่อง DEI&B (Level 2): ผู้ตรวจระบุว่าพฤติกรรมพึงประสงค์ (SMART PAT) ของ กทท. ยังไม่สะท้อนภาพเรื่อง DEI&B (ความหลากหลาย ความเสมอภาค และการหลอมรวม) อย่างชัดเจน ทีม HR ต้องนำเรื่องนี้ไปแทรกไว้ในคู่มือหรือนโยบายค่านิยมองค์กร","Change Management ต้องมีรูปแบบชัดเจนและมุ่งเน้นที่คน (Level 2): ในยุคที่ กทท. ทำ People Transformation และ Smart Port การบริหารการเปลี่ยนแปลงต้องไม่จบแค่การ \"ประกาศแจ้งให้ทราบ\" แต่ต้องมีเครื่องมือที่เป็นระบบ และมุ่งเป้าไปที่การพัฒนา \"ความสามารถในการปรับตัว (Changing Capability)\" ของพนักงาน เพื่อลดแรงต้าน"],"5":["จุดตายเรื่อง Persona ในการทำ EX (Level 5): กทท. มีการทำเส้นทาง Employee Journey แล้ว แต่ TRIS วิจารณ์ใน Feedback Report ว่า \"ยังขาดการวิเคราะห์ Persona ของพนักงานอย่างลึกซึ้ง\" ดังนั้น กทท. ต้องวิเคราะห์พฤติกรรมพนักงาน (เช่น แบ่งตาม Gen Z, Gen Y) เพื่อหาว่าแต่ละกลุ่มชอบสวัสดิการหรือประสบการณ์แบบไหน แล้วนำไปออกแบบกิจกรรมให้ตรงใ"]}},
  {id:"4.2",grp:"4",gname:"กลไกที่สนับสนุนการบริหารและพัฒนาทุนมนุษย์",gw:20.0,gs68:3.17,name:"เทคโนโลยีดิจิทัลด้าน HR",w:3.0,s68:3.15,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"การประยุกต์ใช้เทคโนโลยีดิจิทัลในการบริหารทรัพยากรบุคคล\" ครอบคลุมตั้งแต่การมีระบบฐานข้อมูล (Database) ที่สมบูรณ์แบบและเชื่อมโยงกัน การพัฒนาแอปพลิเคชัน/เครื่องมืออำนวยความสะดวกให้พนักงาน การนำข้อมูลเชิงลึกมาวิเคราะห์และพยากรณ์อนาคต (HR Analytics) เพื่อสนับสนุนการตัดสินใจของผู้บริหารทุกระดับ รวมถึงการบูรณาการระบบดิจิทัลด้าน HR เข้ากับยุทธศาสตร์ขององค์กรและคำนึงถึงความปลอดภัยของข้อมูลส่วนบุคคล (Data Privacy)",levelSumm:["มีระบบฐานข้อมูลด้าน HR ของบุคลากรและของสายงานที่ครบถ้วน และมีการพัฒนาเครื่องมือ/Platform/Application/ระบบเทคโนโลยีดิจิทัล เพื่อเพิ่มประสิทธิภาพในงานด้าน HR และอำนวยความสะดวก","การนำข้อมูลมาใช้ในการวิเคราะห์และคาดการณ์ (HR Analysis & Analytics) เพื่อการตัดสินใจในงานด้านต่าง ๆ ได้แก่ งานด้านธุรการ งานด้านกระบวนการภายใน และงานด้านวางแผนกลยุทธ์","การนำระบบเทคโนโลยีดิจิทัลด้าน HR มาใช้ได้อย่างครอบคลุมทั่วทั้งองค์กร โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","ระบบเทคโนโลยีดิจิทัลด้าน HR มีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนงาน/ระบบงานที่สำคัญ เช่น ระบบการเรียนรู้และการพัฒนา เป็นต้น","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้การทำงานเกิดประสิทธิภาพสูงสุด"],good:["กทท. ทำได้ดีเยี่ยมในการวาง \"โครงสร้างพื้นฐานด้าน IT สำหรับ HR\" ทั้งการมีระบบ HRIS การนำ Chatbot มาให้บริการพนักงาน และการใช้แพลตฟอร์ม e-learning ซึ่งอำนวยความสะดวกและลดงานธุรการ (Admin) ได้จริง ทำให้ผู้ประเมินให้คะแนนผ่านระดับ 3 มาอยู่ที่ 3.1500 ถือว่าสอบผ่านในแง่ของการมีเครื่องมือ (Tools)"],gaps:["แต่การนำไปใช้ประโยชน์เชิงกลยุทธ์ (Data-Driven Decision) และการรักษาความปลอดภัยข้อมูล (Data Privacy) ยังไม่ถึงระดับ Best Practice\" ดังนั้น การประเมินตนเองที่ระดับ 5 จึงยังไม่สะท้อนผลลัพธ์เชิงประจักษ์ในมุมมองผู้ประเมิน"],results:["มีการใช้ระบบสารสนเทศเพื่อการบริหารทรัพยากรมนุษย์ (HRIS) แบบ Single Platform ที่ครอบคลุมข้อมูลประวัติส่วนบุคคล การประเมินผล และอัตรากำลัง มีการพัฒนา HR Line Chatbot \"น้อง Patty\" เพื่อตอบคำถามพนักงาน และใช้แพลตฟอร์มการเรียนรู้ FutureSkill และ PAT KM Portal (ผ่าน NotebookLM)","มีการติดตามความพึงพอใจการใช้งานระบบ HRIS ซึ่งได้คะแนนเฉลี่ยสูงถึง 3.81 คะแนนและมีการติดตามแผนพัฒนาระบบ HR Analytics","นำระบบเทคโนโลยีไปเชื่อมโยงกับแผนวิสาหกิจ แผนปฏิบัติการดิจิทัล (DT) และระบบการเรียนรู้และการพัฒนา","อ้างว่ามีการนำข้อเสนอแนะจาก Feedback Report, HR Trends และการเทียบเคียงกับคู่เทียบ (รฟม., กทพ., ธอส.) มาใช้พัฒนาระบบ HR Dashboard และออกแบบ AI เพื่อการตัดสินใจ"],tris:["มี Dashboard แต่ผู้บริหารยังไม่ได้ใช้ตัดสินใจจริง (Lack of Actual Strategic Utilization) : ผู้ตรวจระบุใน Feedback Report ชัดเจนว่า \"ควรมีแนวทางกระตุ้นให้ผู้บริหารระดับต่างๆ ได้ใช้รายงานด้าน HR อย่างสม่ำเสมอ เพื่อตัดสินใจเชิงกลยุทธ์\" ความหมายคือ กทท. มีหน้าจอ Dashboard ที่สวยงาม (Output) แต่ยังขาด \"หลักฐาน (Evidence)\" ที่พิสูจน์ว่าผู้บริหารระดับสายงานนำข้อมูลจาก Dashboard นี้ไปพิจารณาปรับปรุงแผนงานจริงๆ (Outcome)","ความปลอดภัยและชั้นความลับของข้อมูล (Data Privacy & Trust) : เป็นจุดตายสำคัญที่ TRIS ติติงคือ \"ควรมีการกำหนดความมั่นคงและความปลอดภัยของข้อมูลส่วนบุคคลอย่างเหมาะสม\" ข้อมูลในระบบ HRIS ยังขาดการจำกัดสิทธิ์การเข้าถึงข้อมูลที่อ่อนไหวอย่างเข้มงวด ทำให้ระบบยังมีช่องโหว่ด้านธรรมาภิบาลข้อมูล","บทบาทของ HR ในยุค AI (AI Governance) : กทท. ระบุว่ามีการนำ AI (เช่น Chatbot, NotebookLM) มาใช้ แต่ผู้ตรวจมองไปไกลกว่านั้น โดยระบุว่า HR ขององค์กรชั้นนำต้องเปลี่ยนบทบาทจาก \"ผู้ใช้ AI\" ไปเป็น \"ผู้ออกแบบและกำกับระบบ AI (AI Governance)\" ที่คอยดูแลจริยธรรมและการคุ้มครองความก้าวหน้าของพนักงาน"],suggest:["สร้างหลักฐานการใช้งานจริง (MoM Evidence): ให้ผู้บริหารระดับสายงาน (Line Manager) นำข้อมูลจาก HR Analytics Dashboard (เช่น สถิติโอที ข้อมูลทักษะ หรือแนวโน้มการเกษียณ) ไปใช้เป็นวาระหนึ่งในที่ประชุมประจำเดือนของฝ่าย และ \"บันทึกในรายงานการประชุม (MoM)\" ว่าได้มีการตัดสินใจปรับแผนงานจากข้อมูล HR นี้ ส่งให้ TRIS ดูเป็นหลักฐาน","จัดทำ Data Privacy Matrix (Quick Win): ทบทวนและออกประกาศการจำกัดสิทธิ์ผู้เข้าถึงข้อมูลส่วนบุคคลในระบบ HRIS ให้ชัดเจน (เช่น ใครดูเงินเดือนได้ ใครดูประวัติการลงโทษได้) เพื่อปิด Gap เรื่องความปลอดภัยของข้อมูล"],docs:["รายงานการประชุมของ Line Manager (Line Manager MoM): บันทึกการประชุมของหน่วยงานต่างๆ ที่เป็นหลักฐานว่า \"หัวหน้างานได้ใช้ข้อมูลจาก HR Dashboard (เช่น ข้อมูล Productivity, การคาดการณ์การลาออก) ไปใช้ประกอบการตัดสินใจวางแผนกำลังคนจริงๆ\"","เอกสาร/ประกาศกำหนดสิทธิ์ระดับชั้นความลับใน HRIS (Data Privacy Policy): หลักฐานการจัดการรัดกุมในการจำกัดสิทธิ์เข้าถึงข้อมูลส่วนบุคคลที่อ่อนไหว","เอกสารบทบาท AI Governance ของ HR: หลักฐานแสดงการเปลี่ยนบทบาท HR จากผู้ใช้ สู่การเป็นผู้ออกแบบและกำกับดูแล (AI Governance)"],bestprac:["นำ HR Analytics มาใช้เพื่อการ \"ตัดสินใจ\" เชิงลึก: รฟม. และ กทพ. ไม่ได้มีแค่ระบบฐานข้อมูลที่ครอบคลุม แต่มีการนำข้อมูลมาใช้วิเคราะห์เชิงลึก (HR Analysis / Analytics) เพื่อ \"ใช้ประกอบการตัดสินใจในงานด้านต่างๆ\" ของผู้บริหารระดับสายงานอย่างเป็นรูปธรรม","เชื่อมโยงระบบดิจิทัล HR กับระบบอื่นทั้งองค์กร: ระบบเทคโนโลยีดิจิทัลด้านบริหารทุนมนุษย์ของคู่เทียบ มีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กรและแผนงาน/ระบบงานที่สำคัญ (เช่น แผนปฏิบัติการดิจิทัล แผนแม่บทการจัดการความรู้ และแผนยุทธศาสตร์ด้านผู้มีส่วนได้ส่วนเสีย) ทำให้เกิดการใช้ประโยชน์จากข้อมูลข้ามสายงานได้อย่างบูรณาการ"],minReqs:{"1":["ระบบฐานข้อมูลด้าน HR ที่ครอบคลุมข้อมูลประวัติส่วนบุคคล ประวัติการทำงาน การฝึกอบรม สมรรถนะ การลงโทษทางวินัย และข้อมูลอัตรากำลัง","คู่มือหรือหลักฐานการพัฒนาเครื่องมือ/Platform ด้านดิจิทัลเพื่ออำนวยความสะดวก เช่น ระบบ HRIS, HR Line Chatbot (น้อง Patty), และระบบจัดการความรู้ (เช่น NotebookLM, KM Portal)"],"2":["รายงานผลการนำข้อมูลมาวิเคราะห์ (HR Analysis & Analytics) เพื่อใช้ประกอบการตัดสินใจใน 3 ด้าน ได้แก่ งานธุรการ, งานกระบวนการภายใน, และงานวางแผนกลยุทธ์","หน้าจอ (Screenshot) หรือรายงานจากระบบ HR Dashboard (Data Visualization/PowerBI) ที่ผู้บริหารสามารถนำไปใช้งานได้"],"3":["รายงานสถิติการเข้าใช้งานระบบเทคโนโลยีดิจิทัลด้าน HR ของพนักงาน (เช่น อัตราการเข้าใช้ระบบ HRIS)","รายงานสรุปผลสำรวจความพึงพอใจของพนักงานที่มีต่อการใช้งานระบบเทคโนโลยีดิจิทัลด้าน HR พร้อมการแก้ไขปัญหา"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างระบบเทคโนโลยีดิจิทัลด้าน HR กับแผนยุทธศาสตร์องค์กร แผนปฏิบัติการด้านดิจิทัล (DT) และระบบงานที่สำคัญ เช่น ระบบการเรียนรู้ (L&D Ecosystem / FutureSkill)"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) จากผู้ใช้งานเพื่อนำมาพัฒนาระบบ","[สิ่งที่ต้องเพิ่มในปี 69] หลักฐานเชิงประจักษ์ (เช่น คู่มือ/ประกาศ/รายงานการปรับปรุงระบบ) ในการจำกัดสิทธิ์การเข้าถึงข้อมูลส่วนบุคคลที่อ่อนไหว (Data Privacy & Trust)","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการประชุมที่แสดงให้เห็นว่าผู้บริหารระดับสายงาน (Line Manager) นำ HR Dashboard ไปใช้ตัดสินใจในการบริหารงานจริง"]},subComps:{"1":["จุดตายเรื่อง Data Privacy & Trust (Level 1): กทท. ถูกตั้งข้อสังเกตว่า ระบบ HR ในปัจจุบันมี \"สิทธิ์การเข้าถึงข้อมูลอ่อนไหวมากเกินไป\" ดังนั้นสิ่งที่ต้องทำด่วนในปี 69 คือ การไปกำหนดระดับชั้นการเข้าถึงข้อมูลส่วนบุคคล (จำกัดสิทธิ์ผู้ใช้งาน) ให้มีความเข้มงวดมากขึ้น เพื่อป้องกันข้อมูลส่วนบุคคลรั่วไหล และสร้างความน่าเชื่อถือให้กับระบบ"],"2":["มี Dashboard แต่ Line Manager ไม่ใช้ = ไม่ได้คะแนน (Level 2): กทท. มีการพัฒนา HR Dashboard ด้วย PowerBI (AWTD) แล้ว แต่ TRIS ให้ข้อสังเกตอย่างตรงไปตรงมาว่า \"ผู้บริหารระดับสายงานยังไม่ค่อยนำรายงาน HR Analytics ไปใช้ประกอบการตัดสินใจเชิงกลยุทธ์\" ดังนั้นในปี 69 ต้องมีหลักฐาน (เช่น รายงานการประชุมของฝ่ายต่างๆ) ที่ระบุว่าหัวหน้างานได้เปิด Dashboard นี้ดูสถิติ (เช่น ดูอัตราการลาออก, ข้อมูลการอบรม, หรือ Productivity) เพื่อใช้ประกอบการตัดสินใจในห้องประชุมจริง"],"3":["มี Dashboard แต่ Line Manager ไม่ใช้ = ไม่ได้คะแนน (Level 3): กทท. มีการพัฒนา HR Dashboard ด้วย PowerBI (AWTD) แล้ว แต่ TRIS ให้ข้อสังเกตอย่างตรงไปตรงมาว่า \"ผู้บริหารระดับสายงานยังไม่ค่อยนำรายงาน HR Analytics ไปใช้ประกอบการตัดสินใจเชิงกลยุทธ์\" ดังนั้นในปี 69 ต้องมีหลักฐาน (เช่น รายงานการประชุมของฝ่ายต่างๆ) ที่ระบุว่าหัวหน้างานได้เปิด Dashboard นี้ดูสถิติ (เช่น ดูอัตราการลาออก, ข้อมูลการอบรม, หรือ Productivity) เพื่อใช้ประกอบการตัดสินใจในห้องประชุมจริง"],"5":["จุดตายเรื่อง Data Privacy & Trust (Level 5): กทท. ถูกตั้งข้อสังเกตว่า ระบบ HR ในปัจจุบันมี \"สิทธิ์การเข้าถึงข้อมูลอ่อนไหวมากเกินไป\" ดังนั้นสิ่งที่ต้องทำด่วนในปี 69 คือ การไปกำหนดระดับชั้นการเข้าถึงข้อมูลส่วนบุคคล (จำกัดสิทธิ์ผู้ใช้งาน) ให้มีความเข้มงวดมากขึ้น เพื่อป้องกันข้อมูลส่วนบุคคลรั่วไหล และสร้างความน่าเชื่อถือให้กับระบบ","เปลี่ยนบทบาท HR เป็นผู้ออกแบบ AI Governance (Level 5): กทท. มีการนำ AI และเทคโนโลยีใหม่ๆ มาใช้ (เช่น Chatbot, NotebookLM) แต่ผู้ตรวจคาดหวังให้ กทท. ยกมิติไปอีกขั้น คือเปลี่ยนบทบาทบุคลากร HR จากแค่ \"ผู้ใช้งาน AI\" ให้กลายเป็น \"ผู้ออกแบบและกำกับดูแล (AI Governance)\" และการคุ้มครองข้อมูลส่วนบุคคลในกระบวนการทำงาน HR","เปรียบเทียบกับองค์กรชั้นนำ (Level 5): ในการพัฒนาระบบ HR Analytics กทท. ควรนำข้อมูลจากการศึกษาเทียบเคียงกับองค์กรที่ทำเรื่องนี้ได้ดี เช่น ธอส. (ที่มีโครงการ HR Digital Transformation) และ กทพ. มาใช้เป็นข้อมูลป้อนกลับในการพัฒนาระบบของตนเองให้ทัดเทียม"]}},
  {id:"4.3",grp:"4",gname:"กลไกที่สนับสนุนการบริหารและพัฒนาทุนมนุษย์",gw:20.0,gs68:3.17,name:"ความปลอดภัยและสภาพแวดล้อมในการทำงาน",w:2.0,s68:2.85,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"การบริหารจัดการด้านความปลอดภัย สวัสดิภาพ อาชีวอนามัย และสภาพแวดล้อมในการทำงาน (SSHE)\" อย่างเป็นระบบ โดยต้องมีแผนงาน มาตรฐาน และตัวชี้วัดที่เหมาะสมกับลักษณะงานที่แตกต่างกัน มุ่งเน้นการจัดกิจกรรมเพื่อสร้างความตระหนักและปรับเปลี่ยนพฤติกรรมให้เกิดเป็นวัฒนธรรมความปลอดภัย รวมถึงการบูรณาการด้านความปลอดภัยเข้ากับระบบบริหารความเสี่ยงและแผนความต่อเนื่องทางธุรกิจขององค์กร",levelSumm:["การจัดทำแผนงานด้านความปลอดภัย สวัสดิภาพ อาชีวอนามัย และสิ่งแวดล้อม (Safety Security Health and Environment) ทั้งระยะสั้นและระยะยาว โดยมีการกำหนดผู้รับผิดชอบที่ชัดเจน","แผนงานฯ มีองค์ประกอบ 3 ด้าน คือ 1) การทบทวนมาตรการ/กฎระเบียบ 2) การกำหนดมาตรฐานที่เหมาะสมกับบริบทการทำงาน และ 3) การสร้างความตระหนัก/จัดกิจกรรมปรับเปลี่ยนพฤติกรรม","การดำเนินงานตามแผนงานประจำปีที่ครบถ้วน โดยมีกลไก/กระบวนการติดตามและประเมินผลที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แผนงานด้านความปลอดภัยฯ มีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนงาน/ระบบงานที่สำคัญ เช่น แผนบริหารความเสี่ยง (RM) แผนการดำเนินธุรกิจอย่างต่อเนื่อง (BCP)","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน และข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ มุ่งเน้นการพัฒนาอย่างต่อเนื่อง"],good:["กทท. มีการดำเนินการในระดับ \"กระบวนการ\" ที่ค่อนข้างแข็งแกร่ง มีการตั้งคณะกรรมการ คปอ. ครอบคลุมพื้นที่ และมีกิจกรรมเชิงรุกในการดูแลสุขภาพจิต (Mental Health) ซึ่งตอบโจทย์เกณฑ์ระดับ 5 ในแง่ของการดูแลความเครียดพนักงาน ทำให้ กทท. ได้คะแนนเป็นฐานที่ 2.8500","การที่ กทท. ได้คะแนนเพียง 2.8500 ถือว่าสะท้อนมุมมองของ TRIS อย่างตรงไปตรงมา แม้ กทท. จะมีกิจกรรมที่ทันสมัยถึงระดับ 5 อย่างการทำ Aromatherapy บำบัดความเครียด"],gaps:["โครงสร้างพื้นฐานอย่าง \"การตั้งตัวชี้วัดให้ตรงกับลักษณะงานและแยกมิติ Safety กับ Security\" ยังทำได้ไม่สมบูรณ์ TRIS ก็จะยังไม่ให้คะแนนผ่านระดับ 3 (เป็นหลักการที่ว่าต้องทำฐานรากให้แน่นก่อนถึงจะไปยอดปิระมิดได้)"],results:["มีการจัดทำแผนความปลอดภัยฯ ระยะ 5 ปี (2567-2571) มีการแต่งตั้งคณะกรรมการความปลอดภัยฯ (คปอ.) ถึง 4 คณะ แบ่งตามพื้นที่ และมีการนำมาตรฐาน PSHE-MS มาใช้ และจัดกิจกรรมสร้างความตระหนัก เช่น KYT, Morning Talk, กิจกรรมมีนาใส่ใจ ปลอดภัยด้วยกัน","ดำเนินการตามแผนครบถ้วน มีการตรวจความปลอดภัยพื้นที่ปฏิบัติงานโดย จป. วิชาชีพ และจัดอบรมอย่างต่อเนื่อง","บูรณาการแผนความปลอดภัยเข้ากับแผนยุทธศาสตร์ (ผ่านการทำ ISPS Code) และผูกกับแผนบริหารความต่อเนื่องทางธุรกิจ (BCP) เช่น การรองรับกรณีเกิดโรคระบาดใหญ่ หรือการเข้าพื้นที่ไม่ได้","ใช้ข้อมูลป้อนกลับจากการศึกษาดูงาน (เช่น งานความปลอดภัยแห่งชาติ, นิทรรศการ \"สืบสร้างสุข\" ของ สสส.) มาจัดทำโครงการ Stop Stress go Strong (Aromatherapy) เพื่อดูแลสุขภาพจิต (Mental Health) ของพนักงาน"],tris:["ดัชนีและเป้าหมายยังไม่แตกต่างตามบริบทการทำงาน (Lack of Context-Specific KPIs) : ผู้ประเมินระบุชัดเจนว่า ลักษณะการทำงานของสำนักงานใหญ่ กับ ท่าเรือในภูมิภาค มีความเสี่ยงที่แตกต่างกันอย่างสิ้นเชิง แต่ กทท. ยังตั้งเป้าหมายแบบเหมารวม ผู้ตรวจจึงเสนอแนะว่าควรแยกดัชนีให้ชัดเจนตามบริบทพื้นที่","ตัวชี้วัดไม่ครอบคลุมและไม่แยก 4 มิติออกจากกันอย่างเด็ดขาด : ผู้ตรวจระบุว่า กทท. ต้องแยกการวัดผล 4 ด้าน (SSHE) ออกจากกัน โดยเฉพาะ สวัสดิภาพ ความปลอดภัย อาชีวอนามัยและสภาพแวดล้อม"],suggest:["ปรับแก้สมุดแผนงาน SSHE ใหม่: ในแผนปฏิบัติการปี 2569 ให้แยกตัวชี้วัด (KPIs) ออกเป็น 4 หมวดอย่างชัดเจน (Security, Safety, Health, Environment)","ตั้ง KPI แยกตามพื้นที่: แทนที่จะตั้ง KPI ว่า \"อุบัติเหตุเป็นศูนย์ทั้งองค์กร\" ให้เปลี่ยนเป็นตารางย่อยแยก KPI สำหรับ \"พื้นที่ท่าเรือ (Operation)\" และ \"พื้นที่สำนักงาน (Back-office)\" เพื่อแสดงให้ TRIS เห็นว่า กทท. มีการบริหารจัดการที่ตอบโจทย์บริบทความเสี่ยงที่แตกต่างกัน"],docs:["สมุดแผนงานและตาราง KPI ความปลอดภัยที่อัปเดตใหม่: เอกสารที่ตีตาราง \"แยกตัวชี้วัด\" ออกเป็น 4 มิติอย่างเด็ดขาด คือ ความปลอดภัย (Safety - อุบัติเหตุ), สวัสดิภาพ (Security - อาชญากรรม/CCTV), อาชีวอนามัย (Health), และสภาพแวดล้อม (Environment)","ตาราง KPI แยกตามบริบทพื้นที่: เอกสารการตั้งเป้าหมายที่แยกตัวเลขระหว่าง \"สำนักงานใหญ่\" กับ \"พื้นที่ท่าเรือปฏิบัติการ\" ให้แตกต่างกันตามบริบทความเสี่ยง"],bestprac:["จัดทำมาตรฐานความปลอดภัยที่เหมาะสมกับ \"บริบทองค์กรและพื้นที่\": มีการจัดทำแผนงานครอบคลุม 4 มิติอย่างชัดเจน ได้แก่ ความปลอดภัย (Safety), สวัสดิภาพ (Security), อาชีวอนามัย (Health), และสภาพแวดล้อม (Environment) โดยมีการแยกตัวชี้วัดและเป้าหมายที่ตอบโจทย์ความเสี่ยงในพื้นที่ที่แตกต่างกันอย่างเด็ดขาด (ซึ่งเป็นจุดที่ กทท. ถูกหักคะแนนเพราะตั้งเป้าหมายแบบเหมารวม)","มีแผนระยะสั้นและระยะยาวที่เชื่อมโยงยุทธศาสตร์: กำหนดผู้รับผิดชอบอย่างชัดเจน และสร้างมาตรฐานการทำงานที่เชื่อมโยงกับแผนยุทธศาสตร์องค์กร"],minReqs:{"1":["เล่มแผนงานด้านความปลอดภัย สวัสดิภาพ อาชีวอนามัย และสิ่งแวดล้อม (SSHE) ทั้งระยะสั้น (ประจำปี) และระยะยาว (5 ปี)","คำสั่งแต่งตั้งคณะกรรมการ/ผู้รับผิดชอบ (เช่น คปอ., จป.วิชาชีพ, จป.บริหาร) ที่ระบุขอบเขตงานชัดเจน"],"2":["รายงานการทบทวนกฎหมาย มาตรการ หรือข้อบังคับด้านความปลอดภัยให้เป็นปัจจุบัน","คู่มือ/มาตรฐานการทำงานด้าน SSHE ที่เหมาะสมกับ \"บริบทของแต่ละพื้นที่\" พร้อมตารางประเมินดัชนีเพื่อหาช่องว่าง","หลักฐานการจัดกิจกรรมสร้างความตระหนักรู้เพื่อปรับเปลี่ยนพฤติกรรม (เช่น ภาพถ่ายกิจกรรม KYT, Morning Talk, การซ้อมดับเพลิง)"],"3":["รายงานสรุปผลการดำเนินงานตามแผน SSHE ประจำปีที่บรรลุเป้าหมาย","รายงานสถิติอุบัติเหตุ/ความปลอดภัย (เช่น IFR, ISR) และรายงานการประชุมคณะกรรมการ คปอ. ที่มีการติดตามผลอย่างเป็นรูปธรรม"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างแผนงานด้านความปลอดภัยฯ กับแผนยุทธศาสตร์องค์กร","[สิ่งที่ต้องเพิ่มในปี 69] หลักฐานเชิงประจักษ์ในการทำงานร่วมกัน (Integration) กับ \"แผนบริหารความเสี่ยง (RM)\" และ \"แผนความต่อเนื่องทางธุรกิจ (BCP)\""],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) จากการดำเนินงาน และจากแหล่งภายนอก (เช่น กฎหมายใหม่, การศึกษาดูงาน)","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการปรับปรุงสภาพแวดล้อมหรือมาตรการความปลอดภัยที่เกิดจากการนำข้อมูลป้อนกลับมาใช้จริง (T-1 vs T+1)"]},subComps:{"1":["กทท. ถูกหักคะแนนเพราะมักรวมเรื่องสวัสดิภาพและความปลอดภัยไว้ด้วยกัน TRIS สั่งให้ แยกตัวชี้วัดอย่างเด็ดขาด ได้แก่ สวัสดิภาพ (Security): เน้นความมั่นคงปลอดภัยต่อชีวิตทรัพย์สินจากการกระทำของมนุษย์ (เช่น สถิติอาชญากรรมในพื้นที่, จำนวนกล้อง CCTV)/ความปลอดภัย (Safety): เน้นความปลอดภัยจากอุบัติเหตุการทำงาน (เช่น อัตราการเกิดอุบัติเหตุ IFR, ISR)/อาชีวอนามัย (Occupational Health): เน้นสุขภาพ (เช่น สัดส่วนพนักงานกลุ่มเสี่ยงที่ป่วยด้วยโรคจากการทำงาน)/สภาพแวดล้อม (Environment): เน้นกายภาพ (เช่น มาตรฐานแสงสว่าง ฝุ่น เสียง)"],"2":["ห้ามตั้งตัวชี้วัดเหมารวมทั้งองค์กร (Level 2): กทท. ต้องกำหนดดัชนีชี้วัดที่ \"แตกต่างกันตามบริบทการทำงาน\" เช่น พื้นที่สำนักงานใหญ่ (เน้น Office Syndrome) จะต้องมีตัวชี้วัดแยกต่างหากจาก พื้นที่ท่าเรือปฏิบัติการ (เน้นอุบัติเหตุเครื่องจักร/สารเคมี)"],"3":["การดูแล \"สุขภาพจิต (Mental Health)\" คือสิ่งที่ซ่อนอยู่ในเกณฑ์ (Level 1 & 2): ในคู่มือ SE-AM ระบุหมายเหตุไว้ชัดเจนว่า รัฐวิสาหกิจควรตระหนักถึง \"การดูแลสุขภาพจิตของบุคลากร\" (เช่น ลดความเครียด, มีผู้เชี่ยวชาญ/นักจิตวิทยาคอยให้คำปรึกษา) หาก กทท. จัดกิจกรรมด้านนี้ (เช่น กิจกรรม Stop Stress go Strong) ต้องดึงมาเป็นจุดเด่น (Highlight) ในการนำเสนอครับ"]}},
  {id:"4.4",grp:"4",gname:"กลไกที่สนับสนุนการบริหารและพัฒนาทุนมนุษย์",gw:20.0,gs68:3.17,name:"บทบาทของสายงาน HR",w:10.0,s68:3.25,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"ความเข้มแข็งของกลไกการบริหารทุนมนุษย์\" ผ่าน 2 แกนหลัก คือ 1) การที่ผู้บริหารระดับสูงทุกระดับให้การสนับสนุนทรัพยากรและเป็นผู้นำขับเคลื่อนงาน HR และ 2) การปรับเปลี่ยนบทบาทของทีมงาน HR เอง ให้เป็นคู่คิดเชิงกลยุทธ์ (HRBP) ได้รับการรับรองคุณวุฒิวิชาชีพ สร้างเครือข่ายภายนอก เข้าใจธุรกิจขององค์กร และมีระบบธรรมาภิบาล (HR Governance) ที่โปร่งใส รวมถึงมีกลไกตรวจสอบกระบวนการ (HR Audit) เชิงป้องกันก่อนเกิดความเสียหาย",levelSumm:["การสนับสนุนจากผู้บริหารทุกระดับ และการพัฒนา Line Manager/HR Coordinator ให้มีความรู้ทักษะด้าน HR","หน่วยงาน HR พัฒนาระบบ/ทีมงาน 5 ด้าน: 1) สร้างเครือข่ายภายนอก 2) บุคลากรได้รับคุณวุฒิวิชาชีพ 3) เข้าใจธุรกิจ (Business Acumen) 4) ปรับบทบาทเป็น HRBP/ที่ปรึกษาองค์กร และ 5) มีกระบวนการ HR Audit","การดำเนินงานตามแผนประจำปีครบถ้วน มีกลไกติดตามประเมินผลที่มีประสิทธิภาพ และบรรลุผลลัพธ์","การปรับบทบาท HR มีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนยุทธศาสตร์ด้าน HR","ใช้ข้อมูลป้อนกลับจากผลดำเนินงาน/แหล่งอื่น ปรับปรุงบทบาทของหน่วยงาน HR อย่างต่อเนื่อง"],good:["กทท. สอบผ่านกระบวนการทำงานพื้นฐานและการยกระดับบทบาท HR ได้อย่างยอดเยี่ยม โดยเฉพาะความพยายามในการสร้างทีม HRBP ที่ลงไปแก้ปัญหาหน้างานจริง และการสร้างเครือข่ายกับรัฐวิสาหกิจอื่น ทำให้ผู้ประเมินมองเห็นความตั้งใจในการปรับเปลี่ยนการทำงาน จึงให้คะแนนสูงถึง 3.2500 ซึ่งถือเป็นจุดแข็งของ กทท."],gaps:["ต้องยกระดับมาตรฐานเครื่องมือ (Audit) และคุณภาพคน (Certification) ให้เป็นสากลมากขึ้น\" การที่ กทท. ได้คะแนนดีในข้อนี้ ถือเป็นฐานที่แข็งแกร่งมากในการลุ้นคะแนนภาพรวมให้สูงขึ้นในปีหน้า"],results:["ผู้บริหารทุกระดับลงมาสนับสนุนงาน HR อย่างจริงจัง มีการสร้างเครือข่ายแลกเปลี่ยนความรู้ภายนอก (เช่น กลุ่ม กบร., กฟภ.) มีการปรับบทบาท HR ไปสู่การเป็นที่ปรึกษาเชิงรุก (HR Business Partner: HRBP) โดยจัดตั้งคณะทำงานและลงพื้นที่ให้คำปรึกษาหน่วยงานอื่น และมีการส่งพนักงาน HR 30 คน เข้าทดสอบคุณวุฒิวิชาชีพนักทรัพยากรบุคคล (TPQI)","ดำเนินงานตามแผนยกระดับ HRBP ได้ 100% มีการกำหนดแนวทางทำ HR Audit จำนวน 3 กระบวนการ (ประเมินผล, สืบทอดตำแหน่ง, ประสบการณ์พนักงาน) และสามารถผลักดันค่าผลผลิตประสิทธิภาพ (Productivity) ขององค์กรให้สูงขึ้นถึง 5.33 ล้านบาทต่อคน","มีการนำข้อมูลความพึงพอใจต่อการบริการของ HR (ได้ 3.76 คะแนน) และคำแนะนำจาก TRIS มาปรับเปลี่ยนการทำงานให้เป็นเชิงรุกมากขึ้น"],tris:["HR Audit ยังไม่เป็น \"เชิงป้องกัน (Preventive Approach) : กทท. มีการทำ HR Audit ก็จริง แต่ผู้ประเมินระบุชัดเจนว่าวิธีการสอบทานของ กทท. ยังมีลักษณะเหมือนการตรวจจับความผิดพลาดหลังเกิดเหตุ (เหมือน Internal Audit ทั่วไป) สิ่งที่เกณฑ์ SE-AM ต้องการคือ \"การสอบทานเชิงป้องกัน\" หมายถึงต้องเข้าไปตรวจสอบขั้นตอนที่เป็นจุดวิกฤต (Critical step) \"ก่อน\" ที่จะเกิดข้อผิดพลาดขึ้นในกระบวนการทำงานจริง","คุณวุฒิวิชาชีพของสายงาน HR ยังไม่ถึงระดับสากล (Lack of Global HR Certification) : กทท. ส่งพนักงานสอบคุณวุฒิวิชาชีพของ TPQI (สถาบันคุณวุฒิวิชาชีพของไทย) ซึ่งเป็นเรื่องที่ดี แต่ TRIS ชี้ว่า หาก กทท. มีวิสัยทัศน์ที่จะเป็น \"ท่าเรือชั้นนำระดับโลก\" บุคลากรสายงาน HR ก็ต้องถูกสนับสนุนให้ได้รับ \"คุณวุฒิวิชาชีพด้านทรัพยากรบุคคลที่เป็นระดับสากล\" (เช่น มาตรฐาน SHRM ของสหรัฐอเมริกา) เพื่อให้สอดรับกับวิสัยทัศน์ระดับโลกขององค์กร"],suggest:["เปลี่ยนรูปแบบ HR Audit (Quick Win - ระดับความยาก: ต่ำ): ในปี 2569 กทท. ไม่ต้องลงแรงอะไรเพิ่มมาก เพียงแค่ \"ปรับแก้เอกสารเกณฑ์และวิธีการทำ HR Audit\" ให้ระบุคำว่า \"สอบทานเชิงป้องกัน (Preventive Audit)\" ลงไปอย่างชัดเจน และเลือกตรวจสอบเฉพาะขั้นตอนก่อนการอนุมัติ (เช่น ตรวจสอบความถูกต้องของสเปกผู้สืบทอดตำแหน่งก่อนประกาศรายชื่อ) ก็จะปิด Gap นี้ได้ทันทีในเวลาเพียง 1-4 สัปดาห์","จัดทำ Roadmap คุณวุฒิสากล: แม้การสอบ SHRM จะยากและมีค่าใช้จ่าย แต่ กทท. สามารถเริ่มต้นได้ด้วยการ \"จัดทำแผนงบประมาณและ Roadmap ระยะ 3 ปี\" สำหรับการส่งผู้บริหาร HR ไปสอบคุณวุฒิสากล เพื่อแสดงเจตจำนงให้ TRIS เห็นว่าเรากำลังมุ่งสู่มาตรฐานโลกอย่างแท้จริงครับ"],docs:["คู่มือและเกณฑ์ HR Audit (ฉบับทบทวน): เอกสารที่ระบุกระบวนการตรวจสอบใหม่ โดยใช้คำว่า \"การสอบทานเชิงป้องกัน (Preventive Approach)\" ซึ่งมีขั้นตอนการตรวจจับข้อผิดพลาดก่อนที่จะอนุมัติหรือก่อนที่กระบวนการสำคัญจะเสร็จสิ้น (แทนที่การตรวจแบบ Internal Audit ตามปกติ)","แผนที่นำทาง (Roadmap) สู่ Global HR Certification: เอกสารแผนระยะสั้น-ยาว (รวมการตั้งงบประมาณ) เพื่อสนับสนุนให้พนักงาน HR ได้รับคุณวุฒิวิชาชีพที่เป็นระดับสากล เช่น SHRM เพื่อสะท้อนวิสัยทัศน์ท่าเรือระดับโลก"],bestprac:["บุคลากร HR มี \"คุณวุฒิวิชาชีพ\" ที่หลากหลายและตรงสายงาน: รฟม. มีการผลักดันให้บุคลากรของหน่วยงาน HR ได้รับคุณวุฒิวิชาชีพอย่างเป็นรูปธรรม โดยครอบคลุมความเชี่ยวชาญเฉพาะด้านต่างๆ เช่น ด้านพนักงานสัมพันธ์ ด้านสรรหาและคัดเลือก ด้านบริหารความก้าวหน้าในสายอาชีพ ด้านบริหารผลงาน และด้านบริหารค่าตอบแทน (ไม่ใช่วุฒิบัตรแบบกว้างๆ เพียงอย่างเดียว)","ปรับบทบาท HR เป็น \"ที่ปรึกษาเชิงรุก (Internal Consultant)\" เต็มรูปแบบ: มีการจัดทำแผนปรับบทบาทการดำเนินงานของ HR ในการเป็น \"หุ้นส่วนทางธุรกิจ (Strategic Partner)\" ของสายงานต่างๆ ภายในองค์กรอย่างชัดเจน โดยมีการพัฒนาความรู้และทักษะให้กับผู้บริหารระดับสายงาน (Line Manager) และผู้แทนสายงาน (HR Coordinator) ควบคู่ไปด้วย","มีการสอบทานกระบวนการ HR (HR Audit) อย่างเป็นระบบ: มีการกำหนดแนวทางและดำเนินการสอบทานกระบวนการที่สำคัญด้านทรัพยากรบุคคลที่เป็นไปตามมาตรฐานสากล"],minReqs:{"1":["หลักฐานภาพถ่าย/รายงานที่แสดงว่าผู้บริหารระดับสูงมีส่วนร่วม/สนับสนุนงานด้าน HR","รายงาน/หลักฐานการจัดอบรมพัฒนาความรู้ด้าน HR ให้กับผู้บริหารสายงาน (Line Manager) และผู้แทนสายงาน (HR Coordinator) เช่น การสอนจัดทำ KPI หรือ Skill Matching"],"2":["รายงานผลการเข้าร่วมและแลกเปลี่ยนข้อมูลกับเครือข่ายภายนอก (เช่น กบร., กฟภ., เครือข่ายรัฐวิสาหกิจ","[สิ่งที่ต้องเพิ่มในปี 69] แผนที่นำทาง (Roadmap) และหลักฐานการผลักดันบุคลากร HR ให้สอบ \"คุณวุฒิวิชาชีพด้าน HR ระดับสากล (Global HR Certification เช่น SHRM)\"","คำสั่งแต่งตั้งและรายงานผลการดำเนินงานเชิงรุกของทีม HRBP (HR Business Partner) แบบข้ามสายงาน","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการสอบทานกระบวนการ HR (HR Audit) ที่พิสูจน์ได้ว่าเป็น \"การสอบทานเชิงป้องกัน (Preventive Approach)\""],"3":["รายงานผลการดำเนินงานตามแผนยุทธศาสตร์ HR ที่ครบถ้วน บรรลุตามเป้าหมาย (KPIs)","รายงานการติดตามและประเมินผลผ่านคณะกรรมการ กนบ. หรือ คณะกรรมการ HR เป็นรายไตรมาส"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างการปรับบทบาทของ HR กับแผนยุทธศาสตร์องค์กร และเป้าหมายทางธุรกิจ"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) จากการให้บริการของ HR (เช่น ผลสำรวจความพึงพอใจการให้บริการของฝ่าย HR) เพื่อนำมาพัฒนาการทำงาน"]},subComps:{"2":["จุดตายเรื่อง HR Audit ต้องเป็น \"เชิงป้องกัน\" (Level 2): นี่คือจุดที่ทำให้ กทท. ได้คะแนนไม่เต็มครับ! ในปีที่ผ่านมาการทำ HR Audit ของ กทท. ยังมีลักษณะเหมือน Internal Audit คือ \"การตรวจสอบจับผิดหลังเกิดเหตุ\" แต่ TRIS ระบุชัดเจนว่า HR Audit ต้องเป็น \"Preventive Approach\" คือการคัดเลือกจุดวิกฤต (Critical Step) ของกระบวนการ HR มาตรวจสอบและวางระบบดักจับ \"ก่อนที่ความผิดพลาดจะเกิดขึ้นจริง","คุณวุฒิวิชาชีพต้องยกระดับสู่ \"มาตรฐานสากล\" (Level 2): กทท. มีผลงานการส่งพนักงาน HR 30 คนไปประเมินคุณวุฒิวิชาชีพนักทรัพยากรบุคคล (TPQI - ของไทย) แล้ว แต่ผู้ตรวจได้ให้ข้อสังเกตว่า วิสัยทัศน์ของ กทท. คือ \"ท่าเรือชั้นนำระดับโลก\" ดังนั้นสายงาน HR จึงควรมีการจัดทำแผน Roadmap ผลักดันให้บุคลากรได้ ใบรับรองคุณวุฒิวิชาชีพระดับสากล (เช่น SHRM) ด้วย จึงจะสมน้ำสมเนื้อกับวิสัยทัศน์องค์กร","ความเป็นที่ปรึกษา (Internal Consultant) ต้องจับต้องได้ (Level 2): การมีคำสั่งตั้งทีม HRBP ยังไม่พอ ผู้ตรวจต้องการเห็นผลลัพธ์ที่ทีม HRBP ลงไปให้คำปรึกษา แนะนำการตั้ง KPI หรือแก้ปัญหาให้กับหน้างานอย่างเป็นรูปธรรม โดยมี \"ผลสำรวจความพึงพอใจการให้คำปรึกษาของ HRBP จากหน่วยงานต่างๆ\" มาเป็นตัวชี้วัดความสำเร็จ","ประเด็นซ่อนเร้นเรื่อง \"HR Governance\" (Level 2 ): ในเล่มคู่มือ SE-AM ได้ซ่อนหลักเกณฑ์นี้ไว้ในหมายเหตุ โดยการบริหารงาน HR ที่ดีต้องมี \"ธรรมาภิบาล\" ซึ่งประกอบด้วย 1) ช่องทางรับฟังข้อร้องเรียนที่ปลอดภัย 2) โครงสร้างคณะกรรมการคัดเลือก/ลงโทษ/ให้รางวัลที่มีความโปร่งใส และ 3) การทบทวนกฎระเบียบข้อบังคับที่ล้าสมัยเพื่อความคล่องตัว (Agility)"],"4":["จุดตายเรื่อง HR Audit ต้องเป็น \"เชิงป้องกัน\" (Level 4): นี่คือจุดที่ทำให้ กทท. ได้คะแนนไม่เต็มครับ! ในปีที่ผ่านมาการทำ HR Audit ของ กทท. ยังมีลักษณะเหมือน Internal Audit คือ \"การตรวจสอบจับผิดหลังเกิดเหตุ\" แต่ TRIS ระบุชัดเจนว่า HR Audit ต้องเป็น \"Preventive Approach\" คือการคัดเลือกจุดวิกฤต (Critical Step) ของกระบวนการ HR มาตรวจสอบและวางระบบดักจับ \"ก่อนที่ความผิดพลาดจะเกิดขึ้นจริง","ประเด็นซ่อนเร้นเรื่อง \"HR Governance\" (Level 4): ในเล่มคู่มือ SE-AM ได้ซ่อนหลักเกณฑ์นี้ไว้ในหมายเหตุ โดยการบริหารงาน HR ที่ดีต้องมี \"ธรรมาภิบาล\" ซึ่งประกอบด้วย 1) ช่องทางรับฟังข้อร้องเรียนที่ปลอดภัย 2) โครงสร้างคณะกรรมการคัดเลือก/ลงโทษ/ให้รางวัลที่มีความโปร่งใส และ 3) การทบทวนกฎระเบียบข้อบังคับที่ล้าสมัยเพื่อความคล่องตัว (Agility)"]}}

// ── LOAD ─────────────────────────────────────────────────────────────
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    if(d.mr)Object.assign(hcmMrChk,d.mr);
    if(d.sc)Object.assign(hcmScChk,d.sc);
    if(d.dm)Object.assign(hcmDimMlt,d.dm);
    if(d.cl)Object.assign(clChecked,d.cl);
    if(d.dc)Object.assign(docCk,d.dc);
    if(d.fe)Object.assign(feInput,d.fe);
  }catch(e){}
  DATA.hcm.subs.forEach(s=>{targets.hcm[s.id]=hcmCalcRaw(s.id)||s.s68;});
}

// ── SAVE / EXPORT / IMPORT ───────────────────────────────────────────

  try{localStorage.setItem(LS_KEY,JSON.stringify({mr:hcmMrChk,sc:hcmScChk,dm:hcmDimMlt,cl:clChecked,dc:docCk,fe:feInput}));}catch(e){}

// ── SCORING ──────────────────────────────────────────────────────────
function hcmCalcLevel(sid,L){
  const s=DATA.hcm.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(hcmMrChk[sid]&&hcmMrChk[sid][L]&&hcmMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((hcmScChk[sid]&&hcmScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(hcmDimMlt[sid]&&hcmDimMlt[sid][L])||0;
}
function hcmCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=hcmCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

function feGapClosed(sid,i){const fi=feInput[sid];if(!fi||!fi.gapClosed)return null;return fi.gapClosed.hasOwnProperty(i)?fi.gapClosed[i]:null;}

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.hcm.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>hcmCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${hcmCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=hcmCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((hcmScChk[sid]&&hcmScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(hcmMrChk[sid]&&hcmMrChk[sid][L]&&hcmMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((hcmScChk[sid]&&hcmScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(hcmDimMlt[sid]&&hcmDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.hcm[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.hcm[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(hcmMrChk[sid]&&hcmMrChk[sid][L]&&hcmMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#0f766e':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#0f766e':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#0f766e;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#0f766e':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=hcmMrChk[sid]&&hcmMrChk[sid][L]&&hcmMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';
        mrH+=`<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck} ${dis} onchange="hcmToggleMR('${sid}',${L},${ri},this.checked);" style="accent-color:#0f766e;"><label for="${kid}">${txt}</label></div>`;
      });
    }
    let dimH='';
    if(scs.length>0){
      const scChecked=((hcmScChk[sid]&&hcmScChk[sid][L])||[]).filter(Boolean).length;
      const scPct=Math.round(scChecked/scs.length*100);
      dimH=`<div class="cg-sect-lbl" style="margin-top:8px;">📊 ประเด็นที่เปิดเผย (L${L}) — <span style="color:#0f766e;">${scChecked}/${scs.length} = ${rv.toFixed(4)}</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${scPct}%;background:${scChecked===scs.length?'#0f766e':'#2a8a50'};"></div></div>`;
      scs.forEach((txt,si)=>{

// ── renderFrameB ────────────────────────────────────────────────────
function renderFrameB(s){
  const mr=s.minReqs||{};const sid=s.id;
  let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{const items=mr[L]||[];total+=items.length;items.forEach((_,i)=>{if(docGetChk(sid,L,i))done++;});  });
  const progPct=total>0?Math.round(done/total*100):0;
  const progColor=done===total&&total>0?'#0f766e':done>0?'#92400e':'#666';
  let html=`<div class="fb-prog-bar"><span style="font-size:11px;font-weight:600;color:${progColor};" id="fb-total-${sid}">${done}/${total} เอกสารพร้อมแล้ว</span><div class="fb-prog-track"><div id="fb-prog-fill-${sid}" style="height:100%;width:${progPct}%;background:${progColor};transition:width .3s;"></div></div></div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lvlDone=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const bdId=`fb-bd-${sid}-${L}`;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const shortTitle=lvlTitle.length>48?lvlTitle.slice(0,48)+'…':lvlTitle;
    const lvlColor=lvlDone===items.length?'#0f766e':lvlDone>0?'#92400e':'#0369a1';
    const lvlBg=lvlDone===items.length?'#e4f5e4':lvlDone>0?'#fef8e0':'rgba(2,132,199,.06)';
    const itemsHtml=items.map((item,i)=>{
      const isGap=item.startsWith('[แก้ไข Gap');const cleanItem=item.replace('[แก้ไข Gap สำคัญ]','').trim();
      const ckd=docGetChk(sid,L,i);const ckId=`dck-${sid}-${L}-${i}`;
      return `<label class="fb-item${isGap?' fb-item-gap':''}${ckd?' fb-item-done':''}"><input type="checkbox" id="${ckId}"${ckd?' checked':''} onchange="docToggle('${sid}',${L},${i},this.checked)">${isGap?'<span class="fb-gap-tag">⚠️ Gap</span>':''}<span class="fb-item-text">${cleanItem}</span></label>`;
    }).join('');
    html+=`<div class="doc-lvl-block"><div class="doc-lvl-hd" style="background:${lvlBg};" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="doc-lvl-badge">L${L}</span><span class="doc-lvl-title" style="color:${lvlColor};">${shortTitle}</span><span class="doc-lvl-count" id="fb-cnt-${sid}-${L}" style="color:${lvlColor};font-weight:600;">${lvlDone}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="doc-lvl-body" id="${bdId}">${itemsHtml}</div></div>`;
  });
  return html;
}

// ── renderFrameE ────────────────────────────────────────────────────

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.hcm.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*hcmCalcRaw(s.id),0);
  const delta=total-DATA.hcm.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.hcm[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#0f766e':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#0f766e':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>hcmCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
loadState();
renderAll();
syncHomeStatus();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
</script>
