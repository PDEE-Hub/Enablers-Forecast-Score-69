<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — HCM การบริหารทุนมนุษย์ ปี 2569</title>
<style>
@font-face{font-family:'Anakotmai';font-weight:300;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-light.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:500;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-medium.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:700;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-bold.woff2') format('woff2');}
</style>
<style>
/* ── PAT Editorial Light ── */
:root{
  --bg:#f8f7f4;--bg2:#f1efe9;--card:#ffffff;
  --border:#e6e3dc;--border-s:#ece9e1;
  --text:#1c1f24;--text2:#5a5f68;--text3:#9a9da3;
  --navy:#1e3a5c;--gold:#b8862f;
  --lv1:#e2554f;--lv2:#ef9483;--lv3:#e3a82e;--lv4:#5bc69a;--lv5:#1f9d6f;
  --shadow:0 1px 3px rgba(28,31,36,.06);
  --shadow-h:0 4px 12px rgba(28,31,36,.10);
  --radius:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Anakotmai',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Anakotmai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--navy);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold);}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* DIM HEADER */
.dim-hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);}

/* CHIPS */
.chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.cn{background:var(--bg2);color:var(--text2);}
.ct{background:rgba(31,157,111,.12);color:#0f7a55;}
.cr{background:rgba(226,85,79,.10);color:#b91c1c;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 97px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--navy);color:rgba(255,255,255,.9);letter-spacing:.2px;}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:12px;font-weight:700;color:var(--navy);min-width:16px;}
.grp-name{font-size:12px;font-weight:600;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:500;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.chk-all{background:#e4f5e4;color:#0f766e;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:4px;background:#d8d4cc;border-radius:2px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;border-radius:2px;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1px solid var(--border-s);transition:background .12s;}
.sub:hover{background:rgba(30,58,92,.04);}
.sub.focus-cg{background:rgba(30,58,92,.07);border-left:3px solid var(--navy);}
.sub.focus-cg .sub-target{border-left-color:var(--navy);}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:700;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--navy);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(30,58,92,.12);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.s0{background:var(--bg2);color:var(--text3);}
.s1{background:rgba(227,168,46,.15);color:#92400e;}
.s2{background:rgba(31,157,111,.12);color:#0f7a55;}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:2px solid var(--navy);background:var(--card);flex-shrink:0;box-shadow:0 -2px 8px rgba(28,31,36,.04);}
.cl-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--navy);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1px solid var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--navy);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:600;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--card);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.frame{border-bottom:1px solid var(--border);}
.frame-hd{padding:8px 16px;font-size:12px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:12px 16px;font-size:13px;line-height:1.65;}
.ftag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.fa-hd{background:rgba(30,58,92,.06);}.fa-tag{background:rgba(30,58,92,.14);color:var(--navy);}
.fb-hd{background:rgba(2,132,199,.06);}.fb-tag{background:rgba(2,132,199,.14);color:#0369a1;}
.fc-hd{background:rgba(184,134,47,.08);}.fc-tag{background:rgba(184,134,47,.18);color:#92400e;}
.fd-hd{background:rgba(71,85,105,.06);}.fd-tag{background:rgba(71,85,105,.14);color:#475569;}
.fe-hd{background:rgba(31,157,111,.07);}.fe-tag{background:rgba(31,157,111,.14);color:#0f7a55;}

.box{border-radius:5px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;}
.box-red{background:rgba(226,85,79,.08);color:#7a1010;border-left:3px solid var(--lv1);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--navy);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;}
.exp-btn:hover{background:var(--border);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:rgba(30,58,92,.05);border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;}
.cg-lvl-row{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--navy);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;overflow:hidden;min-width:0;}
.cg-lvl-summ .kt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
.cg-toggle{background:none;border:1px solid #c0b0e0;border-radius:4px;cursor:pointer;font-size:11px;color:#5a20a0;padding:1px 6px;flex-shrink:0;transition:background .1s;}
.cg-toggle:hover{background:#ece6ff;}
.cl-short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
.cl-exp-btn{font-size:9.5px;color:#5a20a0;cursor:pointer;user-select:none;margin-top:2px;display:inline-block;}
.dep-count-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px 5px;background:#f8f5ff;border-bottom:1px solid #d8ccee;}
.dep-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap;}
.dep-pill span{font-weight:400;opacity:.85;}
.cg-lvl-summ .kt{font-weight:700;color:var(--navy);}
.cg-lvl-detail{padding:8px 14px 10px;background:rgba(30,58,92,.04);border-top:1px dashed var(--border);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:5px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--navy);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--navy);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 4px 4px 0;background:rgba(226,85,79,.05);line-height:1.55;}
.cg-prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:8px;}
.cg-prog-fill{height:4px;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:5px;border:1px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:700;color:var(--navy);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(2,132,199,.06);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:rgba(2,132,199,.10);}
.doc-lvl-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#0369a1;color:#fff;flex-shrink:0;}
.doc-lvl-title{font-size:13px;font-weight:600;color:#0369a1;flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1px solid var(--border);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:#0369a1;font-weight:700;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:rgba(184,134,47,.08);border:1px dashed rgba(184,134,47,.4);border-radius:5px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:rgba(30,58,92,.05);border:1px solid rgba(30,58,92,.15);border-radius:5px;padding:8px 12px;font-size:13px;color:var(--navy);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:#0369a1;color:#fff;text-decoration:none;font-weight:600;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.fb-prog-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);}
.fb-prog-track{flex:1;height:4px;background:#e0ddd8;border-radius:2px;overflow:hidden;}
.fb-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.55;margin:2px 0;border:1px solid transparent;transition:background .12s;}
.fb-item:hover{background:rgba(2,132,199,.05);}
.fb-item-done{background:#f0faf0 !important;border-color:#c3e6cb !important;}
.fb-item-done .fb-item-text{color:#0f766e;text-decoration:line-through;opacity:.7;}
.fb-item-gap{border-left:3px solid #d97706;}
.fb-gap-tag{font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;padding:1px 5px;border-radius:10px;flex-shrink:0;white-space:nowrap;margin-top:1px;}
.fb-item input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#0369a1;width:14px;height:14px;cursor:pointer;}
.fb-item-text{color:var(--text2);flex:1;}

/* FRAME E — Self-Assessment Input + Gen */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap;}
.fe-sect-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;}
.fe-lvl-block{margin-bottom:5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.fe-lvl-active{border-color:#86efac;}
.fe-lvl-hd{display:flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;transition:background .12s;background:var(--bg2);}
.fe-lvl-hd:hover{background:rgba(0,0,0,.03);}
.fe-lvl-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.fe-doc-ref{font-size:11px;color:#0369a1;font-weight:600;flex-shrink:0;}
.fe-lvl-body{padding:8px 11px 10px;display:none;border-top:1px solid var(--border);background:var(--bg);}
.fe-lvl-body.open{display:block;}
.fe-textarea{width:100%;box-sizing:border-box;padding:7px 10px;font-size:12.5px;line-height:1.65;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:#0369a1;box-shadow:0 0 0 2px rgba(3,105,161,.1);}
.fe-gap-item{padding:8px 11px 10px;margin-bottom:5px;background:rgba(217,119,6,.05);border:1px solid rgba(217,119,6,.22);border-radius:var(--radius);}
.fe-gap-text{font-size:12.5px;color:#92400e;margin-bottom:6px;line-height:1.55;}
.fe-gap-status{display:flex;gap:14px;margin-bottom:7px;}
.fe-radio-lbl{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2);}
.fe-radio-lbl input{accent-color:#0f766e;cursor:pointer;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:#1e3a5c;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.fe-gen-btn:hover{opacity:.85;}
.fe-output{width:100%;box-sizing:border-box;padding:10px 12px;font-size:12px;line-height:1.75;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;}
.fe-copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 14px;border-radius:20px;background:#0369a1;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;margin-top:6px;}
.fe-copy-btn:hover{opacity:.85;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#c9c5bc;}

/* ── Cross-Dimension Linkage Badges ── */
.dim-badge{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;letter-spacing:.4px;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .15s;}
.dim-badge:hover{opacity:.75;}
.dim-gap-tag{font-size:9px;font-weight:700;color:#b05000;padding:1px 5px;border-radius:3px;background:#fff3e0;border:1px solid #e07000;white-space:nowrap;}
.crosslink-summ{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 12px;background:#f5f0ff;border-bottom:1px solid #d8ccee;font-size:9.5px;color:#4a3a6a;}
.lvl-dim-strip{display:flex;gap:3px;flex-wrap:wrap;padding:3px 12px 4px;background:rgba(240,235,255,.6);border-bottom:1px solid #e8e0f8;}

// ── DATA ─────────────────────────────────────────────────────────────
const DATA={ hcm: {
  dimId:"HCM",
  dimName:"การบริหารทุนมนุษย์",
  orig:3.074,
  color:"#0f766e",
  subs:[
  {id:"1.1",grp:"1",gname:"ยุทธศาสตร์/กลยุทธ์ด้านบริหารและพัฒนาทุนมนุษย์ และการขับเคลื่อนของผู้บริหารระดับสูง",gw:30.0,gs68:3.15,name:"คุณภาพของยุทธศาสตร์/กลยุทธ์/การสื่อสาร/การติดตามผล/ผลลัพธ์",w:20.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:"\"คุณภาพและวงจรชีวิตของแผนยุทธศาสตร์ด้านการบริหารทุนมนุษย์ (HCM)\" ครอบคลุมตั้งแต่กระบวนการเริ่มต้นคือการวิเคราะห์สภาพแวดล้อม (ปัจจัยภายใน/ภายนอกและเทียบเคียงคู่เทียบ) นำไปสู่การจัดทำแผนยุทธศาสตร์ที่มีความเหมาะสม การแปลงยุทธศาสตร์เป็นแผนปฏิบัติการรายปีที่มีการตั้งตัวชี้วัด (Outcome) การติดตามผลอย่างมีประสิทธิภาพ การบูรณาการยุทธศาสตร์ HR ให้เป็นเนื้อเดียวกันกับระบบงานหรือแผนแม่บทอื่นๆ (Enablers) ในระดับปฏิบัติการ และการนำข้อมูลป้อนกลับ (Feedback) มาทบทวนปรับปรุงแผนยุทธศาสตร์ให้ทันต่อการเปลี่ยนแปลงอย่างสม่ำเสมอ",levelSumm:["การวิเคราะห์ปัจจัยภายใน/ภายนอก ที่ส่งผลกระทบต่อการบริหารทุนมนุษย์และการดำเนินธุรกิจขององค์กร การศึกษาแนวปฏิบัติที่ดี (Best Practices) และการเปรียบเทียบการดำเนินงานที่สำคัญกับคู่เทียบ","ยุทธศาสตร์มีความครบถ้วน เพียงพอ และเหมาะสม โดยออกแบบให้สอดรับกับวิสัยทัศน์ เจตนารมณ์ นโยบายทางธุรกิจของภาครัฐ และ สคร. รวมถึงสอดคล้องกับบริบทการดำเนินงานขององค์กร","การแปลงยุทธศาสตร์ด้าน HR เป็นแผนปฏิบัติการประจำปี มีการกำหนดเป้าหมายและตัวชี้วัดที่ครอบคลุม Output/Outcome กรอบเวลา และผู้รับผิดชอบ รวมทั้งมีกลไกติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพเพื่อให้บรรลุผลลัพธ์ตามที่กำหนด","แผนยุทธศาสตร์ด้าน HR ถูกบูรณาการไปกับแผนงาน/ระบบงานที่สำคัญต่าง ๆ เช่น แผนบริหารความเสี่ยง, แผนงานด้านลูกค้าและตลาด, แผนเทคโนโลยีดิจิทัล (DT), แผนงานนวัตกรรม และการจัดการความรู้ (KM) เป็นต้น","การใช้ข้อมูลป้อนกลับจากการดำเนินงานในการทบทวนยุทธศาสตร์ด้าน HR รวมถึงการนำข้อมูลจากแหล่งอื่น ๆ มาใช้ในการปรับปรุงยุทธศาสตร์ให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ"],good:["กทท. มีการวางระบบพื้นฐานที่ดีมาก ทั้งในแง่การจัดทำแผนยุทธศาสตร์ที่สอดรับกับวิสัยทัศน์ขององค์กร การตั้งคณะกรรมการ มีการแปลงแผนลงสู่ระดับปฏิบัติการ 9 แผนงาน และมีกลไกการติดตามผลอย่างชัดเจนเป็นรายไตรมาสทำให้มั่นใจได้ว่าคะแนนพื้นฐานใน 3 ระดับแรกนั้นผ่านเกณฑ์","การที่ กทท. ประเมินตนเองไว้ที่ระดับ 5 แต่ผลประเมินจริงคะแนนจำลองออกมาที่ 3.0000 ถือเป็นตัวเลขที่สะท้อนความเป็นจริงได้อย่างสมเหตุสมผล เนื่องจากองค์กรมีเอกสารกระบวนการวางแผน (Process) ที่แข็งแกร่งในระดับ 1-3"],gaps:["\"หลักฐานเชิงประจักษ์ในการลงมือทำร่วมกันข้ามสายงาน (Actual Integration)\" ในระดับ 4 และขาด \"การพิสูจน์ผลลัพธ์เชิงประสิทธิภาพที่เพิ่มขึ้น (Proven Effectiveness)\" ในระดับ 5","มีการวิเคราะห์ PESTEL, SWOT และได้ทำการเทียบเคียง (Benchmarking) กับคู่เทียบ เช่น กทพ., รฟม., กฟผ. และ ธอส."],results:["มีการแปลงยุทธศาสตร์เป็นแผนปฏิบัติการ 9 แผนงาน/โครงการ โดยกำหนดตัวชี้วัดที่ครอบคลุม Output/Outcome มีกรอบเวลา ผู้รับผิดชอบ และกลไกรายงานผลรายไตรมาสต่อ กนบ.","อ้างว่ามีการบูรณาการแผน HR กับระบบงานที่สำคัญ เช่น แผนบริหารความเสี่ยง (RM), ดิจิทัล (DT), การจัดการความรู้ (KM), นวัตกรรม (IM) และด้านลูกค้า (SCM) โดยแสดงเป็นตารางความเชื่อมโยง","อ้างว่ามีการใช้ข้อมูลป้อนกลับจาก Feedback Report ปี 2567, ผลสำรวจความพึงพอใจ, แนวโน้ม HR Trends และโครงการความร่วมมือกับ กฟภ. มาปรับปรุงแผนแม่บท HR ปี 2569","มีการกำหนดวิสัยทัศน์และจัดทำตำแหน่งเชิงยุทธศาสตร์ด้าน HR แบ่งเป็น 3 ระยะ (สั้น กลาง ยาว) ที่สอดรับกับแผนวิสาหกิจองค์กร"],tris:["คู่เทียบไม่สอดคล้อง : กทท. ใช้ กทพ., รฟม., กฟผ., ธอส. เป็นคู่เทียบ แต่ผู้ประเมินระบุว่า กทท. ต้อง \"คัดเลือกคู่เทียบด้านทรัพยากรบุคคลที่สอดคล้องกับคู่เทียบในแผนวิสาหกิจ\" (ซึ่งแผนวิสาหกิจมองคู่เทียบเป็นท่าเรือระดับโลกหรืออุตสาหกรรมท่าเรือ)","ตัวชี้วัดผลลัพธ์ยังไม่ถึงมาตรฐานสากล : ผู้ประเมินระบุว่าต้อง \"กำหนดตัวชี้วัดผลลัพธ์ด้านทรัพยากรบุคคลตามแนวปฏิบัติที่ดีในระดับสากล ให้ครอบคลุมทุกกระบวนการด้านทรัพยากรบุคคลที่สำคัญ\" แสดงว่าตัวชี้วัดที่ กทท. ใช้ยังสะท้อนผลลัพธ์เชิงธุรกิจไม่เพียงพอ","การบูรณาการยังเป็นแค่บนแผ่นกระดาษ : กทท. นำเสนอตารางความเชื่อมโยง (Mapping) ข้ามสายงาน แต่ผู้ประเมินชี้ชัดว่า \"การบูรณาการไม่ได้หมายถึงการแสดงให้เห็นความเชื่อมโยงเพียงอย่างเดียว แต่ต้องพิสูจน์ให้ได้ว่ามีการร่วมกันดำเนินงาน... รวมถึงการปฏิบัติงานที่ส่งเสริมกันและกัน หรือร่วมกันปฏิบัติงานจริง\"","ขาดการแสดงประสิทธิผลหลังการปรับปรุง : แม้ กทท. จะมีการนำข้อมูลมาทบทวนแผน แต่ผู้ประเมินมองว่ายังขาด \"การแสดงให้เห็นว่าการปรับปรุง หรือทบทวนดังกล่าว ทำให้เกิดประสิทธิผลตามที่กำหนดไว้ และมีประสิทธิภาพที่ดีขึ้นเมื่อเทียบกับการดำเนินงานในอดีต\""],suggest:["ในปีถัดไป กทท. ไม่ควรทำแค่ตาราง Mapping เพื่อแสดงการบูรณาการ แต่ควรตั้ง Project ข้ามสายงาน (Cross-functional team) ที่ทำงานร่วมกันจริง ๆ (เช่น HR ทำงานร่วมกับ IT เพื่อสร้างแพลตฟอร์ม) และในส่วนของการหาข้อมูลป้อนกลับ (Feedback) ต้องมีตัวเล-เปรียบเทียบ Before/After เพื่อพิสูจน์ให้ผู้ประเมินเห็นว่าเมื่อทบทวนแผนแล้ว \"ประสิทธิภาพดีขึ้นกว่าในอดีตอย่างไร\" พร้อมทั้งต้องเปลี่ยนคู่เทียบด้าน HR ให้สอดคล้องกับคู่เทียบท่าเรือสากลในแผนวิสาหกิจด้วย"],docs:["ตารางเปรียบเทียบตัวชี้วัดระดับโลก (World-Class Benchmarking Table): เอกสารเทียบเคียงข้อมูลด้าน HR ของ กทท. กับ \"ท่าเรือชั้นนำระดับโลก\" (World Class Port) และเอกสารการนำมาตรฐาน ISO 30414:2018 มาประยุกต์ใช้ในการตั้งเป้าหมาย (แทนการเทียบกับรัฐวิสาหกิจในประเทศ)","แผนปฏิบัติการร่วม (Joint Action Plan): เอกสารแผนงานที่ระบุชื่อผู้รับผิดชอบร่วมและ KPI ร่วมกันระหว่างสายงาน HR กับสายงานอื่นๆ (เช่น IT, ยุทธศาสตร์) เพื่อพิสูจน์ \"การบูรณาการข้าม Enablers เชิงประจักษ์\" และลดความซ้ำซ้อน"],bestprac:["การแปลงแผนและการบูรณาการเชิงประจักษ์ (Alignment & Integration): ทั้ง กทพ. และ รฟม. มีความโดดเด่นในการจัดทำแผนยุทธศาสตร์ HR ที่แปลงเป็นแผนปฏิบัติการประจำปี โดยมีการกำหนดเป้าหมาย ตัวชี้วัด กรอบเวลา และผู้รับผิดชอบอย่างชัดเจน และที่สำคัญคือต้อง \"บูรณาการเชื่อมโยงกับแผนยุทธศาสตร์และแผนแม่บทองค์กรอย่างเป็นรูปธรรม\" ไม่ใช่แค่การเขียนอ้างอิงถึงกันในกระดาษ","การวิเคราะห์ปัจจัยและคู่เทียบที่ชัดเจน (Fact-based Scanning): มีการวิเคราะห์ปัจจัยภายใน/ภายนอกและเทียบเคียงคู่เทียบเพื่อนำมากำหนดกลยุทธ์ด้าน HR อย่างเป็นระบบ และนำผลจากการเปรียบเทียบนั้นมาวิเคราะห์เพื่อทบทวนและปรับปรุงยุทธศาสตร์จริงๆ"],minReqs:{"1":["เล่มแผนแม่บททรัพยากรบุคคล (ที่แสดงรายละเอียดการวิเคราะห์ปัจจัยสภาพแวดล้อม SWOT/C-PEST)","[สิ่งที่ควรเพิ่มในปี 69] ตารางเปรียบเทียบตัวชี้วัดด้าน HR (HR Metrics) กับท่าเรือชั้นนำระดับโลก (World Class Port) หรือเทียบเคียงกับมาตรฐานสากล ISO 30414:2018"],"2":["เล่มแผนยุทธศาสตร์/กลยุทธ์ด้านบริหารและพัฒนาทุนมนุษย์ ที่ระบุเป้าหมาย สอดคล้องกับวิสัยทัศน์ชัดเจน","รายงานการประชุมหรือมติคณะกรรมการ (เช่น มติ กนบ. หรือ บอร์ด กทท.) ที่อนุมัติและเห็นชอบแผนยุทธศาสตร์นั้น"],"3":["แผนปฏิบัติการด้าน HR ประจำปี ที่มีการระบุตัวชี้วัดแบบผลลัพธ์ (Outcome) พร้อมกรอบเวลาและระบุผู้รับผิดชอบชัดเจน","รายงานผลการดำเนินงานตามแผนปฏิบัติการรายไตรมาสที่นำเสนอต่อผู้บริหาร"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างผลลัพธ์ตามแผนแม่บท HR กับแผนงาน/ระบบงานที่สำคัญ (Enablers)","[สิ่งที่ควรเพิ่มในปี 69] แผนปฏิบัติการร่วม (Joint Action Plan) ระหว่างสายงาน HR และสายงานยุทธศาสตร์อื่นๆ ที่ระบุผู้รับผิดชอบ งบประมาณ และตัวชี้วัดร่วมกัน"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) จากการดำเนินงานและจากภายนอก","[สิ่งที่ควรเพิ่มในปี 69] เอกสารตาราง Before & After (T-1 vs T+1) ที่แสดงหลักฐานว่าได้นำข้อเสนอแนะจาก TRIS และกระแสการเปลี่ยนแปลงของโลก (HR Trends) มาปรับปรุงแผนยุทธศาสตร์อย่างไร และแสดงผลลัพธ์เชิงตัวเลข (Outcome) ที่ดีขึ้นอย่างเป็นรูปธรรม"]},subComps:{"1":["คู่เทียบ (Benchmark) ต้องเป็นระดับโลก (World-class Port) ไม่ใช่แค่การเทียบกับรัฐวิสาหกิจในประเทศ เพื่อให้สะท้อนกับวิสัยทัศน์องค์กร"],"3":["การกำหนดตัวชี้วัด (KPIs) ต้องเน้นที่ ผลลัพธ์เชิงธุรกิจ (Outcome) มากกว่าการวัดผลสำเร็จของกิจกรรม (Output)"],"4":["คำว่า \"บูรณาการ\" TRIS ไม่ต้องการเห็นแค่ตารางโยงความสัมพันธ์บนกระดาษ แต่ต้องการเห็น \"การทำงานร่วมกันจริง\" (Joint Operation) เช่น แผนปฏิบัติการร่วมที่มีการใช้ทรัพยากรข้ามสายงานร่วมกัน เพื่อลดความซ้ำซ้อน"]}},
  {id:"1.2",grp:"1",gname:"ยุทธศาสตร์/กลยุทธ์ด้านบริหารและพัฒนาทุนมนุษย์ และการขับเคลื่อนของผู้บริหารระดับสูง",gw:30.0,gs68:3.15,name:"การขับเคลื่อนของผู้บริหารระดับสูง",w:10.0,s68:3.45,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"บทบาทและภาวะผู้นำ (Leadership)\" ของผู้บริหารระดับสูงและคณะกรรมการยุทธศาสตร์ด้าน HR ว่าเป็นปัจจัยแห่งความสำเร็จ (Key Success Factor) ที่ช่วยขับเคลื่อนการบริหารทุนมนุษย์ขององค์กรหรือไม่ โดยไม่ได้มองแค่การทำหน้าที่ \"อนุมัติ\" แผนงานบนกระดาษ แต่มองลึกไปถึงการริเริ่มกลยุทธ์ การติดตามผลอย่างสม่ำเสมอ การเข้าร่วมกิจกรรมเพื่อเป็นแบบอย่าง (Role Model) การจัดสรรทรัพยากรที่จำเป็น ตลอดจนการทำงานบูรณาการข้ามสายงานร่วมกับองค์คณะอื่น (Enablers) และใช้ข้อมูลป้อนกลับมาปรับปรุงการบริหารงาน HR ให้พร้อมรับมือกับการเปลี่ยนแปลง",levelSumm:["การกำหนดให้มีคณะกรรมการยุทธศาสตร์ด้าน HR โดยมีบทบาท/หน้าที่ที่ชัดเจนในการริเริ่มและกำหนดยุทธศาสตร์/กลยุทธ์ด้าน HCM รวมถึง มีบทบาทในการติดตาม สนับสนุนสายงาน HR และร่วมกิจกรรมที่สำคัญของสายงาน HR","คณะกรรมการยุทธศาสตร์ด้าน HR กำหนดให้มีแนวทางในการติดตามและการสนับสนุนอย่างเป็นระบบ อย่างน้อยเป็นรายไตรมาส","คณะกรรมการยุทธศาสตร์ด้าน HR สามารถดำเนินการได้ครบถ้วนตามบทบาท/หน้าที่ที่กำหนด ขับเคลื่อนการดำเนินงานเชิงกลยุทธ์ได้ผลลัพธ์ตามเป้าหมาย รวมถึงมีส่วนร่วมในกิจกรรมประจำปีที่สำคัญด้าน HCM อย่างต่อเนื่อง","คณะกรรมการยุทธศาสตร์ด้าน HR มีการบูรณาการการทำงานร่วมกับองค์คณะอื่น ๆ เช่น คณะกรรมการรัฐวิสาหกิจ คณะอนุกรรมการด้าน HR คณะทำงานฯ ด้านยุทธศาสตร์องค์กร ด้านลูกค้าและตลาด ด้านการจัดการความรู้และนวัตกรรม เป็นต้น","คณะกรรมการยุทธศาสตร์ด้าน HR มีการใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ รวมถึงเป็นการปรับปรุงที่มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้การทำงานเกิดประสิทธิภาพสูงสุด"],good:["กทท. มีโครงสร้างคณะกรรมการ (กนบ.) ที่เข้มแข็ง มีการจัดประชุมสม่ำเสมอถึง 8 ครั้ง ผู้บริหารระดับสูงลงมาคลุกคลีและร่วมกิจกรรม HR อย่างเป็นรูปธรรม (เช่น เป็น Role Model ใน PAT Care U Day) ทำให้ได้คะแนนเกินระดับ 3 ขึ้นมาอยู่ที่ประมาณ 3.4500 ถือเป็นจุดแข็งของ กทท. ในหมวดนี้","มีการแต่งตั้งคณะกรรมการกำหนดนโยบายการบริหารงานบุคคลและพัฒนาบุคลากรของ กทท. (กนบ.) มีบทบาทหน้าที่ชัดเจน และมีการติดตามการสนับสนุนอย่างเป็นระบบเป็นรายไตรมาส"],gaps:["การแก้ปัญหายังเป็นลักษณะ \"HR แก้ปัญหาของ HR\"","ผู้ประเมินต้องการเห็นภาพของ \"ผู้บริหารสูงสุดทุกสายงานมารุมแก้ปัญหา HR และ Enablers อื่นร่วมกัน\""],results:["มีการแต่งตั้งคณะกรรมการกำหนดนโยบายการบริหารงานบุคคลและพัฒนาบุคลากรของ กทท. (กนบ.) มีบทบาทหน้าที่ชัดเจน และมีการติดตามการสนับสนุนอย่างเป็นระบบเป็นรายไตรมาส","กนบ. มีการจัดประชุมและให้ข้อเสนอแนะในการขับเคลื่อนด้านต่างๆ เช่น การพิจารณาอัตรากำลัง ทุนการศึกษา การแก้ปัญหาระบบ HRIS นอกจากนี้ ผู้บริหารระดับสูง (เช่น รอง อทร.) ได้เข้ามามีส่วนร่วมเป็น Role Model และเข้าร่วมกิจกรรมด้าน HR เช่น งาน PAT Care U Day","ผู้บริหารแสดงบทบาทเชิงรุก มีการจัดประชุมผู้บริหารระดับสูง (Top Team) แบบข้ามสายงาน และรอง อทร. ทุกสายงานช่วยพิจารณาประเด็น HR ที่เกี่ยวข้องกับหน่วยงานตนเอง","อ้างว่ามีการใช้ข้อมูลป้อนกลับจาก Feedback Report ปี 2567, กฎหมายใหม่ (พ.ร.บ. รัฐวิสาหกิจ), HR Trends, และการนำแนวปฏิบัติที่ดี (Best Practice) จากการหารือร่วมกับ กฟภ. มาปรับปรุงกระบวนการและแผนของ กนบ."],tris:["ผู้ประเมินระบุว่า \"กนบ. ยังต้องแสดงบทบาทเชิงรุกในการร่วมขับเคลื่อนโครงการกับคณะกรรมการ Enablers ชุดอื่นๆ อย่างเป็นระบบและต่อเนื่อง\"","ในแผน Roadmap ระบุชัดเจนถึงมุมมองของผู้ประเมินว่า \"กนบ. ยังขาดการผลักดันปัญหาระดับบูรณาการข้ามสายงานอย่างเป็นรูปธรรม\" และ \"แม้คณะกรรมการ กนบ. จะมีการประชุมสม่ำเสมอ แต่ยังขาดเวทีการประชุมร่วมกันของผู้บริหารระดับสูงทุกสายงาน (Top Team: N และ N-1) แบบรายไตรมาส เพื่อพูดคุยและแก้ไขปัญหาข้ามสายงาน (Cross-Enablers) อย่างบูรณาการ\""],suggest:["เพื่อให้ข้อนี้ทะลุระดับ 4 กทท. ต้องจัดให้มี \"เวทีประชุม Top Team (ผู้บริหาร N และ N-1 ของทุกสายงาน)\" อย่างเป็นทางการทุกไตรมาส โดยมีวาระการประชุมที่สะท้อนการแก้ปัญหาข้ามสายงาน (Cross-functional) อย่างชัดเจน เช่น นำวาระเรื่องปัญหาอัตรากำลังไปผูกกับแผน Digital Transformation แล้วให้ผู้บริหารระดับสูงของทั้งสองฝั่ง (HR และ IT) ร่วมกันเคาะมติ และบันทึกรายงานการประชุม (MoM) นั้นไว้เป็นหลักฐานชิ้นสำคัญส่งให้ TRIS ตรวจในปีต่อไปครับ"],docs:["รายงานการประชุมผู้บริหารระดับสูงทุกสายงาน (Top Team MoM): บันทึกการประชุม (ระดับ N และ N-1 ของทุกสายงาน) ประจำไตรมาส ที่มีวาระการนำปัญหาด้าน HR และการบูรณาการข้ามสายงาน (Cross-Enablers) มาถกและหาทางแก้ไขร่วมกันอย่างเป็นรูปธรรม"],bestprac:["ความเข้มแข็งของคณะกรรมการยุทธศาสตร์ด้าน HR (HR Committee Role): รฟม. และ กทพ. มีการกำหนดบทบาทคณะกรรมการยุทธศาสตร์ด้าน HR ที่เข้มแข็ง โดยไม่ได้ทำหน้าที่แค่รับทราบ แต่ทำหน้าที่ \"ริเริ่ม กำหนดยุทธศาสตร์ สนับสนุน และร่วมกิจกรรม\" ของสายงาน HR อย่างเป็นรูปธรรม","การติดตามผลอย่างเป็นระบบ (Systematic Monitoring): มีกลไกในการให้คณะกรรมการชุดนี้ติดตามผลการดำเนินงานที่สำคัญของสายงาน HR อย่างเป็นระบบ \"อย่างน้อยเป็นรายไตรมาส\""],minReqs:{"1":["คำสั่งแต่งตั้งคณะกรรมการยุทธศาสตร์ด้าน HR หรือ คณะกรรมการ กนบ. (โดยองค์คณะต้องประกอบด้วยผู้บริหารสูงสุด (อทร.) และรอง อทร. ทุกสายงาน อย่างครบถ้วน)","หลักฐานภาพถ่ายหรือรายงานกิจกรรมที่ผู้บริหารระดับสูงเข้าร่วมกิจกรรมสำคัญของสายงาน HR"],"2":["ปฏิทินการประชุมคณะกรรมการ กนบ. และ ปฏิทินการเข้าร่วมกิจกรรมด้าน HR ของผู้บริหารตลอดทั้งปี","รายงานการประชุมคณะกรรมการ กนบ. (อย่างน้อยรายไตรมาส) ที่แสดงให้เห็นการติดตามและสนับสนุนงาน HR"],"3":["รายงานผลการดำเนินงานตามแผนยุทธศาสตร์ด้าน HR ที่บรรลุเป้าหมายตามที่คณะกรรมการ กนบ. ได้กำกับติดตาม","รายงานสรุปกิจกรรมผู้บริหารประจำปี ที่แสดงให้เห็นว่าผู้บริหารมีส่วนร่วมในกิจกรรมสำคัญด้าน HCM อย่างต่อเนื่อง"],"4":["คำสั่งแต่งตั้งคณะทำงานบูรณาการข้ามสายงาน (ถ้ามี)","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการประชุมผู้บริหารระดับสูง (Top Team MoM: N และ N-1 ทุกสายงาน) ที่มีวาระการนำปัญหาด้าน HR และการบูรณาการข้ามสายงาน (Cross-Enablers เช่น นำเรื่อง HR ไปถกร่วมกับฝ่าย IT หรือ ฝ่ายยุทธศาสตร์) มาหารือและหาทางแก้ไขร่วมกันอย่างเป็นรูปธรรม"],"5":["ตารางสรุปการนำข้อมูลป้อนกลับไปใช้พัฒนาผู้บริหาร/คณะกรรมการ กนบ.","[สิ่งที่ต้องเพิ่มในปี 69] เอกสารตาราง Before & After (T-1 vs T+1) ที่แสดงให้เห็นว่า คณะกรรมการ กนบ. ได้นำข้อมูลจากแหล่งภายนอก (เช่น คู่เทียบ กฟภ. หรือ HR Trends) มาตัดสินใจปรับปรุงนโยบายการทำงานอย่างไร และเกิดผลลัพธ์ที่ดีขึ้นต่อองค์กรอย่างไร"]},subComps:{"1":["โครงสร้างคณะกรรมการ \"ตกม้าตายได้ถ้าไม่ครบ\" (Level 1): TRIS มีคำหมายเหตุตัวเล็กๆ ระบุว่า \"คณะกรรมการยุทธศาสตร์ด้าน HR ต้องมีความครบถ้วนขององค์คณะ โดยอย่างน้อยต้องประกอบด้วยผู้บริหารระดับสูงสุดของ ทุกสายงาน (N-1) และผู้บริหารสูงสุดขององค์กร (N)\" หากแต่งตั้งมาไม่ครบทุกสายงาน จะถือว่าไม่ผ่าน Level 1 ทันที"],"2":["จัดทำปฏิทินงาน HR ล่วงหน้า 1 ปี: TRIS ให้คำแนะนำใน Feedback Report ว่า ทีมเลขานุการ (ฝ่าย HR) ควรจัดทำ \"ปฏิทินการประชุมและปฏิทินกิจกรรมสำคัญด้าน HR ล่วงหน้าทั้งปี\" เพื่อให้ผู้บริหารระดับสูงสามารถจัดสรรเวลาเข้าร่วมงานได้อย่างเป็นระบบและต่อเนื่อง ไม่ใช่การเชิญแบบกะทันหัน"],"3":["หลีกเลี่ยงการนำวาระ \"งานธุรการ\" มาเขียนรายงาน (Level 3-4): ในปี 68 กทท. นำวาระการประชุม กนบ. เช่น การอนุมัติตำแหน่ง หรือการให้ทุนการศึกษามาเขียนเรียงข้อ ซึ่ง TRIS มองว่าเป็นการตัดสินใจงาน Routine (งานธุรการ) สิ่งที่ TRIS คาดหวังคือ \"การตัดสินใจเชิงกลยุทธ์ (Strategic Decision)\" หรือการแก้ปัญหาระดับโครงสร้างองค์กร"],"4":["การบูรณาการข้ามสายงาน = Top Team Meeting (Level 4): การจะผ่านระดับ 4 ได้ ผู้ประเมินต้องการเห็น \"รายงานการประชุม (MoM) ของผู้บริหารระดับ N และ N-1\" (Top Team) ที่นำเอาปัญหาที่ HR แก้ฝ่ายเดียวไม่ได้ (เช่น เรื่อง IT หรือโครงสร้างธุรกิจ) มาถกเถียงและหาทางออกร่วมกับฝ่ายอื่นๆ อย่างเป็นรูปธรรมในห้องประชุม"]}},
  {id:"2.1",grp:"2",gname:"การบริหารทุนมนุษย์",gw:25.0,gs68:3.11,name:"อัตรากำลัง",w:7.5,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"การบริหารจัดการอัตรากำลังให้สอดรับกับภารกิจทั้งในปัจจุบันและอนาคต\" โดยครอบคลุมตั้งแต่การออกแบบโครงสร้างงาน (Job Family) การวิเคราะห์อุปสงค์และอุปทานของอัตรากำลัง (Demand & Supply) การหาอัตรากำลังส่วนขาด/ส่วนเกิน การวางแผนนำเทคโนโลยีมาทดแทนกำลังคน การสรรหาและหมุนเวียนงาน (Job Rotation) และที่สำคัญคือการวิเคราะห์เพื่อเพิ่ม \"ผลผลิตประสิทธิภาพ (Productivity)\" ขององค์กรในภาพรวม",levelSumm:["การกำหนดโครงสร้างงานและกลุ่มของงาน (Job family) และโครงสร้างอัตรากำลัง (Workforce landscape) ที่มีความสอดคล้องกับโครงสร้างธุรกิจ และกระบวนการหลักในการดำเนินการของรัฐวิสาหกิจ","การจัดทำแผนอัตรากำลังระยะสั้นและระยะยาว โดยมีการวิเคราะห์อุปสงค์อุปทาน (Demand and Supply) อัตรากำลังส่วนขาด/ส่วนเกิน มีกระบวนการสรรหา คัดเลือก และการหมุนเวียนบุคลากร (Job rotation) มีการวิเคราะห์ทดแทนอัตรากำลังด้วยเทคโนโลยีดิจิทัล วิเคราะห์ผลผลิตประสิทธิภาพ (Productivity) และการวิเคราะห์กระบวนการทำงานเพื่อเพิ่มประสิทธิภาพ (HROD)","การดำเนินงานที่ครบถ้วนตามแผนอัตรากำลังประจำปี โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แผนอัตรากำลังระยะสั้นและระยะยาว มีความเชื่อมโยงกับแผนยุทธศาสตร์ชาติที่เกี่ยวข้องกับการบริหารอัตรากำลังภาครัฐและแผนยุทธศาสตร์องค์กร โดยสะท้อนให้เห็นถึงความเพียงพอเชิงปริมาณอย่างเหมาะสมของอัตรากำลังที่จะสามารถดำเนินงานให้บรรลุผลสำเร็จ","การใช้ข้อมูลป้อนกลับจากการดำเนินงานตามแผนอัตรากำลังประจำปี รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ รวมถึงเป็นการปรับปรุงที่มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้การทำงานเกิดประสิทธิภาพสูงสุด"],good:["คะแนนระดับ 3.0000 ในข้อนี้มีความเหมาะสมและสะท้อนความจริงอย่างมาก กทท. มีผลงานด้าน Productivity และการคุมค่าใช้จ่ายที่ดี (ซึ่งช่วยพยุงคะแนนไว้ไม่ให้ตกลงไปกว่านี้)"],gaps:[],results:["มีการจัดทำโครงสร้างงาน กลุ่มงาน (Job family) และ Workforce landscape ที่สอดคล้องกับธุรกิจ","มีการจัดทำแผนอัตรากำลังระยะสั้นและระยะยาว โดยวิเคราะห์อุปสงค์อุปทาน (Demand & Supply) ควบคุมสัดส่วนค่าใช้จ่ายบุคลากรต่อรายได้ให้อยู่ที่ไม่เกินร้อยละ 23.33 ซึ่งทำได้ดีกว่าค่าเฉลี่ยรัฐวิสาหกิจอื่นที่อยู่ระดับ 31%","ดำเนินการตั้ง Sandbox เพื่อเตรียมปรับโครงสร้างองค์กร และขอตั้งอัตราตำแหน่งระดับ 13 เพิ่มจำนวน 4 อัตรา","มีค่าผลผลิตประสิทธิภาพ (Productivity) สูงถึง 5.33 ล้านบาทต่อคน ซึ่งสูงกว่าเป้าหมาย"],tris:["ขาดการวิเคราะห์กระบวนการและเวลาทำงานเชิงลึก (Workflow & Time and Motion Study) : ผู้ตรวจระบุอย่างชัดเจนว่า กทท. ต้องจัดทำ Workflow Analysis และ Time and Motion Study ให้ครอบคลุม โดยเฉพาะหน่วยงาน Front-line เนื่องจากผู้ตรวจมองว่าหากไม่ลงไปจับเวลาทำงานจริง องค์กรจะไม่ทราบเลยว่ามี \"อัตรากำลังส่วนเกินที่แท้จริง\" ซ่อนอยู่ที่ใดบ้าง การประเมินกำลังคนจึงยังเป็นเพียงการคาดการณ์แบบกว้างๆ","ขาดการวิเคราะห์การจัดการอุปทานกำลังคน (Supply-side) เชิงลึก : กทท. มุ่งเน้นไปที่การควบคุม Demand หรือการรับคนใหม่ แต่ผู้ประเมินต้องการเห็นกลยุทธ์การจัดการอุปทานคนที่มีอยู่แล้ว (Supply-side) เช่น มีการนำคนที่มีอยู่ไป Re-skill/Up-skill เพื่อจับไปหมุนเวียน (Job Rotation) ทดแทนการขออัตรากำลังจ้างใหม่หรือไม่"],suggest:["งานนี้เป็นงานที่ยากและซับซ้อนมาก ในตาราง Roadmap ได้จัดลำดับความยากไว้ในระดับ \"สูงมาก (ยากสุด)\" หาก กทท. ต้องการดันคะแนนข้อนี้ให้ทะลุระดับ 4 ในปี 2569 ต้องดำเนินการตั้ง Project การทำ Time & Motion Study ร่วมกับสายงานปฏิบัติการ (Front-line) โดยอาจจะต้องมีการจ้างที่ปรึกษาเข้ามาจับเวลาและวิเคราะห์ Workflow จริงๆ เพื่อหาอัตรากำลังส่วนเกิน แล้วนำข้อมูลนั้นมาสร้างแผน Re-skill โยกย้ายพนักงานส่วนเกินไปทำงานอื่นทดแทนการจ้างคนใหม่"],docs:["รายงานการวิเคราะห์เวลาและกระบวนการทำงาน (Time & Motion Study & Workflow Analysis Report): เอกสารวิเคราะห์เชิงลึกโดยเฉพาะกลุ่มปฏิบัติการหน้างาน (Front-line) เพื่อหาอัตรากำลังส่วนเกินที่แท้จริง","แผนการจัดการอุปทานกำลังคน (Supply-Side Management Plan): เอกสารแผนการทำ Multi-skill, Re-skill/Up-skill เพื่อแสดงแนวทางการหมุนเวียนกำลังคนที่มีอยู่เดิมไปทดแทนอัตรากำลังที่จะจ้างใหม่"],bestprac:["การวิเคราะห์ด้าน Supply-side และนำเทคโนโลยีมาทดแทน: รฟม. มีการวิเคราะห์อุปสงค์อุปทาน (Demand & Supply) ทั้งส่วนขาดและส่วนเกินอย่างชัดเจน โดยเฉพาะการประเมินโครงสร้างอัตรากำลังเชิงเปรียบเทียบระหว่าง \"อัตรากำลังที่มีอยู่\" กับ \"อัตรากำลังที่ควรจะเป็น\" ควบคู่ไปกับการพิจารณา \"วางแผนทดแทนอัตรากำลังด้วยเทคโนโลยีดิจิทัลอย่างเป็นระบบ","มีหลักเกณฑ์การหมุนเวียนบุคลากรที่ชัดเจน: มีกระบวนการสรรหาและหลักเกณฑ์การหมุนเวียนบุคลากร (Job Rotation) ทุกระดับที่เป็นระบบและเกิดขึ้นจริง"],minReqs:{"1":["เอกสารโครงสร้างองค์กรปัจจุบัน และประกาศการจัดกลุ่มงาน (Job Family)","เอกสารโครงสร้างอัตรากำลัง (Workforce Landscape) ที่แสดงข้อมูล As-is (ปัจจุบัน) และ To-be (สิ่งที่คาดหวังในอนาคต) รวมถึงข้อมูลประชากรศาสตร์ (Demographic) และทักษะที่จำเป็น (Required Skill set)"],"2":["เล่มแผนอัตรากำลังระยะสั้นและระยะยาว ที่แสดงการวิเคราะห์อุปสงค์อุปทาน (Demand & Supply)","คู่มือ/ระเบียบการสรรหาคัดเลือก และหลักเกณฑ์การหมุนเวียนบุคลากร (Job Rotation)","ตารางวิเคราะห์ผลผลิตประสิทธิภาพ (Productivity) เช่น สัดส่วนรายได้ต่อค่าใช้จ่ายบุคลากร","[สิ่งที่ต้องเพิ่มในปี 69] รายงานการวิเคราะห์กระบวนการทำงาน (Workflow Analysis) หรือรายงานการศึกษาเวลาทำงาน (Time & Motion Study) ของหน่วยงานหน้างาน (Front-line) เพื่อหาอัตรากำลังส่วนเกินที่แท้จริง"],"3":["รายงานผลการบรรจุพนักงานและอัตรากำลังเทียบกับแผน (แสดงตัวเลขผลลัพธ์การจัดการอัตรากำลังส่วนขาด/เกิน)","รายงานผลการดำเนินงานตามแผนอัตรากำลังรายไตรมาส ที่เสนอต่อคณะกรรมการ กนบ."],"4":["ตารางแสดงความเชื่อมโยง (Mapping) แผนอัตรากำลังกับแผนวิสาหกิจ และแผนยุทธศาสตร์ชาติ","[สิ่งที่ต้องเพิ่มในปี 69] แผนการจัดการอุปทานกำลังคน (Supply-Side Management Plan) เช่น หลักฐานการทำ Multi-skill หรือ Re-skill/Up-skill ข้ามสายงาน เพื่อนำกำลังคนที่มีอยู่เดิม (ส่วนเกิน) ไปทดแทนอัตรากำลังที่จะจ้างใหม่ (เทคโนโลยี)"],"5":["ตารางสรุปการนำข้อมูลป้อนกลับ (Feedback) มาใช้ทบทวนแผนอัตรากำลัง","[สิ่งที่ต้องเพิ่มในปี 69] ตาราง Before & After (T-1 vs T+1) แสดงผลลัพธ์ของค่า Productivity ที่เพิ่มขึ้นอย่างเป็นรูปธรรม หรือสัดส่วนค่าใช้จ่ายบุคลากรที่ลดลงเมื่อเทียบกับปีก่อนหน้าและคู่เทียบ"]},subComps:{"1":["คำว่า Workforce Landscape ไม่ใช่แค่ \"ตารางนับคน\" (Level 1): TRIS ระบุในหมายเหตุว่า โครงสร้างอัตรากำลัง ต้องไม่ใช่แค่จำนวนคน แต่ต้องมีข้อมูลเชิงประชากรศาสตร์ (อายุ, เพศ) ทักษะที่จำเป็น (Required Skill Set) และต้องทำตารางวิเคราะห์เปรียบเทียบภาพปัจจุบัน (As-is) กับ ภาพที่องค์กรอยากจะเป็น (To-be) เสมอ"],"2":["จุดตายเรื่อง Time & Motion Study (Level 2): นี่คือจุดที่ กทท. ถูกหักคะแนนหนักที่สุดในปี 68! ผู้ตรวจระบุชัดเจนว่า กทท. คาดการณ์อัตรากำลังแบบเดิมๆ ไม่ได้แล้ว แต่ \"ต้องลงไปจับเวลาการทำงานจริง และวิเคราะห์กระบวนการ (Workflow Analysis) ในพื้นที่ปฏิบัติงาน (Front-line)\" เพื่อหาว่ามีคนล้นงานตรงไหน (อัตรากำลังส่วนเกินที่แท้จริง)"],"4":["Supply-side Management สำคัญกว่าการขอจ้างคนเพิ่ม (Level 4): การแก้ปัญหาอัตรากำลังขาดแคลน ไม่ใช่การเขียนของบประมาณเพื่อรับพนักงานใหม่เพียงอย่างเดียว แต่ TRIS มองหา \"การบริหารจัดการฝั่งอุปทาน (Supply-side)\" คือ การเอาคนที่ล้นงานจากแผนกอื่น มาทำ Multi-skill หรือ Re-skill เพื่อหมุนเวียนไปทำหน้าที่ใหม่ที่ขาดแคลน (ทดแทนการจ้างใหม่)"],"5":["Productivity ต้องเป็นตัวเลข (Level 5): การนำเสนอในกระดาษคำตอบต้องมีตารางชัดเจนว่า การจัดการอัตรากำลังและนำเทคโนโลยีมาใช้ ทำให้ \"รายได้ต่อหัวพนักงาน\" เพิ่มขึ้นเท่าไหร่ หรือ \"ค่าใช้จ่ายพนักงานต่อรายได้รวม\" ลดลงอย่างไร"]}},
  {id:"2.2",grp:"2",gname:"การบริหารทุนมนุษย์",gw:25.0,gs68:3.11,name:"ระบบประเมินผลการปฏิบัติงาน",w:15.0,s68:3.15,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"ระบบบริหารผลการปฏิบัติงาน (PMS)\" แบบครบวงจร (End-to-End) เริ่มตั้งแต่การออกแบบระบบและเกณฑ์การวัดผล การถ่ายทอดตัวชี้วัด (KPI) จากระดับองค์กรลงสู่พนักงานระดับปฏิบัติการ การกำกับติดตามให้เกิดการประเมินผลอย่างเป็นธรรมทั่วทั้งองค์กร การนำผลประเมินไปเชื่อมโยงกับการให้รางวัล (การเงิน/ไม่ใช่ตัวเงิน) การเลื่อนตำแหน่ง และการพัฒนาศักยภาพ (IDP) ตลอดจนการนำข้อมูลป้อนกลับมาพัฒนาระบบประเมินผลให้ทันสมัยและเป็นธรรมอย่างต่อเนื่อง",levelSumm:["การกำหนดระบบประเมินผลการดำเนินงานขององค์กรในทุกระดับ โดยมีหลักเกณฑ์/แนวทาง ในการประเมินผล และรอบระยะเวลาในการประเมินผลที่ชัดเจน","กระบวนการถ่ายทอดตัวชี้วัดระดับองค์กรสู่ตัวชี้วัดระดับแผนงานและโครงการ โดยการกำหนดตัวชี้วัดผลการดำเนินงาน (KPI) ระดับสายงาน/หน่วยงานและระดับบุคคลที่สอดคล้องกับแผนยุทธศาสตร์องค์กร แผนธุรกิจ/แผนงานของสายงาน/หน่วยงาน และภาระงานในตำแหน่งงานที่รับผิดชอบ","การประเมินผลการปฏิบัติงานเกิดขึ้นจริงทั่วทั้งองค์กร โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","การใช้ประโยชน์จากการวัดและประเมินผลการปฏิบัติงาน โดยนำมาเชื่อมโยงกับการปรับเลื่อนตำแหน่ง (Promotion) และการให้ผลตอบแทนทั้งที่เป็นตัวเงินและไม่ใช่ตัวเงิน การยกย่อง/ชมเชย รวมถึงการนำไปใช้ในระบบการเรียนรู้และการพัฒนา โดยนำผลการประเมินมาใช้ในการวิเคราะห์ เพื่อเสริมสร้างศักยภาพของบุคลากร/ทีมงาน /หน่วยงาน","การใช้ข้อมูลป้อนกลับจากการดำเนินงานของระบบประเมินผลการปฏิบัติงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ รวมถึงเป็นการปรับปรุงที่มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้การทำงานเกิดประสิทธิภาพสูงสุด"],good:["กทท. วางระบบประเมินผลขั้นพื้นฐานได้อย่างยอดเยี่ยมและครบถ้วนมาก มีการผูกผลประเมินกับระบบผลตอบแทนอย่างชัดเจน (Pay for Performance) รวมถึงมีระบบ IT (HRIS) มารองรับกระบวนการทั้งหมด นอกจากนี้การกระจาย KPI จากบนลงล่าง (Cascading) ก็ทำได้อย่างเป็นรูปธรรม ทำให้ได้คะแนนยืนพื้นได้อย่างมั่นคงที่ 3.1500 ซึ่งถือเป็นฐานคะแนนที่สูง","การที่ กทท. ได้คะแนนในข้อย่อยนี้ 3.1500 ถือว่าสมเหตุสมผลและสอดคล้องกับ Gap ที่เกิดขึ้นครับ ระบบของ กทท. ในปัจจุบันมีความเป็น \"ระบบดั้งเดิมที่แข็งแกร่ง (Traditional PMS)\" ซึ่งตอบโจทย์ระดับ 1-3 ได้สมบูรณ์"],gaps:["องค์ประกอบของ \"ระบบประเมินผลยุคใหม่ (Modern/Agile PMS)\" เช่น 360-degree feedback หรือ Continuous Feedback แบบที่องค์กรชั้นนำระดับโลกใช้"],results:["มีการจัดทำคู่มือการประเมินผล มีคำจำกัดความตัวชี้วัดเชิงพฤติกรรม และกำหนดสัดส่วน KPI ต่อ พฤติกรรมที่ 70:30","มีการถ่ายทอดตัวชี้วัด (Cascade KPI) จากระดับองค์กรสู่ระดับสายงานและบุคคล โดยแบ่ง KPI เป็น 3 ประเภท (ตามกลยุทธ์, ตามบทบาทหน้าที่, ตามงานที่ได้รับมอบหมาย)","มีกลไกการประเมินปีละ 2 ครั้งผ่านระบบ HRIS 100% มีคณะกรรมการบริหารผลการปฏิบัติงาน 2 ระดับ และผลประเมินเฉลี่ยของพนักงานอยู่ในเกณฑ์ดีมาก (92.5 คะแนน)","นำผลการประเมินไปเชื่อมโยงกับการเลื่อนตำแหน่ง (ให้น้ำหนัก 10%), การขึ้นเงินเดือน (Pay for Performance), การคัดเลือก Talent/Successor และใช้จัดทำแผนพัฒนารายบุคคล (IDP) เพื่อปิด Gap","มีการนำ Feedback และ HR Trends 2025 มาปรับปรุงกระบวนการเป็น Digital Performance Management โดยใช้ HRIS อย่างเต็มรูปแบบ"],tris:["ขาดกลไกสอบทานคุณภาพตัวชี้วัด (KPI Quality Audit) : ผู้ตรวจมองว่า กทท. มีการถ่ายทอด KPI ก็จริง แต่ต้องมีกลไกสอบทานด้วยว่าตัวชี้วัดในระดับปฏิบัติการนั้น \"มีคุณภาพและสะท้อนยุทธศาสตร์จริงหรือไม่\"","ขาดการประเมินผลแบบ 360 องศา : TRIS เสนอแนะชัดเจนว่า กทท. ควรยกระดับระบบโดยเริ่มพิจารณาการประเมินแบบ 360 องศา (ประเมินจากหัวหน้า, ลูกน้อง, เพื่อนร่วมงาน) โดยให้เริ่มจากระดับผู้บริหารก่อน","ขาดวัฒนธรรมการให้ข้อมูลป้อนกลับ (Feedback Culture) : การประเมินผลในปัจจุบันยังเป็นลักษณะการประเมินตามรอบ (ปีละ 2 ครั้ง) แต่ผู้ประเมินต้องการเห็นแนวทาง \"การให้ข้อมูลป้อนกลับเป็นรายบุคคลระหว่างปี\" อย่างต่อเนื่อง เพื่อให้เกิดการปรับปรุงตนเองได้ทันท่วงที","ขาดการประเมินคณะกรรมการประเมินผล : มีคณะกรรมการ 2 ระดับก็จริง แต่ยังไม่พบการ \"ประเมินประสิทธิผลการทำงานของคณะกรรมการ\" เหล่านี้ว่าทำหน้าที่ได้ดีเพียงใด"],suggest:["ในตารางจัดลำดับความยากง่าย (Ranking) กทท. ประเมินว่าเรื่อง \"นำการประเมิน 360 องศามาใช้ และสร้างวัฒนธรรม Feedback ระหว่างปี\" มีระดับความยากอยู่ในเกณฑ์ \"สูงมาก\" เพราะต้องปรับกระบวนการใหม่และต้องพึ่งพาระบบ IT อย่างมาก ดังนั้น ในปี 2569 กทท. อาจไม่ต้องทำ 360 องศาทั้งองค์กรในทีเดียว แต่ควรสร้าง \"โครงการนำร่อง (Pilot Project)\" การประเมิน 360 องศาสำหรับผู้บริหารระดับสูง (N และ N-1) ออกมาก่อน และออกแบบช่องทางในระบบ HRIS ให้หัวหน้าสามารถเข้าไปกดให้ Feedback ลูกน้องระหว่างปีได้ พร้อมบันทึกเป็นหลักฐานไว้ (Systematic Feedback Loop) สิ่งนี้จะช่วยปิด Gap ของ TRIS และเพิ่มคะแนนในข้อนี้ได้อย่างชัดเจน"],docs:["รายงานการสอบทานคุณภาพตัวชี้วัด (KPI Quality Audit Report): หลักฐานการสอบทานว่า KPI ในระดับปฏิบัติการสะท้อนถึงแผนยุทธศาสตร์องค์กรอย่างแท้จริง","คู่มือ/รายงานผลการนำร่องประเมินแบบ 360 องศา: หลักฐานการเริ่มใช้ระบบประเมิน 360 องศา (โดยเริ่มนำร่องจากกลุ่มผู้บริหารก่อน)","หลักฐานการสร้างวัฒนธรรมให้ข้อมูลป้อนกลับ (Feedback Culture Record): บันทึกหรือ Log ในระบบ HRIS ที่แสดงให้เห็นว่ามีการให้ Feedback เป็นรายบุคคลระหว่างปี"],bestprac:["กลไกการ \"สอบทาน\" ตัวชี้วัด (KPI Audit): รฟม. ไม่ได้ทำแค่ถ่ายทอดตัวชี้วัด (Cascade KPI) จากบนลงล่างเท่านั้น แต่มี \"กระบวนการสอบทานความถูกต้องของตัวชี้วัด\" ในระดับสายงานและระดับบุคคลด้วย เพื่อให้มั่นใจว่า KPI ที่ตั้งไว้นั้นสะท้อนเป้าหมายยุทธศาสตร์ขององค์กรจริงๆ","ผูกผลประเมินกับระบบแรงจูงใจที่ชัดเจน (Clear Pay for Performance): รฟม. นำผลการประเมินไปใช้กำหนดผลตอบแทนและแรงจูงใจ \"ทั้งที่เป็นตัวเงินและไม่ใช่ตัวเงิน\" อย่างเป็นรูปธรรม เช่น ผูกผล KPI เข้ากับการปรับเลื่อนตำแหน่ง, การขึ้นเงินเดือน, และการยกย่องชมเชย (Rewards) อย่างชัดเจน"],minReqs:{"1":["คู่มือการประเมินผลการปฏิบัติงาน และ คู่มือคำจำกัดความตัวชี้วัดเชิงพฤติกรรม (Competency/Behavioral Dictionary)","ประกาศ/ระเบียบที่ระบุหลักเกณฑ์ น้ำหนักคะแนน (เช่น สัดส่วน KPI : พฤติกรรม) และรอบระยะเวลาการประเมินอย่างชัดเจน"],"2":["ผัง/เอกสารแสดงกระบวนการถ่ายทอดตัวชี้วัด (Cascade KPI) จากระดับองค์กร -> ระดับสายงาน/หน่วยงาน -> ระดับบุคคล","[สิ่งที่ต้องเพิ่มในปี 69] รายงานหรือหลักฐานการ \"สอบทานความถูกต้องของตัวชี้วัด (KPI Audit)\" เพื่อยืนยันว่า KPI ระดับบุคคลสะท้อนเป้าหมายยุทธศาสตร์ขององค์กรจริง ไม่ใช่การตั้งเป้าหมายที่ง่ายเกินไป"],"3":["สถิติ/รายงานผลการประเมินการปฏิบัติงานของพนักงานประจำปี (แสดงให้เห็นว่ามีการประเมินจริงผ่านระบบ HRIS ครบถ้วนตามกรอบเวลา)","รายงานการติดตามผลการดำเนินงานของ \"คณะกรรมการบริหารผลการปฏิบัติงาน\" (กลไกกำกับดูแล)"],"4":["หลักฐานการเชื่อมโยงผลประเมินกับรางวัลที่เป็นตัวเงิน (เช่น ระเบียบ Pay for Performance / การเลื่อนขั้นเงินเดือน) และไม่ใช่ตัวเงิน (เช่น ประกาศรางวัลพนักงานดีเด่น)","ประกาศ/คำสั่งการปรับเลื่อนตำแหน่ง (Promotion) ที่ใช้คะแนนประเมินเป็นเกณฑ์พิจารณา","แผนพัฒนารายบุคคล (Individual Development Plan: IDP) ที่นำช่องว่าง (Gap) จากการประเมินผลมาจัดทำ"],"5":["ตารางสรุปการนำข้อมูลป้อนกลับ (Feedback) เช่น ผลสำรวจความพึงพอใจต่อระบบ PMS มาใช้ปรับปรุงระบบประเมินผล","[สิ่งที่ต้องเพิ่มในปี 69] รายงานผลการนำร่องใช้ \"การประเมินแบบ 360 องศา\" (เริ่มจากกลุ่มผู้บริหารก่อน)","[สิ่งที่ต้องเพิ่มในปี 69] หลักฐานเชิงประจักษ์ (Log ในระบบ หรือ ภาพถ่ายกิจกรรม) ที่แสดงให้เห็นว่ามีการสร้าง \"วัฒนธรรมการให้ข้อมูลป้อนกลับ (Feedback Culture)\" ระหว่างผู้ประเมินและผู้ถูกประเมิน \"ระหว่างปี\" (ไม่ใช่แค่รอประเมินตอนสิ้นปี)"]},subComps:{"2":["Cascade KPI ต้องมาพร้อมกับ \"การสอบทาน (Audit)\" (Level 2): TRIS ระบุใน Feedback Report ชัดเจนว่า การแค่ถ่ายทอด KPI ลงไปนั้นไม่พอ แต่ต้องมี \"กลไกการสอบทานคุณภาพของตัวชี้วัดระดับสายงานและระดับบุคคล\" เพื่อป้องกันไม่ให้พนักงานตั้ง KPI ที่ง่ายเกินไป และต้องมั่นใจว่าเป็นมาตรฐานเดียวกันทั้งองค์กร"],"4":["ประเมิน 360 องศา และ Feedback Culture คือตัวตัดคะแนน (Level 4-5): กทท. ประเมินแบบ Top-down (หัวหน้าประเมินลูกน้อง) ซึ่ง TRIS มองว่ายังไม่ Best Practice ผู้ตรวจมีคำสั่งตรงใน Feedback Report ว่า ให้ กทท. เริ่มนำวิธีการประเมินแบบ 360 องศามาใช้ (เริ่มที่ระดับผู้บริหารก่อน) และต้องมีหลักฐานว่าเกิดการพูดคุย/ให้คำแนะนำระหว่างหัวหน้ากับลูกน้อง (Feedback Culture) \"เป็นรายบุคคลระหว่างปี\" ไม่ใช่แค่คุยกันตอนประเมินผลปลายปี"],"5":["ต้องประเมิน \"คณะกรรมการ PMS\" ด้วย (Level 5): กทท. มีการตั้งคณะกรรมการบริหารผลการปฏิบัติงานขึ้นมาดูแล แต่ TRIS แนะนำว่า กทท. ต้อง \"ประเมินประสิทธิผลการทำงานของคณะกรรมการชุดนี้ด้วย\" เพื่อนำผลมาทบทวนบทบาทหน้าที่ให้เหมาะสมยิ่งขึ้น","เชื่อมโยงกับ Hybrid Work (Hidden Issue): ใน Feedback Report มีการระบุหมายเหตุไว้ว่า หาก กทท. มีนโยบายทำงานนอกสำนักงาน (Hybrid Work/WFH) ระบบ PMS จะต้องถูกปรับเปลี่ยนให้เป็นแบบ \"พิจารณาผลลัพธ์ของงาน (Outcome-Based Productivity)\" มากกว่าการประเมินโดยดูจากการเข้าออกสำนักงานตามแนวทางเดิม"]}},
  {id:"2.3",grp:"2",gname:"การบริหารทุนมนุษย์",gw:25.0,gs68:3.11,name:"ผลตอบแทนและสิทธิประโยชน์",w:2.5,s68:3.2,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"ความสามารถในการดึงดูดและรักษาบุคลากร (Attract & Retain) ผ่านระบบผลตอบแทนและสวัสดิการ\" โดยระบบดังกล่าวต้องแข่งขันได้กับตลาด (Market Benchmark) ถูกต้องและเป็นธรรมตามกฎหมายแรงงาน และที่สำคัญที่สุดคือ ต้องมีการจำแนกกลุ่มบุคลากร (Segmentation) เพื่อสำรวจความต้องการและนำไปออกแบบ \"สวัสดิการที่ตอบโจทย์ความแตกต่างและหลากหลายของพนักงาน (Diversity/Generation)\" ได้อย่างมีประสิทธิภาพ ภายใต้ขีดความสามารถและกรอบงบประมาณขององค์กร",levelSumm:["มีแนวทางการพัฒนาผลตอบแทนและสิทธิประโยชน์ของกลุ่ม/ส่วนบุคลากร โดยมีการเปรียบเทียบโครงสร้างผลตอบแทนกับตลาดที่ครอบคลุมเงินเดือน, ผลตอบแทนจูงใจ และผลประโยชน์เกื้อกูลอื่น","การปฏิบัติตามกฎหมาย หรือข้อบังคับที่เกี่ยวข้องกับแรงงานของการบริหารทรัพยากรบุคคลเพื่อให้เกิดความเป็นธรรมกับพนักงาน","การดำเนินงานตามแนวทางการพัฒนาฯ ได้ โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แนวทางการพัฒนาฯ สอดคล้องกับระเบียบปฏิบัติขององค์กร รวมถึงมีการนำ \"ความเห็น และความต้องการ\" ของกลุ่มและส่วนบุคลากรมาใช้ประโยชน์ในการออกแบบแนวทางการพัฒนาฯ","การใช้ข้อมูลป้อนกลับจากการดำเนินงานตามแนวทางการพัฒนาฯ รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ รวมถึงเป็นการปรับปรุงที่มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้การทำงานเกิดประสิทธิภาพสูงสุด"],good:["กทท. ทำได้ดีมากในแง่ของ \"การดูแลคุณภาพชีวิตพนักงาน\" มีการตอบสนองต่อผลสำรวจ (เช่น เรื่องประกันชีวิตกลุ่ม) และเกาะติดเทรนด์สังคม (เช่น สมรสเท่าเทียม) รวมทั้งมีการปรับปรุงตัวเงินสวัสดิการให้สอดคล้องกับสภาวะเศรษฐกิจ ทำให้ผู้ประเมินมองเห็นความพยายามที่เป็นรูปธรรม จึงให้คะแนนประเมินสูงถึงระดับ 3.2000 ซึ่งถือว่าเป็นจุดแข็ง","คะแนน 3.2000 สะท้อนว่า กทท. เป็นองค์กรที่ดูแลพนักงานได้ดีเยี่ยมในระดับ \"มาตรฐานแบบดั้งเดิม\" (ให้สวัสดิการถ้วนหน้าและปรับปรุงตามความต้องการพื้นฐาน)"],gaps:["ขาดแนวทางในการก้าวข้ามแนวความคิดปฏิบัติแบบเดิมๆ ไปสู่แนวคิด \"Flexible Benefits (สวัสดิการยืดหยุ่น)\" แบบเต็มรูปแบบที่องค์กรระดับสากลใช้ ซึ่งเป็นเงื่อนไขในการปลดล็อกคะแนนระดับ 4 และ 5"],results:["มีการวิเคราะห์เปรียบเทียบโครงสร้างค่าตอบแทนกับตลาดแรงงานกลุ่มขนส่งและโลจิสติกส์ รวมถึงรัฐวิสาหกิจอื่น มีการปรับอัตราค่าจ้างขั้นต่ำตามกฎหมายและปรับเพิ่มเงินการครองชีพชั่วคราว","มีการสำรวจความต้องการด้านสวัสดิการของพนักงาน และนำมาจัดสวัสดิการที่ตอบโจทย์ความต้องการ เช่น การจัดทำประกันชีวิตกลุ่มให้พนักงาน (จากผลสำรวจพบว่าพนักงาน 86.54% ต้องการ) การติดตั้งตู้จำหน่ายเครื่องดื่มอัตโนมัติ และการปรับปรุงสวัสดิการให้สอดคล้องกับพ.ร.บ. สมรสเท่าเทียม","นำข้อมูลป้อนกลับมาปรับปรุงสวัสดิการให้ดีขึ้นอย่างเป็นรูปธรรม เช่น ปรับเพิ่มค่าช่วยเหลือบุตรจาก 500 บาท เป็น 600 บาท/คน และปรับเพิ่มเงินสงเคราะห์การคลอดบุตรจาก 400 บาท เป็น 3,000 บาท/ครั้ง โดยไม่จำกัดจำนวนครั้ง"],tris:["ขาดการวิเคราะห์กลุ่มส่วนบุคลากรที่ชัดเจน (Unclear Segmentation) : ผู้ตรวจประเมินระบุใน Feedback Report ชัดเจนว่า \"ยังไม่ชัดเจนว่ามีการวิเคราะห์ส่วนบุคลากร ดังนั้น ควรมีการวิเคราะห์และบริหารผลตอบแทนฯ ของส่วนบุคลากรให้ชัดเจน\"","นโยบายสวัสดิการมีความซับซ้อนและยังติดหล่มคำว่า \"ความเท่าเทียม (Equality) : จากเอกสารวิเคราะห์ Roadmap ระบุว่า การจัดส่วนบุคลากร (Segmentation) ของ กทท. ในปัจจุบันมีความซับซ้อนเกินไป และยังไม่ตอบโจทย์ความต้องการเชิงลึก ผู้ตรวจประเมินต้องการให้ กทท. มุ่งเน้นการจัดการแบบ \"ความเสมอภาค (Equity)\" มากกว่าความเท่าเทียม (Equality) แปลว่า ไม่จำเป็นต้องให้สวัสดิการทุกคนเหมือนกันหมด แต่ควรให้ตามความเหมาะสมของความต้องการในแต่ละช่วงวัยหรือกลุ่มความหลากหลาย"],suggest:["ทำ Segmentation 2-3 กลุ่ม ให้ชัดเจน เช่น แบ่งตาม Generation (Baby Boomer, Gen X, Gen Y, Gen Z) หรือ แบ่งตามลักษณะงาน (Front-line vs Back-office)","ออกแบบ สวัสดิการทางเลือก (Cafeteria Benefits) ที่ให้พนักงานแต่ละกลุ่มสามารถเลือก \"แพ็กเกจสวัสดิการ\" ที่ตรงกับ Life Stage ของตนเองได้ (เช่น Gen Z อาจต้องการงบสนับสนุนฟิตเนสหรืออุปกรณ์ IT ในขณะที่ Gen X อาจต้องการแพ็กเกจตรวจสุขภาพที่ครอบคลุมขึ้น) และนำเสนอหลักฐานการวิเคราะห์นี้ให้ TRIS ดูอย่างเป็นระบบ"],docs:["รายงานการวิเคราะห์แบ่งกลุ่มบุคลากร (Segmentation Analysis Report): เอกสารการแบ่งกลุ่มพนักงาน (ไม่เกิน 2-3 กลุ่ม) ตามความหลากหลาย (Diversity) หรือเจเนอเรชัน (Generation)","แผนการจัดสวัสดิการแบบเสมอภาค (Equity-Based Benefits Plan): เอกสารการออกแบบสวัสดิการทางเลือก หรือ Flexible Benefits ที่ตอบสนอง \"ความต้องการเชิงลึก\" ของพนักงานแต่ละกลุ่ม (เปลี่ยนจากหลักความเท่าเทียม (Equality) เป็นหลักความเสมอภาค (Equity))"],bestprac:["ออกแบบสวัสดิการจาก \"เสียงของพนักงาน\" จริงๆ: รฟม. มีการนำ \"ความคาดหวัง ความเห็น และความต้องการ\" ของกลุ่ม/ส่วนบุคลากร มาวิเคราะห์และใช้ประโยชน์ในการออกแบบสวัสดิการและผลตอบแทนจริงๆ (ซึ่ง กทท. ยังติดปัญหาเรื่องการแบ่งกลุ่ม Segmentation ที่ซับซ้อนเกินไป)","การเทียบเคียงผลตอบแทนกับตลาด (Market Benchmarking): มีการเปรียบเทียบโครงสร้างผลตอบแทน (เงินเดือน / ค่าตอบแทนจูงใจ / สวัสดิการ) กับตลาดและรัฐวิสาหกิจอื่นอย่างเป็นระบบ เพื่อนำมาทบทวนการจัดสวัสดิการให้สามารถดึงดูดและรักษาบุคลากรได้"],minReqs:{"1":["รายงานการศึกษา/เทียบเคียงโครงสร้างผลตอบแทน (Benchmarking Report) กับตลาดแรงงานและรัฐวิสาหกิจอื่น ครอบคลุมทั้งเงินเดือน (Salary), ผลตอบแทนจูงใจ (Incentive Pay) และผลประโยชน์เกื้อกูล (Fringe Benefits)","บัญชีโครงสร้างอัตราเงินเดือนและค่าจ้างของพนักงาน"],"2":["ประกาศ ระเบียบ หรือคำสั่งขององค์กรที่ปรับปรุงให้สอดคล้องกับกฎหมายแรงงานใหม่ๆ (เช่น ประกาศปรับค่าจ้างขั้นต่ำ หรือระเบียบที่รองรับ พ.ร.บ. สมรสเท่าเทียม)"],"3":["รายงานสรุปผลการจัดสวัสดิการและผลตอบแทนประจำปี (เช่น การจ่ายโบนัส, การเบิกค่ารักษาพยาบาล)","รายงานการประชุมคณะกรรมการสวัสดิการ ที่มีการติดตามและประเมินผลการดำเนินงานอย่างต่อเนื่อง"],"4":["[สิ่งที่ต้องเพิ่มในปี 69] รายงานการวิเคราะห์การแบ่งกลุ่มบุคลากร (Segmentation Analysis) ที่ระบุความต้องการเชิงลึก (Insight) ของพนักงานแต่ละกลุ่ม","[สิ่งที่ต้องเพิ่มในปี 69] คู่มือหรือหลักเกณฑ์ \"ระบบสวัสดิการทางเลือก (Flexible Benefits)\" ที่พิสูจน์ว่าองค์กรได้นำความต้องการของแต่ละกลุ่มมาออกแบบสวัสดิการจริงๆ"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table) จากผลสำรวจความพึงพอใจด้านผลตอบแทน","[สิ่งที่ต้องเพิ่มในปี 69] ตาราง Before & After (T-1 vs T+1) แสดงผลลัพธ์การแก้ไขข้อจำกัดทางสวัสดิการ (เช่น การเพิ่มเงินคลอดบุตรจาก 400 บาท เป็น 3,000 บาท หรือการอนุมัติสวัสดิการประกันชีวิตกลุ่ม)","[สิ่งที่ต้องเพิ่มในปี 69] หลักฐาน/บันทึกข้อความการ \"สื่อสารและทำความเข้าใจกับพนักงาน\" ในกรณีที่ กทท. มีข้อจำกัดด้านงบประมาณ/กฎระเบียบ ทำให้ไม่สามารถให้สวัสดิการตามที่พนักงานร้องขอได้"]},subComps:{"4":["หลุมพรางเรื่อง Segmentation (Level 4): ผู้ตรวจให้ Feedback ไว้ชัดเจนว่า การแบ่งกลุ่มพนักงานของ กทท. เดิมนั้น \"มีความซับซ้อนและยังไม่ตอบโจทย์\" คำแนะนำคือ ในปี 69 ให้แบ่งกลุ่มพนักงาน (Segmentation) เพียง 2-3 กลุ่มเท่านั้น โดยเน้นแบ่งตามความหลากหลาย (Diversity) หรือเจเนอเรชัน (Generation) เช่น แบ่งเป็นกลุ่มคนรุ่นใหม่ (Gen Y, Z) ที่ต้องการสวัสดิการฟิตเนส/ประกันสุขภาพ และกลุ่มผู้ใหญ่ (Gen X, BB) ที่ต้องการการดูแลหลังเกษียณ เป็นต้น","เปลี่ยนจาก Equality เป็น Equity (Level 4): การจัดสวัสดิการแบบเก่าคือการให้ทุกคนเหมือนกันเป๊ะ (Equality) แต่ผู้ตรวจต้องการเห็นการให้สวัสดิการแบบ \"ความเสมอภาค (Equity)\" นั่นคือการออกแบบสวัสดิการให้ตรงกับความต้องการและข้อจำกัดที่แตกต่างกันของพนักงานแต่ละกลุ่ม (Flexible Benefits)"],"5":["คะแนนจะหายหากไม่ชี้แจงเมื่อมีข้อจำกัด (Level 5): รัฐวิสาหกิจมักมีกฎหมายและงบประมาณล็อกไว้ ทำให้ให้สวัสดิการทุกอย่างตามใจพนักงานไม่ได้ TRIS มีหมายเหตุไว้ชัดเจนว่า \"หากมีข้อจำกัดในการจัดผลตอบแทนตามที่บุคลากรคาดหวัง องค์กรต้องมีหลักฐานว่าได้สื่อสารทำความเข้าใจเรื่องนี้กับพนักงานอย่างเป็นระบบ\" (เช่น มีบันทึกชี้แจงเหตุผลทางงบประมาณผ่านช่องทาง Line/Website) และต้องประเมินด้วยว่าพนักงานเข้าใจเหตุผลนั้นหรือไม่","Quick Win (ดึงจุดเด่นมาโชว์): กทท. มีผลงานที่ดีเยี่ยมซ่อนอยู่คือ การแก้ระเบียบค่าคลอดบุตรจาก 400 เป็น 3,000 บาท และการปรับกฎให้รองรับ \"พ.ร.บ. สมรสเท่าเทียม\" ให้นำเรื่องนี้มาใส่เป็นตารางผลงาน (Before & After) ใน Level 5 ชูเป็นหลักฐานยืนยันว่าองค์กรปรับตัวต่อกระแสโลกและการเปลี่ยนแปลงของสังคม (Global Trends) ได้อย่างรวดเร็วและจับต้องได้"]}},
  {id:"3.1",grp:"3",gname:"การพัฒนาทุนมนุษย์",gw:25.0,gs68:2.87,name:"การเรียนรู้และการพัฒนา",w:10.0,s68:3.2,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"ความครอบคลุมและประสิทธิผลของระบบการพัฒนาบุคลากร\" โดยไม่ได้เน้นแค่การจัดอบรมในห้องเรียน (Classroom) แต่เน้นการพัฒนาทักษะแห่งอนาคต (New/Up/Re-skill) การสร้างระบบนิเวศการเรียนรู้ (Learning Ecosystem) ที่ผสมผสานการเรียนรู้จากการปฏิบัติงานจริง (Action Learning / Non-Classroom) การพัฒนาผู้นำ และการสร้างสภาพแวดล้อมที่ส่งเสริมให้บุคลากรเรียนรู้ด้วยตนเอง (Self-learning) โดยต้องวัดความคุ้มค่า (ROI) และผลกระทบต่อธุรกิจ (Business Impact) ได้",levelSumm:["การออกแบบระบบการเรียนรู้และการพัฒนาขององค์กร ที่มีองค์ประกอบครบถ้วน (เช่น วิเคราะห์ Competency, ประเมิน Gap ทำ IDP, มี Development Roadmap, มีแผนพัฒนาผู้นำ, สร้าง Learning Ecosystem, และใช้เทคโนโลยีดิจิทัลมาสนับสนุน)","การประเมินประสิทธิผลของระบบการเรียนรู้และพัฒนาที่ครอบคลุมถึงรูปแบบการพัฒนาแบบต่าง ๆ ที่นอกเหนือจากการฝึกอบรม (Non-classroom) รวมถึงการวิเคราะห์ความคุ้มค่าในการพัฒนา (ROI in employee development)","การดำเนินงานที่ครบถ้วนตามแผนงานประจำปี โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","ระบบการเรียนรู้และการพัฒนา มีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนงาน/ระบบงานที่สำคัญ เช่น แผนงานด้านลูกค้าและตลาด (SCM), แผนเทคโนโลยีดิจิทัล (DT), แผนการจัดการความรู้ (KM) เป็นต้น","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ มุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้เกิดประสิทธิภาพสูงสุด"],good:["กทท. มีโครงสร้างการพัฒนาบุคลากรที่ชัดเจน นำเทคโนโลยีมาใช้ (FutureSkill) และมีความพยายามในการวัดผลแบบสากล (Kirk-Patrick & ROI) ถือเป็นการวางรากฐานที่ดี ทำให้คะแนนเกาะกลุ่มอยู่เกือบถึงระดับ 3 (2.9000)"],gaps:["ผู้ตรวจประเมินต้องการเห็น \"ประสิทธิผล (Outcome)\" ที่ชัดเจน โดยเฉพาะการเรียนรู้หน้างาน (Non-classroom) ซึ่งเป็นสิ่งที่พิสูจน์ยากที่สุด นอกจากนี้ การจำกัดการเรียนรู้ไว้แค่ภายในองค์กรทำให้เสียโอกาสในการเรียนรู้จากคู่ค้าและลูกค้าตามแนวคิด Business Ecosystem ครับ"],results:["วิเคราะห์สมรรถนะ (Competency) ครบถ้วน จัดทำ Skill Matching เพื่อรองรับ Global Trend สู่การเป็น Smart Port มีการใช้ระบบนิเวศการเรียนรู้ (Learning Ecosystem) ทั้งแบบชั้นเรียนและนอกชั้นเรียน (OJT, Coaching, Cross-functional) และเรียนรู้ด้วยตนเองผ่าน FutureSkill และ e-Library","ประเมินประสิทธิผลการเรียนรู้ด้วย Kirk-Patrick Model ทั้ง 4 ระดับ และมีการวัดความคุ้มค่าในการฝึกอบรม (ROI) ซึ่งคำนวณผลตอบแทนกลับคืนสู่องค์กรได้ถึง 66.41 ล้านบาท","ดำเนินการตามแผนพัฒนาบุคลากรสำเร็จ 100% บูรณาการแผน HR เข้ากับแผนอื่นๆ เช่น การบูรณาการกับแผนเทคโนโลยีดิจิทัล (DT) เรื่อง Digital Literacy และแผนจัดการความรู้ (KM) ผ่านระบบ NotebookLM","นำผลการประเมิน ROI, ข้อแนะนำจากคณะกรรมการ (กนบ.) และ Feedback Report ปี 67 มาปรับปรุงแผนการอบรมในปีถัดไป"],tris:["Learning Ecosystem ยังจำกัดอยู่แค่ภายใน (Lack of Business Ecosystem Integration) : กทท. ระบุว่ามี Learning Ecosystem ที่ดี แต่ผู้ตรวจมองว่าระบบนิเวศนี้ยังขาดการดึง \"บุคคลภายนอก\" เข้ามามีส่วนร่วม ผู้ตรวจระบุชัดเจนว่า กทท. ต้องกำหนดระบบนิเวศให้ครอบคลุมถึง การเรียนรู้ภายในระบบนิเวศธุรกิจ (Business Ecosystem) หมายถึงต้องมีการเรียนรู้ร่วมกับผู้มีส่วนได้ส่วนเสียภายนอก เช่น ลูกค้า หรือพันธมิตร เพื่อสร้าง Collaborative Learning","การประเมินผลรูปแบบ Non-classroom ยังจับต้องไม่ได้ : แม้ กทท. จะบอกว่ามีการประเมินผลการเรียนรู้ผ่าน OJT และ Coaching แต่ผู้ตรวจชี้ว่า รูปแบบ Non-classroom เหล่านี้ “ยังประเมินประสิทธิผลที่แท้จริงไม่ได้” (ประเมินผลลัพธ์ยาก) อาจเป็นเพราะยังประเมินแค่ความพึงพอใจหรือความรู้ แต่ยังไม่สามารถพิสูจน์ \"การเปลี่ยนแปลงพฤติกรรม (Behavioral Change)\" หรือ \"ผลกระทบต่อธุรกิจ\" อย่างเป็นรูปธรรมได้","เครื่องมือการเรียนรู้ยังไม่ตอบโจทย์ความแตกต่าง (Preference) : ผู้ตรวจระบุว่า กทท. ควรออกแบบแนวทาง/เครื่องมือพัฒนาให้เหมาะสมกับกลุ่มคนที่ต่างกัน เช่น การใช้ \"Micro Learning\" ผ่านมือถือ หรือการใช้ \"Gamification\" ในการสร้างการเรียนรู้ให้สนุกสำหรับคนรุ่นใหม่"],suggest:["สร้าง Collaborative Learning: จัดโครงการเรียนรู้ร่วมกันกับหน่วยงานภายนอก (ลูกค้าหรือคู่ค้า) เช่น กิจกรรมร่วมแบ่งปันแนวปฏิบัติที่ดีกับบริษัทเดินเรือ หรือพัฒนานวัตกรรมร่วมกับคู่เทียบ (เช่น กฟภ.) อย่างเป็นรูปธรรม","เพิ่ม Gamification: เริ่มนำรูปแบบเกมหรือ Micro Learning สั้นๆ มาใช้ในระบบ e-learning ขององค์กร เพื่อตอบโจทย์คน Gen Y/Gen Z (การย่อยเนื้อหาการอบรมหรือความรู้ (KM) ให้เป็นคลิปวิดีโอหรือบทความสั้นๆ หรือ การนำกลไกของ \"เกม\" (เช่น การสะสมแต้ม/Token, การผ่านด่าน, การมี Leaderboard จัดอันดับ) มาประยุกต์ใช้กับการทำงานหรือการเรียนรู้ เพื่อสร้างความสนุกสนานและกระตุ้นให้บุคลากรกลุ่ม Gen Y และ Gen Z ซึมซับและเข้าใจเนื้อหาได้ง่ายขึ้น เป็นต้น)","ปรับวิธีประเมินผล Non-Classroom: สำหรับโครงการ OJT หรือ Coaching กทท. ต้องสร้าง \"หลักฐาน\" การประเมินที่ชัดเจน เช่น แบบฟอร์มประเมินพฤติกรรมโดยหัวหน้างาน ก่อน-หลัง การทำ OJT (Behavioral Assessment) พร้อมแนบหลักฐานว่าผลงานดีขึ้นจริง"],docs:["รายงานผลการจัด Collaborative Learning: เอกสารสรุปโครงการ/หลักฐานการเรียนรู้ร่วมกับ \"ผู้มีส่วนได้ส่วนเสียภายนอก\" หรือลูกค้า เพื่อแสดงให้เห็นการขยาย Business Ecosystem","แบบประเมินและรายงานวัดผลลัพธ์รูปแบบ Non-Classroom: หลักฐานการประเมินประสิทธิผล (ROI หรือ Behavioral Change) ที่จับต้องได้จริงจากการฝึกอบรมแบบ OJT หรือ Coaching"],bestprac:["การวิเคราะห์สมรรถนะแห่งอนาคต: มีการวิเคราะห์และทบทวนสมรรถนะ (Competency) อย่างจริงจัง โดยเฉพาะสมรรถนะที่ \"รองรับการเปลี่ยนแปลงทางเทคโนโลยีดิจิทัล\" เพื่อให้สอดคล้องกับทิศทางขององค์กร","จัดทำแผนพัฒนาระยะยาวที่มุ่งเน้นความเชี่ยวชาญ: มีการประเมินช่องว่าง (Gap) เพื่อนำไปจัดทำแผนพัฒนารายบุคคล (IDP) และมี Development Roadmap ระยะยาวที่ชัดเจน","ระบบนิเวศการเรียนรู้แบบเต็มรูปแบบ: มีการพัฒนาระบบนิเวศการเรียนรู้ร่วมกับระบบ e-learning อย่างเต็มรูปแบบ เพื่อสนับสนุนการพัฒนาบุคลากรอย่างเป็นระบบ"],minReqs:{"1":["คู่มือสมรรถนะ (Competency Dictionary) ที่ครอบคลุม Core/Managerial/Functional Competency และสะท้อนทักษะด้านดิจิทัล","รายงานสรุปการประเมินช่องว่างสมรรถนะ (Competency Gap) และ แผนพัฒนารายบุคคล (IDP)","เล่มแผนพัฒนาบุคลากรระยะยาว (Development Roadmap) และ โครงการพัฒนาผู้นำ (Leadership Development) ทุกระดับ","[สิ่งที่ต้องเพิ่มในปี 69] แผนผัง/คู่มือระบบนิเวศการเรียนรู้ (Learning Ecosystem) ที่ระบุครอบคลุมถึงการเรียนรู้ร่วมกับ \"ผู้มีส่วนได้ส่วนเสียภายนอก/ลูกค้า\""],"2":["[สิ่งที่ต้องเพิ่มในปี 69] แบบประเมินและรายงานผลประสิทธิผลการเรียนรู้สำหรับรูปแบบ Non-classroom (เช่น การประเมินหลังทำ OJT, Coaching, Mentoring) ที่สามารถวัดพฤติกรรมที่เปลี่ยนไปได้จริง","[สิ่งที่ต้องเพิ่มในปี 69] รายงานวิเคราะห์ความคุ้มค่าในการพัฒนาบุคลากร (ROI in employee development) ในหลักสูตรที่สำคัญ"],"3":["รายงานผลการดำเนินงานฝึกอบรม/พัฒนาบุคลากรประจำปี (แสดงจำนวนชั่วโมง/จำนวนคนที่ได้เข้าอบรมเทียบกับแผน)","รายงานการติดตามผลการดำเนินงานของคณะกรรมการที่เกี่ยวข้อง (เช่น กนบ.)"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างระบบการเรียนรู้และการพัฒนา กับแผนยุทธศาสตร์องค์กร และแผนงานอื่นๆ (เช่น แผน DT, แผน SCM, แผน KM/IM)"],"5":["ตารางสรุปการนำข้อมูลป้อนกลับ (Feedback) เช่น ผลสำรวจความพึงพอใจการอบรม มาปรับปรุงแผนการพัฒนา","[สิ่งที่ต้องเพิ่มในปี 69] ตาราง Before & After (T-1 vs T+1) แสดงการปรับเปลี่ยนรูปแบบการเรียนรู้ให้ทันสมัยขึ้น (เช่น การเพิ่มแพลตฟอร์ม Digital Learning ใหม่ๆ หรือการปรับหลักสูตรตามโลก) พร้อมตัวเลขผลลัพธ์ (Productivity) ที่ดีขึ้น"]},subComps:{"1":["Learning Ecosystem ต้องออกไปนอกองค์กร (Level 1, 4): กทท. มักจัดอบรมกันเองภายใน แต่ TRIS ระบุใน Feedback ว่าระบบนิเวศการเรียนรู้ต้องครอบคลุมถึง \"ระบบนิเวศธุรกิจ (Business Ecosystem)\" หมายความว่า ต้องมีหลักฐานการจัด \"การเรียนรู้ร่วมกับผู้มีส่วนได้ส่วนเสียภายนอก หรือ ลูกค้า (Collaborative Learning)\"","ออกแบบการเรียนรู้ตามความชอบ (Preference) และ Gen (Level 1): TRIS ให้ข้อสังเกตว่าการจัดอบรมแบบนั่งฟังในห้องอาจไม่ตอบโจทย์คนรุ่นใหม่ ควรมีรูปแบบ Micro Learning (เรียนสั้นๆ ผ่านมือถือ) หรือ Gamification (การเรียนรู้ผ่านเกม) เข้ามาเสริมในแผนการพัฒนาด้วย","เน้นพัฒนา Power Skills (Level 1): ในแผน Development Roadmap ผู้ตรวจคาดหวังให้มีการเติมเต็มทักษะ \"Power Skills\" ซึ่งประกอบด้วย Soft skill (เช่น ความเห็นอกเห็นใจ Empathy, การปรับตัว), Digital skill, และทักษะการคิดวิเคราะห์เชิงวิพากษ์ (Analytical/Critical thinking) เพื่อรองรับโลกยุคดิจิทัล"],"2":["จุดตายเรื่อง Non-classroom และ ROI (Level 2): นี่คือสาเหตุที่ กทท. ได้คะแนนไม่ถึงระดับ 3 ในปี 68 ผู้ตรวจระบุชัดเจนว่า กทท. มีชั่วโมง OJT/Coaching เยอะ แต่ \"ประเมินผลลัพธ์ไม่ได้\" ดังนั้นในปี 69 ต้องมี \"แบบฟอร์มการประเมินพฤติกรรมก่อน-หลังทำ OJT/Coaching\" และต้องมีการคำนวณ \"ความคุ้มค่าในการลงทุน (ROI)\" ออกมาเป็นตัวเลขหรือมูลค่าทางธุรกิจ"],"4":["Learning Ecosystem ต้องออกไปนอกองค์กร (Level 1, 4): กทท. มักจัดอบรมกันเองภายใน แต่ TRIS ระบุใน Feedback ว่าระบบนิเวศการเรียนรู้ต้องครอบคลุมถึง \"ระบบนิเวศธุรกิจ (Business Ecosystem)\" หมายความว่า ต้องมีหลักฐานการจัด \"การเรียนรู้ร่วมกับผู้มีส่วนได้ส่วนเสียภายนอก หรือ ลูกค้า (Collaborative Learning)\""]}},
  {id:"3.2",grp:"3",gname:"การพัฒนาทุนมนุษย์",gw:25.0,gs68:2.87,name:"การสืบทอดตำแหน่ง/การบริหารจัดการคนเก่ง",w:10.0,s68:2.9,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"การบริหารจัดการผู้นำและผู้มีศักยภาพสูง\" แบบครบวงจร ทั้ง 2 ขา ได้แก่ 1) แผนสืบทอดตำแหน่ง (Succession Plan) เพื่อเตรียมความพร้อมผู้บริหารและตำแหน่งสำคัญไม่ให้เกิดภาวะขาดแคลน และ 2) การบริหารจัดการคนเก่ง (Talent Management) เพื่อดึงดูด พัฒนา สร้างแรงจูงใจ และรักษาบุคลากรที่มีศักยภาพสูงไว้กับองค์กร เพื่อนำมาใช้สร้างความได้เปรียบในการแข่งขันทางธุรกิจ",levelSumm:["การวิเคราะห์ข้อมูลภายในที่เกี่ยวข้อง (โครงสร้างอัตรากำลัง ระบบประเมิน การเติบโตสายอาชีพ) รวมถึงข้อมูลจากแหล่งภายนอก (ตลาดแรงงาน แนวปฏิบัติที่ดี) เพื่อใช้จัดทำแผน SP และ Talent","การจัดทำแผนสืบทอดตำแหน่งที่มีความเป็นมาตรฐาน ครอบคลุมตั้งแต่ วิเคราะห์นโยบาย ตำแหน่งเป้าหมาย สรรหา ทำแผนพัฒนา (IDP) ติดตามประเมินผล และ จัดทำแผนบริหารจัดการคนเก่ง (ขั้นตอนคัดเลือก, ทำ IDP, เพื่อใช้ประโยชน์ในการสร้างความได้เปรียบ)","การดำเนินงานตามแผนงานประจำปีที่ครบถ้วน โดยมีกลไกติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แผนงานมีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กร และแผนงาน/ระบบงานที่สำคัญ เช่น ระบบการเรียนรู้ แผนจัดการความรู้ แผนสร้างความผูกพัน","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลง และมุ่งเน้นการพัฒนาอย่างต่อเนื่อง เพื่อให้เกิดประสิทธิภาพสูงสุด"],good:["กทท. ทำได้ดีมากในแง่ของ \"การวางระบบสำหรับผู้บริหารระดับสูง\" มีการวิเคราะห์ข้อมูลผู้เกษียณอายุ มีการทำ C-Suite Model และแลกเปลี่ยนความรู้กับ กฟภ. อย่างเป็นรูปธรรม ทำให้สอบผ่านเกณฑ์พื้นฐานในการมีระบบสืบทอดตำแหน่งและระบบ Talent"],gaps:["การที่ กทท. ประเมินตนเองไว้ที่ระดับ 5 แต่ได้คะแนนจำลองที่ 2.8500 นั้นสมเหตุสมผลในมุมมองของ TRIS อย่างยิ่ง เพราะแม้ระบบของผู้บริหารระดับสูงจะทำได้ดีเยียมถึงระดับ 4 หรือ 5 แต่ยังขาดกิจกรรมต่อเนื่องและเชือมโยงในบางประเด็นที่สำคัญ","ระบบดังกล่าวไม่ครบคลุมทั้งองค์กร และทิ้งช่องว่างในระดับปฏิบัติการหน้างานและกลุ่มคนรุ่นใหม่ ทำให้ผู้ตรวจมองว่า กระบวนการนี้ยังนำไปปฏิบัติได้ไม่สมบูรณ์แบบ"],results:["มีการวิเคราะห์อัตราการเกษียณอายุ (พบว่าระดับ 15-16 จะเกษียณมากถึงร้อยละ 80 ใน 5 ปี) จึงได้ขยายการกำหนดตำแหน่งสำคัญ (Key Strategic Position) จากเดิมที่มีแค่ผู้อำนวยการ กทท. (ระดับ 17) เพิ่มเติมอีก 4 ตำแหน่งในระดับ 14 ได้แก่ ผอ.ฝ่ายการเงินฯ, ผอ.ฝ่ายพัฒนาธุรกิจฯ, ผอ.ฝ่ายไอที, และ ผช.ผอ.ท่าเรือแหลมฉบัง มีการนำโมเดลสมรรถนะผู้บริหาร (C-Suite) 6 ด้านมาใช้ประเมินช่องว่าง","มีการนำร่องประเมินผู้บริหาร 4 คนเข้าสู่ Successor Pool และจัดกลุ่มเป็น Ready Now ได้ 4 คน ในส่วนของ Talent มีการคัดเลือกและให้ Talent ไปเป็นวิทยากรเพื่อถ่ายทอดความรู้ (KM) และทำโครงการสร้างมูลค่าเพิ่ม (Idea Box)","อ้างว่ามีการนำแนวปฏิบัติที่ดี (Best Practice) จากการเทียบเคียงกับ กฟภ. (PEA) มาปรับปรุงแผนสืบทอดตำแหน่งให้มีมาตรฐานยิ่งขึ้น"],tris:["ละเลยตำแหน่งยุทธศาสตร์ระดับปฏิบัติการ (Lack of Operational Key Positions) : ผู้ตรวจระบุชัดเจนว่า กทท. ต้องระบุตำแหน่งงานที่มีความสำคัญเชิงกลยุทธ์ \"ที่ไม่ใช่ระดับผู้บริหาร\" ด้วยตัวอย่างเช่น ตำแหน่งพนักงานขับเครื่องมือทุ่นแรง หรือช่างเทคนิคเฉพาะทาง ซึ่งหากคนกลุ่มนี้เกษียณหรือลาออก งานหน้าท่าจะสะดุดทันที แต่ กทท. ยังไม่มีแผนสืบทอดตำแหน่งรองรับคนกลุ่มนี้เลย","ขาดการดูแลกลุ่มคนเก่งรุ่นใหม่ (No Young Talent Focus) : ในกระดาษคำตอบ กทท. คัดเลือก Talent จากอายุงานและตำแหน่ง แต่ผู้ตรวจประเมินระบุว่า องค์กรต้องมุ่งเน้นการใช้ประโยชน์จากความกระตือรือร้นและความคิดสร้างสรรค์จาก \"กลุ่มบุคลากรรุ่นใหม่ (Young Talent)\" อย่างเจาะจง และต้องออกแบบแรงจูงใจ (Incentives) ให้เหมาะสมกับคนกลุ่มนี้โดยเฉพาะ","ขาดแผนบริหารจัดการผู้ที่ไม่ถูกคัดเลือก : แม้ กทท. จะบอกว่ากำลังศึกษาแนวทางบริหารผู้ที่ไม่ได้ไปต่อ (ไม่ได้รับตำแหน่ง) แต่ก็ยังไม่มีแผนรองรับที่เป็นรูปธรรม ซึ่งเป็นองค์ประกอบสำคัญของเกณฑ์ระดับสูง"],suggest:["กทท. ไม่ต้องทำใหม่ทั้งหมด แต่ให้ \"ขยายกรอบ\" (Scale up) โดยคัดเลือกตำแหน่ง Operational Key Position (เช่น พนักงานควบคุมเครื่องมือทุ่นแรงเฉพาะทาง) มา 1-2 ตำแหน่ง และทำ Succession Plan ให้กลุ่มนี้","ตั้งโครงการ \"Young Talent Incubator\" สำหรับพนักงานอายุไม่เกิน 35 ปี แยกออกมาโดยเฉพาะ เพื่อดึงศักยภาพการทำนวัตกรรม (Idea Box) ออกมาใช้งาน และจัดสวัสดิการ Fast-track ให้ชัดเจน จะช่วยปลดล็อกคะแนนให้ทะลุระดับ 3 และ 4 ได้ทันที"],docs:["แผนสืบทอดตำแหน่งระดับปฏิบัติการ (Operational Succession Plan): เอกสารแผนการสืบทอดตำแหน่งที่ระบุกลุ่มเป้าหมายเป็น \"ตำแหน่งสำคัญเชิงกลยุทธ์ระดับปฏิบัติการ\" (เช่น พนักงานขับเครื่องมือทุ่นแรงเฉพาะทาง) ไม่ใช่แค่ระดับผู้บริหาร","แผนพัฒนาและสวัสดิการกลุ่ม Young Talent: เอกสารโครงการดูแลกลุ่มคนเก่งรุ่นใหม่ (อายุไม่เกิน 35 ปี) อย่างเจาะจง เพื่อดึงศักยภาพด้านนวัตกรรม"],bestprac:["การใช้ข้อมูลภายนอกมาประกอบการวางแผน: รฟม. มีการนำ \"ข้อมูลจากแหล่งภายนอก\" (เช่น แนวโน้มตลาดแรงงาน และแนวปฏิบัติที่ดี) มาวิเคราะห์ร่วมกับข้อมูลภายใน เพื่อจัดทำแผนสืบทอดตำแหน่ง (Succession Plan) และแผนบริหารจัดการคนเก่ง (Talent Management) ทำให้แผนมีความทันสมัยและตอบโจทย์ตลาด","การดึงศักยภาพมาใช้จริง (Retention & Utilization): มีกลไกติดตามการประเมินผลกลุ่ม Talent และ Successor อย่างสม่ำเสมอ และมีการดึงศักยภาพของคนเก่งกลุ่มนี้มาใช้ประโยชน์ในการพัฒนาองค์กรอย่างชัดเจน"],minReqs:{"1":["รายงานการวิเคราะห์ข้อมูลภายในองค์กร (เช่น โครงสร้างอัตรากำลัง, ข้อมูลการเกษียณอายุล่วงหน้า)","รายงานการวิเคราะห์ข้อมูลภายนอก (เช่น แนวโน้มตลาดแรงงาน, คู่เทียบ Best Practice) เพื่อนำมาใช้กำหนดหลักเกณฑ์"],"2":["คู่มือ/แผนการสืบทอดตำแหน่ง (Succession Plan) ที่มีกระบวนการเป็นมาตรฐาน ครอบคลุมตั้งแต่การคัดเลือก, ทำ IDP, ประเมินผล และ [สิ่งที่ต้องเพิ่มปี 69] แนวทางการบริหารจัดการผู้ที่ไม่ได้รับคัดเลือก","คู่มือ/แผนการบริหารจัดการคนเก่ง (Talent Management) พร้อมหลักเกณฑ์คัดเลือกที่ชัดเจน","[สิ่งที่ต้องเพิ่มในปี 69] เอกสารระบุ \"ตำแหน่งสำคัญเชิงยุทธศาสตร์ระดับปฏิบัติการ\" (Key Strategic Position ที่ไม่ใช่ระดับผู้บริหาร เช่น พนักงานขับเครื่องมือทุ่นแรงเฉพาะทาง)","[สิ่งที่ต้องเพิ่มในปี 69] แผนงาน/โครงการดูแลกลุ่มคนเก่งรุ่นใหม่ (Young Talent) อย่างเจาะจง"],"3":["รายงานสรุปผลการจัดกลุ่มผู้สืบทอดตำแหน่ง (เช่น บัญชีกลุ่ม Ready Now, Ready Later, Ones to Watch)","รายงานผลการพัฒนาและ \"การดึงศักยภาพคนเก่งมาใช้ประโยชน์จริง (Talent Utilization)\" เช่น หลักฐานการมอบหมาย Talent ให้ทำโครงการนวัตกรรม (Project Assignment) หรือเป็นวิทยากรภายใน"],"4":["ตารางแสดงความเชื่อมโยง (Mapping) ระหว่างแผนการบริหารคนเก่ง/ผู้สืบทอดตำแหน่ง กับ แผนยุทธศาสตร์องค์กร และระบบงานที่สำคัญ (เช่น แผนการจัดการความรู้, แผนนวัตกรรม)"],"5":["ตารางสรุปข้อมูลป้อนกลับ (Feedback Table)","[สิ่งที่ต้องเพิ่มในปี 69] ตาราง Before & After แสดงผลลัพธ์การประเมินการปฏิบัติงาน (KPI) ของกลุ่ม Talent/Successor ก่อนและหลังการพัฒนา และสถิติ \"อัตราการรักษาคนเก่งให้อยู่กับองค์กร (Retention Rate)\" ที่เพิ่มขึ้น"]},subComps:{"2":["อย่ากระจุกตัวแค่ผู้บริหาร (Level 2): กทท. มักทำแผน Succession Plan เฉพาะผู้บริหาร (ระดับ N, N-1 และระดับ 14) แต่ TRIS ระบุชัดเจนว่าต้องขยายการทำแผนไปยัง \"ตำแหน่งสำคัญเชิงกลยุทธ์ระดับปฏิบัติการ\" ด้วย (Critical Workforce Segmentation) เช่น หน้างานท่าเรือที่ต้องใช้ทักษะเฉพาะทาง หากคนกลุ่มนี้เกษียณหรือลาออกจะกระทบธุรกิจทันที","จุดชี้เป็นชี้ตายคือ \"Young Talent\" (Level 2): ในโลกการทำงานยุคใหม่ TRIS คาดหวังให้องค์กรมีแผนคัดเลือกและดูแล กลุ่มคนเก่งรุ่นใหม่ (อายุไม่เกิน 35 ปี) แยกออกมาเป็นพิเศษ เพื่อนำความกระตือรือร้นและความคิดสร้างสรรค์ของคนกลุ่มนี้มาขับเคลื่อนนวัตกรรม (Innovation) ให้กับองค์กร","ต้องมีแผนดูแล \"ผู้ที่ไม่ได้รับคัดเลือก\" (Level 2): นี่คือจุดที่มักถูกมองข้าม! เกณฑ์มาตรฐานระบุว่า เมื่อประกาศผลผู้ที่ได้รับการคัดเลือกเป็น Successor หรือ Talent แล้ว องค์กรต้องมี \"แนวทางในการบริหารความรู้สึกและดูแลผู้ที่ไม่ได้รับคัดเลือก\" เพื่อป้องกันปัญหาความน้อยเนื้อต่ำใจหรือภาวะสมองไหล (Regrettable Attrition)","ให้รางวัลที่แตกต่าง (Rewards & Recognition): ต้องมีการออกแบบแรงจูงใจ (Incentive) ทั้งที่เป็น \"ตัวเงิน\" และ \"ไม่ใช่ตัวเงิน\" เช่น การส่งไปศึกษาดูงานต่างประเทศ, การให้เข้าสู่เส้นทาง Fast Track เพื่อให้คนเก่งรู้สึกว่าได้รับความสำคัญจริงๆ"],"3":["ดึงศักยภาพมาใช้งานจริง (Utilization) (Level 3-4): ผู้ตรวจจะไม่ให้คะแนนหาก Talent มีหน้าที่แค่ \"เข้าอบรม/ไปดูงาน\" แต่ต้องมีหลักฐานว่า กทท. \"นำ Talent เหล่านี้มาใช้งานอย่างไร?\" (เช่น เป็นคณะทำงานพิเศษข้ามสายงาน (Cross-functional), เป็นวิทยากรถ่ายทอดความรู้ (KM), หรือทำ Project นวัตกรรมแก้ปัญหาองค์กร)"]}},
  {id:"3.3",grp:"3",gname:"การพัฒนาทุนมนุษย์",gw:25.0,gs68:2.87,name:"การจัดการสายอาชีพ",w:5.0,s68:2.85,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมิน \"กลไกและการบริหารจัดการเส้นทางความก้าวหน้าในสายอาชีพ (Career Path & Development)\" เพื่อให้บุคลากรมองเห็นโอกาสเติบโตในองค์กร โดยต้องมีหลักเกณฑ์การหมุนเวียนงาน (Job Rotation) ที่เชื่อมโยงกับการพัฒนาทักษะ มีกลไกขับเคลื่อนที่เข้มแข็งให้คำปรึกษาและสนับสนุนอย่างเป็นรูปธรรม (เช่น CMC, CAC, Career Counselor) และสามารถบูรณาการเข้ากับระบบอื่น เช่น การสืบทอดตำแหน่ง (Succession Plan) การเรียนรู้ (L&D) และอัตรากำลังได้อย่างเป็นเนื้อเดียวกัน",levelSumm:["มีแนวทางในการจัดการความก้าวหน้าในสายอาชีพ (Career Path & Development) โดยมีหลักเกณฑ์การเคลื่อนย้ายและหมุนเวียนที่ชัดเจน รวมถึงการพัฒนาบุคลากรที่สอดคล้องกับการเติบโต","การกำหนดกลไกในการสนับสนุนการจัดการความก้าวหน้าในสายอาชีพขององค์กร เช่น คณะกรรมการจัดการความก้าวหน้าในสายอาชีพ (CMC), ศูนย์ประเมินสายอาชีพ (CAC), การให้คำปรึกษา (Career Counselor)","การดำเนินงานตามแผนงานประจำปีที่ครบถ้วน โดยมีกลไกหรือกระบวนการติดตามและประเมินผลการดำเนินงานที่มีประสิทธิภาพ และได้ผลลัพธ์ตามที่กำหนดไว้","แผนงานมีความเชื่อมโยงกับแผนยุทธศาสตร์องค์กรและแผนงาน/ระบบงานที่สำคัญ เช่น ระบบการเรียนรู้และการพัฒนา การสืบทอดตำแหน่ง การบริหารจัดการคนเก่ง การบริหารอัตรากำลัง","การใช้ข้อมูลป้อนกลับจากการดำเนินงานตามแผนงานประจำปี รวมถึงข้อมูลจากแหล่งอื่น ๆ มาปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ มุ่งเน้นการพัฒนาอย่างต่อเนื่อง"],good:["กทท. สอบผ่านในการวางโครงสร้างพื้นฐาน (Paperwork) เช่น การจัดทำ Job Family, การเขียนคู่มือ Career Path, และการตั้งคณะกรรมการ (CMC) ซึ่งเป็นการจัดเตรียมระบบในระดับที่ 1 และ 2 ตามเกณฑ์ SE-AM การนำแชทบอทมาช่วยตอบคำถามก็ถือเป็นจุดเริ่มต้นของการสื่อสารที่ดี","คะแนนจำลอง 2.8500 สะท้อนให้เห็นว่าระบบ Career Path ของ กทท. ยังเป็นเพียง \"ภาพวาดบนกระดาษ (Blueprint)\" พนักงานอาจจะรู้ว่าตำแหน่งถัดไปคืออะไร"],gaps:["\"พี่เลี้ยง (Counselor)\" ที่จะมาช่วยวางแผนว่าพนักงานคนนั้นต้องเรียนอะไรเพิ่ม หรือต้อง Rotation ไปกองไหนเพื่อจะได้เลื่อนขั้น เมื่อกระบวนการยังขาดการลงมือปฏิบัติจริง (Action) และไม่มีการหมุนเวียนคนข้ามสายงาน (Internal Mobility) คะแนนจึงยังไม่สามารถข้ามระดับ 3 ไปได้"],results:["มีการออกแบบเส้นทางความก้าวหน้าในสายอาชีพ (Career Path) ตามกลุ่มงาน (Job Family) จัดทำคู่มือรูปแบบเส้นทางความก้าวหน้าฯ และมีการมอบหมายให้คณะกรรมการ กนบ. ทำหน้าที่เป็น คณะกรรมการจัดการความก้าวหน้าในสายอาชีพ (Career Management Committee : CMC)","มีการทบทวนและแก้ไขคุณสมบัติเฉพาะของตำแหน่งงาน (Job Specification: JS) แล้วเสร็จครบ 100% (9 เรื่อง) เช่น การปลดล็อกเพศ การตัดเงื่อนไข \"ว่ายน้ำเป็น\" ออกเพื่อให้สอดคล้องกับเนื้องานจริง นอกจากนี้ยังมีการใช้ Chatbot \"น้อง PATTY\" ในการตอบข้อสงสัยพนักงานเรื่องความก้าวหน้า","อ้างว่ามีการใช้ข้อมูลป้อนกลับเพื่อนำมาทบทวนคุณสมบัติของตำแหน่งงานให้สอดคล้องกับปัจจุบันและกฎหมายกำหนด"],tris:["กลไกสนับสนุน (CMC) ยังไม่เริ่มทำงานเป็นรูปธรรม และขาดการประเมินประสิทธิผล : แม้ กทท. จะระบุว่าให้ กนบ. ทำหน้าที่เป็นคณะกรรมการ CMC แต่ผู้ประเมิน TRIS มองว่ากลไกนี้ยังไม่ทำงานอย่างชัดเจนในเชิงการเป็นที่ปรึกษาสายอาชีพ ยิ่งไปกว่านั้น TRIS ระบุในเกณฑ์ว่าควรมี \"ศูนย์ประเมินสายอาชีพ (Career Assessment Center)\" หรือ \"กลุ่มที่ปรึกษาสายอาชีพ (Career Counselor)\" ซึ่ง กทท. ยังไม่มีกลไกเหล่านี้คอยให้คำปรึกษาพนักงานแบบรายบุคคล และยังขาดการประเมินว่าคณะกรรมการชุดนี้ทำหน้าที่ได้ดีแค่ไหน","การหมุนเวียนงาน (Job Rotation) ยังไม่ถูกนำมาใช้จริงเพื่อสร้างความก้าวหน้า : แม้ กทท. จะร่างหลักเกณฑ์ Job Rotation ไว้ แต่ในกระดาษคำตอบระบุเองว่า \"อยู่ระหว่างทบทวนแนวทางการหมุนเวียนงาน เนื่องจากมีผลกระทบกับโครงสร้างองค์กรใหม่\" ผู้ประเมินจึงมองว่าเรื่องนี้ยังเป็นแค่แผน (ยังไม่ลงมือทำจริง) และยังขาดการพิสูจน์ให้เห็นว่าเมื่อพนักงานถูกหมุนเวียนข้ามสายงานแล้ว จะส่งผลต่อการเลื่อนตำแหน่ง (Career Path) อย่างเป็นรูปธรรมได้อย่างไร","การแก้ไข Job Specification เป็นเพียงงานพื้นฐาน : การแก้ไขข้อกำหนดเช่น การปลดล็อกเรื่องเพศ หรือ ใบขับขี่ ถือเป็นงานปฏิบัติการพื้นฐาน (Operation) ซึ่งดีในแง่ความเท่าเทียม แต่ยังไม่ใช่ \"กลยุทธ์การจัดการสายอาชีพขั้นสูง\" ตามที่ TRIS คาดหวังในระดับ 4 หรือ 5"],suggest:["คู่เทียบอย่าง รฟม. ได้คะแนนข้อนี้ดีกว่า กทท. เล็กน้อย เพราะมีกลไกคณะกรรมการที่คอย \"ให้คำปรึกษาเส้นทางอาชีพ\" ได้อย่างมีประสิทธิภาพ ดังนั้น เพื่อดันคะแนนให้ทะลุระดับ 3 ในปี 2569 กทท. ควรทำดังนี้","สร้าง Career Counselor (พี่เลี้ยงสายอาชีพ): จัดตั้งกลุ่มที่ปรึกษาสายอาชีพจากพนักงาน HR หรือหัวหน้างานที่ผ่านการอบรม เพื่อทำหน้าที่ให้คำปรึกษาเรื่องการวางแผนเติบโตรายบุคคล (ไม่ต้องพึ่งแค่ กนบ.)","เร่งดำเนินการ Job Rotation ข้ามสายงาน (Quick Win): ไม่ต้องรอโครงสร้างใหม่เสร็จ 100% แต่ให้ \"นำร่อง (Pilot)\" การหมุนเวียนงานข้ามสายงานในกลุ่ม Job Family เดียวกัน พร้อมบันทึกผลว่าพนักงานได้ทักษะอะไรเพิ่มขึ้น เพื่อพิสูจน์ให้ผู้ประเมินเห็นว่าระบบเริ่ม \"ทำงานได้จริง\""],docs:["รายงานประเมินประสิทธิผลคณะกรรมการจัดการสายอาชีพ (CMC Evaluation Report): เอกสารการประเมินการทำงานของกลไกคณะกรรมการจัดการสายอาชีพ (CMC) ว่าทำงานได้ผลจริงหรือไม่","รายงานผลลัพธ์การหมุนเวียนงาน (Job Rotation Impact Report): หลักฐานการนำร่อง Job Rotation ข้ามสายงาน พร้อมตารางประเมินว่าการหมุนเวียนนี้เกิดผลเชิงประจักษ์ต่อการก้าวหน้าในสายอาชีพ (Career Path) อย่างไร"],bestprac:["กลไกการให้คำปรึกษาที่เข้มแข็ง: มีการจัดตั้งกลไก (Committee) หรือกลุ่มที่ปรึกษาที่ช่วยให้คำปรึกษาด้านเส้นทางอาชีพแก่บุคลากรได้อย่างมีประสิทธิภาพและเป็นรูปธรรม (ในขณะที่ของ กทท. คณะกรรมการ CMC ยังไม่เริ่มทำงานเป็นรูปธรรม)","การหมุนเวียนงานที่นำไปสู่การเติบโตจริง: มีการกำหนดหลักเกณฑ์การเคลื่อนย้ายและหมุนเวียนบุคลากร (Job Rotation) ที่ชัดเจน และสามารถพัฒนาบุคลากรให้สอดคล้องกับการเติบโตตามเส้นทางสายอาชีพ (Career Path) ได้อย่างแท้จริง"],minReqs:{"1":["แผนผังเส้นทางความก้าวหน้าในสายอาชีพ (Career Path) และคู่มือรูปแบบเส้นทางความก้าวหน้า","ประกาศ/ระเบียบหลักเกณฑ์การเคลื่อนย้าย หมุนเวียนบุคลากร (Job Rotation) และหลักเกณฑ์การเข้าสู่ตำแหน่ง"],"2":["คำสั่งแต่งตั้งและการกำหนดบทบาทกลไกสนับสนุน เช่น คณะกรรมการจัดการความก้าวหน้าในสายอาชีพ (CMC), ศูนย์ประเมินสายอาชีพ (CAC), หรือผู้ให้คำปรึกษาสายอาชีพ (Career Counselor)","เอกสารหลักปฏิบัติในการคัดเลือกพนักงานในแต่ละระดับ (เช่น คำสั่ง กทท. ที่ 160/2565)"],"3":["รายงานผลการดำเนินงานด้านการจัดการสายอาชีพประจำปี (เช่น สถิติพนักงานที่เติบโตตาม Career Path หรือจำนวนคนที่ได้ทำ Job Rotation ข้ามสายงาน)","รายงานการประช
