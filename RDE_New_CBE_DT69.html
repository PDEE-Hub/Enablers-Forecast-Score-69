<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — DT การเปลี่ยนผ่านดิจิทัล ปี 2569</title>
<style>
@font-face{font-family:'Anakotmai';font-weight:300;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-light.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:500;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-medium.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:700;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-bold.woff2') format('woff2');}
</style>
<style>
/* ── PAT Chili Bold Editorial ── */
:root{
  --bg:#faf6f0;--bg2:#fdf1de;--card:#ffffff;
  --border:#181410;--border-s:#efe8dc;
  --text:#181410;--text2:#5c5347;--text3:#9c9184;
  --navy:#1e3a5c;--gold:#f0a92e;
  --chili:#b8291c;--chili-d:#8f1f14;
  --lv1:#b8291c;--lv2:#e8623e;--lv3:#f0a92e;--lv4:#4d9e6e;--lv5:#1f7a4a;
  --shadow:4px 4px 0 var(--border);
  --shadow-h:6px 6px 0 var(--border);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Anakotmai',sans-serif;font-size:14px;color:var(--text);line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(24,20,16,.16) 1px, transparent 1px);
  background-size:16px 16px;
}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Anakotmai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--text);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:800;color:#fff;margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* HALFTONE DIVIDER */
.halftone{height:14px;flex-shrink:0;background-image:radial-gradient(var(--text) 2.8px, transparent 2.8px);background-size:10px 10px;background-position:0 -1px;}

/* DIM HEADER — hero band */
.dim-hd{background:var(--dim);color:#fff;border-bottom:3px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;overflow:hidden;}
.dim-hd::after{content:'🌶️';position:absolute;right:20px;top:50%;transform:translateY(-50%) rotate(12deg);font-size:44px;opacity:.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));pointer-events:none;}
.dim-hd>*{position:relative;z-index:1;}
#dimTitle{font-size:16px;font-weight:800;}
#deltaChip{background:rgba(255,255,255,.92);padding:2px 9px;border-radius:20px;text-shadow:none;}

/* CHIPS */
.chip{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:700;white-space:nowrap;border:2px solid transparent;}
.cn{background:#fff;color:var(--text2);border-color:var(--text2);}
.ct{background:#fff;color:#0f7a3d;border-color:#0f7a3d;}
.cr{background:#fff;color:var(--chili-d);border-color:var(--chili-d);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 111px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:3px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--gold);color:var(--text);letter-spacing:.2px;border-bottom:3px solid var(--border);}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:2px solid var(--border-s);border-top:3px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:13px;font-weight:900;color:var(--chili-d);min-width:16px;}
.grp-name{font-size:12px;font-weight:700;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;border:1.5px solid var(--border-s);}
.chk-all{background:#e4f5e4;color:#1a7a4a;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1.5px solid var(--border-s);transition:background .12s;background:var(--card);}
.sub:hover{background:var(--bg2);}
.sub.focus-cg{background:#fff3e2;border-left:4px solid var(--dim, var(--chili));}
.sub.focus-cg .sub-target{border-left-color:var(--dim, var(--chili));}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;font-weight:500;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--border);}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border-s);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:800;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--chili-d);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--chili);box-shadow:0 0 0 2px rgba(184,41,28,.15);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1.5px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap;border:1.5px solid transparent;}
.s0{background:var(--bg2);color:var(--text3);border-color:var(--border-s);}
.s1{background:rgba(240,169,46,.18);color:#92400e;border-color:rgba(240,169,46,.4);}
.s2{background:rgba(31,122,74,.14);color:#0f7a55;border-color:rgba(31,122,74,.35);}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:3px solid var(--border);background:var(--card);flex-shrink:0;}
.cl-title{font-size:12px;font-weight:800;color:var(--chili-d);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--chili);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1.5px dashed var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--text);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:700;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:14px 16px;gap:14px;}
.frame{border:3px solid var(--border);border-radius:var(--radius);box-shadow:6px 6px 0 var(--border);overflow:hidden;background:var(--card);flex-shrink:0;}
.frame-hd{padding:10px 16px;font-size:12.5px;font-weight:800;border-bottom:3px solid var(--border);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:14px 16px;font-size:13px;line-height:1.7;}
.ftag{font-size:10px;padding:2px 9px;border-radius:8px;font-weight:900;}
.fa-hd{background:var(--chili);color:#fff;}.fa-tag{background:rgba(255,255,255,.3);color:#fff;}
.fb-hd{background:var(--gold);color:var(--text);}.fb-tag{background:rgba(0,0,0,.12);color:var(--text);}
.fc-hd{background:#1f7a4a;color:#fff;}.fc-tag{background:rgba(255,255,255,.25);color:#fff;}
.fd-hd{background:var(--navy);color:#fff;}.fd-tag{background:rgba(255,255,255,.25);color:#fff;}
.fe-hd{background:var(--navy);color:#fff;}.fe-tag{background:rgba(255,255,255,.25);color:#fff;}

.box{border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;border:1.5px solid var(--border-s);}
.box-red{background:rgba(184,41,28,.06);color:#7a1010;border-left:3px solid var(--chili);border-color:rgba(184,41,28,.2);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--chili-d);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;font-weight:700;}
.exp-btn:hover{background:var(--border-s);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg2);border-bottom:3px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:800;color:var(--chili-d);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:var(--bg2);border-left:4px solid var(--chili);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;border:1.5px solid var(--border-s);border-left:4px solid var(--chili);}
.cg-lvl-row{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--chili);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;}
.cg-lvl-summ .kt{font-weight:800;color:var(--chili-d);}
.cg-toggle{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);padding:0 4px;flex-shrink:0;}
.cg-lvl-detail{padding:8px 14px 10px;background:var(--bg2);border-top:1.5px dashed var(--border-s);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1.5px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:8px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--chili);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--chili);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 6px 6px 0;background:rgba(184,41,28,.05);line-height:1.55;}
.cg-prog-bar{height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;margin-bottom:8px;overflow:hidden;}
.cg-prog-fill{height:100%;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:8px;border:1.5px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:800;color:var(--chili-d);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:#f5e8cc;}
.doc-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--gold);color:var(--text);flex-shrink:0;border:1.5px solid var(--border);}
.doc-lvl-title{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1.5px solid var(--border-s);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:var(--chili-d);font-weight:800;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:var(--bg2);border:1.5px dashed var(--gold);border-radius:8px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:var(--bg2);border:1.5px solid var(--border-s);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--chili-d);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.doc-chk{flex-shrink:0;margin-top:2px;accent-color:var(--chili);width:15px;height:15px;cursor:pointer;}
.doc-progbar{height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;overflow:hidden;margin:6px 0 4px;}
.doc-progbar-fill{height:100%;background:var(--lv5);transition:width .3s;}

/* FRAME E — Self-Assessment */
.sa-block{margin-bottom:8px;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.sa-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(31,122,74,.08);cursor:pointer;transition:background .12s;}
.sa-hd:hover{background:rgba(31,122,74,.14);}
.sa-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--lv5);color:#fff;flex-shrink:0;}
.sa-title{font-size:13px;font-weight:700;color:#0f7a55;flex:1;}
.sa-copy-btn{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--lv5);color:#fff;border:none;cursor:pointer;font-weight:700;white-space:nowrap;transition:opacity .15s;}
.sa-copy-btn:hover{opacity:.85;}
.sa-body{padding:12px 16px;display:none;background:var(--card);font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;font-family:'Anakotmai',sans-serif;border-top:1.5px solid var(--border-s);}
.sa-body.open{display:block;}
.sa-note{font-size:12px;color:var(--lv5);font-style:italic;margin-top:6px;padding-top:6px;border-top:1.5px dashed rgba(31,122,74,.3);}

/* ── Frame E dynamic ── */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;flex-wrap:wrap;border-bottom:1.5px solid var(--border-s);margin-bottom:8px;}
.fe-sect-lbl{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 5px;padding:0 2px;}
.fe-lvl-block{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s;}
.fe-lvl-block.fe-lvl-active{border-color:var(--lv5);}
.fe-lvl-block:hover{box-shadow:var(--shadow-h);}
.fe-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.fe-lvl-hd:hover{background:var(--bg2);}
.fe-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:13px;color:var(--text);flex:1;line-height:1.35;}
.fe-doc-ref{font-size:10px;color:var(--text3);white-space:nowrap;}
.fe-lvl-body{padding:10px 14px 12px;background:var(--card);border-top:1.5px solid var(--border-s);display:none;}
.fe-lvl-body.open{display:block;}
.fe-sa-text{font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;font-family:'Anakotmai',sans-serif;background:var(--bg2);padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.fe-textarea{width:100%;font-size:13px;font-family:'Anakotmai',sans-serif;border:1.5px solid var(--border);border-radius:var(--radius);padding:7px 10px;background:#fff;color:var(--text);line-height:1.6;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:var(--chili);box-shadow:0 0 0 2px rgba(184,41,28,.15);}
.fe-cross-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.fe-cross-chip{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:800;}
.fe-gap-item{margin-bottom:8px;background:rgba(184,41,28,.04);border:1.5px solid rgba(184,41,28,.18);border-radius:8px;padding:8px 10px;}
.fe-gap-text{font-size:12px;color:#7a1010;margin-bottom:6px;line-height:1.5;}
.fe-gap-status{display:flex;gap:12px;flex-wrap:wrap;}
.fe-radio-lbl{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;color:var(--text2);}
.fe-radio-lbl input{accent-color:var(--chili);}
.fe-gap-note{margin-top:6px;}
.fe-copy-btn{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--lv5);color:#fff;border:none;cursor:pointer;font-weight:700;white-space:nowrap;transition:opacity .15s;float:right;}
.fe-copy-btn:hover{opacity:.85;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;}
