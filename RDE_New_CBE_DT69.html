  {id:"1.2",grp:"1",gname:"การกำกับดูแลด้านเทคโนโลยีดิจิทัล และแผนปฏิบัติการดิจิทัล",gw:25,gs68:2.75,name:"แผนปฏิบัติการดิจิทัลระยะ 3-5 ปี (Digital Roadmap)",w:12.5,s68:2.75,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินคุณภาพแผนปฏิบัติการดิจิทัลระยะ 3-5 ปี ครอบคลุม Strategic Alignment กับแผนวิสาหกิจ ความสมบูรณ์กระบวนการวางแผน การสื่อสารสู่ระดับปฏิบัติการ การวัด Outcome และ Agility",dimLevels:["Strategic Alignment: ทิศทางแผนไอทีสนับสนุนวิสัยทัศน์และยุทธศาสตร์หลักองค์กร","Process & Resource Planning: ความสมบูรณ์กระบวนการวางแผน เตรียมทรัพยากรพร้อมก่อนเริ่ม","Deployment & Execution: สื่อสารถ่ายทอดเป้าหมายสู่ระดับปฏิบัติการ และลงมือทำจริง","Performance Measurement: วัดผลสัมฤทธิ์เชิงคุณค่าที่ผลกระทบทางธุรกิจและบริการ","Agility & Continuous Improvement: ความยืดหยุ่นปรับตัว ใช้องค์ความรู้ปรับแผน"],levelSumm:["จัดทำแผนดิจิทัลระยะ 3-5 ปี + สอดคล้องกับแผนยุทธศาสตร์ + ขออนุมัติ","จัดทำคู่มือกระบวนการวางแผน + ระบุขั้นตอน ผู้รับผิดชอบ กรอบเวลา ทรัพยากร","จัดทำ Action Plan Deployment + RACI + แผนสื่อสาร + หลักฐาน Implementation","จัดทำ Dashboard ติดตามผล Outcome + กำหนด Leading/Lagging Indicator","วิเคราะห์ Root Cause + จัดทำ Plan Revision + บันทึก AAR ลงระบบ KM"],good:["กำหนดกระบวนการจัดทำแผนปฏิบัติการดิจิทัลและแผนประจำปีอย่างเป็นระบบ สามารถทำซ้ำได้และเป็นมาตรฐาน","แผนมีความเชื่อมโยงกับแผนวิสาหกิจและนโยบายต่างๆ อย่างชัดเจน","มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสีย ทำแผนสื่อสาร และมีการประเมินผลการรับรู้","เริ่มมีการแสดงรายละเอียดแผนครอบคลุม Digital Transformation ทั้งด้านกระบวนการ บุคลากร เทคโนโลยี"],gaps:["หลักฐาน Implementation ยังไม่สะท้อนภาพรวมทั้งองค์กร และเป้าหมายส่วนใหญ่ยังไม่เป็นแบบ SMART หรือไม่สะท้อน Outcome ที่แท้จริง","จุดตาย: แผน Roadmap ขาดความเชื่อมโยงกับมิติของ 'คน' (HR) ซึ่งเป็นข้อต่อสำคัญในการทำ Digital Transformation — TRIS เรียก 'แผนทิ้งคนไว้ข้างหลัง'"],results:["(L1-2) มีคู่มือปฏิบัติงานการทำแผน แผนดิจิทัล 68-70 เชื่อมโยงปัจจัยนำเข้า (SWOT, แผนวิสาหกิจ, แผนแม่บทต่างๆ) อย่างครบถ้วน","(L3) มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI) แผนสื่อสาร ประเมินการรับรู้ และระบุว่าได้นำแผนไปปฏิบัติผ่านโครงการ เช่น Digital Twin LCP","(L4-5) มีการกำหนดการวัด ติดตาม วิเคราะห์ตัววัดผลลัพธ์ (Outcome) และนำผลลัพธ์เข้าสู่กระบวนการทบทวนเพื่อปรับปรุงแผน"],tris:[],suggest:[],docs:[],bestprac:[],actions:["บูรณาการแผน DT ร่วมกับ HR อย่างใกล้ชิด: ต้องระบุว่าโครงการดิจิทัลแต่ละโครงการส่งผลกระทบต่ออัตรากำลังอย่างไร และมีแผน Upskill/Reskill รองรับ","ตั้งเป้าหมายแบบ SMART: ตัวชี้วัดต้องเฉพาะเจาะจง วัดได้ ทำได้จริง มีกรอบเวลาชัดเจน","ยกระดับการประเมินผลสื่อสาร: เปลี่ยนจากวัด 'จำนวนคนที่รับทราบ' ไปเป็นวัด 'ร้อยละพนักงานที่เข้าใจบทบาทตนเองในแผน Digital Roadmap'"],minReqs:{"1":["แผนปฏิบัติการดิจิทัลระยะ 3-5 ปี หรือแผนแม่บทด้านดิจิทัล ที่ได้รับการอนุมัติจากคณะกรรมการและสอดคล้องกับแผนยุทธศาสตร์องค์กร"],"2":["คู่มือหรือกระบวนการจัดทำแผนปฏิบัติการดิจิทัล ที่ระบุกิจกรรมต่างๆ ไว้ชัดเจน (ต้องมีครบทุกข้อย่อยด้านล่าง)","ขั้นตอนการทำงาน","ผู้รับผิดชอบ","กรอบเวลา","การจัดสรรทรัพยากร (เงิน, คน, ระบบ)"],"3":["เอกสารการถ่ายทอดแผนสู่การปฏิบัติ (Action Plan Deployment)","เอกสารวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI) และแผนการสื่อสาร","แบบสรุปผลการประเมินการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): โครงการหรือแผนงานที่เริ่มดำเนินการจริงตามกรอบเวลา"],"4":["Dashboard หรือรายงานติดตามผลสำเร็จของแผนปฏิบัติการ ที่แสดงตัวชี้วัดระดับผลลัพธ์ (Outcome) รวมถึงตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator)"],"5":["รายงานการประชุมคณะกรรมการที่แสดงการวิเคราะห์สาเหตุของปัญหา (Root Cause) กรณีที่แผนไม่บรรลุเป้า","รายงานการปรับปรุง/ทบทวนแผนปฏิบัติการ (Plan Revision)","หลักฐานการนำบทเรียน (Lesson Learned / AAR) จัดเก็บลงระบบ KM"]},subComps:{"2":["มิติความเสี่ยง: การจัดทำแผนดิจิทัล ต้องมีการวิเคราะห์ความเสี่ยงของแผนงาน (Project Risk) ซ่อนอยู่ก่อนเสมอ","มิติคน (HRM/HRD): ต้องมีกระบวนการประเมินว่าองค์กรมี \"บุคลากรที่มีทักษะเพียงพอ\" หรือไม่ ครอบคลุม Digital Literacy หรือแผน Upskill/Reskill"],"3":["มิติคน (HRM/HRD): เรื่อง Digital Literacy หรือแผน Upskill/Reskill ต้องปรากฏเป็นส่วนหนึ่งของแผนดิจิทัลที่นำไปปฏิบัติจริงแล้ว"],"4":["มิติสัญญาณเตือนภัย (Early Warning System): ต้องมีการตั้งค่า Trigger Point หรือระบบเตือนภัยล่วงหน้าที่ผูกกับ Leading Indicator เพื่อปรับเปลี่ยนแผนได้ทันทีหากมีแนวโน้มไม่บรรลุเป้าหมาย"],"5":["มิติสัญญาณเตือนภัย (Early Warning System): ต้องแสดงหลักฐานว่าระบบเตือนภัยล่วงหน้าถูกใช้จริงประกอบการทบทวน/ปรับเปลี่ยนแผนงาน"]}},
  {id:"2.1",grp:"2",gname:"การนำเทคโนโลยีดิจิทัลมาปรับใช้กับทุกส่วนขององค์กร (Digital Transformation)",gw:25,gs68:2.166,name:"การวิเคราะห์และจัดทำสถาปัตยกรรมองค์กร (Enterprise Architecture)",w:9,s68:2.166,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์และการประยุกต์ใช้ EA ครอบคลุมตั้งแต่ Initiation ความครบถ้วน 5 Domains การนำ EA ลงสู่การปฏิบัติจริง (Enforceability) การวัดความคุ้มค่า (ROI/Value) และ Agility",dimLevels:["Initiation: มีกรอบคิดและทิศทางการทำ EA","Completeness & Standardization: EA ครบ 5 Domains (Business, Data, Application, Infrastructure, Security) + แผนเปลี่ยนผ่าน PPT","Deployment & Enforceability: EA เป็น 'กฎเหล็ก' — ทุกโครงการดิจิทัลต้องผ่าน EA Compliance ก่อนอนุมัติ","Value Realization: วัดความคุ้มค่า (ROI) ทั้ง Business Value และ Public Value","Agility & Knowledge: EA ถูกปรับปรุงทันสมัยเมื่อธุรกิจเปลี่ยน"],levelSumm:["จัดทำนโยบาย/Framework EA + ขออนุมัติผู้บริหาร","จัดทำ EA As-Is/To-Be ครบ 5 Domains + แผนเปลี่ยนผ่าน PPT + ประเมินความคุ้มค่า","จัดทำ RACI + แผนสื่อสาร + EA Compliance Checklist สำหรับคัดกรองโครงการ IT","จัดทำรายงาน Outcome ครอบคลุม Business Value และ Public Value","นำผลประเมิน EA ทบทวนแผนแม่บทดิจิทัล + จัดเก็บลงระบบ KM"],good:["กำหนดกระบวนการวิเคราะห์และจัดทำ EA แสดงภาพปัจจุบัน (As-Is) และอนาคต (To-Be)","EA ครอบคลุมครบ 5 ด้าน: Business, Data, Application, Infrastructure และ Security Architecture","เริ่มมีการกำหนดแนวทางการประเมินประสิทธิผลและความคุ้มค่าของการนำ DT มาปรับใช้"],gaps:["กทท. สอบผ่านแค่ L1-2 (มีเอกสาร As-Is/To-Be) — ตกใน L3 เพราะ EA ยังเป็นแค่ 'กระดาษพิมพ์เขียว' ไม่ได้บังคับใช้กับโครงการ IT จริง","ขาดรายละเอียดผลลัพธ์แบบองค์รวม (People, Process, Technology) โดยเฉพาะมิติ 'คน' เช่น Upskill/Reskill","ขาดการประเมินมูลค่า (Public Value และ Business Value) เชิงตัวเลข"],results:["(L1-2) มีคู่มือ EA As-Is และ To-Be ครบทั้ง 5 มิติ","(L3-5) ระบุว่ามีการกำหนดการวัด ติดตาม วิเคราะห์ตัววัดผลลัพธ์ (Outcome) และนำผลลัพธ์เข้าสู่กระบวนการทบทวนเพื่อปรับปรุงและทำนวัตกรรม"],tris:[],suggest:[],docs:[],bestprac:[],actions:["บังคับใช้ EA กับทุกโครงการ IT: ตั้งกฎเกณฑ์ให้ทุกโครงการดิจิทัลต้องผ่าน EA Compliance ก่อนอนุมัติ","วัดผลลัพธ์ใน 3 มิติ (PPT): ตัวชี้วัดโครงการต้องวัดว่ากระบวนการ (Process) ไร้รอยต่อขึ้นอย่างไร และคน (People) ได้รับการ Upskill/Reskill อย่างไร","เน้นการสร้าง Public Value และ Business Value: แปลงผลลัพธ์ระบบดิจิทัลออกมาเป็นตัวเลขทางเศรษฐศาสตร์และการเพิ่มขีดความสามารถ"],minReqs:{"1":["นโยบายหรือกรอบแนวทาง (Framework) การจัดทำสถาปัตยกรรมองค์กร ที่ได้รับการอนุมัติจากผู้บริหารระดับสูง"],"2":["คู่มือกระบวนการจัดทำสถาปัตยกรรมองค์กร ที่ระบุรายละเอียดบังคับครบถ้วน (ต้องมีครบทุกข้อย่อยด้านล่าง)","ต้องมีเอกสารแสดงภาพปัจจุบัน (As-Is) และภาพอนาคต (To-Be)","ต้องครอบคลุม 5 โดเมน: Business, Data, Application, Infrastructure, Security","มีแผนการเปลี่ยนผ่าน (Digital Transformation) ที่ครอบคลุม 3 ด้าน: บุคลากร (People), กระบวนการ (Process) และเทคโนโลยี (Technology)","มีแนวทางการประเมินความคุ้มค่าของการทำ Digital Transformation"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสาร","แบบสรุปผลการประเมินการรับรู้ของพนักงานและผู้ที่เกี่ยวข้อง","หลักฐานเชิงประจักษ์ (Implementation): เอกสารแสดงการนำกรอบ EA ไปบังคับใช้เป็นเกณฑ์ในการคัดเลือกหรืออนุมัติโครงการ IT จริงๆ (เช่น แบบฟอร์ม Project Charter ที่ต้องติ๊กว่าสอดคล้องกับ EA โดเมนไหน)"],"4":["Dashboard หรือรายงานประเมินผลลัพธ์ (Outcome) ของการเปลี่ยนผ่านสู่ดิจิทัล ที่แสดงให้เห็นถึง Business Value (รายได้เพิ่ม/ลดต้นทุน) และ Public Value (บริการประชาชนดีขึ้น)"],"5":["รายงานการนำผลประเมิน EA ไปทบทวนเพื่อปรับปรุงแผนแม่บทดิจิทัล และนำความรู้ไปจัดเก็บเป็นนวัตกรรมลงระบบ KM"]},subComps:{"2":["จุดเริ่มต้นของ Business Architecture: EA ต้องเริ่มจากยุทธศาสตร์ ไม่ใช่เริ่มจากโปรเจกต์ — การทำ Business Architecture ต้องตั้งต้นจากการทบทวน Work System และ Key Work Process ซึ่งเป็นงานของฝั่งยุทธศาสตร์ (SP) ไม่ใช่งานของฝั่ง IT","The \"PPT\" Trap: แผน Digital Transformation ต้องมีแผนจัดการ \"บุคลากร (People)\" และ \"ปรับกระบวนการ (Process)\" ควบคู่ไปกับ \"ระบบ (Technology)\" เสมอ ห้ามเขียนแค่ว่าจะซื้อระบบอะไรใหม่"],"4":["End-to-End Process: ตัวชี้วัดของ EA ต้องสะท้อนการปรับปรุงงานแบบ \"ไร้รอยต่อ (End-to-End Process)\" ตั้งแต่ต้นน้ำยันปลายน้ำ ไม่ใช่วัดแค่แผนกใดแผนกหนึ่ง"]}},
  {id:"2.2",grp:"2",gname:"การนำเทคโนโลยีดิจิทัลมาปรับใช้กับทุกส่วนขององค์กร (Digital Transformation)",gw:25,gs68:2.166,name:"การบริหารโครงการและการดำเนินงานด้านเทคโนโลยีดิจิทัลอย่างมีประสิทธิภาพ (Project Management)",w:8,s68:2.166,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์กระบวนการบริหารโครงการดิจิทัล ครอบคลุม Framework, Project Life Cycle, Execution, Value Realization และ Continuous Improvement",dimLevels:["Framework: มีแนวทางมาตรฐานสำหรับบริหารโครงการ","Project Life Cycle: ครบทุกขั้นตอน Initiate > Plan > Execute > Monitor > Close","Communication & Execution: โครงการต้องเดินตามกฎจริง ไม่ใช่มีคู่มือแต่ทำจริงใช้ทางลัด","Value Realization: ไม่ใช่แค่วัดว่าโครงการเสร็จทันเวลา แต่วัดว่าสร้างประโยชน์จริง","Continuous Improvement: เรียนรู้จากความผิดพลาด จัดการองค์ความรู้"],levelSumm:["จัดทำคู่มือบริหารโครงการ DT + ขออนุมัติอย่างเป็นทางการ","จัดทำคู่มือครอบคลุม Full Project Life Cycle + TOR, ROI, ความเสี่ยง, Lesson Learned","จัดทำ RACI + แผนสื่อสาร + Project Portfolio พร้อมลายเซ็นรับรองครบขั้นตอน","จัดทำ Project Outcome Dashboard + พิสูจน์ Outcome ทางธุรกิจตาม 68ก.","จัดทำ AAR/Lesson Learned + นำบทเรียนอัปเดตคู่มือบริหารโครงการ"],good:["กำหนดกระบวนการบริหารโครงการและแนวปฏิบัติที่เป็นระบบ ทำซ้ำได้ และเป็นมาตรฐาน","ขอบเขตครอบคลุมตั้งแต่การบริหารแผนงาน Requirement การแก้ปัญหา Change Management และการยอมรับการเปลี่ยนแปลง","มีการกำหนดแนวทางประเมินความสำเร็จ แผนบริหารความเสี่ยงโครงการ และ Post-implementation Review","มีการถ่ายทอดแนวปฏิบัติทั่วองค์กร วิเคราะห์ผู้มีส่วนได้ส่วนเสีย และเริ่มประเมินการรับรู้"],gaps:["หลักฐาน Implementation ยังไม่ชัดเจน: การมีคู่มือและแผนสื่อสาร (L1-3) ยังไม่เพียงพอ หากไม่สามารถพิสูจน์ว่าผู้ปฏิบัติงานนำไปใช้บริหารโครงการได้จริงทั้งองค์กร","กับดัก Output vs Outcome: ตัววัดส่วนใหญ่เป็น Output เช่น 'โครงการเสร็จตามเวลา' ไม่ได้สะท้อน Outcome เช่น 'โครงการทำให้รายได้เพิ่มขึ้นเท่าไร'","ขาดการกำหนด Leading และ Lagging Indicator เพื่อนำไปสู่การปรับปรุงกระบวนการอย่างต่อเนื่อง"],results:["(L1-2) มี 'คู่มือการบริหารโครงการด้าน DT' ครอบคลุม TOR, ROI, การบริหารความเสี่ยง และ Change Management","(L3) มีการทำ Stakeholder Analysis, RACI Matrix, แผนสื่อสาร และรายงานสรุปผลการประเมินการรับรู้ของพนักงาน","(L4-5) มีการกำหนดตัวชี้วัดผลลัพธ์ (Outcome) มีการประเมินหลังสิ้นสุดโครงการ (Lesson Learned) และรายงานผลต่อคณะกรรมการ"],tris:[],suggest:[],docs:[],bestprac:[],actions:["รื้อระบบ KPIs: กำหนด Leading Indicator (เช่น ความพร้อมของระบบทดสอบ) และ Lagging Indicator (เช่น ความพึงพอใจหลังการใช้งานจริง) และเปลี่ยนจาก Output ไปสู่ Outcome","ยกระดับการวัดผลการสื่อสาร: วัดว่าร้อยละ 90 ของ Project Manager เข้าใจและสามารถเขียน TOR / บริหารโครงการตามมาตรฐานใหม่ได้จริง"],minReqs:{"1":["คู่มือการบริหารโครงการด้านเทคโนโลยีดิจิทัล ที่ได้รับการอนุมัติอย่างเป็นทางการ"],"2":["คู่มือการบริหารโครงการต้องครอบคลุมวงจรชีวิตโครงการ (Project Life Cycle) อย่างครบถ้วน (ต้องมีครบทุกข้อย่อยด้านล่าง)","ก่อนเริ่มโครงการ: เอกสารวิเคราะห์ความต้องการ/ปัญหา, การจัดทำร่าง TOR","การวางแผน: เอกสารแบบฟอร์มคำชี้แจงงบลงทุน (เช่น แบบ 68 ก.) ที่วิเคราะห์ความคุ้มทุนด้านการเงินและเศรษฐศาสตร์ และการวิเคราะห์ความเสี่ยง","การจัดซื้อจัดจ้าง: หลักฐานการปฏิบัติตาม พ.ร.บ. จัดซื้อจัดจ้างฯ 2560","การดำเนินการและติดตาม: แผนดำเนินโครงการ (Gantt Chart), รายงานความคืบหน้าโครงการประจำเดือน","การปิดโครงการ: รายงานการตรวจรับ, แบบประเมินผลหลังสิ้นสุดโครงการ (Lesson Learned)"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI Matrix) ประจำโครงการ","แผนการสื่อสารโครงการ และผลประเมินการรับรู้","หลักฐานเชิงประจักษ์ (Implementation): แฟ้มสรุปโครงการ IT ที่สำเร็จจริงในปีนั้น (Project Portfolio) ที่มีลายเซ็นรับรองตามขั้นตอนในคู่มือเป๊ะๆ"],"4":["Dashboard/รายงานวัดผลสัมฤทธิ์ของโครงการ (Project Outcome Report) ที่แสดงว่าโครงการ IT ที่ทำเสร็จไปนั้น สร้างผลลัพธ์ (Outcome) ทางธุรกิจได้จริงตามที่ระบุไว้ในแบบ 68 ก. ตอนตั้งของบประมาณ"],"5":["รายงานการถอดบทเรียน (AAR / Lesson Learned) กรณีที่โครงการล้มเหลว ล่าช้า หรือสำเร็จเกินคาด และหลักฐานการนำบทเรียนนี้ไปอัปเดตปรับปรุง \"คู่มือการบริหารโครงการ\" ให้ดีขึ้นในเวอร์ชันถัดไป"]},subComps:{"2":["The EA Checkpoint: ในขั้นตอนริเริ่มโครงการ ต้องมีฟอร์มที่ระบุว่า \"โครงการนี้สอดคล้องกับกรอบ Enterprise Architecture (EA) ในข้อ DT 2.1\" นี่คือจุดที่ใช้พิสูจน์การ Implementation ของข้อ 2.1 ด้วย"],"3":["Change Management: เวลาระบบใหม่กำลังจะขึ้น (Go-live) ต้องมีแผนการจัดการความเปลี่ยนแปลง (Change Management) รวมถึงการอบรม (Training) ให้พนักงานใช้งานระบบเป็น ซึ่งเป็นเนื้องานร่วมกับ HR"],"4":["Post-Implementation Review: การวัดผล Outcome ไม่สามารถวัดได้ทันทีที่ส่งมอบงาน แต่ต้องวัดหลังจากใช้งานไประยะหนึ่ง (เช่น 3-6 เดือน) จึงบังคับกลายๆ ว่าต้องมีรายงานติดตามประเมินผลหลังการใช้งาน (Post-Implementation Review)"]}},
  {id:"2.3",grp:"2",gname:"การนำเทคโนโลยีดิจิทัลมาปรับใช้กับทุกส่วนขององค์กร (Digital Transformation)",gw:25,gs68:2.166,name:"การจัดการด้านคุณภาพ (Quality Management)",w:8,s68:2.166,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ QMS สำหรับโครงการ DT ครอบคลุม Policy ความครบถ้วน QMS Process & Audit Planning การลงมือ (Execution) Value Realization และ Continuous Improvement",dimLevels:["Policy: มีนโยบายให้ความสำคัญกับคุณภาพการพัฒนาระบบดิจิทัล","Process & Audit Planning: ความครบถ้วนของมาตรฐาน QA/QC ตลอดวงจรชีวิตโครงการ และแผน Computer Audit","Execution & Assurance: ลงมือปฏิบัติตามมาตรฐาน โครงการ IT ต้องผ่านการตรวจ QA/QC จริง","Value Realization: วัดว่าระบบที่ได้มาตรฐานช่วยลดข้อผิดพลาดหรือเพิ่มความพึงพอใจ","Continuous Improvement: นำ Audit Findings มาอุดช่องโหว่ QMS"],levelSumm:["จัดทำนโยบาย/Framework QMS + ขออนุมัติผู้บริหาร","จัดทำ QMS Manual + กำหนด QA/QC Standards + Quality Management Plan + Digital Audit","จัดทำ RACI + แผนสื่อสาร + ดำเนินการ Digital Audit จริง + รายงาน QA/QC","จัดทำ Dashboard ด้านคุณภาพ + กำหนด Leading/Lagging Indicator","นำ Audit Findings ปรับปรุง QMS + จัดเก็บ AAR ลงระบบ KM"],good:["เริ่มมีการจัดการด้านคุณภาพด้านการพัฒนา DT","มีแนวทางการเลือกเครื่องมือหรือเทคนิคการจัดการด้านคุณภาพที่ชัดเจน","มีการจัดตั้งและดำเนินการตรวจสอบด้าน DT (Digital Audit หรือ Computer Audit)"],gaps:["เอกสารที่มีอยู่ยังไม่ตอบโจทย์ระดับ 2: TRIS มองว่า กทท. 'เพิ่งจะเริ่มมีแนวทาง' และ QMS Good Practices ยังไม่ชัดเจนพอ กระบวนการยังไม่เป็น Standardized Practice","ขาดหลักฐานการนำไปใช้จริงทั่วองค์กร: ตัวชี้วัดยังไม่ใช่ Leading/Lagging Indicator ที่สามารถประเมินประสิทธิผลเพื่อปรับปรุงงานได้อย่างแท้จริง"],results:["(L1-2) มีคู่มือกระบวนการจัดการคุณภาพ ครอบคลุมการกำหนดมาตรฐาน เครื่องมือ/เทคนิค Quality Management Plan, QMS Good Practices และ Computer Audit","(L3) มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI Chart) และถ่ายทอดกระบวนการแก่ผู้มีส่วนได้ส่วนเสีย","(L4-5) มีการกำหนดการวัด ติดตาม วิเคราะห์ตัววัดผลลัพธ์ (Outcome) และนำผลลัพธ์เข้าสู่กระบวนการทบทวนปรับปรุง"],tris:[],suggest:[],docs:[],bestprac:[],actions:["จัดทำคู่มือและตัวอย่าง QMS Good Practices ให้ชัดเจน: รวบรวม Use Cases หรือตัวอย่างการทำงานด้านคุณภาพที่ประสบความสำเร็จ","พัฒนาระบบ KPIs: กำหนด Leading (เช่น อัตราความผิดพลาดระหว่างทดสอบระบบ) และ Lagging (เช่น จำนวนปัญหาด้านคุณภาพหลังส่งมอบ) Indicator","ยกระดับ Implementation: นำมาตรฐานคุณภาพไปบังคับใช้กับทุกโครงการพัฒนาดิจิทัลอย่างเป็นระบบ"],minReqs:{"1":["นโยบายหรือกรอบแนวทาง (Framework) ในการจัดการด้านคุณภาพของโครงการเทคโนโลยีดิจิทัล ที่ได้รับการอนุมัติจากผู้บริหาร"],"2":["คู่มือกระบวนการจัดการด้านคุณภาพ (QMS Manual) ที่ต้องมีองค์ประกอบบังคับครบถ้วน (ต้องมีครบทุกข้อย่อยด้านล่าง)","การกำหนดขอบเขตและมาตรฐานการจัดการด้านคุณภาพ (QMS Standards)","แนวทางการเลือกใช้เครื่องมือ/เทคนิคการจัดการด้านคุณภาพ","การจัดทำ Quality Management Plan พร้อมระบุบทบาทหน้าที่","การจัดทำวิธีปฏิบัติที่เป็นเลิศ (QMS Good Practices)","คู่มือการตรวจสอบด้านดิจิทัล (Digital/Computer Audit)"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสารเรื่องคุณภาพ","รายงานผลการประเมินการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): รายงานผลการดำเนินการตรวจสอบด้านเทคโนโลยีสารสนเทศ (Digital Audit Report) จากฝ่ายตรวจสอบที่เกิดขึ้นจริงในปีนั้น หรือรายงานการควบคุมคุณภาพ (QA/QC Report) ในโครงการ IT"],"4":["Dashboard หรือรายงานประเมินผลลัพธ์ (Outcome) ของการจัดการคุณภาพ ที่มีตัวชี้วัดนำ (Leading) และตัวชี้วัดตาม (Lagging)"],"5":["รายงานการถอดบทเรียน (AAR) จากข้อค้นพบ (Audit Findings) ในการตรวจสอบระบบ นำไปสู่การปรับปรุงคู่มือ/มาตรฐาน QMS ให้รัดกุมยิ่งขึ้น และจัดเก็บในระบบ KM"]},subComps:{"2":["The Audit Independence: แม้เป็นงานของสายงาน IT แต่คู่มือ Digital/Computer Audit ถูกระบุว่าเป็น \"หน้าที่ของฝ่ายตรวจสอบ\" ดังนั้นกระบวนการนี้ต้องซ่อนเรื่อง \"ความเป็นอิสระในการประเมิน\" ซึ่งต้องสอดคล้องกับเกณฑ์ของหมวด IA ด้วย"],"3":["Change & Release Management: กระบวนการตรวจสอบคุณภาพเกี่ยวพันกับการนำระบบขึ้นใช้งานจริง (Go-Live) — หากระบบไม่ผ่าน QMS จะไม่สามารถ Release ได้ (จุดเชื่อมกับข้อ 6.2 Configuration Management)"],"4":["SLA & Vendor Management: ตัวชี้วัดคุณภาพส่วนใหญ่มักผูกกับ Service Level Agreement (SLA) ที่ทำไว้กับผู้รับจ้าง (Vendor) การวัดคุณภาพจึงซ่อนเรื่องการบริหารสัญญาผู้ส่งมอบอยู่ด้วย"]}},
  {id:"3.1",grp:"3",gname:"การบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงาน (Government Integration)",gw:10,gs68:3.0,name:"การบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงาน",w:10,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินผลสัมฤทธิ์และคุณค่าของการบูรณาการเชื่อมโยงข้อมูล ครอบคลุม Policy (Open Government), Process & Standardization, Execution & Collaboration, Value Realization (Public Value) และ Agility",dimLevels:["Policy: ความตั้งใจผู้บริหารในการเปิดกว้าง (Open Government) เชื่อมโยงข้อมูลกับหน่วยงานอื่น","Process & Standardization: ครบถ้วนทั้ง Partner Selection Criteria และ Data Classification","Execution & Collaboration: ระบบ IT เชื่อมต่อกันได้ (Interoperability) ทำงานร่วมกับหน่วยงานอื่นราบรื่น","Value Realization: วัด Public Value เช่น ประชาชนหรือลูกค้าได้ประโยชน์อะไร หรือลดต้นทุนได้เท่าไร","Agility & Innovation: เมื่อมีการเปลี่ยนนโยบายภาครัฐ ปรับกระบวนการเชื่อมโยงข้อมูลได้รวดเร็ว"],levelSumm:["จัดทำนโยบายการบูรณาการเชื่อมโยงข้อมูล + ขออนุมัติผู้บริหาร","จัดทำคู่มือ Government Integration + กำหนดการจัดประเภทข้อมูล + Partner Selection","จัดทำ RACI + แผนสื่อสาร + ลงนาม MOU + รวบรวม API Logs เป็นหลักฐาน","จัดทำ Dashboard Outcome สะท้อน Public Value + กำหนด Leading/Lagging Indicator","จัดทำ AAR + นำ Outcome ทบทวนแผนแม่บทฯ + จัดเก็บ Best Practice ลงระบบ KM"],good:["กำหนดกระบวนการบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงานทั้งภาครัฐและเอกชนอย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","มีเกณฑ์การพิจารณาเลือกคู่ความร่วมมือ (Partner Selection) อย่างเหมาะสม","มีหลักฐาน Implementation ที่ชัดเจน: เช่น การทำ MOU แลกเปลี่ยนข้อมูลกับกรมการขนส่งทางบก (ขบ.) เพื่อติดตามรถบรรทุกและควบคุมความปลอดภัย","มีการถ่ายทอดกระบวนการ วิเคราะห์ผู้มีส่วนได้ส่วนเสีย ทำแผนสื่อสาร และประเมินผลการรับรู้ครบถ้วน"],gaps:["ช่องว่าง Level 4-5: TRIS มองว่า 'แบบสำรวจความพึงพอใจ' หรือ 'จำนวน MOU ที่ทำสำเร็จ' เป็นเพียง Output — TRIS ต้องการ Outcome เช่น การเชื่อมโยงข้อมูลกับ ขบ. ทำให้ลดเวลาดำเนินงานได้กี่เปอร์เซ็นต์ ลดความผิดพลาด หรือลดต้นทุนทางสังคมได้เท่าไร","ขาด Leading/Lagging Indicator และขาดการนำระบบดิจิทัล/บูรณาการข้อมูลไปยกระดับกลยุทธ์องค์กร"],results:["(L1-2) มี 'คู่มือและนโยบายการบูรณาการเชื่อมโยงข้อมูล' กำหนดเกณฑ์เลือกคู่ความร่วมมือ และมีการต่ออายุ/จัดทำ MOU ร่วมกับหน่วยงานภายนอก","(L3) มี RACI Matrix วิเคราะห์ผู้มีส่วนได้ส่วนเสีย สื่อสารให้พนักงานภายในและหน่วยงานภายนอกรับทราบ และมีการประเมินการรับรู้ครบถ้วน","(L4-5) มีการกำหนดตัวชี้วัดผลลัพธ์ ทำแบบสำรวจความพึงพอใจคู่ความร่วมมือ (เช่น กรมการขนส่งทางบก) และนำรายงานผลประเมินเสนอต่อผู้บริหาร"],tris:[],suggest:[],docs:[],bestprac:[],actions:["เปลี่ยน KPIs จาก Output เป็น Outcome: ยกเลิกการใช้ความพึงพอใจเป็นตัวชี้วัดหลัก เปลี่ยนไปวัดผลลัพธ์จากการเชื่อมโยง เช่น เพิ่มประสิทธิภาพงาน ลดเอกสาร หรือบริการเบ็ดเสร็จ ณ จุดเดียว","สร้าง Leading และ Lagging Indicator: เช่น ความพร้อมของ API (Leading) และปริมาณธุรกรรมที่ทำได้อัตโนมัติ (Lagging)","ยกระดับการบูรณาการข้อมูลสู่ระดับกลยุทธ์ (Strategic Level): ขยายการเชื่อมโยงให้ครอบคลุม Data Analytics"],minReqs:{"1":["นโยบายการบูรณาการเชื่อมโยงข้อมูลและการดำเนินงานร่วมกันระหว่างหน่วยงาน ที่ได้รับการอนุมัติจากผู้บริหาร"],"2":["คู่มือการบูรณาการเชื่อมโยงข้อมูลฯ (Government Integration Manual) ที่ต้องมีองค์ประกอบบังคับ 3 เรื่อง (ต้องมีครบทุกข้อย่อยด้านล่าง)","การจัดประเภทข้อมูลที่เปิดเผยได้/แลกเปลี่ยนได้ และกำหนดช่องทางการเข้าถึงข้อมูล","การกำหนด \"แนวทางการเลือกคู่ความร่วมมือ (Partner Selection)\" อย่างเป็นรูปธรรม","แผนปฏิบัติการในการทบทวนโครงการที่ซ้ำซ้อน และส่งเสริมการทำงานร่วมกัน"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI Matrix) ตลอดห่วงโซ่การเชื่อมโยงข้อมูล","แผนการสื่อสาร และรายงานสรุปผลการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): สัญญา/บันทึกความเข้าใจ (MOU) การเชื่อมโยงข้อมูลกับหน่วยงานภายนอก (เช่น กรมการขนส่งทางบก) และหลักฐานการเชื่อมข้อมูลทางเทคนิค (เช่น Web Service/API Logs)"],"4":["Dashboard หรือรายงานประเมินผลลัพธ์ (Outcome) ของการเชื่อมโยงข้อมูล ที่สะท้อน \"คุณค่าเชิงสาธารณะ (Public Value)\" และมีตัวชี้วัดนำ/ตาม (Leading/Lagging Indicators)"],"5":["รายงานการถอดบทเรียน (AAR) หรือรายงานการประชุมคณะกรรมการที่นำผล Outcome ไปทบทวนแผนแม่บทฯ และจัดเก็บเป็นวิธีปฏิบัติที่เป็นเลิศ (Best Practice) ลงระบบ KM"]},subComps:{"2":["PDPA & Cybersecurity: การแลกเปลี่ยนข้อมูลกับภายนอก ซ่อนประเด็นข้อบังคับตาม พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคลฯ (PDPA) และ พ.ร.บ. ไซเบอร์ฯ เอาไว้ หากแบบฟอร์มการขอเชื่อมข้อมูลไม่มีเรื่องนี้ จะถูกมองว่ากระบวนการมีความเสี่ยง","Resource Optimization: เกณฑ์กำหนดให้ต้องมีการ \"ทบทวนแผนงาน/โครงการที่มีความซ้ำซ้อน\" ซึ่งเชื่อมโยงไปที่การประหยัดงบประมาณขององค์กรโดยตรง (DT 7.1)"],"4":["One-Stop Service: เป้าหมายสูงสุดของ Government Integration คือ \"บริการภาครัฐแบบครบวงจร ณ จุดเดียว\" (Citizen-centric) ตัวชี้วัดต้องสะท้อนว่าลูกค้า กทท. ไม่ต้องยื่นเอกสารซ้ำซ้อนหลายหน่วยงานอีกต่อไป"]}},
  {id:"4.1",grp:"4",gname:"การกำกับดูแลข้อมูลและการบริหารจัดการข้อมูลขนาดใหญ่ขององค์กร (Data Governance and Big Data)",gw:10,gs68:3.0,name:"การดำเนินการด้านการกำกับดูแลข้อมูลและการบริหารจัดการข้อมูลขนาดใหญ่ขององค์กร",w:10,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ระบบนิเวศการกำกับดูแลข้อมูลและการประยุกต์ใช้ Big Data ครอบคลุม Data as an Asset, Structure & Standardization, Execution & Awareness, Data Monetization และ Continuous Improvement",dimLevels:["Policy: ประกาศเจตนารมณ์ว่าข้อมูลเป็นทรัพย์สินมีค่าขององค์กร (Data as an Asset)","Structure & Standardization: ครบถ้วนทั้ง Data Governance Council, Steward, Owner, Catalog, Dictionary, Classification, Quality Assessment","Execution & Awareness: พนักงานเข้าใจหน้าที่ตนเองในฐานะผู้สร้าง/ผู้ใช้ข้อมูล ข้อมูลในระบบหลักถูกจัดระเบียบตามมาตรฐาน","Value Realization: วัดมูลค่าเพิ่มจากข้อมูล — Big Data ที่มีคุณภาพช่วยลดต้นทุนหรือเพิ่มโอกาสทางธุรกิจอย่างไร","Continuous Improvement: ปรับตัวยกระดับมาตรฐานข้อมูลให้ทันเทคโนโลยี"],levelSumm:["จัดทำ Data Governance Policy + ขออนุมัติผู้บริหารระดับสูง","จัดตั้ง Data Governance Council/Steward/Owner + จัดทำ Data Catalog, Dictionary, Classification","จัดทำ RACI + แผนสื่อสาร + รวบรวมผล Data Catalog และ Data Cleansing เป็นหลักฐาน","จัดทำ Dashboard การใช้ Big Data + วัด Outcome + กำหนด Leading/Lagging Indicator","นำ Outcome ทบทวนนโยบาย/คู่มือ Data Governance + จัดเก็บองค์ความรู้ลงระบบ KM"],good:["วางโครงสร้างการกำกับดูแลข้อมูล (Data Governance Council และ Data Steward Team) ที่ชัดเจน มีส่วนงานกลางประกอบด้วยบุคลากรด้านธุรกิจและไอที","มีคู่มือและกระบวนการทำงานที่เป็นระบบ (Repeatable) เป็นมาตรฐาน และบังคับใช้นโยบายข้อมูลทั่วองค์กร","มีการวัดประสิทธิภาพกระบวนการ ตรวจสอบคุณภาพข้อมูล และประเมิน ROI จากการบริหารข้อมูล","มี Implementation เชิงประจักษ์: คัดเลือกชุดข้อมูลสำคัญ (Critical Knowledge) จาก ERP, VCMS และ CTMS มาบริหารเป็น Big Data","มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสียครบถ้วนตลอด Value Chain สื่อสารได้ดี และมีการประเมินผลการรับรู้"],gaps:["ตกม้าตายเรื่อง GFMIS-SOE: การนำส่งข้อมูลเข้าระบบ GFMIS-SOE ของ สคร. 'ล่าช้า' — นี่คือจุดตายเชิงประจักษ์ที่ทำให้ กทท. ไม่สามารถหลุดพ้นระดับ 3 ขึ้นไปได้","KPIs ยังไม่เป็น Outcome: ตัวชี้วัดที่ส่งให้ TRIS ยังถูกมองว่าเป็นแค่ Output ไม่ได้แสดงว่า กทท. ตัดสินใจทางธุรกิจดีขึ้นแค่ไหนจากข้อมูลชุดนี้","ขาดการประยุกต์ใช้ AI และ Big Data เชิงวิเคราะห์/พยากรณ์"],results:["(L1-2) โครงสร้างคู่มือกำกับดูแล (V4.0) ตั้งคณะกรรมการ นโยบาย แบบประเมินคุณภาพ (DQA Checklist, DQA Self-Assessment) และวัดความคุ้มทุน (ROI) ครบถ้วน","(L3) สื่อสาร ถ่ายทอด วิเคราะห์ผู้มีส่วนได้ส่วนเสียผ่าน Value Chain และ RACI Chart รวมถึงมีหลักฐานการปฏิบัติงานจริงในฐานข้อมูลระดับองค์กร","(L4-5) มีการติดตามประเมินผลตามตัวชี้วัด นำเข้าสู่ที่ประชุมคณะทำงาน และนำผลลัพธ์ไปทบทวนเพื่อบรรจุลงในแผนปฏิบัติการดิจิทัล ปี 2568"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ปรับปรุงการนำส่งข้อมูล GFMIS-SOE (Quick Win): กำหนดแนวทางการทำงานใหม่ร่วมกับ สคร. ส่งข้อมูลได้ 'ถูกต้อง ครบถ้วน ทันเวลา' โดยเด็ดขาด","ขับเคลื่อน Big Data ด้วย AI: นำ AI มาทำ Data Analytics / Predictive Analytics เพื่อพยากรณ์แนวโน้ม เช่น คาดการณ์ความหนาแน่นรถบรรทุกหรือปริมาณสินค้า","ปรับ KPI ของ Data Governance ให้เป็น Outcome: เปลี่ยนจาก 'สร้างคู่มือ/โครงสร้าง' ไปเป็น 'เพิ่มรายได้ ลดเวลา หรือยกระดับความพึงพอใจลูกค้าได้กี่เปอร์เซ็นต์จากการใช้ Big Data'"],minReqs:{"1":["นโยบายการกำกับดูแลข้อมูล (Data Governance Policy) ที่ได้รับการอนุมัติจากผู้บริหารระดับสูง"],"2":["คู่มือการกำกับดูแลข้อมูลและแนวปฏิบัติ ที่มีองค์ประกอบบังคับครบถ้วน (ต้องมีครบทุกข้อย่อยด้านล่าง)","โครงสร้างความรับผิดชอบ: Data Governance Council, Data Steward, Data Owner","การจัดทำบัญชีข้อมูล (Data Catalog) และพจนานุกรมข้อมูล (Data Dictionary)","การจัดชั้นความลับของข้อมูล (Data Classification)","กระบวนการประเมินคุณภาพข้อมูล (Data Quality Assessment)","การประเมินความคุ้มทุน (Cost/Benefit หรือ ROI) ของกระบวนการจัดทำข้อมูล"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI Matrix) ตลอดวงจรชีวิตข้อมูล","แผนการสื่อสาร และรายงานผลการประเมินประสิทธิภาพของการสื่อสาร","หลักฐานเชิงประจักษ์ (Implementation): แฟ้มสรุปผลการจัดทำ Data Catalog, รายงานการคลีนข้อมูล (Data Cleansing) หรือรายงานผลการประเมินคุณภาพข้อมูลของระบบงานหลัก (เช่น ERP, VCMS, CTMS) ที่ดำเนินการแล้วเสร็จจริง"],"4":["Dashboard หรือรายงานประเมินผลลัพธ์ (Outcome) ที่แสดงถึงการใช้ประโยชน์จาก Big Data รวมถึงมีการกำหนดตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator)"],"5":["รายงานการถอดบทเรียน (AAR) หรือรายงานการประชุมคณะกรรมการฯ ที่นำผล Outcome ไปทบทวนนโยบาย/คู่มือ (เช่น การปรับเกณฑ์คุณภาพข้อมูลใหม่) และหลักฐานการจัดเก็บองค์ความรู้ลงระบบ KM"]},subComps:{"2":["PDPA & Data Security: การจัดชั้นความลับข้อมูล (Data Classification) เชื่อมโยงกับ พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคลฯ (PDPA) และ พ.ร.บ. ไซเบอร์ฯ (DT 5) อย่างแยกไม่ออก คู่มือด้านข้อมูลต้องอ้างอิงระดับความปลอดภัยจากคู่มือด้าน Security ด้วย"],"3":["Government Integration: การจะแลกเปลี่ยนข้อมูลกับภายนอก (DT 3.1) ต้องผ่านกระบวนการ Data Governance ก่อนเสมอ เพื่อให้มั่นใจว่าข้อมูลที่ส่งออกไปมีมาตรฐาน (Data Dictionary ตรงกัน)"],"4":["Customer & Innovation: Big Data Management จะทรงพลังเมื่อถูกนำไปเชื่อมกับด้าน SCM และ IM — องค์กรต้องนำ Big Data (เช่น ข้อมูลพฤติกรรมการใช้บริการ CTMS) ไปวิเคราะห์ด้วยเครื่องมือ Data Analytics เพื่อสร้างนวัตกรรมบริการใหม่ๆ ให้ลูกค้า"]}},
  {id:"5.1",grp:"5",gname:"ความมั่นคงปลอดภัยสารสนเทศ (Information Security)",gw:10,gs68:3.4,name:"การบริหารจัดการความมั่นคงปลอดภัยสารสนเทศขององค์กร (Information Security Management)",w:4,s68:3.4,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ ISMS ครอบคลุม Policy Formulation, Standardization, Execution & Awareness, Value/Outcome Measurement และ Resilience & Continuous Improvement — กทท. เป็น Best Practice ในกลุ่ม (3.4000)",dimLevels:["Policy Formulation: มีเกราะป้องกันทางกฎหมายและระเบียบรองรับ","Standardization: ความครบถ้วนของคู่มือป้องกันภัยคุกคามไซเบอร์ตามมาตรฐานสากล","Execution & Awareness: พนักงานทุกคนรับรู้และไม่เป็นจุดอ่อน (Human Error)","Value/Outcome Measurement: ระบบที่ตั้งไว้ป้องกันความเสียหายได้จริง (วัดเป็น Outcome ไม่ใช่ Output)","Resilience & Continuous Improvement: เรียนรู้และปรับตัวจากภัยคุกคามใหม่ๆ อุดช่องโหว่ในอนาคต"],levelSumm:["จัดทำนโยบาย ISMS และแนวปฏิบัติ Cybersecurity + ขออนุมัติผู้บริหาร","จัดทำคู่มือ ISMS สอดคล้อง ISO 27001 + ครอบคลุม พ.ร.บ. ไซเบอร์ฯ","จัดทำ RACI + แผนสื่อสาร + รวบรวมหลักฐานระบบความปลอดภัย + บันทึกเฝ้าระวัง","จัดทำ Dashboard ด้าน ISMS + กำหนด Leading Indicator และ Lagging Indicator","นำ Outcome ทบทวนนโยบาย ISMS + จัดเก็บ Lesson Learned ลงระบบ KM"],good:["กำหนดกระบวนการบริหาร ISMS อย่างเป็นระบบ ทำซ้ำได้ (Repeatable) เป็นมาตรฐาน (Standardized) สอดคล้องกับ ISO 27001","มีการกำหนดนโยบายหรือแผนการบริหารจัดการครอบคลุมประเด็นสำคัญ","มีการถ่ายทอดแนวทางปฏิบัติทั่วองค์กร วิเคราะห์ผู้มีส่วนได้ส่วนเสีย และประเมินการรับรู้อย่างครบถ้วน","มีหลักฐาน Implementation เชิงประจักษ์ — เป็นจุดแข็งที่ทำให้คะแนนทะลุระดับ 3 ขึ้นมาได้","เริ่มมีการกำหนดการวัด ติดตาม วิเคราะห์ ตัววัดผลลัพธ์ (Outcome) แล้ว"],gaps:["จุดสะดุดที่ Level 4-5: หลักฐานที่ส่งไปเป็นเพียง Output เช่น 'ทำตามแผนครบหรือไม่' ยังไม่ใช่ Outcome ที่สะท้อนว่าระบบความปลอดภัยดีขึ้นหรือป้องกันภัยได้ดีขึ้นอย่างไร","ขาด Leading/Lagging Indicator ที่ชัดเจน ทำให้ได้คะแนนระดับ 4 เพียงบางส่วน ไม่เต็ม 5.0"],results:["(L1-3) มีหลักฐานครบถ้วนทั้งกระบวนการ นโยบาย การสื่อสาร และการนำไปปฏิบัติจริง","(L4-5) มีการประเมินตัววัดผลลัพธ์ (Outcome) และนำผลลัพธ์เข้าสู่กระบวนการทบทวนปรับปรุง นำไปเรียนรู้และจัดการความรู้"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ปรับ KPIs ให้เป็น Outcome: กำหนดตัวชี้วัดใหม่ เช่น 'อัตราความเสียหายจากภัยคุกคามไซเบอร์ที่ลดลง' หรือ 'ร้อยละความพร้อมใช้งานของระบบ (Service Availability)' ที่เพิ่มขึ้น","กำหนด Leading Indicator: เช่น จำนวนช่องโหว่ที่ตรวจพบและแก้ไขทันเวลา และ Lagging Indicator: เช่น จำนวนครั้งที่ระบบถูกโจมตีสำเร็จ"],minReqs:{"1":["นโยบายและแนวปฏิบัติด้านการรักษาความมั่นคงปลอดภัยไซเบอร์และสารสนเทศ ที่ได้รับการอนุมัติจากผู้บริหารระดับสูง"],"2":["คู่มือและกระบวนการบริหารจัดการความมั่นคงปลอดภัยสารสนเทศ (ISMS) ที่กำหนดอย่างครบถ้วน เป็นระบบ สอดคล้องตามมาตรฐานสากล (เช่น ISO/IEC 27001) และกฎหมาย (พ.ร.บ. ไซเบอร์ฯ)"],"3":["เอกสารการวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI) ด้านความปลอดภัยสารสนเทศ","รายงานการสื่อสารถ่ายทอดนโยบาย และแบบประเมินการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): การนำกระบวนการไปปฏิบัติอย่างชัดเจนเป็นรูปธรรม เช่น หลักฐานการตั้งค่าระบบความปลอดภัย, บันทึกการเฝ้าระวังภัยคุกคาม, หรือการรายงานเหตุการณ์ความมั่นคงปลอดภัย"],"4":["Dashboard หรือรายงานการวัด ติดตาม วิเคราะห์ และประเมินผลลัพธ์ (Outcome) ด้านความมั่นคงปลอดภัยสารสนเทศ โดยต้องมีตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator)"],"5":["รายงานการประชุมคณะกรรมการฯ ที่แสดงให้เห็นว่ามีการนำผลลัพธ์ (Outcome) เข้าสู่กระบวนการทบทวนและปรับปรุงกระบวนการอย่างต่อเนื่อง (Continuous Improvement) และนำไปจัดเก็บเป็นองค์ความรู้ลงระบบ KM"]},subComps:{"3":["ประสิทธิภาพของการสื่อสาร: การสื่อสารต้องวัดผลได้ ไม่ใช่แค่วัดว่ามีคนเข้าอบรมกี่คน แต่ต้องวัดว่า \"คะแนนความเข้าใจ (Awareness Score) ผ่านเกณฑ์กี่เปอร์เซ็นต์\""],"4":["Risk-Based Approach: ตัวชี้วัดของ ISMS ต้องตอบโจทย์ \"ความเสี่ยงด้านเทคโนโลยีดิจิทัล (Digital Risk Optimization)\" — ต้องเป็นตัวชี้วัดที่สะท้อนการลดความเสี่ยง มากกว่าการนับจำนวนกิจกรรม"]}},
  {id:"5.2",grp:"5",gname:"ความมั่นคงปลอดภัยสารสนเทศ (Information Security)",gw:10,gs68:3.4,name:"การบริหารจัดการความเสี่ยงด้านความมั่นคงปลอดภัยสารสนเทศ (Information Security Risk Management)",w:3,s68:3.4,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์กระบวนการบริหารความเสี่ยง ISMS ครอบคลุม Policy Alignment, Risk Process Completeness, Execution & Awareness, Risk Optimization/Outcome และ Continuous Improvement",dimLevels:["Policy Alignment: ตระหนักรู้และวางกรอบนโยบายความเสี่ยงด้าน IT","Risk Process Completeness: ความสมบูรณ์ของเครื่องมือประเมินความเสี่ยง","Execution & Awareness: นำกระบวนการไปใช้ค้นหาความเสี่ยงจริง คนหน้างานตระหนักรู้","Risk Optimization/Outcome: แผนจัดการความเสี่ยงลดระดับมาอยู่ใน Risk Appetite ที่ยอมรับได้","Continuous Improvement: เมื่อมีภัยคุกคามรูปแบบใหม่ ปรับปรุงเครื่องมือประเมินความเสี่ยงได้ทันที"],levelSumm:["จัดทำนโยบาย ISMS Risk Management + สอดคล้องกับนโยบายบริหารความเสี่ยงองค์กร","จัดทำคู่มือ Cyber Risk Assessment + กระบวนการ Identify, Assess, Mitigate, Monitor","จัดทำ RACI + แผนสื่อสาร + จัดทำ Risk Register ด้านไซเบอร์พร้อม Mitigation Plan","จัดทำ Dashboard Risk Indicators + กำหนด Leading/Lagging Indicator","นำ Outcome ทบทวนกระบวนการจัดการความเสี่ยง + จัดเก็บลงระบบ KM"],good:["กำหนดกระบวนการบริหารความเสี่ยงด้าน ISMS อย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน สอดคล้องกับ ISO 27001","มีการกำหนดแผนบริหารความเสี่ยง ติดตาม ทบทวน และรายงานความเสี่ยงอย่างครบถ้วน","มีการถ่ายทอดแนวปฏิบัติทั่วองค์กร วิเคราะห์และประเมินการรับรู้ผู้มีส่วนได้ส่วนเสีย","มี Implementation เชิงประจักษ์ที่ชัดเจน — เป็นจุดแข็งที่ทำให้สอบผ่าน Level 3 ได้อย่างเต็มภาคภูมิ"],gaps:["ติดกับดัก Output: TRIS ตีความว่าสิ่งที่ กทท. ส่งไปเป็น Output เช่น 'จำนวนความเสี่ยงที่ระบุได้' หรือ 'จำนวนครั้งที่ทบทวนแผน' — TRIS ต้องการ Outcome เชิงประจักษ์ เช่น 'มูลค่าความเสียหายที่ลดลงจากการปิดช่องโหว่'","ขาด Leading/Lagging Indicator และการนำผลลัพธ์มาทบทวนเพื่อพัฒนาอย่างต่อเนื่อง"],results:["(L1-3) มีแนวทาง กระบวนการ และการถ่ายทอดกระบวนการบริหารความเสี่ยงด้าน ISMS แก่ผู้มีส่วนได้ส่วนเสียอย่างครบถ้วน พร้อมหลักฐานการปฏิบัติจริง","(L4-5) มีการกำหนดการวัด ติดตาม ประเมินตัววัดผลลัพธ์ (Outcome) และนำผลลัพธ์เข้าสู่กระบวนการทบทวนการกำกับดูแลดิจิทัลและแผนปฏิบัติการระยะยาว"],tris:[],suggest:[],docs:[],bestprac:[],actions:["รื้อระบบ KPI ความเสี่ยงไซเบอร์: กำหนด Leading Indicator เช่น จำนวนช่องโหว่ที่ยังไม่ได้รับการแก้ไข หรือร้อยละพนักงานที่สอบผ่าน Phishing Test","เปลี่ยน Output เป็น Outcome: เปลี่ยนจาก 'ทำแผนบริหารความเสี่ยงเสร็จ' เป็น 'แผนสามารถลด Downtime ของระบบหลักลงได้กี่ชั่วโมง'","นำผลตัวเลขไปใช้ทบทวนแผน: รายงานในที่ประชุมเพื่อให้ผู้บริหารสั่งการปรับปรุงกระบวนการหรือแผนปฏิบัติการดิจิทัล"],minReqs:{"1":["นโยบายและแนวทางการบริหารจัดการความเสี่ยงด้านความมั่นคงปลอดภัยสารสนเทศ ที่สอดคล้องกับนโยบายบริหารความเสี่ยงภาพรวมขององค์กร"],"2":["คู่มือ/กระบวนการประเมินและบริหารความเสี่ยงด้านไซเบอร์ (Cyber Risk Assessment Manual) ที่มีขั้นตอนครบถ้วน ได้แก่ การระบุความเสี่ยง (Identify) การประเมิน (Assess) การจัดการ (Mitigate) และการติดตาม (Monitor) โดยอิงมาตรฐานสากล"],"3":["เอกสารวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI) และแผนการสื่อสารเรื่องความเสี่ยง","รายงานประเมินผลการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): รายงาน Risk Profile หรือทะเบียนความเสี่ยงด้านไซเบอร์ (Risk Register) ที่มีการระบุความเสี่ยง ประเมินระดับความรุนแรง และมีแผนจัดการความเสี่ยง (Mitigation Plan) ที่อนุมัติโดยผู้บริหารและใช้งานจริง"],"4":["Dashboard/รายงานวัดผลสัมฤทธิ์ (Outcome) ของการจัดการความเสี่ยงไซเบอร์ โดยต้องแสดงตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator) อย่างชัดเจน"],"5":["รายงานการประชุมคณะกรรมการฯ (เช่น คณะกรรมการบริหารความเสี่ยงองค์กร) ที่แสดงให้เห็นการนำผลลัพธ์ Outcome ไปทบทวนและปรับปรุงกระบวนการจัดการความเสี่ยง และหลักฐานการนำขึ้นระบบ KM"]},subComps:{"2":["Risk Appetite & Tolerance: การจะบอกว่าความเสี่ยงด้านไซเบอร์อยู่ในระดับสูงหรือต่ำ ต้องใช้เกณฑ์ความเสี่ยงระดับองค์กร — ระดับที่องค์กรยอมรับได้ (Risk Appetite) ของฝ่าย IT ต้องสอดคล้องกับเป้าหมายองค์กร"],"3":["Incident Data as Input: การระบุความเสี่ยงด้าน IT ต้องนำเอาข้อมูลจาก \"ข้อ 6.3 การบริหารจัดการเหตุการณ์ผิดปกติ (Incident Management)\" มาเป็นปัจจัยนำเข้า (Input) ในการประเมินความเสี่ยงปีถัดไปด้วย"],"4":["Risk Appetite & Tolerance (ต่อเนื่อง): ต้องสอดคล้องกับเป้าหมายองค์กรในการวัดผล (ดูรายละเอียดระดับ 2)","Value Creation: การจัดการความเสี่ยงไซเบอร์ที่ดี ไม่ใช่แค่ป้องกันความเสียหาย แต่ซ่อนเรื่อง \"Value Protection\" เพื่อให้มั่นใจว่าข้อมูลลูกค้าไม่รั่วไหลและธุรกิจเดินต่อได้"]}},
  {id:"5.3",grp:"5",gname:"ความมั่นคงปลอดภัยสารสนเทศ (Information Security)",gw:10,gs68:3.4,name:"การตรวจสอบการบริหารจัดการความมั่นคงปลอดภัยสารสนเทศขององค์กร (ISMS Audit)",w:3,s68:3.4,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ ISMS Audit ครอบคลุม Audit Framework, Audit Process & Tools, Execution & Independence, Value Realization และ Continuous Improvement",dimLevels:["Audit Framework: มีกรอบเกณฑ์การตรวจสอบที่ชัดเจนและเป็นทางการ","Audit Process & Tools: ความครบถ้วนของเครื่องมือและขั้นตอนตามมาตรฐานวิชาชีพ","Execution & Independence: ลงมือตรวจสอบจริงด้วยความเป็นอิสระ","Value Realization: การตรวจสอบต้องช่วยป้องกันความเสี่ยงและลดความเสียหายได้จริง (Value Add)","Continuous Improvement: นำข้อเสนอแนะไปพัฒนากระบวนการและอุดช่องโหว่อย่างยั่งยืน"],levelSumm:["จัดทำนโยบาย/Framework ISMS Audit + ขออนุมัติคณะกรรมการตรวจสอบ","จัดทำคู่มือ ISMS Audit Manual + ครอบคลุม Audit Plan, Execution, Reporting, Follow-up","จัดทำ RACI + แผนสื่อสาร + ดำเนินการ ISMS Audit ประจำปีและรายงานผล","จัดทำ Dashboard ผล Audit + กำหนด Leading/Lagging Indicator","นำ Audit Findings ทบทวนคู่มือ/นโยบาย ISMS + จัดเก็บลงระบบ KM"],good:["กำหนดกระบวนการตรวจสอบ ISMS Audit อย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","มีการถ่ายทอดแนวทางปฏิบัติทั่วองค์กร","วิเคราะห์และประเมินการรับรู้ผู้มีส่วนได้ส่วนเสียอย่างครบถ้วน","มีหลักฐาน Implementation ที่ชัดเจน — ทำให้ผู้ประเมินให้คะแนนทะลุระดับ 3"],gaps:["ตัววัดประสิทธิผลยังเป็นแค่ Output เช่น 'ดำเนินงานตรวจสอบได้ 100% ตามแผน' หรือ 'มีรายงานตรวจสอบกี่ฉบับ' — TRIS ต้องการ Outcome เช่น 'จำนวนช่องโหว่ระดับสูงที่พบจาก Audit ลดลงร้อยละ XX'","ขาดกลไก Continuous Improvement เชิงประจักษ์: เมื่อตรวจสอบพบช่องโหว่ (Audit Findings) องค์กรต้องนำข้อมูลไปปรับปรุงนโยบายหรือยกระดับระบบ"],results:["มีการกำหนดการวัด ติดตาม วิเคราะห์ตัววัดผลลัพธ์ (Outcome) ของกระบวนการ ISMS Audit และมีการนำผลลัพธ์เข้าสู่กระบวนการทบทวนการกำกับดูแล/แผนปฏิบัติการดิจิทัล รวมถึงนำผลไปเรียนรู้ จัดการความรู้ และจัดเก็บเป็นนวัตกรรม"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ปฏิวัติตัวชี้วัด ISMS Audit ให้เป็น Outcome: เช่น 'จำนวนช่องโหว่ระดับสูง (Critical Findings) จาก Audit ลดลงร้อยละ XX เทียบปีก่อน' หรือ 'ความสูญเสียทางการเงินที่ป้องกันได้จากข้อเสนอแนะของทีม Audit'","กำหนด Leading และ Lagging Indicators ชัดเจน: เช่น ร้อยละระบบสำคัญที่ผ่าน Audit ความพร้อม (Leading) และจำนวนเหตุการณ์ละเมิดความปลอดภัยที่รอดพ้นสายตา Audit (Lagging)","สร้างวงจรการทบทวนผล (Review Cycle): นำผลข้อค้นพบจาก ISMS Audit ไปเป็นวาระรายงานต่อผู้บริหาร/คณะกรรมการ"],minReqs:{"1":["นโยบายและกรอบแนวทางการตรวจสอบด้านความมั่นคงปลอดภัยสารสนเทศ ที่ได้รับการอนุมัติจากผู้บริหาร/คณะกรรมการตรวจสอบ"],"2":["คู่มือและกระบวนการตรวจสอบ ISMS (ISMS Audit Manual) ที่ระบุขั้นตอนครบถ้วน ตั้งแต่การวางแผนตรวจสอบ (Audit Plan), การลงพื้นที่/ใช้เครื่องมือตรวจสอบ (Audit Execution), การรายงานผล (Reporting) และการติดตามผล (Follow-up) โดยอิงมาตรฐานสากล"],"3":["เอกสารวิเคราะห์ผู้มีส่วนได้ส่วนเสีย (RACI) ในกระบวนการตรวจสอบ","รายงานการสื่อสารและผลประเมินการรับรู้ของหน่วยรับตรวจ","หลักฐานเชิงประจักษ์ (Implementation): รายงานผลการตรวจสอบ ISMS ประจำปี (ISMS Audit Report) ที่ดำเนินการเสร็จสิ้นจริง และมีการส่งรายงานให้ผู้บริหารหรือคณะกรรมการตรวจสอบรับทราบ"],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ของกระบวนการตรวจสอบ ISMS ที่มีตัวชี้วัดนำ (Leading) และตัวชี้วัดตาม (Lagging) อย่างชัดเจน"],"5":["รายงานการถอดบทเรียน (AAR) หรือรายงานการประชุมคณะกรรมการฯ ที่นำข้อค้นพบ (Audit Findings) และผลลัพธ์ Outcome ไปทบทวนเพื่อปรับปรุงคู่มือตรวจสอบหรือนโยบายความปลอดภัยให้รัดกุมยิ่งขึ้น และจัดเก็บเข้าสู่ระบบ KM"]},subComps:{"2":["The Compliance Check: การตรวจสอบ ISMS ไม่ได้ตรวจแค่ระบบทางเทคนิค แต่ซ่อนการตรวจสอบ \"ความสอดคล้องทางกฎหมาย (Compliance)\" เช่น การปฏิบัติตาม พ.ร.บ. ไซเบอร์ฯ และ PDPA ด้วย"],"3":["Independence & Objectivity: หากฝ่าย IT (ผู้สร้างระบบ) เป็นผู้ตรวจสอบระบบตัวเองทั้งหมดโดยไม่มีฝ่ายตรวจสอบภายใน (IA) หรือผู้ประเมินอิสระภายนอกเข้ามาร่วม จะถูกมองว่ากระบวนการมีความเสี่ยงและอาจไม่ผ่าน","Consulting Services: งานตรวจสอบสมัยใหม่คาดหวังให้ผู้ตรวจสอบทำหน้าที่เป็น \"ผู้ให้คำปรึกษา (Consulting)\" ด้วย รายงานตรวจสอบไม่ควรมีแค่ข้อบกพร่อง แต่ต้องมีข้อเสนอแนะเชิงกลยุทธ์ที่ฝ่าย IT นำไปใช้ได้จริง"]}},
  {id:"6.1",grp:"6",gname:"การบริหารความต่อเนื่องทางธุรกิจและความพร้อมใช้ของระบบ (Business Continuity and Availability Management)",gw:10,gs68:3.0,name:"การบริหารจัดการทรัพย์สินด้านเทคโนโลยีสารสนเทศ (IT Asset Management)",w:2.5,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ IT Asset Management ครอบคลุม Policy ความครบถ้วนวงจรชีวิตทรัพย์สิน (Lifecycle) การใช้ ITSM (Execution) การวัดความคุ้มค่า (Asset Optimization) และการพยากรณ์อนาคต (Future Planning)",dimLevels:["Policy: มีแนวทางควบคุมทรัพย์สิน IT ไม่ให้สูญหายหรือเป็นช่องโหว่","Lifecycle Completeness: ครบ In > Maintain > Out ไร้รอยต่อ","Execution & System Usage: ใช้ระบบดิจิทัล (ITSM) ในการติดตามทรัพย์สินแทนกระดาษหรือ Excel","Value Realization/Asset Optimization: ทรัพย์สิน IT ถูกใช้งานอย่างเต็มประสิทธิภาพและคุ้มทุน","Future Planning: รู้ล่วงหน้าว่าอะไรจะ EOL/EOS และตั้งงบรอไว้"],levelSumm:["จัดทำนโยบาย IT Asset Management + อิงกับนโยบาย Cybersecurity องค์กร","จัดทำคู่มือ IT Asset ครอบคลุม 5 วงจรชีวิต: ทะเบียน, ปรับปรุง, ยกเลิก, บำรุงรักษา, EOL/EOS","จัดทำ RACI + แผนสื่อสาร + รวบรวมหน้าจอ ITSM + รายงาน PM + ใบตรวจรับพัสดุ","จัดทำ Dashboard IT Asset + กำหนด Leading/Lagging Indicator","นำ Outcome ทบทวนแผนดิจิทัล + จัดเก็บแผนอนาคตลงระบบ KM"],good:["มีแนวทางจัดการทรัพย์สินครอบคลุมตั้งแต่การจัดทำ/ปรับปรุงทะเบียน การบำรุงรักษา ไปจนถึงการยกเลิกและเรียกคืน","มีการจัดทำทะเบียน IT Inventory List ทั้งฮาร์ดแวร์และซอฟต์แวร์ที่รองรับระบบองค์กรได้ครบถ้วน","นำระบบ ITSM มาใช้ในการบริหารจัดการและจัดเก็บข้อมูลทรัพย์สินอย่างเป็นระบบ","มีการถ่ายทอดแนวปฏิบัติทั่วองค์กร วิเคราะห์ผู้มีส่วนได้ส่วนเสีย และประเมินการรับรู้ครบถ้วน","มี Implementation เชิงประจักษ์ผ่านการใช้งานระบบ ITSM จริง"],gaps:["สอบตก Level 4: TRIS มองว่า KPI 3 ตัวที่ กทท. ส่งไปเป็น Output ทั้งสิ้น — 'Service Availability' และ 'ความสำเร็จในการจัดซื้อทดแทน' คือสิ่งที่ทำตามหน้าที่ ไม่ใช่ Outcome เชิงคุณค่า","ขาด Leading/Lagging Indicator: ทำให้การนำผลลัพธ์ไปทบทวนและปรับปรุงกระบวนการต่อเนื่องยังไม่สมบูรณ์"],results:["(L1-3) มีคู่มือการบันทึกบัญชีสินทรัพย์ นำ ITSM ควบคุมวงจรชีวิต IT Asset (Requisition, Configuration, Maintenance, Disposal) และมีหลักฐานการปฏิบัติงานจริงครบถ้วน","(L4) กำหนดตัวชี้วัดผลลัพธ์ 3 ตัว: 1) Service Availability 2) ความถูกต้อง/ทันกาลของข้อมูล IT Asset 3) ความสำเร็จในการจัดซื้อทดแทน EOL","(L5) นำข้อมูลจากกระบวนการวิเคราะห์เพื่อจัดทำแผนปฏิบัติการดิจิทัล ประจำปี 2568"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ปรับ KPI จาก Output เป็น Leading/Lagging Indicator: Leading เช่น ร้อยละเครื่อง/ซอฟต์แวร์ที่ใกล้หมดอายุ (EOL) แต่มีแผนบำรุงรักษา; Lagging เช่น จำนวนครั้งระบบหยุดชะงักจากฮาร์ดแวร์เสื่อมสภาพ","สร้างวงจรทบทวนผล: นำ Leading/Lagging ไปรายงานผู้บริหารเพื่อกำหนดงบลงทุนด้าน IT (IT Investment) ให้แม่นยำยิ่งขึ้น"],minReqs:{"1":["นโยบายหรือแนวทางในการบริหารจัดการทรัพย์สินด้านเทคโนโลยีสารสนเทศ ที่อ้างอิงกับนโยบายความมั่นคงปลอดภัยไซเบอร์ขององค์กร"],"2":["คู่มือและกระบวนการบริหารจัดการทรัพย์สินด้าน IT ที่ต้องมีองค์ประกอบบังคับ ครบทั้ง 5 วงจรชีวิตของทรัพย์สิน (ต้องมีครบทุกข้อย่อยด้านล่าง)","การจัดทำทะเบียนทรัพย์สิน (Registration)","การปรับปรุงทะเบียน (Update)","การยกเลิกและเรียกคืน (Cancellation & Retrieval / จำหน่ายพัสดุ)","การบำรุงรักษา (Maintenance)","การวางแผนรองรับทรัพย์สินที่สิ้นสุดอายุการใช้งาน (End of Life: EOL) หรือสิ้นสุดการสนับสนุน (End of Support: EOS)"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสาร","รายงานประเมินผลการรับรู้ของพนักงาน","หลักฐานเชิงประจักษ์ (Implementation): หน้าจอระบบ ITSM ที่บันทึก/ปรับปรุงสถานะทรัพย์สินจริง, รายงานผลการบำรุงรักษา (PM), ใบตรวจรับพัสดุ และบันทึกเวียนสอบถามความต้องการใช้เครื่องคอมพิวเตอร์ก่อนจัดทำงบ 68 ก."],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ของกระบวนการ IT Asset Management โดยต้องมีตัวชี้วัดนำและตาม (Leading/Lagging Indicators)"],"5":["รายงานการทบทวนแผนปฏิบัติการดิจิทัลที่นำผลลัพธ์จากข้อ 4 มาใช้จัดทำแผน (เช่น แผนการเปลี่ยนเครื่องคอมพิวเตอร์รอบใหม่) และหลักฐานการนำขึ้นระบบ KM"]},subComps:{"2":["Financial Alignment: การจัดการ IT Asset ต้องอิงกับระเบียบบัญชีและพัสดุขององค์กร ฝ่าย IT ไม่สามารถตั้งกฎการเสื่อมราคาหรือการแทงจำหน่ายเองได้ ต้องล้อตามระเบียบพัสดุ","Cybersecurity Risk: การจัดการเครื่องที่ EOL/EOS (เช่น Windows รุ่นเก่าหมดอายุ) ต้องถูกนำไปโยงกับ \"ความเสี่ยงด้านไซเบอร์ (DT 5)\" หากเครื่องเหล่านี้หลุดรอดอยู่ในเครือข่าย จะกลายเป็นช่องโหว่ทันที"],"5":["Cybersecurity Risk (ต่อเนื่อง): ข้อมูลเครื่องที่ EOL/EOS ต้องถูกส่งต่อให้ฝ่ายบริหารความเสี่ยงประเมินความเสี่ยงด้านไซเบอร์อย่างต่อเนื่อง"]}},
  {id:"6.2",grp:"6",gname:"การบริหารความต่อเนื่องทางธุรกิจและความพร้อมใช้ของระบบ (Business Continuity and Availability Management)",gw:10,gs68:3.0,name:"การบริหารจัดการคอนฟิกูเรชั่น (Configuration Management)",w:2.5,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ Configuration Management ครอบคลุม Policy ความครบถ้วน Baseline & Version Control (Process) การใช้เครื่องมืออัตโนมัติ ITSM/PRTG (Execution) การลดข้อผิดพลาด Config (Value Realization) และการวางแผนอนาคต (Agility)",dimLevels:["Policy: ควบคุมการตั้งค่าระบบ ไม่ให้พนักงานเปลี่ยน Config โดยพลการ","Process & Standardization: ครบถ้วนทั้ง Minimum Baseline Standard และ System Configuration Version Control","Execution & Tool Usage: ใช้เครื่องมืออัตโนมัติ (ITSM, PRTG) มอนิเตอร์และผูกความสัมพันธ์ CI","Value Realization: วัดว่าระบบ Config ช่วยลด Downtime ที่เกิดจาก Human Error ได้อย่างไร","Agility & Planning: นำข้อมูล Config วิเคราะห์ Capacity วางแผนจัดซื้อหรือขยายระบบในอนาคต"],levelSumm:["จัดทำนโยบาย Configuration Management + กำหนดบทบาทหน้าที่","จัดทำคู่มือ Config Management + Minimum Baseline Standard + Version Control","จัดทำ RACI + แผนสื่อสาร + รวบรวมหน้าจอ ITSM CI Relation + PRTG + Change Request","จัดทำ Dashboard Config KPI + กำหนด Leading/Lagging Indicator","นำข้อมูล Config ทบทวนแผนดิจิทัลระยะยาว + จัดเก็บองค์ความรู้"],good:["จัดเก็บการเปลี่ยนแปลงการตั้งค่าระบบของทุกอุปกรณ์ ระบบ และระบบงาน (System Configuration Version Control) อย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","กำหนดขอบเขต Configuration Item (CI) ชัดเจน จัดทำ/ทบทวน Minimum Baseline Standard ได้ดี","มีการถ่ายทอดแนวปฏิบัติทั่วองค์กร วิเคราะห์ผู้มีส่วนได้ส่วนเสีย และประเมินการรับรู้ครบถ้วน","มี Implementation เชิงประจักษ์ผ่าน ITSM และ PRTG Monitor — เป็นจุดแข็งที่ทำให้คะแนนแตะระดับ 3"],gaps:["ตกม้าตายเรื่อง KPI: TRIS ระบุว่า 'ตัววัดส่วนใหญ่เป็น Output' — 'รายงานการเปลี่ยนแปลงระบบ' หรือ 'รายงานสรุปผล Config' คือการนับจำนวน (Output) ไม่ใช่ตัวชี้วัดประสิทธิภาพ (Outcome)","ขาดการตั้ง Leading/Lagging Indicator ที่นำไปสู่การทบทวนกระบวนการ"],results:["(L1-2) นำ ITSM จัดการ Configuration มี Minimum Baseline Standard กำหนดพารามิเตอร์ และสอบทานการตั้งค่าผ่านระบบ PRTG","(L3) ทำ Stakeholder Analysis, RACI Matrix, แผนสื่อสาร และประเมินการรับรู้ของพนักงาน ฝทส.","(L4) ระบุว่ามีตัวชี้วัดผลลัพธ์ผ่านรายงานต่างๆ เช่น รายงานการเปลี่ยนแปลงระบบ, Availability, สรุปปัญหาระบบ และสรุปผล Config ประจำปี","(L5) นำข้อมูล Configuration ไปจัดทำแผนปฏิบัติการดิจิทัล ประจำปี 2568"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ปฏิวัติ KPI Configuration Management: เลิกใช้จำนวนการเปลี่ยน Config เป็นตัวชี้วัด เปลี่ยนเป็น Outcome เช่น 'ร้อยละการลดลงของระบบล่ม (Downtime) ที่มีสาเหตุจาก Config ผิดพลาด'","กำหนด Leading/Lagging Indicators: Leading เช่น ร้อยละ Server/อุปกรณ์ที่ตั้งค่าสอดคล้องกับ Minimum Baseline 100%; Lagging เช่น จำนวน Incident จากช่องโหว่ Config","ปิดลูป Continuous Improvement: เมื่อพบข้อผิดพลาดจากการตั้งค่า ต้องมีหลักฐานการประชุมเพื่อนำปัญหาไปปรับแก้คู่มือ Minimum Baseline เวอร์ชันถัดไป"],minReqs:{"1":["นโยบายการบริหารจัดการ Configuration ที่ได้รับอนุมัติ และมีการกำหนดบทบาทหน้าที่ชัดเจน"],"2":["คู่มือกระบวนการ (Configuration Management Procedure) ที่ครอบคลุม (ต้องมีครบทุกข้อย่อยด้านล่าง)","การกำหนดและการจัดทำ Minimum Baseline Standard","การจัดเก็บการเปลี่ยนแปลง (System Configuration Version Control)","การเชื่อมโยงกับกระบวนการบริหารการเปลี่ยนแปลง (Change Management) และกระบวนการจัดการขีดความสามารถ (Capacity Management)"],"3":["เอกสารวิเคราะห์ Stakeholder และแผนการสื่อสาร","ผลประเมินการรับรู้ของพนักงาน","หลักฐานเชิงประจักษ์ (Implementation): หน้าจอระบบที่ใช้จริง เช่น ระบบ ITSM (แสดงความสัมพันธ์แบบ CI Relation), ระบบ PRTG Monitor, และแบบฟอร์มขอร้องการเปลี่ยนแปลง (Change Request Form) ที่มีการใช้งานจริง"],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ที่มีตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator) อย่างครบถ้วน"],"5":["รายงานการประชุมทบทวนที่นำข้อมูลจากระบบไปจัดทำ/ปรับปรุงแผนปฏิบัติการดิจิทัลระยะยาว และหลักฐานการจัดเก็บองค์ความรู้"]},subComps:{"2":["การเชื่อมโยงระบบ (Hub): CI (Configuration Item) 1 ตัว ต้องบอกได้ว่าเชื่อมอยู่กับทรัพย์สินใด (Asset - 6.1), มีปัญหาอะไร (Incident - 6.3), และมีความเสี่ยงไซเบอร์อะไร (Security - 5.1)"],"3":["การทำ Audit: ระบบ PRTG และ ITSM ที่ใช้ ต้องสามารถออก Audit Log ให้ฝ่ายตรวจสอบ (IA) ดูได้ว่า \"ใครเป็นคนเปลี่ยนคอนฟิกตอนกี่โมง\""]}},
  {id:"6.3",grp:"6",gname:"การบริหารความต่อเนื่องทางธุรกิจและความพร้อมใช้ของระบบ (Business Continuity and Availability Management)",gw:10,gs68:3.0,name:"การบริหารจัดการเหตุการณ์ผิดปกติ การร้องขอการบริการ และปัญหาด้านเทคโนโลยีสารสนเทศ (IT Incident, Service Requests and Problem Management)",w:2.5,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ IT Incident, Service Request และ Problem Management ครอบคลุม Policy (ช่องทางรับแจ้ง) SLA & Severity (Process) การใช้ ITSM จริง (Execution) First Call Resolution (Value Realization) และ Problem Management (Root Cause)",dimLevels:["Policy: มีช่องทางและแนวทางที่เป็นทางการในการรับแจ้งปัญหา IT","Process & SLA: การคัดกรองปัญหา — ด่วน/ไม่ด่วน ต้องมีเกณฑ์ชัดเจน ผูกกับ Business Continuity","Execution & System Usage: ต้องไม่รับแจ้งปัญหาผ่านไลน์ส่วนตัว แต่ต้องวิ่งเข้าระบบ ITSM (Single Point of Contact)","Value Realization: วัดว่าแก้ปัญหาได้เร็วและลดผลกระทบต่อธุรกิจได้อย่างไร (First Call Resolution)","Problem Management: จัดการ 'รากเหง้า' ของปัญหา — ไม่ใช่แค่ซ่อมอาการ แต่ต้องป้องกันไม่ให้เกิดซ้ำ"],levelSumm:["จัดทำนโยบาย IT Incident & Service Request Management + ขออนุมัติ","จัดทำคู่มือ: Categorization, Severity Level, Escalation, SLA (ผูก RTO/MTPD), DRP","จัดทำ RACI + แผนสื่อสาร + รวบรวม ITSM Ticket, ผลความพึงพอใจ, Escalation Log","จัดทำ ITSM Dashboard + กำหนด Leading/Lagging Indicator","จัดทำ Root Cause Analysis + ปรับปรุงแผนดิจิทัล + จัดเก็บ Knowledge Base ลงระบบ"],good:["กำหนดกระบวนการบริหารจัดการ Incident, Service Requests และ Problem ด้านไอทีอย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","นำระบบ ITSM (Service Desk) มาใช้บันทึก วิเคราะห์ และติดตามการแก้ไขปัญหา","กำหนดระดับความรุนแรง (Severity) และ Escalation Matrix เชื่อมโยงกับ RTO และ MTPD","มี Knowledge Error Database (KEDB) ในระบบ ITSM เพื่อสืบค้นวิธีแก้ปัญหาที่เคยเกิดขึ้น","มีหลักฐาน Implementation เชิงประจักษ์ที่ชัดเจน"],gaps:["ติดกับดัก Output: แม้จะใช้ 'รายงานสรุปปัญหาประจำเดือน' หรือ 'ผลสำรวจความพึงพอใจ' TRIS มองว่านี่คือ Output (นับจำนวน Ticket) ไม่ใช่ Outcome","ขาด Leading/Lagging Indicator ของกระบวนการ IT Service Management","การวิเคราะห์ Root Cause เพื่อป้องกันปัญหาซ้ำยังไม่ถูกผูกกับตัวชี้วัดความสำเร็จขององค์กร"],results:["(L1-3) ใช้งาน ITSM เต็มรูปแบบ มี Escalation Matrix จัดลำดับความรุนแรงตาม BCP/DRP จัดทำ Knowledge Base และสำรวจความพึงพอใจ","(L4) มีตัววัดผลลัพธ์ (Outcome) ผ่านรายงาน เช่น รายงานการแก้ไขปัญหาประจำเดือน รายงาน Availability ของระบบสำคัญ","(L5) นำข้อมูลมาวิเคราะห์จัดทำแผนปฏิบัติการดิจิทัล ประจำปี 2568"],tris:[],suggest:[],docs:[],bestprac:[],actions:["เปลี่ยนผ่านสู่ Outcome, Leading และ Lagging: Leading เช่น ร้อยละความสำเร็จในการแก้ปัญหาผ่าน Self-service/Knowledge Base; Lagging เช่น MTTR และจำนวน Repeated Incidents; Outcome เช่น มูลค่าความเสียหายทางธุรกิจที่ลดลง","เน้น Problem Management ไม่ใช่แค่ Incident Management: นำ Repeated Incidents มาทำ Root Cause Analysis และสร้าง Action Plan อุดช่องโหว่อย่างถาวร"],minReqs:{"1":["นโยบาย/แนวทางการบริหารจัดการเหตุการณ์ผิดปกติ (Incident) และการร้องขอ (Service Request) ที่ได้รับการอนุมัติ"],"2":["คู่มือและกระบวนการทำงานที่ต้องมีองค์ประกอบบังคับ (ต้องมีครบทุกข้อย่อยด้านล่าง)","การแบ่งประเภท (Categorization) และจัดระดับความรุนแรง (Severity Level)","หลักเกณฑ์การส่งต่อปัญหา (Escalation Process)","การกำหนดกรอบเวลาแก้ไขปัญหา โดยอิงเป้าหมายเวลากู้คืน (RTO) และเวลาสูงสุดที่ยอมให้ธุรกิจหยุดชะงัก (MTPD)","มีแผนฉุกเฉิน (IT Contingency Plan) และคู่มือรับมือภัยพิบัติ (DRP)"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสาร","รายงานประเมินผลการรับรู้ของผู้ใช้งาน","หลักฐานเชิงประจักษ์ (Implementation): หน้าจอระบบ ITSM (Service Desk Console) ที่มีข้อมูลการแจ้งซ่อม/ร้องขอจริงๆ, บันทึกการประเมินความพึงพอใจของผู้ใช้งาน และบันทึกการส่งต่อปัญหา (Escalation Log)"],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ที่มีตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator) อย่างชัดเจน"],"5":["รายงานการถอดบทเรียนวิเคราะห์รากเหง้าปัญหา (Root Cause Analysis: RCA) ที่นำไปสู่การปรับปรุงแผนปฏิบัติการดิจิทัล/การจัดทำนวัตกรรม และหลักฐานการเก็บองค์ความรู้ (Knowledge Base) ลงระบบ ITSM"]},subComps:{"2":["SLA ต้องดึงมาจาก BCP: การกำหนดกรอบเวลาแก้ไขปัญหา (SLA) ห้ามคิดขึ้นเอง แต่ต้องดึงค่า RTO และ MTPD มาจากข้อ 6.4 (Business Continuity)"],"3":["Vendor Evaluation: หากปัญหาถูกส่งต่อให้ Outsource หรือ Vendor แก้ไข ฝ่าย DT ต้องมีกระบวนการประเมินผู้รับจ้าง (ใบตรวจรับการทำงาน) ซ่อนอยู่ด้วย"],"5":["Incident vs Problem Management: การแก้เซิร์ฟเวอร์ค้างด้วยการ Restart คือ Incident (ระดับ 3) แต่การหาสาเหตุว่าทำไมถึงค้าง แล้วแก้ไม่ให้ค้างอีก คือ Problem Management (ระดับ 5) — เกณฑ์ซ่อนการจัดการ 2 ระดับนี้ไว้ด้วยกัน"]}},
  {id:"6.4",grp:"6",gname:"การบริหารความต่อเนื่องทางธุรกิจและความพร้อมใช้ของระบบ (Business Continuity and Availability Management)",gw:10,gs68:3.0,name:"การบริหารจัดการความต่อเนื่องทางธุรกิจ (Business Continuity Management)",w:2.5,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์ Business Continuity Management (BCM) ครอบคลุม Policy (เตรียมพร้อมรับมือวิกฤต) BIA Completeness (Process) ความพร้อมจริงผ่านการซ้อม (Execution) Value Protection (Value Realization) และ Resilience & Continuous Improvement",dimLevels:["Policy: ตระหนักรู้และเตรียมพร้อมรับมือวิกฤตขององค์กร","Process & BIA Completeness: BIA ต้องตอบได้ว่าถ้าระบบ A ล่ม จะสูญเสียเงินหรือเสียชื่อเสียงเท่าไร เพื่อกำหนด RTO ที่เหมาะสม","Execution & Readiness: แผนบนกระดาษไม่มีประโยชน์ถ้าพนักงานและ Vendor ไม่เคยซ้อมปฏิบัติจริง","Value Realization: วัดว่าแผน BCP ช่วยปกป้องมูลค่าทางธุรกิจ (Value Protection) ได้อย่างไรเมื่อเกิดเหตุฉุกเฉิน","Resilience & Continuous Improvement: นำจุดบกพร่องตอนซ้อมมาอุดช่องโหว่ไม่ให้เกิดซ้ำ"],levelSumm:["จัดทำนโยบาย IT BCP และ DRP + สอดคล้องนโยบายระดับองค์กร + ขออนุมัติคณะกรรมการ","จัดทำคู่มือ BCP ครอบคลุม 8 องค์ประกอบ: Risk Analysis, BIA, ลำดับระบบ, กลยุทธ์, MTPD/RTO/RPO, BCP/DRP, อบรม, ทดสอบ","จัดทำ RACI + แผนสื่อสาร + ซ้อมแผน BCP/DRP ประจำปี + รวบรวม Log การกู้คืน","จัดทำ Dashboard BCM + กำหนด Leading/Lagging Indicator","จัดทำ AAR หลังซ้อมแผน + นำข้อค้นพบปรับปรุง IT BCP + จัดเก็บลงระบบ KM"],good:["กำหนดกระบวนการบริหาร BCM อย่างเป็นระบบ ทำซ้ำได้ เป็นมาตรฐาน","จัดทำแผน IT BCP และ DRP สอดคล้องกับนโยบายความเสี่ยงองค์กร อนุมัติโดยคณะกรรมการที่เกี่ยวข้อง","มีการวิเคราะห์ผลกระทบทางธุรกิจ (BIA) และจัดลำดับความสำคัญของระบบงาน","กำหนด RTO, RPO และ MTPD ชัดเจน (เช่น MTPD = 48 ชั่วโมง)","มีหลักฐาน Implementation ผ่านการทดสอบและซักซ้อมแผน BCP ประจำปี (เช่น ซ้อมเมื่อ 25 ก.ย. 68)"],gaps:["ตกม้าตาย Level 4: TRIS ฟันธงว่า 'Service Availability 99.99%' และ 'ทดสอบแผนสำเร็จ 100%' คือ Output ไม่ใช่ Outcome — TRIS ต้องการ 'มูลค่าความเสียหายทางธุรกิจที่ป้องกันได้ (Business Value Protected)' และยังขาด Leading/Lagging Indicator","TRIS ต้องการเห็นว่าถ้าระบบกู้คืนช้ากว่า RTO ในการซ้อม ผู้บริหารสั่งการปรับสถาปัตยกรรม (EA) หรือเปลี่ยนเทคโนโลยีทันทีหรือไม่"],results:["(L1-3) มีนโยบาย แผน IT BCP/DRP, BIA, MTPD/RTO/RPO มีการอบรมพนักงาน และมีการทดสอบซักซ้อมแผนจริง","(L4) กำหนดตัวชี้วัดผลลัพธ์ เช่น ความสำเร็จในการกู้คืน 3 ระบบสำคัญ (CTMS, ERP, HRIS) ภายใน 48 ชั่วโมง และ Service Availability ปี 2568 ที่ 99.99%","(L5) นำข้อมูลจากการทดสอบแผนวิเคราะห์เพื่อจัดทำแผนปฏิบัติการดิจิทัล ประจำปี 2568 และนำเสนอต่อคณะทำงานและคณะกรรมการ"],tris:[],suggest:[],docs:[],bestprac:[],actions:["ยกระดับ KPI เป็น Leading/Lagging: Leading เช่น ร้อยละระบบงานใหม่ที่มีแผน BCP/DRP รองรับก่อนเปิดใช้งาน; Lagging เช่น จำนวนชั่วโมงระบบหยุดชะงักจริง (นอกเหนือจากการทดสอบ)","เปลี่ยนตัวชี้วัดให้สะท้อน Outcome: แทนที่จะวัด 'กู้ระบบได้ตามเวลา' เปลี่ยนเป็น 'มูลค่าความเสียหายทางธุรกิจ (Business Value) ที่ กทท. สามารถป้องกันได้จากการกู้คืนที่รวดเร็ว'"],minReqs:{"1":["นโยบาย/แผนบริหารความต่อเนื่องทางธุรกิจด้านเทคโนโลยีสารสนเทศ (IT BCP) และแผนกู้คืนระบบ (DRP) ที่สอดคล้องกับนโยบายระดับองค์กรและอนุมัติโดยคณะกรรมการ"],"2":["คู่มือและกระบวนการที่มีองค์ประกอบบังคับครบถ้วน (ต้องมีครบทุกข้อย่อยด้านล่าง)","การประเมินความเสี่ยง (Risk Analysis)","การวิเคราะห์ผลกระทบทางธุรกิจ (BIA) ที่ครอบคลุมระบบงานสำคัญ","การจัดลำดับความสำคัญของระบบงาน","การกำหนดกลยุทธ์แผน IT BCP","การกำหนดเป้าหมายเวลา ได้แก่ MTPD, RTO และ RPO","การจัดทำแผน IT BCP/DRP","การสื่อสารและฝึกอบรม","การทดสอบ ปรับปรุง และสอบทานแผน (IT BCP Drill)"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสาร","รายงานประเมินผลการรับรู้ของผู้มีส่วนได้ส่วนเสีย","หลักฐานเชิงประจักษ์ (Implementation): รายงานสรุปผล \"การซ้อมแผนฉุกเฉิน (BCP/DRP Drill)\" ประจำปีที่เกิดขึ้นจริง พร้อมภาพถ่ายและ Log การกู้คืนระบบ"],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ของกระบวนการ BCM ที่มีตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator)"],"5":["รายงานถอดบทเรียน (AAR) หลังการซ้อมแผน และรายงานการประชุมคณะกรรมการที่นำข้อค้นพบไปปรับปรุงแผนแม่บทดิจิทัล/แผน IT BCP ในปีถัดไป และจัดเก็บเป็นนวัตกรรมหรือความรู้ลงระบบ KM"]},subComps:{"2":["Corporate RM Alignment: แผน IT BCP ตั้งค่าขึ้นมาลอยๆ ไม่ได้ ค่า MTPD (ระยะเวลาสูงสุดที่ธุรกิจยอมหยุดชะงักได้) ต้องดึงมาจากแผน BCM ระดับองค์กร"],"3":["Vendor's BCP: หากระบบที่สำคัญ (เช่น CTMS, ERP) มี Vendor หรือ Cloud Provider ดูแลร่วมด้วย การซ้อมแผนต้องซ้อมร่วมกับ Vendor และประเมิน SLA ของ Vendor ด้วยว่ากู้ระบบทัน RTO หรือไม่"]}},
  {id:"7.1",grp:"7",gname:"การบริหารจัดการการใช้ทรัพยากรอย่างเหมาะสม (Resource Optimization)",gw:10,gs68:2.875,name:"การดำเนินการด้านการบริหารจัดการการใช้ทรัพยากรอย่างเหมาะสม (Resource Optimization Management)",w:5,s68:2.875,status:"ยังไม่เริ่ม",statusNote:"",scope:null,scopeNote:"ประเมินความสมบูรณ์กระบวนการบริหารทรัพยากร DT ครอบคลุม Policy (ลดความซ้ำซ้อน) Categorization & Standardization (Process) การรีดประสิทธิภาพจากทรัพยากรที่มีอยู่ (Execution) การวัดมูลค่าทางการเงิน (Value Realization) และการนำผลประเมินปรับโมเดลการลงทุน IT",dimLevels:["Policy: มีแนวทางลดความซ้ำซ้อนและลดความสิ้นเปลืองในการจัดซื้อเทคโนโลยี","Categorization & Standardization: เกณฑ์การจัดสรรทรัพยากรชัดเจน (End User, Departmental, Enterprise Computing)","Execution & Optimization: แสดงให้เห็นว่ามีการ 'รีดประสิทธิภาพ' จากทรัพยากรที่มีอยู่ให้คุ้มค่าสูงสุด ไม่ใช่เอะอะก็ตั้งงบซื้อใหม่","Value Realization: วัดมูลค่าทางการเงินที่ประหยัดได้ (Cost Saving) หรือ ROI ที่คุ้มค่า","Continuous Improvement: นำผลประเมินมาปรับโมเดลการลงทุน IT เช่น เปลี่ยนจาก CAPEX เป็น OPEX/Cloud"],levelSumm:["จัดทำนโยบายบริหารจัดการทรัพยากร DT อย่างเหมาะสม","จัดทำคู่มือจัดสรรทรัพยากร: End User, Departmental, Enterprise Computing (Cloud, Network, Software)","จัดทำ RACI + แผนสื่อสาร + รวบรวมหลักฐาน Consolidation โครงการลดทรัพยากรซ้ำซ้อน","จัดทำ Dashboard วัด Outcome + กำหนด Leading/Lagging Indicator","นำผลประหยัดทรัพยากรทบทวนแผน IT + จัดเก็บลงระบบ KM"],good:["กำหนดกระบวนการบริหารจัดการทรัพย์สินด้าน IT อย่างเป็นระบบ","มีมาตรฐานและระเบียบวิธีปฏิบัติในการจัดสรรทรัพยากร DT และ Capacity Management บางส่วน","มุ่งเน้นการใช้ทรัพยากรและการลงทุนด้าน IT ให้เกิดมูลค่าสูงสุด (Value Optimization)","มี Implementation เชิงประจักษ์ที่เหนือกว่าองค์กรคู่เทียบ"],gaps:["ตกม้าตาย Level 4: TRIS ระบุว่ายังขาดการกำหนดตัวชี้วัดผลลัพธ์รายโครงการ 'ให้ครบถ้วนในทุกมิติ (เงิน คน ระบบ เวลา ทรัพยากรพื้นฐาน)' — กทท. เน้นแค่การจัดสรรคอมพิวเตอร์และกระดาษ ขาดการโชว์ว่าโครงการ IT ใหญ่ๆ ประเมินความคุ้มค่าของการใช้ 'คน' 'เวลา' และ 'ระบบ' ครบทุกด้านหรือไม่","ขาดการประเมินความเสี่ยงด้านการจัดสรรทรัพยากรและมาตรการรองรับ"],results:["(L1-2) จัดทำคู่มือและกระบวนการบริหารทรัพยากร ครอบคลุมการจัดสรร บริหาร Capacity และกำหนดตัวชี้วัดเพื่อลงทุนให้เกิดมูลค่าสูงสุด","(L3) มีการวิเคราะห์ผู้มีส่วนได้ส่วนเสียผ่าน RACI Chart","(L4-5) ติดตามผลตามเป้าหมายยุทธศาสตร์ที่ 2 เช่น ลดเอกสารกระดาษ (e-Saraban ลดกระดาษ >50%) จัดสรรเครื่องคอมพิวเตอร์ และนำเข้าที่ประชุมเพื่อทบทวนนโยบาย"],tris:[],suggest:[],docs:[],bestprac:[],actions:["กำหนดกรอบ KPI โครงการ 5 มิติ (5-Dimension Resource Matrix): ทุกโครงการ IT ก่อนและหลังปิด ต้องมีตารางสรุปตัวชี้วัดการใช้ทรัพยากรครบ 5 ด้าน: งบประมาณ (เงิน), บุคลากร (คน), แพลตฟอร์ม (ระบบ), ระยะเวลา (เวลา), สถานที่/เครื่องมือ (พื้นฐาน)","เน้น Outcome: แปลงตัวชี้วัดเป็นผลลัพธ์ เช่น 'โครงการ e-Saraban ประหยัดงบประมาณกระดาษและเวลาคิดเป็นมูลค่ารวมกี่ล้านบาท'"],minReqs:{"1":["นโยบายหรือแนวทางในการบริหารจัดการการใช้ทรัพยากรด้านเทคโนโลยีดิจิทัลอย่างเหมาะสม"],"2":["คู่มือและระเบียบวิธีปฏิบัติในการจัดสรรทรัพยากร ซึ่งบังคับว่าต้องครอบคลุม (ต้องมีครบทุกข้อย่อยด้านล่าง)","End User Computing: คอมพิวเตอร์ส่วนบุคคล (Desktop/Mobile)","Departmental Computing: การใช้งานระดับแผนก เช่น การพิมพ์และวัสดุสิ้นเปลือง (Printing & Consumables)","Enterprise Computing: ระบบส่วนกลาง เช่น Data Center, เครือข่าย (Network), คลาวด์ (Cloud & Outsourcing) และ Software Architecture"],"3":["เอกสารวิเคราะห์ Stakeholder (RACI) และแผนการสื่อสารเรื่องการใช้ทรัพยากร","รายงานประเมินประสิทธิภาพของการสื่อสาร","หลักฐานเชิงประจักษ์ (Implementation): แฟ้มสรุปโครงการที่แสดงการรวบศูนย์ทรัพยากร (Consolidation) เช่น โครงการลดจำนวน Server ด้วยการใช้ Virtualization (VM) หรือรายงานการปรับลดโควต้าเครื่องพิมพ์/กระดาษของแต่ละฝ่าย"],"4":["Dashboard/รายงานวัดผลลัพธ์ (Outcome) ของการใช้ทรัพยากร ที่แสดงตัวชี้วัดนำ (Leading Indicator) และตัวชี้วัดตาม (Lagging Indicator) อย่างชัดเจน"],"5":["รายงานการประชุมคณะกรรมการฯ ที่นำผลลัพธ์การประหยัดทรัพยากรไปทบทวนเพื่อปรับปรุงแผนปฏิบัติการดิจิทัล/การลงทุนไอทีในอนาคต และหลักฐานการนำขึ้นระบบ KM"]},subComps:{"2":["The EA & IT Asset Link: การทำ Resource Optimization จะทำไม่ได้เลยถ้าไม่มีรากฐานจากสถาปัตยกรรมองค์กร (DT 2.1) ที่บอกว่าองค์กรมีระบบอะไรซ้ำซ้อนบ้าง และทะเบียนทรัพย์สินไอที (DT 6.1) ที่บอกว่ามีเครื่องมืออะไรเหลืออยู่"],"3":["Cloud-First Policy: ภายใต้หัวข้อ Outsourcing & Cloud เกณฑ์ สคร. มุ่งหวังให้พิจารณาการใช้บริการ Cloud Service ก่อนการลงทุนสร้าง Data Center ของตัวเอง เพื่อลดภาระการบำรุงรักษา"],"4":["TCO (Total Cost of Ownership): การวัดผลความคุ้มค่า ไม่ใช่วัดแค่ราคาตอนซื้อ (Purchasing Cost) แต่ต้องครอบคลุมค่าไฟ ค่าซ่อม ค่าลิขสิทธิ์ซอฟต์แวร์ตลอดอายุการใช้งาน"]}},

// ── STATE ────────────────────────────────────────────────────────────
let dtMrChk={};   // dtMrChk[sid][L][ri] = bool — minReqs gating
let dtScChk={};   // dtScChk[sid][L][si] = bool — subComps partial credit
let dtDimMlt={};  // dtDimMlt[sid][L] = 0|0.5|1.0 — fallback when no subComps
let docCk={};let feInput={};let clChecked={};
let targets={dt:{}};let focusId=null;

DATA.dt.subs.forEach(s=>{
  dtMrChk[s.id]={};dtScChk[s.id]={};dtDimMlt[s.id]={};
  targets.dt[s.id]=s.s68;
  for(let L=1;L<=5;L++){
    dtMrChk[s.id][L]={};
    dtScChk[s.id][L]=(s.subComps&&s.subComps[L])?s.subComps[L].map(()=>false):[];
    dtDimMlt[s.id][L]=0;
  }
});

// ── LOAD ─────────────────────────────────────────────────────────────
async function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    if(d.mr)Object.assign(dtMrChk,d.mr);
    if(d.sc)Object.assign(dtScChk,d.sc);
    if(d.dm)Object.assign(dtDimMlt,d.dm);
    if(d.cl)Object.assign(clChecked,d.cl);
    if(d.dc)Object.assign(docCk,d.dc);
    if(d.fe)Object.assign(feInput,d.fe);
  }catch(e){}
  const remote=await ebFetchDim(DIM_KEY,4000);
  if(remote&&remote.data&&Object.keys(remote.data).length){
    try{
      const d=remote.data;
      if(d.mr)Object.assign(dtMrChk,d.mr);
      if(d.sc)Object.assign(dtScChk,d.sc);
      if(d.dm)Object.assign(dtDimMlt,d.dm);
      if(d.cl)Object.assign(clChecked,d.cl);
      if(d.dc)Object.assign(docCk,d.dc);
      if(d.fe)Object.assign(feInput,d.fe);
      localStorage.setItem(LS_KEY,JSON.stringify(d));
    }catch(e){}
  }
  DATA.dt.subs.forEach(s=>{targets.dt[s.id]=dtCalcRaw(s.id)||s.s68;});
}

// ── SAVE / EXPORT / IMPORT ───────────────────────────────────────────
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({mr:dtMrChk,sc:dtScChk,dm:dtDimMlt,cl:clChecked,dc:docCk,fe:feInput}));}catch(e){}
  syncHomeStatus();
  ebScheduleSaveDim(DIM_KEY,
    ()=>JSON.parse(localStorage.getItem(LS_KEY)||'{}'),
    ()=>{const h=JSON.parse(localStorage.getItem('seam_status_69')||'{}');return h[DIM_KEY]||{};},
    800);
}
function exportProgress(){
  const payload=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  payload._exported=new Date().toISOString();payload._dim='DT';
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='DT_progress_'+new Date().toLocaleDateString('th-TH').replace(/\//g,'')+'.json';
  a.click();
}
function importProgress(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const exp=d._exported?new Date(d._exported).toLocaleString('th-TH'):'ไม่ระบุ';
      if(!confirm('นำเข้าข้อมูล DT (ส่งออกเมื่อ '+exp+')\nจะทับข้อมูลปัจจุบัน — ยืนยัน?'))return;
      delete d._exported;delete d._dim;
      localStorage.setItem(LS_KEY,JSON.stringify(d));
      loadState();renderAll();
    }catch(err){alert('ไฟล์ไม่ถูกต้อง');}
  };
  reader.readAsText(file);input.value='';
}
function syncHomeStatus(){
  try{
    const home=JSON.parse(localStorage.getItem('seam_status_69')||'{}');
    if(!home[DIM_KEY])home[DIM_KEY]={};
    DATA.dt.subs.forEach(s=>{
      const score=dtCalcRaw(s.id);
      const gc=(s.gaps||[]).length;
      home[DIM_KEY][s.id]={level:score,hasOpenGap:gc>0,gapCount:gc};
    });
    localStorage.setItem('seam_status_69',JSON.stringify(home));
  }catch(e){}
}

// ── SCORING ──────────────────────────────────────────────────────────
function dtCalcLevel(sid,L){
  const s=DATA.dt.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(dtDimMlt[sid]&&dtDimMlt[sid][L])||0;
}
function dtCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=dtCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.dt.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>dtCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${dtCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=dtCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((dtScChk[sid]&&dtScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(dtDimMlt[sid]&&dtDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.dt[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.dt[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#ea580c':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#ea580c':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#ea580c;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#ea580c':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=dtMrChk[sid]&&dtMrChk[sid][L]&&dtMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';
        mrH+=`<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck} ${dis} onchange="dtToggleMR('${sid}',${L},${ri},this.checked);" style="accent-color:#ea580c;"><label for="${kid}">${txt}</label></div>`;

      dimH=`<div class="cg-sect-lbl" style="margin-top:8px;">📊 ประเด็นที่เปิดเผย (L${L}) — <span style="color:#ea580c;">${scChecked}/${scs.length} = ${rv.toFixed(4)}</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${scPct}%;background:${scChecked===scs.length?'#ea580c':'#2a8a50'};"></div></div>`;
      scs.forEach((txt,si)=>{

      });
    }else{
      const dis=ls.bl?'disabled':'';

        dimH+=`<label style="padding:3px 6px;border-radius:5px;background:${ck?(v===1?'#e0f5e8':v===0.5?'#fef8e0':'#fee8e8'):'transparent'};border:1px solid ${ck?col:'transparent'};color:${ck?col:'#444'};font-weight:${ck?'700':'400'};cursor:${ls.bl?'not-allowed':'pointer'};"><input type="radio" name="cgdim-${sid}-${L}" value="${v}" ${ck} ${dis} onchange="dtSetDim('${sid}',${L},${v});" style="accent-color:${col};flex-shrink:0;"> ${lbl}</label>`;
      });
      dimH+='</div>';
    }
    const dimStrip=ints.length?`<div class="lvl-dim-strip">${ints.map(dimBadge).join(' ')}</div>`:'';
    lvlHTML+=`<div class="cg-lvl-row${ls.bl?' blocked':L===gapL?' is-gap':''}">

        <span class="cg-lvl-summ"><span class="kt">${summ}</span>${(!ls.bl&&L===gapL)?'&nbsp;<span class="dim-gap-tag">⚠️ ช่องว่าง</span>':''}</span>
        <span style="display:flex;gap:3px;align-items:center;flex-shrink:0;">${xBtn}<span style="font-size:10px;font-weight:700;color:${sCol};min-width:28px;text-align:right;">${ls.bl?'—':rv.toFixed(2)}</span></span>
      </div>

        ${mrH}<div${!ls.passedMR&&mrs.length?' style="pointer-events:none;opacity:.5;"':''}>${dimH}</div>
      </div>
    </div>`;
  });

  return `<div class="cg-sim">
    <div class="cg-sim-hd">
      <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy);color:#fff;">DT</span>

}
