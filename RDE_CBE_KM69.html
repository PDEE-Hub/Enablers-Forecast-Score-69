  {id:"4.1",grp:"4",gname:"กระบวนการจัดการความรู้",gw:8.0,gs68:2.85,name:"กระบวนการจัดการความรู้ที่เป็นระบบและการนำเทคโนโลยีมาประยุกต์ใช",w:6.0,s68:2.8,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมินความครบถ้วนของกระบวนการ KM ทั้ง 7 ขั้นตอน (บ่งชี้ แสวงหา จัดเก็บ เข้าถึง แลกเปลี่ยน นำไปใช้ และประเมินผล) การประยุกต์ใช้ทฤษฎีเกลียวความรู้ (SECI Model) การสื่อสารขั้นตอนให้พนักงานเข้าใจ การนำไปปฏิบัติจนเกิดผลลัพธ์ และ การนำเทคโนโลยี (AI/Digital Platform) มาสนับสนุน พร้อมด้วยการกำหนด แผนที่ความรู้ (Knowledge Map) ที่เน้นความรู้ที่สำคัญ (Critical Knowledge)",levelSumm:["องค์กรมีการกำหนดกระบวนการ KM อย่างเป็นระบบ ครอบคลุมการจัดการทั้งความรู้ชัดแจ้ง (Explicit) และความรู้ฝังลึก (Tacit) และอธิบายการประยุกต์ใช้ SECI Model","กระบวนการจัดการความรู้ ถูกสื่อสารให้กับบุคลากร \"ทุกระดับ\" เพื่อให้เกิดความเข้าใจในแต่ละขั้นตอนได้อย่างถูกต้อง","กระบวนการจัดการความรู้ ถูกนำไปดำเนินการและ \"ปฏิบัติให้เกิดขึ้นได้จริงในทุกขั้นตอน\"","การนำเทคโนโลยีมาสนับสนุนในแต่ละขั้นตอนอย่างเหมาะสม รวมถึง \"การกำหนดความรู้ที่สำคัญ (Critical Knowledge)\" และพัฒนาบุคลากรให้มีความสามารถใช้เทคโนโลยีได้","ใช้ข้อมูลป้อนกลับจากการดำเนินงาน และข้อมูลจากแหล่งอื่นๆ ในการ \"ปรับปรุงกระบวนการจัดการความรู้\" อย่างสม่ำเสมอ เพื่อให้เกิดประสิทธิภาพสูงสุด"],good:["ทำได้คะแนนเต็มใน ระดับ 1, 2 และ 3 เพราะ กทท. มีระเบียบขั้นตอนการทำ KM ที่ชัดเจน มีการสื่อสารอบรม และมีการปฏิบัติจริงจนเกิดการปรับปรุงกระบวนงานถึง 11 กระบวนงาน","กทท. มีความพยายามที่ดีมากในการนำ AI อย่าง Google Notebook LM เข้ามาใช้"],gaps:["แต่ในมุมของผู้ตรวจประเมินมองว่า \"พื้นฐานโครงสร้างข้อมูล (Data Structure)\" ของ กทท. ยังไม่เป็นระเบียบพอ (เช่น ยังไม่มี Knowledge Map หรือการแยก Category ที่ชัดเจน) การเอา AI มาสวมทับข้อมูลที่ยังกระจัดกระจายจากการย้ายระบบ จึงยังไม่เกิดประสิทธิผลสูงสุด กทท. จำเป็นต้องจัดระเบียบโครงสร้างคลังความรู้ใหม่ให้ชัดเจนก่อน"],results:["มีการกำหนดกระบวนการจัดการความรู้ 7 ขั้นตอน โดยจัดแบ่งตามกระบวนงานสำคัญ 5 กระบวนงาน (เช่น การบริการร่องน้ำ, การบริการเรือ, สินค้าและตู้สินค้า ฯลฯ) มีการสร้าง/แสวงหา รวบรวม จัดเก็บ แลกเปลี่ยน และนำไปใช้","สื่อสารกระบวนการ KM ให้บุคลากรผ่านการประชุมคณะทำงาน, อบรมเชิงปฏิบัติการให้วิทยากรกระบวนการพื้นที่, ประชาสัมพันธ์ผ่าน Intranet, e-Learning และมีกิจกรรม CoP รวมถึงมีการประเมินการรับรู้ของบุคลากร","นำกระบวนการไปปฏิบัติจริง มีการจัดเก็บ OPK OPL ในระบบ Intranet/Google site แลกเปลี่ยนเรียนรู้ผ่าน CoP และจัดเวที KM Award และนำความรู้ไปปรับปรุงได้ 11 กระบวนงาน","นำเทคโนโลยีมาสนับสนุนกระบวนการ KM เช่น ใช้ Google/Chat GPT แสวงหาความรู้, จัดเก็บใน KMS/Intranet, และที่สำคัญคือการริเริ่มนำ Google Notebook LM (AI) มาช่วยสรุปและตอบคำถามจาก Knowledge Tank","ใช้ข้อมูลป้อนกลับเพื่อปรับปรุงกระบวนการ เช่น การพบข้อจำกัดของระบบเดิม จึงปรับปรุงมาใช้ Google Site และนำ AI มาประยุกต์ใช้เพื่อรองรับการค้นหาและโต้ตอบแบบเรียลไทม์ และจัดกิจกรรม KM Day เพื่อสร้าง Engagement"],tris:["ช่วงรอยต่อของการเปลี่ยนผ่านเทคโนโลยี (Technology Transition Gap): กทท. กำลังถ่ายโอนข้อมูลจากระบบเดิม (KM Portal) ไปสู่ Google Workspace ผู้ตรวจประเมินมองว่าช่วงรอยต่อนี้ ทำให้การสืบค้นองค์ความรู้สำคัญ \"ยังไม่ครอบคลุม\" กระบวนการหลักและกระบวนการสนับสนุนทั้งหมด","แผนที่ความรู้ยังไม่สมบูรณ์ (Knowledge Map & Category Gap): กทท. ยังขาดการจัดกลุ่มความรู้ (Knowledge Category) ที่สะท้อน \"ความรู้ที่สำคัญ (Critical Knowledge)\" และยังไม่มี \"แผนที่ความรู้ (Knowledge Map)\" ที่แบ่งแยกความรู้ฝังลึก (Tacit) และความรู้ชัดแจ้ง (Explicit) อย่างเป็นระบบและครอบคลุมทุกสายงาน"],suggest:["จัดทำ Knowledge Map ที่ครอบคลุม: กทท. ควรกำหนดและแบ่งกลุ่มความรู้ (Knowledge Category) ให้สะท้อนถึงความรู้ที่สำคัญ (Critical Knowledge) ทั้งระดับองค์กรและระดับสายงาน รวมถึงต้องจัดทำแผนที่ความรู้ (Knowledge Map) ที่ครอบคลุมทั้ง Tacit และ Explicit Knowledge เพื่อให้การระบุและเข้าถึงเป็นระบบ","ประเมินประสิทธิผลเทคโนโลยี: ขั้นตอนในกระบวนการจัดการความรู้ ต้องแสดงให้เห็นถึงการเลือกใช้ระบบเทคโนโลยีให้เหมาะสมในทุกขั้นตอน และสามารถ ประเมินประสิทธิผลของการใช้ระบบดิจิทัล เพื่อนำไปสู่การปรับปรุง","ก้าวสู่ Knowledge Graphs: สำหรับการพัฒนาระดับสูง ผู้ตรวจเสนอแนะให้รัฐวิสาหกิจใช้ Knowledge Graphs / Semantic Networks เพื่อจัดโครงสร้างข้อมูลที่ซับซ้อนให้ AI (LLMs) สามารถค้นหาเชิงบริบท (Predictive Analytics) ได้"],docs:["แผนที่ความรู้ระดับองค์กรและสายงาน (Enterprise Knowledge Map): เอกสารชิ้นสำคัญที่ กทท. ต้องทำ คือตารางแผนที่ความรู้ที่จัดกลุ่ม (Categorize) อย่างชัดเจนว่า ความรู้ไหนคือ Explicit ความรู้ไหนคือ Tacit ความรู้อยู่ที่กระบวนการใด ใครคือผู้เชี่ยวชาญ (Expert) และจัดเก็บอยู่ที่ใดใน Google Workspace","รายงานประเมินประสิทธิผลการใช้เทคโนโลยีและ AI (KM Technology Evaluation Report): เอกสารรายงานผลการใช้งาน Google Notebook LM หรือระบบอื่นๆ ว่ามีสถิติการใช้งานเท่าไหร่ ช่วยลดระยะเวลาการค้นหาข้อมูลได้กี่นาที/ชั่วโมง เพื่อยืนยันว่าการนำเทคโนโลยีมาใช้เกิด \"ประสิทธิผล\" จริง","การออกแบบสถาปัตยกรรมข้อมูลเพื่อ AI (Knowledge Graphs Conceptual Design): แม้จะยังทำไม่สมบูรณ์ 100% แต่ควรมีเอกสารเชิงเทคนิค หรือผังงาน (Flowchart) ที่แสดงให้ผู้ตรวจเห็นว่า กทท. มีวิสัยทัศน์ในการจัดโครงสร้างข้อมูลแบบ Semantic Networks/Knowledge Graphs เพื่อรองรับการค้นหาเชิงบริบทของ LLMs ในอนาคต"],bestprac:["รฟม. มีความโดดเด่นในการแก้ปัญหาเรื่อง แผนที่ความรู้ โดย รฟม. \"ใช้ GenAI เข้ามาช่วยวิเคราะห์ข้อมูลภายในองค์กร เพื่อจัดทำแผนที่ความรู้ (Knowledge Map) โดยเฉพาะ\" และใช้ Chatbot เพื่อเก็บคำถามที่พบบ่อย (FAQ) นำไปต่อยอดเป็นองค์ความรู้ใหม่","กทพ. มีการประยุกต์ใช้ Generative AI อย่างเป็นรูปธรรมและหลากหลายมาก ไม่ใช่แค่ค้นหาข้อมูล แต่รวมถึง \"โปรแกรมออกแบบ Infographic ด้วย Canva AI, โปรแกรมสร้างเสียง SUNO AI, และโปรแกรมสร้างวิดีโอ Runway ML\" เพื่อนำมาประยุกต์ใช้ในการผลิตสื่อ KM ให้เข้าถึงง่าย"],minReqs:{"1":["ตารางกระบวนการ KM 7 ขั้นตอน ที่เชื่อมโยงกับ \"กระบวนงานที่สำคัญ (Core Processes)\" (เช่น ของ กทท. มี 5 กระบวนงานหลัก ได้แก่ บริการร่องน้ำ, บริการเรือ, บริการสินค้าและตู้สินค้า, ให้เอกชนร่วมลงทุน, เช่าอสังหาฯ)","แผนภาพ/คู่มือ อธิบายการประยุกต์ใช้ SECI Model (Socialization, Externalization, Combination, Internalization) เข้ากับกระบวนการขององค์กร"],"2":["หลักฐานการสื่อสารขั้นตอน KM ผ่านช่องทางต่างๆ เช่น การประชุมคณะทำงาน, การฝึกอบรมเชิงปฏิบัติการให้วิทยากรกระบวนการพื้นที่, ระบบ Intranet หรือ e-Learning","รายงานผลการประเมินการรับรู้ (Awareness Assessment): สถิติและคะแนนที่พิสูจน์ว่าพนักงานเข้าใจกระบวนการ KM"],"3":["เอกสาร/รายงานผลการนำองค์ความรู้มาพัฒนาและปรับปรุงกระบวนงานจริง (เช่น รายงานการแก้ปัญหาจราจรติดขัดท่าเรือแหลมฉบัง, กระบวนการเก็บโฉนดท่าเรือเชียงแสน)","ตารางสรุปผลลัพธ์กระบวนงาน 7 ขั้นตอน ว่ามีการสร้าง แสวงหา จัดเก็บ และถูกนำไปใช้จริงกี่เรื่อง"],"4":["แผนที่ความรู้ระดับองค์กร (Enterprise Knowledge Map): ที่จัดกลุ่มความรู้ (Knowledge Category) และระบุความรู้ที่สำคัญ (Critical Knowledge) อย่างเป็นหมวดหมู่","หลักฐานการนำเทคโนโลยีมาใช้ (เช่น หน้าจอระบบ Google Workspace, Google Notebook LM, PAT Chatbot AI)","หลักฐานการจัดอบรม/คู่มือการพัฒนาบุคลากรให้ใช้งานระบบสารสนเทศด้าน KM (เช่น สถิติผู้ใช้งาน e-Learning/Google Site)"],"5":["ตาราง Feedback Loop Matrix: ที่แสดงความสัมพันธ์ เช่น พนักงานพบว่าระบบคลังความรู้เดิม (KM Portal) ค้นหาข้อมูลยาก -> ผู้บริหารตัดสินใจย้ายระบบและนำ AI (Google Notebook LM) มาใช้ช่วยสรุปเอกสารใน Knowledge Tank -> สถิติการเข้าถึงและแก้ปัญหาของพนักงานรวดเร็วขึ้น","หลักฐานการปรับปรุงกิจกรรมเพื่อกระตุ้นการใช้งาน เช่น จัดกิจกรรม \"KM Day\" หรือ \"KM Sharing\" เชิงรุก"]},subComps:{"1":["SECI Model ต้องเห็นเป็น \"วงจร (Spiral)\": ใน Level 1 การอ้างถึง SECI Model ไม่ใช่แค่แปะรูปทฤษฎี แต่ต้องอธิบายให้ได้ว่า กทท. มีกระบวนการวนลูปอย่างไร เช่น ให้ผู้เชี่ยวชาญเกษียณอายุมาเล่าประสบการณ์ (Socialization) -> ถอดเทปเป็นคู่มือ (Externalization) -> นำคู่มือเก่าใหม่มารวมกันใน Google Site (Combination) -> ให้พนักงานใหม่ไปอ่านและลงมือทำหน้างาน (Internalization) และวนลูปเรื่อยๆ"],"2":[],"3":[],"4":["จุดตายเรื่อง \"แผนที่ความรู้ (Knowledge Map)\": กทท. ได้นำ Google Notebook LM มาใช้ซึ่งถือว่าล้ำหน้ามาก แต่ สคร. มองเห็นจุดอ่อน (Gap) ว่าในช่วงรอยต่อของการเปลี่ยนผ่านระบบ ทำให้โครงสร้างข้อมูลเดิมกระจัดกระจาย สิ่งที่ซ่อนอยู่ใน Level 4 คือ AI จะเก่งได้ โครงสร้างข้อมูลต้องเป็นระเบียบ กทท. จึงต้องจัดทำเอกสาร \"แผนที่ความรู้ (Knowledge Map)\" ที่ระบุหมวดหมู่ความรู้ชัดแจ้ง (Explicit) และความรู้ฝังลึก (Tacit) ให้ชัดเจนก่อนนำ AI ไปจับ","การแยกแยะ \"ความรู้ทั่วไป\" กับ \"ความรู้ที่สำคัญ (Critical Knowledge)\": ใน Level 4 ผู้ตรวจประเมินไม่ต้องการเห็นการนำคู่มือทั่วไปมาใส่ระบบ แต่ต้องการเห็นการวิเคราะห์ว่า \"อะไรคือ Critical Knowledge ที่ส่งผลต่อยุทธศาสตร์โดยตรง\" (เช่น ความรู้ด้านการจัดการสินค้าอันตราย, ความรู้การซ่อมบำรุงเรือ) และต้องเน้นเอาเทคโนโลยีไปจับที่ความรู้กลุ่มนี้เป็นพิเศษ"],"5":[]},dimScope:{"1":["องค์กรมีการกำหนดกระบวนการ KM อย่างเป็นระบบ ครอบคลุมการจัดการทั้งความรู้ชัดแจ้ง (Explicit) และความรู้ฝังลึก (Tacit) และอธิบายการประยุกต์ใช้ SECI Model"],"2":["กระบวนการจัดการความรู้ ถูกสื่อสารให้กับบุคลากร \"ทุกระดับ\" เพื่อให้เกิดความเข้าใจในแต่ละขั้นตอนได้อย่างถูกต้อง"],"3":["กระบวนการจัดการความรู้ ถูกนำไปดำเนินการและ \"ปฏิบัติให้เกิดขึ้นได้จริงในทุกขั้นตอน\""],"4":["การนำเทคโนโลยีมาสนับสนุนในแต่ละขั้นตอนอย่างเหมาะสม รวมถึง \"การกำหนดความรู้ที่สำคัญ (Critical Knowledge)\" และพัฒนาบุคลากรให้มีความสามารถใช้เทคโนโลยีได้"],"5":["ใช้ข้อมูลป้อนกลับจากการดำเนินงาน และข้อมูลจากแหล่งอื่นๆ ในการ \"ปรับปรุงกระบวนการจัดการความรู้\" อย่างสม่ำเสมอ เพื่อให้เกิดประสิทธิภาพสูงสุด"]},crosslinks:[{"level":"1","dim":"SP"},{"level":"2","dim":"KM3.1"},{"level":"3","dim":"KM5.1"},{"level":"4","dim":"DT"},{"level":"5","dim":"DT"}]},
  {id:"4.2",grp:"4",gname:"กระบวนการจัดการความรู้",gw:8.0,gs68:2.85,name:"สารสนเทศ/ความรู้จากหน่วยงานภายนอก",w:2.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:"ขอบเขตของเกณฑ์นี้มุ่งเน้นประเมิน \"ระบบนิเวศการเรียนรู้ภายนอกองค์กร (Ecosystem KM)\" ตั้งแต่ความสามารถในการระบุตัวตนของผู้มีส่วนได้ส่วนเสียที่ถูกต้อง → การดึงความรู้ที่ซ่อนอยู่จากภายนอกเข้ามา (Inbound) → การถ่ายทอดองค์ความรู้ขององค์กรกลับไปสู่ภายนอก (Outbound) เพื่อเป็นแบบอย่างที่ดี → และที่สำคัญที่สุดคือ การนำความรู้เหล่านั้นมาบูรณาการสร้างมูลค่าเพิ่มและนวัตกรรมแบบเปิด (Open Innovation) เพื่อยกระดับความสามารถในการแข่งขันขององค์กร",levelSumm:["มิติความสอดคล้องและความครอบคลุม ประเมินว่ากลุ่ม Stakeholder ที่ระบุในด้าน KM สอดคล้องกับที่ระบุไว้ในระดับองค์กร (ด้าน SCM) หรือไม่ และความรู้ที่ต้องการนั้นมีความจำเป็นต่อยุทธศาสตร์องค์กรจริงหรือไม่","มิติความเหมาะสมและประสิทธิผล ประเมินว่าวิธีการและช่องทางการแลกเปลี่ยนถูกออกแบบมาอย่าง เฉพาะเจาะจง (Tailored) ให้เข้ากับพฤติกรรมของ Stakeholder แต่ละกลุ่มหรือไม่ (ไม่ใช่การใช้ช่องทางเดียวแบบหว่านแห)","การถ่ายทอด แลกเปลี่ยนสารสนเทศ/ความรู้ สามารถดำเนินการได้ครบถ้วนตามแนวทางที่กำหนดไว้","การนำความรู้ที่ได้มาสร้างคุณค่าเพิ่มผ่านความร่วมมือ, การแลกเปลี่ยนวิธีปฏิบัติที่ดี (Good Practices), การเทียบเคียง (Benchmarking) หรือวิธีการอื่นๆ","ใช้ข้อมูลป้อนกลับจากการดำเนินงาน และข้อมูลจากแหล่งอื่น ๆ ในการ \"ปรับปรุงแนวทางการถ่ายทอด แลกเปลี่ยนสารสนเทศ/ความรู้\" ให้สอดคล้องกับการเปลี่ยนแปลง"],good:["ทำได้เต็มใน ระดับ 1, 2, 3 และ 4 กทท. มีผลงานเชิงประจักษ์ในการเชื่อมโยงกับหน่วยงานภายนอกได้โดดเด่นมาก โดยเฉพาะการเทียบเคียงกับท่าเรือระดับโลก (PSA) และความร่วมมือข้ามรัฐวิสาหกิจ (รฟท., กฟภ.) ที่สามารถแปลงเป็น Application ใช้งานได้จริงและลดเวลาได้มหาศาล","กทท. ทำคะแนนได้สูงมากและลบจุดอ่อนของปี 67 เรื่องการขาด Benchmark ไปได้อย่างหมดจด"],gaps:["ขาดการจำแนกช่องทางตามกลุ่มเป้าหมาย (Segmentation Gap): แม้ช่องทางจะหลากหลาย แต่รูปแบบและวิธีการแลกเปลี่ยนความรู้กับกลุ่มภายนอกยัง \"ไม่มีความแตกต่างกันตามกลุ่ม\" (One-size-fits-all)","ยังไม่ยกระดับสู่ Open Innovation: การแลกเปลี่ยนความรู้ส่วนใหญ่ยังเป็นการดึงข้อมูลมาใช้ฝั่งเดียว แต่ผู้ตรวจคาดหวังให้ กทท. ก้าวไปสู่การทำ \"นวัตกรรมแบบเปิด (Open Innovation)\" ที่จับมือพัฒนานวัตกรรมร่วมกับ Stakeholder เพื่อสร้าง \"คุณค่าร่วม (Shared Values)\" อย่างแท้จริง","เกณฑ์ข้อนี้คาดหวัง \"ความละเอียดอ่อน\" ที่มากขึ้น กทท. จึงต้องเลิกเหวี่ยงแหสื่อสารแบบรวมๆ แต่ต้องออกแบบช่องทางแยกเฉพาะ (เช่น เอเยนต์เรือใช้ช่องทางหนึ่ง, ชุมชนใช้ช่องทางหนึ่ง) และในปีต่อไป กทท. ต้องเปลี่ยนสถานะจาก \"ผู้ไปศึกษาดูงาน\" เป็น \"ผู้สร้างนวัตกรรมร่วมกัน (Co-creator)\" กับ Stakeholder ครับ"],results:["รวบรวมสารสนเทศและความรู้ที่ผู้มีส่วนได้ส่วนเสียต้องการผ่านแบบสอบถาม (VOC) และกำหนดเป็นตารางความต้องการสารสนเทศอย่างชัดเจน","กำหนดช่องทางถ่ายทอดที่หลากหลาย เช่น การจัดอบรม/ศึกษาดูงาน, ประชุมแลกเปลี่ยน (Knowledge Sharing), และผ่านสื่อ Social Media (Facebook, Line) รวมถีงการนำ Google Notebook LM มาช่วยโต้ตอบ","มีการดำเนินการจริง เช่น การประชุมแก้ปัญหาจราจรท่าเรือแหลมฉบังร่วมกับผู้ประกอบการและภาครัฐ, การทดลองใช้ระบบ e-285 Plus กับกรมเจ้าท่า, และงานด้านจัดการของเสียอาเซียน","มีการนำ Best Practice และการทำ Benchmarking มาสร้างมูลค่าเพิ่ม (Value Creation) เช่น การเทียบเคียงกับ PSA สิงคโปร์ ด้านระบบ Container Tracking, การแลกเปลี่ยนเรียนรู้กับ รฟท. เพื่อทำลาน CY, และโครงการคู่ความร่วมมือกับ กฟภ. จนนำมาสู่การสร้าง Application \"CFS TRACKING\" ลดเวลาค้นหาสินค้าจาก 5 นาทีเหลือ 1 นาที","ใช้ข้อมูลป้อนกลับจากหน่วยงานภายนอก (เช่น กฟภ. และเครือข่าย) มาปรับปรุงแนวทางการดำเนินงาน ทั้งแผนระยะสั้นและระยะยาวให้ทันต่อการเปลี่ยนแปลง"],tris:["ขาดการจำแนกช่องทางตามกลุ่มเป้าหมาย (Segmentation Gap): แม้ช่องทางจะหลากหลาย แต่รูปแบบและวิธีการแลกเปลี่ยนความรู้กับกลุ่มภายนอกยัง \"ไม่มีความแตกต่างกันตามกลุ่ม\" (One-size-fits-all)","ยังไม่ยกระดับสู่ Open Innovation: การแลกเปลี่ยนความรู้ส่วนใหญ่ยังเป็นการดึงข้อมูลมาใช้ฝั่งเดียว แต่ผู้ตรวจคาดหวังให้ กทท. ก้าวไปสู่การทำ \"นวัตกรรมแบบเปิด (Open Innovation)\" ที่จับมือพัฒนานวัตกรรมร่วมกับ Stakeholder เพื่อสร้าง \"คุณค่าร่วม (Shared Values)\" อย่างแท้จริง"],suggest:["\"ออกแบบช่องทางการแลกเปลี่ยนความรู้ให้เหมาะสมกับผู้มีส่วนได้ส่วนเสียแต่ละกลุ่ม\" เพื่อให้เกิดความแตกต่างและตรงใจ","\"ใช้ Open Innovation (นวัตกรรมแบบเปิด) เพื่อสร้างคุณค่าร่วม (Shared Values)\" ระหว่าง กทท. และหน่วยงานภายนอก"],docs:["ตารางช่องทางการแลกเปลี่ยนความรู้จำแนกตามกลุ่ม (Segmented External KM Matrix): เอกสารนี้ต้องระบุให้ชัดเจนว่า Stakeholder แต่ละกลุ่ม (เช่น สายเดินเรือ, ชุมชน, คู่เทียบ, หน่วยงานรัฐ) กทท. ใช้วิธีการ แพลตฟอร์ม และความถี่ในการแลกเปลี่ยนความรู้ที่ \"แตกต่างกัน\" อย่างไร","รายงานโครงการพัฒนานวัตกรรมร่วมกับบุคคลภายนอก (Open Innovation / Co-Creation Project Report): เป็นรายงานผลลัพธ์ของโครงการที่ กทท. ดึง Stakeholder (เช่น ลูกค้า คู่ค้า หรือสถาบันการศึกษา) เข้ามาร่วมคิดค้นและพัฒนานวัตกรรมตั้งแต่ต้นน้ำ เพื่อยืนยันการทำ Open Innovation ตามที่ สคร. แนะนำ","รายงานการวิเคราะห์และนำเสียงของผู้มีส่วนได้ส่วนเสียภายนอก (VOC) มาปรับปรุงกระบวนงาน: เอกสารที่แสดงความเชื่อมโยงว่า เสียงสะท้อนหรือข้อเสนอแนะจากวงเสวนาภายนอก ถูกนำมาเข้าสู่ระบบ KM ภายใน และแปลงเป็นมาตรฐานการปฏิบัติงาน (Standard Procedure) ใหม่ของ กทท. อย่างไรครับ"],bestprac:["การดำเนินงานของ รฟม. ถือเป็นต้นแบบที่ตอบโจทย์เรื่อง Open Innovation ได้ดีที่สุด โดย รฟม. มีการใช้เครื่องมือการแลกเปลี่ยนแบบ Real-time ผ่านการตั้งกลุ่ม \"Line KNEX (Knowledge Network Exchange)\" เพื่อแลกเปลี่ยนความรู้เชิงลึกด้านนวัตกรรมระหว่างรัฐวิสาหกิจ รวมถึงมีการระบุยุทธศาสตร์ที่มุ่งเน้นการจัดการความรู้ข้ามหน่วยงาน (Cross-Functional & Ecosystem KM) ที่เน้นการสร้างนวัตกรรมตามกรอบ \"Open Innovation\" เพื่อสร้างคุณค่าร่วม (Shared Values) ซึ่งตรงกับข้อเสนอแนะที่ สคร. แนะนำให้ กทท. ทำในปี 69 พอดี"],minReqs:{"1":["เอกสารระบุ/จัดกลุ่มผู้มีส่วนได้ส่วนเสีย (Stakeholder) ที่สำคัญขององค์กร พร้อมตารางวิเคราะห์ระบุให้ชัดเจนว่า \"องค์กรต้องการสารสนเทศ/องค์ความรู้อะไรจาก Stakeholder แต่ละกลุ่ม\" (เช่น ความรู้จากคู่เทียบ, VOC จากลูกค้า, ความรู้ด้านเทคโนโลยีจากคู่ค้า)"],"2":["ตารางแผนการถ่ายทอด/แลกเปลี่ยนความรู้ ที่ระบุช่องทาง \"แยกตามกลุ่มเป้าหมาย (Segmented Channels)\" อย่างชัดเจน เช่น จัด Workshop สำหรับคู่ค้า, ใช้ระบบ e-Learning สำหรับคู่ความร่วมมือ, หรือใช้ Line Group สำหรับลูกค้า"],"3":["รายงานผลการดำเนินการแลกเปลี่ยนสารสนเทศตามแผนที่กำหนดไว้ (เช่น รายงานผลการจัดประชุม/สัมมนา/ศึกษาดูงาน) พร้อมทั้งหลักฐาน ผลการประเมินความเข้าใจและความพึงพอใจ ของผู้มีส่วนได้ส่วนเสียที่มีต่อช่องทางการแลกเปลี่ยนนั้น","ตัวอย่างหลักฐานเชิงประจักษ์ของ กทท.: รายงานการประชุมแก้ปัญหาจราจรท่าเรือแหลมฉบังร่วมกับผู้ประกอบการ/ภาครัฐ, รายงานการถ่ายทอดเรื่องการจัดการของเสียจากเรือในอาเซียน (ASEAN Ship Waste Management), การทดลองปฏิบัติระบบ e-285 Plus กับกรมเจ้าท่า"],"4":["หลักฐานเชิงประจักษ์ที่แสดง การสร้างคุณค่าเพิ่ม (Value Creation) จากความรู้ที่ได้รับมา ได้แก่ รายงานผลการเทียบเคียง (Benchmarking), การแลกเปลี่ยนวิธีปฏิบัติที่ดี (Good Practices), หรือโครงการความร่วมมือ (Collaboration) ที่นำไปสู่การพัฒนางาน เช่น การเทียบเคียงกับท่าเรือสิงคโปร์ (PSA) เพื่อปรับปรุงระบบ Container Tracking"],"5":["ตาราง Feedback Loop Matrix: ที่แสดงความสัมพันธ์ เช่น รับฟัง VOC จากคู่ความร่วมมือ -> นำมาปรับรูปแบบการสื่อสารจากเดิมที่เป็นเอกสาร มาเป็นการใช้เวที CoP หรือ Digital Platform ร่วมกัน -> ทำให้การถ่ายทอดความรู้รวดเร็วขึ้น"]},subComps:{"1":[],"2":["ความแตกต่างและความเฉพาะเจาะจงของช่องทางสื่อสาร (Tailored Channels): จาก Feedback Report (Gap ปี 68 ของ กทท.) ผู้ตรวจตัดคะแนนเพราะ \"รูปแบบแลกเปลี่ยนความรู้กับ Stakeholder ไม่แตกต่างกันตามกลุ่ม\" องค์ประกอบที่ซ่อนอยู่คือ องค์กรต้องวิเคราะห์พฤติกรรม (Persona) ของแต่ละกลุ่ม เพื่อเลือกใช้ช่องทางที่ต่างกันอย่างมีนัยสำคัญ"],"3":["การเชื่อมโยงเสียงของลูกค้าสู่ Open Innovation: เกณฑ์ต้องการเห็นการดึงเสียงของลูกค้า (Voice of Customer: VOC) และสารสนเทศเชิงลึก มาสร้างนวัตกรรมร่วมกัน (Shared Values) ไม่ใช่แค่การรับฟังเพื่อแก้ข้อร้องเรียนเพียงอย่างเดียว"],"4":["การเชื่อมโยงเสียงของลูกค้าสู่ Open Innovation: เกณฑ์ต้องการเห็นการดึงเสียงของลูกค้า (Voice of Customer: VOC) และสารสนเทศเชิงลึก มาสร้างนวัตกรรมร่วมกัน (Shared Values) ไม่ใช่แค่การรับฟังเพื่อแก้ข้อร้องเรียนเพียงอย่างเดียว","บทบาทองค์กรในการเป็นผู้ให้ (Role Model): นอกจากรับความรู้เข้ามาแล้ว องค์กรต้องแสดงให้เห็นถึงบทบาท \"ผู้ให้\" ด้วยการเผยแพร่องค์ความรู้ที่เป็น Best Practice หรือถ่ายทอดเทคโนโลยีขององค์กรกลับสู่เครือข่ายภายนอก (Two-way sharing)"],"5":[]},dimScope:{"1":["มิติความสอดคล้องและความครอบคลุม ประเมินว่ากลุ่ม Stakeholder ที่ระบุในด้าน KM สอดคล้องกับที่ระบุไว้ในระดับองค์กร (ด้าน SCM) หรือไม่ และความรู้ที่ต้องการนั้นมีความจำเป็นต่อยุทธศาสตร์องค์กรจริงหรือไม่"],"2":["มิติความเหมาะสมและประสิทธิผล ประเมินว่าวิธีการและช่องทางการแลกเปลี่ยนถูกออกแบบมาอย่าง เฉพาะเจาะจง (Tailored) ให้เข้ากับพฤติกรรมของ Stakeholder แต่ละกลุ่มหรือไม่ (ไม่ใช่การใช้ช่องทางเดียวแบบหว่านแห)"],"3":["การถ่ายทอด แลกเปลี่ยนสารสนเทศ/ความรู้ สามารถดำเนินการได้ครบถ้วนตามแนวทางที่กำหนดไว้"],"4":["การนำความรู้ที่ได้มาสร้างคุณค่าเพิ่มผ่านความร่วมมือ, การแลกเปลี่ยนวิธีปฏิบัติที่ดี (Good Practices), การเทียบเคียง (Benchmarking) หรือวิธีการอื่นๆ"],"5":["ใช้ข้อมูลป้อนกลับจากการดำเนินงาน และข้อมูลจากแหล่งอื่น ๆ ในการ \"ปรับปรุงแนวทางการถ่ายทอด แลกเปลี่ยนสารสนเทศ/ความรู้\" ให้สอดคล้องกับการเปลี่ยนแปลง"]},crosslinks:[{"level":"1","dim":"SCM"},{"level":"1","dim":"KM"},{"level":"2","dim":"SCM"},{"level":"2","dim":"KM"},{"level":"3","dim":"SCM"},{"level":"3","dim":"KM3.1"},{"level":"4","dim":"IM"},{"level":"4","dim":"SP"},{"level":"4","dim":"KM5.1"},{"level":"4","dim":"KM6.1"},{"level":"5","dim":"SCM"},{"level":"5","dim":"KM2.1"}]},
  {id:"5.1",grp:"5",gname:"กระบวนการปฏิบัติงาน",gw:4.0,gs68:2.7,name:"การปฏิบัติงานโดยใช้ความรู้เป็นฐาน",w:2.0,s68:2.7,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมินการนำองค์ความรู้และเครื่องมือด้านการจัดการความรู้ (KM) มาเป็นกลไกประยุกต์ใช้ในการพัฒนาและปรับปรุงการปฏิบัติงานประจำวัน (Daily Operation) ทั้งกระบวนการหลักและกระบวนการสนับสนุนอย่างเป็นระบบและต่อเนื่อง เพื่อลดข้อผิดพลาด ลดต้นทุน หรือเพิ่มประสิทธิภาพในการทำงาน โดยต้องดำเนินการให้สอดคล้องกับยุทธศาสตร์องค์กร และต้องมีกระบวนการนำข้อมูลป้อนกลับ (Feedback) มาใช้ในการยกระดับกระบวนการทำงานให้เป็นรูปธรรม",levelSumm:["มีการกำหนดกระบวนการทำงานที่สำคัญ ทั้งกระบวนการหลักและกระบวนการสนับสนุน (Key and Support Processes) พร้อมระบุตัววัดที่สำคัญ (KPIs)","การกำหนดกระบวนการทำงานที่สำคัญใน Level 1 นั้น ต้องเกิดจากการมีส่วนร่วมของผู้บริหาร และมีแนวคิด/วิธีการ/หลักเกณฑ์ในการกำหนดที่มีความเป็นเหตุเป็นผลและมีที่มาที่ไปอย่างชัดเจน","มีการพัฒนาและการปรับปรุงการปฏิบัติงานประจำวัน (Daily Operation) ของกระบวนการหลักและกระบวนการสนับสนุนอย่างมีประสิทธิผลและต่อเนื่อง โดยการใช้ \"เครื่องมือในการปรับปรุงกระบวนการต่าง ๆ\" (เช่น LEAN, Kaizen) ควบคู่กับการใช้ \"การจัดการความรู้ (KM)\" เป็นกลไกในการพัฒนา","กระบวนการทำงานที่สำคัญ ต้องมีความสอดคล้องกับยุทธศาสตร์ขององค์กร และสอดรับกับการกำหนด \"ความรู้ที่สำคัญ (Critical Knowledge)\" และการสร้าง/แสวงหาความรู้ขององค์กร","การพัฒนาและการปรับปรุงการปฏิบัติงาน มีการใช้ข้อมูลป้อนกลับ (Feedback) จากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอ่ืน ๆ ทั้งภายในและ/หรือภายนอกองค์กร มาใช้เพื่อให้เกิดการปรับปรุงกระบวนการทำงานที่สำคัญอย่างเป็นรูปธรรม"],good:["ทำได้คะแนนเต็มใน ระดับ 1 และ 2 เนื่องจากมีการแบ่งกระบวนงานหลักและกระบวนงานสนับสนุนที่ชัดเจน มีตัวชี้วัดกำกับ และเกิดจากการมีส่วนร่วมของฝ่ายบริหาร"],gaps:["กทท. ทำโครงการนำร่องและใช้เครื่องมือ KM แก้ปัญหาหน้างานได้ดีมาก (มีผลงาน 18 โครงการเป็นที่ประจักษ์)","ผู้ตรวจเกณฑ์ SE-AM การได้คะแนนระดับ 4-5 หมายถึง KM ต้องกลายเป็น \"ลมหายใจของการทำงานประจำวัน\" (Daily Operation) ไม่ใช่เป็นเพียง \"โครงการ (Project-based)\" กทท. จึงต้องทำให้การทำ AAR/BAR หรือ Knowledge Mapping กลายเป็นมาตรฐานที่ทุกหน่วยงานต้องทำเป็นปกติ (100%) เมื่อเกิดปัญหาหน้างาน"],results:["กำหนดกระบวนการทำงานที่สำคัญ 5 กระบวนงานหลัก (เช่น บริการร่องน้ำ, บริการเรือ, บริการสินค้าและตู้สินค้า) และกระบวนการสนับสนุน พร้อมตัวชี้วัดที่สำคัญอย่างชัดเจน","การกำหนดกระบวนการทำงานเกิดจากการมีส่วนร่วมของผู้บริหาร โดยพิจารณาจากข้อกำหนดลูกค้า การเปลี่ยนแปลงเทคโนโลยี และการสนับสนุนวิสัยทัศน์เชิงยุทธศาสตร์","นำเครื่องมือ KM มาปรับปรุงการปฏิบัติงานประจำวัน (Daily Operation) เช่น การทำ Knowledge Mapping, การใช้ BAR/AAR ในการแก้ปัญหา (เช่น การจราจรในท่าเรือ), และการตั้งชุมชนนักปฏิบัติ (CoP) จนเกิดการปรับปรุงกระบวนงาน 18 โครงการ","นำกระบวนการทำงานที่สำคัญไปผูกกับยุทธศาสตร์องค์กร และความรู้ที่สำคัญ (Critical Knowledge) เช่น ยุทธศาสตร์พัฒนาการบริหารจัดการท่าเรือ สอดคล้องกับความรู้เรื่องการขุดลอกร่องน้ำ","ใช้ข้อมูลป้อนกลับจากผลการดำเนินงาน (เช่น ผลจาก PAT DNA AWARD 2025, BAR/AAR) และข้อมูลภายนอก (เช่น ความร่วมมือกับกรมการขนส่งทางบกเรื่อง Big Data) มาปรับปรุงกระบวนการทำงานให้เป็นรูปธรรม"],tris:["ขาดประสิทธิผลที่ครอบคลุม \"ทุก\" กระบวนการอย่างต่อเนื่อง: แม้ กทท. จะมีการนำเครื่องมือ KM มาใช้ปรับปรุงงานได้ถึง 18 โครงการ (เช่น ลดเวลาหาตู้สินค้า LCL) แต่ผู้ตรวจประเมินมองว่า ยังไม่เห็นความชัดเจนว่ามีการนำเครื่องมือ KM ไปฝังเป็นกลไกใน Daily Operation จนเกิดประสิทธิผลที่ดีขึ้นใน \"ทุกกระบวนการอย่างต่อเนื่อง\" ไม่ใช่แค่เฉพาะในโครงการพิเศษ","ยังพบได้ไม่ชัดเจนว่าการพัฒนาและการปรับปรุงการปฏิบัติงานประจำวัน (Daily Operation) มีการใช้เครื่องมือในการปรับปรุงกระบวนการต่างๆ และใช้การจัดการความรู้ เป็นกลไกหนึ่งในการพัฒนาและการปรับปรุงการปฏิบัติงาน จนเกิดประสิทธิผลที่ดีขึ้นในทุกกระบวนการอย่างต่อเนื่อง"],suggest:["กทท. ควรนำข้อมูลป้อนกลับจากการดำเนินงานอย่างต่อเนื่อง และนำความรู้ภายใน/ภายนอกองค์กรมาใช้ เพื่อให้เกิดการปรับปรุงการปฏิบัติงานประจำวันอย่างเป็นรูปธรรมและยั่งยืน"],docs:["รายงาน BAR/AAR ในระดับงานประจำวัน (Daily Operation AAR Reports): ต้องแสดงหลักฐานว่าทุกครั้งที่มีกิจกรรมสำคัญ หรือเกิดปัญหาหน้างาน (เช่น ปัญหารถติด ปัญหาตู้สินค้า) ทุกหน่วยงานมีการทำ AAR ถอดบทเรียนทันที และแปลงเป็น \"องค์ความรู้ใหม่ (Lesson Learned / Best Practice)\" โดยไม่จำเป็นต้องรอให้เป็นโครงการเข้าประกวด","รายงานการปรับปรุงกระบวนงานด้วยเครื่องมือ SIPOC และ AAR แบบบูรณาการ (SIPOC-AAR Process Improvement Report): เอกสารที่แสดงการนำหลักการ SIPOC มาใช้วิเคราะห์กระบวนงานร่วมกับ AAR แบบเดียวกับ กทพ. เพื่อปรับปรุงระยะเวลาการให้บริการ (SLA) ให้สั้นลง หรือลดข้อผิดพลาดลงอย่างเป็นรูปธรรมในทุกสายงาน","คู่มือปฏิบัติงานมาตรฐานที่ระบุการใช้ความรู้ (Knowledge-Embedded SOPs): คู่มือมาตรฐานการทำงานของแต่ละฝ่ายต้องมีการระบุชัดเจนว่า ในจุดใดที่เป็น \"ขั้นตอนวิกฤต (Critical Steps)\" พนักงานจะต้องใช้ \"องค์ความรู้หรือคู่มือเรื่องใด\" เข้ามาช่วยตัดสินใจ เพื่อสะท้อนการปฏิบัติงานที่ใช้ความรู้เป็นฐานอย่างแท้จริง"],bestprac:["กทพ. มีความโดดเด่นในการ \"นำ AAR และ SIPOC Model มาประยุกต์ใช้ร่วมกันในการประเมินประสิทธิผลของกระบวนการทำงาน\" โดยประสานงานทุกฝ่ายให้จัดทำข้อมูลที่แสดงถึงขั้นตอนการทำงานที่สำคัญ จุดควบคุม ระยะเวลาการดำเนินงาน (SLA) และนำข้อมูลเหล่านี้มาถอดบทเรียนเพื่อปรับปรุงรอบเวลา SLA ทันที ทำให้เห็นการนำ KM ไปปรับปรุงงานประจำวันอย่างเป็นระบบ"],minReqs:{"1":["เอกสารตารางรายชื่อกระบวนการทำงานที่สำคัญ โดยแบ่งแยกหมวดหมู่อย่างชัดเจนว่าเป็น \"กระบวนการหลัก (Core Process)\" หรือ \"กระบวนการสนับสนุน (Support Process)\"","เอกสารระบุตัวชี้วัด (KPIs) ความสำเร็จของแต่ละกระบวนการ"],"2":["รายงานการประชุม / SIPOC / หลักฐานยืนยันว่าผู้บริหารหน่วยงานต่างๆ เข้ามามีส่วนร่วมพิจารณาข้อกำหนดในการเลือกกระบวนการทำงานที่สำคัญ","เอกสารชี้แจงแนวคิดและเกณฑ์ที่ใช้คัดเลือกกระบวนการทำงาน (เช่น สอดคล้องกับทิศทางธุรกิจ, สร้างโอกาสในการแข่งขัน, ตอบสนองผู้มีส่วนได้ส่วนเสีย)"],"3":["รายงานผลลัพธ์จากการใช้เครื่องมือพัฒนาองค์กร เช่น LEAN Zigma, Kaizen, PAR (Process Assessment Report)","รายงาน/หลักฐานการใช้เครื่องมือ KM เข้ามาแก้ปัญหาและปรับปรุงงานประจำวัน เช่น การทำแผนที่ความรู้ (Knowledge Mapping), รายงานการถอดบทเรียน (BAR/AAR), และการจัดทำชุมชนนักปฏิบัติ (CoP)"],"4":["ตารางแสดงความเชื่อมโยง (Alignment Matrix) ที่ผูกให้เห็นความสัมพันธ์ระหว่าง: กระบวนการทำงานที่สำคัญ <-> ยุทธศาสตร์องค์กร <-> หมวดหมู่งาน/องค์ความรู้ที่สำคัญ (Critical Knowledge)","โครงสร้างระบบจัดเก็บองค์ความรู้ที่แยกตามหมวดหมู่กระบวนการทำงานที่สำคัญ"],"5":["ตารางความเชื่อมโยงการใช้ข้อมูลป้อนกลับ (Feedback Loop Matrix) ที่แสดงถึงกระบวนการ: ระบุแหล่งข้อมูลป้อนกลับ -> การวิเคราะห์ -> การปรับปรุงกระบวนการ -> ผลลัพธ์ที่ดีขึ้นเชิงประจักษ์","หลักฐานการนำผลจากการถอดบทเรียน (Lesson Learned) จากปัจจัยภายในและคู่เทียบ/ผู้เชี่ยวชาญภายนอกมาปรับปรุงแนวทางการดำเนินงาน (Daily Operation)"]},subComps:{"1":[],"2":[],"3":["ต้องประยุกต์ใช้เครื่องมือ 2 ส่วนร่วมกัน เกณฑ์ระบุชัดเจนว่าต้องใช้ เครื่องมือปรับปรุงกระบวนการ (Quality Tools) (เช่น Lean, ISO, Kaizen) ควบคู่ไปกับ เครื่องมือจัดการความรู้ (KM Tools) (เช่น CoP, Knowledge Map, AAR/BAR) หากใช้เพียงอย่างใดอย่างหนึ่งอาจถูกหักคะแนน","การแสดงประสิทธิผลต้องเห็นครอบคลุม \"ทุก\" กระบวนการ : จุดที่ผู้ตรวจ (TRIS) มักหักคะแนนคือ รัฐวิสาหกิจมักนำเสนอโครงการตัวอย่างแค่ 1-2 โครงการ แต่เกณฑ์ต้องการให้สะท้อนให้เห็นว่า KM ถูกฝังเข้าไปเป็นกลไกใน Daily Operation อย่างเป็นรูปธรรมใน ทุกกระบวนการอย่างต่อเนื่อง ไม่ใช่แค่เฉพาะกิจ"],"4":[],"5":["ผลลัพธ์เชิงประจักษ์ (Measurable Outcomes): การพัฒนาปรับปรุงงานควรต้องสามารถแปลงผลลัพธ์ออกมาเป็นตัวเลขที่จับต้องได้ เช่น สามารถลดเวลาค้นหาข้อมูลได้กี่นาที ลดอัตราข้อผิดพลาดลงได้กี่เปอร์เซ็นต์ หรือประหยัดต้นทุนการทำงานได้เท่าใด"]},dimScope:{"1":["มีการกำหนดกระบวนการทำงานที่สำคัญ ทั้งกระบวนการหลักและกระบวนการสนับสนุน (Key and Support Processes) พร้อมระบุตัววัดที่สำคัญ (KPIs)"],"2":["การกำหนดกระบวนการทำงานที่สำคัญใน Level 1 นั้น ต้องเกิดจากการมีส่วนร่วมของผู้บริหาร และมีแนวคิด/วิธีการ/หลักเกณฑ์ในการกำหนดที่มีความเป็นเหตุเป็นผลและมีที่มาที่ไปอย่างชัดเจน"],"3":["มีการพัฒนาและการปรับปรุงการปฏิบัติงานประจำวัน (Daily Operation) ของกระบวนการหลักและกระบวนการสนับสนุนอย่างมีประสิทธิผลและต่อเนื่อง โดยการใช้ \"เครื่องมือในการปรับปรุงกระบวนการต่าง ๆ\" (เช่น LEAN, Kaizen) ควบคู่กับการใช้ \"การจัดการความรู้ (KM)\" เป็นกลไกในการพัฒนา"],"4":["กระบวนการทำงานที่สำคัญ ต้องมีความสอดคล้องกับยุทธศาสตร์ขององค์กร และสอดรับกับการกำหนด \"ความรู้ที่สำคัญ (Critical Knowledge)\" และการสร้าง/แสวงหาความรู้ขององค์กร"],"5":["การพัฒนาและการปรับปรุงการปฏิบัติงาน มีการใช้ข้อมูลป้อนกลับ (Feedback) จากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอ่ืน ๆ ทั้งภายในและ/หรือภายนอกองค์กร มาใช้เพื่อให้เกิดการปรับปรุงกระบวนการทำงานที่สำคัญอย่างเป็นรูปธรรม"]},crosslinks:[{"level":"2","dim":"CG"},{"level":"3","dim":"KM3.1"},{"level":"4","dim":"SP"},{"level":"4","dim":"KM4.1"},{"level":"5","dim":"KM2.1"},{"level":"5","dim":"IM"}]},
  {id:"5.2",grp:"5",gname:"กระบวนการปฏิบัติงาน",gw:4.0,gs68:2.7,name:"การสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานโดยใช้ความรู้เป็นฐาน",w:2.0,s68:2.7,status:"ยังไม่เริ่ม",statusNote:"",scope:"ประเมินการนำองค์ความรู้มาใช้เป็นเครื่องมือในการวิเคราะห์และระบุจุดวิกฤต (Critical Step) หรือจุดที่ต้องควบคุมในการปฏิบัติงาน รวมถึงการป้องกันการเข้าถึงข้อมูลโดยมิชอบ โดยต้องมีการสื่อสารและถ่ายทอดความรู้เพื่อสร้างความตระหนักด้านความเสี่ยงให้แก่บุคลากรอย่างทั่วถึง และที่สำคัญที่สุดคือ ต้องบูรณาการ \"การจัดการความรู้ (KM)\" เข้ากับ \"ระบบบริหารความเสี่ยงองค์กร (ERM)\" อย่างเป็นรูปธรรม และมีการนำข้อมูลป้อนกลับมาปรับปรุงกระบวนการอย่างสม่ำเสมอ",levelSumm:["การวิเคราะห์และระบุจุดที่ต้องควบคุม ระมัดระวัง หรือจุดสำคัญ/วิกฤต (Critical Step) ในขั้นตอนการปฏิบัติงาน รวมถึงการป้องกันไม่ให้มีการเปลี่ยนแปลงข้อมูลโดยไม่ได้รับอนุญาต หรือมีการนำข้อมูลไปใช้อย่างไม่ถูกต้อง","การสื่อสาร แลกเปลี่ยน และถ่ายโอนความรู้ที่เกี่ยวข้องกับการควบคุมจุดที่ต้องควบคุม ระมัดระวังหรือจุดสำคัญ/วิกฤติ (Critical Step) ให้แก่บุคลากรที่เกี่ยวข้องเพื่อสร้างความเข้าใจและความระมัดระวัง","การสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานที่สำคัญทั้งกระบวนการหลักและกระบวนการสนับสนุน (Key and Support Processes) แก่บุคลากรที่เกี่ยวข้องอย่างทั่วถึงและต่อเนื่อง","การสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานโดยใช้ความรู้เป็นฐาน มีความเชื่อมโยงกับการบริหารความเสี่ยงขององค์กร","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ ในการปรับปรุงการสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ"],good:["กทท. ทำได้ใน ระดับ 1 และ 2 เนื่องจาก กทท. มีการระบุจุด Critical Steps ลงในคู่มือ และมีการจัดอบรม e-Learning เพื่อให้ความรู้ในเรื่องความเสี่ยงที่สำคัญอย่างชัดเจนและเป็นรูปธรรม","กทท. มีคู่มือ มีการอบรม"],gaps:["ปัญหาของ กทท. ในข้อนี้คือการมี \"กระบวนการ\" แต่ขาด \"การพิสูจน์ผลลัพธ์\"","ผู้ตรวจต้องการเห็นว่า เมื่ออบรมแล้ว พนักงานระวังตัวมากขึ้นไหม ข้อผิดพลาด (Human Error) ที่หน้างานลดลงกี่เปอร์เซ็นต์ นอกจากนี้ การทำงานระหว่างทีม KM และทีมความเสี่ยง (สสค.) ยังดูแยกส่วนกันอยู่ (Silo) ต้องนำทั้งสองทีมมานั่งวิเคราะห์ร่วมกันและจัดทำเอกสารหลักฐานที่เกิดจากการทำงานร่วมกัน"],results:["วิเคราะห์และระบุจุดควบคุม (Control Points) และจุดวิกฤต (Critical Steps) ในคู่มือปฏิบัติงาน และมีการจัดทำแบบการประมวลผลข้อมูลส่วนบุคคล (RoPA) เพื่อป้องกันการเข้าถึง/เปลี่ยนแปลงข้อมูลโดยไม่ได้รับอนุญาต","สื่อสารและถ่ายโอนความรู้ในจุด Critical Steps ผ่าน e-Learning เช่น กฎหมายคุ้มครองข้อมูลส่วนบุคคล (PDPA), ความมั่นคงปลอดภัยทางไซเบอร์ (Cybersecurity), กฎหมายสินค้าอันตราย รวมถึงการแลกเปลี่ยนเรียนรู้การแก้ปัญหาจราจรท่าเรือแหลมฉบัง","กำหนดให้ทุกหน่วยงานจัดทำรายงานการประเมินผลการควบคุมด้วยตนเอง (CSA) ส่งให้สำนักบริหารความเสี่ยงฯ (สสค.) หากพบความเสี่ยงที่เกี่ยวกับองค์ความรู้ จะประสานวิทยากรกระบวนการกลางไปจัดเก็บความรู้","บูรณาการ “การจัดการความรู้ (KM)” กับ “การบริหารความเสี่ยง (ERM)” โดยถอดบทเรียน (Lesson Learned) จากเหตุการณ์จริงหรือความผิดพลาด มาพัฒนาเป็นความรู้เชิงป้องกัน (Preventive Knowledge) นำไปปรับปรุงคู่มือ","ใช้ข้อมูลป้อนกลับจากผลการตรวจสอบภายใน รายงานควบคุมภายใน และข้อเสนอแนะจากผู้เชี่ยวชาญ มาจัดทำตารางเชื่อมโยงเพื่อปรับปรุงกระบวนการสร้างความตระหนัก"],tris:["ขาดหลักฐานเชิงพฤติกรรม (Behavioral Change Evidence): แม้จะมีการอบรมและทำคู่มือ แต่ กทท. ยังไม่สามารถพิสูจน์ให้เห็นได้อย่างชัดเจนว่า \"ความเข้าใจและความระมัดระวังของบุคลากรเพิ่มมากขึ้นจริง\" หรือมีสถิติข้อผิดพลาดที่ลดลงจากการนำความรู้ไปใช้","การบูรณาการวิเคราะห์ปัจจัยเสี่ยงด้านความรู้ยังไม่สมบูรณ์: ผู้ตรวจประเมินมองว่า ทีม KM ยังไม่ได้ทำงานร่วมกับทีมบริหารความเสี่ยง (สสค.) ในการลงลึกเพื่อวิเคราะห์ \"ปัจจัยเสี่ยงด้านความรู้ (Knowledge Risk)\" อย่างแท้จริงตามแนวทางเกณฑ์"],suggest:["ต้องแสดงประสิทธิผลให้เห็นการเปลี่ยนแปลง: กทท. ควรแสดงให้เห็นชัดเจนถึงความเข้าใจและความระมัดระวังของบุคลากรที่เพิ่มมากขึ้น จากการสื่อสาร แลกเปลี่ยน และถ่ายโอนความรู้ที่เกี่ยวข้องกับการควบคุมจุดวิกฤติ (Critical Steps)","บูรณาการการวิเคราะห์ข้ามสายงาน: หน่วยงานที่รับผิดชอบด้าน KM ควรหารือและทำงานร่วมกับหน่วยงานที่รับผิดชอบด้านบริหารความเสี่ยง เพื่อใช้เครื่องมือในการวิเคราะห์ \"ปัจจัยเสี่ยงด้านความรู้\" ให้ถูกต้องและเป็นไปในทิศทางเดียวกัน"],docs:["รายงานการทำงานร่วมกันระหว่างทีม KM และทีมความเสี่ยง (Joint KM & RM Analysis Report): เอกสารรายงานการประชุม/การวิเคราะห์ร่วมกันระหว่างทีม KM และทีม สสค. เพื่อระบุ \"ปัจจัยเสี่ยงด้านความรู้ (Knowledge Risk)\" โดยเฉพาะ เช่น ความเสี่ยงที่องค์ความรู้สำคัญจะสูญหาย หรือการนำความรู้ไปใช้ผิดวิธี พร้อมระบุแผนป้องกัน","รายงานประเมินการเปลี่ยนแปลงพฤติกรรมและการลดข้อผิดพลาด (Behavioral & Error Reduction Report): เอกสารสรุปสถิติเปรียบเทียบ (Before/After) ที่แสดงให้เห็นว่า หลังจากที่ กทท. นำความรู้ (เช่น Lesson Learned) ไปถ่ายทอดให้พนักงานแล้ว อัตราการเกิดอุบัติเหตุ อัตราการทำงานผิดพลาด หรือความถี่ของการฝ่าฝืนกฎระเบียบในจุด Critical Steps ลดลงอย่างมีนัยสำคัญ เพื่อพิสูจน์ว่าพนักงาน \"มีความระมัดระวังมากขึ้นจริง\"","คู่มือปฏิบัติงานมาตรฐานที่บูรณาการความเสี่ยง (Risk-Integrated SOPs): การปรับปรุงคู่มือปฏิบัติงานของ กทท. ต้องทำแบบ กทพ. คือ ในหน้าคู่มือตรงจุดที่เป็น Critical Step ต้องมีการไฮไลท์ระบุความเสี่ยงอย่างชัดเจน และแนบลิงก์ (หรือระบุชื่อ) องค์ความรู้ / คู่มือการแก้ปัญหา ที่พนักงานต้องเข้าไปอ่านก่อนปฏิบัติงาน เพื่อป้องกันความผิดพลาดครับ"],bestprac:["กทพ. (Best Practice): กทพ. มีความโดดเด่นในการ \"ผนวกการจัดการความรู้เข้ากับกระบวนการเสริมสร้างวัฒนธรรมการบริหารความเสี่ยง (Risk Culture)\" โดยกำหนดให้ทุกหน่วยงานต้องทบทวนและปรับปรุงคู่มือปฏิบัติงานของตนเอง โดยใช้ข้อมูล \"ความรู้ที่สำคัญขององค์กร\" เป็นฐาน เพื่อใช้คู่มือเหล่านั้นเป็นเครื่องมือสร้างความตระหนักและเป็นกรอบแนวปฏิบัติที่ลดความเสี่ยงอย่างเป็นรูปธรรม"],minReqs:{"1":["คู่มือการปฏิบัติงาน (Work Manual / SOP) ที่ระบุจุดควบคุม (Control Point) และจุดวิกฤต (Critical Step) ในแต่ละขั้นตอนอย่างชัดเจน","เอกสารหรือระเบียบที่แสดงถึงมาตรการควบคุมสิทธิ์การเข้าถึงข้อมูล เช่น เอกสารการประมวลผลข้อมูลส่วนบุคคล (RoPA) หรือระบบการควบคุมการเข้าถึง (Access Control)"],"2":["หลักฐานการสื่อสารหรือการฝึกอบรม (เช่น กิจกรรมแลกเปลี่ยนเรียนรู้, e-Learning) ที่ถ่ายทอดความรู้เกี่ยวกับจุดควบคุมความเสี่ยงนั้นๆ เช่น การอบรมเรื่อง PDPA, Cybersecurity หรือ กฎหมาย/ระเบียบข้อบังคับใหม่"],"3":["รายงานการประเมินผลการควบคุมด้วยตนเอง (Control Self-Assessment: CSA) ประจำปีของหน่วยงานต่างๆ ที่ครอบคลุมกระบวนการหลักและสนับสนุน","หลักฐานการจัดการเรียนรู้ร่วมกัน เช่น การสรุปและถ่ายทอด \"บทเรียนจากเหตุการณ์ความเสี่ยง\" (Lesson Learned)"],"4":["เอกสาร/ตารางที่แสดงให้เห็นถึงการบูรณาการระหว่างแผนบริหารความเสี่ยงองค์กร (ERM) กับการจัดทำองค์ความรู้ เช่น การนำ Risk Correlation Map หรือ Risk Profile มาเป็นหัวข้อบังคับในการถอดบทเรียน","หลักฐานการเปลี่ยนความผิดพลาดที่เกิดขึ้นจริงให้เป็น \"ความรู้เชิงป้องกัน\" (Preventive Knowledge)"],"5":["ตารางความเชื่อมโยงการใช้ข้อมูลป้อนกลับ (Feedback Loop Matrix) ที่นำผลจากเหตุการณ์ความเสี่ยง (Incident Report), รายงานการควบคุมภายใน หรือผลตรวจสอบภายใน มาดำเนินการปรับปรุงคู่มือปฏิบัติงาน หรือยกระดับมาตรการความเสี่ยงให้ทันสมัย"]},subComps:{"1":["ความเชื่อมโยงเรื่องข้อมูลส่วนบุคคลและ Cyber : เกณฑ์ระบุถึงการ \"ป้องกันไม่ให้มีการเปลี่ยนแปลงข้อมูลโดยไม่ได้รับอนุญาต\" ซึ่งบังคับกลายๆ ให้องค์กรต้องนำเรื่อง PDPA และ Cybersecurity มาเป็นส่วนหนึ่งขององค์ความรู้ด้านความเสี่ยงพื้นฐานที่พนักงานต้องตระหนัก"],"2":[],"3":[],"4":["ความเสี่ยงด้านองค์ความรู้ (Knowledge Risk): เกณฑ์ในหมวดนี้ซ่อนข้อบังคับที่คณะทำงาน KM ต้องวิเคราะห์ความเสี่ยงที่เกี่ยวกับ \"ความรู้\" โดยตรง ใน 3 มิติ คือ 1.ความเสี่ยงจากปฏิบัติงาน (เช่น การสูญเสียความรู้สำคัญให้กับ Outsource, การระบุ Critical Knowledge ผิดพลาด) / 2. ความเสี่ยงจากบุคลากร (เช่น การเกษียณ/ลาออกของผู้เชี่ยวชาญ, การหวงแหนไม่ยอมแบ่งปันความรู้, การยึดติดความรู้เดิม) / 3. ความเสี่ยงด้าน IT (เช่น ระบบ KM ล่ม, ข้อมูลถูกเจาะ หรือระบบไม่ตอบสนองการใช้งาน)","การถอดบทเรียนความเสี่ยง (Lesson Learned): องค์กรไม่สามารถทำเพียงแค่ประเมินความเสี่ยงตามรอบปกติได้ แต่ต้องนำ \"เหตุการณ์เฉียดพลาดหรือความผิดพลาดจริง\" มาผ่านกระบวนการจัดการความรู้ (เช่น AAR) เพื่อสร้างเป็นมาตรฐานปฏิบัติ (Standard Procedure) ใหม่ ป้องกันไม่ให้เกิดซ้ำ"],"5":[]},dimScope:{"1":["การวิเคราะห์และระบุจุดที่ต้องควบคุม ระมัดระวัง หรือจุดสำคัญ/วิกฤต (Critical Step) ในขั้นตอนการปฏิบัติงาน รวมถึงการป้องกันไม่ให้มีการเปลี่ยนแปลงข้อมูลโดยไม่ได้รับอนุญาต หรือมีการนำข้อมูลไปใช้อย่างไม่ถูกต้อง"],"2":["การสื่อสาร แลกเปลี่ยน และถ่ายโอนความรู้ที่เกี่ยวข้องกับการควบคุมจุดที่ต้องควบคุม ระมัดระวังหรือจุดสำคัญ/วิกฤติ (Critical Step) ให้แก่บุคลากรที่เกี่ยวข้องเพื่อสร้างความเข้าใจและความระมัดระวัง"],"3":["การสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานที่สำคัญทั้งกระบวนการหลักและกระบวนการสนับสนุน (Key and Support Processes) แก่บุคลากรที่เกี่ยวข้องอย่างทั่วถึงและต่อเนื่อง"],"4":["การสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานโดยใช้ความรู้เป็นฐาน มีความเชื่อมโยงกับการบริหารความเสี่ยงขององค์กร"],"5":["การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลจากแหล่งอื่น ๆ ในการปรับปรุงการสร้างความตระหนักเรื่องความเสี่ยงในกระบวนการปฏิบัติงานให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ"]},crosslinks:[{"level":"1","dim":"DT"},{"level":"2","dim":"HCM"},{"level":"3","dim":"RM&IC"},{"level":"4","dim":"RM&IC"},{"level":"5","dim":"IA"},{"level":"5","dim":"RM&IC"}]},

    if(d.dm)Object.assign(kmDimMlt,d.dm);
    if(d.cl)Object.assign(clChecked,d.cl);
    if(d.dc)Object.assign(docCk,d.dc);
    if(d.fe)Object.assign(feInput,d.fe);
  }catch(e){}
  DATA.km.subs.forEach(s=>{targets.km[s.id]=kmCalcRaw(s.id)||s.s68;});
}

// ── SCORING ──────────────────────────────────────────────────────────
function kmCalcLevel(sid,L){
  const s=DATA.km.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(kmMrChk[sid]&&kmMrChk[sid][L]&&kmMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((kmScChk[sid]&&kmScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(kmDimMlt[sid]&&kmDimMlt[sid][L])||0;
}
function kmCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=kmCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

function feGapClosed(sid,i){const fi=feInput[sid];if(!fi||!fi.gapClosed)return null;return fi.gapClosed.hasOwnProperty(i)?fi.gapClosed[i]:null;}

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.km.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>kmCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${kmCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=kmCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((kmScChk[sid]&&kmScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(kmMrChk[sid]&&kmMrChk[sid][L]&&kmMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((kmScChk[sid]&&kmScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(kmDimMlt[sid]&&kmDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.km[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.km[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(kmMrChk[sid]&&kmMrChk[sid][L]&&kmMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#1a7a4a':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#1a7a4a':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';

      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#1a7a4a;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#1a7a4a':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=kmMrChk[sid]&&kmMrChk[sid][L]&&kmMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';

      });
      dimH+='</div>';

        <span style="display:flex;gap:3px;align-items:center;flex-shrink:0;">${xBtn}<span style="font-size:10px;font-weight:700;color:${sCol};min-width:28px;text-align:right;">${ls.bl?'—':rv.toFixed(2)}</span></span>

        ${mrH}<div${!ls.passedMR&&mrs.length?' style="pointer-events:none;opacity:.5;"':''}>${dimH}</div>
      </div>
    </div>`;
  });

  return `<div class="cg-sim">
    <div class="cg-sim-hd">
      <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy);color:#fff;">KM</span>
      &nbsp;Sequential Gating Simulator — minReqs + SubComps
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <button onclick="if(confirm('ล้างข้อมูลทั้งหมด?'))kmClearAll()" style="font-size:11px;padding:3px 10px;border:1px solid #e0a0a0;border-radius:5px;background:#fee8e8;cursor:pointer;color:#b03020;font-weight:600;">🗑 ล้างข้อมูล</button>
        <span style="font-size:11px;font-weight:700;color:#0a4a2a;">${raw.toFixed(4)}/5.0</span>
      </span>
    </div>
    <div class="cg-scope-box">${s.scopeNote||''}</div>
    ${crossSumm}
    ${lvlHTML}
    <div class="cg-total-bar">
      <span class="cg-total-lbl">คะแนนดิบสะสม (0–5)</span>
      <span class="cg-raw">${raw.toFixed(4)}</span>
      <span class="cg-wt">× ${s.w}% = <strong>${wt.toFixed(4)} pts</strong></span>
    </div>
  </div>`;
}

// ── renderFrameB ────────────────────────────────────────────────────
function renderFrameB(s){
  const mr=s.minReqs||{};const sid=s.id;
  let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{const items=mr[L]||[];total+=items.length;items.forEach((_,i)=>{if(docGetChk(sid,L,i))done++;});  });
  const progPct=total>0?Math.round(done/total*100):0;
  const progColor=done===total&&total>0?'#1a7a4a':done>0?'#92400e':'#666';
  let html=`<div class="fb-prog-bar"><span style="font-size:11px;font-weight:600;color:${progColor};" id="fb-total-${sid}">${done}/${total} เอกสารพร้อมแล้ว</span><div class="fb-prog-track"><div id="fb-prog-fill-${sid}" style="height:100%;width:${progPct}%;background:${progColor};transition:width .3s;"></div></div></div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lvlDone=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const bdId=`fb-bd-${sid}-${L}`;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const shortTitle=lvlTitle.length>48?lvlTitle.slice(0,48)+'…':lvlTitle;
    const lvlColor=lvlDone===items.length?'#1a7a4a':lvlDone>0?'#92400e':'#0369a1';
    const lvlBg=lvlDone===items.length?'#e4f5e4':lvlDone>0?'#fef8e0':'rgba(2,132,199,.06)';
    const itemsHtml=items.map((item,i)=>{
      const isGap=item.startsWith('[แก้ไข Gap');const cleanItem=item.replace('[แก้ไข Gap สำคัญ]','').trim();
      const ckd=docGetChk(sid,L,i);const ckId=`dck-${sid}-${L}-${i}`;
      return `<label class="fb-item${isGap?' fb-item-gap':''}${ckd?' fb-item-done':''}"><input type="checkbox" id="${ckId}"${ckd?' checked':''} onchange="docToggle('${sid}',${L},${i},this.checked)">${isGap?'<span class="fb-gap-tag">⚠️ Gap</span>':''}<span class="fb-item-text">${cleanItem}</span></label>`;
    }).join('');
    html+=`<div class="doc-lvl-block"><div class="doc-lvl-hd" style="background:${lvlBg};" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="doc-lvl-badge">L${L}</span><span class="doc-lvl-title" style="color:${lvlColor};">${shortTitle}</span><span class="doc-lvl-count" id="fb-cnt-${sid}-${L}" style="color:${lvlColor};font-weight:600;">${lvlDone}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="doc-lvl-body" id="${bdId}">${itemsHtml}</div></div>`;
  });
  return html;
}

// ── renderFrameE ────────────────────────────────────────────────────
function renderFrameE(s){
  const sid=s.id;const mr=s.minReqs||{};const gaps=s.gaps||[];const outId=`fe-out-${sid}`;
  const simMax=[5,4,3,2,1].find(L=>kmCalcLevel(sid,L)>=1)||0;
  const rawScore=kmCalcRaw(sid);
  const pills=[1,2,3,4,5].map(L=>{
    const lv=kmCalcLevel(sid,L);
    const pass=lv>=1;const partial=lv>0&&lv<1;
    return `<span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;background:${pass?'#1a7a4a':partial?'#e3a82e':'#e0ddd8'};color:${pass||partial?'#fff':'#888'};">L${L}${partial?' ('+Math.round(lv*100)+'%)':''}</span>`;
  }).join('');
  let html=`<div class="fe-sim-row"><span style="font-size:11px;color:var(--text3);">คะแนนดิบ (Simulator):</span><div style="display:flex;gap:4px;flex-wrap:wrap;">${pills}</div><span style="font-size:11px;font-weight:700;color:#1a7a4a;margin-left:auto;">${rawScore.toFixed(4)}/5.0</span></div>`;
  html+=`<div class="fe-sect-lbl">สิ่งที่ดำเนินการ — กรอกต่อระดับที่ทำได้</div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const tickedCnt=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const lScore=kmCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const short=lvlTitle.length>46?lvlTitle.slice(0,46)+'…':lvlTitle;
    const note=feGet(sid,'lvlNotes',L);const bdId=`fe-bd-${sid}-${L}`;
    const badgeBg=isPass?'#1a7a4a':isPartial?'#e3a82e':'#94a3b8';
    html+=`<div class="fe-lvl-block${isPass?' fe-lvl-active':''}"><div class="fe-lvl-hd" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="fe-lvl-badge" style="background:${badgeBg};">L${L}</span><span class="fe-lvl-title">${short}</span><span class="fe-doc-ref">📄 ${tickedCnt}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="fe-lvl-body${isPass?' open':''}" id="${bdId}"><textarea class="fe-textarea" rows="3" placeholder="อธิบายสิ่งที่ กทท. ดำเนินการในระดับนี้..." onchange="feSet('${sid}','lvlNotes',${L},this.value)" onblur="feSet('${sid}','lvlNotes',${L},this.value)">${note}</textarea></div></div>`;
  });
  if(gaps.length){
    html+=`<div class="fe-sect-lbl" style="margin-top:12px;">ช่องว่างจาก TRIS — ปิดได้หรือยัง?</div>`;
    gaps.forEach((gap,i)=>{
      const cl=feGapClosed(sid,i);const gNote=feGet(sid,'gapNotes',i);
      html+=`<div class="fe-gap-item"><div class="fe-gap-text">⚠️ ${gap}</div><div class="fe-gap-status"><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="1"${cl===true?' checked':''} onchange="feSet('${sid}','gapClosed',${i},true)">✓ ปิดได้แล้ว</label><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="0"${cl===false?' checked':''} onchange="feSet('${sid}','gapClosed',${i},false)">○ อยู่ระหว่างดำเนินการ</label></div><textarea class="fe-textarea" rows="2" placeholder="อธิบายสิ่งที่ทำเพื่อปิด Gap นี้..." onchange="feSet('${sid}','gapNotes',${i},this.value)" onblur="feSet('${sid}','gapNotes',${i},this.value)">${gNote}</textarea></div>`;
    });
  }
  html+=`<div style="margin-top:14px;"><button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button><span style="font-size:11px;color:var(--text3);margin-left:8px;">รวม Simulator + เอกสาร Frame B + Notes ทั้งหมด</span></div><div style="margin-top:8px;"><textarea class="fe-output" id="${outId}" rows="14" placeholder="กด Gen Script เพื่อสร้างคำตอบ — แก้ไขได้ก่อน Copy"></textarea><button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button></div>`;
  return html;
}

// ── renderRight ──────────────────────────────────────────────────────

  const body=document.getElementById('rightBody');

  body.innerHTML=`
    <div style="padding:5px 12px;font-size:11px;background:#e8f5ee;border-bottom:1px solid #c0dac8;display:flex;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:2;">
      <span style="font-weight:700;color:#0a4a2a;">ข้อ ${s.id}</span>
      <span style="color:#555;font-size:10.5px;">${s.name}</span>
      <span style="margin-left:auto;font-size:10px;background:#e0ddd4;color:#444;padding:1px 7px;border-radius:8px;">ปัจจุบัน ${fmt(s.s68)}</span>
      <span style="font-size:10px;">→</span>
      <span style="font-size:10px;background:#c5e8d5;color:#0a4a2a;padding:1px 7px;border-radius:8px;font-weight:700;">คำนวณ ${fmt(tval)}</span>
    </div>
    ${simHTML}
    <div class="frame"><div class="frame-hd fa-hd"><span class="ftag fa-tag">A</span><span style="color:#7a1010;">ช่องว่างที่ต้องปิด (TRIS)</span></div><div class="frame-bd">${gA||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame"><div class="frame-hd fb-hd"><span class="ftag fb-tag">B</span><span style="color:#102070;">เอกสารลงระบบ — แยกตามระดับ</span><a href="${DOC_DETAIL_URL}" target="_blank" style="margin-left:auto;font-size:9.5px;padding:2px 9px;border-radius:5px;background:#2a4a9a;color:#fff;text-decoration:none;font-weight:600;">📋 ดูทั้งหมด</a></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameB(s)}</div></div>
    <div class="frame"><div class="frame-hd fc-hd"><span class="ftag fc-tag">C</span><span style="color:#4a4a00;">กทท. ตอบอะไรไป / จุดแข็ง</span></div><div class="frame-bd"><div class="box box-gray" style="margin-bottom:6px;font-size:11px;">${exp((s.good||[''])[0]||'—',100)}</div><div style="font-size:9.5px;color:#888;margin:4px 0 2px;font-weight:600;">ผลที่นำเสนอ:</div>${rC}<div style="font-size:9.5px;color:#888;margin:6px 0 2px;font-weight:600;">ช่องว่างที่ยังขาด:</div>${lC}</div></div>
    <div class="frame"><div class="frame-hd fd-hd"><span class="ftag fd-tag">D</span><span style="color:#102848;">สิ่งที่ต้องดำเนินการปี 69</span></div><div class="frame-bd">${dD||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame" style="border-bottom:none;"><div class="frame-hd fe-hd"><span class="ftag fe-tag">E</span><span style="color:#0a4030;">Self-Assessment Script — ร่างคำตอบระบบ สคร.</span></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameE(s)}</div></div>`;
}

// ── renderLeft ───────────────────────────────────────────────────────
function renderLeft(){
  const body=document.getElementById('leftBody');body.innerHTML='';
  document.getElementById('dimTitle').textContent=DATA.km.dimName;
  document.getElementById('dimOrig').textContent='ปัจจุบัน '+fmt(DATA.km.orig);
  document.getElementById('totalLbl').textContent='คะแนนรวม '+DATA.km.dimId;
  document.getElementById('totalOrig').textContent=fmt(DATA.km.orig);
  const grps=[...new Set(DATA.km.subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=DATA.km.subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.km[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const assessed=ss.filter(s=>kmCalcRaw(s.id)>0).length;
    const tot=ss.length;const fillPct=Math.round(gs/5*100);
    const fillCol=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';
    const chkCls=assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none';
    const chkLbl=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;
    const gDiv=document.createElement('div');gDiv.className='grp';
    gDiv.innerHTML=`<div class="grp-row1"><span class="grp-id">${gid}</span><span class="grp-name">${first.gname}</span><span class="grp-wt">(${first.gw}%)</span><div class="grp-scores"><span class="chip cn" style="font-size:10px;">${fmt(first.gs68)}</span><span style="color:#999;font-size:10px;">→</span><span class="chip ${diff<-0.001?'cr':diff>0.001?'ct':'cn'}" style="font-size:10px;" id="gs-cg-${gid}">${fmt(gs)}</span></div></div><div class="grp-row2"><span class="grp-chk ${chkCls}" id="rollup-chk-${gid}">${chkLbl}</span><span class="grp-score2"><strong id="rollup-gs-${gid}" style="color:${diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#555'};">${gs.toFixed(4)}</strong><span id="rollup-delta-${gid}" style="font-size:9px;color:${diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#aaa'};">(${diff>=0?'+':''}${diff.toFixed(4)})</span></span><div class="grp-prog"><div class="grp-prog-fill" id="rollup-bar-${gid}" style="width:${fillPct}%;background:${fillCol};"></div></div></div>`;
    body.appendChild(gDiv);
    ss.forEach(s=>{
      const row=document.createElement('div');row.className='sub'+(focusId===s.id?' focus-cg':'');row.id='subrow-'+s.id;
      row.innerHTML=`<div class="sub-left"><div class="sub-meta"><span class="sub-num">${s.id}</span><span class="sub-name">${s.name}</span><span class="sub-wt">(${s.w}%)</span><span class="sub-now">ปี 68: ${fmt(s.s68)}</span></div></div><div class="sub-target" id="st-${s.id}"><span class="target-lbl">คำนวณ</span><input class="target-inp" id="ti-${s.id}" type="text" value="${fmt(targets.km[s.id])}" readonly style="border-color:#ccc;"><span class="dot ${dotColor(s)}" id="dot-${s.id}"></span></div>`;
      row.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(row);
      const strip=document.createElement('div');strip.className='sstrip';
      strip.innerHTML=`<span class="sbadge ${sClass(s.status)}">${sIcon(s.status)} ${s.status}</span><span style="font-size:10px;color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px;">${s.statusNote||'ยังไม่มีข้อมูล'}</span>`;
      strip.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(strip);
    });
  });
}

// ── renderChecklist ──────────────────────────────────────────────────
function renderChecklist(){
  if(!focusId){document.getElementById('clTitle').textContent='เลือก sub-item เพื่อดู Action Checklist';document.getElementById('clItems').innerHTML='';return;}
  const s=DATA.km.subs.find(x=>x.id===focusId);if(!s)return;
  document.getElementById('clTitle').textContent=`Action Checklist — ข้อ ${s.id} · ปัจจุบัน ${fmt(targets.km[s.id])}`;
  if(!clChecked[s.id])clChecked[s.id]=(s.actions||[]).map(()=>false);
  document.getElementById('clItems').innerHTML=(s.actions||[]).map((a,i)=>{
    const chk=clChecked[s.id][i];
    const sty=chk?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
    return `<div class="cl-item" id="clrow-${s.id}-${i}" style="${sty}"><input type="checkbox" id="cl-${s.id}-${i}" ${chk?'checked':''} onchange="toggleCL('${s.id}',${i},this.checked)"><label for="cl-${s.id}-${i}" style="flex:1;"><span id="cls-${s.id}-${i}" class="cl-short" style="-webkit-line-clamp:2;">${a}</span><span id="clb-${s.id}-${i}" class="cl-exp-btn" onclick="event.preventDefault();clExpand('${s.id}',${i})">อ่านเพิ่ม ▼</span></label></div>`;
  }).join('');
}
function toggleCL(id,i,val){
  if(!clChecked[id])clChecked[id]=[];clChecked[id][i]=val;save();
  const r=document.getElementById('clrow-'+id+'-'+i);if(!r)return;
  r.style.cssText=val?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
}

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.km.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*kmCalcRaw(s.id),0);
  const delta=total-DATA.km.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.km[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>kmCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
loadState();
renderAll();
syncHomeStatus();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
