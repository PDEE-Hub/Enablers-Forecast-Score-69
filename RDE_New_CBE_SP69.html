  if(gaps.length){
    html+=`<div class="fe-sect-lbl" style="margin-top:12px;">ช่องว่างจาก TRIS — ปิดได้หรือยัง?</div>`;
    gaps.forEach((gap,i)=>{
      const cl=feGapClosed(sid,i);const gNote=feGet(sid,'gapNotes',i);
      html+=`<div class="fe-gap-item"><div class="fe-gap-text">⚠️ ${gap}</div><div class="fe-gap-status"><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="1"${cl===true?' checked':''} onchange="feSet('${sid}','gapClosed',${i},true)">✓ ปิดได้แล้ว</label><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="0"${cl===false?' checked':''} onchange="feSet('${sid}','gapClosed',${i},false)">○ อยู่ระหว่างดำเนินการ</label></div><textarea class="fe-textarea" rows="2" placeholder="อธิบายสิ่งที่ทำเพื่อปิด Gap นี้..." onchange="feSet('${sid}','gapNotes',${i},this.value)" onblur="feSet('${sid}','gapNotes',${i},this.value)">${gNote}</textarea></div>`;
    });
  }
  html+=`<div style="margin-top:14px;"><button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button><span style="font-size:11px;color:var(--text3);margin-left:8px;">รวม Simulator + เอกสาร Frame B + Notes ทั้งหมด</span></div><div style="margin-top:8px;"><textarea class="fe-output" id="${outId}" rows="14" placeholder="กด Gen Script เพื่อสร้างคำตอบ — แก้ไขได้ก่อน Copy"></textarea><button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button></div>`;
  return html;
}

// ── renderRight ──────────────────────────────────────────────────────
function renderRight(){
  const body=document.getElementById('rightBody');
  if(!focusId){body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:13px;">คลิก sub-item ด้านซ้ายเพื่อดูรายละเอียด</div>';return;}
  const s=DATA.sp.subs.find(x=>x.id===focusId);if(!s){body.innerHTML='';return;}
  const simHTML=renderSim(s);const tval=targets.sp[s.id];
  const gA=(s.gaps||[]).map(g=>`<div class="box box-red" style="margin-bottom:4px;">• ${exp(g,90)}</div>`).join('');
  const rC=(s.results||[]).map(r=>`<div class="match-row m-ok"><span>✓</span><span>${exp(r,80)}</span></div>`).join('');
  const lC=(s.gaps||[]).slice(0,3).map(g=>`<div class="match-row m-no"><span>✗</span><span style="font-size:10.5px;">${g.split(' —')[0].slice(0,70)}</span></div>`).join('');
  const dD=(s.actions||[]).map(a=>`<div style="display:flex;align-items:flex-start;gap:5px;font-size:11px;color:#333;padding:3px 0;"><span style="color:#7c3aed;flex-shrink:0;">→</span><span>${exp(a,100)}</span></div>`).join('');
  body.innerHTML=`
    <div style="padding:8px 16px;font-size:11px;background:var(--bg2);border-bottom:3px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:2;">
      <span style="font-weight:800;color:var(--dim);">ข้อ ${s.id}</span>
      <span style="color:var(--text2);font-size:10.5px;">${s.name}</span>
      <span style="margin-left:auto;font-size:10px;background:#fff;border:1.5px solid var(--border);color:var(--text2);padding:1px 8px;border-radius:20px;font-weight:600;">ปัจจุบัน ${fmt(s.s68)}</span>
      <span style="font-size:10px;">→</span>
      <span style="font-size:10px;background:var(--lv5);color:#fff;padding:1px 8px;border-radius:20px;font-weight:700;">คำนวณ ${fmt(tval)}</span>
    </div>
    <div class="frame">
      <div class="frame-hd fa-hd"><span class="ftag fa-tag">1</span><span>ช่องว่างจาก TRIS + สิ่งที่ต้องทำปี 69 — อ่านก่อนเริ่มติ๊ก Checkbox</span></div>
      <div class="frame-bd">
        <div style="font-size:10px;font-weight:800;color:#7a1010;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">⚠ ผู้ประเมินมองว่ายังขาด</div>
        ${gA||'<div style="color:#999;">—</div>'}
        <div style="border-top:2px dashed var(--border-s);margin:12px 0;"></div>
        <div style="font-size:10px;font-weight:800;color:#1f7a4a;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">✅ ต้องทำต่อในปี 69</div>
        ${dD||'<div style="color:#999;">—</div>'}
      </div>
    </div>
    ${simHTML}
    <div class="frame">
      <div class="frame-hd fb-hd"><span class="ftag fb-tag">2</span><span>เอกสารลงระบบ — แยกตามระดับ</span>
        <a href="${DOC_DETAIL_URL}" target="_blank" style="margin-left:auto;font-size:9.5px;padding:2px 9px;border-radius:20px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;">📋 ดูทั้งหมด</a>
      </div>
      <div class="frame-bd" style="padding:6px 8px;">${renderFrameB(s)}</div>
    </div>
    <div class="frame">
      <div class="frame-hd fc-hd"><span class="ftag fc-tag">3</span><span>กทท. ตอบอะไรไป / จุดแข็ง</span></div>
      <div class="frame-bd">
        <div class="box box-gray" style="margin-bottom:6px;font-size:11px;">${exp((s.good||[''])[0]||'—',100)}</div>
        <div style="font-size:9.5px;color:#888;margin:4px 0 2px;font-weight:600;">ผลที่นำเสนอ:</div>${rC}
        <div style="font-size:9.5px;color:#888;margin:6px 0 2px;font-weight:600;">ช่องว่างที่ยังขาด:</div>${lC}
      </div>
    </div>
    <div class="frame" style="border-bottom:none;">
      <div class="frame-hd fe-hd"><span class="ftag fe-tag">4</span><span>Self-Assessment Script — ร่างคำตอบระบบ สคร.</span></div>
      <div class="frame-bd" style="padding:6px 8px;">${renderFrameE(s)}</div>
    </div>`;
}

// ── renderLeft ───────────────────────────────────────────────────────
function renderLeft(){
  const body=document.getElementById('leftBody');body.innerHTML='';
  document.getElementById('dimTitle').textContent=DATA.sp.dimName;
  document.getElementById('dimOrig').textContent='ปัจจุบัน '+fmt(DATA.sp.orig);
  document.getElementById('totalLbl').textContent='คะแนนรวม '+DATA.sp.dimId;
  document.getElementById('totalOrig').textContent=fmt(DATA.sp.orig);
  const grps=[...new Set(DATA.sp.subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=DATA.sp.subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.sp[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const assessed=ss.filter(s=>spCalcRaw(s.id)>0).length;
    const tot=ss.length;const fillPct=Math.round(gs/5*100);
    const fillCol=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';
    const chkCls=assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none';
    const chkLbl=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;
    const gDiv=document.createElement('div');gDiv.className='grp';
    gDiv.innerHTML=`<div class="grp-row1"><span class="grp-id">${gid}</span><span class="grp-name">${first.gname}</span><span class="grp-wt">(${first.gw}%)</span><div class="grp-scores"><span class="chip cn" style="font-size:10px;">${fmt(first.gs68)}</span><span style="color:#999;font-size:10px;">→</span><span class="chip ${diff<-0.001?'cr':diff>0.001?'ct':'cn'}" style="font-size:10px;" id="gs-cg-${gid}">${fmt(gs)}</span></div></div><div class="grp-row2"><span class="grp-chk ${chkCls}" id="rollup-chk-${gid}">${chkLbl}</span><span class="grp-score2"><strong id="rollup-gs-${gid}" style="color:${diff>0.001?'#7c3aed':diff<-0.001?'#c03020':'#555'};">${gs.toFixed(4)}</strong><span id="rollup-delta-${gid}" style="font-size:9px;color:${diff>0.001?'#7c3aed':diff<-0.001?'#c03020':'#aaa'};">(${diff>=0?'+':''}${diff.toFixed(4)})</span></span><div class="grp-prog"><div class="grp-prog-fill" id="rollup-bar-${gid}" style="width:${fillPct}%;background:${fillCol};"></div></div></div>`;
    body.appendChild(gDiv);
    ss.forEach(s=>{
      const row=document.createElement('div');row.className='sub'+(focusId===s.id?' focus-cg':'');row.id='subrow-'+s.id;
      row.innerHTML=`<div class="sub-left"><div class="sub-meta"><span class="sub-num">${s.id}</span><span class="sub-name">${s.name}</span><span class="sub-wt">(${s.w}%)</span><span class="sub-now">ปี 68: ${fmt(s.s68)}</span></div></div><div class="sub-target" id="st-${s.id}"><span class="target-lbl">คำนวณ</span><input class="target-inp" id="ti-${s.id}" type="text" value="${fmt(targets.sp[s.id])}" readonly style="border-color:#ccc;"><span class="dot ${dotColor(s)}" id="dot-${s.id}"></span></div>`;
      row.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(row);
      const strip=document.createElement('div');strip.className='sstrip';
      strip.innerHTML=`<span class="sbadge ${sClass(s.status)}">${sIcon(s.status)} ${s.status}</span><span style="font-size:10px;color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px;">${s.statusNote||'ยังไม่มีข้อมูล'}</span>`;
      strip.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(strip);
    });
  });
}

// ── renderChecklist ──────────────────────────────────────────────────
function renderChecklist(){
  if(!focusId){document.getElementById('clTitle').textContent='เลือก sub-item เพื่อดู Action Checklist';document.getElementById('clItems').innerHTML='';return;}
  const s=DATA.sp.subs.find(x=>x.id===focusId);if(!s)return;
  document.getElementById('clTitle').textContent=`Action Checklist — ข้อ ${s.id} · ปัจจุบัน ${fmt(targets.sp[s.id])}`;
  if(!clChecked[s.id])clChecked[s.id]=(s.actions||[]).map(()=>false);
  document.getElementById('clItems').innerHTML=(s.actions||[]).map((a,i)=>{
    const chk=clChecked[s.id][i];
    const sty=chk?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
    return `<div class="cl-item" id="clrow-${s.id}-${i}" style="${sty}"><input type="checkbox" id="cl-${s.id}-${i}" ${chk?'checked':''} onchange="toggleCL('${s.id}',${i},this.checked)"><label for="cl-${s.id}-${i}" style="flex:1;"><span id="cls-${s.id}-${i}" class="cl-short" style="-webkit-line-clamp:2;">${a}</span><span id="clb-${s.id}-${i}" class="cl-exp-btn" onclick="event.preventDefault();clExpand('${s.id}',${i})">อ่านเพิ่ม ▼</span></label></div>`;
  }).join('');
}
function toggleCL(id,i,val){
  if(!clChecked[id])clChecked[id]=[];clChecked[id][i]=val;save();
  const r=document.getElementById('clrow-'+id+'-'+i);if(!r)return;
  r.style.cssText=val?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
}

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.sp.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*spCalcRaw(s.id),0);
  const delta=total-DATA.sp.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.sp[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#7c3aed':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#7c3aed':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>spCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
(async function init(){
  await loadState();
  renderAll();
  syncHomeStatus();
})();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
</script>
