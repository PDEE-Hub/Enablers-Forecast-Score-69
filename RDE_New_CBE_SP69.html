ร้ายที่สุด (Worst Case)","actions":["ในปี 2569 ฝ่ายกลยุทธ์องค์กรควรทำงานร่วมกับฝ่ายการเงินอย่างใกล้ชิด เพื่อจัดทำตัวเลขประมาณการทางการเงินตามสถานการณ์ (Financial Scenario Planning) อย่างน้อย 3 รูปแบบ (Base Case, Best Case, Worst Case) และระบุสมมติฐานเชิงเศรษฐศาสตร์หรือปัจจัยขับเคลื่อนที่ชัดเจน (เช่น ปริมาณตู้สินค้า, อัตราเงินเฟ้อ, GDP) รวมถึงกำหนดกลยุทธ์หรือแผนปฏิบัติการเพื่อรองรับและป้องกันความเสี่ยงหากเกิดสถานการณ์แบบ Worst Case"],"dimLevels":["มีกระบวนการ/คู่มือ การจัดทำประมาณการผลประกอบการทางการเงิน / มีตัวเลขประมาณการผลประกอบการทางการเงินล่วงหน้า ครอบคลุมตามระยะเวลาของแผนวิสาหกิจ","มิติด้านสถานการณ์: มีการจัดทำประมาณการทางการเงินโดยแบ่งออกเป็น \"แต่ละสถานการณ์ (Scenarios)\" (เช่น Worst Case, Base Case, Best Case) / มิติด้านสมมติฐาน: มีการระบุ \"สมมติฐาน (Assumptions)\" ที่เป็นที่มาของตัวเลขในแต่ละสถานการณ์อย่างชัดเจน","มิติการกำหนดยุทธศาสตร์: มีหลักฐานแสดงการนำผลจำลองสถานการณ์ทางการเงิน มากางดูเพื่อเลือก \"กำหนดยุทธศาสตร์ที่เหมาะสม\" / มิติความคุ้มค่า: มีหลักฐานการทำ \"Cost-Benefit Analysis\" เพื่อเปรียบเทียบต้นทุนและผลประโยชน์ของแต่ละทางเลือกยุทธศาสตร์อย่างเป็นรูปธรรม","มีหลักฐานการนำสมมติฐานไปประยุกต์ใช้ปรับแผนงานที่สำคัญ / มิติบังคับ: มีการกำหนด \"ยุทธศาสตร์ หรือ แผนปฏิบัติการเชิงรุก\" ที่ระบุชัดเจนว่าทำขึ้น เพื่อป้องกันไม่ให้องค์กรตกลงไปสู่สถานการณ์ Worst Case Scenario","มีแนวทางการประเมินประสิทธิผลของการ \"กำหนดสมมติฐาน\" / มีผลลัพธ์ของการประเมิน (เช่น สมมติฐานที่ตั้งไว้ในปีที่แล้ว แม่นยำหรือคลาดเคลื่อนแค่ไหน) / มีหลักฐานการนำผลประเมินไปปรับปรุงวิธีการตั้งสมมติฐานในปีถัดไปให้แม่นยำขึ้น"]},{"id":"3.1","grp":"3","gname":"การกำหนดวัตถุประสงค์เชิงยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ /เป้าประสงค์","w":2.5,"s68":1,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่ \"ความเฉียบคมและการมีหลักฐานอ้างอิงในการตั้งเป้าหมาย (Evidence-based Target Setting)\" รัฐวิสาหกิจจะต้องตอบให้ได้ว่า การที่ตั้งเป้าหมายหลัก (SO) แบบนี้ เพื่อตอบสนองต่อ Strategic Positioning (จากข้อ 2.1) อย่างไร และที่สำคัญคือต้องมีการนำ \"ข้อมูลคู่เทียบ (Benchmark Data)\" มากางบนโต๊ะเพื่อพิสูจน์ว่าเป้าหมาย (Goals) ที่ตั้งไว้นั้นมีความท้าทาย ไม่ใช่ตั้งเป้าต่ำๆ เพื่อให้ได้โบนัสง่ายๆ และท้ายที่สุดต้องสามารถถ่ายทอด (Cascade) SO เหล่านี้ลงไปเป็นยุทธศาสตร์องค์กร และแผนแม่บทลูกได้อย่างไร้รอยต่อ","levelSumm":["มีคู่มือ/ขั้นตอน (SIPOC) ที่ระบุกระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ (SO) และเป้าประสงค์ (Goals) อย่างชัดเจน","มีหลักฐานการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์และเป้าประสงค์ ครบถ้วนตามกระบวนการ","มิติการเชื่อมโยงทิศทาง: มีตาราง (Traceability Matrix) แสดงการจับคู่ระหว่าง SO และเป้าประสงค์ ส่งต่อไปเป็น \"ยุทธศาสตร์ (Strategy)\" และ \"กลยุทธ์ (Tactic)\" ระดับองค์กรอย่างชัดเจน","มิติการเชื่อมโยงระดับยุทธศาสตร์: มีหลักฐานการถ่ายทอด SO ไปยังแผนแม่บทที่เกี่ยวข้อง (เช่น แผน HR, แผน IT, แผนนวัตกรรม) ให้กลายเป็นยุทธศาสตร์ของแผนลูก","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์"],"good":["มีการกำหนดกระบวนการในการตั้งวัตถุประสงค์เชิงยุทธศาสตร์ (SO) ที่ชัดเจน ผ่าน SIPOC 4 (ขั้นตอนที่ 12) โดยใช้ข้อมูลปัจจัยสภาพแวดล้อมที่อัปเดตเป็นปัจจุบัน","มีการนำเป้าหมายระดับวิสัยทัศน์ และข้อมูลตำแหน่งเชิงยุทธศาสตร์ (Strategic Positioning) มาเปรียบเทียบกับข้อมูลคู่เทียบ (Benchmark) เพื่อใช้เป็นฐานในการตั้งเป้าหมาย SO ได้อย่างเป็นรูปธรรม","สามารถบูรณาการความเชื่อมโยง (Cascade) จาก SO ลงไปสู่ระดับยุทธศาสตร์ และระดับกลยุทธ์ขององค์กรได้อย่างชัดเจน (แผนแม่ลงสู่กลยุทธ์แม่)"],"gaps":["ขาดความชัดเจนในการเชื่อมโยงวัตถุประสงค์เชิงยุทธศาสตร์ลงสู่แผนแม่บท (Alignment): แม้ กทท. จะมีการตั้งเป้าหมายในภาพรวมองค์กรแล้ว แต่ผู้ประเมินมองว่า กทท. ยังไม่สามารถแสดงความเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้องได้อย่างชัดเจนเพียงพอ โดย กทท. ควรแสดงการจับคู่ความเชื่อมโยงลงลึกไปถึงระดับ \"วัตถุประสงค์เชิงยุทธศาสตร์ หรือยุทธศาสตร์ของแต่ละแผนแม่บท พร้อมทั้งระบุเป้าประสงค์ที่เกี่ยวข้อง\" ให้เห็นภาพอย่างเป็นรูปธรรม","ขาดการแสดงรายละเอียดและข้อมูลที่ใช้บูรณาการกับแผนแม่บทอย่างครบถ้วน: กทท. จำเป็นต้องแสดงรายละเอียด ขั้นตอน และข้อมูลที่ใช้บูรณาการกับการจัดทำและวิเคราะห์สภาพแวดล้อมของ \"แต่ละแผนแม่บท\" ได้อย่างครบถ้วนทุกแผนแม่บท เพื่อให้มั่นใจว่าการถ่ายทอดเป้าหมายลงสู่แผนลูกนั้นถูกต้องและสอดคล้องกันอย่างแท้จริง","ขาดการประเมินประสิทธิผลของกระบวนการ (Process Evaluation ในระดับ 5): กทท. ยังไม่มีการกำหนดแนวทางในการวัดหรือประเมินประสิทธิผลของ \"กระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์และเป้าประสงค์\" รวมถึงยังไม่มีการแสดงผลลัพธ์ หรือการนำผลการประเมินดังกล่าวไปใช้ทบทวนและปรับปรุงกระบวนการให้ดีขึ้น"],"results":["ระดับ 1-3 (ผ่านเกณฑ์): มีกระบวนการชัดเจน นำ Benchmark มาตั้งเป้าหมาย และเชื่อมโยง SO ลงสู่ยุทธศาสตร์และกลยุทธ์ระดับองค์กรได้สมบูรณ์","ระดับ 4 (ไม่ผ่านเกณฑ์ในมุมมองผู้ประเมิน): แม้ กทท. จะส่งแบบฟอร์มกำหนด SO ของแผนแม่บท (แผนลูก) และจัดทำตารางความเชื่อมโยง (Alignment Strategy) แล้ว แต่ผู้ประเมินมองว่ารายละเอียดยังไม่ชัดเจนและไม่ครบถ้วน"],"tris":["การเชื่อมโยงลงสู่ \"แผนแม่บท\" ขาดรายละเอียดเชิงลึก (Gap ระดับ 4): TRIS สะท้อนชัดเจนว่า กทท. \"ยังไม่สามารถแสดงความเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้อง โดยควรมีการแสดงความเชื่อมโยงทั้งในระดับวัตถุประสงค์เชิงยุทธศาสตร์ หรือยุทธศาสตร์ของแต่ละแผนแม่บท พร้อมเป้าประสงค์ที่เกี่ยวข้อง\" หมายความว่า การจับคู่ว่า SO ขององค์กรข้อนี้ ไปตอบโจทย์แผนแม่บท HR, IT หรือนวัตกรรมอย่างไร ยังขาดการระบุ \"เป้าประสงค์ (Goal)\" ที่รองรับกันอย่างเป็นรูปธรรม"],"suggest":["Quick Win สำหรับระดับ 4 (Alignment): ให้ฝ่ายกลยุทธ์องค์กร (ฝก.) เชิญเจ้าของแผนแม่บททุกแผนมาทำตาราง Mapping ร่วมกัน โดยต้องระบุให้ชัดเจนว่า SO ขององค์กรแต่ละข้อ ถูกนำไปตั้งเป็น \"SO ของแผนแม่บท\" และ \"เป้าประสงค์ (Goal) ของแผนแม่บท\" นั้นๆ อย่างไร (ต้องเห็นความเชื่อมโยงแบบ 1 ต่อ 1 หรือ One-to-Many ที่ชัดเจน ไม่กว้างจนเกินไป)","Step up สำหรับระดับ 5 (Process Evaluation): เริ่มกำหนด KPI ในการประเมิน \"กระบวนการจัดทำ SO (SIPOC 4 ขั้นตอนที่ 12)\" เช่น ประเมินความถูกต้องของการใช้ Benchmark หรือความสอดคล้องของเป้าหมาย และนำผลมาปรับปรุงคู่มือการทำงานในปีถัดไป"],"docs":["ตาราง Alignment Matrix (ฉบับลงลึก): แสดงการจับคู่ระหว่าง SO ขององค์กร -> SO ของแต่ละแผนแม่บท -> เป้าประสงค์/ตัวชี้วัดของแผนแม่บท","เอกสารแนวทางการประเมินประสิทธิผลการตั้งเป้าหมาย SO (KPI in process): สำหรับระดับ 5","รายงานการประชุมปรับปรุงกระบวนการ (Continuous Improvement): เพื่อแสดงให้เห็นว่ากระบวนการตั้ง SO มีประสิทธิภาพดีขึ้น"],"bestprac":["คู่เทียบทำได้ดีกว่าในระดับ 4: ทั้ง กทพ. และ รฟม. สามารถทำหลักฐานในระดับ 4 ได้ผ่านเกณฑ์ โดย TRIS ระบุว่าทั้งสององค์กร \"สามารถเชื่อมโยงวัตถุประสงค์เชิงยุทธศาสตร์กับหัวข้ออื่นที่เกี่ยวข้อง โดยเชื่อมโยงทั้งในระดับยุทธศาสตร์ของแต่ละแผนแม่บท พร้อมเป้าประสงค์ของแผนแม่บท\" ซึ่ง กทท. ต้องนำรูปแบบการทำตาราง Alignment ของคู่เทียบมาปรับใช้เพื่อให้ผ่านระดับ 4"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของกระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ และเป้าประสงค์ที่สำคัญของแต่ละวัตถุประสงค์เชิงยุทธศาสตร์ รวมถึงแหล่งที่มาของข้อมูลและกระบวนการ เพื่อให้ได้มาซึ่งกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ขององค์กร"],"2":["รัฐวิสาหกิจมีการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ และเป้าประสงค์ที่สำคัญของแต่ละวัตถุประสงค์เชิงยุทธศาสตร์ เพื่อประกอบการจัดทำแผนวิสาหกิจ/แผนยุทธศาสตร์ (แผนระยะยาว) โดยต้องแสดงความสัมพันธ์ระหว่างวัตถุประสงค์เชิงยุทธศาสตร์ กับ Strategic Positioning ขององค์กร และข้อมูลคู่เทียบเพื่อเป็นการประกอบการพิจารณา"],"3":["มีการบูรณาการในวัตถุประสงค์เชิงยุทธศาสตร์ และเป้าประสงค์ที่สำคัญของแต่ละวัตถุประสงค์เชิงยุทธศาสตร์ กับยุทธศาสตร์และกลยุทธ์ขององค์กร"],"4":["วัตถุประสงค์เชิงยุทธศาสตร์ สามารถเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้อง โดยเชื่อมโยงทั้งในระดับยุทธศาสตร์ของแต่ละแผนแม่บท พร้อมเป้าประสงค์"],"5":["มีการวัดประสิทธิผลของกระบวนการ และนำมาทบทวนรวมถึงปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก \"ตั้งเป้าหมายโดยไม่มีคู่เทียบ\" (The Missing Benchmark Trap): ผู้ตรวจ สคร./TRIS ให้ความสำคัญกับคำว่า \"ข้อมูลคู่เทียบ\" มากครับ หากองค์กรกำหนดเป้าประสงค์ (Goals) เช่น \"รายได้เติบโต 5%\" หรือ \"คะแนนความพึงพอใจ 90%\" แต่ในเล่มแผนวิสาหกิจไม่มีสไลด์หรือตารางที่โชว์ว่า คู่แข่งหรือค่าเฉลี่ยอุตสาหกรรมเขาทำได้เท่าไหร่ คะแนนระดับ 2 จะถูกหักหายไปทันที","ระวังขาดความสอดคล้องกับข้อ 2.1 (Alignment Break): วัตถุประสงค์ที่ตั้งขึ้นมาต้องรับลูกมาจากภาพอนาคต (Strategic Positioning) หากในข้อ 2.1 ประกาศว่าจะเป็น \"Smart Port\" แต่ในข้อ 3.1 ไม่มี SO ข้อไหนที่สะท้อนเรื่องดิจิทัลหรือนวัตกรรมเลย ผู้ตรวจจะถือว่ากระบวนการขาดความเชื่อมโยงกัน"],"4":["ความสมดุลของเป้าหมาย (Balanced Goals): จากเอกสารสรุป Feedback Day ของ กทท. ผู้ตรวจได้ให้ข้อเสนอแนะว่า เป้าหมายระดับองค์กร (แม่) อาจเป็นภาพรวม (เช่น กำไรสุทธิ) แต่เมื่อบูรณาการลงไปที่เป้าหมายระดับแผนแม่บท (ลูก) ในระดับ 4 จะต้อง แตกย่อยให้เห็นส่วนสนับสนุนที่ชัดเจน (เช่น แผนลูกค้าดูแลเรื่องรายได้, แผนดิจิทัลดูแลเรื่องการลดค่าใช้จ่าย) เพื่อแสดงให้เห็นการผลักดันผลลัพธ์จากระดับล่างขึ้นบนอย่างสมดุล","การบูรณาการลงแผนแม่บทต้องไปให้สุดทาง (Deep Integration): การบูรณาการไปยังแผนลูกไม่ใช่แค่เอาชื่อยุทธศาสตร์ไปใส่ในแผนลูก แต่เกณฑ์บังคับชัดเจนว่าต้อง \"พร้อมเป้าประสงค์\" นั่นหมายความว่า ถ้าแผนแม่ (SP) ตั้งเป้า SO ว่า \"เพิ่มประสิทธิภาพการบริการ 10%\" แผนลูก (เช่น IT) ก็ต้องมียุทธศาสตร์สนับสนุน และต้องมีเป้าประสงค์ของแผน IT เช่น \"ลดระบบล่มเหลือ 0%\" มารองรับให้เห็นอย่างเป็นรูปธรรม"]},"scopeNote":"มุ่งเน้นไปที่ \"ความเฉียบคมและการมีหลักฐานอ้างอิงในการตั้งเป้าหมาย (Evidence-based Target Setting)\" รัฐวิสาหกิจจะต้องตอบให้ได้ว่า การที่ตั้งเป้าหมายหลัก (SO) แบบนี้ เพื่อตอบสนองต่อ Strategic Positioning (จากข้อ 2.1) อย่างไร และที่สำคัญคือต้องมีการนำ \"ข้อมูลคู่เทียบ (Benchmark Data)\" มากางบนโต๊ะเพื่อพิสูจน์ว่าเป้าหมาย (Goals) ที่ตั้งไว้นั้นมีความท้าทาย ไม่ใช่ตั้งเป้าต่ำๆ เพื่อให้ได้โบนัสง่ายๆ และท้ายที่สุดต้องสามารถถ่ายทอด (Cascade) SO เหล่านี้ลงไปเป็นยุทธศาสตร์องค์กร และแผนแม่บทลูกได้อย่างไร้รอยต่อ","actions":["Quick Win สำหรับระดับ 4 (Alignment): ให้ฝ่ายกลยุทธ์องค์กร (ฝก.) เชิญเจ้าของแผนแม่บททุกแผนมาทำตาราง Mapping ร่วมกัน โดยต้องระบุให้ชัดเจนว่า SO ขององค์กรแต่ละข้อ ถูกนำไปตั้งเป็น \"SO ของแผนแม่บท\" และ \"เป้าประสงค์ (Goal) ของแผนแม่บท\" นั้นๆ อย่างไร (ต้องเห็นความเชื่อมโยงแบบ 1 ต่อ 1 หรือ One-to-Many ที่ชัดเจน ไม่กว้างจนเกินไป)","Step up สำหรับระดับ 5 (Process Evaluation): เริ่มกำหนด KPI ในการประเมิน \"กระบวนการจัดทำ SO (SIPOC 4 ขั้นตอนที่ 12)\" เช่น ประเมินความถูกต้องของการใช้ Benchmark หรือความสอดคล้องของเป้าหมาย และนำผลมาปรับปรุงคู่มือการทำงานในปีถัดไป"],"dimLevels":["มีคู่มือ/ขั้นตอน (SIPOC) ที่ระบุกระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ (SO) และเป้าประสงค์ (Goals) อย่างชัดเจน / มีการระบุ \"แหล่งที่มาของข้อมูล\" ที่จะนำมาใช้ประกอบการตั้งเป้าหมายอย่างชัดเจน","มีหลักฐานการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์และเป้าประสงค์ ครบถ้วนตามกระบวนการ / มิติความสอดคล้อง: มีตาราง/แผนภาพเชื่อมโยง (Mapping) ระหว่าง SO กับ \"Strategic Positioning\" ขององค์กร / มิติบังคับเรื่องคู่เทียบ: มีการนำ \"ข้อมูลคู่เทียบ (Benchmark)\" มาแสดงเพื่อประกอบการพิจารณาตั้งเป้าประสงค์ในแต่ละ SO","มิติการเชื่อมโยงทิศทาง: มีตาราง (Traceability Matrix) แสดงการจับคู่ระหว่าง SO และเป้าประสงค์ ส่งต่อไปเป็น \"ยุทธศาสตร์ (Strategy)\" และ \"กลยุทธ์ (Tactic)\" ระดับองค์กรอย่างชัดเจน","มิติการเชื่อมโยงระดับยุทธศาสตร์: มีหลักฐานการถ่ายทอด SO ไปยังแผนแม่บทที่เกี่ยวข้อง (เช่น แผน HR, แผน IT, แผนนวัตกรรม) ให้กลายเป็นยุทธศาสตร์ของแผนลูก / มิติการเชื่อมโยงระดับเป้าประสงค์: แผนแม่บทลูกมีการรับลูกโดยตั้ง \"เป้าประสงค์ (Goals) ของแผนแม่บท\" ให้สอดคล้องและผลักดันเป้าประสงค์ระดับองค์กร","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ (KPI in Process) / มีหลักฐานการนำผลประเมินหรือข้อบกพร่อง ไปปรับปรุงกระบวนการทำงานในปีถัดไป"]},{"id":"3.2","grp":"3","gname":"การกำหนดวัตถุประสงค์เชิงยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การตรวจสอบความสมดุลและสอดคล้องระหว่างวัตถุประสงค์เชิงยุทธศาสตร์กับองค์ประกอบที่สำคัญ","w":5,"s68":1,"status":"ยังไม่เริ่ม","statusNote":"","scope":"ขอบเขตการประเมินในข้อนี้ทำหน้าที่ 2 ส่วน คือ 1. การตรวจเช็ครากฐาน (Backward Check): วัตถุประสงค์เชิงยุทธศาสตร์ (SO) ต้องถูกสร้างขึ้นมาเพื่ออุดจุดอ่อน (SC) ดันจุดแข็ง (SA) และต่อยอดความเก่ง (CC) ไม่ใช่นึกจะตั้งก็ตั้งขึ้นมาลอยๆ และ 2. การตรวจเช็คการส่งต่อ (Forward Check): SO ต้องถูกแปลงสภาพไปเป็น ยุทธศาสตร์ (Strategy) และ กลยุทธ์ (Tactic) ที่มี \"ความสมดุล\" ในทุกมิติ (เช่น ใช้หลักการ Balanced Scorecard: BSC) และต้องบังคับส่งต่อให้แผนแม่บท 3 ด้านหลัก (ความเสี่ยง, นวัตกรรม, การสร้างมูลค่า) รับลูกไปทำต่อให้ได้","levelSumm":["มีหลักฐาน (เช่น ตาราง Mapping) ที่แสดงว่า \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" แต่ละข้อ ถูกดึงและวิเคราะห์มาจาก ความท้าทาย (SC), ความได้เปรียบ (SA), และความสามารถพิเศษ (CC) ขององค์กร","มิติความครบถ้วน: มีตารางความสัมพันธ์เชิงยุทธศาสตร์ (Strategic Alignment Matrix) ที่จับคู่ SO กับประเด็นสำคัญทั้งหมดขององค์กร (เช่น SWOT, Positioning, SC/SA/CC) อย่างครบถ้วนทุกข้อ","มิติการกำหนดยุทธศาสตร์: มีการเชื่อมโยง SO ลงไปสู่การกำหนดเป็น \"ยุทธศาสตร์ (Strategy)\" อย่างชัดเจน","มิติบูรณาการแผนลูก: มีตารางอธิบายความเชื่อมโยงของ SO ลงสู่ยุทธศาสตร์ของแผนแม่บท (Enablers) ต่างๆ","มีแนวทางการประเมินประสิทธิผลของกระบวนการตรวจสอบความสมดุลและสอดคล้อง"],"good":["มีการระบุขั้นตอนการทำงานไว้อย่างชัดเจนใน SIPOC 4 (ขั้นตอนที่ 6-7, 12-13)","มีการกำหนดวัตถุประสงค์เชิงยุทธศาสตร์ (SO) ที่ตอบสนองต่อประเด็นสำคัญได้อย่างครบถ้วน เช่น ความท้าทาย (SC), ความได้เปรียบ (SA), ความสามารถพิเศษ (CC), ปัจจัยขับเคลื่อนมูลค่า, ปัจจัยเสี่ยง, โอกาสทางธุรกิจ, โอกาสด้านนวัตกรรม, ปัจจัยความยั่งยืน และความต้องการของผู้มีส่วนได้ส่วนเสีย","มีการจัดทำ \"ตารางแสดงความเชื่อมโยงและสอดคล้องระหว่างวัตถุประสงค์เชิงยุทธศาสตร์ (SO) กับองค์ประกอบที่สำคัญ 14 ปัจจัย\" ซึ่งเป็นหลักฐานเชิงประจักษ์ที่ดีในระดับเริ่มต้น"],"gaps":["การอธิบาย \"ความสมดุล (Balance)\": แม้ กทท. จะจับคู่ SO กับปัจจัยต่างๆ ได้ แต่ยังขาดการอธิบายว่า ยุทธศาสตร์ กลยุทธ์ ตัวชี้วัด และค่าเป้าหมายที่ตั้งขึ้นมานั้น ช่วยสร้างความสมดุลได้อย่างไร (เช่น สมดุลระหว่างโอกาสระยะสั้นกับระยะยาว, สมดุลระหว่างการแก้ปัญหาความท้าทายกับความต้องการของผู้มีส่วนได้ส่วนเสีย)","ความชัดเจนในการอธิบายแผนแม่บท (ระดับ 4): การอธิบายความเชื่อมโยงของ SO ลงสู่ยุทธศาสตร์ของแผนแม่บทเฉพาะด้าน (เช่น แผนบริหารความเสี่ยง, แผนนวัตกรรม, แผนปัจจัยขับเคลื่อนมูลค่า) ยังขาดความชัดเจนว่าแผนลูกเหล่านี้มารองรับความสมดุลของแผนแม่อย่างไร","การประเมินกระบวนการ (ระดับ 5): ขาดแนวทาง ตัวชี้วัด และผลการประเมินประสิทธิผลของกระบวนการตรวจสอบความสมดุล รวมถึงขาดหลักฐานการนำผลไปปรับปรุงกระบวนการ"],"results":["ระดับ 1 (ผ่านเกณฑ์): นำ SC, SA, CC มาเป็นฐานในการกำหนด SO ได้ครบถ้วน","ระดับ 2 (ผ่านเกณฑ์): นำส่งตารางแสดงความเชื่อมโยงระหว่าง SO กับประเด็นที่สำคัญ (14 ปัจจัย) ได้อย่างครบถ้วน","ระดับ 3 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): กทท. ส่งตารางเชื่อมโยงและชี้แจงที่มาที่ไป แต่ผู้ประเมินมองว่าหลักฐานยังไม่สามารถ \"อธิบาย\" ความสมดุลผ่านยุทธศาสตร์และกลยุทธ์ได้อย่างชัดเจน","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. ส่งหลักฐานการประชุม Alignment Strategy และแนบแผนแม่บทต่างๆ (HR, Risk, นวัตกรรม ฯลฯ) แต่ผู้ประเมินยังมองว่าขาดการอธิบายความเชื่อมโยงด้านยุทธศาสตร์ของแต่ละแผนลูกที่มารองรับความสมดุลอย่างเป็นรูปธรรม","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการ"],"tris":["\"กทท. ยังไม่สามารถอธิบายได้ด้วยการกำหนดยุทธศาสตร์ กลยุทธ์ ตัวชี้วัดและค่าเป้าหมาย ที่มีความสมดุลและสอดคล้องกับวัตถุประสงค์เชิงยุทธศาสตร์และเป้าประสงค์\" (อธิบายเพิ่มเติม: TRIS มองว่า กทท. มีแค่ \"ตารางจับคู่\" (Mapping) แต่ไม่มี \"คำอธิบายเชิงตรรกะ\" ว่าทำไมกลยุทธ์นี้ถึงสร้างความสมดุลให้องค์กรได้จริง)"],"suggest":["จัดทำบทวิเคราะห์ความสมดุล (Balancing Analysis): ฝ่ายกลยุทธ์ต้องเขียนคำอธิบายประกอบตาราง Mapping ให้ชัดเจน โดยอิงตามเกณฑ์ SE-AM ว่า กลยุทธ์และตัวชี้วัดของ กทท. มีความสมดุลใน 3 มิติหลัก ได้แก่ 1) สมดุลระยะสั้น-ระยะยาว 2) สมดุลระหว่างกลุ่มผู้มีส่วนได้ส่วนเสีย และ 3) การเพิ่มความสามารถในการปรับตัวขององค์กร","เชื่อมโยงกับ Balanced Scorecard (BSC): นำหลักการ BSC มาใช้อธิบายความสมดุลว่า SO ของ กทท. ครอบคลุมทั้งมิติการเงิน, ลูกค้า, กระบวนการภายใน, และการเรียนรู้พัฒนา อย่างไร","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): เริ่มตั้งตัวชี้วัดการทำงานของฝ่ายกลยุทธ์เอง เช่น \"ร้อยละของความครอบคลุมประเด็นยุทธศาสตร์ในแผนแม่บท\" เพื่อนำไปประเมินและปรับปรุงคู่มือ SIPOC 4"],"docs":["รายงานการวิเคราะห์ความสมดุลเชิงยุทธศาสตร์ (Balancing Analysis Report): เอกสารที่อธิบายว่ายุทธศาสตร์ของ กทท. รักษาสมดุลระหว่างระยะสั้น-ยาว และตอบโจทย์ผู้มีส่วนได้ส่วนเสียครบทุกกลุ่มได้อย่างไร (ทำเป็น Diagram จะดีมาก)","ตารางเมทริกซ์เชื่อมโยงแผนแม่-แผนลูก (ฉบับอธิบายความสมดุล): ที่ระบุชัดเจนว่า แผนบริหารความเสี่ยง และ แผนนวัตกรรม เข้ามาช่วยอุดช่องโหว่ความท้าทาย (SC) อย่างไร (เพื่อยืนยันระดับ 4)","คู่มือ/แนวทางการประเมินประสิทธิผลกระบวนการตรวจสอบความสมดุล: พร้อมระบุผลการประเมินและรายงานการประชุมปรับปรุงกระบวนการ (เพื่อยืนยันระดับ 5)"],"bestprac":["การใช้ Strategy Map ในการอธิบายความสมดุล: คู่เทียบอย่าง กทพ. มีความโดดเด่นในการทำ แผนที่ยุทธศาสตร์ (Strategy Map) ที่แสดงให้เห็นความสัมพันธ์เชิงเหตุและผล (Cause and Effect) ของกลยุทธ์ต่างๆ ภายใต้มุมมอง Balanced Scorecard (BSC)","กทท. ควรนำ Strategy Map มาเป็นเครื่องมือหลักในการตอบคำถามข้อ 3.2 นี้ โดยลากเส้นชี้ให้ผู้ประเมินเห็นเลยว่า กลยุทธ์ A (ด้านนวัตกรรม) ไปตอบโจทย์ความท้าทายระยะยาว (SC) ในขณะที่ กลยุทธ์ B (ด้านปรับปรุงบริการ) ไปตอบสนองความคาดหวังของลูกค้าในระยะสั้น (SA) ซึ่งภาพนี้จะตอบโจทย์คำว่า \"ความสมดุล (Balance)\" ตามที่ TRIS ต้องการได้อย่างสมบูรณ์แบบครั"],"minReqs":{"1":["การนำความท้าทายเชิงยุทธศาสตร์ (SC) ความได้เปรียบเชิงยุทธศาสตร์ (SA) และความสามารถพิเศษขององค์กร (CC) มากำหนดวัตถุประสงค์เชิงยุทธศาสตร์ (SO)"],"2":["มีการแสดงความเชื่อมโยงระหว่างวัตถุประสงค์เชิงยุทธศาสตร์ (SO) กับประเด็นที่สำคัญครบถ้วน"],"3":["ความเชื่อมโยงดังกล่าว สามารถอธิบายได้ด้วยการกำหนดยุทธศาสตร์ (Strategy) และกลยุทธ์ (Tactic) เพื่อแสดงถึงความสัมพันธ์นั้น"],"4":["ความเชื่อมโยงดังกล่าว สามารถอธิบายได้ถึงแผนแม่บทที่เกี่ยวข้อง โดยต้องมีการพิจารณายุทธศาสตร์ในแต่ละแผนแม่บทที่เกี่ยวข้อง รวมถึงแผนการบริหารความเสี่ยง แผนงานด้านนวัตกรรม และแผนการบริหารปัจจัยขับเคลื่อนมูลค่า"],"5":["มีการวัดถึงประสิทธิผลของกระบวนการ และนำมาทบทวนรวมถึงปรับปรุงกระบวนการ"]},"subComps":{"3":["กับดักความสมดุลที่หายไป (The Imbalance Trap): คำว่า \"ความสมดุล\" ในชื่อหัวข้อ หมายถึงการใช้เครื่องมืออย่าง Balanced Scorecard (BSC) หรือ Strategy Map ผู้ตรวจจะกางดูว่ายุทธศาสตร์ขององค์กรให้น้ำหนักไปที่เรื่องใดเรื่องหนึ่งมากเกินไปหรือไม่ เช่น เน้นหาเงิน (Financial) จนลืมมีกลยุทธ์ด้านการพัฒนาระบบนิเวศทางสังคม หรือการเรียนรู้ของพนักงาน หากตาราง Mapping เทน้ำหนักไปด้านเดียว จะถือว่าไม่ผ่านมิติ \"ความสมดุล\"","หยุดแค่ระดับยุทธศาสตร์ แต่ไปไม่ถึงกลยุทธ์ (Missing the Tactic): หลายองค์กรทำตารางเชื่อมโยง SO -> ยุทธศาสตร์ (Strategy) แล้วจบ แต่เกณฑ์บังคับชัดเจนว่าต้องลงลึกถึง \"กลยุทธ์ (Tactic)\" หรือวิธีการ/แผนงานที่จะใช้ขับเคลื่อนยุทธศาสตร์นั้นด้วย"],"4":["กับดัก \"ลืมเชื่อม 3 แผนบังคับ\" (The Mandatory 3 Plans Trap): ปกติเวลาองค์กรเชื่อมโยงแผน มักจะโยงไปที่ IT หรือ HR แต่ในเกณฑ์ Level 4 ของข้อ 3.2 บังคับเขียนไว้ตรงๆ เลยว่า \"รวมถึงแผนการบริหารความเสี่ยง แผนงานด้านนวัตกรรม และแผนการบริหารปัจจัยขับเคลื่อนมูลค่า\" หากในตาราง Alignment Matrix ของ กทท. ลืมใส่คอลัมน์ของ 3 แผนนี้ หรือจับคู่ไม่ได้ คะแนนระดับ 4 จะกลายเป็นทศนิยมทันที","กับดักเป้าหมายการสร้างมูลค่าลอยๆ (Vague Value Creation): จาก Feedback ของ กทพ. ผู้ตรวจเน้นย้ำว่า การเชื่อมโยงเรื่องปัจจัยขับเคลื่อนมูลค่า (Value Creation / Value Enhancement) จะต้อง \"มีการก าหนดเป้าหมายการสร้างมูลค่าเพิ่มที่ชัดเจน สามารถน ามาวัดผลได้ เช่น รายได้ที่เพิ่มขึ้นจากโอกาสและจ านวนค่าใช้จ่ายที่ลดลง เป็นต้น\" ดังนั้นการเชื่อมโยงมาที่แผนสร้างมูลค่า ต้องมีตัวเลข KPI กำกับด้วยเสมอ"]},"scopeNote":"ขอบเขตการประเมินในข้อนี้ทำหน้าที่ 2 ส่วน คือ 1. การตรวจเช็ครากฐาน (Backward Check): วัตถุประสงค์เชิงยุทธศาสตร์ (SO) ต้องถูกสร้างขึ้นมาเพื่ออุดจุดอ่อน (SC) ดันจุดแข็ง (SA) และต่อยอดความเก่ง (CC) ไม่ใช่นึกจะตั้งก็ตั้งขึ้นมาลอยๆ และ 2. การตรวจเช็คการส่งต่อ (Forward Check): SO ต้องถูกแปลงสภาพไปเป็น ยุทธศาสตร์ (Strategy) และ กลยุทธ์ (Tactic) ที่มี \"ความสมดุล\" ในทุกมิติ (เช่น ใช้หลักการ Balanced Scorecard: BSC) และต้องบังคับส่งต่อให้แผนแม่บท 3 ด้านหลัก (ความเสี่ยง, นวัตกรรม, การสร้างมูลค่า) รับลูกไปทำต่อให้ได้","actions":["จัดทำบทวิเคราะห์ความสมดุล (Balancing Analysis): ฝ่ายกลยุทธ์ต้องเขียนคำอธิบายประกอบตาราง Mapping ให้ชัดเจน โดยอิงตามเกณฑ์ SE-AM ว่า กลยุทธ์และตัวชี้วัดของ กทท. มีความสมดุลใน 3 มิติหลัก ได้แก่ 1) สมดุลระยะสั้น-ระยะยาว 2) สมดุลระหว่างกลุ่มผู้มีส่วนได้ส่วนเสีย และ 3) การเพิ่มความสามารถในการปรับตัวขององค์กร","เชื่อมโยงกับ Balanced Scorecard (BSC): นำหลักการ BSC มาใช้อธิบายความสมดุลว่า SO ของ กทท. ครอบคลุมทั้งมิติการเงิน, ลูกค้า, กระบวนการภายใน, และการเรียนรู้พัฒนา อย่างไร","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): เริ่มตั้งตัวชี้วัดการทำงานของฝ่ายกลยุทธ์เอง เช่น \"ร้อยละของความครอบคลุมประเด็นยุทธศาสตร์ในแผนแม่บท\" เพื่อนำไปประเมินและปรับปรุงคู่มือ SIPOC 4"],"dimLevels":["มีหลักฐาน (เช่น ตาราง Mapping) ที่แสดงว่า \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" แต่ละข้อ ถูกดึงและวิเคราะห์มาจาก ความท้าทาย (SC), ความได้เปรียบ (SA), และความสามารถพิเศษ (CC) ขององค์กร","มิติความครบถ้วน: มีตารางความสัมพันธ์เชิงยุทธศาสตร์ (Strategic Alignment Matrix) ที่จับคู่ SO กับประเด็นสำคัญทั้งหมดขององค์กร (เช่น SWOT, Positioning, SC/SA/CC) อย่างครบถ้วนทุกข้อ","มิติการกำหนดยุทธศาสตร์: มีการเชื่อมโยง SO ลงไปสู่การกำหนดเป็น \"ยุทธศาสตร์ (Strategy)\" อย่างชัดเจน / มิติการกำหนดกลยุทธ์: ภายใต้ยุทธศาสตร์ มีการแตกย่อยลงไปเป็น \"กลยุทธ์ (Tactic / Initiative)\" เพื่อรองรับยุทธศาสตร์นั้นๆ อย่างเป็นรูปธรรม / มิติความสมดุล (Balance): ยุทธศาสตร์และกลยุทธ์ที่กำหนดขึ้น ครอบคลุมความสมดุลในมุมมองต่างๆ ไม่ใช่มองแค่มิติการเงิน แต่พิจารณามิติด้านกระบวนการภายใน, การเรียนรู้และพัฒนา (HR), และผู้มีส่วนได้ส่วนเสีย","มิติบูรณาการแผนลูก: มีตารางอธิบายความเชื่อมโยงของ SO ลงสู่ยุทธศาสตร์ของแผนแม่บท (Enablers) ต่างๆ / มิติบังคับ 3 แผน: ในการเชื่อมโยงแผนแม่บท ต้องปรากฏหลักฐานการเชื่อมโยงกับ 3 แผนงานบังคับ ได้แก่ (1) แผนการบริหารความเสี่ยง (RM) (2) แผนงานด้านนวัตกรรม (IM) และ (3) แผนการบริหารปัจจัยขับเคลื่อนมูลค่า (Value Creation/Enhancement)","มีแนวทางการประเมินประสิทธิผลของกระบวนการตรวจสอบความสมดุลและสอดคล้อง / มีผลลัพธ์ของการประเมิน (เช่น ตรวจพบว่า SO บางข้อไม่มีกลยุทธ์รองรับ หรือขาดความสมดุลในมิติพนักงาน) / นำผลประเมินมาทบทวนและปรับปรุงกระบวนการจัดทำยุทธศาสตร์ในปีถัดไป"]},{"id":"3.3","grp":"3","gname":"การกำหนดวัตถุประสงค์เชิงยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การออกแบบระบบงาน (Work Systems) เพื่อสนับสนุนให้องค์กรบรรลุ Strategic Objectives","w":2.5,"s68":1,"status":"ยังไม่เริ่ม","statusNote":"","scope":"ขอบเขตการประเมินในข้อนี้ มุ่งเน้นไปที่การตอบคำถามว่า \"เมื่อเป้าหมายเปลี่ยน องค์กรได้เปลี่ยนวิธีทำงานและโครงสร้างรองรับแล้วหรือยัง?\" รัฐวิสาหกิจจะต้องทบทวนกระบวนการทำงานและกำหนดข้อตกลงระดับบริการ (SLA) ใหม่ และที่สำคัญที่สุดคือ หากมีแผนงาน/โครงการใหม่ (New Initiatives) เกิดขึ้น จะต้องมีเจ้าภาพรับผิดชอบที่ชัดเจน และต้องส่งต่อข้อมูลนี้ให้ฝ่าย HR นำไปปรับโครงสร้างองค์กรหรือเกลี่ยอัตรากำลังให้สอดรับกัน","levelSumm":["มีหลักฐาน (เช่น คู่มือ, รายงานการประชุม, SIPOC) แสดงการกำหนดขั้นตอนและเริ่มกระบวนการทบทวนระบบงานทั้งหมดขององค์กร เพื่อรองรับเป้าหมายยุทธศาสตร์ (SO)","มิติการถ่ายทอด: มีตาราง/เอกสารแสดงการถ่ายทอดจาก \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" ลงสู่ระดับยุทธศาสตร์ กลยุทธ์ และแผนงานอย่างครบถ้วน","มิติกระบวนการและ SLA: มีหลักฐานการทบทวนระบบงาน กระบวนการทำงาน และ \"ข้อตกลงระดับการให้บริการ (SLA) ในทุกกระบวนการ\"","มีหลักฐานการส่งต่อผลการทบทวนระบบงานและโครงสร้างองค์กร ไปบูรณาการร่วมกับ \"แผนแม่บททรัพยากรบุคคล (HCM)\" หรือแผนการทบทวนโครงสร้างองค์กร","มีแนวทางการประเมินประสิทธิผลของกระบวนการทบทวนระบบงาน"],"good":["มีการระบุขั้นตอนการทำงานไว้อย่างชัดเจน ภายใต้ SIPOC 5 (การออกแบบระบบงาน) ซึ่งเป็นส่วนหนึ่งของกระบวนการจัดทำแผนยุทธศาสตร์ (SIPOC 4)","มีการทบทวน/ออกแบบระบบงาน (Work System) และกระบวนการทำงาน (Work Process) รวมถึงพิจารณาข้อกำหนดที่มุ่งเน้นการตอบสนองความต้องการของลูกค้าและผู้มีส่วนได้ส่วนเสีย","มีการถ่ายทอดวัตถุประสงค์เชิงยุทธศาสตร์ (SO) ลงสู่ระดับยุทธศาสตร์ กลยุทธ์ และแผนงาน โดยระบุหน่วยงานและผู้รับผิดชอบในแต่ละแผนงานได้อย่างชัดเจน"],"gaps":["ความเชื่อมโยงสู่โครงสร้างองค์กรอนาคต (EA To-be): การทบทวนระบบงาน กระบวนการทำงาน และข้อตกลงระดับการให้บริการ (SLA) ยังไม่สามารถแสดงความเชื่อมโยงกับการวิเคราะห์สถาปัตยกรรมองค์กรในอนาคต (EA - To - be) ได้อย่างเป็นรูปธรรม","ความชัดเจนในโครงการใหม่ (New Initiatives): ยังขาดการทบทวนและระบุอำนาจหน้าที่ (Roles & Responsibilities) รวมถึงความรับผิดชอบของฝ่ายงานที่ต้องออกมารองรับโครงการที่เป็น \"ความคิดริเริ่มใหม่ (New Initiatives)\" ให้มีความชัดเจน","การประเมินกระบวนการ (ระดับ 5): ยังขาดแนวทาง ผลลัพธ์ และหลักฐานการนำผลประเมินไปปรับปรุงกระบวนการออกแบบระบบงาน"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนการทบทวนระบบงานทั้งหมดขององค์กรผ่าน SIPOC 5","ระดับ 2 (ผ่านเกณฑ์): สามารถถ่ายทอดวัตถุประสงค์เชิงยุทธศาสตร์ (SO) สู่ระดับยุทธศาสตร์และแผนงาน พร้อมระบุผู้รับผิดชอบได้ชัดเจน","ระดับ 3 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): แม้ กทท. จะมีการทบทวนกระบวนการและกำหนด SLA พร้อมระบุหน่วยงานรับผิดชอบ (KPI in Process) ส่งให้ฝ่ายที่เกี่ยวข้อง (เช่น ฝบ., ฝทส., สสค.) แล้ว แต่ผู้ประเมินมองว่ายังขาดการเชื่อมโยงกับ EA-To-be และโครงสร้างรองรับ New Initiatives ยังไม่ชัดเจน","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. มีการส่งข้อมูลให้ฝ่ายบริหารทรัพยากรบุคคล (ฝบ.) เพื่อพิจารณาโครงสร้างองค์กรใหม่ (ปี 68-69) แล้ว แต่เนื่องจากระดับ 3 ยังไม่สมบูรณ์ จึงทำให้ระดับ 4 ไม่ผ่านเกณฑ์ตามไปด้วย","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการส่งหลักฐานการประเมินประสิทธิผลของกระบวนการออกแบบระบบงาน"],"tris":["กทท. \"ยังไม่สามารถแสดงความเชื่อมโยงของการทบทวนระบบงาน กระบวนการทำงาน และ SLA ในทุกกระบวนการ เพื่อสนับสนุนต่อการบรรลุวัตถุประสงค์เชิงยุทธศาสตร์ กับการวิเคราะห์ EA - to - be และการทบทวนโครงสร้างองค์กรและฝ่ายงานที่รองรับวัตถุประสงค์เชิงยุทธศาสตร์ระดับองค์กรได้อย่างชัดเจน\" รวมทั้งยังมีข้อเสนอแนะเพิ่มเติมว่าต้องทบทวนระบบงานเพื่อสนับสนุนการบรรลุ SO ที่กำหนดไว้ให้เป็นรูปธรรมยิ่งขึ้น","เนื่องจากไม่มีรัฐวิสาหกิจใดในกลุ่มคู่เทียบทำข้อนี้ได้สมบูรณ์ กทท. สามารถ \"เป็นผู้นำและสร้าง Best Practice ของอุตสาหกรรม\" ได้โดยการเป็นองค์กรแรกที่ออกเอกสาร \"ขอบเขตอำนาจหน้าที่และการออกแบบระบบงาน (Work System Design) สำหรับโครงการ New Initiatives\" ที่เชื่อมโยงกับ EA (Enterprise Architecture) อย่างเป็นทางการ หากทำเอกสารชิ้นนี้สำเร็จ คะแนนของ กทท. จะทะลุขึ้นไปเหนือคู่เทียบทั้งหมดทันที"],"suggest":["ทำผังเชื่อมโยง EA To-Be กับ ระบบงาน (Work Systems Alignment): ฝ่ายกลยุทธ์ (ฝก.) ต้องทำงานร่วมกับฝ่าย IT (ฝทส.) และฝ่าย HR (ฝบ.) นำภาพโครงสร้างสถาปัตยกรรมองค์กรในอนาคต (EA To-Be) มากาง และจับคู่ (Mapping) ให้เห็นว่าระบบงาน (Work System) กระบวนการ (Work Process) และ SLA ขององค์กร ถูกปรับปรุงให้สอดคล้องกับภาพอนาคตนี้อย่างไร","ตั้งโครงสร้างทีมงานสำหรับ \"New Initiatives\" โดยเฉพาะ: หาก กทท. มีโครงการใหญ่ที่เป็นของใหม่ (เช่น การพัฒนาท่าเรือบก, โครงการ Smart Port) ให้จัดทำคำสั่งแต่งตั้ง ระบุโครงสร้างทีมงาน และอำนาจหน้าที่ (Roles & Responsibilities) ของทีมงานโครงการใหม่เหล่านี้แยกออกมาให้ชัดเจน เพื่อตอบโจทย์เกณฑ์ระดับ 3 แบบตรงประเด็น","กำหนด KPI ประเมินกระบวนการออกแบบระบบงาน (SIPOC 5): เริ่มต้นเก็บข้อมูลเชิงสถิติของฝ่ายกลยุทธ์ เพื่อมุ่งสู่ระดับ 5 เช่น ความรวดเร็วในการสื่อสารระบบงานให้แผนลูก หรือร้อยละความสอดคล้องของระบบงานกับยุทธศาสตร์"],"docs":["รายงานสรุปความเชื่อมโยงระบบงานกับ EA To-Be (Work Systems to EA Alignment Report): ที่อธิบายว่าการปรับปรุงกระบวนการและ SLA สอดคล้องกับภาพสถาปัตยกรรมองค์กรในอนาคตอย่างไร","คำสั่ง/โครงสร้างองค์กร และขอบเขตอำนาจหน้าที่ (Roles & Responsibilities) สำหรับโครงการใหม่ (New Initiatives): เพื่อเป็นหลักฐานเชิงประจักษ์ยืนยันในระดับ 3","แนวทางการประเมินประสิทธิผล SIPOC 5 และรายงานการปรับปรุงกระบวนการ: พร้อมเปรียบเทียบภาพ Before/After (เพื่อมุ่งสู่ระดับ 5)"],"bestprac":["สถานการณ์ของคู่เทียบ: เป็นที่น่าสนใจว่าทั้ง กทพ. และ รฟม. ล้วนไปติดหล่ม (Gap) ในหัวข้อเดียวกันเป๊ะกับ กทท. โดย TRIS ได้ให้ Feedback กับ รฟม. ว่า \"ควรมีการทบทวนที่มุ่งเน้นระบบงาน กระบวนการทำงาน และ SLA ทุกกระบวนการ... โดยเฉพาะอย่างยิ่ง แผนงานและโครงการที่เกิดขึ้นใหม่ (New Initiatives) ให้ครอบคลุม\" และให้ Feedback กับ กทพ. ด้วยประโยคเดียวกัน"],"minReqs":{"1":["เริ่มมีการทบทวนระบบงานทั้งหมดขององค์กร เพื่อแสดงความมั่นใจถึงการบรรลุวัตถุประสงค์เชิงยุทธศาสตร์"],"2":["ทุกวัตถุประสงค์เชิงยุทธศาสตร์ มีการถ่ายทอดสู่ระดับยุทธศาสตร์ กลยุทธ์และแผนงาน และสามารถแสดงให้เห็นถึงผู้รับผิดชอบในแต่ละแผนงานที่ชัดเจน"],"3":["มีการทบทวนระบบงาน กระบวนการทำงาน รวมถึง (Service Level Agreements : SLA) ในทุกกระบวนการ เพื่อสนับสนุนต่อการบรรลุวัตถุประสงค์เชิงยุทธศาสตร์ รวมถึงทบทวนโครงสร้างองค์กร และฝ่ายงานที่รองรับวัตถุประสงค์เชิงยุทธศาสตร์ระดับองค์กร โดยเฉพาะ โครงการใหม่ (New Initiatives) ที่ต้องมีการระบุอำนาจหน้าที่ และความรับผิดชอบของฝ่ายงานให้มีความชัดเจน"],"4":["มีการบูรณาการการทบทวน โครงสร้างองค์กรและฝ่ายงานที่รองรับวัตถุประสงค์เชิงยุทธศาสตร์ กับแผนแม่บททรัพยากรบุคคล (HCM) หรือแผนการทบทวนโครงสร้างขององค์กร"],"5":["มีการวัดถึงประสิทธิผลของกระบวนการ และนำมาทบทวนรวมถึงปรับปรุงกระบวนการ"]},"subComps":{"3":["กับดัก \"ลืมเชื่อมโยง New Initiatives\" (The Missing New Initiatives Trap): จาก Feedback Report ของ รฟม. ผู้ตรวจคอมเมนต์หักคะแนนว่า รฟม. ควรวิเคราะห์กระบวนการทำงาน SLA และ New Initiatives ให้ครอบคลุม หลายองค์กรมักส่งแค่ตาราง SLA ปกติ แต่ลืมทำเอกสารสรุปว่า \"จากเป้าหมายยุทธศาสตร์ใหม่ องค์กรมีแผนงานใหม่ (New Initiatives) อะไรบ้าง และใครเป็นเจ้าภาพ\" หากไม่มีหน้านี้ คะแนน Level 3 จะหล่นทันที"],"4":["การส่งมอบข้อมูลความสามารถพิเศษ (CCC/FCC) ให้แผนแม่บท : จากเอกสารสรุป FD ผู้ตรวจแนะนำว่า นอกจากการส่งโครงสร้างให้ HR แล้ว การเชื่อมโยงความสามารถพิเศษ (CCC ในปัจจุบัน และ FCC ในอนาคต) ที่วิเคราะห์ไว้ตั้งแต่ข้อ 1.3 ก็ต้องถูกส่งต่อมาบูรณาการในข้อ 3.3 และส่งให้แผนแม่บทที่เกี่ยวข้องรับไปวางระบบงานด้วย","สูตรโกง \"การตั้งคณะทำงานร่วม\" (The Joint Taskforce): จากเอกสารสรุป Feedback Day ของ กทท. ผู้ตรวจได้ให้ลายแทงไว้ชัดเจนว่า หากองค์กรไม่มีหน่วยงานรับผิดชอบด้านการปรับปรุงกระบวนการทำงานโดยตรง สามารถยกระดับคะแนนหัวข้อ 3.3 ได้โดยการจัดตั้ง \"คณะทำงานออกแบบระบบงาน\" ซึ่งต้องประกอบด้วย 4 ทีมหลัก คือ 1. ทีม SP (วางทิศทาง), 2. Process Owners (เจ้าของกระบวนการ), 3. ทีม IT/DT (วางภาพระบบงาน To-Be), และ 4. ทีม HR (วิเคราะห์กำลังคนและทักษะ) การมีคำสั่งแต่งตั้งคณะทำงานลักษณะนี้แนบไป จะปิดรอยรั่วเรื่องความน่าเชื่อถือของกระบวนการได้ทันที"]},"scopeNote":"ขอบเขตการประเมินในข้อนี้ มุ่งเน้นไปที่การตอบคำถามว่า \"เมื่อเป้าหมายเปลี่ยน องค์กรได้เปลี่ยนวิธีทำงานและโครงสร้างรองรับแล้วหรือยัง?\" รัฐวิสาหกิจจะต้องทบทวนกระบวนการทำงานและกำหนดข้อตกลงระดับบริการ (SLA) ใหม่ และที่สำคัญที่สุดคือ หากมีแผนงาน/โครงการใหม่ (New Initiatives) เกิดขึ้น จะต้องมีเจ้าภาพรับผิดชอบที่ชัดเจน และต้องส่งต่อข้อมูลนี้ให้ฝ่าย HR นำไปปรับโครงสร้างองค์กรหรือเกลี่ยอัตรากำลังให้สอดรับกัน","actions":["ทำผังเชื่อมโยง EA To-Be กับ ระบบงาน (Work Systems Alignment): ฝ่ายกลยุทธ์ (ฝก.) ต้องทำงานร่วมกับฝ่าย IT (ฝทส.) และฝ่าย HR (ฝบ.) นำภาพโครงสร้างสถาปัตยกรรมองค์กรในอนาคต (EA To-Be) มากาง และจับคู่ (Mapping) ให้เห็นว่าระบบงาน (Work System) กระบวนการ (Work Process) และ SLA ขององค์กร ถูกปรับปรุงให้สอดคล้องกับภาพอนาคตนี้อย่างไร","ตั้งโครงสร้างทีมงานสำหรับ \"New Initiatives\" โดยเฉพาะ: หาก กทท. มีโครงการใหญ่ที่เป็นของใหม่ (เช่น การพัฒนาท่าเรือบก, โครงการ Smart Port) ให้จัดทำคำสั่งแต่งตั้ง ระบุโครงสร้างทีมงาน และอำนาจหน้าที่ (Roles & Responsibilities) ของทีมงานโครงการใหม่เหล่านี้แยกออกมาให้ชัดเจน เพื่อตอบโจทย์เกณฑ์ระดับ 3 แบบตรงประเด็น","กำหนด KPI ประเมินกระบวนการออกแบบระบบงาน (SIPOC 5): เริ่มต้นเก็บข้อมูลเชิงสถิติของฝ่ายกลยุทธ์ เพื่อมุ่งสู่ระดับ 5 เช่น ความรวดเร็วในการสื่อสารระบบงานให้แผนลูก หรือร้อยละความสอดคล้องของระบบงานกับยุทธศาสตร์"],"dimLevels":["มีหลักฐาน (เช่น คู่มือ, รายงานการประชุม, SIPOC) แสดงการกำหนดขั้นตอนและเริ่มกระบวนการทบทวนระบบงานทั้งหมดขององค์กร เพื่อรองรับเป้าหมายยุทธศาสตร์ (SO)","มิติการถ่ายทอด: มีตาราง/เอกสารแสดงการถ่ายทอดจาก \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" ลงสู่ระดับยุทธศาสตร์ กลยุทธ์ และแผนงานอย่างครบถ้วน / มิติผู้รับผิดชอบ: ทุกแผนงาน/โครงการที่ถ่ายทอดลงมา มีการระบุ \"หน่วยงาน/ผู้รับผิดชอบ\" กำกับไว้อย่างชัดเจน","มิติกระบวนการและ SLA: มีหลักฐานการทบทวนระบบงาน กระบวนการทำงาน และ \"ข้อตกลงระดับการให้บริการ (SLA) ในทุกกระบวนการ\" / มิติโครงสร้างและ New Initiatives: มีการทบทวนโครงสร้างองค์กร/ฝ่ายงาน และมีการระบุอำนาจหน้าที่และความรับผิดชอบอย่างชัดเจน โดยเฉพาะสำหรับ \"โครงการใหม่ (New Initiatives)\"","มีหลักฐานการส่งต่อผลการทบทวนระบบงานและโครงสร้างองค์กร ไปบูรณาการร่วมกับ \"แผนแม่บททรัพยากรบุคคล (HCM)\" หรือแผนการทบทวนโครงสร้างองค์กร / แผน HCM มีการรับลูกไปดำเนินการต่อ เช่น นำไปวิเคราะห์อัตรากำลังใหม่ หรือบรรจุเป็นโครงการออกแบบโครงสร้างองค์กรใหม่ (Org Design)","มีแนวทางการประเมินประสิทธิผลของกระบวนการทบทวนระบบงาน / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ / มีหลักฐานแสดงการนำผลประเมินไปใช้ปรับปรุงกระบวนการออกแบบระบบงานในปีถัดไป"]},{"id":"4.1","grp":"4","gname":"การกำหนดยุทธศาสตร์/กลยุทธ์","gw":10,"gs68":2,"name":"การกำหนดยุทธศาสตร์ระดับองค์กร","w":5,"s68":2,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นการสร้าง \"แผนที่ยุทธศาสตร์ (Strategy Map)\" ระดับองค์กร (Policy Level Strategy) เพื่อจัดลำดับความสำคัญในการดำเนินงานและจัดสรรทรัพยากร โดยผู้ตรวจจะเพ่งเล็งว่า กลยุทธ์แต่ละข้อที่สร้างขึ้นมานั้น มีการใช้ \"ข้อมูลคู่เทียบ\" มายืนยันความได้เปรียบหรือไม่ และการวาด Strategy Map นั้นสามารถลากเส้นเชื่อมโยงจากชั้นล่างสุด (กลยุทธ์) ทะลุขึ้นไปจนถึงยอดสุด (วิสัยทัศน์องค์กร) ได้อย่างสมบูรณ์แบบไร้รอยขาดตอนหรือไม่","levelSumm":["มีคู่มือ/กระบวนการกำหนดยุทธศาสตร์และกลยุทธ์องค์กร (เช่น SIPOC)","มีตารางแสดงการกำหนดยุทธศาสตร์ (Strategy) และกลยุทธ์ (Tactic) อย่างเป็นรูปธรรม","มีการเชื่อมโยงยุทธศาสตร์/กลยุทธ์ เข้ากับ \"แผนงานที่สำคัญ (Key Initiatives)\" อย่างชัดเจน","มิติการถ่ายทอดแบบ Deep Cascade: มีการส่งต่อทิศทางไปยังแผนแม่บทอื่น โดยแผนแม่บทลูกต้องรับลูกไปกำหนดเป็น \"ยุทธศาสตร์ของแผนลูก + กลยุทธ์ของแผนลูก + แผนงานสำคัญของแผนลูก\" (รับไปให้ครบทั้ง 3 องค์ประกอบ)","มีแนวทางการประเมินประสิทธิผลกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์"],"good":["มีการกำหนดกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์ขององค์กรไว้อย่างชัดเจน ภายใต้ SIPOC 4 (ขั้นตอนที่ 13)","มีการนำผลการวิเคราะห์สภาพแวดล้อม (ความได้เปรียบเชิงยุทธศาสตร์, ความท้าทายเชิงยุทธศาสตร์, ความสามารถพิเศษขององค์กร) และข้อมูลคู่เทียบ (Benchmark) มาเป็นข้อมูลสำคัญประกอบการพิจารณากำหนดวัตถุประสงค์เชิงยุทธศาสตร์ เป้าประสงค์ ยุทธศาสตร์ และกลยุทธ์","มีการจัดทำแผนที่ยุทธศาสตร์ (Strategy Map) ที่ครอบคลุมมุมมองตามหลัก Balanced Scorecard (BSC) ทั้ง 4 ด้าน (การเงิน/ไม่ใช่การเงิน, ลูกค้า, กระบวนการภายใน, การเรียนรู้และพัฒนา)","มีการจัดทำตารางแสดงความเชื่อมโยงยุทธศาสตร์ กทท. ลงสู่การปฏิบัติ (Cascade) โดยแบ่งระดับเป้าหมายชัดเจน ทั้งระดับวิสัยทัศน์/ตำแหน่งเชิงยุทธศาสตร์, ระดับวัตถุประสงค์เชิงยุทธศาสตร์, และระดับกลยุทธ์"],"gaps":["การเชื่อมโยงแผนงานสำคัญสู่แผนแม่บท (ระดับ 4): แม้จะมีการเชื่อมโยงยุทธศาสตร์แล้ว แต่ยังขาดการแสดงความเชื่อมโยงในระดับ \"แผนงานที่สำคัญ (Key Initiatives)\" ว่าแผนงานภายใต้กลยุทธ์ขององค์กรนั้น ถูกถ่ายทอดลงไปเป็นแผนงานของแผนแม่บทใดบ้างอย่างครอบคลุมและครบถ้วน","การประเมินประสิทธิผลกระบวนการ (ระดับ 5): ขาดแนวทาง ตัวชี้วัด ผลลัพธ์ และหลักฐานการนำผลการประเมินกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์ไปปรับปรุงให้ดีขึ้น"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนกระบวนการกำหนดยุทธศาสตร์อย่างชัดเจนในคู่มือ (SIPOC 4)","ระดับ 2 (ผ่านเกณฑ์): นำข้อมูล Strategic Positioning, ข้อมูลคู่เทียบ (Benchmark) และวัตถุประสงค์เชิงยุทธศาสตร์มากำหนดกลยุทธ์ พร้อมจัดทำตาราง Cascade","ระดับ 3 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): แม้จะมีการจัดทำ Strategy Map เพื่อแสดงความเชื่อมโยงของกลยุทธ์ไปสู่วิสัยทัศน์แล้ว แต่ผู้ประเมินยังมองว่าขาดความชัดเจนในการบูรณาการยุทธศาสตร์เข้ากับ \"แผนงานที่สำคัญ\" ในระดับปฏิบัติ","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. ส่งตารางเชื่อมโยงยุทธศาสตร์ระหว่างแผนแม่-แผนลูกแล้ว แต่ในมุมมองผู้ประเมิน ข้อมูลยังไม่สะท้อนการถ่ายทอด \"แผนงานที่สำคัญ (Key Initiatives)\" ลงสู่แผนแม่บทอย่างครบถ้วน","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานการประเมินประสิทธิผลของกระบวนการ"],"tris":["ช่องว่างสำคัญที่ทำให้ กทท. ได้เพียง 2.0000 คะแนน ว่า กทท. \"ควรมีการเชื่อมโยงกระบวนการกำหนดยุทธศาสตร์ กลยุทธ์ พร้อมแผนงานที่สำคัญขององค์กรกับแต่ละแผนแม่บทได้อย่างครอบคลุมและครบถ้วน เพื่อให้มั่นใจว่าจะสามารถบรรลุตัวชี้วัดในระดับยุทธศาสตร์ระดับองค์กร\" ซึ่งหมายความว่า แค่ตารางจับคู่ยุทธศาสตร์ยังไม่พอ ต้องจับคู่ \"แผนงาน/โครงการ\" ให้ผู้ประเมินเห็นด้วย"],"suggest":["เจาะลึก Alignment Matrix ถึงระดับ \"แผนงานหลัก\": ฝ่ายกลยุทธ์ต้องปรับปรุงตาราง Alignment ใหม่ โดยเพิ่มคอลัมน์ \"แผนงานที่สำคัญระดับองค์กร\" และลากเส้นโยงไปหา \"แผนงานที่สำคัญในแผนแม่บท\" (เช่น แผนงานพัฒนาระบบ IT ขององค์กร ต้องโยงไปหาแผนงาน A ในแผนปฏิบัติการดิจิทัลอย่างชัดเจน) เพื่อปิด Gap ในระดับ 4","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): เริ่มต้นเก็บข้อมูลประเมินกระบวนการจัดทำแผนยุทธศาสตร์ (SIPOC 4 ขั้นตอนที่ 13) เช่น ประเมินร้อยละความสอดคล้องของแผนงานองค์กรกับแผนแม่บท หรือระยะเวลาในการจัดทำแผน และนำไปปรับปรุงในปีถัดไป","หากในปี 2569 กทท. สามารถออกแบบฟอร์มตาราง (Template) ที่บังคับให้ \"ทุกกลยุทธ์องค์กร ต้องระบุแผนงานหลัก และต้องระบุเจ้าภาพ (แผนแม่บท) ที่รับแผนงานนั้นไปทำต่อ\" กทท. จะกลายเป็น Best Practice ที่ก้าวข้ามคะแนน 2.0 ไปสู่ระดับ 4.0 ได้อย่างแน่นอน"],"docs":["ตารางเมทริกซ์เชื่อมโยงแผนงานระดับองค์กรสู่แผนแม่บท (Key Initiatives Alignment Matrix): ตารางที่แสดงความสัมพันธ์แบบ 1 ต่อ 1 (หรือ 1 ต่อกลุ่ม) ระหว่าง กลยุทธ์องค์กร -> แผนงานองค์กร -> ยุทธศาสตร์แผนแม่บท -> แผนงานแผนแม่บท","แนวทางการประเมินประสิทธิผลกระบวนการกำหนดยุทธศาสตร์: พร้อมรายงานผลการประเมินกระบวนการทำงานของฝ่ายกลยุทธ์ และบันทึกการประชุมปรับปรุงกระบวนการ (เพื่อยืนยันระดับ 5)"],"bestprac":["ทั้ง กทพ. และ รฟม. ต่างก็ตกม้าตายในหัวข้อนี้และได้ข้อเสนอแนะจาก TRIS ในประโยคเดียวกันเป๊ะ คือ \"ควรมีกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์ขององค์กรให้สามารถเชื่อมโยงทั้งในระดับยุทธศาสตร์และกลยุทธ์ของแต่ละแผนแม่บท พร้อมแผนงานที่สำคัญ\""],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์ขององค์กร รวมถึงแหล่งที่มาของข้อมูล... โดยเฉพาะหากใช้เครื่องมือ เช่น Strategy Mapping ต้องแสดงแนวคิดและกระบวนการดำเนินงานที่ชัดเจน"],"2":["มีการกำหนดยุทธศาสตร์และกลยุทธ์ขององค์กร โดยต้องแสดงความสัมพันธ์กับ Strategic Positioning, วัตถุประสงค์เชิงยุทธศาสตร์ (SO) และข้อมูลคู่เทียบ เพื่อประกอบการพิจารณา"],"3":["มีการบูรณาการยุทธศาสตร์และกลยุทธ์ กับ SO และแผนงานที่สำคัญ รวมถึงต้องสามารถแสดงความเชื่อมโยงของ Strategy Map ผ่านความเชื่อมโยงของแต่ละกลยุทธ์ไปสู่ระดับวิสัยทัศน์ขององค์กรได้"],"4":["สามารถเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้อง โดยเชื่อมโยงทั้งในระดับยุทธศาสตร์และกลยุทธ์ของแต่ละแผนแม่บท พร้อมแผนงานที่สำคัญ ถ่ายทอดลงสู่ระดับแผนงานของแผนแม่บทที่เกี่ยวข้อง"],"5":["มีการวัดถึงประสิทธิผลของกระบวนการ และนำมาทบทวนรวมถึงปรับปรุงกระบวนการ"]},"subComps":{"2":["การลืมวิเคราะห์คู่เทียบในระดับกลยุทธ์ (Missing Benchmark at Strategy Level): หลายองค์กรเอาคู่เทียบไปใส่แค่ตอนตั้งเป้าหมาย (ข้อ 3.1) แต่ในข้อ 4.1 เกณฑ์บังคับว่าต้องใช้ข้อมูลคู่เทียบเป็นปัจจัยประกอบในการ \"เลือกกลยุทธ์\" ด้วย เช่น หากคู่เทียบเก่งเรื่อง IT เราจึงต้องกำหนดกลยุทธ์ด้าน Digital Transformation ขึ้นมาสู้ เป็นต้น"],"3":["กับดัก Strategy Map แหว่ง (Incomplete Map Trap): จาก Feedback Report ของ กทท. ปี 68 ผู้ตรวจระบุชัดเจนว่า \"มีการจัดทำ Strategy Map... อย่างไรก็ตาม ยังไม่สามารถแสดงความสัมพันธ์ได้ครบทุกกลยุทธ์ที่กำหนด\" หมายความว่า หากคุณเขียนบรรยายในเล่มแผนวิสาหกิจว่ามี 20 กลยุทธ์ แต่ในหน้า Strategy Map ลากเส้นใส่กล่องไว้แค่ 15 กลยุทธ์ (อีก 5 กลยุทธ์หายไปหรือไม่มีเส้นโยงไปสู่วิสัยทัศน์) คะแนน Level 3 จะถูกตัดทิ้งทันที"],"4":["การถ่ายทอดแผนลูกแบบไม่สุดทาง (Shallow Cascade Trap ): นี่คือจุดที่ กทท. โดนตัดคะแนน ผู้ตรวจคอมเมนต์ กทท. ว่าการเชื่อมโยงไปยังแผนแม่บท \"ยังไม่สามารถแสดงความเชื่อมโยงกับหัวข้ออื่น... ได้อย่างครบถ้วน\" จุดตายคือ แผนลูกมักจะรับไปแค่ \"ยุทธศาสตร์\" แต่ลืมแตกออกมาเป็น \"กลยุทธ์ และ แผนงานสำคัญ\" ในแผนของตัวเอง"]},"scopeNote":"มุ่งเน้นการสร้าง \"แผนที่ยุทธศาสตร์ (Strategy Map)\" ระดับองค์กร (Policy Level Strategy) เพื่อจัดลำดับความสำคัญในการดำเนินงานและจัดสรรทรัพยากร โดยผู้ตรวจจะเพ่งเล็งว่า กลยุทธ์แต่ละข้อที่สร้างขึ้นมานั้น มีการใช้ \"ข้อมูลคู่เทียบ\" มายืนยันความได้เปรียบหรือไม่ และการวาด Strategy Map นั้นสามารถลากเส้นเชื่อมโยงจากชั้นล่างสุด (กลยุทธ์) ทะลุขึ้นไปจนถึงยอดสุด (วิสัยทัศน์องค์กร) ได้อย่างสมบูรณ์แบบไร้รอยขาดตอนหรือไม่","actions":["เจาะลึก Alignment Matrix ถึงระดับ \"แผนงานหลัก\": ฝ่ายกลยุทธ์ต้องปรับปรุงตาราง Alignment ใหม่ โดยเพิ่มคอลัมน์ \"แผนงานที่สำคัญระดับองค์กร\" และลากเส้นโยงไปหา \"แผนงานที่สำคัญในแผนแม่บท\" (เช่น แผนงานพัฒนาระบบ IT ขององค์กร ต้องโยงไปหาแผนงาน A ในแผนปฏิบัติการดิจิทัลอย่างชัดเจน) เพื่อปิด Gap ในระดับ 4","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): เริ่มต้นเก็บข้อมูลประเมินกระบวนการจัดทำแผนยุทธศาสตร์ (SIPOC 4 ขั้นตอนที่ 13) เช่น ประเมินร้อยละความสอดคล้องของแผนงานองค์กรกับแผนแม่บท หรือระยะเวลาในการจัดทำแผน และนำไปปรับปรุงในปีถัดไป","หากในปี 2569 กทท. สามารถออกแบบฟอร์มตาราง (Template) ที่บังคับให้ \"ทุกกลยุทธ์องค์กร ต้องระบุแผนงานหลัก และต้องระบุเจ้าภาพ (แผนแม่บท) ที่รับแผนงานนั้นไปทำต่อ\" กทท. จะกลายเป็น Best Practice ที่ก้าวข้ามคะแนน 2.0 ไปสู่ระดับ 4.0 ได้อย่างแน่นอน"],"dimLevels":["มีคู่มือ/กระบวนการกำหนดยุทธศาสตร์และกลยุทธ์องค์กร (เช่น SIPOC) / มีการระบุเครื่องมือวิเคราะห์ที่ใช้ (เช่น อธิบายหลักการของ Strategy Map / Balanced Scorecard: BSC) และระบุแหล่งที่มาของข้อมูล","มีตารางแสดงการกำหนดยุทธศาสตร์ (Strategy) และกลยุทธ์ (Tactic) อย่างเป็นรูปธรรม / มิติความสอดคล้อง: แสดงตารางเชื่อมโยงยุทธศาสตร์และกลยุทธ์ เข้ากับ Strategic Positioning และ SO / มิติบังคับ: มีหลักฐานการนำ \"ข้อมูลคู่เทียบ (Benchmark)\" มาประกอบการพิจารณาเลือกใช้กลยุทธ์นั้นๆ","มีการเชื่อมโยงยุทธศาสตร์/กลยุทธ์ เข้ากับ \"แผนงานที่สำคัญ (Key Initiatives)\" อย่างชัดเจน / มิติบังคับ Strategy Map: มีแผนภาพ Strategy Map ที่ลากเส้นแสดงความสัมพันธ์จาก \"กลยุทธ์ย่อย\" ขึ้นไปสนับสนุน \"วิสัยทัศน์ (Vision)\" ได้อย่างสมบูรณ์ในแผ่นเดียว","มิติการถ่ายทอดแบบ Deep Cascade: มีการส่งต่อทิศทางไปยังแผนแม่บทอื่น โดยแผนแม่บทลูกต้องรับลูกไปกำหนดเป็น \"ยุทธศาสตร์ของแผนลูก + กลยุทธ์ของแผนลูก + แผนงานสำคัญของแผนลูก\" (รับไปให้ครบทั้ง 3 องค์ประกอบ)","มีแนวทางการประเมินประสิทธิผลกระบวนการกำหนดยุทธศาสตร์และกลยุทธ์ / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ / มีหลักฐานการนำผลประเมินไปใช้ปรับปรุงกระบวนการจัดทำยุทธศาสตร์/กลยุทธ์ในปีถัดไป"]},{"id":"4.2","grp":"4","gname":"การกำหนดยุทธศาสตร์/กลยุทธ์","gw":10,"gs68":2,"name":"การแสดงความเชื่อมโยงระหว่างยุทธศาสตร์ที่สนับสนุนซึ่งกันและกัน (Strategy Map)","w":5,"s68":2,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่การใช้เครื่องมือ Strategy Map (แผนที่ยุทธศาสตร์) และ Balanced Scorecard (BSC) เพื่อจำลองภาพให้เห็นว่า กลยุทธ์ต่างๆ ไม่ได้ตั้งขึ้นมาแบบแยกส่วน (Silo) แต่มี \"ความสัมพันธ์แบบส่งเสริมกัน\" เช่น กลยุทธ์ด้านการพัฒนาคน (Learning & Growth) ส่งผลให้เกิดกลยุทธ์การปรับปรุงกระบวนการ (Internal Process) ซึ่งไปตอบสนองกลยุทธ์การบริการลูกค้า (Customer) และนำไปสู่ความสำเร็จทางการเงิน/วิสัยทัศน์ในที่สุด (Financial/Vision) และที่สำคัญคือต้องพิสูจน์ได้ว่า \"ทำได้จริง\" ตามตัวชี้วัดที่ผูกไว้ในแผนที่","levelSumm":["มีเอกสาร/หลักฐานแสดงการกำหนด \"กลยุทธ์ย่อย (Tactic)\" ที่จัดทำขึ้นเพื่อรองรับยุทธศาสตร์หลักขององค์กรอย่างชัดเจน","มิติความเชื่อมโยงระหว่างกลยุทธ์: มีแผนภาพ Strategy Map ที่แสดงเส้นโยงความสัมพันธ์ (Cause-and-Effect) ระหว่างกลยุทธ์ต่างๆ ว่าสนับสนุนกันอย่างไร","มิติการดำเนินงาน: มีหลักฐานยืนยันว่าได้ลงมือดำเนินงานตาม \"แผนงาน (Action Plan)\" ที่สนับสนุนกลยุทธ์เหล่านั้นครบถ้วนทุกแผนงาน","มีหลักฐาน (เช่น Alignment Matrix) ที่แสดงว่า ความเชื่อมโยงของกลยุทธ์ใน Strategy Map ขององค์กรแม่ ได้ปรากฏและถูกถ่ายทอดลงไปใน \"แผนแม่บทที่เกี่ยวข้อง (Enablers)\" ครบถ้วน","มีแนวทางการประเมินประสิทธิผลกระบวนการกำหนดกลยุทธ์และการทำ Strategy Map"],"good":["มีการกำหนดกระบวนการในการจัดทำแผนยุทธศาสตร์และกลยุทธ์ขององค์กรไว้อย่างชัดเจน (ผ่าน SIPOC 4 ขั้นตอนที่ 13)","มีการจัดทำ แผนที่ยุทธศาสตร์ (Strategy Map) ที่ครอบคลุมมุมมองของ Balanced Scorecard (BSC) ทั้ง 4 ด้าน (การเงิน, ลูกค้า, กระบวนการภายใน, การเรียนรู้และพัฒนา)","มีการแสดงความเชื่อมโยง (Cascade) ตัวชี้วัดและค่าเป้าหมาย โดยแบ่งระดับอย่างเป็นระบบ ได้แก่ ระดับวิสัยทัศน์/ตำแหน่งเชิงยุทธศาสตร์, ระดับวัตถุประสงค์เชิงยุทธศาสตร์ และระดับกลยุทธ์","มีการถ่ายทอดตัวชี้วัดระดับองค์กร ไปสู่ระดับสายงานและระดับบุคคล (KPI) เพื่อใช้ในการประเมินผลการปฏิบัติงาน ซึ่งสะท้อนถึงการนำแผนไปปฏิบัติจริง"],"gaps":["ความครบถ้วนของความสัมพันธ์ในแผนที่ยุทธศาสตร์: ในแผนที่ยุทธศาสตร์ (Strategy Map) ที่จัดทำขึ้น ยังไม่สามารถแสดงเส้นความสัมพันธ์ (Cause and Effect) ได้ครบถ้วน \"ทุกกลยุทธ์\" ที่กำหนดไว้ในแผนวิสาหกิจ (ยังมีกลยุทธ์บางตัวที่ขาดความเชื่อมโยงหรือลอยอยู่)","การแสดงระดับความสำเร็จของแผนงานที่เชื่อมโยงกัน (ระดับ 3): กทท. ยังขาดการแสดงหลักฐานว่า ในจุดที่กลยุทธ์เชื่อมโยงกันนั้น มีระดับความสำเร็จของการดำเนินงานตามแผนงานเป็นอย่างไร","การถ่ายทอด Strategy Map ลงสู่แผนแม่บท (ระดับ 4): ยังขาดการแสดงความเชื่อมโยงระหว่างกลยุทธ์ต่างๆ ในระดับแผนแม่บทที่เกี่ยวข้องให้มีความครอบคลุมและครบถ้วน","การประเมินกระบวนการ (ระดับ 5): ขาดแนวทาง ตัวชี้วัด ผลการประเมิน และหลักฐานการปรับปรุงกระบวนการจัดทำยุทธศาสตร์และ Strategy Map"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนและเริ่มกำหนดกลยุทธ์ที่รองรับยุทธศาสตร์","ระดับ 2 (ผ่านเกณฑ์): มีการจัดทำ Strategy Map ที่แสดงความสอดคล้องกับวัตถุประสงค์เชิงยุทธศาสตร์ วิสัยทัศน์ และมีการนำข้อมูลคู่เทียบมาประกอบ","ระดับ 3 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): กทท. มีการกระจายเป้าหมาย (Cascade KPI) และแสดงการขับเคลื่อนกลยุทธ์ แต่ในมุมมองผู้ประเมิน การแสดงความสัมพันธ์เชิงเหตุและผลใน Strategy Map ยังไม่ครบทุกกลยุทธ์ และยังขาดการแสดงผลสัมฤทธิ์ตามแผนงานที่ครบถ้วน","ระดับ 4 (ไม่ผ่านเกณฑ์): การแสดงความเชื่อมโยงระหว่างกลยุทธ์ลงไปสู่ในแผนแม่บทยังไม่ชัดเจน","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานการประเมินประสิทธิผลของกระบวนการ"],"tris":["ผู้ประเมิน TRIS ระบุช่องว่างของ กทท. ไว้อย่างชัดเจนและตรงประเด็นมากว่า \"มีการจัดทำ Strategy Map มีการกำหนดกลยุทธ์ที่รองรับในแต่ละยุทธศาสตร์ขององค์กร อย่างไรก็ตาม ยังไม่สามารถแสดงความสัมพันธ์ได้ครบทุกกลยุทธ์ที่กำหนด\" (ความหมายคือ กทท. มีแผนที่ยุทธศาสตร์แล้ว แต่เส้นสายโยงความสัมพันธ์ระหว่างกลยุทธ์ในแผนที่นั้นยังตกหล่น หรือมีบางกลยุทธ์ในแผนวิสาหกิจที่ไม่ได้ถูกนำมาจัดเรียงความสัมพันธ์ในแผนที่อย่างเป็นตรรกะ)"],"suggest":["รีวิวและปรับปรุง Strategy Map ใหม่แบบ \"ไร้รอยต่อ\": ฝ่ายกลยุทธ์ต้องนำกลยุทธ์ \"ทุกข้อ\" ในแผนวิสาหกิจมากาง และวาดเส้นความสัมพันธ์เชิงเหตุและผล (Cause and Effect Relationship) ให้ครบถ้วน ห้ามมีกลยุทธ์ใดกลยุทธ์หนึ่งเป็น \"Orphan Strategy\" (กลยุทธ์ที่ไม่มีเส้นเชื่อมโยงกับกลยุทธ์อื่น) อย่างเด็ดขาด","Strategy Map ฉบับนำเสนอ TRIS ควรมีการระบุเป้าหมายตัวชี้วัด (KPI) และแนบ \"ระดับความสำเร็จ (ผลการดำเนินงาน)\" ลงไปในแต่ละจุดของกลยุทธ์ เพื่อแสดงให้เห็นว่าแผนงานที่สนับสนุนกลยุทธ์เหล่านั้นมีความคืบหน้าอย่างไร","เชื่อม Map องค์กร สู่ Map แผนแม่บท (ระดับ 4): ให้เจ้าของแผนแม่บท (เช่น IT, HR, KM) นำ Strategy Map ขององค์กรไปต่อยอด เป็น Strategy Map ประจำแผนแม่บทของตนเอง"],"docs":["แผนที่ยุทธศาสตร์ (Strategy Map) ฉบับสมบูรณ์ (อัปเดต 2569): ที่ตรวจสอบแล้วว่ามีเส้นเชื่อมโยงครบทุกกลยุทธ์ สอดคล้องตามหลัก BSC","รายงานสรุปผลการดำเนินงานบน Strategy Map: เอกสารที่แสดงภาพ Strategy Map พร้อมระบุผลสำเร็จของแผนงาน (Traffic Light / Progress Status) ในจุดเชื่อมโยงต่างๆ","แผนที่ยุทธศาสตร์ระดับแผนแม่บท (Functional Strategy Map): (เพื่อยืนยันระดับ 4)","แนวทางการประเมินประสิทธิผลและหลักฐานการปรับปรุงกระบวนการจัดทำยุทธศาสตร์: (เพื่อยืนยันระดับ 5)"],"bestprac":["ในหัวข้อรวม Strategic Formulation รฟม. ได้คะแนนถึง 3.0000 คะแนน โดยสิ่งที่ รฟม. ทำได้ดีและ TRIS ชื่นชมคือ \"มีการแสดงความเชื่อมโยงและความสัมพันธ์กันระหว่างกลยุทธ์ผ่าน Strategy Map และแสดงให้เห็นตัวชี้วัดของกลยุทธ์ที่มีส่วนสนับสนุนกัน\" แต่ รฟม. ก็ยังพลาดในระดับ 4 เรื่องการเชื่อมโยงลงสู่แผนแม่บท","กทท. ควรนำเทคนิคของ รฟม. มาประยุกต์ใช้ คือ \"การระบุชื่อแผนงานที่สำคัญ (Initiatives) และตัวชี้วัด (KPI) แปะกำกับไว้ในกล่องกลยุทธ์แต่ละกล่องบน Strategy Map\" เพื่อให้ผู้ประเมินเห็นภาพชัดเจนว่า กลยุทธ์นี้จะถูกขับเคลื่อนด้วยแผนงานอะไร วัดผลด้วยอะไร และเมื่อแผนงานนี้สำเร็จ จะส่งผลกระทบ(ลูกศรชี้)ไปสนับสนุนกลยุทธ์ในมิติถัดไปอย่างไร หาก กทท. ทำภาพนี้ได้สมบูรณ์และเชื่อมลงแผนแม่บทได้"],"minReqs":{"1":["เริ่มมีการกำหนดกลยุทธ์ที่รองรับในแต่ละยุทธศาสตร์ขององค์กร แต่ยังไม่สามารถแสดงความเชื่อมโยงกัน และยังไม่สามารถแสดงความสอดคล้องกับวัตถุประสงค์เชิงยุทธศาสตร์ กับวิสัยทัศน์ขององค์กรได้"],"2":["มีการกำหนดกลยุทธ์ที่รองรับในแต่ละยุทธศาสตร์ขององค์กร และสามารถแสดงความเชื่อมโยงกันระหว่างกลยุทธ์ นอกจากนั้นยังแสดงความสอดคล้องกับวัตถุประสงค์เชิงยุทธศาสตร์ กับวิสัยทัศน์ขององค์กรได้ (การแสดงความเชื่อมโยงอาจทำได้โดยการแสดงด้วยตัวชี้วัด หรือกิจกรรมและกระบวนการที่มีส่วนสนับสนุนกัน)"],"3":["สามารถดำเนินงานได้ตามแผนงานที่สนับสนุนกลยุทธ์ได้ทุกแผนงาน และในจุดที่มีความเชื่อมโยงกันระหว่างกลยุทธ์ ต้องสามารถแสดงได้ถึงระดับความสำเร็จตามแผนงานที่กำหนด"],"4":["มีการกำหนดกลยุทธ์ที่รองรับในแต่ละยุทธศาสตร์ขององค์กร และสามารถแสดงความเชื่อมโยงกันระหว่างกลยุทธ์ โดยความเชื่อมโยงนั้นต้องปรากฏในแผนแม่บทที่เกี่ยวข้อง"],"5":["มีการวัดถึงประสิทธิผลของกระบวนการ และนำมาทบทวนรวมถึงปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก \"แผนที่แหว่ง หรือ กลยุทธ์หายกลางทาง\" (The Incomplete Map Trap): จาก Feedback Report ปี 68 ของ กทท. ผู้ตรวจประเมินระบุข้อบกพร่องไว้อย่างชัดเจนและรุนแรงว่า \"มีการจัดทำ Strategy Map... อย่างไรก็ตาม ยังไม่สามารถแสดงความสัมพันธ์ได้ครบทุกกลยุทธ์ที่กำหนด\" หมายความว่า หากในเล่มแผนวิสาหกิจ (ข้อ 4.1) คุณประกาศว่ามี 15 กลยุทธ์ แต่ในหน้า Strategy Map มีกล่องกลยุทธ์ลากเส้นเชื่อมกันแค่ 12 กล่อง (หายไป 3 กล่อง) ผู้ตรวจจะถือว่าการแสดงความเชื่อมโยงไม่สมบูรณ์ และหักคะแนนทันที","ขาดมิติของ Balanced Scorecard และ KPI ขับเคลื่อน (BSC Missing): จากคำชมใน Feedback Report ของ รฟม. ผู้ตรวจชี้ให้เห็นว่า Strategy Map ที่ดีต้อง \"แสดงกลยุทธ์ในการขับเคลื่อนองค์กรตามมุมมอง Balanced Scorecards และแสดงให้เห็นตัวชี้วัดของกลยุทธ์ที่มีสนับสนุนกัน\" ดังนั้น การวาดแผนที่ต้องแบ่งเป็น 4 ชั้น (การเงิน, ลูกค้า, กระบวนการภายใน, การเรียนรู้/เติบโต) และต้องมีชื่อ KPI แปะอยู่ข้างๆ กล่องกลยุทธ์ด้วยเสมอ"],"3":["ขาดมิติของ Balanced Scorecard และ KPI ขับเคลื่อน (BSC Missing): จากคำชมใน Feedback Report ของ รฟม. ผู้ตรวจชี้ให้เห็นว่า Strategy Map ที่ดีต้อง \"แสดงกลยุทธ์ในการขับเคลื่อนองค์กรตามมุมมอง Balanced Scorecards และแสดงให้เห็นตัวชี้วัดของกลยุทธ์ที่มีสนับสนุนกัน\" ดังนั้น การวาดแผนที่ต้องแบ่งเป็น 4 ชั้น (การเงิน, ลูกค้า, กระบวนการภายใน, การเรียนรู้/เติบโต) และต้องมีชื่อ KPI แปะอยู่ข้างๆ กล่องกลยุทธ์ด้วยเสมอ"],"4":["การส่งต่อแผนแม่บทลูกต้องไปพร้อม \"แผนงานสำคัญ\" (Hollow Cascade Trap): จาก Feedback ของ กทพ. ผู้ตรวจดักทางไว้ว่า การเอาความเชื่อมโยงไปปรากฏในแผนแม่บทลูก จะต้อง \"เชื่อมโยงทั้งในระดับยุทธศาสตร์และกลยุทธ์ของแต่ละแผนแม่บท พร้อมแผนงานที่สำคัญ\" แปลว่า แผน IT หรือ แผน HR ต้องไม่ได้รับไปแค่เป้าหมาย แต่ต้องมี \"โครงการ (Initiatives)\" มารองรับให้เห็นเด่นชัดด้วย"]},"scopeNote":"มุ่งเน้นไปที่การใช้เครื่องมือ Strategy Map (แผนที่ยุทธศาสตร์) และ Balanced Scorecard (BSC) เพื่อจำลองภาพให้เห็นว่า กลยุทธ์ต่างๆ ไม่ได้ตั้งขึ้นมาแบบแยกส่วน (Silo) แต่มี \"ความสัมพันธ์แบบส่งเสริมกัน\" เช่น กลยุทธ์ด้านการพัฒนาคน (Learning & Growth) ส่งผลให้เกิดกลยุทธ์การปรับปรุงกระบวนการ (Internal Process) ซึ่งไปตอบสนองกลยุทธ์การบริการลูกค้า (Customer) และนำไปสู่ความสำเร็จทางการเงิน/วิสัยทัศน์ในที่สุด (Financial/Vision) และที่สำคัญคือต้องพิสูจน์ได้ว่า \"ทำได้จริง\" ตามตัวชี้วัดที่ผูกไว้ในแผนที่","actions":["รีวิวและปรับปรุง Strategy Map ใหม่แบบ \"ไร้รอยต่อ\": ฝ่ายกลยุทธ์ต้องนำกลยุทธ์ \"ทุกข้อ\" ในแผนวิสาหกิจมากาง และวาดเส้นความสัมพันธ์เชิงเหตุและผล (Cause and Effect Relationship) ให้ครบถ้วน ห้ามมีกลยุทธ์ใดกลยุทธ์หนึ่งเป็น \"Orphan Strategy\" (กลยุทธ์ที่ไม่มีเส้นเชื่อมโยงกับกลยุทธ์อื่น) อย่างเด็ดขาด","Strategy Map ฉบับนำเสนอ TRIS ควรมีการระบุเป้าหมายตัวชี้วัด (KPI) และแนบ \"ระดับความสำเร็จ (ผลการดำเนินงาน)\" ลงไปในแต่ละจุดของกลยุทธ์ เพื่อแสดงให้เห็นว่าแผนงานที่สนับสนุนกลยุทธ์เหล่านั้นมีความคืบหน้าอย่างไร","เชื่อม Map องค์กร สู่ Map แผนแม่บท (ระดับ 4): ให้เจ้าของแผนแม่บท (เช่น IT, HR, KM) นำ Strategy Map ขององค์กรไปต่อยอด เป็น Strategy Map ประจำแผนแม่บทของตนเอง"],"dimLevels":["มีเอกสาร/หลักฐานแสดงการกำหนด \"กลยุทธ์ย่อย (Tactic)\" ที่จัดทำขึ้นเพื่อรองรับยุทธศาสตร์หลักขององค์กรอย่างชัดเจน","มิติความเชื่อมโยงระหว่างกลยุทธ์: มีแผนภาพ Strategy Map ที่แสดงเส้นโยงความสัมพันธ์ (Cause-and-Effect) ระหว่างกลยุทธ์ต่างๆ ว่าสนับสนุนกันอย่างไร / มิติความสอดคล้องสู่ยอดสุด: แผนภาพดังกล่าว สามารถลากเส้นความสัมพันธ์จากกลยุทธ์ระดับล่าง ทะลุผ่าน \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และพุ่งตรงไปสู่ \"วิสัยทัศน์ (Vision)\" ขององค์กรได้อย่างสมบูรณ์","มิติการดำเนินงาน: มีหลักฐานยืนยันว่าได้ลงมือดำเนินงานตาม \"แผนงาน (Action Plan)\" ที่สนับสนุนกลยุทธ์เหล่านั้นครบถ้วนทุกแผนงาน / มิติวัดระดับความสำเร็จ: ในจุดที่กลยุทธ์เชื่อมโยงกัน ต้องมีการแสดง \"ตัวชี้วัด (KPI) และ ผลการดำเนินงานจริง (ระดับความสำเร็จ)\" กำกับไว้ เพื่อพิสูจน์ว่าการทำงานสนับสนุนกันเกิดผลสัมฤทธิ์จริง","มีหลักฐาน (เช่น Alignment Matrix) ที่แสดงว่า ความเชื่อมโยงของกลยุทธ์ใน Strategy Map ขององค์กรแม่ ได้ปรากฏและถูกถ่ายทอดลงไปใน \"แผนแม่บทที่เกี่ยวข้อง (Enablers)\" ครบถ้วน","มีแนวทางการประเมินประสิทธิผลกระบวนการกำหนดกลยุทธ์และการทำ Strategy Map / มีผลลัพธ์ของการประเมินกระบวนการ / มีหลักฐานการนำผลประเมินไปปรับปรุงคู่มือ/กระบวนการทำงานในปีถัดไป"]},{"id":"5.1","grp":"5","gname":"การจัดทำแผนปฏิบัติการ","gw":20,"gs68":2.875,"name":"กระบวนการวางแผนปฏิบัติการ","w":5,"s68":2.5,"status":"ยังไม่เริ่ม","statusNote":"","scope":"การประเมินมุ่งเน้นไปที่ \"ระบบการสั่งการและรับลูกเพื่อทำแผนปฏิบัติการ\" ผู้ตรวจต้องการเห็นว่า เมื่อ ฝ่ายกลยุทธ์ (ฝก.) ได้แผนยุทธศาสตร์องค์กรมาแล้ว มีการกำหนดตารางเวลา (Timeline) ให้ฝ่ายต่างๆ ไปทำแผนปฏิบัติการมารองรับหรือไม่ มีการจัดสัมมนาสื่อสารขั้นตอนให้เข้าใจตรงกันไหม (L3) และที่สำคัญที่สุดคือ ในการทำแผนปฏิบัติการ ได้มีการนำข้อมูลปัจจัยนำเข้าจากแผนแม่บทอื่นมาร่วมวิเคราะห์หรือไม่ (L4)","levelSumm":["มีคู่มือ/แนวทาง (เช่น SIPOC) ที่ระบุขั้นตอนการวางแผนปฏิบัติการอย่างชัดเจน","มีหลักฐานการดำเนินการจัดทำแผนปฏิบัติการครบถ้วนตามขั้นตอนและกรอบเวลา","มิติการสื่อสาร: มีหลักฐานการจัดประชุม/สัมมนา เพื่อเผยแพร่ขั้นตอนการวางแผนปฏิบัติการให้แต่ละฝ่ายงานรับทราบ","มิติการเชื่อมโยงกระบวนการและปัจจัยนำเข้า: มีหลักฐานแสดงการบูรณาการกระบวนการวางแผนปฏิบัติการ โดยต้องครอบคลุม 4 ด้านบังคับ ดังนี้ (1) การวิเคราะห์ลูกค้าและผู้มีส่วนได้ส่วนเสีย (SCM)/ (2) การวางแผนและพัฒนาทรัพยากรบุคคล (HCM)/ (3) การบริหารความเสี่ยงและควบคุมภายใน (RM & IC)/ (4) การกำหนดองค์ความรู้และนวัตกรรม (KM/IM)","มีแนวทางการประเมินประสิทธิผลของกระบวนการจัดทำแผนปฏิบัติการ"],"good":["มีการกำหนดกระบวนการจัดทำแผนปฏิบัติการ ผู้ที่เกี่ยวข้อง และกรอบระยะเวลาไว้ชัดเจนใน SIPOC 4 (ขั้นตอนที่ 16-20)","ดำเนินการจัดทำแผนปฏิบัติการที่มีองค์ประกอบครบถ้วนตามกรอบเวลาที่กำหนด และได้รับการอนุมัติจากคณะกรรมการ กทท. อย่างเป็นทางการ (ก่อนเริ่มปีงบประมาณ)","มีการสื่อสาร เผยแพร่ขั้นตอนการวางแผนปฏิบัติการ และจัดประชุมเชิงปฏิบัติการ (Workshop) รวมถึงมี \"การประเมินระดับความรับรู้\" ของแต่ละฝ่ายงานที่เข้าร่วมได้อย่างเป็นรูปธรรม ซึ่งตอบโจทย์เกณฑ์ในระดับ 3 ได้อย่างสมบูรณ์"],"gaps":["ขาดความชัดเจนในการเชื่อมโยงกับกระบวนการระบบงานอื่น (ระดับ 4): การจัดทำแผนปฏิบัติการยังขาดการอธิบายความเชื่อมโยงกับกระบวนการวิเคราะห์ลูกค้า/ผู้มีส่วนได้ส่วนเสีย (SCM), กระบวนการพัฒนาทรัพยากรบุคคล (HCM), กระบวนการบริหารความเสี่ยง (RM) และกระบวนการจัดการนวัตกรรม (IM) ทั้งใน \"มิติของขั้นตอนกระบวนการ\" และ \"มิติของการนำข้อมูลมาเป็นปัจจัยนำเข้า\"","ขาดการประเมินประสิทธิผลกระบวนการ (ระดับ 5): ยังไม่มีการกำหนดตัวชี้วัด (KPI) เพื่อประเมินผลสำเร็จของกระบวนการจัดทำแผนปฏิบัติการเอง และไม่มีหลักฐานการนำผลไปปรับปรุงกระบวนการทำงานให้ดีขึ้น"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีกระบวนการ ระบุผู้รับผิดชอบ และกรอบเวลาชัดเจน (SIPOC 4)","ระดับ 2 (ผ่านเกณฑ์): ดำเนินการตามกรอบเวลา และแผนปฏิบัติการผ่านความเห็นชอบจากบอร์ด","ระดับ 3 (ผ่านเกณฑ์): มีการสื่อสาร เผยแพร่ขั้นตอน และประเมินความรับรู้ของฝ่ายงานที่เข้าร่วมจัดทำแผน","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. ได้นำส่งเอกสาร \"สรุปการดำเนินงานการบูรณาการทำงานระหว่างแผนแม่และแผนลูก\" แต่ผู้ประเมินมองว่าหลักฐานดังกล่าวยังไม่สามารถแสดงความเชื่อมโยงในระดับ \"กระบวนการ\" และ \"ปัจจัยนำเข้า\" กับระบบงานของ Enabler อื่นๆ ได้อย่างชัดเจนและครบถ้วน","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการ"],"tris":["กทท. \"ยังแสดงความเชื่อมโยงกับกระบวนการวิเคราะห์ลูกค้าและผู้มีส่วนได้ส่วนเสีย กระบวนการวางแผนและพัฒนาทรัพยากรบุคคล กระบวนการบริหารความเสี่ยงและควบคุมภายใน และกระบวนการกำหนดองค์ความรู้และนวัตกรรม ยังไม่ชัดเจน โดยต้องสามารถแสดงความเชื่อมโยงทั้งกระบวนการและการเชื่อมโยงปัจจัยนำเข้าสู่การวางแผนปฏิบัติการที่ครบถ้วน\" (ความหมายคือ: กทท. ต้องพิสูจน์ให้ได้ว่า ตอนที่แต่ละฝ่ายเขียนโครงการขึ้นมานั้น ได้เอาความเสี่ยง (RM) หรือเอาความต้องการลูกค้า (SCM) มาเป็นข้อมูลตั้งต้น (Input) ในการเขียนโครงการจริงๆ ไม่ใช่ต่างคนต่างคิด)"],"suggest":["ปรับปรุงแบบฟอร์มการเสนอแผนปฏิบัติการ/โครงการ: ฝ่ายกลยุทธ์ (ฝก.) ควรเพิ่มหัวข้อบังคับในแบบฟอร์มเสนอโครงการ (Template) ให้ผู้เสนอโครงการต้องระบุว่า โครงการนี้ใช้ข้อมูลจากเสียงลูกค้า (VOC) ข้อใด? / สอดคล้องกับปัจจัยเสี่ยงองค์กรข้อใด? / และต้องใช้ความรู้อะไรจากระบบ KM มาต่อยอด? เพื่อบังคับให้เกิดการดึงปัจจัยนำเข้า (Input) จากแผนอื่นมาใช้อย่างเป็นรูปธรรม","จัดทำ Cross-functional Process Flow: วาดแผนผังกระบวนการที่เชื่อมโยง SIPOC 4 ของงานกลยุทธ์ เข้ากับ SIPOC ของงานทรัพยากรบุคคล (HCM) งานความเสี่ยง (RM) และงานลูกค้า (SCM) ให้เห็นจุดตัดที่ข้อมูลไหลเชื่อมถึงกัน","กำหนด KPI ประเมินกระบวนการทำงาน (ระดับ 5): เริ่มเก็บสถิติประเมินกระบวนการของฝ่ายกลยุทธ์เอง เช่น \"ร้อยละของแผนปฏิบัติการที่ส่งตรงเวลา\" หรือ \"ระดับความพึงพอใจของฝ่ายงานต่อการให้คำแนะนำของ ฝก.\" เพื่อนำผลไปปรับปรุงในปีถัดไป"],"docs":["เอกสารแสดงกระบวนการเชื่อมโยงข้อมูลข้ามสายงาน (Cross-functional Flowchart): ที่แสดงให้เห็นว่าปัจจัยนำเข้าจากกระบวนการ SCM, HCM, RM, KM ไหลเข้ามาสู่กระบวนการวางแผนปฏิบัติการอย่างไร","แบบฟอร์มเสนอโครงการ/แผนปฏิบัติการ (ฉบับอัปเดต): ที่มีการเพิ่มช่องระบุปัจจัยนำเข้า (Input) จาก Enabler อื่นๆ อย่างชัดเจน","รายงานสรุปการประเมินประสิทธิผลกระบวนการวางแผนปฏิบัติการ: พร้อมหลักฐานการนำข้อบกพร่องไปปรับปรุง (เพื่อยืนยันระดับ 5)"],"bestprac":["กทพ. ตกหลุมพรางเดียวกันกับ กทท. โดยได้รับ Feedback จาก TRIS ด้วยข้อความเดียวกันเป๊ะว่า \"ควรมีการเชื่อมโยงกระบวนการวางแผนปฏิบัติการกับกระบวนการวิเคราะห์ลูกค้า... ทรัพยากรบุคคล... ความเสี่ยง... นวัตกรรม\"","รฟม. สามารถทำคะแนนในข้อนี้ทะลุผ่านระดับ 4 ไปได้สำเร็จ! โดยสิ่งที่ รฟม. ทำและได้รับคำชมจาก TRIS คือ \"มีการอบรมให้ความรู้การจัดทำแผนปฏิบัติการร่วมกับหน่วยงานเป็นรายวัตถุประสงค์เชิงยุทธศาสตร์... รวมถึงมีการเชื่อมโยงกับทั้งกระบวนการและปัจจัยนำเข้าสู่การวางแผนปฏิบัติการของกระบวนการและแผนแม่บทที่สำคัญ\"","กทท. ควรเลียนแบบ รฟม. โดยการจัด Workshop สอนการทำแผนฯ แบบ \"แบ่งกลุ่มตามวัตถุประสงค์เชิงยุทธศาสตร์\" และนำข้อมูลจากแผนแม่บทอื่น ๆ (เช่น สมุดทะเบียนความเสี่ยง หรือ รายงานความต้องการลูกค้า) มากางบนโต๊ะ เพื่อให้แต่ละฝ่ายใช้เป็น Input ในการเขียน Action Plan ในวันนั้นเลย หากทำได้ ภาพการบูรณาการจะชัดเจนและผ่านระดับ 4 ได้ทันที"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของกระบวนการวางแผนปฏิบัติการ และผู้ที่เกี่ยวข้อง รวมถึงกำหนดกรอบเวลาในแต่ละขั้นตอน"],"2":["รัฐวิสาหกิจได้ดำเนินการตามขั้นตอนที่สำคัญครบถ้วน และทุกขั้นตอนสามารถเป็นไปตามกระบวนการที่กำหนด รวมถึงมีการประเมินประสิทธิผลของทุกขั้นตอน และทุกขั้นตอนได้ประสิทธิผลตามที่กำหนด (ความครบถ้วนของปัจจัย, กระบวนการ, ผลผลิต, ระยะเวลาที่แล้วเสร็จ)"],"3":["มีการเผยแพร่ขั้นตอนการวางแผนปฏิบัติการ และประเมินระดับความรับรู้ของแต่ละฝ่ายงานที่เข้าร่วมในขั้นตอนที่สำคัญ"],"4":["กระบวนการวางแผนปฏิบัติการสามารถแสดงความเชื่อมโยงกับกระบวนการวิเคราะห์ลูกค้าและผู้มีส่วนได้ส่วนเสีย กระบวนการวางแผนและพัฒนาทรัพยากรบุคคล กระบวนการบริหารความเสี่ยงและควบคุมภายใน และกระบวนการกำหนดองค์ความรู้และนวัตกรรม โดยเป็นการเชื่อมโยงทั้งกระบวนการและการเชื่อมโยงปัจจัยนำเข้าสู่การวางแผนปฏิบัติการ"],"5":["มีการประเมินประสิทธิผลของกระบวนการจัดทำแผนปฏิบัติการ และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการฯ"]},"subComps":{"3":["กับดัก \"แค่สื่อสารแต่ไม่ได้วัดผลความเข้าใจ\" (The Awareness Assessment Trap): จาก Feedback Report ของ รฟม. ที่ได้คะแนนระดับ 3.2500 เพราะ รฟม. มีการจัดอบรมและ \"ประเมินระดับความรับรู้\" ของฝ่ายงานต่างๆ หลายองค์กรมักส่งหลักฐานแค่ \"รายงานการประชุมแจ้งปฏิทินการทำแผน\" ซึ่งผู้ตรวจจะไม่ให้ผ่าน Level 3 หากไม่มีกราฟสรุปผลว่า \"ผู้ทำแผนของแต่ละฝ่ายเข้าใจกระบวนการร้อยละเท่าไหร่\""],"4":["กับดัก \"บูรณาการไม่ครบ 4 เสาหลัก\" (The Incomplete Pillars Trap): จาก Feedback Report ของ กทพ. (ได้ 3.5000 คะแนน) ผู้ตรวจคอมเมนต์ไว้ชัดเจนมากว่า กทพ. ขาดการเชื่อมโยงอย่างครบถ้วน การจะได้ Level 4 ฝ่ายกลยุทธ์ต้องทำ \"ตารางวิเคราะห์ปัจจัยนำเข้าเพื่อทำ Action Plan\" ที่ดึงเอา Pain point ลูกค้า (SCM), ความเสี่ยงปีล่าสุด (RM), อัตรากำลัง (HCM) และ องค์ความรู้ที่ต้องใช้ (KM/IM) มาเป็นสารตั้งต้นในการเขียนแผนงาน หากขาดด้านใดด้านหนึ่งไป คะแนนจะถูกหารทิ้งทันที","การเชื่อมโยงต้องครบทั้ง \"กระบวนการ\" และ \"ปัจจัยนำเข้า\": ข้อเสนอแนะของ กทพ. ระบุชัดเจนว่า การเชื่อมโยง 4 ด้านนั้น ต้องแสดงให้เห็นว่าดึง \"ปัจจัยนำเข้า (Input)\" มาใช้อย่างไร และเชื่อมโยง \"กระบวนการ (Process)\" การทำงานร่วมกันอย่างไรด้วย (เช่น SP จัดประชุมทำแผนร่วมกับ HR และ RM ในช่วงเวลาเดียวกัน) กทท. สามารถนำข้อเสนอตรงนี้มาประยุกต์ใช้ได้เลยในทันที"]},"scopeNote":"การประเมินมุ่งเน้นไปที่ \"ระบบการสั่งการและรับลูกเพื่อทำแผนปฏิบัติการ\" ผู้ตรวจต้องการเห็นว่า เมื่อ ฝ่ายกลยุทธ์ (ฝก.) ได้แผนยุทธศาสตร์องค์กรมาแล้ว มีการกำหนดตารางเวลา (Timeline) ให้ฝ่ายต่างๆ ไปทำแผนปฏิบัติการมารองรับหรือไม่ มีการจัดสัมมนาสื่อสารขั้นตอนให้เข้าใจตรงกันไหม (L3) และที่สำคัญที่สุดคือ ในการทำแผนปฏิบัติการ ได้มีการนำข้อมูลปัจจัยนำเข้าจากแผนแม่บทอื่นมาร่วมวิเคราะห์หรือไม่ (L4)","actions":["ปรับปรุงแบบฟอร์มการเสนอแผนปฏิบัติการ/โครงการ: ฝ่ายกลยุทธ์ (ฝก.) ควรเพิ่มหัวข้อบังคับในแบบฟอร์มเสนอโครงการ (Template) ให้ผู้เสนอโครงการต้องระบุว่า โครงการนี้ใช้ข้อมูลจากเสียงลูกค้า (VOC) ข้อใด? / สอดคล้องกับปัจจัยเสี่ยงองค์กรข้อใด? / และต้องใช้ความรู้อะไรจากระบบ KM มาต่อยอด? เพื่อบังคับให้เกิดการดึงปัจจัยนำเข้า (Input) จากแผนอื่นมาใช้อย่างเป็นรูปธรรม","จัดทำ Cross-functional Process Flow: วาดแผนผังกระบวนการที่เชื่อมโยง SIPOC 4 ของงานกลยุทธ์ เข้ากับ SIPOC ของงานทรัพยากรบุคคล (HCM) งานความเสี่ยง (RM) และงานลูกค้า (SCM) ให้เห็นจุดตัดที่ข้อมูลไหลเชื่อมถึงกัน","กำหนด KPI ประเมินกระบวนการทำงาน (ระดับ 5): เริ่มเก็บสถิติประเมินกระบวนการของฝ่ายกลยุทธ์เอง เช่น \"ร้อยละของแผนปฏิบัติการที่ส่งตรงเวลา\" หรือ \"ระดับความพึงพอใจของฝ่ายงานต่อการให้คำแนะนำของ ฝก.\" เพื่อนำผลไปปรับปรุงในปีถัดไป"],"dimLevels":["มีคู่มือ/แนวทาง (เช่น SIPOC) ที่ระบุขั้นตอนการวางแผนปฏิบัติการอย่างชัดเจน / มีการระบุ \"ผู้ที่เกี่ยวข้อง\" และ \"กรอบระยะเวลา (Timeline)\" ในแต่ละขั้นตอนการจัดทำแผนไว้อย่างชัดเจน","มีหลักฐานการดำเนินการจัดทำแผนปฏิบัติการครบถ้วนตามขั้นตอนและกรอบเวลา / มีการประเมินประสิทธิผลของกระบวนการจัดทำแผน (KPI in Process) โดยต้องวัดครอบคลุม 4 มิติ คือ 1.ความครบถ้วนของปัจจัย 2.กระบวนการ 3.ผลผลิต 4.ระยะเวลาที่แล้วเสร็จ","มิติการสื่อสาร: มีหลักฐานการจัดประชุม/สัมมนา เพื่อเผยแพร่ขั้นตอนการวางแผนปฏิบัติการให้แต่ละฝ่ายงานรับทราบ / มิติการประเมิน: มีหลักฐาน \"แบบประเมินและสรุปผลระดับความรับรู้/ความเข้าใจ\" ของผู้เข้าร่วมกระบวนการจัดทำแผนปฏิบัติการ (ห้ามมีแค่ภาพถ่ายการประชุม ต้องมีผลประเมินความเข้าใจด้วย)","มิติการเชื่อมโยงกระบวนการและปัจจัยนำเข้า: มีหลักฐานแสดงการบูรณาการกระบวนการวางแผนปฏิบัติการ โดยต้องครอบคลุม 4 ด้านบังคับ ดังนี้ (1) การวิเคราะห์ลูกค้าและผู้มีส่วนได้ส่วนเสีย (SCM)/ (2) การวางแผนและพัฒนาทรัพยากรบุคคล (HCM)/ (3) การบริหารความเสี่ยงและควบคุมภายใน (RM & IC)/ (4) การกำหนดองค์ความรู้และนวัตกรรม (KM/IM)","มีแนวทางการประเมินประสิทธิผลของกระบวนการจัดทำแผนปฏิบัติการ / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ / มีหลักฐานการนำผลประเมินไปใช้ปรับปรุงกระบวนการ/คู่มือในปีถัดไป"]},{"id":"5.2","grp":"5","gname":"การจัดทำแผนปฏิบัติการ","gw":20,"gs68":2.875,"name":"การวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ","w":5,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"เน้นไปที่การตอบคำถามว่า \"แผนงานที่คิดมา ปลอดภัยและทำได้จริงแค่ไหน?\" โดยผู้ตรวจจะเพ่งเล็งว่า \"ทุกๆ โครงการ\" ที่ปรากฏอยู่ในแผนปฏิบัติการ ได้ถูกนำมาสแกนหาความเสี่ยง ประเมินระดับความรุนแรง และมีมาตรการจัดการที่ชัดเจนหรือไม่ สิ่งสำคัญที่สุดคือ เมื่อเจอความเสี่ยงระดับโครงการแล้ว ฝ่ายกลยุทธ์ (SP) ได้ส่งต่อข้อมูลเหล่านี้ไปให้ฝ่ายบริหารความเสี่ยง (RM) เพื่อนำไปรวมเป็นภาพใหญ่ความเสี่ยงขององค์กร (Corporate Risk) หรือไม่","levelSumm":["มีแนวทาง/กระบวนการ/คู่มือ (เช่น SIPOC) ในการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการอย่างชัดเจน","มิติบังคับ: มีหลักฐานการวิเคราะห์ความเสี่ยงของ \"ทุกแผนปฏิบัติการ (100% of Action Plans)\"","มิติกรอบเวลา: มีหลักฐานยืนยันว่า กระบวนการวิเคราะห์ความเสี่ยง เกิดขึ้นสอดคล้อง/พร้อมกัน กับกระบวนการจัดทำแผนปฏิบัติการ (ไม่ใช่ทำแผนเสร็จไป 3 เดือนแล้วค่อยมานั่งนึกความเสี่ยง)","มีหลักฐาน (เช่น รายงานการประชุมร่วม SP และ RM) แสดงให้เห็นว่า ผลวิเคราะห์ความเสี่ยงระดับแผนปฏิบัติการ (Project Risk) ได้ถูกนำส่งไปเป็น \"ปัจจัยนำเข้า (Input)\" ที่สำคัญประกอบการทบทวน/จัดทำ \"แผนบริหารความเสี่ยงระดับองค์กร (Corporate Risk)\" ของปีงบประมาณถัดไป","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ"],"good":["มีกระบวนการและกรอบเวลาชัดเจน: มีการกำหนดขั้นตอนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการไว้ใน SIPOC 4 (ขั้นตอนที่ 17-19) อย่างเป็นระบบ","เครื่องมือและแบบฟอร์มครบถ้วน: มีการใช้ \"แบบฟอร์มทบทวนแผนงาน-โครงการ-แผนปฏิบัติการ\" ที่บังคับให้ผู้รับผิดชอบโครงการต้องวิเคราะห์ความเสี่ยง ระบุระดับความรุนแรง กำหนดมาตรการจัดการ (Mitigation) และตั้งเป้าหมายความเสี่ยงคงเหลือ (Residual Risk) ตามหลักเกณฑ์คู่มือบริหารความเสี่ยงโครงการลงทุนของ กทท.","มีการสอบทานข้ามสายงาน (Cross-checking): สำนักบริหารความเสี่ยงและควบคุมภายใน (สสค.) เข้ามามีบทบาทช่วยพิจารณาและตรวจสอบความเสี่ยงของแต่ละแผนปฏิบัติการจากศูนย์ EVM ก่อนที่จะส่งให้ฝ่ายกลยุทธ์องค์กร (ฝก.) รวบรวม"],"gaps":["การยกระดับความเสี่ยงโครงการสู่ระดับองค์กร (Bottom-up Risk Integration): (ระดับ 4) แม้ กทท. จะบอกว่าส่งข้อมูลให้ สสค. แล้ว แต่ยังขาดหลักฐานเชิงประจักษ์ (Evidence) ที่แสดงให้ผู้ประเมินเห็นภาพว่า \"ความเสี่ยงของแผนปฏิบัติการ (Project Risk) ถูกนำไปเป็นปัจจัยนำเข้า (Input) ที่สำคัญในการกำหนดความเสี่ยงระดับองค์กร (Corporate Risk/Risk Universe) อย่างไร\"","การประเมินกระบวนการ (ระดับ 5): ยังขาดแนวทาง ตัวชี้วัด ผลลัพธ์ และหลักฐานการนำผลประเมินกระบวนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการไปปรับปรุงแก้ไข"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนและกรอบเวลาการวิเคราะห์ความเสี่ยงแผนปฏิบัติการอย่างชัดเจน","ระดับ 2 (ผ่านเกณฑ์): ทุกแผนปฏิบัติการมีการระบุความเสี่ยง ความรุนแรง มาตรการจัดการ และเป้าหมายความเสี่ยงคงเหลือครบถ้วนในแบบฟอร์ม","ระดับ 3 (ผ่านเกณฑ์): กระบวนการวิเคราะห์ความเสี่ยงสอดคล้องไปพร้อมกับกระบวนการจัดทำแผนปฏิบัติการ (ทำไปพร้อมกัน ไม่ได้แยกทำทีหลัง)","ระดับ 4 (ไม่ผ่านเกณฑ์ / ผ่านแบบมีเงื่อนไข): กทท. ส่งหลักฐานอ้างอิงว่า สสค. นำข้อมูลไปรวมใน Risk Inventory 2569 แล้ว แต่ผู้ประเมิน TRIS มองว่า \"ยังไม่สามารถแสดงความสอดคล้องได้ชัดเจนเพียงพอ\" ว่าความเสี่ยงระดับปฏิบัติการส่งผลต่อระดับองค์กรอย่างไร","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการนี้"],"tris":["\"ควรมีการแสดงความสอดคล้องกับกระบวนการวิเคราะห์ความเสี่ยงระดับองค์กร โดยระดับความเสี่ยงของแผนปฏิบัติการ เป็นปัจจัยนำเข้าที่สำคัญของการวิเคราะห์ความเสี่ยงระดับองค์กร\" (คำอธิบาย: TRIS ต้องการเห็น \"กลไกการคัดกรอง\" เช่น โครงการ A มีความเสี่ยงสูงมากจนอาจกระทบเป้าหมายองค์กร ความเสี่ยงของโครงการ A จึงถูกดันขึ้น (Bubble up) ไปเป็นหนึ่งในความเสี่ยงระดับองค์กร (Corporate Risk) ในสมุดทะเบียนความเสี่ยง)"],"suggest":["ทำผังเชื่อมโยง Risk Aggregation (Bottom-up): ฝ่ายกลยุทธ์ (ฝก.) และ สำนักบริหารความเสี่ยงฯ (สสค.) ต้องจัดทำรายงานหรือตารางที่ดึงเอาความเสี่ยง \"ระดับสูง (High/Extreme)\" จากแผนปฏิบัติการ มาแสดงให้เห็นว่าถูกจับรวมกลุ่ม (Aggregated) และบรรจุเข้าไปเป็น Risk Universe ขององค์กรประจำปี 2569 อย่างเป็นรูปธรรม (ปิด Gap ระดับ 4)","กำหนด KPI ประเมินกระบวนการวิเคราะห์ความเสี่ยงแผนฯ (ระดับ 5): ตั้งตัวชี้วัดการทำงาน เช่น \"ร้อยละของแผนปฏิบัติการที่มีการวิเคราะห์ความเสี่ยงถูกต้องครบถ้วนตั้งแต่การส่งครั้งแรก\" หรือ \"ระยะเวลาในการสอบทานความเสี่ยงโดย สสค.\" และนำผลมาปรับปรุงคู่มือในปีถัดไป","กทท. ต้องสร้าง \"ระบบ Risk Bubble-up\" ที่ชัดเจน (นำความเสี่ยงโครงการดันขึ้นไปเป็นความเสี่ยงองค์กร) และเป็นองค์กรแรกที่ทำ \"รายงานผลการประเมินความผิดพลาดของการกรอกแบบฟอร์มความเสี่ยงโครงการ\" เพื่อนำมาปรับปรุงขั้นตอนการสอนงาน/อบรมพนักงานในปีถัดไป (Process Evaluation)"],"docs":["ตารางเมทริกซ์เชื่อมโยงความเสี่ยงโครงการสู่ความเสี่ยงองค์กร (Project Risk to Corporate Risk Alignment Matrix): ตารางที่แสดงให้เห็นว่าปัจจัยเสี่ยงจากแผนปฏิบัติการข้อใดบ้าง ที่ถูกนำไปตั้งเป็นปัจจัยเสี่ยงระดับองค์กร (Risk Factor)","รายงานการประชุมร่วม (ฝก. และ สสค.): วาระพิจารณาคัดกรองนำความเสี่ยงแผนปฏิบัติการไปจัดทำ Risk Universe ระดับองค์กร","แนวทางและรายงานการประเมินประสิทธิผลกระบวนการ (KPI in Process): สำหรับยืนยันคะแนนในระดับ 5"],"bestprac":["กทพ. และ รฟม. ก็มาติดขัดในหัวข้อนี้คล้ายๆ กัน โดย รฟม. ได้รับข้อเสนอแนะจาก TRIS แบบลอกกันมาเลยว่า \"ควรมีแนวทางการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการให้สอดคล้องกับกระบวนการวิเคราะห์ระดับองค์กร รวมถึงต้องเป็นปัจจัยนำเข้าที่สำคัญของการวิเคราะห์ความเสี่ยงระดับองค์กร\" ในขณะที่ กทพ. ผ่านระดับ 4 แต่ไปตกในระดับ 5 เรื่องการขาดตัวชี้วัดประเมินกระบวนการ"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ รวมถึงกรอบเวลาในการดำเนินการ"],"2":["รัฐวิสาหกิจได้ดำเนินการระบุความเสี่ยงของ \"ทุกแผนปฏิบัติการ\" พร้อมระดับความรุนแรง และมาตรการในการจัดการ รวมถึงเป้าหมายของระดับความเสี่ยงคงเหลือ"],"3":["กระบวนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการมีความสอดคล้องกับกระบวนการจัดทำแผนปฏิบัติการ"],"4":["กระบวนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการมีความสอดคล้องกับกระบวนการวิเคราะห์ความเสี่ยงระดับองค์กร โดยระดับความเสี่ยงของแผนปฏิบัติการเป็น \"ปัจจัยนำเข้า\" ที่สำคัญของการวิเคราะห์ความเสี่ยงระดับองค์กร"],"5":["มีการประเมินประสิทธิผลของการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการฯ"]},"subComps":{"2":["กับดัก \"ทุกแผนปฏิบัติการ\" (The 'All Projects' Trap): เกณฑ์ระบุคำว่า \"ทุกแผนปฏิบัติการ\" ไว้ชัดเจนมาก หลายองค์กรมักเลือกวิเคราะห์เฉพาะโครงการใหญ่ๆ (Mega Projects) หรือโครงการที่ใช้งบประมาณสูง แต่ละเลยโครงการเล็กๆ หากผู้ตรวจสุ่มตรวจแล้วพบว่ามี Action Plan ใดที่ช่องความเสี่ยงถูกปล่อยว่างไว้ จะตก Level 2 ทันที","กับดัก \"ลืมระบุความเสี่ยงคงเหลือ\" (Missing Residual Risk Target): เป็นจุดตายยอดฮิต หลายองค์กรกรอกความเสี่ยงและมาตรการแก้ไขครบถ้วน แต่ลืมระบุ \"ระดับความเสี่ยงคงเหลือ (Residual Risk)\" ว่าหลังจากทำตามมาตรการแล้ว ความรุนแรงจะลดลงเหลือระดับใด (เช่น จากความเสี่ยงสูง ลงมาเหลือความเสี่ยงปานกลาง)","คุณภาพของมาตรการจัดการความเสี่ยง (Mitigation Quality - อิงจากหลักการบริหารความเสี่ยง): หากมาตรการที่ระบุไว้ในแผนปฏิบัติการ (Mitigation Plan) ไม่สามารถพิสูจน์ได้ว่า \"จะช่วยลดโอกาสเกิด (Likelihood)\" หรือ \"ลดผลกระทบ (Impact)\" ลงได้อย่างสมเหตุสมผล จะถือว่าเป็นการจัดทำแผนที่ไม่มีคุณภาพ"],"3":["ความสอดคล้องระดับสายงาน (Alignment of Responsibility): จากเอกสารคู่มือ ผู้รับผิดชอบ (ศูนย์ EVM/สายงาน) จะต้องเป็นผู้ประเมินความเสี่ยงหน้างานด้วยตนเองตามหลักเกณฑ์คู่มือบริหารความเสี่ยงโครงการลงทุน ฝ่ายกลยุทธ์ (ฝก.) และสำนักความเสี่ยง (สสค.) เป็นเพียงผู้กำกับและสอบทาน หากพบว่าฝ่ายกลยุทธ์เป็นคนเขียนความเสี่ยงให้เองทั้งหมด ความน่าเชื่อถือของกระบวนการจะลดลง"]},"scopeNote":"เน้นไปที่การตอบคำถามว่า \"แผนงานที่คิดมา ปลอดภัยและทำได้จริงแค่ไหน?\" โดยผู้ตรวจจะเพ่งเล็งว่า \"ทุกๆ โครงการ\" ที่ปรากฏอยู่ในแผนปฏิบัติการ ได้ถูกนำมาสแกนหาความเสี่ยง ประเมินระดับความรุนแรง และมีมาตรการจัดการที่ชัดเจนหรือไม่ สิ่งสำคัญที่สุดคือ เมื่อเจอความเสี่ยงระดับโครงการแล้ว ฝ่ายกลยุทธ์ (SP) ได้ส่งต่อข้อมูลเหล่านี้ไปให้ฝ่ายบริหารความเสี่ยง (RM) เพื่อนำไปรวมเป็นภาพใหญ่ความเสี่ยงขององค์กร (Corporate Risk) หรือไม่","actions":["ทำผังเชื่อมโยง Risk Aggregation (Bottom-up): ฝ่ายกลยุทธ์ (ฝก.) และ สำนักบริหารความเสี่ยงฯ (สสค.) ต้องจัดทำรายงานหรือตารางที่ดึงเอาความเสี่ยง \"ระดับสูง (High/Extreme)\" จากแผนปฏิบัติการ มาแสดงให้เห็นว่าถูกจับรวมกลุ่ม (Aggregated) และบรรจุเข้าไปเป็น Risk Universe ขององค์กรประจำปี 2569 อย่างเป็นรูปธรรม (ปิด Gap ระดับ 4)","กำหนด KPI ประเมินกระบวนการวิเคราะห์ความเสี่ยงแผนฯ (ระดับ 5): ตั้งตัวชี้วัดการทำงาน เช่น \"ร้อยละของแผนปฏิบัติการที่มีการวิเคราะห์ความเสี่ยงถูกต้องครบถ้วนตั้งแต่การส่งครั้งแรก\" หรือ \"ระยะเวลาในการสอบทานความเสี่ยงโดย สสค.\" และนำผลมาปรับปรุงคู่มือในปีถัดไป","กทท. ต้องสร้าง \"ระบบ Risk Bubble-up\" ที่ชัดเจน (นำความเสี่ยงโครงการดันขึ้นไปเป็นความเสี่ยงองค์กร) และเป็นองค์กรแรกที่ทำ \"รายงานผลการประเมินความผิดพลาดของการกรอกแบบฟอร์มความเสี่ยงโครงการ\" เพื่อนำมาปรับปรุงขั้นตอนการสอนงาน/อบรมพนักงานในปีถัดไป (Process Evaluation)"],"dimLevels":["มีแนวทาง/กระบวนการ/คู่มือ (เช่น SIPOC) ในการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการอย่างชัดเจน / มีการระบุ \"กรอบระยะเวลา (Timeline)\" ในการดำเนินการวิเคราะห์ความเสี่ยงที่สอดรับกับการทำแผน / มี \"แบบฟอร์ม\" หรือเครื่องมือสำหรับการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ","มิติบังคับ: มีหลักฐานการวิเคราะห์ความเสี่ยงของ \"ทุกแผนปฏิบัติการ (100% of Action Plans)\" / มิติความสมบูรณ์ของข้อมูล: ในแต่ละแผนปฏิบัติการ มีการระบุข้อมูลครบ 3 ส่วน ได้แก่ (1) ระดับความรุนแรงของความเสี่ยง (Severity)/ (2) มาตรการในการจัดการความเสี่ยง (Mitigation Plan)/ (3) เป้าหมายของ \"ระดับความเสี่ยงคงเหลือ (Target Residual Risk)\"","มิติกรอบเวลา: มีหลักฐานยืนยันว่า กระบวนการวิเคราะห์ความเสี่ยง เกิดขึ้นสอดคล้อง/พร้อมกัน กับกระบวนการจัดทำแผนปฏิบัติการ (ไม่ใช่ทำแผนเสร็จไป 3 เดือนแล้วค่อยมานั่งนึกความเสี่ยง) / มิติการตรวจสอบไขว้ (Cross-check): มีหลักฐานการให้ \"สำนักบริหารความเสี่ยงฯ (RM)\" เข้ามาช่วยพิจารณาและตรวจสอบคุณภาพความเสี่ยงของแผนปฏิบัติการ ก่อนที่ฝ่ายกลยุทธ์จะรวบรวมเสนอขอความเห็นชอบ","มีหลักฐาน (เช่น รายงานการประชุมร่วม SP และ RM) แสดงให้เห็นว่า ผลวิเคราะห์ความเสี่ยงระดับแผนปฏิบัติการ (Project Risk) ได้ถูกนำส่งไปเป็น \"ปัจจัยนำเข้า (Input)\" ที่สำคัญประกอบการทบทวน/จัดทำ \"แผนบริหารความเสี่ยงระดับองค์กร (Corporate Risk)\" ของปีงบประมาณถัดไป","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ความเสี่ยงของแผนปฏิบัติการ / มีผลลัพธ์ของการประเมิน (เช่น มาตรการที่กำหนดไว้สามารถควบคุมความเสี่ยงได้จริงหรือไม่) / มีหลักฐานการนำผลประเมินไปปรับปรุงคู่มือ/กระบวนการในปีถัดไป"]},{"id":"5.3","grp":"5","gname":"การจัดทำแผนปฏิบัติการ","gw":20,"gs68":2.875,"name":"กระบวนการจัดสรรทรัพยากร","w":10,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"เน้นไปที่ \"ความสมเหตุสมผลและความเพียงพอของการให้ทรัพยากร\" โดยไม่ได้มองแค่เรื่อง \"เงินงบประมาณ\" เท่านั้น แต่มองรวมถึงทรัพยากร \"ที่ไม่ใช่ตัวเงิน\" (คน, IT, เวลา) ด้วย องค์กรต้องมีเกณฑ์การจัดลำดับความสำคัญของโครงการ (Prioritization) ที่ชัดเจน และในระดับสูง (Level 4) ต้องบังคับให้แผนไอที (DT) และแผนความเสี่ยง (RM) เข้ามาเป็นส่วนหนึ่งในกระบวนการตัดสินใจจัดสรรทรัพยากรร่วมกัน","levelSumm":["มีแนวทาง/คู่มือ/ขั้นตอน (SIPOC) ในการวิเคราะห์และจัดสรรทรัพยากร พร้อมระบุกรอบเวลาที่ชัดเจน","มิติบังคับ: \"ทุกแผนงาน/โครงการ\" มีการประเมินความต้องการทรัพยากรลงในแบบฟอร์ม","มิติการทำงานร่วม: ฝ่ายงานที่เกี่ยวข้อง (เช่น ฝ่ายกลยุทธ์, การเงิน, HR, IT) มีการประชุมร่วมกันเพื่อพิจารณา \"ความเพียงพอของทรัพยากรในภาพรวม\"","มิติการเชื่อมโยง IT: มีหลักฐานยืนยันว่ากระบวนการจัดสรรทรัพยากรสอดคล้องกับ \"แผนปฏิบัติการดิจิทัล (DT)\" (เช่น โครงการไหนขอระบบ IT ต้องส่งข้อมูลให้ฝ่าย IT ไปทำแผนรองรับ)","มีแนวทางการประเมินประสิทธิผลของกระบวนการจัดสรรทรัพยากร"],"good":["กระบวนการและกรอบเวลาชัดเจน: มีการระบุขั้นตอนและเครื่องมือผ่าน SIPOC 6 (กระบวนการจัดสรรทรัพยากร) อย่างเป็นระบบ","แบบฟอร์มขอจัดสรรทรัพยากรมีความสมบูรณ์สูง: กทท. ใช้แบบฟอร์มทบทวนแผนงานฯ ที่ให้หน่วยงานวิเคราะห์ความต้องการแบบ 360 องศา (ทั้งการเงิน, ความต้องการอัตรากำลัง, ความต้องการด้าน IT และการประเมินความเสี่ยงโครงการ)","บูรณาการข้ามสายงานในการพิจารณา (Cross-functional Screening): มีการตั้งคณะอนุกรรมการกลั่นกรองงบประมาณ ที่ดึงเอา \"หน่วยงานสนับสนุน\" (เช่น ฝ่ายทรัพยากรบุคคล, ฝ่าย IT, สำนักความเสี่ยงฯ, ฝ่ายกลยุทธ์) มาร่วมกันสอบทานคำขอและพิจารณาความเพียงพอของทรัพยากรก่อนจัดสรรจริง","มีเกณฑ์จัดลำดับความสำคัญที่ชัดเจน: มีการใช้ \"เกณฑ์การจัดลำดับความสำคัญของโครงการลงทุน\" ในการตัดสินใจจัดสรรงบประมาณ"],"gaps":["หลักเกณฑ์การจัดสรรในแผนลูกยังไม่สะท้อนกับแผนแม่ (Gap ระดับ 4): การจัดสรรทรัพยากรในแผนยุทธศาสตร์องค์กร กับการจัดสรรทรัพยากรในแผนแม่บทอื่นๆ (เช่น แผน IT, แผนความเสี่ยง) ยังขาดความเชื่อมโยงกันอย่างเป็นเนื้อเดียว ทั้งในด้าน \"ตัวหลักเกณฑ์ที่ใช้พิจารณา\" และ \"ผลลัพธ์ของการจัดสรร\"","ขาดการประเมินกระบวนการ (Gap ระดับ 5): ยังไม่มีแนวทาง ตัวชี้วัด (KPI in process) และผลลัพธ์ของการประเมินกระบวนการจัดสรรทรัพยากร (SIPOC 6) เพื่อนำไปปรับปรุงแก้ไข"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีขั้นตอนการจัดสรรทรัพยากรและกรอบเวลาชัดเจน","ระดับ 2 (ผ่านเกณฑ์): วิเคราะห์ความต้องการทรัพยากรทั้งที่เป็นตัวเงินและไม่ใช่ตัวเงินผ่านแบบฟอร์มได้อย่างครบถ้วนทุกองค์ประกอบ","ระดับ 3 (ผ่านเกณฑ์): ฝ่ายงานที่เกี่ยวข้องร่วมกันพิจารณาความเพียงพอขององค์กร และทำการจัดสรรงบประมาณได้ตามแผนงานที่ตั้งไว้จริง","ระดับ 4 (ไม่ผ่านเกณฑ์): แม้ กทท. จะอ้างว่ามีการประชุมร่วมกันและมีการถ่ายทอดความต้องการไปยังผู้รับผิดชอบแผน IT และแผนความเสี่ยงแล้ว แต่ผู้ประเมินมองว่าหลักฐานที่ส่งยังไม่สะท้อน \"ความสอดคล้องของหลักเกณฑ์การจัดสรรทรัพยากร\" ระหว่างแผนแม่และแผนลูกอย่างเป็นรูปธรรม","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการจัดสรรทรัพยากร"],"tris":["กทท. \"ควรมีการแสดงถึงความเชื่อมโยงและความสอดคล้องระหว่างแผนบริหารความเสี่ยงระดับองค์กรและแผนแม่บทที่เกี่ยวข้องที่มีกระบวนการพิจารณาทรัพยากรเช่นเดียวกัน ทั้งในส่วนของ 'หลักเกณฑ์' ในการจัดสรรทรัพยากร และ 'ผล' การจัดสรรทรัพยากร\" (คำอธิบาย: TRIS ต้องการเห็นว่า กทท. ใช้มาตรฐานเดียวกันในการตัดสินใจให้งบ เช่น ถ้าองค์กรให้ความสำคัญกับโครงการที่ลดความเสี่ยงระดับ Extreme แผนแม่บท IT หรือแผน HR ก็ต้องนำเกณฑ์นี้ไปใช้เป็น priority ในการจัดสรรทรัพยากรของแผนตัวเองด้วย และต้องมีหลักฐานว่าผลการอนุมัติทรัพยากรสุดท้ายสนับสนุนเป้าหมายเหล่านั้นจริงๆ)"],"suggest":["ประกาศใช้ \"หลักเกณฑ์กลาง\" ในการจัดสรรทรัพยากร: ฝ่ายกลยุทธ์ต้องร่วมกับฝ่ายงบประมาณ กำหนดหลักเกณฑ์การให้คะแนนจัดลำดับความสำคัญ (Scoring Criteria) ที่ครอบคลุมและบังคับใช้เป็นมาตรฐานเดียวกันทั้งโครงการในแผนวิสาหกิจ, โครงการในแผน IT, โครงการในแผน HR และโครงการบริหารความเสี่ยง","จัดทำตาราง Resource Allocation Mapping (ระดับ 4): สรุปผลการจัดสรรทรัพยากรประจำปีให้เห็นภาพว่า งบประมาณ/อัตรากำลัง/ระบบ IT ที่อนุมัติไปทั้งหมด ถูกกระจายไปอุดหนุนยุทธศาสตร์กี่ % ไปอุดหนุนแผนดิจิทัลกี่ % และไปอุดหนุนแผนบริหารความเสี่ยงกี่ % อย่างเป็นรูปธรรม","กำหนด KPI ประเมินกระบวนการ SIPOC 6 (ระดับ 5): เช่น ตั้งตัวชี้วัดประเมิน \"ระยะเวลาในการพิจารณากลั่นกรองงบประมาณ\" หรือ \"ร้อยละของโครงการตามยุทธศาสตร์ที่ได้รับการอนุมัติทรัพยากร\" และจัดทำรายงานทบทวนกระบวนการในปีถัดไป"],"docs":["เอกสารประกาศ \"หลักเกณฑ์การจัดลำดับความสำคัญและจัดสรรทรัพยากร\" แบบบูรณาการ (Integrated Resource Allocation Criteria): ที่ระบุเกณฑ์การให้น้ำหนักคะแนนซึ่งสอดคล้องกับแผน IT และแผนความเสี่ยง","รายงานสรุปผลการจัดสรรทรัพยากรที่เชื่อมโยงกับแผนแม่บท (Resource Allocation Results Matrix): (เพื่อปิด Gap ระดับ 4)","แนวทางและรายงานผลการประเมินประสิทธิผลกระบวนการจัดสรรทรัพยากร: (เพื่อยืนยันคะแนนระดับ 5)"],"bestprac":["ทั้ง รฟม. และ กทพ. โดน TRIS ประเมินจุดอ่อนในลักษณะคล้ายกัน โดย รฟม. โดนข้อเสนอแนะเรื่อง \"ขาดความเชื่อมโยงสอดคล้องกับแผน IT และแผนความเสี่ยง\" เหมือน กทท. เป๊ะ นอกจากนี้ TRIS ได้ให้ข้อเสนอแนะ \"ขั้นแอดวานซ์\" กับทั้ง กทพ. และ รฟม. ว่าควรมีการนำระบบ EVM (Economic Value Management) มาใช้ในการจัดสรรทรัพยากร"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการวิเคราะห์และจัดสรรทรัพยากร รวมถึงกรอบเวลาในการดำเนินการ"],"2":["ทุกแผนงาน/โครงการ สามารถวิเคราะห์ถึงความต้องการในการใช้ทรัพยากรตามแบบฟอร์มที่กำหนดได้ครบถ้วนทุกองค์ประกอบ"],"3":["ฝ่ายงานที่เกี่ยวข้องกับการวิเคราะห์งบประมาณทำการรวบรวมและวิเคราะห์ความต้องการในการใช้ทรัพยากรและพิจารณาถึงความเพียงพอของทรัพยากรขององค์กร และจัดสรรงบประมาณได้ตามแผนงานที่กำหนด"],"4":["กระบวนการจัดสรรทรัพยากรสามารถแสดงได้ถึงความเชื่อมโยงและความสอดคล้องระหว่างแผนบริหารความเสี่ยงระดับองค์กรและแผนการบริหารเทคโนโลยีสารสนเทศ"],"5":["มีการประเมินประสิทธิผลของกระบวนการจัดสรรทรัพยากร และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการฯ"]},"subComps":{"2":["กับดัก \"วิเคราะห์ผลประโยชน์และความเสี่ยงไม่ครบ\" (Missing Cost-Benefit Check): จาก Feedback ของ กทท. เอง ผู้ตรวจชี้ว่าในทุกโครงการ/แผนงาน ไม่ใช่แค่ขอกำลังคนหรืองบประมาณ แต่ \"ต้องมีการวิเคราะห์ความเสี่ยง และผลประโยชน์ที่จะได้รับ (Cost-Benefit)\" กำกับไว้ในการขอจัดสรรทรัพยากรเสมอ เพื่อให้ฝ่ายพิจารณางบมั่นใจว่าให้เงินไปแล้วคุ้มค่าและจัดลำดับความสำคัญได้ถูกต้อง"],"3":["กับดัก \"ระบบ EVM และ Economic Profit\" (The EVM Trap): ถือเป็นข้อสอบบังคับที่ผู้ตรวจเน้นมาก! จาก Feedback Report ของ กทพ. และ รฟม. ผู้ตรวจระบุตรงกันว่า องค์กรควรมีกระบวนการบริหารจัดการแบบ Economic Value Management (EVM) โดยต้อง (1) จัดแบ่งโครงสร้างศูนย์ประเมินผล (ศูนย์ EVM) ให้ชัดเจน/ (2) มีการจัดทำต้นทุนปันส่วน (Allocated Cost) และราคาโอน (Transfer Pricing) ระหว่างศูนย์ EVM/ (3) คำนวณและกำหนดเป้าหมายค่า Economic Profit (EP) ของแต่ละศูนย์ EVM/ (4) นำค่า EP ไปเชื่อมโยงกับ \"แผนกลยุทธ์เพื่อปรับปรุงประสิทธิภาพ (SIP)\""],"4":["การบูรณาการหลักเกณฑ์การจัดสรรกับแผนอื่น (Alignment of Allocation Criteria): จาก Feedback ของ กทท. ผู้ตรวจแนะนำว่า การเชื่อมโยงกับแผนแม่บทอื่น (RM, DT, HR) ไม่ใช่แค่ส่งงบให้กัน แต่ต้อง \"บูรณาการถึงระดับหลักเกณฑ์ในการจัดสรรทรัพยากร\" หมายความว่า คณะกรรมการพิจารณางบประมาณ ต้องเอาเกณฑ์ของความเสี่ยง หรือเกณฑ์ของไอที มาเป็นส่วนหนึ่งในใบให้คะแนนโครงการด้วย"]},"scopeNote":"เน้นไปที่ \"ความสมเหตุสมผลและความเพียงพอของการให้ทรัพยากร\" โดยไม่ได้มองแค่เรื่อง \"เงินงบประมาณ\" เท่านั้น แต่มองรวมถึงทรัพยากร \"ที่ไม่ใช่ตัวเงิน\" (คน, IT, เวลา) ด้วย องค์กรต้องมีเกณฑ์การจัดลำดับความสำคัญของโครงการ (Prioritization) ที่ชัดเจน และในระดับสูง (Level 4) ต้องบังคับให้แผนไอที (DT) และแผนความเสี่ยง (RM) เข้ามาเป็นส่วนหนึ่งในกระบวนการตัดสินใจจัดสรรทรัพยากรร่วมกัน","actions":["ประกาศใช้ \"หลักเกณฑ์กลาง\" ในการจัดสรรทรัพยากร: ฝ่ายกลยุทธ์ต้องร่วมกับฝ่ายงบประมาณ กำหนดหลักเกณฑ์การให้คะแนนจัดลำดับความสำคัญ (Scoring Criteria) ที่ครอบคลุมและบังคับใช้เป็นมาตรฐานเดียวกันทั้งโครงการในแผนวิสาหกิจ, โครงการในแผน IT, โครงการในแผน HR และโครงการบริหารความเสี่ยง","จัดทำตาราง Resource Allocation Mapping (ระดับ 4): สรุปผลการจัดสรรทรัพยากรประจำปีให้เห็นภาพว่า งบประมาณ/อัตรากำลัง/ระบบ IT ที่อนุมัติไปทั้งหมด ถูกกระจายไปอุดหนุนยุทธศาสตร์กี่ % ไปอุดหนุนแผนดิจิทัลกี่ % และไปอุดหนุนแผนบริหารความเสี่ยงกี่ % อย่างเป็นรูปธรรม","กำหนด KPI ประเมินกระบวนการ SIPOC 6 (ระดับ 5): เช่น ตั้งตัวชี้วัดประเมิน \"ระยะเวลาในการพิจารณากลั่นกรองงบประมาณ\" หรือ \"ร้อยละของโครงการตามยุทธศาสตร์ที่ได้รับการอนุมัติทรัพยากร\" และจัดทำรายงานทบทวนกระบวนการในปีถัดไป"],"dimLevels":["มีแนวทาง/คู่มือ/ขั้นตอน (SIPOC) ในการวิเคราะห์และจัดสรรทรัพยากร พร้อมระบุกรอบเวลาที่ชัดเจน / มีการจัดทำ \"แบบฟอร์มคำขอจัดสรรทรัพยากร\" สำหรับให้ผู้ทำแผนงาน/โครงการกรอกข้อมูล","มิติบังคับ: \"ทุกแผนงาน/โครงการ\" มีการประเมินความต้องการทรัพยากรลงในแบบฟอร์ม / มิติความครบถ้วน: แบบฟอร์มต้องครอบคลุมการขอทรัพยากรทั้ง \"ที่เป็นตัวเงิน (งบประมาณ) และ ไม่ใช่ตัวเงิน (คน, IT, เวลา, สถานที่)\"","มิติการทำงานร่วม: ฝ่ายงานที่เกี่ยวข้อง (เช่น ฝ่ายกลยุทธ์, การเงิน, HR, IT) มีการประชุมร่วมกันเพื่อพิจารณา \"ความเพียงพอของทรัพยากรในภาพรวม\" / มิติการจัดลำดับ: มีการใช้ \"หลักเกณฑ์การจัดลำดับความสำคัญของโครงการ (Prioritization)\" มาเป็นตัวตัดสินใจในการจัดสรรงบประมาณ","มิติการเชื่อมโยง IT: มีหลักฐานยืนยันว่ากระบวนการจัดสรรทรัพยากรสอดคล้องกับ \"แผนปฏิบัติการดิจิทัล (DT)\" (เช่น โครงการไหนขอระบบ IT ต้องส่งข้อมูลให้ฝ่าย IT ไปทำแผนรองรับ) / มิติการเชื่อมโยง RM: มีหลักฐานยืนยันว่ากระบวนการจัดสรรทรัพยากรสอดคล้องกับ \"แผนบริหารความเสี่ยงระดับองค์กร (RM)\" (เช่น โครงการที่ได้งบมีความเสี่ยงอะไรบ้าง หรือการจัดสรรงบประมาณนี้ช่วยลดความเสี่ยงองค์กรข้อไหน)","มีแนวทางการประเมินประสิทธิผลของกระบวนการจัดสรรทรัพยากร / มีผลลัพธ์ของการประเมิน และนำไปปรับปรุงเกณฑ์
