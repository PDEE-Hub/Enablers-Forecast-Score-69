<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — SP การวางแผนเชิงกลยุทธ์ ปี 2569</title>
<style>
@font-face{font-family:'Anakotmai';font-weight:300;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-light.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:500;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-medium.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:700;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-bold.woff2') format('woff2');}
</style>
<style>
/* ── PAT Chili Bold Editorial ── */
:root{
  --bg:#faf6f0;--bg2:#fdf1de;--card:#ffffff;
  --border:#181410;--border-s:#efe8dc;
  --text:#181410;--text2:#5c5347;--text3:#9c9184;
  --navy:#1e3a5c;--gold:#f0a92e;
  --chili:#b8291c;--chili-d:#8f1f14;
  --lv1:#b8291c;--lv2:#e8623e;--lv3:#f0a92e;--lv4:#4d9e6e;--lv5:#1f7a4a;
  --shadow:4px 4px 0 var(--border);
  --shadow-h:6px 6px 0 var(--border);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Anakotmai',sans-serif;font-size:14px;color:var(--text);line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(24,20,16,.16) 1px, transparent 1px);
  background-size:16px 16px;
}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Anakotmai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--text);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:800;color:#fff;margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* HALFTONE DIVIDER */
.halftone{height:14px;flex-shrink:0;background-image:radial-gradient(var(--text) 2.8px, transparent 2.8px);background-size:10px 10px;background-position:0 -1px;}

/* DIM HEADER — hero band */
.dim-hd{background:var(--dim);color:#fff;border-bottom:3px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;overflow:hidden;}
.dim-hd::after{content:'🌶️';position:absolute;right:20px;top:50%;transform:translateY(-50%) rotate(12deg);font-size:44px;opacity:.5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));pointer-events:none;}
.dim-hd>*{position:relative;z-index:1;}
#dimTitle{font-size:16px;font-weight:800;}
#deltaChip{background:rgba(255,255,255,.92);padding:2px 9px;border-radius:20px;text-shadow:none;}

/* CHIPS */
.chip{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:700;white-space:nowrap;border:2px solid transparent;}
.cn{background:#fff;color:var(--text2);border-color:var(--text2);}
.ct{background:#fff;color:#0f7a3d;border-color:#0f7a3d;}
.cr{background:#fff;color:var(--chili-d);border-color:var(--chili-d);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 111px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:3px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--gold);color:var(--text);letter-spacing:.2px;border-bottom:3px solid var(--border);}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:2px solid var(--border-s);border-top:3px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:13px;font-weight:900;color:var(--chili-d);min-width:16px;}
.grp-name{font-size:12px;font-weight:700;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;border:1.5px solid var(--border-s);}
.chk-all{background:#e4f5e4;color:#1a7a4a;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1.5px solid var(--border-s);transition:background .12s;background:var(--card);}
.sub:hover{background:var(--bg2);}
.sub.focus-cg{background:#fff3e2;border-left:4px solid var(--dim, var(--chili));}
.sub.focus-cg .sub-target{border-left-color:var(--dim, var(--chili));}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;font-weight:500;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--border);}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border-s);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:800;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--chili-d);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--chili);box-shadow:0 0 0 2px rgba(184,41,28,.15);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1.5px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap;border:1.5px solid transparent;}
.s0{background:var(--bg2);color:var(--text3);border-color:var(--border-s);}
.s1{background:rgba(240,169,46,.18);color:#92400e;border-color:rgba(240,169,46,.4);}
.s2{background:rgba(31,122,74,.14);color:#0f7a55;border-color:rgba(31,122,74,.35);}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:3px solid var(--border);background:var(--card);flex-shrink:0;}
.cl-title{font-size:12px;font-weight:800;color:var(--chili-d);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--chili);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1.5px dashed var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--text);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:700;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:14px 16px;gap:14px;}
.frame{border:3px solid var(--border);border-radius:var(--radius);box-shadow:6px 6px 0 var(--border);overflow:hidden;background:var(--card);flex-shrink:0;}
.frame-hd{padding:10px 16px;font-size:12.5px;font-weight:800;border-bottom:3px solid var(--border);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:14px 16px;font-size:13px;line-height:1.7;}
.ftag{font-size:10px;padding:2px 9px;border-radius:8px;font-weight:900;}
.fa-hd{background:var(--chili);color:#fff;}.fa-tag{background:rgba(255,255,255,.3);color:#fff;}
.fb-hd{background:var(--gold);color:var(--text);}.fb-tag{background:rgba(0,0,0,.12);color:var(--text);}
.fc-hd{background:#1f7a4a;color:#fff;}.fc-tag{background:rgba(255,255,255,.25);color:#fff;}
.fd-hd{background:var(--navy);color:#fff;}.fd-tag{background:rgba(255,255,255,.25);color:#fff;}
.fe-hd{background:var(--navy);color:#fff;}.fe-tag{background:rgba(255,255,255,.25);color:#fff;}

.box{border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;border:1.5px solid var(--border-s);}
.box-red{background:rgba(184,41,28,.06);color:#7a1010;border-left:3px solid var(--chili);border-color:rgba(184,41,28,.2);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--chili-d);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;font-weight:700;}
.exp-btn:hover{background:var(--border-s);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg2);border-bottom:3px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:800;color:var(--chili-d);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:var(--bg2);border-left:4px solid var(--chili);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;border:1.5px solid var(--border-s);border-left:4px solid var(--chili);}
.cg-lvl-row{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--chili);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;}
.cg-lvl-summ .kt{font-weight:800;color:var(--chili-d);}
.cg-toggle{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);padding:0 4px;flex-shrink:0;}
.cg-lvl-detail{padding:8px 14px 10px;background:var(--bg2);border-top:1.5px dashed var(--border-s);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1.5px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:8px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--chili);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--chili);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 6px 6px 0;background:rgba(184,41,28,.05);line-height:1.55;}
.cg-prog-bar{height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;margin-bottom:8px;overflow:hidden;}
.cg-prog-fill{height:100%;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:8px;border:1.5px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:800;color:var(--chili-d);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:#f5e8cc;}
.doc-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--gold);color:var(--text);flex-shrink:0;border:1.5px solid var(--border);}
.doc-lvl-title{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1.5px solid var(--border-s);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:var(--chili-d);font-weight:800;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:var(--bg2);border:1.5px dashed var(--gold);border-radius:8px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:var(--bg2);border:1.5px solid var(--border-s);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--chili-d);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.doc-chk{flex-shrink:0;margin-top:2px;accent-color:var(--chili);width:15px;height:15px;cursor:pointer;}
.doc-progbar{height:6px;background:#fff;border:1.5px solid var(--border);border-radius:3px;overflow:hidden;margin:6px 0 4px;}
.doc-progbar-fill{height:100%;background:var(--lv5);transition:width .3s;}

/* FRAME E — Self-Assessment */
.sa-block{margin-bottom:8px;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.sa-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(31,122,74,.08);cursor:pointer;transition:background .12s;}
.sa-hd:hover{background:rgba(31,122,74,.14);}
.sa-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--lv5);color:#fff;flex-shrink:0;}
.sa-title{font-size:13px;font-weight:700;color:#0f7a55;flex:1;}
.sa-copy-btn{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--lv5);color:#fff;border:none;cursor:pointer;font-weight:700;white-space:nowrap;transition:opacity .15s;}
.sa-copy-btn:hover{opacity:.85;}
.sa-body{padding:12px 16px;display:none;background:var(--card);font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;font-family:'Anakotmai',sans-serif;border-top:1.5px solid var(--border-s);}
.sa-body.open{display:block;}
.sa-note{font-size:12px;color:var(--lv5);font-style:italic;margin-top:6px;padding-top:6px;border-top:1.5px dashed rgba(31,122,74,.3);}

/* ── Frame E dynamic ── */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;flex-wrap:wrap;border-bottom:1.5px solid var(--border-s);margin-bottom:8px;}
.fe-sect-lbl{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 5px;padding:0 2px;}
.fe-lvl-block{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s;}
.fe-lvl-block.fe-lvl-active{border-color:var(--lv5);}
.fe-lvl-block:hover{box-shadow:var(--shadow-h);}
.fe-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.fe-lvl-hd:hover{background:var(--bg2);}
.fe-lvl-badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:13px;color:var(--text);flex:1;line-height:1.35;}
.fe-doc-ref{font-size:10px;color:var(--text3);white-space:nowrap;}
.fe-lvl-body{padding:10px 14px 12px;background:var(--card);border-top:1.5px solid var(--border-s);display:none;}
.fe-lvl-body.open{display:block;}
.fe-sa-text{font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;font-family:'Anakotmai',sans-serif;background:var(--bg2);padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.fe-textarea{width:100%;font-size:13px;font-family:'Anakotmai',sans-serif;border:1.5px solid var(--border);border-radius:var(--radius);padding:7px 10px;background:#fff;color:var(--text);line-height:1.6;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:var(--chili);box-shadow:0 0 0 2px rgba(184,41,28,.15);}
.fe-cross-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.fe-cross-chip{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:800;}
.fe-gap-item{margin-bottom:8px;background:rgba(184,41,28,.04);border:1.5px solid rgba(184,41,28,.18);border-radius:8px;padding:8px 10px;}
.fe-gap-text{font-size:12px;color:#7a1010;margin-bottom:6px;line-height:1.5;}
.fe-gap-status{display:flex;gap:12px;flex-wrap:wrap;}
.fe-radio-lbl{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;color:var(--text2);}
.fe-radio-lbl input{accent-color:var(--chili);}
.fe-gap-note{margin-top:6px;}
.fe-copy-btn{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--lv5);color:#fff;border:none;cursor:pointer;font-weight:700;white-space:nowrap;transition:opacity .15s;float:right;}
.fe-copy-btn:hover{opacity:.85;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;}

  subs:[{"id":"1.1","grp":"1","gname":"การวิเคราะห์สภาพแวดล้อม","gw":20,"gs68":3.25,"name":"กระบวนการรวบรวมและวิเคราะห์ปัจจัยนำเข้าในการวางแผนยุทธศาสตร์","w":5,"s68":4,"status":"ยังไม่เริ่ม","statusNote":"","scope":"\"ระบบการสแกนและดึงข้อมูลสภาพแวดล้อม (Environmental Scanning)\" ทั้งจากภายในและภายนอกองค์กร เพื่อให้ทราบสถานะปัจจุบัน แนวโน้มความเสี่ยง ภัยคุกคาม และโอกาสทางธุรกิจ โดยผู้ตรวจจะประเมินตั้งแต่ความครอบคลุมของรายการข้อมูลที่นำมาใช้ ความเป็นปัจจุบัน (ทันกาล) การนำข้อมูลเหล่านั้นไปชี้เป้าเพื่อเขียนยุทธศาสตร์ได้จริง ไปจนถึงการบูรณาการให้ \"ทุกแผนแม่บทในองค์กร\" ใช้ฐานข้อมูลปัจจัยนำเข้าชุดเดียวกัน (Single Source of Truth) เพื่อไม่ให้ทิศทางของแผนลูกขัดแย้งกับแผนแม่","levelSumm":["มีคู่มือ แนวทาง หรือขั้นตอน (เช่น SIPOC) ที่ระบุกระบวนการรวบรวมและวิเคราะห์ข้อมูลปัจจัยนำเข้าอย่างชัดเจน","มีหลักฐานการดำเนินงานรวบรวมและวิเคราะห์ปัจจัยนำเข้าจริง ตามกระบวนการที่กำหนดไว้","มิติปัจจัยบังคับที่ 1: มีการวิเคราะห์ \"ปัจจัยความยั่งยืน (ESG)\"","มิติการบูรณาการด้านระยะเวลา (Timeline): การวิเคราะห์ปัจจัยนำเข้าของแผนองค์กร และแผนแม่บทที่เกี่ยวข้อง (เช่น HR, IT, RM) ดำเนินการในกรอบเวลาที่สอดคล้องกัน","มีแนวทางการประเมินประสิทธิผลของกระบวนการรวบรวมและวิเคราะห์ข้อมูล โดยมีการตั้งตัวชี้วัดกระบวนการ (KPI in Process)"],"good":["มีแนวทางในการรวบรวมและวิเคราะห์ปัจจัยนำเข้าที่สำคัญเพื่อนำมาประกอบการวางแผนยุทธศาสตร์อย่างเป็นระบบ โดยมีการระบุขั้นตอนและระยะเวลาดำเนินการที่ชัดเจนใน SIPOC 1 และ SIPOC 4","มีการสื่อสารและถ่ายทอดขั้นตอนการทบทวนแผนวิสาหกิจไปยังทุกหน่วยงานของ กทท. เพื่อให้จัดทำข้อมูลได้อย่างถูกต้องและครบถ้วน","มีการจัดทำปัจจัยนำเข้าที่ครบถ้วนทุกองค์ประกอบ เช่น แผนยุทธศาสตร์ภาครัฐ, ความนิยมของลูกค้า, การเปลี่ยนแปลงทางเทคโนโลยี, การวิเคราะห์ SWOT, การบริหารความเสี่ยง, ปัจจัยความยั่งยืน เป็นต้น","มีการหารือและสัมภาษณ์เชิงลึกกับผู้มีส่วนได้ส่วนเสียสำคัญ (เช่น หอการค้าไทย, สถาบัน MLI, ผู้ประกอบการ) เพื่อนำมาเป็นปัจจัยนำเข้า","มีการบูรณาการข้อมูลปัจจัยนำเข้าจากแผนยุทธศาสตร์องค์กร (แผนแม่) ลงสู่แผนแม่บทอื่นที่เกี่ยวข้อง (แผนลูก) เพื่อให้ทิศทางสอดคล้องกันอย่างชัดเจน (Alignment Strategy)"],"gaps":["การกำหนดแนวทางที่เป็นระบบในการประเมินประสิทธิผลของกระบวนการรวบรวมและวิเคราะห์ข้อมูลปัจจัยนำเข้า","การแสดงผลลัพธ์ที่เป็นรูปธรรมว่า หลังจากนำผลการประเมินมาปรับปรุงแล้ว กระบวนการดังกล่าวมีประสิทธิภาพหรือประสิทธิผลที่ดีขึ้นอย่างต่อเนื่อง","ความชัดเจนในการอธิบาย \"ที่มา\" ของการทบทวนกระบวนการ ว่าได้นำข้อบกพร่องใดมาเป็นปัจจัยในการปรับปรุง"],"results":["ระดับ 1-4 (ผ่านเกณฑ์): กทท. มีการระบุขั้นตอนรวบรวมข้อมูล, นำข้อมูลที่ครบถ้วนมาประกอบการทำแผน, มีความทันกาลและนำไปกำหนดยุทธศาสตร์ได้จริง, และแสดงให้เห็นถึงการบูรณาการข้อมูลปัจจัยนำเข้ากับแผนแม่บทอื่นที่เกี่ยวข้อง (มีหลักฐานประกอบครบถ้วน เช่น ตาราง 5W1H และตารางแสดงความเชื่อมโยงแผนแม่-แผนลูก)"],"tris":["ผู้ประเมิน TRIS สะท้อนว่า กทท. มีการรวบรวมและวิเคราะห์ปัจจัยนำเข้าที่ดีและเชื่อมโยงกับแผนแม่บทได้ แต่อย่างไรก็ตาม การอธิบายที่มาของการทบทวนกระบวนการยังไม่ชัดเจน โดย กทท. ควรมีการแสดงประสิทธิผลของการปรับปรุงกระบวนการที่นำมาเป็นปัจจัยตั้งต้นในการปรับปรุง และเมื่อปรับปรุงกระบวนการแล้ว จะต้องแสดงให้เห็นว่ามี \"ประสิทธิผลกระบวนการที่ดีขึ้นอย่างต่อเนื่อง\""],"suggest":["ควรกำหนดแนวทางและตัวชี้วัด (KPIs in process) ในการประเมินประสิทธิผลของกระบวนการรวบรวมปัจจัยนำเข้าอย่างชัดเจน เช่น ประเมินความรวดเร็วในการรวบรวมข้อมูล, ความครบถ้วนของข้อมูลที่ได้รับจากฝ่ายต่างๆ, หรือความแม่นยำของข้อมูล และนำผลลัพธ์นั้นมาวิเคราะห์หาสาเหตุของปัญหา นำไปสู่การปรับปรุงกระบวนการ (To-be process) ในปีถัดไป พร้อมแสดงหลักฐานว่าเมื่อปรับปรุงแล้ว กระบวนการรวดเร็วหรือมีประสิทธิภาพมากขึ้นจริง"],"docs":["เอกสารแนวทางการประเมินประสิทธิผลของกระบวนการ (SIPOC 1): ที่ระบุตัวชี้วัดของกระบวนการรวบรวมปัจจัยนำเข้า (Leading/Lagging Indicator)","รายงานสรุปผลการประเมินประสิทธิผลของกระบวนการ: ที่แสดงผลคะแนนหรือผลลัพธ์เทียบกับเป้าหมายที่ตั้งไว้ และระบุจุดอ่อน (Pain Point) ที่พบในกระบวนการปีที่ผ่านมา","หลักฐานการปรับปรุงกระบวนการ (Continuous Improvement): เช่น รายงานการประชุมทบทวน หรือ SIPOC ฉบับอัปเดต ที่แก้ไขขั้นตอนให้ดีขึ้น พร้อมแสดงผลเปรียบเทียบให้เห็นว่าผลลัพธ์ดีขึ้นกว่าเดิมอย่างไร (Before/After)"],"bestprac":["กทท. มีผลการดำเนินงานในหัวข้อนี้ (4.0000) ดีเทียบเท่า กทพ. และ สามารถดำเนินงานได้ดีกว่า รฟม."],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนดกระบวนการในการรวบรวมและวิเคราะห์ข้อมูล รวมถึงการนำปัจจัยที่สำคัญมาประกอบการวางแผนวิสาหกิจ/แผนยุทธศาสตร์ (แผนระยะยาว)"],"2":["รัฐวิสาหกิจมีการรวบรวมและวิเคราะห์ปัจจัยที่สำคัญมาประกอบการจัดทำแผนวิสาหกิจ/แผนยุทธศาสตร์ (ระยะยาว) ขององค์กรครบถ้วน"],"3":["ทุกปัจจัยที่ได้นำมาวิเคราะห์ โดยเฉพาะปัจจัยความยั่งยืน การบริหารความเสี่ยง ปัจจัยขับเคลื่อนมูลค่า และความสามารถในการนำแผนไปปฏิบัติให้สำเร็จ มีความทันกาลและสามารถแสดงถึงการนำไปกำหนดยุทธศาสตร์ขององค์กรได้จริง"],"4":["มีการบูรณาการกระบวนการระบุและวิเคราะห์ข้อมูลกับแต่ละฝ่ายงานที่รับผิดชอบอย่างชัดเจน ทั้งในระยะเวลาและคุณภาพของข้อมูล รวมถึงข้อมูลที่นำมาใช้ในการกำหนดแผนยุทธศาสตร์ต้องมีความสอดคล้องกับข้อมูลที่ปรากฏอยู่ในแผนแม่บทที่เกี่ยวข้อง"],"5":["มีการทบทวนกระบวนการการระบุและนำข้อมูลที่สำคัญมาใช้ในการวางแผนเชิงยุทธศาสตร์ โดยเน้นความทันกาล และความถูกต้องของข้อมูล"]},"subComps":{"2":["บังคับ \"ปัจจัยนำเข้า 9 ประการ\" : คำว่า \"ครบถ้วน\" ใน Level 2 หมายถึงการต้องมีปัจจัยนำเข้าตามที่คู่มือ SE-AM ระบุไว้อย่างน้อย 9 ข้อ ห้ามตกหล่น ได้แก่ (1) แผนยุทธศาสตร์ภาครัฐ/สคร. (2) สัญญาณบ่งชี้ที่ส่งผลกระทบต่อทิศทางองค์กร (3) ความนิยมของลูกค้าและตลาด (4) การเปลี่ยนแปลงทางเทคโนโลยี (5) การวิเคราะห์ SWOT (6) การบริหารความเสี่ยง (7) ปัจจัยขับเคลื่อนมูลค่าและแผนกลยุทธ์เพื่อปรับปรุงประสิทธิภาพ (8) ปัจจัยความยั่งยืน และ (9) ผลการดำเนินงานที่ผ่านมา"],"3":["กับดักเรื่อง \"ความทันกาล (Timeliness)\" : ผู้ตรวจจะมองหา \"วันที่ (Date) หรือ เดือน/ปี\" กำกับในเอกสารอ้างอิงของปัจจัยนำเข้าทุกตัว การนำเอาวิจัยเก่าหรือสถิติที่ล้าหลังมาใส่ในแผนโดยไม่มีการทบทวนให้เป็นปัจจุบัน จะถูกหักคะแนนมิตินี้ทันที","Traceability Matrix : คำว่า \"แสดงถึงการนำไปกำหนดยุทธศาสตร์ได้จริง\" องค์กรไม่สามารถเขียนลอยๆ ได้ แต่ต้องทำเป็น \"ตารางร่องรอย (Matrix)\" ที่จับคู่ระหว่าง Input Factor -> นำไปสู่ SWOT ข้อไหน -> นำไปสู่ Strategic Objective ข้อไหน อย่างชัดเจน"],"4":["Single Source of Truth : การบูรณาการข้อมูลไม่ได้แปลว่าต่างคนต่างหาข้อมูลมาเขียนแผนตัวเอง แต่หมายถึงฝ่ายกลยุทธ์ (SP) ต้องจัดทำ \"ชุดข้อมูลปัจจัยนำเข้ากลาง\" (เช่น ทำเป็นโฟลเดอร์ Google Drive รวม) แล้วจ่ายออกให้แผน HR, IT, RM นำไปใช้ตั้งต้นทำแผนลูก ซึ่งจะตอบโจทย์เรื่อง \"คุณภาพข้อมูล (Data Quality)\" ที่ตรงกันทุกแผน"],"5":["กับดักเรื่อง \"ความทันกาล (Timeliness)\" : ผู้ตรวจจะมองหา \"วันที่ (Date) หรือ เดือน/ปี\" กำกับในเอกสารอ้างอิงของปัจจัยนำเข้าทุกตัว การนำเอาวิจัยเก่าหรือสถิติที่ล้าหลังมาใส่ในแผนโดยไม่มีการทบทวนให้เป็นปัจจุบัน จะถูกหักคะแนนมิตินี้ทันที","KPI กระบวนการต้องเจาะจง : ในการประเมินกระบวนการ (Level 5) ผู้ตรวจจะดูว่า KPI ที่ตั้งไว้วัดอะไร หากตั้งแค่วัดว่า \"ทำเสร็จตามกำหนดหรือไม่\" จะไม่พอ แต่ต้องตั้ง KPI กระบวนการที่ชี้วัด \"ความทันกาล (Timeliness)\" และ \"ความถูกต้องของข้อมูล (Data Accuracy)\" ตามที่เกณฑ์ระบุไว้เป๊ะๆ เท่านั้น และต้องนำข้อบกพร่องมาวิเคราะห์เพื่อปรับปรุงกระบวนการในปีถัดไป"]},"scopeNote":"\"ระบบการสแกนและดึงข้อมูลสภาพแวดล้อม (Environmental Scanning)\" ทั้งจากภายในและภายนอกองค์กร เพื่อให้ทราบสถานะปัจจุบัน แนวโน้มความเสี่ยง ภัยคุกคาม และโอกาสทางธุรกิจ โดยผู้ตรวจจะประเมินตั้งแต่ความครอบคลุมของรายการข้อมูลที่นำมาใช้ ความเป็นปัจจุบัน (ทันกาล) การนำข้อมูลเหล่านั้นไปชี้เป้าเพื่อเขียนยุทธศาสตร์ได้จริง ไปจนถึงการบูรณาการให้ \"ทุกแผนแม่บทในองค์กร\" ใช้ฐานข้อมูลปัจจัยนำเข้าชุดเดียวกัน (Single Source of Truth) เพื่อไม่ให้ทิศทางของแผนลูกขัดแย้งกับแผนแม่","actions":["ควรกำหนดแนวทางและตัวชี้วัด (KPIs in process) ในการประเมินประสิทธิผลของกระบวนการรวบรวมปัจจัยนำเข้าอย่างชัดเจน เช่น ประเมินความรวดเร็วในการรวบรวมข้อมูล, ความครบถ้วนของข้อมูลที่ได้รับจากฝ่ายต่างๆ, หรือความแม่นยำของข้อมูล และนำผลลัพธ์นั้นมาวิเคราะห์หาสาเหตุของปัญหา นำไปสู่การปรับปรุงกระบวนการ (To-be process) ในปีถัดไป พร้อมแสดงหลักฐานว่าเมื่อปรับปรุงแล้ว กระบวนการรวดเร็วหรือมีประสิทธิภาพมากขึ้นจริง"],"dimLevels":["มีคู่มือ แนวทาง หรือขั้นตอน (เช่น SIPOC) ที่ระบุกระบวนการรวบรวมและวิเคราะห์ข้อมูลปัจจัยนำเข้าอย่างชัดเจน / มีการระบุแหล่งที่มาและรายการของปัจจัยที่จะนำมาวิเคราะห์ประกอบการทำแผนยุทธศาสตร์","มีหลักฐานการดำเนินงานรวบรวมและวิเคราะห์ปัจจัยนำเข้าจริง ตามกระบวนการที่กำหนดไว้ / ข้อมูลปัจจัยนำเข้าที่รวบรวมมา มีความ \"ครบถ้วน\" ตามที่คู่มือ สคร. กำหนด","มิติปัจจัยบังคับที่ 1: มีการวิเคราะห์ \"ปัจจัยความยั่งยืน (ESG)\" / มิติปัจจัยบังคับที่ 2: มีการวิเคราะห์ \"การบริหารความเสี่ยง\" / มิติปัจจัยบังคับที่ 3: มีการวิเคราะห์ \"ปัจจัยขับเคลื่อนมูลค่า (Value Drivers)\" / มิติปัจจัยบังคับที่ 4: มีการวิเคราะห์ \"ความสามารถในการนำแผนไปปฏิบัติให้สำเร็จ (Execution Capability)\" / มิติด้านความทันกาล (Timeliness): ปัจจัยนำเข้าทั้งหมดมีการระบุวันที่/ช่วงเวลาอัปเดตข้อมูลที่แสดงถึงความเป็นปัจจุบัน / มิติด้านการนำไปใช้จริง (Traceability): มีหลักฐานแสดงการเชื่อมโยงชัดเจนว่าปัจจัยนำเข้าแต่ละข้อ ถูกนำไปใช้กำหนดเป็นยุทธศาสตร์องค์กรข้อใด","มิติการบูรณาการด้านระยะเวลา (Timeline): การวิเคราะห์ปัจจัยนำเข้าของแผนองค์กร และแผนแม่บทที่เกี่ยวข้อง (เช่น HR, IT, RM) ดำเนินการในกรอบเวลาที่สอดคล้องกัน / มิติการบูรณาการด้านคุณภาพข้อมูล (Data Quality): มีกลไกการใช้ฐานข้อมูลปัจจัยนำเข้าร่วมกันระหว่างผู้ทำแผนยุทธศาสตร์และเจ้าของแผนแม่บท เพื่อให้เป็นข้อมูลชุดเดียวกัน / มิติความสอดคล้อง: มีหลักฐาน (เช่น Alignment Matrix) ยืนยันว่าปัจจัยนำเข้าที่ใช้ในแผนยุทธศาสตร์องค์กร สอดคล้องและไม่ขัดแย้งกับข้อมูลในแผนแม่บทอื่นๆ","มีแนวทางการประเมินประสิทธิผลของกระบวนการรวบรวมและวิเคราะห์ข้อมูล โดยมีการตั้งตัวชี้วัดกระบวนการ (KPI in Process) / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ โดยต้องเน้นชี้วัดในเรื่อง \"ความทันกาล\" และ \"ความถูกต้องของข้อมูล\" / มีหลักฐานการนำผลประเมินไปใช้ปรับปรุงกระบวนการทำงานให้มีประสิทธิภาพดีขึ้นอย่างเป็นรูปธรรม"]},{"id":"1.2","grp":"1","gname":"การวิเคราะห์สภาพแวดล้อม","gw":20,"gs68":3.25,"name":"กระบวนการวิเคราะห์ SWOT","w":10,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"การประเมินในข้อนี้ มุ่งเน้นไปที่ \"ความน่าเชื่อถือและการนำไปใช้จริงของ SWOT\" โดยองค์กรต้องใช้เครื่องมือวิเคราะห์ปัจจัยภายใน (เช่น 7S) และภายนอก (เช่น PESTEL) อย่างเป็นระบบ สิ่งสำคัญที่สุดคือ SWOT ทุกข้อห้ามเขียนขึ้นมาลอยๆ จากความรู้สึก (Gut feeling) แต่ต้องมีหลักฐานเชิงประจักษ์ (Evidence-based/Fact-based) และตัวเลขเปรียบเทียบกับคู่เทียบ (Benchmarking) สนับสนุนเสมอ รวมถึงต้องมีการนำจุดแข็ง-จุดอ่อนเหล่านั้น ไปบูรณาการเพื่อแก้ไขและพัฒนาในแผนแม่บทอื่นๆ (เช่น แผน HR, แผน IT) อย่างเป็นรูปธรรม","levelSumm":["มีคู่มือ/แนวทาง (เช่น SIPOC) ที่ระบุขั้นตอนกระบวนการวิเคราะห์ปัจจัยภายในและภายนอก (SWOT) อย่างชัดเจน","มีหลักฐานการดำเนินการวิเคราะห์ SWOT จริงตามขั้นตอนที่กำหนดไว้","มิติ Fact-based: SWOT \"ทุกข้อ\" มีข้อมูลเชิงประจักษ์/ตัวเลข สถิติ ประกอบการอธิบายอย่างชัดเจน","มีหลักฐานยืนยันว่า ข้อมูลจุดแข็ง/จุดอ่อน/โอกาส/อุปสรรค ถูกนำส่งและบูรณาการไปบรรจุเป็นเป้าหมายใน แผนแม่บทอื่น (Enablers) เช่น แผนบุคลากร แผนนวัตกรรม แผนดิจิทัล","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SWOT"],"good":["มีการกำหนดกระบวนการวิเคราะห์ปัจจัยภายใน (ด้วยหลักการ 7S) และปัจจัยภายนอก (ด้วยหลักการ PESTEL) อย่างเป็นระบบใน SIPOC 1 และ SIPOC","มีการบูรณาการข้อมูลปัจจัยนำเข้าที่ได้รับจากทุกหน่วยงานมาประมวลผลเป็น SWOT ขององค์กร และมีการอัปเดตข้อมูลให้ทันสถานการณ์","มีการนำข้อมูลคู่เทียบ (Best Practice) เข้ามาประกอบการพิจารณาเพื่อจัดทำข้อมูลอ้างอิงเชิงประจักษ์ (Evidence Base)","มีการจัดทำระบบการให้คะแนน (Ranking) โดยให้ผู้บริหารระดับสูงและผู้อำนวยการฝ่ายร่วมจัดลำดับความสำคัญของปัจจัย SWOT ผ่านหลักเกณฑ์ที่ชัดเจน","มีการบูรณาการผลการวิเคราะห์ SWOT เชื่อมโยงไปสู่ความท้าทายเชิงยุทธศาสตร์ (SC), ความได้เปรียบเชิงยุทธศาสตร์ (SA), ความสามารถพิเศษ (CC) และแผนแม่บทที่เกี่ยวข้อง (Alignment Strategy) ได้อย่างครบถ้วน"],"gaps":["ความน่าเชื่อถือของข้อมูลอ้างอิงเชิงประจักษ์ (Evidence Base): ในบางปัจจัยที่ กทท. วิเคราะห์และระบุว่าเป็น \"จุดแข็ง\" ยังขาดข้อมูลผลการดำเนินงานจริงที่สนับสนุน หรือข้อมูลขัดแย้งกับความเป็นจริงเมื่อเทียบกับคู่เทียบ","การประเมินประสิทธิผลของกระบวนการ: กทท. ยังไม่มีหลักฐานในระดับ 5 ที่แสดงให้เห็นถึงการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SWOT และการนำผลไปปรับปรุงกระบวนการให้ดีขึ้น"],"results":["ระดับ 1-2 (ผ่านเกณฑ์): ดำเนินการตามขั้นตอน วิเคราะห์ปัจจัยภายในภายนอกครบถ้วน และเป็นไปตามกรอบเวลาที่กำหนด","ระดับ 3 (ผ่านเกณฑ์แบบมีเงื่อนไข/ได้คะแนนไม่เต็ม): แม้ กทท. จะมีการจัดทำ Fact-Based / Evidence Base และเปรียบเทียบคู่เทียบ แต่ผู้ประเมินพบว่าข้อมูล Evidence Base ในบางปัจจัยขัดแย้งกับผลงานจริง จึงทำให้ระดับนี้ยังไม่สมบูรณ์","ระดับ 4 (ผ่านเกณฑ์): บูรณาการ SWOT กับยุทธศาสตร์ระดับองค์กรและแผนแม่บทต่างๆ ได้อย่างเป็นรูปธรรม","ระดับ 5 (ไม่ผ่านเกณฑ์): ขาดแนวทางและผลการประเมินประสิทธิผลของกระบวนการ"],"tris":["ผู้ประเมิน TRIS ระบุช่องว่างที่สำคัญมากในข้อนี้คือ \"การวิเคราะห์ Evidence Base ในบางปัจจัยยังไม่ชัดเจน\" ยกตัวอย่างเช่น กทท. ระบุว่าองค์กรมี \"จุดแข็ง\" คือการมีประสบการณ์และความชำนาญในการประกอบกิจการท่าเรือเทียบเท่ามาตรฐานสากล/ท่าเรือชั้นนำ แต่เมื่อ TRIS ไปพิจารณาดูรายละเอียดผลการดำเนินงานจริง กลับพบว่าผลงานของ กทท. ยังไม่เทียบเท่าค่าเฉลี่ยของคู่เทียบการระบุจุดแข็งที่ขัดแย้งกับตัวเลขจริงทำให้ความน่าเชื่อถือของ SWOT ลดลง"],"suggest":["ยกระดับความถูกต้องของ Evidence Base: กทท. ต้องทบทวนปัจจัย SWOT ทุกข้ออย่างเข้มงวด โดยเฉพาะ \"จุดแข็ง\" จะต้องมีหลักฐานตัวเลขผลการดำเนินงาน (Fact-Based) ที่พิสูจน์ได้ว่า กทท. ทำได้ดีกว่าค่าเฉลี่ยอุตสาหกรรมหรือคู่เทียบจริง หากปัจจัยใดคะแนนยังต่ำกว่าคู่เทียบ ควรถูกปรับให้เป็น \"จุดอ่อน\" หรือ \"ความท้าทาย\" แทน","ประเมินและทบทวนกระบวนการ: กำหนดตัวชี้วัด (KPI in process) ในการประเมินกระบวนการทำ SWOT เช่น ประเมินความแม่นยำของข้อมูลอ้างอิง หรือระยะเวลาในการจัดทำ และนำผลไปปรับปรุงกระบวนการ","กทท. ตกม้าตายในเรื่องความสอดคล้องของข้อมูลเชิงประจักษ์ (Evidence Base) แม้กระบวนการจัดทำแผน การประชุม และการเชื่อมโยงจะทำได้ดีเยี่ยมแล้วก็ตาม ดังนั้น ในปี 2569 กทท. ไม่จำเป็นต้องเปลี่ยนระบบการทำ SWOT ใหม่ แต่ต้อง \"คัดกรองข้อมูลดิบให้เป็น Fact-Based อย่างแท้จริง\" อะไรที่ไม่ใช่จุดแข็งเมื่อเทียบกับคู่แข่ง ห้ามใส่เป็นจุดแข็งเด็ดขาด และต้องสร้าง \"กลไกประเมินกระบวนการ\" เพิ่มเติมเพื่อมุ่งสู่คะแนนระดับ 4 หรือ 5 ต่อไป"],"docs":["รายงานการวิเคราะห์ SWOT เชิงลึก (Evidence Base ฉบับปรับปรุง): ที่แนบข้อมูลเปรียบเทียบกับคู่เทียบ (Benchmark) อย่างชัดเจนในทุกปัจจัย โดยเฉพาะจุดแข็งต้องมีตัวเลขสถิติยืนยัน","เอกสารแนวทางการประเมินประสิทธิผลกระบวนการวิเคราะห์ SWOT: พร้อมกำหนดตัวชี้วัด เช่น ร้อยละของความแม่นยำของข้อมูล Evidence Base","รายงานสรุปผลการประเมินกระบวนการวิเคราะห์ SWOT และหลักฐานการปรับปรุง: เช่น รายงานการประชุมเพื่อปรับปรุงคู่มือการวิเคราะห์สภาพแวดล้อม"],"bestprac":["กทพ. และ รฟม. มีกระบวนการดึงข้อมูลคู่เทียบมาใช้เป็น Fact-Based ในการระบุปัจจัย SWOT ที่ค่อนข้างแข็งแรงและไม่ขัดแย้งกับความเป็นจริง","จุดที่คู่เทียบและ กทท. ยังมี Gap เหมือนกัน (ในระดับ 5): ทั้ง กทพ. และ รฟม. ได้รับข้อเสนอแนะจาก TRIS ในทิศทางเดียวกันว่า \"ยังขาดการกำหนดแนวทางในการประเมินประสิทธิผลกระบวนการวิเคราะห์ SWOT ในทุกขั้นตอน รวมถึงการกำหนดตัวชี้วัด และการแสดงผลลัพธ์การปรับปรุงที่ดีขึ้นอย่างต่อเนื่อง"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการวิเคราะห์ปัจจัยภายในและภายนอก รวมถึงแหล่งที่มาของข้อมูลและกระบวนการเพื่อให้ได้มาซึ่งการวิเคราะห์ปัจจัยภายในและภายนอก"],"2":["รัฐวิสาหกิจได้ดำเนินการตามขั้นตอนที่สำคัญครบถ้วน และทุกขั้นตอนสามารถเป็นไปตามกระบวนการที่กำหนด รวมถึงมีการประเมินประสิทธิผลของทุกขั้นตอน และทุกขั้นตอนได้ประสิทธิผลตามที่กำหนด (ความครบถ้วนของปัจจัย, กระบวนการ, ผลผลิต, ระยะเวลาที่แล้วเสร็จ)"],"3":["รัฐวิสาหกิจได้ SWOT เพื่อประกอบการจัดทำแผนยุทธศาสตร์ โดยต้องสามารถอธิบายถึงข้อมูลประกอบ (Fact Based) ในแต่ละ S-W-O-T รวมถึงมีการคัดเลือกข้อมูลคู่เทียบเพื่อเป็นการประกอบการพิจารณา การระบุปัจจัยบวกและปัจจัยลบขององค์กร และมีการบูรณาการในแต่ละ S-W-O-T กับยุทธศาสตร์ขององค์กร"],"4":["SWOT สามารถเชื่อมโยงกับยุทธศาสตร์ และหัวข้ออื่นที่เกี่ยวข้อง เช่น แผนการบริหารทรัพยากรบุคคลมีความสัมพันธ์กับจุดแข็งหรือจุดอ่อนที่องค์กรระบุในด้านบุคลากร"],"5":["มีการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SWOT และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการ"]},"subComps":{"3":["กับดักการเคลมจุดแข็งลอยๆ (Fact-based Trap): จาก Feedback Report ปี 68 ของ กทท. ผู้ตรวจประเมินชี้ชัดว่า กทท. ระบุ \"ประสบการณ์และความชำนาญเทียบเท่าท่าเรือชั้นนำ\" เป็นจุดแข็ง แต่เมื่อดูข้อมูลเชิงลึก กลับพบว่าผลการดำเนินงานของ กทท. บางด้าน \"ยังไม่เทียบเท่าค่าเฉลี่ย\" ดังนั้น ห้ามเคลมจุดแข็งเด็ดขาดหากไม่มีสถิติยืนยันว่าเราเก่งกว่าคู่เทียบจริงๆ","กับดักความหลากหลายของคู่เทียบ (Benchmarking Trap): หากองค์กรเป็นผูกขาดและหาคู่เทียบที่เหมือนกันเป๊ะๆ (Apple-to-Apple) ไม่ได้ ผู้ตรวจฯ แนะนำว่าต้องนำตัวชี้วัดเรื่อง \"ผลิตภาพ (Productivity) และประสิทธิภาพ (Efficiency)\" ไปเทียบกับองค์กรชั้นนำอื่นๆ แทน ห้ามปล่อยช่องคู่เทียบว่างไว้เด็ดขาด","การจัดลำดับความสำคัญของ SWOT (Ranking) ถึงแม้จะไม่มีในข้อกำหนดเกณฑ์ของ สคร. แต่กลับไปโผล่อยู่ใน Feedback Report ของ หน่วยงานคู่เทียบอย่าง รฟม./กทพ. แต่อย่างไรก็ตาม กทท. ได้ดำเนินการเรียบร้อยแล้ว อ้างอิงจากข้อมูลการดำเนินงานของ กทท. (กระดาษคำตอบข้อ SP 1.2 ระดับ 3) กทท. ได้ระบุขั้นตอนไว้ชัดเจนว่า: \"...ฝ่ายกลยุทธ์องค์กรได้ดำเนินการวิเคราะห์ พร้อมจัดทำ SWOT ที่มีความครบถ้วนในทุกมิติ... จากนั้นจึงดำเนินการจัดส่งให้ผู้บริหารระดับสูง ผู้อำนวยการฝ่าย/สำนัก พิจารณาจัดลำดับความสำคัญ ผ่านหลักเกณฑ์การพิจารณาที่กำหนดไว้ ก่อนนำผลที่ได้มาดำเนินการวิเคราะห์และจัดทำรายละเอียดในกระบวนการถัดไป\" นอกจากนี้ กทท. ยังมีการตั้งชื่อหลักฐาน (Evidence) เพื่อใช้ส่งผู้ตรวจไว้เตรียมพร้อมแล้วในระบบด้วย"],"4":["คุณภาพของการบูรณาการแผนลูก (Integration Depth): การส่งอีเมลแจ้ง SWOT ให้แผน HR ทราบ ไม่นับเป็นการบูรณาการ ผู้ตรวจฯ ต้องการเห็นการ \"รับลูก\" เช่น ถ้า SWOT ระบุจุดอ่อนว่า \"บุคลากรขาดทักษะ IT\" แผน HR (HCM) ต้องมีโครงการ \"Upskill ทักษะ IT\" ปรากฏอยู่ในเล่มแผนอย่างเป็นรูปธรรม"],"5":["การอธิบายที่มาของการทบทวนกระบวนการ : จาก Feedback ของ กทท. ระบุว่าการจะผ่าน Level 5 ได้ ต้องแสดงให้เห็นว่า \"ประสิทธิผลของกระบวนการ SWOT ดีขึ้นอย่างต่อเนื่อง\" จากปีที่ผ่านมา (เช่น ใช้เวลาทำ SWOT ลดลง หรือ ข้อมูล Fact-based ถูกต้องแม่นยำขึ้น 100%) ไม่ใช่แค่ทำแบบประเมินกระบวนการเสร็จแล้วจบ"]},"scopeNote":"การประเมินในข้อนี้ มุ่งเน้นไปที่ \"ความน่าเชื่อถือและการนำไปใช้จริงของ SWOT\" โดยองค์กรต้องใช้เครื่องมือวิเคราะห์ปัจจัยภายใน (เช่น 7S) และภายนอก (เช่น PESTEL) อย่างเป็นระบบ สิ่งสำคัญที่สุดคือ SWOT ทุกข้อห้ามเขียนขึ้นมาลอยๆ จากความรู้สึก (Gut feeling) แต่ต้องมีหลักฐานเชิงประจักษ์ (Evidence-based/Fact-based) และตัวเลขเปรียบเทียบกับคู่เทียบ (Benchmarking) สนับสนุนเสมอ รวมถึงต้องมีการนำจุดแข็ง-จุดอ่อนเหล่านั้น ไปบูรณาการเพื่อแก้ไขและพัฒนาในแผนแม่บทอื่นๆ (เช่น แผน HR, แผน IT) อย่างเป็นรูปธรรม","actions":["ยกระดับความถูกต้องของ Evidence Base: กทท. ต้องทบทวนปัจจัย SWOT ทุกข้ออย่างเข้มงวด โดยเฉพาะ \"จุดแข็ง\" จะต้องมีหลักฐานตัวเลขผลการดำเนินงาน (Fact-Based) ที่พิสูจน์ได้ว่า กทท. ทำได้ดีกว่าค่าเฉลี่ยอุตสาหกรรมหรือคู่เทียบจริง หากปัจจัยใดคะแนนยังต่ำกว่าคู่เทียบ ควรถูกปรับให้เป็น \"จุดอ่อน\" หรือ \"ความท้าทาย\" แทน","ประเมินและทบทวนกระบวนการ: กำหนดตัวชี้วัด (KPI in process) ในการประเมินกระบวนการทำ SWOT เช่น ประเมินความแม่นยำของข้อมูลอ้างอิง หรือระยะเวลาในการจัดทำ และนำผลไปปรับปรุงกระบวนการ","กทท. ตกม้าตายในเรื่องความสอดคล้องของข้อมูลเชิงประจักษ์ (Evidence Base) แม้กระบวนการจัดทำแผน การประชุม และการเชื่อมโยงจะทำได้ดีเยี่ยมแล้วก็ตาม ดังนั้น ในปี 2569 กทท. ไม่จำเป็นต้องเปลี่ยนระบบการทำ SWOT ใหม่ แต่ต้อง \"คัดกรองข้อมูลดิบให้เป็น Fact-Based อย่างแท้จริง\" อะไรที่ไม่ใช่จุดแข็งเมื่อเทียบกับคู่แข่ง ห้ามใส่เป็นจุดแข็งเด็ดขาด และต้องสร้าง \"กลไกประเมินกระบวนการ\" เพิ่มเติมเพื่อมุ่งสู่คะแนนระดับ 4 หรือ 5 ต่อไป"],"dimLevels":["มีคู่มือ/แนวทาง (เช่น SIPOC) ที่ระบุขั้นตอนกระบวนการวิเคราะห์ปัจจัยภายในและภายนอก (SWOT) อย่างชัดเจน / มีการระบุเครื่องมือที่ใช้ (เช่น PESTEL, 7S) และ \"แหล่งที่มาของข้อมูล\" ที่นำมาใช้วิเคราะห์","มีหลักฐานการดำเนินการวิเคราะห์ SWOT จริงตามขั้นตอนที่กำหนดไว้ / มีการประเมินประสิทธิผลของกระบวนการ (KPI in Process) เช่น ความครบถ้วนของปัจจัย ผลผลิต และดำเนินการเสร็จสิ้นตามกรอบเวลาที่กำหนด","มิติ Fact-based: SWOT \"ทุกข้อ\" มีข้อมูลเชิงประจักษ์/ตัวเลข สถิติ ประกอบการอธิบายอย่างชัดเจน / มิติ Benchmarking: มีการคัดเลือก \"ข้อมูลคู่เทียบ\" มาเป็นเกณฑ์อ้างอิงประกอบการพิจารณาจุดแข็ง/จุดอ่อน / มิติ การระบุปัจจัย: มีการระบุปัจจัยบวก (S, O) และปัจจัยลบ (W, T) ขององค์กรอย่างครบถ้วน / มิติ การบูรณาการ: มีตาราง/แผนภาพ (เช่น TOWS Matrix) แสดงการจับคู่ S-W-O-T และโยงไปสู่การกำหนดยุทธศาสตร์ขององค์กร","มีหลักฐานยืนยันว่า ข้อมูลจุดแข็ง/จุดอ่อน/โอกาส/อุปสรรค ถูกนำส่งและบูรณาการไปบรรจุเป็นเป้าหมายใน แผนแม่บทอื่น (Enablers) เช่น แผนบุคลากร แผนนวัตกรรม แผนดิจิทัล","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SWOT / มีผลลัพธ์ของการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SWOT / มีหลักฐานการนำผลประเมินกระบวนการ (ข้อบกพร่องที่พบ) ไปปรับปรุงกระบวนการวิเคราะห์ SWOT ในปีถัดไป"]},{"id":"1.3","grp":"1","gname":"การวิเคราะห์สภาพแวดล้อม","gw":20,"gs68":3.25,"name":"กระบวนการวิเคราะห์ความท้าทาย/ความได้เปรียบเชิงยุทธศาสตร์ และความสามารถพิเศษองค์กร","w":5,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"ขอบเขตการประเมินในข้อนี้คือการ \"ต่อยอดจาก SWOT\" เพื่อเฟ้นหาว่า อะไรคืออุปสรรคที่ขัดขวางการบรรลุเป้าหมาย (Strategic Challenge: SC), อะไรคือแต้มต่อในการแข่งขัน (Strategic Advantage: SA) และอะไรคือสิ่งที่องค์กรทำได้เก่งที่สุดจนคู่แข่งเลียนแบบไม่ได้ (Core Competency: CC) สิ่งที่ผู้ตรวจจะเพ่งเล็งมากที่สุดคือ \"เครื่องมือที่ใช้สกัด CC (เช่น VRIO)\" และการนำ SC/SA/CC เหล่านี้ไปผูกกับยุทธศาสตร์องค์กรและแผนแม่บทฝ่ายต่างๆ เพื่อดึงศักยภาพออกมาใช้หรือเพื่ออุดรอยรั่ว","levelSumm":["มีคู่มือ/ขั้นตอนที่ระบุกระบวนการวิเคราะห์ SC, SA, CC อย่างชัดเจน พร้อมระบุแหล่งที่มาของข้อมูล","มีหลักฐานการดำเนินการวิเคราะห์ SC, SA, CC ครบถ้วนตามขั้นตอนและเครื่องมือที่กำหนด","มิติการเชื่อมโยง SWOT: มีตารางความสัมพันธ์ (Mapping) ที่แสดงให้เห็นว่า SC, SA, CC แต่ละข้อ ถูกดึงมาจากจุดแข็ง (S) จุดอ่อน (W) โอกาส (O) หรืออุปสรรค (T) ข้อใด","มีหลักฐานการนำ SC, SA, CC ถ่ายทอดและเชื่อมโยงลงไปสู่ \"แผนแม่บทที่เกี่ยวข้อง (Enablers)\" เช่น โยง SA ด้านเทคโนโลยี ไปสู่แผนดิจิทัล (DT) หรือ โยง SC ด้านบุคลากร ไปสู่แผนทรัพยากรบุคคล (HCM)\n พร้อมมีแผนงานหรือโครงการที่สำคัญมารองรับในแผนแม่บทนั้นๆ","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SC/SA/CC"],"good":["มีการกำหนดกระบวนการวิเคราะห์อย่างเป็นระบบผ่าน SIPOC 2 และ SIPOC 4","มีการใช้เครื่องมือที่ได้มาตรฐาน โดยนำผล SWOT มาวิเคราะห์ต่อยอดเป็น ความท้าทายเชิงยุทธศาสตร์ (SC) และความได้เปรียบเชิงยุทธศาสตร์ (SA) ด้วยเครื่องมือ TOWS Matrix","มีการวิเคราะห์ความสามารถพิเศษขององค์กร (CC) จากทรัพยากรและจุดแข็งภายในองค์กร ผ่านเครื่องมือ VRIO Framework พร้อมนำข้อมูลคู่แข่งมาเปรียบเทียบ","มีการนำเสนอผลการวิเคราะห์ในงานสัมมนาเชิงปฏิบัติการ (24 เม.ย. 2568) เพื่อให้ผู้บริหารและคณะกรรมการพิจารณา","มีการบูรณาการความสามารถพิเศษขององค์กร (CC) และความสามารถพิเศษที่ต้องการในอนาคต (FCC) เข้ากับแผนแม่บททรัพยากรบุคคล (HCM) เช่น การนำไปปรับปรุงกระบวนการทบทวนสมรรถนะ (Competency) และจัดทำโครงการ People Transformation"],"gaps":["การแสดงหลักฐานเชิงลึกถึงการนำประเด็น SC, SA และ CC ไปบูรณาการร่วมกับการวิเคราะห์สภาพแวดล้อมของ \"แผนแม่บทอื่นๆ\" ให้ครบถ้วนทุกแผนอย่างเป็นรูปธรรม","ระดับ 5: ขาดแนวทางประเมินประสิทธิผลของกระบวนการวิเคราะห์ SC, SA, CC รวมถึงขาดผลลัพธ์ว่าเมื่อประเมินแล้วได้นำข้อบกพร่องใดไปปรับปรุงกระบวนการวิเคราะห์ให้ดีขึ้น"],"results":["ระดับ 1-3 (ผ่านเกณฑ์): มีการกำหนดกระบวนการ ใช้เครื่องมือ TOWS/VRIO วิเคราะห์ได้ครบถ้วน และเชื่อมโยงประเด็น SC/SA/CC เข้ากับวัตถุประสงค์เชิงยุทธศาสตร์ขององค์กรได้ชัดเจน","ระดับ 4 (ผ่านเกณฑ์แบบได้คะแนนไม่เต็ม): แม้จะมีการเชื่อมโยงกับแผนทรัพยากรบุคคลได้ดี แต่การบูรณาการกับแผนแม่บทอื่นๆ ยังขาดความชัดเจนในรายละเอียดและข้อมูลที่ใช้","ระดับ 5 (ไม่ผ่านเกณฑ์): ยังไม่มีหลักฐานการประเมินประสิทธิผลของกระบวนการ และการนำผลไปปรับปรุง"],"tris":["ผู้ประเมิน TRIS ให้ข้อเสนอแนะที่สำคัญสำหรับ กทท. ในปี 2568 ว่า การบูรณาการข้อมูลและการเชื่อมโยง SC, SA, และ CC ลงสู่แผนแม่บท (Alignment) ยังทำได้ไม่ลึกพอ กทท. จำเป็นต้องแสดง \"รายละเอียด ขั้นตอน และข้อมูล\" ที่ใช้บูรณาการกับการวิเคราะห์สภาพแวดล้อมภายใน/ภายนอกของ \"แต่ละแผนแม่บท\" ให้ครบถ้วนทุกแผน นอกจากนี้ ต้องมีกลไกแสดงการสอบทานความครบถ้วนถูกต้องของข้อมูลในทุกปัจจัยด้วย"],"suggest":["เจาะลึกการถ่ายทอดสู่แผนแม่บท (Deep Alignment): ในการทำแผนปี 2569 ฝ่ายกลยุทธ์ต้องทำงานร่วมกับเจ้าของแผนแม่บททุกแผน (เช่น แผน IT, แผนนวัตกรรม, แผนลูกค้า) เพื่อแสดงให้เห็นว่าแผนแม่บทเหล่านั้น ได้ดึงเอา SC, SA, CC ขององค์กรไปเป็น \"ปัจจัยตั้งต้น\" ในการวิเคราะห์สภาพแวดล้อมของตนเองอย่างชัดเจน","สร้างกลไกประเมินกระบวนการ (Process Evaluation): กำหนดตัวชี้วัดเพื่อประเมินขั้นตอนการทำ VRIO และ TOWS Matrix เช่น ประเมินว่าข้อมูลที่นำมาวิเคราะห์มีความแม่นยำแค่ไหน หรือใช้เวลาเหมาะสมหรือไม่ แล้วนำผลไปปรับปรุงคู่มือ (SIPOC 2) ให้ดีขึ้น","หาก กทท. สามารถแสดงการเชื่อมโยง (Cascading) ของ SC/SA/CC ลงสู่ทุกแผนแม่บทได้อย่างเป็นเนื้อเดียวกัน (ไม่มีแผนใดตกหล่น) และเริ่มกระบวนการตั้ง KPI ประเมินการทำงานของฝ่ายกลยุทธ์เอง กทท. จะสามารถก้าวข้ามข้อจำกัดที่รัฐวิสาหกิจอื่นๆ มักจะติดหล่มในระดับ 3-4 ได้"],"docs":["ตารางเมทริกซ์เชื่อมโยง (Alignment Matrix) ฉบับสมบูรณ์: ที่แสดงการจับคู่ระหว่าง SC/SA/CC ขององค์กร กับบริบทของแต่ละแผนแม่บท (ให้เห็นว่าแผนลูกรับลูกจากแผนแม่อย่างไร)","เอกสารแนวทางการประเมินประสิทธิผลการวิเคราะห์ SC/SA/CC: ระบุ KPI in process ให้ชัดเจน","รายงานผลการทบทวนและปรับปรุงกระบวนการ: ภาพเปรียบเทียบ (Before/After) ของกระบวนการวิเคราะห์ SC/SA/CC ที่ดีขึ้นกว่าปีที่ผ่านมา"],"bestprac":["กทพ. ใช้เครื่องมือในลักษณะเดียวกันคือ TOWS Matrix สำหรับ SC/SA และ VRIO Model สำหรับ CC","จุดที่ กทท. และ กทพ. มี Gap เหมือนกัน: TRIS ให้ข้อสังเกตกับ กทพ. ในทำนองเดียวกันว่า ต้องแสดงความชัดเจนในการเชื่อมโยงข้อมูลสู่แผนแม่บท และต้องกำหนดแนวทางการประเมินประสิทธิผลกระบวนการ (ระดับ 5) พร้อมแสดงผลลัพธ์ที่ดีขึ้นอย่างต่อเนื่อง"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการวิเคราะห์ความท้าทาย/ความได้เปรียบเชิงยุทธศาสตร์ และความสามารถพิเศษขององค์กร รวมถึงแหล่งที่มาของข้อมูล... โดยเฉพาะหาก SC/SA/CC มีที่มาจาก SWOT ต้องสามารถกำหนดกระบวนการในการจัดลำดับความสำคัญ และนำมาวิเคราะห์โดยใช้เครื่องมือที่เหมาะสม"],"2":["รัฐวิสาหกิจได้ดำเนินการตามขั้นตอนที่สำคัญครบถ้วน และทุกขั้นตอนสามารถเป็นไปตามกระบวนการที่กำหนด รวมถึงมีการประเมินประสิทธิผลของทุกขั้นตอน และทุกขั้นตอนได้ประสิทธิผลตามที่กำหนด"],"3":["มีการบูรณาการในแต่ละความท้าทาย/ความได้เปรียบเชิงยุทธศาสตร์ และความสามารถพิเศษขององค์กร กับ SWOT วัตถุประสงค์เชิงยุทธศาสตร์ และยุทธศาสตร์ขององค์กร"],"4":["ความท้าทาย/ความได้เปรียบเชิงยุทธศาสตร์ และความสามารถพิเศษขององค์กรสามารถเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้อง เช่น แผนการบริหารทรัพยากรบุคคลมีความสัมพันธ์กับความได้เปรียบเชิงยุทธศาสตร์ที่องค์กรระบุในด้านบุคลากร หรือแผนแม่บทด้านนวัตกรรมมีความสัมพันธ์กับ SA ด้านการสร้างนวัตกรรม"],"5":["มีการประเมินประสิทธิผลของการวิเคราะห์ SC/SA/CC และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการ"]},"subComps":{"1":["ต้องใช้เครื่องมือ VRIO Model สำหรับหา CC : จาก กทท. ที่ได้ข้อเสนอแนะ ผู้ตรวจต้องการเห็นการใช้ VRIO Model เพื่อพิสูจน์ CC โดยต้องประเมิน 4 แกน คือ V (Value): สร้างมูลค่าเพิ่มให้องค์กรได้เท่าไหร่? R (Rarity): หายากและมีเพียงองค์กรเราแห่งเดียวใช่หรือไม่? (Fact-based) I (Imitability): ยากต่อการลอกเลียนแบบ ต้องใช้เวลามากกว่า 10-20 ปีใช่หรือไม่? O (Organization): ถูกฝังอยู่ในระบบองค์กร ไม่ได้ยึดติดกับตัวบุคคลใช่หรือไม่? (หากอ้าง CC ลอยๆ โดยไม่มีกรอบ VRIO กางให้ดู จะโดนหักคะแนนทันที)","การจัดลำดับความสำคัญ (Ranking): หาก SC (ความท้าทาย) มีหลายข้อ เกณฑ์ Level 1 บังคับซ่อนไว้ว่าต้องมี \"กระบวนการจัดลำดับความสำคัญ\" ว่าความท้าทายไหนวิกฤตที่สุดที่ต้องเร่งแก้ไข ไม่ใช่หยิบมาทำแผนทั้งหมดโดยไม่มีการจัด Priorities"],"2":["การแยกให้ออกระหว่าง SA กับ CC: องค์กรมักสับสน SA (ความได้เปรียบ) เช่น \"มีทำเลที่ตั้งดี\" หรือ \"มีสิทธิผูกขาดจากรัฐ\" ซึ่งสิ่งเหล่านี้ไม่ใช่ CC เพราะ CC ต้องเป็น \"ทักษะ/ความสามารถ (Capability/Skill) ที่ฝังอยู่ในองค์กร\" เช่น \"ความสามารถในการเชื่อมโยงระบบขนส่งแบบ Multimodal\"","การจัดลำดับความสำคัญ (Ranking): หาก SC (ความท้าทาย) มีหลายข้อ เกณฑ์ Level 1 บังคับซ่อนไว้ว่าต้องมี \"กระบวนการจัดลำดับความสำคัญ\" ว่าความท้าทายไหนวิกฤตที่สุดที่ต้องเร่งแก้ไข ไม่ใช่หยิบมาทำแผนทั้งหมดโดยไม่มีการจัด Priorities"],"3":["ต้องใช้เครื่องมือ VRIO Model สำหรับหา CC : จาก กทท. ที่ได้ข้อเสนอแนะ ผู้ตรวจต้องการเห็นการใช้ VRIO Model เพื่อพิสูจน์ CC โดยต้องประเมิน 4 แกน คือ V (Value): สร้างมูลค่าเพิ่มให้องค์กรได้เท่าไหร่? R (Rarity): หายากและมีเพียงองค์กรเราแห่งเดียวใช่หรือไม่? (Fact-based) I (Imitability): ยากต่อการลอกเลียนแบบ ต้องใช้เวลามากกว่า 10-20 ปีใช่หรือไม่? O (Organization): ถูกฝังอยู่ในระบบองค์กร ไม่ได้ยึดติดกับตัวบุคคลใช่หรือไม่? (หากอ้าง CC ลอยๆ โดยไม่มีกรอบ ไม่มีหลักฐานที่เป็น \"ข้อเท็จจริง (Fact-based)\" VRIO กางให้ดู จะโดนหักคะแนนทันที)","การวิเคราะห์ \"เวลา\" ในการเลียนแบบ (Imitability Trap): ตามคู่มือ SE-AM การจะเป็น CC ระดับสูงได้ องค์กรต้องพิสูจน์ได้ว่า \"คู่แข่งขันไม่มีทักษะ/ความสามารถดังกล่าว หากมีการลอกเลียนแบบจำเป็นต้องใช้เวลาไม่ต่ำกว่า 20 ปี\"","การแยกให้ออกระหว่าง SA กับ CC: องค์กรมักสับสน SA (ความได้เปรียบ) เช่น \"มีทำเลที่ตั้งดี\" หรือ \"มีสิทธิผูกขาดจากรัฐ\" ซึ่งสิ่งเหล่านี้ไม่ใช่ CC เพราะ CC ต้องเป็น \"ทักษะ/ความสามารถ (Capability/Skill) ที่ฝังอยู่ในองค์กร\" เช่น \"ความสามารถในการเชื่อมโยงระบบขนส่งแบบ Multimodal\""],"4":["คุณภาพของการเชื่อมโยงระดับ Level 4 (KPI Cascading): ข้อเสนอแนะของ กทท. ระบุชัดเจนว่า การบูรณาการ SC/SA/CC ลงสู่แผนแม่บทลูก \"ไม่ควรทำเพียงการจับคู่ (Mapping) ชื่อหัวข้อซ้าย-ขวาเท่านั้น ต้องแสดงการแบ่งแยกความเชื่อมโยงเป็น 2 ส่วนให้ชัดเจน คือ 1. ความสามารถหลักในปัจจุบัน (CCC) และ 2. ความสามารถที่ต้องการในอนาคต (FCC) พร้อมระบุโครงการในแผนลูกที่มารองรับอย่างเจาะจงตามบริบท"]},"scopeNote":"ขอบเขตการประเมินในข้อนี้คือการ \"ต่อยอดจาก SWOT\" เพื่อเฟ้นหาว่า อะไรคืออุปสรรคที่ขัดขวางการบรรลุเป้าหมาย (Strategic Challenge: SC), อะไรคือแต้มต่อในการแข่งขัน (Strategic Advantage: SA) และอะไรคือสิ่งที่องค์กรทำได้เก่งที่สุดจนคู่แข่งเลียนแบบไม่ได้ (Core Competency: CC) สิ่งที่ผู้ตรวจจะเพ่งเล็งมากที่สุดคือ \"เครื่องมือที่ใช้สกัด CC (เช่น VRIO)\" และการนำ SC/SA/CC เหล่านี้ไปผูกกับยุทธศาสตร์องค์กรและแผนแม่บทฝ่ายต่างๆ เพื่อดึงศักยภาพออกมาใช้หรือเพื่ออุดรอยรั่ว","actions":["เจาะลึกการถ่ายทอดสู่แผนแม่บท (Deep Alignment): ในการทำแผนปี 2569 ฝ่ายกลยุทธ์ต้องทำงานร่วมกับเจ้าของแผนแม่บททุกแผน (เช่น แผน IT, แผนนวัตกรรม, แผนลูกค้า) เพื่อแสดงให้เห็นว่าแผนแม่บทเหล่านั้น ได้ดึงเอา SC, SA, CC ขององค์กรไปเป็น \"ปัจจัยตั้งต้น\" ในการวิเคราะห์สภาพแวดล้อมของตนเองอย่างชัดเจน","สร้างกลไกประเมินกระบวนการ (Process Evaluation): กำหนดตัวชี้วัดเพื่อประเมินขั้นตอนการทำ VRIO และ TOWS Matrix เช่น ประเมินว่าข้อมูลที่นำมาวิเคราะห์มีความแม่นยำแค่ไหน หรือใช้เวลาเหมาะสมหรือไม่ แล้วนำผลไปปรับปรุงคู่มือ (SIPOC 2) ให้ดีขึ้น","หาก กทท. สามารถแสดงการเชื่อมโยง (Cascading) ของ SC/SA/CC ลงสู่ทุกแผนแม่บทได้อย่างเป็นเนื้อเดียวกัน (ไม่มีแผนใดตกหล่น) และเริ่มกระบวนการตั้ง KPI ประเมินการทำงานของฝ่ายกลยุทธ์เอง กทท. จะสามารถก้าวข้ามข้อจำกัดที่รัฐวิสาหกิจอื่นๆ มักจะติดหล่มในระดับ 3-4 ได้"],"dimLevels":["มีคู่มือ/ขั้นตอนที่ระบุกระบวนการวิเคราะห์ SC, SA, CC อย่างชัดเจน พร้อมระบุแหล่งที่มาของข้อมูล / มีการระบุ \"เครื่องมือที่ใช้ในการวิเคราะห์และจัดลำดับความสำคัญ (Ranking)\" อย่างชัดเจน โดยเฉพาะกรณีที่นำข้อมูลมาจาก SWOT (เช่น ระบุว่าใช้เครื่องมือ VRIO Model ในการหากรอง CC)","มีหลักฐานการดำเนินการวิเคราะห์ SC, SA, CC ครบถ้วนตามขั้นตอนและเครื่องมือที่กำหนด / มีการประเมินประสิทธิผลของกระบวนการวิเคราะห์ (KPI in Process) เช่น สามารถวิเคราะห์เสร็จตามกรอบเวลา และข้อมูลปัจจัยมีความครบถ้วน","มิติการเชื่อมโยง SWOT: มีตารางความสัมพันธ์ (Mapping) ที่แสดงให้เห็นว่า SC, SA, CC แต่ละข้อ ถูกดึงมาจากจุดแข็ง (S) จุดอ่อน (W) โอกาส (O) หรืออุปสรรค (T) ข้อใด / มิติการเชื่อมโยงยุทธศาสตร์: มีตารางแสดงการบูรณาการว่า SC, SA, CC แต่ละข้อ ถูกนำไปใช้กำหนดเป็น \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และ \"ยุทธศาสตร์องค์กร\" ข้อใด","มีหลักฐานการนำ SC, SA, CC ถ่ายทอดและเชื่อมโยงลงไปสู่ \"แผนแม่บทที่เกี่ยวข้อง (Enablers)\" เช่น โยง SA ด้านเทคโนโลยี ไปสู่แผนดิจิทัล (DT) หรือ โยง SC ด้านบุคลากร ไปสู่แผนทรัพยากรบุคคล (HCM)\n พร้อมมีแผนงานหรือโครงการที่สำคัญมารองรับในแผนแม่บทนั้นๆ","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ SC/SA/CC / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ / มีหลักฐานการนำข้อบกพร่องที่พบจากกระบวนการ ไปปรับปรุงหรือแก้ไขคู่มือการทำงานในปีถัดไป"]},{"id":"2.1","grp":"2","gname":"การวิเคราะห์ตำแหน่งทางยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การกำหนดตำแหน่งทางยุทธศาสตร์ (Strategic Positioning)","w":5,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่การตอบคำถามว่า \"องค์กรต้องการไปยืนอยู่จุดไหนในอนาคต?\" โดยบังคับให้ต้องวิเคราะห์แบ่งเป็น 3 ระยะ (สั้น กลาง ยาว) และที่สำคัญที่สุดคือ ต้องมีการทำ Gap Analysis เพื่อเปรียบเทียบระหว่าง \"ตำแหน่งในปัจจุบัน (As-Is)\" กับ \"ตำแหน่งในอนาคต (To-Be)\" เพื่อหาสิ่งที่องค์กรต้องดำเนินการเพิ่ม และถ่ายทอดหมุดหมายเหล่านั้นไปสู่แผนแม่บทอื่นๆ ให้เดินไปในจังหวะเวลาเดียวกัน","levelSumm":["มีคู่มือ/ขั้นตอนการทำงาน (SIPOC) ที่ระบุกระบวนการวิเคราะห์ Strategic Positioning อย่างชัดเจน","มีการระบุ \"กรอบระยะเวลา 3 ระยะ\" อย่างชัดเจน (เช่น ระยะสั้น 1-5 ปี, ระยะกลาง 5-10 ปี, ระยะยาว 10 ปีขึ้นไป) และระบุแหล่งข้อมูลที่ใช้ประกอบการวิเคราะห์","มิติการเชื่อมโยงทิศทาง: มีตารางความสัมพันธ์ (Mapping) ที่แสดงว่า Positioning ของแต่ละระยะ ถูกนำไปกำหนดเป็น \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และ \"ยุทธศาสตร์\" ข้อใด","มิติการเชื่อมโยงทิศทางระดับแผนลูก: มีหลักฐานการส่งต่อ Strategic Positioning ไปยังแผนแม่บทอื่น (Enablers) เช่น แผน IT, HR, นวัตกรรม","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนด Strategic Positioning"],"good":["มีกระบวนการและเครื่องมือชัดเจน (SIPOC 3 และ 4)","นำปัจจัยแวดล้อม (SWOT, ความท้าทาย, ความได้เปรียบ และความสามารถพิเศษขององค์กร) มาต่อยอดกำหนดเป้าหมายสู่วิสัยทัศน์ \"World Class Gateway Port\" ได้อย่างเป็นรูปธรรม","มีการแบ่งระยะเวลา (Milestone) ของ Strategic Positioning ออกเป็น 3 ระยะชัดเจน (ระยะสั้น ระยะกลาง และระยะยาว) พร้อมทั้งมีการนำ ข้อมูลคู่แข่ง/คู่เทียบ (Benchmark) มาเป็นข้อมูลประกอบในการตั้งเป้าหมาย","บูรณาการความสัมพันธ์ระหว่างตำแหน่งทางยุทธศาสตร์ในแต่ละระยะ เข้ากับวัตถุประสงค์เชิงยุทธศาสตร์ (SO) ขององค์กรได้อย่างชัดเจน","กทท. \"วางรากฐานได้ดีกว่าคู่เทียบ\" เพราะเป้าหมาย 3 ระยะชัดเจนและอิง Benchmark แล้ว (สอบผ่านระดับ 1-3 สบายๆ)"],"gaps":["การเชื่อมโยงลงสู่แผนลูก (Alignment Strategy): แม้ กทท. จะเชื่อมโยงตำแหน่งทางยุทธศาสตร์เข้ากับเป้าหมายระดับองค์กรได้ดี แต่ TRIS สะท้อนว่า \"การแสดงความเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้องยังไม่ชัดเจน\" โดย กทท. ควรแสดงความเชื่อมโยงทั้งในระดับทิศทางและการกำหนดเป้าหมายในแต่ละระยะลงไปใน \"ทุกแผนแม่บท\" อย่างเป็นรูปธรรม","ขาดการประเมินประสิทธิผล (ระดับ 5): ยังไม่มีการกำหนดแนวทางและตัวชี้วัดเพื่อประเมินประสิทธิผลของกระบวนการกำหนด Strategic Positioning รวมถึงขาดหลักฐานการนำผลไปปรับปรุงกระบวนการ"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนและเครื่องมือชัดเจนใน SIPOC 3 และ 4","ระดับ 2 (ผ่านเกณฑ์): กำหนดตำแหน่งเชิงยุทธศาสตร์ 3 ระยะ และใช้ข้อมูล Benchmark ในการตั้งเป้าหมายได้อย่างเป็นรูปธรรม","ระดับ 3 (ผ่านเกณฑ์): เชื่อมโยง Strategic Positioning เป้าหมายแต่ละระยะ กับ SO ขององค์กรได้ชัดเจน","ระดับ 4 (ไม่ผ่านเกณฑ์ / ผ่านแบบมีเงื่อนไข): กทท. ส่งหลักฐานตารางความเชื่อมโยงแผนแม่-แผนลูก และแบบฟอร์มให้แผนลูกกำหนด Vision/Mission ของตนเอง แต่ในมุมมองผู้ประเมิน รายละเอียดความเชื่อมโยงของเป้าหมายในแต่ละระยะลงสู่แผนแม่บทต่างๆ ยังไม่ชัดเจนและไม่ครบถ้วนเพียงพอ","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการส่งหลักฐานแนวทางการประเมินผลและการปรับปรุงกระบวนการ"],"tris":["ทั้ง กทท. ได้รับข้อเสนอแนะตรงกันเป๊ะจาก TRIS ว่า \"ควรมีการบูรณาการเชื่อมโยงตำแหน่งทางยุทธศาสตร์ขององค์กรกับแผนแม่บทต่างๆ ทั้งในระดับทิศทางและการกำหนดเป้าหมายอย่างครอบคลุมและครบถ้วน\"","การส่งไม้ต่อให้แผนลูกยังไม่เนียน\" ในปี 2569 กทท. เพียงแค่จัดการเรียกประชุมเจ้าของแผนแม่บททั้งหมด มาทำตาราง Mapping เป้าหมายระยะสั้น-กลาง-ยาว ให้สอดคล้องกับแผนวิสาหกิจให้ชัดเจนแบบไม่ต้องให้ผู้ประเมินตีความเอง คะแนนข้อ 2.1 ก็จะขยับขึ้นสู่ระดับ 4.0 หรือ 5.0 ได้ไม่ยาก"],"suggest":["ทำ Alignment Matrix เชิงลึก: กทท. ต้องจัดทำตารางความเชื่อมโยง (Matrix) ที่กางให้เห็นว่า Strategic Positioning ในระยะสั้น-กลาง-ยาว ขององค์กร ถูกแปลงไปเป็น \"ทิศทาง\" และ \"เป้าหมาย\" ของแผนแม่บทรายแผน (เช่น แผน HR, แผน IT, แผนนวัตกรรม, แผนลูกค้า) อย่างไรแบบจุดต่อจุด เพื่อปิด Gap ในระดับ 4","เริ่มประเมินกระบวนการ (KPI in Process): ควรกำหนดตัวชี้วัดประเมินความสำเร็จของ SIPOC 3 เช่น ความสอดคล้องของเป้าหมายกับสถานการณ์จริง หรือระยะเวลาในการจัดทำ และนำผลไปปรับปรุง SIPOC ในปีถัดไป เพื่อมุ่งสู่คะแนนระดับ 5"],"docs":["ตารางแสดงความเชื่อมโยงตำแหน่งเชิงยุทธศาสตร์และเป้าหมายในแต่ละระยะ ระหว่างแผนวิสาหกิจกับทุกแผนแม่บท (ฉบับอัปเดต): ที่แสดงรายละเอียดระดับเป้าหมาย (KPI & Target) ของแผนลูกที่ล้อไปกับแผนแม่ในทั้ง 3 ระยะ","เอกสารคู่มือประเมินผลกระบวนการ SIPOC 3: ที่ระบุ Leading/Lagging Indicator","รายงานการประชุมทบทวนและปรับปรุงกระบวนการ SIPOC 3: ภาพเปรียบเทียบ Before/After ว่ากระบวนการตั้งเป้าหมายดีขึ้นหรือแม่นยำขึ้นอย่างไร"],"bestprac":["กทท. มีผลการดำเนินงานในหัวข้อนี้ ดีกว่า กทพ. และ รฟม."],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการวิเคราะห์ตำแหน่งทางยุทธศาสตร์ (Strategic Positioning) ขององค์กร ทั้งในระยะสั้น ระยะกลาง และระยะยาว รวมถึงแหล่งที่มาของข้อมูลเพื่อให้ได้มาซึ่งการวิเคราะห์"],"2":["รัฐวิสาหกิจได้ดำเนินการตามขั้นตอนที่สำคัญครบถ้วน และทุกขั้นตอนสามารถเป็นไปตามกระบวนการที่กำหนด รวมถึงมีการประเมินประสิทธิผลของทุกขั้นตอน และทุกขั้นตอนได้ประสิทธิผลตามที่กำหนด"],"3":["มีการบูรณาการในแต่ละ Strategic Positioning และเป้าหมายในแต่ละระยะ กับวัตถุประสงค์เชิงยุทธศาสตร์ และยุทธศาสตร์ขององค์กร"],"4":["Strategic Positioning สามารถเชื่อมโยงกับหัวข้ออื่นที่เกี่ยวข้อง โดยเชื่อมโยงทั้งในระดับทิศทาง และการกำหนดเป้าหมายในแต่ละระยะ"],"5":["มีการประเมินประสิทธิผลของกระบวนการกำหนด Strategic Positioning ขององค์กร และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก Gap Analysis : แม้ใน Minimum Requirement จะไม่เขียนคำว่า Gap Analysis แต่ในหน้าคำอธิบายเกณฑ์ SE-AM ระบุชัดเจนว่า \"...จะทำให้เกิดการเปรียบเทียบระหว่างตำแหน่งในปัจจุบัน และตำแหน่งในอนาคต เพื่อวิเคราะห์หาสิ่งที่องค์กรต้องดำเนินการเพิ่ม (Gap Analysis)\" หากส่งแต่ภาพตำแหน่งอนาคต โดยไม่มีหน้าสไลด์ที่แสดง Gap Analysis จะโดนหารคะแนนทิ้งทันที"],"3":["กับดัก \"ทิศทางที่จับต้องไม่ได้\" (The Concrete Target Trap ): จาก Feedback Report ของ กทพ. ระบุชัดเจนว่า แม้ กทพ. จะแบ่งระยะเวลาชัดเจนและเชื่อมโยงกับยุทธศาสตร์แล้ว แต่โดนหักคะแนนเพราะ \"ควรมีการกำหนดเป้าหมายและตัวชี้วัดที่เป็นรูปธรรม\" ดังนั้น ใน Dashboard ต้องบังคับให้แนบหลักฐาน \"ตาราง KPI ของ Strategic Positioning แต่ละระยะ\" ด้วย","การซิงค์กรอบเวลากับแผนการเงิน (Financial Scenario Alignment): จาก Feedback Report ของ รฟม. ผู้ตรวจแนะนำว่า การทำฉากทัศน์จำลอง (Scenario Planning) โดยเฉพาะด้านการเงิน \"ต้องจัดทำขึ้นตามกรอบระยะเวลา 3 ช่วง เช่นเดียวกับ Strategic Positioning\" หากแผนกลยุทธ์บอกว่าระยะกลางคือ 5-10 ปี แผนการเงินก็ต้องทำตัวเลขคาดการณ์ไปถึง 5-10 ปีให้ตรงกัน"],"4":["การซิงค์กรอบเวลากับแผนการเงิน (Financial Scenario Alignment): จาก Feedback Report ของ รฟม. ผู้ตรวจแนะนำว่า การทำฉากทัศน์จำลอง (Scenario Planning) โดยเฉพาะด้านการเงิน \"ต้องจัดทำขึ้นตามกรอบระยะเวลา 3 ช่วง เช่นเดียวกับ Strategic Positioning\" หากแผนกลยุทธ์บอกว่าระยะกลางคือ 5-10 ปี แผนการเงินก็ต้องทำตัวเลขคาดการณ์ไปถึง 5-10 ปีให้ตรงกัน","การบูรณาการด้านการสร้างมูลค่า (Value Creation Linkage): จาก Feedback ของ กทพ. ผู้ตรวจมองหาว่ากระบวนการกำหนด Strategic Positioning ได้ถูกนำไปสอดคล้องกับ \"กระบวนการทำ Value Creation และ Value Enhancement\" หรือไม่ (ซึ่งจุดนี้ กทท. สามารถโยงเข้ากับเรื่อง VRIO/CC ที่เราทำไปในข้อ 1.3 ได้เลยครับว่าเราวาง Position อนาคตไว้บนฐานของการสร้าง Value ใหม่ๆ)"]},"scopeNote":"มุ่งเน้นไปที่การตอบคำถามว่า \"องค์กรต้องการไปยืนอยู่จุดไหนในอนาคต?\" โดยบังคับให้ต้องวิเคราะห์แบ่งเป็น 3 ระยะ (สั้น กลาง ยาว) และที่สำคัญที่สุดคือ ต้องมีการทำ Gap Analysis เพื่อเปรียบเทียบระหว่าง \"ตำแหน่งในปัจจุบัน (As-Is)\" กับ \"ตำแหน่งในอนาคต (To-Be)\" เพื่อหาสิ่งที่องค์กรต้องดำเนินการเพิ่ม และถ่ายทอดหมุดหมายเหล่านั้นไปสู่แผนแม่บทอื่นๆ ให้เดินไปในจังหวะเวลาเดียวกัน","actions":["ทำ Alignment Matrix เชิงลึก: กทท. ต้องจัดทำตารางความเชื่อมโยง (Matrix) ที่กางให้เห็นว่า Strategic Positioning ในระยะสั้น-กลาง-ยาว ขององค์กร ถูกแปลงไปเป็น \"ทิศทาง\" และ \"เป้าหมาย\" ของแผนแม่บทรายแผน (เช่น แผน HR, แผน IT, แผนนวัตกรรม, แผนลูกค้า) อย่างไรแบบจุดต่อจุด เพื่อปิด Gap ในระดับ 4","เริ่มประเมินกระบวนการ (KPI in Process): ควรกำหนดตัวชี้วัดประเมินความสำเร็จของ SIPOC 3 เช่น ความสอดคล้องของเป้าหมายกับสถานการณ์จริง หรือระยะเวลาในการจัดทำ และนำผลไปปรับปรุง SIPOC ในปีถัดไป เพื่อมุ่งสู่คะแนนระดับ 5"],"dimLevels":["มีคู่มือ/ขั้นตอนการทำงาน (SIPOC) ที่ระบุกระบวนการวิเคราะห์ Strategic Positioning อย่างชัดเจน / มีการระบุ \"กรอบระยะเวลา 3 ระยะ\" อย่างชัดเจน (เช่น ระยะสั้น 1-5 ปี, ระยะกลาง 5-10 ปี, ระยะยาว 10 ปีขึ้นไป) และระบุแหล่งข้อมูลที่ใช้ประกอบการวิเคราะห์","มีการระบุ \"กรอบระยะเวลา 3 ระยะ\" อย่างชัดเจน (เช่น ระยะสั้น 1-5 ปี, ระยะกลาง 5-10 ปี, ระยะยาว 10 ปีขึ้นไป) และระบุแหล่งข้อมูลที่ใช้ประกอบการวิเคราะห์ / มีการประเมินประสิทธิผลของกระบวนการ (KPI in Process) เช่น ดำเนินการเสร็จตามกำหนดเวลา ข้อมูลนำเข้ามีความครบถ้วน / มิติบังคับ: มีหลักฐานการทำ \"Gap Analysis\" เพื่อเปรียบเทียบตำแหน่งปัจจุบันกับตำแหน่งอนาคตที่ต้องการบรรลุ","มิติการเชื่อมโยงทิศทาง: มีตารางความสัมพันธ์ (Mapping) ที่แสดงว่า Positioning ของแต่ละระยะ ถูกนำไปกำหนดเป็น \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และ \"ยุทธศาสตร์\" ข้อใด / มิติเป้าหมายรูปธรรม: มีการกำหนด \"ตัวชี้วัด (KPI) และค่าเป้าหมายที่เป็นตัวเลขรูปธรรม\" กำกับอยู่ใน Strategic Positioning ของทุกระยะ (ห้ามเขียนบรรยายลอยๆ)","มิติการเชื่อมโยงทิศทางระดับแผนลูก: มีหลักฐานการส่งต่อ Strategic Positioning ไปยังแผนแม่บทอื่น (Enablers) เช่น แผน IT, HR, นวัตกรรม / มิติการเชื่อมโยงเป้าหมาย: แผนแม่บทลูก (Enablers) มีการกำหนด \"เป้าหมายรายระยะ (สั้น-กลาง-ยาว)\" ที่สอดรับกับตำแหน่งทางยุทธศาสตร์ขององค์กรแม่","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนด Strategic Positioning / มีผลลัพธ์ของการประเมิน (รายงานผลตาม KPI in Process) / มีหลักฐานการนำผลประเมินหรือข้อบกพร่อง ไปปรับปรุงกระบวนการ/คู่มือทำงานในปีถัดไป"]},{"id":"2.2","grp":"2","gname":"การวิเคราะห์ตำแหน่งทางยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การวิเคราะห์ Business Model ภายใต้การเปลี่ยนแปลงของสภาพแวดล้อมการแข่งขัน รวมถึงการกำหนด Intelligent Risk","w":2.5,"s68":2,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นที่การออกแบบ \"รูปแบบธุรกิจ (Business Model)\" เพื่อตอบคำถามว่า องค์กรจะส่งมอบคุณค่า (Value Proposition) อะไรให้ลูกค้ากลุ่มไหน จะหารายได้และบริหารต้นทุนอย่างไร เพื่อให้สามารถก้าวไปยืนใน \"ตำแหน่งทางยุทธศาสตร์ (Strategic Positioning)\" ที่ตั้งไว้ในข้อ 2.1 ได้สำเร็จ ควบคู่ไปกับการวิเคราะห์ \"Intelligent Risk (ความเสี่ยงเพื่อเข้าถึงโอกาส)\" ว่าการจะเปลี่ยนโมเดลธุรกิจใหม่นั้น องค์กรพร้อมจะรับความเสี่ยงอะไรบ้างที่คำนวณมาดีแล้ว เพื่อแลกกับโอกาสในการเติบโตอย่างก้าวกระโดด","levelSumm":["มีคู่มือ/กระบวนการในการกำหนด Business Model และระบุ Intelligent Risk อย่างชัดเจน","มีหลักฐานการจัดทำ Business Model ที่สอดคล้องและเหมาะสมกับ \"แต่ละตำแหน่งเชิงยุทธศาสตร์\" ที่กำหนดไว้","มีตาราง/แผนภาพเชื่อมโยง (Mapping) ระหว่าง Business Model และ Intelligent Risk เข้ากับ \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และ \"ยุทธศาสตร์องค์กร\" อย่างเป็นรูปธรรม","มิติการบูรณาการ BM: มีหลักฐานการถ่ายทอดองค์ประกอบใน Business Model ไปยังแผนแม่บทที่เกี่ยวข้อง เช่น ถ่ายทอดเรื่องกลุ่มลูกค้า ให้แผน SCM หรือ ถ่ายทอดเรื่อง Key Resources ไปให้แผน HCM และ DT","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ BM และระบุ IR"],"good":["มีการกำหนดกระบวนการวิเคราะห์ Business Model และการระบุ Intelligent Risk ไว้ชัดเจนใน SIPOC 3 และ SIPOC 4 (ขั้นตอนที่ 11)","มีการทบทวน Business Model Canvas (BMC) โดยพยายามเชื่อมโยงองค์ประกอบต่างๆ กับแผนแม่บทอื่น เช่น กำหนดให้ Key Partner สอดคล้องกับกลุ่มผู้มีส่วนได้ส่วนเสียในแผนยุทธศาสตร์ด้านผู้มีส่วนได้ส่วนเสีย (SM) และกำหนด Customer Segment ให้สอดคล้องกับแผนยุทธศาสตร์ลูกค้าและตลาด (CM)","มีการระบุความเสี่ยงเพื่อเข้าถึงโอกาสทางธุรกิจ (Intelligent Risk) และจัดส่งข้อมูลดังกล่าวให้สำนักบริหารความเสี่ยงฯ (สสค.) นำไปเป็นปัจจัยนำเข้าในการจัดทำ Risk Universe และแผนบริหารความเสี่ยงประจำปี 2569 ได้สำเร็จ"],"gaps":["ขาดการจัดทำ BMC แยกเป็น 3 ระยะ (3 Business Models): กทท. จำเป็นต้องทำการกำหนด Business Model แยกออกเป็น 3 ภาพอย่างชัดเจน (ระยะสั้น ระยะกลาง และระยะยาว) เพื่อแสดงให้เห็นถึงประเด็นขององค์ประกอบสำคัญที่จะมีการเปลี่ยนแปลงและสอดคล้องกับเป้าหมายตำแหน่งทางยุทธศาสตร์ของแต่ละระยะ","ขาดความสอดคล้องขององค์ประกอบภายใน BMC เอง: TRIS ระบุชัดเจนว่า กทท. ยังไม่สามารถแสดงถึงความเชื่อมโยงของแต่ละองค์ประกอบที่สำคัญในการผลักดันไปถึงตำแหน่งเชิงยุทธศาสตร์ เช่น เมื่อ กทท. กำหนดเป้าหมายในระยะกลางและระยะยาวว่าจะมี \"Value Proposition (คุณค่าที่ส่งมอบ)\" ที่เปลี่ยนแปลงไป แต่ในกระดานวิเคราะห์กลับพบว่า \"มิติด้านลูกค้า (Customer Segment)\" กลับไม่มีรายละเอียดที่เปลี่ยนแปลงตามไปด้วยอย่างชัดเจน ซึ่งถือเป็นข้อขัดแย้งทางตรรกะของ Business Model","ขาดการวิเคราะห์ Intelligent Risk ที่เชื่อมโยงสู่เป้าหมายที่แท้จริง: กทท. ควรมีการวิเคราะห์และบริหารจัดการ Intelligent Risk (ความเสี่ยงเพื่อเข้าถึงโอกาสทางธุรกิจ) ที่อาจเกิดขึ้นต่อทิศทางการดำเนินงานขององค์กรอย่างลึกซึ้งยิ่งขึ้น เพื่อให้มั่นใจได้ว่า กทท. จะสามารถบรรลุเป้าหมายในแต่ละระยะได้อย่างแท้จริง","ขาดการประเมินประสิทธิผลกระบวนการ: กทท. ยังขาดการกำหนดแนวทาง ตัวชี้วัด และการรายงานผลลัพธ์ในการประเมินกระบวนการวิเคราะห์ BMC และ Intelligent Risk รวมถึงขาดหลักฐานการปรับปรุงกระบวนการอย่างต่อเนื่อง (ระดับ 5)"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการกำหนดขั้นตอนการวิเคราะห์ Business Model และระบุ Intelligent Risk ไว้ใน SIPOC 3 (กระบวนการกำหนดตำแหน่งทางยุทธศาสตร์) และเป็นส่วนหนึ่งของ SIPOC 4 (กระบวนการจัดทำ/ทบทวนแผนยุทธศาสตร์ ขั้นตอนที่ 11)","ระดับ 2 (ผ่านเกณฑ์): กทท. ได้ทบทวน Business Model Canvas (BMC) ให้สอดรับกับเป้าหมาย 3 ระยะ (สั้น กลาง ยาว) โดยวิเคราะห์ Key Partner ให้สอดคล้องกับแผนผู้มีส่วนได้ส่วนเสีย (SM) และ Customer Segment ให้สอดคล้องกับแผนลูกค้า (CM) รวมถึงมีการระบุ Intelligent Risk และส่งข้อมูลให้สำนักบริหารความเสี่ยงฯ (สสค.) นำไปประกอบการจัดทำ Risk Universe ประจำปี 2569","ระดับ 3 (ผ่านเกณฑ์): มีการแสดงความเชื่อมโยงและบูรณาการระหว่าง Business Model และ Intelligent Risk เข้ากับตำแหน่งเชิงยุทธศาสตร์ (SP) และวัตถุประสงค์เชิงยุทธศาสตร์ (SO) ขององค์กร","ระดับ 4 (ผ่านเกณฑ์แบบมีเงื่อนไข/ได้คะแนนไม่เต็ม): ฝ่ายกลยุทธ์องค์กรได้สื่อสารรูปแบบการดำเนินธุรกิจภายใต้ BMC ในแต่ละระยะไปยังเจ้าของแผนแม่บท เพื่อตรวจสอบความสัมพันธ์กับกลุ่มผู้มีส่วนได้ส่วนเสีย 10 กลุ่ม (แผน SM) และลูกค้า 3 กลุ่ม (แผน CM) รวมถึงเชื่อมโยงไปยังแผนแม่บท HR เพื่อทบทวนอัตรากำลัง และแผนบริหารความเสี่ยง (RM) พร้อมจัดทำตารางแสดงความสอดคล้องของ Value Proposition, KPI และ Intelligent Risk แต่อย่างไรก็ตาม ในมุมมองของ TRIS องค์ประกอบหลายอย่างยังไม่สมบูรณ์และขาดความชัดเจน","ระดับ 5 (ไม่ผ่านเกณฑ์): กทท. ไม่ได้นำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ Business Model และระบุ Intelligent Risk รวมถึงไม่มีเอกสารการนำผลประเมินไปปรับปรุงกระบวนการ"],"tris":["องค์ประกอบใน Business Model ไม่สะท้อนการเปลี่ยนแปลงตามระยะเวลา: TRIS ระบุชัดเจนว่า กทท. ยังไม่มีการวิเคราะห์ถึงองค์ประกอบสำคัญที่จะช่วยผลักดันความสำเร็จไปสู่ตำแหน่งเชิงยุทธศาสตร์ (Strategic Positioning) ได้อย่างแท้จริง","ความขัดแย้งของข้อมูลใน BMC: ยกตัวอย่างเช่น ในเป้าหมายระยะกลางและระยะยาว กทท. มีการกำหนด Value Proposition (คุณค่าที่ส่งมอบ) ที่เปลี่ยนแปลงและพัฒนาขึ้น แต่ในกระดาน BMC กลับพบว่า \"มิติด้านลูกค้า (Customer Segment) ไม่มีรายละเอียดที่เปลี่ยนแปลงในแต่ละระยะที่ชัดเจน\" ซึ่งในความเป็นจริง หากคุณค่าที่ส่งมอบเปลี่ยนไป กลุ่มลูกค้าหรือความต้องการของลูกค้าก็ควรจะต้องพัฒนาหรือขยายขอบเขตตามไปด้วย","Intelligent Risk ยังไม่ชัดเจน: ควรมีการวิเคราะห์และบริหารจัดการ Intelligent Risk ที่อาจเกิดขึ้นต่อทิศทางการดำเนินงานให้ลึกซึ้งกว่านี้ เพื่อสร้างความมั่นใจว่า กทท. จะบรรลุเป้าหมายในแต่ละระยะได้จริง","เนื่องจากทุกรัฐวิสาหกิจมักทำ BMC เป็นเพียง \"ภาพรวมภาพเดียว\" ทำให้ผู้ประเมินมองว่าไม่สะท้อนการเปลี่ยนแปลง ดังนั้น หากในปี 2569 กทท. เป็นองค์กรแรกที่กาง Business Model ออกเป็น 3 ภาพ (3 Business Models) ตามที่ TRIS แนะนำได้อย่างเป็นรูปธรรม กทท. จะมีความโดดเด่นและสามารถคว้าคะแนนระดับ 3.0 - 4.0"],"suggest":["TRIS ได้ให้ข้อเสนอแนะเร่งด่วน (Quick Win) ว่า กทท. จำเป็นต้องทำการกำหนด Business Model ออกเป็น \"3 Business Models\" (แยกเป็นระยะสั้น ระยะกลาง และระยะยาว) อย่างชัดเจน รวมถึงประเด็นที่จะมีการเปลี่ยนแปลงของแต่ละระยะต้องสอดคล้องกับตำแหน่งทางยุทธศาสตร์ในระยะนั้นๆ เช่น กระบวนการดำเนินงาน จุดเด่นของผลิตภัณฑ์ และกลุ่มผู้มีส่วนได้ส่วนเสียที่อาจเปลี่ยนไปเมื่อองค์กรยกระดับขึ้น"],"docs":["รายงาน Business Model Canvas (BMC) ฉบับ 3 ระยะ (Short, Mid, Long Term): แยกกระดาน BMC ออกเป็น 3 แผ่นอย่างชัดเจน พร้อมทำตารางเปรียบเทียบ (Evolution) ว่าแต่ละช่องของ BMC เช่น ลูกค้า พันธมิตร หรือรายได้ เปลี่ยนแปลงไปอย่างไรเมื่อ กทท. ก้าวสู่ระยะถัดไป","ตารางเชื่อมโยง Intelligent Risk กับ BMC 3 ระยะ: ระบุให้ชัดเจนว่าการจะเปลี่ยนผ่าน BMC จากระยะสั้น ไปสู่ระยะกลาง กทท. ต้องยอมรับ \"ความเสี่ยงอัจฉริยะ (Intelligent Risk)\" เรื่องใดบ้าง และมีแผนรับมืออย่างไร","รายงานการบูรณาการ Business Model สู่แผนแม่บท (ระดับ 4): แสดงหลักฐานว่า BMC ที่แยก 3 ระยะนี้ ถูกนำไปใช้ปรับปรุงแผนลูกค้า (CM), แผนนวัตกรรม (IM), หรือแผนปฏิบัติการอื่นๆ อย่างไร"],"bestprac":["ในหัวข้อนี้ ทั้ง กทพ. และ รฟม. ประสบปัญหาแบบเดียวกัน โดย TRIS ให้ Feedback กับ กทพ. ว่า \"Business Model ที่กำหนดขึ้นยังมีความไม่ชัดเจนในหลายองค์ประกอบ ซึ่งอาจส่งผลให้ไม่บรรลุเป้าหมาย\" และให้ Feedback กับ รฟม. ด้วยประโยคเดียวกันว่า \"Business Model ที่ รฟม. กำหนดขึ้นยังมีความไม่ชัดเจนในหลายองค์ประกอบ\""],"minReqs":{"1":["จากตำแหน่งเชิงยุทธศาสตร์ขององค์กร เริ่มมีการวิเคราะห์ถึงองค์ประกอบที่สำคัญในการกำหนดเป็น Business Model เช่น กระบวนการดำเนินงาน การกำหนดจุดเด่นของผลิตภัณฑ์และบริการ การวิเคราะห์กลุ่มผู้มีส่วนได้ส่วนเสีย"],"2":["มีการวิเคราะห์ Business Model และระบุ Intelligent Risk ที่เหมาะสมในการบรรลุเป้าหมายในแต่ละตำแหน่งเชิงยุทธศาสตร์ขององค์กร โดยผู้มีส่วนได้เสียที่เกี่ยวข้องได้ร่วมกำหนด Business Model และ Intelligent Risk"],"3":["มีการบูรณาการ Business Model และ Intelligent Risk กับวัตถุประสงค์เชิงยุทธศาสตร์ และยุทธศาสตร์ขององค์กร"],"4":["สามารถแสดงถึงความเชื่อมโยงของ Business Model และ Intelligent Risk กับกระบวนการหรือแผนแม่บทที่เกี่ยวข้อง"],"5":["มีการประเมินประสิทธิผลของการวิเคราะห์ Business Model และระบุ Intelligent Risk พร้อมทบทวนถึงการปรับปรุงกระบวนการ"]},"subComps":{"1":["ข้อมูลเชิงปริมาณใน Business Model (Quantitative Canvas): จากบทเรียนของ กทพ. ผู้ตรวจแนะนำว่า Business Model Canvas ต้องไม่เขียนแค่ตัวหนังสือบรรยาย แต่ \"ควรแสดงรายละเอียดเชิงตัวเลขที่สำคัญ\" เช่น โครงสร้างต้นทุน (Cost Structure) จำนวนเงินเท่าไหร่, หรือ กระแสรายได้ (Revenue Stream) คาดหวังเท่าไหร่ เพื่อใช้เป็นฐานส่งต่อไปทำ Scenario Planning ในข้อ 2.3 ต่อไป","ที่มาของ Intelligent Risk (The IR Origin Trap): คู่มือ SE-AM ระบุไว้ชัดเจนมากว่า การวิเคราะห์ Intelligent Risk คือการวิเคราะห์เพื่อ \"สอดรับกับโอกาสทางธุรกิจที่ระบุใน SWOT\" ดังนั้น IR ที่เขียนขึ้นมา ต้องสามารถลากเส้นกลับไปอ้างอิงกับ ปัจจัยตัว \"O (Opportunity)\" ในข้อ 1.2 ให้ได้ หาก IR ลอยมาโดยไม่ได้มาจาก O จะถือว่าผิดหลักการครับ"],"2":["กับดัก \"BM โมเดลเดียวใช้ทั้งชาติ\" (The Single Model Trap ): จาก Feedback Report ของ กทท. ปีล่าสุด ผู้ตรวจระบุข้อบกพร่องไว้อย่างชัดเจนว่า \"กทท. จำเป็นต้องทำการกำหนด Business Model ออกเป็น 3 Business Models\" เพื่อให้สอดคล้องกับตำแหน่งทางยุทธศาสตร์ในแต่ละระยะ (ระยะสั้น ระยะกลาง ระยะยาว) การส่ง Canvas แค่แผ่นเดียวจะถูกหักคะแนนทิ้งทันที","วิวัฒนาการที่ไม่สมเหตุสมผล (Static Elements Trap): ผู้ตรวจคอมเมนต์ กทท. ต่อเนื่องว่า เมื่อทำเป็น 3 ระยะแล้ว \"ประเด็นที่จะมีการเปลี่ยนแปลงของแต่ละระยะต้องชัดเจน\" เช่น ระยะยาวระบุว่าจะเปลี่ยน Value Proposition ใหม่ แต่มิติด้านกลุ่มลูกค้า (Customer Segment) กลับระบุข้อมูลเหมือนเดิมเป๊ะ ซึ่งย้อนแย้งกันเองในการทำธุรกิจ","ข้อมูลเชิงปริมาณใน Business Model (Quantitative Canvas): จากบทเรียนของ กทพ. ผู้ตรวจแนะนำว่า Business Model Canvas ต้องไม่เขียนแค่ตัวหนังสือบรรยาย แต่ \"ควรแสดงรายละเอียดเชิงตัวเลขที่สำคัญ\" เช่น โครงสร้างต้นทุน (Cost Structure) จำนวนเงินเท่าไหร่, หรือ กระแสรายได้ (Revenue Stream) คาดหวังเท่าไหร่ เพื่อใช้เป็นฐานส่งต่อไปทำ Scenario Planning ในข้อ 2.3 ต่อไป","ที่มาของ Intelligent Risk (The IR Origin Trap): คู่มือ SE-AM ระบุไว้ชัดเจนมากว่า การวิเคราะห์ Intelligent Risk คือการวิเคราะห์เพื่อ \"สอดรับกับโอกาสทางธุรกิจที่ระบุใน SWOT\" ดังนั้น IR ที่เขียนขึ้นมา ต้องสามารถลากเส้นกลับไปอ้างอิงกับ ปัจจัยตัว \"O (Opportunity)\" ในข้อ 1.2 ให้ได้ หาก IR ลอยมาโดยไม่ได้มาจาก O จะถือว่าผิดหลักการครับ","ต้องระบุ \"สาเหตุ\" ของความเสี่ยงด้วย (Root Cause of IR): จากคำแนะนำที่ กทพ. และ รฟม. ได้รับ การเขียนระบุ Intelligent Risk ต้องไม่เขียนแค่ชื่อความเสี่ยง แต่บังคับว่าต้อง \"ระบุให้ทราบถึงสาเหตุของความเสี่ยงที่ชัดเจน\" เพื่อให้ฝ่ายบริหารความเสี่ยง (RM) นำไปบริหารจัดการต่อได้จริง"]},"scopeNote":"มุ่งเน้นที่การออกแบบ \"รูปแบบธุรกิจ (Business Model)\" เพื่อตอบคำถามว่า องค์กรจะส่งมอบคุณค่า (Value Proposition) อะไรให้ลูกค้ากลุ่มไหน จะหารายได้และบริหารต้นทุนอย่างไร เพื่อให้สามารถก้าวไปยืนใน \"ตำแหน่งทางยุทธศาสตร์ (Strategic Positioning)\" ที่ตั้งไว้ในข้อ 2.1 ได้สำเร็จ ควบคู่ไปกับการวิเคราะห์ \"Intelligent Risk (ความเสี่ยงเพื่อเข้าถึงโอกาส)\" ว่าการจะเปลี่ยนโมเดลธุรกิจใหม่นั้น องค์กรพร้อมจะรับความเสี่ยงอะไรบ้างที่คำนวณมาดีแล้ว เพื่อแลกกับโอกาสในการเติบโตอย่างก้าวกระโดด","actions":["TRIS ได้ให้ข้อเสนอแนะเร่งด่วน (Quick Win) ว่า กทท. จำเป็นต้องทำการกำหนด Business Model ออกเป็น \"3 Business Models\" (แยกเป็นระยะสั้น ระยะกลาง และระยะยาว) อย่างชัดเจน รวมถึงประเด็นที่จะมีการเปลี่ยนแปลงของแต่ละระยะต้องสอดคล้องกับตำแหน่งทางยุทธศาสตร์ในระยะนั้นๆ เช่น กระบวนการดำเนินงาน จุดเด่นของผลิตภัณฑ์ และกลุ่มผู้มีส่วนได้ส่วนเสียที่อาจเปลี่ยนไปเมื่อองค์กรยกระดับขึ้น"],"dimLevels":["มีคู่มือ/กระบวนการในการกำหนด Business Model และระบุ Intelligent Risk อย่างชัดเจน / มีการวิเคราะห์องค์ประกอบสำคัญของ Business Model (เช่น การใช้เครื่องมือ Business Model Canvas) ที่ครอบคลุม กระบวนการทำงาน (Key Activities), จุดเด่นผลิตภัณฑ์/บริการ (Value Proposition), และกลุ่มผู้มีส่วนได้ส่วนเสีย/ลูกค้า","มีหลักฐานการจัดทำ Business Model ที่สอดคล้องและเหมาะสมกับ \"แต่ละตำแหน่งเชิงยุทธศาสตร์\" ที่กำหนดไว้ / มีการระบุ Intelligent Risk ที่สอดรับกับตำแหน่งเชิงยุทธศาสตร์และ Business Model นั้นๆ / มิติการมีส่วนร่วม: มีหลักฐาน (เช่น รายงานการประชุม/สัมมนา) แสดงว่า \"กลุ่มผู้มีส่วนได้ส่วนเสีย (Stakeholders)\" ได้เข้ามามีส่วนร่วมกำหนด Business Model และ Intelligent Risk","มีตาราง/แผนภาพเชื่อมโยง (Mapping) ระหว่าง Business Model และ Intelligent Risk เข้ากับ \"วัตถุประสงค์เชิงยุทธศาสตร์ (SO)\" และ \"ยุทธศาสตร์องค์กร\" อย่างเป็นรูปธรรม","มิติการบูรณาการ BM: มีหลักฐานการถ่ายทอดองค์ประกอบใน Business Model ไปยังแผนแม่บทที่เกี่ยวข้อง เช่น ถ่ายทอดเรื่องกลุ่มลูกค้า ให้แผน SCM หรือ ถ่ายทอดเรื่อง Key Resources ไปให้แผน HCM และ DT / มิติการบูรณาการ IR: มีหลักฐานยืนยันว่าข้อมูล Intelligent Risk ได้ถูกส่งต่อไปเป็น \"ปัจจัยนำเข้า (Input)\" ให้กับ \"แผนบริหารความเสี่ยง (RM)\" เพื่อบรรจุลงใน Risk Universe ขององค์กรเรียบร้อยแล้ว","มีแนวทางการประเมินประสิทธิผลของกระบวนการวิเคราะห์ BM และระบุ IR / มีผลลัพธ์ของการประเมินประสิทธิผลกระบวนการ / มีหลักฐานการนำผลประเมินไปใช้ปรับปรุงคู่มือ/กระบวนการในปีถัดไป"]},{"id":"2.3","grp":"2","gname":"การวิเคราะห์ตำแหน่งทางยุทธศาสตร์","gw":10,"gs68":2.25,"name":"การวิเคราะห์ Scenario Planning","w":2.5,"s68":1,"status":"ยังไม่เริ่ม","statusNote":"","scope":"เน้นไปที่ \"การพยากรณ์ตัวเลขทางการเงินล่วงหน้า (Financial Forecasting)\" โดยใช้ผลจากการวิเคราะห์สภาพแวดล้อมมาทำ Sensitivity Analysis เพื่อดูความอ่อนไหวของปัจจัยต่างๆ ผู้ตรวจต้องการเห็นว่าองค์กรได้จำลองสถานการณ์ล่วงหน้า (อย่างน้อย 3 รูปแบบ: เลวร้ายที่สุด, ปกติ, ดีที่สุด) พร้อมระบุสมมติฐานตัวเลขที่ชัดเจน และนำผลที่ได้มาวิเคราะห์ความคุ้มค่า (Cost-Benefit) เพื่อตัดสินใจเลือกกลยุทธ์ รวมถึงต้องมีแผนสำรองเพื่อสกัดกั้นไม่ให้องค์กรตกลงไปสู่สถานการณ์ที่เลวร้ายที่สุด (Worst Case)","levelSumm":["มีกระบวนการ/คู่มือ การจัดทำประมาณการผลประกอบการทางการเงิน","มิติด้านสถานการณ์: มีการจัดทำประมาณการทางการเงินโดยแบ่งออกเป็น \"แต่ละสถานการณ์ (Scenarios)\" (เช่น Worst Case, Base Case, Best Case)","มิติการกำหนดยุทธศาสตร์: มีหลักฐานแสดงการนำผลจำลองสถานการณ์ทางการเงิน มากางดูเพื่อเลือก \"กำหนดยุทธศาสตร์ที่เหมาะสม\"","มีหลักฐานการนำสมมติฐานไปประยุกต์ใช้ปรับแผนงานที่สำคัญ","มีแนวทางการประเมินประสิทธิผลของการ \"กำหนดสมมติฐาน\""],"good":["มีการวางโครงสร้างขั้นตอนการทำงาน (Process) ในการทำ Scenario Planning ไว้ใน SIPOC คู่มือการทำงานอย่างชัดเจน"],"gaps":["ขาดการทำตัวเลขประมาณการทางการเงิน: ผู้ประเมิน TRIS ระบุอย่างชัดเจนว่า กทท. มีการกำหนดขั้นตอนการวิเคราะห์ แต่ \"ยังไม่มีการประมาณการผลประกอบการทางการเงิน โดยกำหนดเป็นแต่ละสถานการณ์ โดยมีสมมติฐานที่วิเคราะห์ และเป็นที่มาของแต่ละสถานการณ์อย่างชัดเจน","ขาดการนำไปใช้กำหนดกลยุทธ์เชิงลึก: กทท. ควรมีการนำผลการวิเคราะห์ในแต่ละสถานการณ์ ไปใช้กำหนดเป็นยุทธศาสตร์ที่เหมาะสม และต้องสามารถ \"วิเคราะห์ได้ถึงความคุ้มค่า (Cost-Benefit) ของแต่ละทางเลือก\"","ขาดแผนป้องกันความเสี่ยงสูงสุด: ยังไม่มีการนำสมมติฐานมาประยุกต์ใช้เพื่อวางแผนปฏิบัติการป้องกันไม่ให้เกิดเหตุการณ์เลวร้ายที่สุด (Worst Case Scenario)"],"results":["ระดับ 1 (ผ่านเกณฑ์): กทท. มีการกำหนดและระบุขั้นตอนการวิเคราะห์ Scenario Planning ไว้ภายใต้ SIPOC 3 (กระบวนการกำหนดตำแหน่งทางยุทธศาสตร์) และ SIPOC 4 (กระบวนการจัดทำ/ทบทวนแผนยุทธศาสตร์ ขั้นตอนที่ 11)","ระดับ 2 ถึง 5 (ไม่ผ่านเกณฑ์): กทท. ไม่ได้นำส่งหลักฐานการประเมินผลประกอบการทางการเงินในแต่ละสถานการณ์ รวมถึงไม่มีการระบุสมมติฐาน (Assumptions), ไม่มีการวิเคราะห์ Cost-Benefit, ไม่มีแผนป้องกัน Worst Case Scenario และไม่มีการประเมินกระบวนการ"],"tris":["นหัวข้อ 2.3 กทท. ได้คะแนนเพียง 1.0 เนื่องจากขาดการทำตัวเลขจำลองทางการเงิน ในปีหน้า กทท. สามารถยกระดับคะแนนแบบก้าวกระโดดได้ โดยนำทีมการเงินมาจำลองสถานการณ์ 3 แบบ (Worst, Base, Best) แต่จุดที่กทท.จะ \"พลิกชนะคู่เทียบ\" คือต้องเชื่อมโยง Scenario ทางการเงินนี้ ให้ตรงกับ ระยะเวลา (ระยะสั้น ระยะกลาง ระยะยาว) ที่ได้ตั้งเป้าไว้ใน Strategic Positioning และ Business Model เมื่อทำสิ่งนี้คู่ขนานกันไป กทท. จะสามารถมุ่งสู่ระดับ 3.0 - 4.0 ได้อย่างแน่นอน"],"suggest":["ในปี 2569 ฝ่ายกลยุทธ์องค์กรควรทำงานร่วมกับฝ่ายการเงินอย่างใกล้ชิด เพื่อจัดทำตัวเลขประมาณการทางการเงินตามสถานการณ์ (Financial Scenario Planning) อย่างน้อย 3 รูปแบบ (Base Case, Best Case, Worst Case) และระบุสมมติฐานเชิงเศรษฐศาสตร์หรือปัจจัยขับเคลื่อนที่ชัดเจน (เช่น ปริมาณตู้สินค้า, อัตราเงินเฟ้อ, GDP) รวมถึงกำหนดกลยุทธ์หรือแผนปฏิบัติการเพื่อรองรับและป้องกันความเสี่ยงหากเกิดสถานการณ์แบบ Worst Case"],"docs":["รายงานประมาณการทางการเงิน 3 สถานการณ์ (Scenario Planning Report): ที่ระบุตัวเลขรายได้ ค่าใช้จ่าย และกำไร ในรูปแบบ Worst Case, Base Case และ Best Case","เอกสารระบุสมมติฐาน (Assumptions): ที่แสดงที่มาของการคำนวณแต่ละสถานการณ์อย่างชัดเจน","รายงานการวิเคราะห์ความคุ้มค่า (Cost-Benefit Analysis): เพื่อใช้ประกอบการตัดสินใจเลือกยุทธศาสตร์ในแต่ละทางเลือก","แผนฉุกเฉินหรือแผนปฏิบัติการรองรับ (Mitigation Plan): เพื่อป้องกันผลกระทบทางการเงินไม่ให้เข้าใกล้ Worst Case Scenario"],"bestprac":["กทพ. และ รฟม. มีการวิเคราะห์ Scenario Planning แบ่งเป็น 3 สถานการณ์ คือ Worst Case, Base Case และ Best Case อย่างชัดเจน ครอบคลุมระยะเวลายาว (เช่น ปี 2567-2580) และมีสมมติฐานที่ใช้คาดการณ์ทางการเงินของแต่ละสถานการณ์อย่างชัดเจน","จุดที่คู่เทียบพลาด และ กทท. สามารถทำได้ดีกว่า (เพื่อเป็น Best Practice แทน): ผู้ประเมิน TRIS ได้ให้ข้อเสนอแนะกับทั้ง กทพ. และ รฟม. เหมือนกันว่า การทำ Scenario Planning นั้น \"ควรกำหนดกรอบระยะเวลาให้เป็นระยะเวลาเดียวกันกับ Strategic Positioning และ Business Model\" เพื่อให้สอดคล้องกับภาพรวมขององค์กร"],"minReqs":{"1":["มีการประมาณการผลประกอบการทางการเงินล่วงหน้าตามระยะเวลาของแผนวิสาหกิจ/แผนยุทธศาสตร์ (แผนระยะยาว) แต่ยังไม่มีการระบุสมมติฐานที่สำคัญที่ใช้ประมาณการ"],"2":["มีการประมาณการผลประกอบการทางการเงิน โดยกำหนดเป็นแต่ละสถานการณ์ โดยมีสมมติฐานที่วิเคราะห์และเป็นที่มาของแต่ละสถานการณ์อย่างชัดเจน"],"3":["นำผลการวิเคราะห์ในแต่ละสถานการณ์ของผลประกอบการขององค์กร นำมากำหนดยุทธศาสตร์ที่เหมาะสมและวิเคราะห์ได้ถึง Cost-Benefit ของแต่ละทางเลือก"],"4":["นำสมมติฐานที่ใช้ในการวิเคราะห์ในแต่ละสถานการณ์ มาประยุกต์กับยุทธศาสตร์หรือแผนการดำเนินงานที่สำคัญขององค์กร เพื่อป้องกันไม่ให้เกิดกรณี Worst Case Scenario"],"5":["มีการประเมินประสิทธิผลของการกำหนดสมมติฐานที่ใช้ในแต่ละสถานการณ์ พร้อมทบทวนถึงการปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก \"Timeframe ไม่ตรงกัน\" (The Misaligned Timeframe Trap): นี่คือจุดตายที่คู่เทียบของ กทท. โดนหักคะแนนครับ! ซึ่งผู้ตรวจได้ให้ข้อเสนอแนะกับ รฟม.และ กทพ. ไว้ว่า กรอบระยะเวลาในการทำ Scenario Planning \"ต้องจัดทำขึ้นตามกรอบระยะเวลา 3 ช่วง (ระยะสั้น-กลาง-ยาว) ให้เป็นระยะเวลาเดียวกันเป๊ะๆ กับข้อ 2.1 (Strategic Positioning) และข้อ 2.2 (Business Model)\" เพื่อให้สมมติฐานทางการเงินสอดคล้องกับภาพรวมขององค์กร ดังนั้น กทท. สามารถเอามาประยุกต์ได้","กับดักรูปแบบสถานการณ์ (The Three Scenarios Rule - ซ่อนอยู่ใน Level 2): แม้เกณฑ์จะเขียนแค่ \"แต่ละสถานการณ์\" แต่จากคำชมที่ กทพ. และ รฟม. ได้รับ ผู้ตรวจคาดหวังให้ทำอย่างน้อย 3 Scenarios เสมอ คือ \"Worst Case, Base Case, และ Best Case\" หากทำแค่กรณีเดียวหรือ 2 กรณี จะถือว่าวิเคราะห์ไม่ครบถ้วน ดังนั้น กทท. ถ้าจะผ่านได้ ต้องทำให้ครบ 3 สถานการณ์"],"3":["กับดัก \"Timeframe ไม่ตรงกัน\" (The Misaligned Timeframe Trap): นี่คือจุดตายที่คู่เทียบของ กทท. โดนหักคะแนนครับ! ซึ่งผู้ตรวจได้ให้ข้อเสนอแนะกับ รฟม.และ กทพ. ไว้ว่า กรอบระยะเวลาในการทำ Scenario Planning \"ต้องจัดทำขึ้นตามกรอบระยะเวลา 3 ช่วง (ระยะสั้น-กลาง-ยาว) ให้เป็นระยะเวลาเดียวกันเป๊ะๆ กับข้อ 2.1 (Strategic Positioning) และข้อ 2.2 (Business Model)\" เพื่อให้สมมติฐานทางการเงินสอดคล้องกับภาพรวมขององค์กร ดังนั้น กทท. สามารถเอามาประยุกต์ได้","กับดัก \"ไม่ได้ทำ Cost-Benefit จากทางเลือก\" (The Missing Cost-Benefit): จาก Feedback ของ กทท. ระบุว่า กทท. ขาดการทำประมาณการทางการเงินรายสถานการณ์ และ \"ไม่ได้วิเคราะห์ Cost-Benefit ของแต่ละทางเลือก\" ดังนั้น ในหน้าเอกสารแผนวิสาหกิจ ต้องมีสไลด์หรือตารางที่โชว์ว่า ถ้ายุทธศาสตร์ A ใช้เงินเท่านี้ได้ผลตอบแทนเท่านี้ เทียบกับยุทธศาสตร์ B อย่างชัดเจน"],"4":["ป้องกัน Worst Case ต้องมีแผนชัดเจน (The Worst-Case Prevention): การจะได้คะแนนระดับ 4 ไม่ใช่แค่รับรู้ว่า Worst Case คืออะไร แต่ฝ่ายกลยุทธ์ต้องโชว์ให้เห็นว่าได้สั่งการให้เกิด \"โครงการ/แผนงานใหม่\" เพื่อสกัดกั้นไม่ให้ Worst Case เกิดขึ้น (เช่น ถ้า Worst Case คือรายได้ลด 20% ต้องมีแผนงานการหารายได้ช่องทางใหม่มารองรับเตรียมไว้เลย)"]},"scopeNote":"เน้นไปที่ \"การพยากรณ์ตัวเลขทางการเงินล่วงหน้า (Financial Forecasting)\" โดยใช้ผลจากการวิเคราะห์สภาพแวดล้อมมาทำ Sensitivity Analysis เพื่อดูความอ่อนไหวของปัจจัยต่างๆ ผู้ตรวจต้องการเห็นว่าองค์กรได้จำลองสถานการณ์ล่วงหน้า (อย่างน้อย 3 รูปแบบ: เลวร้ายที่สุด, ปกติ, ดีที่สุด) พร้อมระบุสมมติฐานตัวเลขที่ชัดเจน และนำผลที่ได้มาวิเคราะห์ความคุ้มค่า (Cost-Benefit) เพื่อตัดสินใจเลือกกลยุทธ์ รวมถึงต้องมีแผนสำรองเพื่อสกัดกั้นไม่ให้องค์กรตกลงไปสู่สถานการณ์ที่เลว
