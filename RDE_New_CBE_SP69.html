การจัดสรรทรัพยากรในปีถัดไป"]},{"id":"6.1","grp":"6","gname":"กระบวนการถ่ายทอดแผนปฏิบัติการ","gw":15,"gs68":2.3333,"name":"กระบวนการถ่ายทอดแผนปฏิบัติการ","w":4,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่ \"ประสิทธิภาพของการสื่อสารแผนไปสู่ผู้ปฏิบัติ\" โดยผู้ตรวจจะดูว่าองค์กรเลือกใช้ \"ช่องทางสื่อสาร (Channels)\" ที่เหมาะสมกับกลุ่มเป้าหมายแต่ละกลุ่มหรือไม่ มีการประเมินว่าช่องทางไหนเวิร์คไม่เวิร์ค และที่สำคัญคือต้องไปวัดผลด้วยว่า กลุ่มเป้าหมายทั้งบุคลากรภายในและผู้มีส่วนได้ส่วนเสียภายนอก (เช่น คู่ค้า ผู้ส่งมอบ) มี \"ความรู้ความเข้าใจ\" ในแผนปฏิบัติการระดับไหน และต้องบูรณาการแปลงแผนไปสู่ระดับสายงานให้เห็นเป็นรูปธรรม","levelSumm":["มีคู่มือ/กระบวนการ (เช่น SIPOC) ในการถ่ายทอดแผนปฏิบัติการที่ครอบคลุมทั้งกลุ่มเป้าหมาย \"ภายในและภายนอกองค์กร\"","มิติช่องทาง: มีเอกสารแสดงผลการประเมินประสิทธิผลของ \"แต่ละช่องทาง\" ที่ใช้ในการถ่ายทอดแผน (เช่น ช่องทางอีเมลเวิร์คไหม? การประชุม Townhall ได้ผลระดับไหน?)","มิติภายใน: มีหลักฐานการถ่ายทอดแผนปฏิบัติการลงไปยัง \"บุคลากรทั่วทั้งองค์กร\"","มิติผลลัพธ์การรับรู้: ผลการสำรวจความรับรู้ความเข้าใจในแผนปฏิบัติการ (ทั้งภายในและภายนอก) ต้องได้ผลลัพธ์อยู่ในเกณฑ์ \"ดี ถึง ดีมาก\" เท่านั้น","มีแนวทางการประเมินประสิทธิผลของกระบวนการถ่ายทอดแผน"],"good":["มีการกำหนดขั้นตอนและกรอบเวลาการสื่อสารถ่ายทอดแผนปฏิบัติการทั้งภายในและภายนอกองค์กรไว้อย่างชัดเจน ผ่าน SIPOC 7","มีการสื่อสารผ่าน 2 รูปแบบหลัก อย่างครอบคลุม ได้แก่ 1) สื่อประชาสัมพันธ์ (เช่น หนังสือเวียน, เสียงตามสาย, ป้ายประกาศ, Line@, Facebook) และ 2) การจัดประชุมออนไลน์ (เมื่อ 17 ต.ค. 67)","แผนปฏิบัติการถูกถ่ายทอดลงไปยังบุคลากรทั่วทั้งองค์กร รวมถึงครอบคลุมไปยังกลุ่ม \"ผู้ส่งมอบและคู่ค้าที่สำคัญ\" อย่างเป็นรูปธรรม","มีการจัดทำแบบประเมินผลการรับรู้และความเข้าใจหลังจากการสื่อสารถ่ายทอดแผนปฏิบัติการ"],"gaps":["การแปลงแผนสู่การปฏิบัติระดับสายงาน (Gap ระดับ 4): แม้จะมีการสื่อสารแผนใหญ่ขององค์กรแล้ว แต่ยังขาดการแสดงหลักฐานเชิงประจักษ์ว่า แผนปฏิบัติการระดับองค์กรนั้น ถูกนำไป \"แตกแขนงหรือแปลง (Cascade)\" ลงไปเป็นแผนปฏิบัติการระดับสายงาน/ระดับฝ่าย อย่างไรให้สอดคล้องกัน","ความชัดเจนของผลสำรวจ: ขาดการสรุปผลเชิงสถิติที่แสดงให้ผู้ประเมินเห็นอย่างชัดเจนว่า ผลสำรวจการรับรู้ของ \"ทุกกลุ่มผู้มีส่วนได้ส่วนเสีย\" อยู่ในเกณฑ์ \"ดีถึงดีมาก\"","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด (KPI in Process) และผลลัพธ์ของการประเมินกระบวนการสื่อสารและถ่ายทอดแผนฯ (SIPOC 7) เพื่อนำไปปรับปรุง"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีกระบวนการ กรอบเวลา และผู้รับผิดชอบในการถ่ายทอดแผนฯ ชัดเจน (SIPOC 7)","ระดับ 2 (ผ่านเกณฑ์): ประเมินประสิทธิผลของช่องทางการสื่อสาร และสำรวจการรับรู้","ระดับ 3 (ผ่านเกณฑ์): ถ่ายทอดแผนปฏิบัติการลงสู่บุคลากร และผู้ส่งมอบ/คู่ค้าที่สำคัญสำเร็จ","ระดับ 4 (ไม่ผ่านเกณฑ์ / ผ่านแบบมีเงื่อนไข): กทท. มีการประเมินผลการรับรู้ แต่ในมุมมองของผู้ประเมิน TRIS มองว่า กทท. ยังไม่สามารถแสดงภาพการบูรณาการกระบวนการถ่ายทอดยุทธศาสตร์ลงสู่ \"การแปลงแผนปฏิบัติการระดับสายงาน\" ได้ชัดเจนเพียงพอ","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลของกระบวนการ SIPOC 7"],"tris":["\"ควรมีการแสดงการบูรณาการกระบวนการถ่ายทอดยุทธศาสตร์และกลยุทธ์สู่แผนปฏิบัติการ กับกระบวนการแปลงแผนปฏิบัติการสู่ระดับสายงานที่ชัดเจน\" (คำอธิบาย: TRIS ต้องการเห็นว่า เมื่อประกาศแผนปฏิบัติการองค์กรแล้ว แต่ละ \"ฝ่าย/สำนัก\" รับลูกไปเขียนเป็น \"แผนปฏิบัติการย่อยของฝ่ายตัวเอง\" อย่างไร ไม่ใช่แค่การสื่อสารให้รับทราบเฉยๆ แต่ต้องเกิด Action จริงในระดับสายงานด้วย)"],"suggest":["จัดทำรายงาน \"การแปลงแผนปฏิบัติการสู่ระดับสายงาน (Action Plan Cascading Report)\": ฝ่ายกลยุทธ์ต้องทำตารางให้เห็นว่า โครงการ A (ระดับองค์กร) ถูกถ่ายทอดลงไปเป็น โครงการ A.1 ของฝ่าย IT และ โครงการ A.2 ของฝ่ายการเงิน อย่างไร เพื่อปิด Gap ในระดับ 4 อย่างสมบูรณ์","สรุปผลประเมินแยกกลุ่ม (Targeted Survey Results): จัดทำรายงานสรุปผลการสำรวจการรับรู้ แยกเป็นกลุ่มภายใน และกลุ่มภายนอก (คู่ค้า) โดยต้องผลักดันและสรุปตัวเลขให้เห็นว่าคะแนนการรับรู้อยู่ในระดับ \"ดีถึงดีมาก (>80%)\" ตามที่เกณฑ์ระดับ 4 ต้องการ","กำหนด KPI ประเมินกระบวนการ SIPOC 7 (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละของการเข้าถึงสื่อประชาสัมพันธ์\" หรือ \"ร้อยละของความเข้าใจหลังการประชุม\" และจัดทำรายงานทบทวนกระบวนการสื่อสารในปีถัดไป"],"docs":["ตารางเมทริกซ์การแปลงแผนปฏิบัติการระดับองค์กรสู่ระดับสายงาน (Cascading Action Plan Matrix): (เพื่อยืนยันระดับ 4)","รายงานสรุปผลการประเมินการรับรู้แผนปฏิบัติการ (แยกรายกลุ่มผู้มีส่วนได้ส่วนเสีย): ที่ไฮไลท์ตัวเลขผลลัพธ์ในระดับ \"ดี-ดีมาก\"","รายงานการประเมินประสิทธิผลกระบวนการสื่อสารและถ่ายทอดแผน (SIPOC 7): พร้อมระบุหลักฐานการนำข้อบกพร่องไปปรับปรุงช่องทางการสื่อสารให้ดีขึ้น (เพื่อยืนยันระดับ 5)"],"bestprac":["รฟม. มีการระบุเป้าหมายการถ่ายทอดแผนที่ชัดเจนมาก โดยแบ่งเป็นกลุ่มภายใน 3 กลุ่ม และภายนอกถึง 7 กลุ่ม และ รฟม. สามารถแสดงผลสำรวจการรับรู้ของทุกกลุ่มให้อยู่ในระดับ \"ดีมากถึงดีมากที่สุด\" ได้สำเร็จ นอกจากนี้ รฟม. ยังสามารถโชว์หลักฐาน \"การแปลงแผนปฏิบัติการลงสู่ระดับสายงาน\" ได้อย่างเป็นรูปธรรม","กทท. ควรถอดแบบ รฟม. โดยการ \"จัดกลุ่มผู้รับฟังแผนให้ละเอียดขึ้น (Segmented Target)\" และจัดทำ \"ตารางการแปลงแผนลงระดับฝ่ายงาน\" ให้ชัดเจนเหมือนที่ รฟม. ทำ หาก กทท. อุดรอยรั่วตรงนี้ได้ คะแนนจะขยับจาก 3.0 ไปสู่ 4.0"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของการถ่ายทอดแผนปฏิบัติการทั้งภายในและภายนอกองค์กร รวมถึงกรอบเวลาในการดำเนินการ"],"2":["รัฐวิสาหกิจมีการประเมินประสิทธิผลของแต่ละช่องทางการถ่ายทอดแผนปฏิบัติการสู่ทั้งภายในและภายนอกองค์กร และดำเนินการสำรวจการรับรู้ความเข้าใจของแผนปฏิบัติการ"],"3":["แผนปฏิบัติการมีการถ่ายทอดไปยังบุคลากรทั่วทั้งองค์กร รวมถึงไปยังผู้ส่งมอบและคู่ค้าที่สำคัญ (พิจารณาตามความเหมาะสม) เพื่อให้บรรลุวัตถุประสงค์เชิงยุทธศาสตร์"],"4":["ผลสำรวจในการรับรู้แผนปฏิบัติการของผู้มีส่วนได้ส่วนเสียทั้งภายในและภายนอกองค์กรอยู่ในระดับดีถึงดีมาก และมีการบูรณาการกระบวนการถ่ายทอดยุทธศาสตร์และกลยุทธ์สู่แผนปฏิบัติการกับกระบวนการแปลงแผนปฏิบัติการสู่ระดับสายงาน"],"5":["มีการประเมินประสิทธิผลของกระบวนการการจัดทำแผนปฏิบัติการและนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการฯ"]},"subComps":{"1":[],"2":["กับดัก \"ประเมินช่องทางแบบเหมารวม\" (Channel Effectiveness Trap): เกณฑ์ Level 2 เขียนคำบังคับไว้ว่า ต้องประเมินประสิทธิผลของ \"แต่ละช่องทาง\" หาก กทท. ทำแบบสอบถามถามแค่ว่า \"ท่านเข้าใจแผนหรือไม่?\" จะถือว่าตก Level 2 ทันที แบบสอบถามต้องมีข้อคำถามแยกเจาะจงว่า \"การสื่อสารผ่านเสียงตามสาย / ผ่านป้ายประกาศ / ผ่านระบบ MS Teams ช่องทางไหนทำให้ท่านเข้าใจแผนได้ดีที่สุด?\""],"3":["กับดัก \"ลืมคนนอกองค์กร\" (The Missing External Trap): หลายองค์กรมักจะจัดงาน Kick-off ถ่ายทอดแผนให้กับพนักงานในองค์กรอย่างยิ่งใหญ่ แต่ลืมถ่ายทอดให้คนนอก จากรายงานของ กทพ. และ รฟม. ที่ได้คะแนนทะลุระดับ 3 ผู้ตรวจชื่นชมชัดเจนว่ามีการถ่ายทอดไปยัง \"ผู้มีส่วนได้ส่วนเสียทั้งภายในและภายนอกองค์กร (รฟม. ทำ 7 กลุ่ม, กทพ. ทำ 7 กลุ่ม)\" ดังนั้น กทท. ต้องมีหลักฐานการแจ้งแผนงานให้ \"ผู้ส่งมอบ คู่ค้า และลูกค้า\" ทราบด้วยครับ (เช่น การส่งจดหมาย การจัดประชุมชี้แจงคู่ค้า)"],"4":["เกณฑ์บังคับผลลัพธ์ (Forced Result Threshold): เป็นหนึ่งในไม่กี่หัวข้อที่เกณฑ์เขียนบังคับผลลัพธ์ไว้อย่างชัดเจนว่า ผลสำรวจการรับรู้ต้องอยู่ในระดับ \"ดีถึงดีมาก\" (หากตั้งเกณฑ์ 5 ระดับ ผลประเมินต้องได้คะแนน 4.00 ขึ้นไป) หากผลสำรวจออกมาได้แค่ระดับปานกลาง ผู้ตรวจจะไม่ให้คะแนนผ่าน Level 4"],"5":["จุดอ่อนเรื่อง KPI การประเมินกระบวนการ (Process Evaluation Weakness): ทั้ง กทพ. และ รฟม. โดนผู้ตรวจคอมเมนต์ตักเตือนใน Level 5 เหมือนกันเป๊ะว่า \"ควรกำหนดแนวทางประเมินประสิทธิผลในทุกขั้นตอน และกำหนดตัวชี้วัด (KPIs) ที่สามารถสะท้อนประสิทธิภาพได้อย่างชัดเจน รวมทั้งแสดงผลลัพธ์การปรับปรุงที่ดีขึ้นอย่างต่อเนื่อง\" แปลว่าห้ามใช้แค่ KPI แบบ \"ทำเสร็จตามเวลา\" แต่ต้องเป็น KPI เชิงคุณภาพ เช่น \"ความครอบคลุมของการสื่อสาร\" หรือ \"สัดส่วนคู่ค้าที่รับทราบแผน\""]},"scopeNote":"มุ่งเน้นไปที่ \"ประสิทธิภาพของการสื่อสารแผนไปสู่ผู้ปฏิบัติ\" โดยผู้ตรวจจะดูว่าองค์กรเลือกใช้ \"ช่องทางสื่อสาร (Channels)\" ที่เหมาะสมกับกลุ่มเป้าหมายแต่ละกลุ่มหรือไม่ มีการประเมินว่าช่องทางไหนเวิร์คไม่เวิร์ค และที่สำคัญคือต้องไปวัดผลด้วยว่า กลุ่มเป้าหมายทั้งบุคลากรภายในและผู้มีส่วนได้ส่วนเสียภายนอก (เช่น คู่ค้า ผู้ส่งมอบ) มี \"ความรู้ความเข้าใจ\" ในแผนปฏิบัติการระดับไหน และต้องบูรณาการแปลงแผนไปสู่ระดับสายงานให้เห็นเป็นรูปธรรม","actions":["จัดทำรายงาน \"การแปลงแผนปฏิบัติการสู่ระดับสายงาน (Action Plan Cascading Report)\": ฝ่ายกลยุทธ์ต้องทำตารางให้เห็นว่า โครงการ A (ระดับองค์กร) ถูกถ่ายทอดลงไปเป็น โครงการ A.1 ของฝ่าย IT และ โครงการ A.2 ของฝ่ายการเงิน อย่างไร เพื่อปิด Gap ในระดับ 4 อย่างสมบูรณ์","สรุปผลประเมินแยกกลุ่ม (Targeted Survey Results): จัดทำรายงานสรุปผลการสำรวจการรับรู้ แยกเป็นกลุ่มภายใน และกลุ่มภายนอก (คู่ค้า) โดยต้องผลักดันและสรุปตัวเลขให้เห็นว่าคะแนนการรับรู้อยู่ในระดับ \"ดีถึงดีมาก (>80%)\" ตามที่เกณฑ์ระดับ 4 ต้องการ","กำหนด KPI ประเมินกระบวนการ SIPOC 7 (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละของการเข้าถึงสื่อประชาสัมพันธ์\" หรือ \"ร้อยละของความเข้าใจหลังการประชุม\" และจัดทำรายงานทบทวนกระบวนการสื่อสารในปีถัดไป"],"dimLevels":["มีคู่มือ/กระบวนการ (เช่น SIPOC) ในการถ่ายทอดแผนปฏิบัติการที่ครอบคลุมทั้งกลุ่มเป้าหมาย \"ภายในและภายนอกองค์กร\" / มีการระบุ \"กรอบระยะเวลา (Timeline)\" ในการถ่ายทอดแผนอย่างชัดเจน","มิติช่องทาง: มีเอกสารแสดงผลการประเมินประสิทธิผลของ \"แต่ละช่องทาง\" ที่ใช้ในการถ่ายทอดแผน (เช่น ช่องทางอีเมลเวิร์คไหม? การประชุม Townhall ได้ผลระดับไหน?) / มิติการรับรู้: มีหลักฐานการ \"สำรวจการรับรู้ความเข้าใจ\" ในแผนปฏิบัติการของผู้ที่เกี่ยวข้อง","มิติภายใน: มีหลักฐานการถ่ายทอดแผนปฏิบัติการลงไปยัง \"บุคลากรทั่วทั้งองค์กร\" / มิติภายนอก (บังคับ): มีหลักฐานการถ่ายทอดแผนปฏิบัติการไปยัง \"ผู้ส่งมอบและคู่ค้าที่สำคัญ\" เพื่อให้สอดคล้องกับยุทธศาสตร์","มิติผลลัพธ์การรับรู้: ผลการสำรวจความรับรู้ความเข้าใจในแผนปฏิบัติการ (ทั้งภายในและภายนอก) ต้องได้ผลลัพธ์อยู่ในเกณฑ์ \"ดี ถึง ดีมาก\" เท่านั้น / มิติการแปลงแผน: มีหลักฐานการบูรณาการกระบวนการถ่ายทอดยุทธศาสตร์/กลยุทธ์ สู่แผนปฏิบัติการ และมีหลักฐานการ \"แปลงแผนปฏิบัติการลงสู่ระดับสายงาน\" อย่างเป็นรูปธรรม","มีแนวทางการประเมินประสิทธิผลของกระบวนการถ่ายทอดแผน / มีผลลัพธ์ของการประเมินกระบวนการ และนำไปใช้ปรับปรุงกระบวนการ/ช่องทางการสื่อสารในปีถัดไป"]},{"id":"6.2","grp":"6","gname":"กระบวนการถ่ายทอดแผนปฏิบัติการ","gw":15,"gs68":2.3333,"name":"กระบวนการเชื่อมโยงแผนยุทธศาสตร์ระดับองค์กรสู่แผนแม่บทที่เกี่ยวข้อง (Alignment Strategy)","w":3,"s68":1,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่ \"ระบบประสานงานและการวิเคราะห์ผลเชิงตรรกะ\" โดยให้ความสำคัญกับการมีฐานข้อมูลส่วนกลาง (Centralized Database) เพื่อให้ฝ่ายกลยุทธ์ (ฝก.) และเจ้าของแผนแม่บททำงานอยู่บนชุดข้อมูลเดียวกัน นอกจากนี้ ผู้ตรวจจะจับผิดเรื่อง \"เส้นแบ่งระหว่างยุทธศาสตร์และตัวชี้วัด\" โดย Level 3 เน้นการวิเคราะห์ระดับทิศทาง (ยุทธศาสตร์) แต่ Level 4 ต้องเอา \"ตัวเลข (KPI)\" ของแผนแม่และแผนลูกมากางเทียบกันให้เห็นว่าผลงานสอดคล้องกันจริง","levelSumm":["มีคู่มือ/กระบวนการ (เช่น SIPOC 10) ที่ระบุขั้นตอนการบูรณาการแผนวิสาหกิจเข้ากับแผนแม่บทอย่างชัดเจน","มีหลักฐาน/รายงานสรุปการดำเนินงานบูรณาการการทำงานระหว่างแผนแม่และแผนลูกตลอดทั้งปี","มีหลักฐาน/ตารางการวิเคราะห์เพื่อพิสูจน์ว่า หากองค์กรบรรลุ \"ยุทธศาสตร์ระดับแผนแม่บท\" (เช่น แผน IT ลุล่วง) จะส่งผลให้บรรลุ \"ยุทธศาสตร์ระดับองค์กร\" (เช่น การบริการลูกค้ารวดเร็วขึ้น) อย่างไร","มีตารางวิเคราะห์เชิงเปรียบเทียบระหว่าง \"ผลการบรรลุตัวชี้วัด (KPI) ระดับองค์กร\" กับ \"ผลการบรรลุตัวชี้วัด (KPI) ของแผนแม่บท\" ว่าล้อไปในทิศทางเดียวกัน","มีแนวทางการประเมินประสิทธิผลของกระบวนการเชื่อมโยงแผน"],"good":["มีการกำหนดแนวทางและกระบวนการเชื่อมโยงแผนแม่-แผนลูก ไว้ในคู่มือปฏิบัติงาน (SIPOC 10 กระบวนการบูรณาการระหว่างแผนวิสาหกิจ กทท. กับแผนแม่บท)","มีการนำเทคโนโลยีดิจิทัล (Google Drive) มาประยุกต์ใช้เป็นพื้นที่กลางในการเก็บรวบรวม เชื่อมโยง และอัปเดตข้อมูลปัจจัยนำเข้าระหว่างแผนยุทธศาสตร์องค์กรและแผนแม่บทต่างๆ เพื่อให้ทุกฝ่ายเห็นข้อมูลชุดเดียวกัน","มีการจัดทำเอกสาร \"สรุปการดำเนินงานการบูรณาการการทำงานระหว่างแผนแม่และแผนลูกตลอดทั้งปี\""],"gaps":["ขาดความชัดเจนเรื่อง \"กรอบเวลา (Timeline)\": แม้ กทท. จะบอกว่ามีขั้นตอน แต่ผู้ประเมินยังไม่เห็นภาพ \"ปฏิทินที่เชื่อมโยงกัน (Integrated Calendar)\" ว่าเมื่อแผนแม่เสร็จแล้ว แผนลูกต้องใช้เวลาอีกกี่วัน/กี่เดือนในการทบทวนแผนตัวเองให้สอดคล้องกัน","ขาดการพิสูจน์ความสอดคล้องขององค์ประกอบ (ระดับ 2): ยังขาดหลักฐานเชิงประจักษ์ที่จะยืนยันว่า องค์ประกอบต่างๆ ในแผนลูก (เช่น วิสัยทัศน์ลูก, ยุทธศาสตร์ลูก) สอดคล้องกับแผนแม่อย่างสมบูรณ์","การวิเคราะห์ความเชื่อมโยงเชิงผลลัพธ์ (ระดับ 3 และ 4): กทท. ยังไม่สามารถแสดงบทวิเคราะห์ให้ผู้ประเมินเห็นว่า หาก \"แผนแม่บท (แผนลูก)\" บรรลุเป้าหมายแล้ว จะส่งผลให้ \"แผนวิสาหกิจ (แผนแม่)\" บรรลุเป้าหมาย/ตัวชี้วัด ได้อย่างไรในเชิงตรรกะเหตุและผล"],"results":["ระดับ 1 (ผ่านเกณฑ์แบบฉิวเฉียด/ได้คะแนน 1.0): มีการระบุกระบวนการใน SIPOC 10 และใช้ Google Drive เข้ามาช่วย","ระดับ 2 ถึง 4 (ไม่ผ่านเกณฑ์): แม้ กทท. จะนำส่งหลักฐานไปจนถึงระดับ 4 (เช่น การประชุมมอบนโยบาย, สรุปการบูรณาการ, แผนภาพ Cascade KPI) แต่ในสายตาของผู้ประเมิน TRIS มองว่าตั้งแต่กระบวนการเริ่มต้น (ระดับ 1-2) ยังขาดความชัดเจนในเชิงการปฏิบัติและกรอบเวลา ทำให้หลักฐานในระดับที่สูงกว่าถูกปัดตกไปทั้งหมด","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการส่งหลักฐานการประเมินและทบทวนกระบวนการ"],"tris":["ผู้ประเมิน TRIS ระบุ Feedback ในข้อนี้ด้วยประโยคที่คัดลอกมาจาก Minimum Requirement ของเกณฑ์ระดับ 1 และ 2 แบบเป๊ะๆ ซึ่งสะท้อนว่า กทท. ต้องกลับไปแก้ที่ฐานรากใหม่ โดยระบุว่า \"ต้องกำหนดกระบวนการเชื่อมโยงแผนยุทธศาสตร์ระดับองค์กรสู่แผนแม่บทที่เกี่ยวข้อง ในเชิงกระบวนการดำเนินงาน รวมถึง 'ระยะเวลา' ที่ต้องมีการทบทวน/จัดทำแผนแม่บทที่เกี่ยวข้อง รวมทั้งดำเนินการตามกระบวนการดังกล่าวครบถ้วน และองค์ประกอบในแผนแม่บทที่เกี่ยวข้องสอดคล้องกับแผนยุทธศาสตร์ระดับองค์กร\""],"suggest":["จัดทำปฏิทินบูรณาการ (Master Alignment Calendar): ฝ่ายกลยุทธ์ต้องวาด Gantt Chart แผนการทำงานประจำปีที่แสดงให้เห็นชัดเจนว่า เช่น แผนแม่เสร็จเดือน ก.ย. -> ฝ่าย IT และฝ่าย HR รับข้อมูลไปทำแผนลูก -> แผนลูกต้องทบทวนเสร็จและส่งกลับภายในเดือน พ.ย. (ระบุกรอบเวลาที่จับต้องได้)","ทำเอกสาร Mapping องค์ประกอบแผน: จัดทำตารางจับคู่ง่ายๆ ที่กางให้เห็นว่า วิสัยทัศน์องค์กร/เป้าหมายองค์กร สอดคล้องกับ วิสัยทัศน์แผนลูก/เป้าหมายแผนลูก อย่างไรแบบข้อต่อข้อ","วิเคราะห์ความสำเร็จเชิงเหตุและผล (ระดับ 3-4): ในรายงานประจำปี ต้องเขียนอธิบายด้วยว่า \"การที่แผน IT (แผนลูก) สามารถทำระบบ A ได้สำเร็จตามเป้า ช่วยผลักดันให้ตัวชี้วัดที่ 2 ของแผนองค์กรบรรลุเป้าหมายตามไปด้วย\""],"docs":["ปฏิทินการจัดทำและบูรณาการแผนวิสาหกิจและแผนแม่บท (Integrated Strategic Calendar): ที่ระบุขั้นตอนและ Timeframe ของทั้งแผนแม่และแผนลูก","รายงานสรุปความสอดคล้องขององค์ประกอบแผนแม่-แผนลูก (Alignment Elements Report): เพื่อยืนยันเกณฑ์ระดับ 2","บทวิเคราะห์ความเชื่อมโยงความสำเร็จ (Success Alignment Analysis): เอกสารที่อธิบายว่าการบรรลุยุทธศาสตร์/ตัวชี้วัดแผนลูก ส่งผลต่อการบรรลุแผนแม่อย่างไร (เพื่อมุ่งสู่ระดับ 3 และ 4)"],"bestprac":["รฟม. และ กทพ. สามารถแสดงเอกสารที่ยืนยันได้ว่า \"องค์ประกอบในแผนแม่บทที่เกี่ยวข้องสอดคล้องกับแผนยุทธศาสตร์ระดับองค์กร\" และ \"สามารถวิเคราะห์ได้ถึงความเชื่อมโยงระหว่างการบรรลุยุทธศาสตร์ระดับองค์กร กับการบรรลุยุทธศาสตร์ระดับแผนแม่บท","กทท. ต้องคุมเข้มให้ \"เจ้าของแผนแม่บท (เช่น ฝ่าย IT, ฝ่าย HR)\" ทำตารางวิเคราะห์ความเชื่อมโยงแนบมาในแผนของตัวเองทุกครั้งที่มีการส่งแผน เพื่อให้เป็นหลักฐานเชิงประจักษ์ว่าแผนลูกได้วิเคราะห์ความสอดคล้องกับแผนแม่แล้วจริงๆ"],"minReqs":{"1":["รัฐวิสาหกิจต้องกำหนดกระบวนการเชื่อมโยงแผนยุทธศาสตร์ระดับองค์กรสู่แผนแม่บทที่เกี่ยวข้อง ในเชิงกระบวนการดำเนินงาน รวมถึงระยะเวลาที่ต้องมีการทบทวน/จัดทำแผนแม่บทที่เกี่ยวข้อง"],"2":["รัฐวิสาหกิจดำเนินการตามกระบวนการดังกล่าวครบถ้วน และองค์ประกอบในแผนแม่บทที่เกี่ยวข้องสอดคล้องกับแผนยุทธศาสตร์ระดับองค์กร"],"3":["รัฐวิสาหกิจสามารถวิเคราะห์ได้ถึงความเชื่อมโยงระหว่าง \"การบรรลุยุทธศาสตร์ระดับองค์กร\" กับ \"การบรรลุยุทธศาสตร์ระดับแผนแม่บทที่เกี่ยวข้อง\""],"4":["รัฐวิสาหกิจสามารถวิเคราะห์ได้ถึงความเชื่อมโยงระหว่าง \"การบรรลุตัวชี้วัดในระดับยุทธศาสตร์องค์กร\" กับ \"การบรรลุตัวชี้วัดยุทธศาสตร์ระดับแผนแม่บทที่เกี่ยวข้อง\""],"5":["ทบทวนกระบวนการเชื่อมโยงแผนยุทธศาสตร์ระดับองค์กรสู่แผนแม่บทที่เกี่ยวข้อง"]},"subComps":{"1":["กับดัก \"ระบบฐานข้อมูลกึ่งแมนนวล\" (The Manual Database Trap): แม้ในปี 67 กทท. จะใช้ \"Google Drive\" เป็นระบบฐานข้อมูลและได้คะแนนไป แต่จากข้อเสนอแนะล่าสุดในเวที Feedback Day (FD) ผู้ตรวจได้ยกระดับความคาดหวัง โดยแนะนำให้ กทท. พัฒนาเป็น \"ระบบติดตามอัตโนมัติ (Web-based Application) ที่เชื่อมโยงข้อมูลจากแผนแม่บทต่างๆ เข้าสู่ส่วนกลางผ่าน API แบบ Real-time\" ดังนั้น หากปีนี้ยังส่งแค่หน้าจอ Google Drive อาจมีความเสี่ยงที่ผู้ตรวจจะมองว่าไม่เกิดการพัฒนา (Continuous Improvement)"],"2":["การตกหล่นของ \"แผนแม่บทบังคับ\" (Mandatory Enablers Mapping): จากคำเตือนของ รฟม. ที่โดนผู้ตรวจตักเตือน การเชื่อมโยงยุทธศาสตร์ต้องไปให้ถึงยุทธศาสตร์ของ \"แต่ละแผนแม่บท\" หากฝ่ายกลยุทธ์ (ฝก.) ลืมดึงแผนนวัตกรรม (IM) หรือแผนผู้มีส่วนได้ส่วนเสีย (SCM) มาร่วมวิเคราะห์ในระบบฐานข้อมูล ก็จะถูกตัดคะแนนความครบถ้วนทันที จะกระทบไปถึง Level 4"],"3":["กับดักความแตกต่างระหว่าง L3 และ L4 (The Strategy vs. KPI Trap): หลายองค์กรเอาตาราง Alignment Matrix ตารางเดียวไปส่งทั้ง Level 3 และ Level 4 ซึ่งจะโดนหักคะแนนแน่นอน เพราะ Level 3: ต้องการเห็นการวิเคราะห์ระดับ \"ถ้อยคำยุทธศาสตร์และทิศทาง\""],"4":["กับดักความแตกต่างระหว่าง L3 และ L4 (The Strategy vs. KPI Trap): หลายองค์กรเอาตาราง Alignment Matrix ตารางเดียวไปส่งทั้ง Level 3 และ Level 4 ซึ่งจะโดนหักคะแนนแน่นอน เพราะ Level 4: ต้องการเห็นการวิเคราะห์ระดับ \"ตัวเลข (KPI)\" ว่าเป้าหมายตัวเลขของแผนลูก ผลักดันเป้าหมายตัวเลขของแผนแม่ได้สำเร็จจริง พร้อมแนบหลักฐานการประเมินผลพนักงาน (HRM) มารองรับ"]},"scopeNote":"มุ่งเน้นไปที่ \"ระบบประสานงานและการวิเคราะห์ผลเชิงตรรกะ\" โดยให้ความสำคัญกับการมีฐานข้อมูลส่วนกลาง (Centralized Database) เพื่อให้ฝ่ายกลยุทธ์ (ฝก.) และเจ้าของแผนแม่บททำงานอยู่บนชุดข้อมูลเดียวกัน นอกจากนี้ ผู้ตรวจจะจับผิดเรื่อง \"เส้นแบ่งระหว่างยุทธศาสตร์และตัวชี้วัด\" โดย Level 3 เน้นการวิเคราะห์ระดับทิศทาง (ยุทธศาสตร์) แต่ Level 4 ต้องเอา \"ตัวเลข (KPI)\" ของแผนแม่และแผนลูกมากางเทียบกันให้เห็นว่าผลงานสอดคล้องกันจริง","actions":["จัดทำปฏิทินบูรณาการ (Master Alignment Calendar): ฝ่ายกลยุทธ์ต้องวาด Gantt Chart แผนการทำงานประจำปีที่แสดงให้เห็นชัดเจนว่า เช่น แผนแม่เสร็จเดือน ก.ย. -> ฝ่าย IT และฝ่าย HR รับข้อมูลไปทำแผนลูก -> แผนลูกต้องทบทวนเสร็จและส่งกลับภายในเดือน พ.ย. (ระบุกรอบเวลาที่จับต้องได้)","ทำเอกสาร Mapping องค์ประกอบแผน: จัดทำตารางจับคู่ง่ายๆ ที่กางให้เห็นว่า วิสัยทัศน์องค์กร/เป้าหมายองค์กร สอดคล้องกับ วิสัยทัศน์แผนลูก/เป้าหมายแผนลูก อย่างไรแบบข้อต่อข้อ","วิเคราะห์ความสำเร็จเชิงเหตุและผล (ระดับ 3-4): ในรายงานประจำปี ต้องเขียนอธิบายด้วยว่า \"การที่แผน IT (แผนลูก) สามารถทำระบบ A ได้สำเร็จตามเป้า ช่วยผลักดันให้ตัวชี้วัดที่ 2 ของแผนองค์กรบรรลุเป้าหมายตามไปด้วย\""],"dimLevels":["มีคู่มือ/กระบวนการ (เช่น SIPOC 10) ที่ระบุขั้นตอนการบูรณาการแผนวิสาหกิจเข้ากับแผนแม่บทอย่างชัดเจน / มีการระบุ \"กรอบระยะเวลา (Timeline)\" ของการทบทวน/จัดทำแผนแม่บทที่ล้อไปกับแผนแม่ (ต้องทำหลังแผนแม่ หรือรับลูกต่อทันที) / มีการใช้ \"ระบบฐานข้อมูลร่วมกัน\" (เช่น Google Drive, Shared Folder, หรือระบบ Web-based) เพื่ออัปเดตและเชื่อมโยงข้อมูลระหว่างฝ่ายงาน","มีหลักฐาน/รายงานสรุปการดำเนินงานบูรณาการการทำงานระหว่างแผนแม่และแผนลูกตลอดทั้งปี / องค์ประกอบในแผนแม่บท (วิสัยทัศน์, พันธกิจ, เป้าหมายแผนลูก) มีเนื้อหาที่สอดคล้องและล้อไปกับแผนยุทธศาสตร์ระดับองค์กร","มีหลักฐาน/ตารางการวิเคราะห์เพื่อพิสูจน์ว่า หากองค์กรบรรลุ \"ยุทธศาสตร์ระดับแผนแม่บท\" (เช่น แผน IT ลุล่วง) จะส่งผลให้บรรลุ \"ยุทธศาสตร์ระดับองค์กร\" (เช่น การบริการลูกค้ารวดเร็วขึ้น) อย่างไร / มีการนำเสนอผลการดำเนินงานในภาพรวมที่สะท้อนการบรรลุเป้าหมายยุทธศาสตร์ให้ผู้มีส่วนได้ส่วนเสียรับทราบ","มีตารางวิเคราะห์เชิงเปรียบเทียบระหว่าง \"ผลการบรรลุตัวชี้วัด (KPI) ระดับองค์กร\" กับ \"ผลการบรรลุตัวชี้วัด (KPI) ของแผนแม่บท\" ว่าล้อไปในทิศทางเดียวกัน / มิติบังคับ HR: มีการนำตัวชี้วัด/ค่าเป้าหมายที่บูรณาการร่วมกันนี้ ถ่ายทอดลงสู่ระบบการประเมินผลการปฏิบัติงานรายบุคคล (PMS/Cascade KPI) ของสายงานที่เกี่ยวข้อง","มีแนวทางการประเมินประสิทธิผลของกระบวนการเชื่อมโยงแผน / มีหลักฐานแสดงการนำผลประเมิน หรือปัญหาที่พบจากการบูรณาการแผน ไปใช้ในการปรับปรุงกระบวนการทำงานในปีถัดไป"]},{"id":"6.3","grp":"6","gname":"กระบวนการถ่ายทอดแผนปฏิบัติการ","gw":15,"gs68":2.3333,"name":"กระบวนการกำหนดตัวชี้วัดระดับแผนงานและโครงการ","w":4,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"มุ่งเน้นไปที่ \"การแตกเป้าหมายและการผูกความรับผิดชอบ (KPI Cascading & Accountability)\" ผู้ตรวจต้องการเห็นว่า เมื่อองค์กรตั้งเป้าหมายใหญ่ไว้แล้ว เป้าหมายนั้นได้ถูกซอยย่อยลงมาเป็นตัวชี้วัดระดับแผนงาน/โครงการหรือไม่ และแผนงานเหล่านั้นมีสายงาน (ฝ่ายต่างๆ) รับเป็นเจ้าภาพครบถ้วนทุกเป้าหมายหรือไม่ ที่สำคัญที่สุดคือ ตัวชี้วัดของโครงการเหล่านี้ต้องถูกส่งต่อไปผูกกับ \"โบนัสหรือการประเมินผลงาน\" ในระบบ HR เพื่อบังคับให้คนทำงานเกิดความรับผิดชอบจริงๆ","levelSumm":["มีคู่มือ/กระบวนการที่ระบุขั้นตอนการกำหนดตัวชี้วัดระดับแผนงานและโครงการอย่างชัดเจน","มีเอกสารสรุปตัวชี้วัดระดับองค์กร (Corporate KPIs)","มิติความสอดคล้องของตัวชี้วัด: แผนปฏิบัติการระดับสายงาน มีการตั้งตัวชี้วัดที่สอดรับและผลักดันตัวชี้วัดระดับองค์กร","มิติความครบถ้วนของประเภทตัวชี้วัด: ในแต่ละแผนปฏิบัติการ ต้องมีการกำหนดตัวชี้วัดครบทั้ง 3 มิติ ได้แก่ (1) ตัวชี้วัดที่แสดงความก้าวหน้า (KPI in Process / Leading Indicator) / (2) ตัวชี้วัดผลผลิต (Output) / (3) ตัวชี้วัดผลลัพธ์ (Outcome)","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนดตัวชี้วัด"],"good":["มีการระบุขั้นตอนและกรอบเวลาการกำหนดตัวชี้วัดไว้อย่างชัดเจนใน SIPOC 4 (ขั้นตอนที่ 16-17)","มีการถ่ายทอดตัวชี้วัดและค่าเป้าหมายระดับองค์กร ลงสู่ระดับสายงาน (หน่วยปฏิบัติ) ครบทุกตัวชี้วัด","มีการนำ แผนที่กลยุทธ์ (Strategy Map) และมุมมอง Balanced Scorecard (BSC) มาเป็นเครื่องมือในการแปลงแผนยุทธศาสตร์ไปสู่การปฏิบัติ ทำให้เห็นความสอดคล้องของกิจกรรมและตัวชี้วัดชัดเจน","ในแต่ละแผนงาน/โครงการ มีการระบุเป้าหมายความสำเร็จของผลผลิต/ผลลัพธ์ (Output/Outcome) และมีการกำหนดตัวชี้วัดความก้าวหน้า (Leading/Lagging KPI หรือ KPI in Process) กำกับไว้เพื่อใช้ติดตามผล"],"gaps":["การบูรณาการระบบ IT เข้ามาช่วย (Gap ระดับ 4): การแปลงแผนและตัวชี้วัดลงสู่การปฏิบัติ ยังขาดการนำ \"ระบบเทคโนโลยีสารสนเทศ (IT)\" เข้ามาบูรณาการเพื่อใช้ในการสอบทานและสร้างความมั่นใจว่าการกระจายเป้าหมายนั้นถูกต้องแม่นยำ","ความเชื่อมโยงกับระบบบริหารผลงานของ HR (Gap ระดับ 4): แม้จะมีการส่งตัวชี้วัดไปให้ฝ่ายทรัพยากรบุคคล (ฝบ.) แล้ว แต่หลักฐานยังไม่แสดงให้ผู้ประเมินเห็นภาพความเชื่อมโยงที่แน่นแฟ้น ระหว่างตัวชี้วัดแผนปฏิบัติการ กับ \"ระบบประเมินผลการปฏิบัติงาน (PMS)\" ที่อยู่ในแผนแม่บท HR อย่างเป็นเนื้อเดียวกัน","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด ผลการประเมิน และหลักฐานการปรับปรุงกระบวนการกำหนดตัวชี้วัดแผนงาน/โครงการ"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีขั้นตอนการกำหนดตัวชี้วัดระดับแผนงานและกรอบเวลาชัดเจน (SIPOC 4)","ระดับ 2 (ผ่านเกณฑ์): มีการถ่ายทอดตัวชี้วัดระดับองค์กรสู่ตัวชี้วัดระดับสายงานอย่างครบถ้วน (Cascade KPI)","ระดับ 3 (ผ่านเกณฑ์): แผนปฏิบัติการแต่ละสายงาน สอดคล้องกับแผนองค์กรทั้งในมุมมองตัวชี้วัดและกิจกรรม","ระดับ 4 (ไม่ผ่านเกณฑ์ / ผ่านแบบมีเงื่อนไข): กทท. ส่งหลักฐานระบบ Cascade KPI ให้ฝ่าย HR แล้ว แต่ผู้ประเมินมองว่ายังขาดการบูรณาการด้วยระบบ IT และหลักฐานความเชื่อมโยงกับระบบประเมินผลบุคลากร (PMS) ยังไม่ชัดเจนเพียงพอ","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลกระบวนการ"],"tris":["\"ควรกำหนด/ระบุขั้นตอนที่สำคัญของการบูรณาการระบบเทคโนโลยีสารสนเทศ เพื่อสร้างความมั่นใจในการแปลงแผนปฏิบัติการสู่การปฏิบัติ และความเชื่อมโยงกับระบบประเมินผลการปฏิบัติงานที่ปรากฏในหัวข้อการบริหารทรัพยากรบุคคล\" (คำอธิบาย: TRIS ต้องการเห็นว่า ฝ่ายกลยุทธ์ใช้โปรแกรมหรือระบบ IT อะไรในการกระจาย KPI ลงไปให้แต่ละฝ่าย และเมื่อฝ่ายทำผลงานได้ ระบบนี้จะลิงก์ส่งคะแนนไปที่ระบบประเมินผลโบนัส/เงินเดือน ของฝ่าย HR โดยอัตโนมัติหรือเชื่อมโยงกันอย่างเป็นระบบได้อย่างไร)"],"suggest":["นำระบบ IT Dashboard มาใช้จัดการ KPI (IT Integration): ฝ่ายกลยุทธ์ต้องร่วมกับฝ่าย IT พัฒนาระบบหรือใช้ Software (เช่น ERP, Power BI หรือระบบ e-KPI ขององค์กร) เข้ามาเป็นเครื่องมือหลักในการกระจาย (Cascade) และติดตามตัวชี้วัดระดับแผนงาน พร้อมแคปหน้าจอระบบส่งเป็นหลักฐานให้ TRIS","ทำผังความเชื่อมโยง KPI สู่ระบบประเมินผล HR (PMS Alignment): จัดทำเอกสารร่วมกับฝ่าย HR เพื่ออธิบายว่า ตัวชี้วัดระดับแผนงาน (Project KPI) ถูกนำไปแปลงเป็นน้ำหนักคะแนนในการประเมินผลการปฏิบัติงานรายบุคคล (Individual KPI) อย่างไร พร้อมแนบแบบฟอร์มการประเมินผลของพนักงานเป็นข้อพิสูจน์","กำหนด KPI ประเมินกระบวนการกำหนดตัวชี้วัด (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละความผิดพลาดของการกำหนดตัวชี้วัดระดับแผนงาน\" หรือ \"ความพึงพอใจของฝ่ายงานต่อการจัดทำตัวชี้วัด\" และนำผลมาปรับปรุงกระบวนการในปีถัดไป"],"docs":["คู่มือหรือรายงานการใช้ระบบสารสนเทศในการกระจายตัวชี้วัด (IT-Driven KPI Cascading Report): เพื่อตอบโจทย์ประเด็นบูรณาการระบบ IT","เอกสารแสดงความเชื่อมโยงระหว่างตัวชี้วัดแผนปฏิบัติการกับแบบประเมินผลการปฏิบัติงานบุคคล (PMS Linkage Evidence): ที่ออกร่วมกับฝ่ายทรัพยากรบุคคล (ฝบ.)","รายงานการประเมินประสิทธิผลกระบวนการกำหนดตัวชี้วัด (KPI in Process): พร้อมหลักฐานการทบทวนปรับปรุงกระบวนการ (เพื่อยืนยันระดับ 5)"],"bestprac":["ทั้ง 3 รัฐวิสาหกิจ (กทท., กทพ., รฟม.) ตกม้าตายในจุดเดียวกันทั้งหมด คือ TRIS ให้ Feedback กับทั้ง รฟม. และ กทพ. ด้วยประโยคเดียวกันเป๊ะว่า \"ควรมีความเชื่อมโยงกับระบบประเมินผลการปฏิบัติงานที่ปรากฏในหัวข้อการบริหารทรัพยากรบุคคลอย่างครอบคลุมและครบถ้วน\""],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของกระบวนการกำหนดตัวชี้วัดระดับแผนงานและโครงการ รวมถึงกำหนดกรอบเวลาในการดำเนินงาน"],"2":["รัฐวิสาหกิจมีตัวชี้วัดระดับองค์กร และมีกระบวนการดำเนินงานที่มีการถ่ายทอดตัวชี้วัดและเป้าหมายไปยังตัวชี้วัดและเป้าหมายระดับสายงาน ทุกตัวชี้วัด"],"3":["แผนปฏิบัติการในแต่ละสายงาน สามารถอธิบายถึงความสอดคล้องกับแผนปฏิบัติการระดับองค์กรได้ ทั้งในมุมมองตัวชี้วัด และกิจกรรมตามแผนงาน"],"4":["แผนปฏิบัติการในแต่ละสายงาน มีการกำหนดตัวชี้วัดที่แสดงความก้าวหน้าและแสดงผลผลิตและผลลัพธ์ของแต่ละแผนปฏิบัติการ โดยมีความเชื่อมโยงกับระบบประเมินผลการปฎิบัติงานที่ปรากฎในหัวข้อการบริหารทรัพยากรบุคคล"],"5":["มีการประเมินประสิทธิผลของกระบวนการจัดทำแผนปฏิบัติการ และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการฯ"]},"subComps":{"2":["กับดัก \"คำว่า ทุกตัวชี้วัด\" (The 'Every KPI' Trap - ซ่อนอยู่ใน Level 2): ตามเกณฑ์ Level 2 ระบุคำบังคับไว้ชัดเจนว่าต้องถ่ายทอดเป้าหมายไปยังสายงาน \"ทุกตัวชี้วัด\" หากองค์กรกำหนด Corporate KPI ไว้ 20 ตัว แต่ในตาราง Cascade Mapping แจกแจงลงสายงานไปแค่ 18 ตัว (อีก 2 ตัวอาจจะเป็นเป้าหมายเชิงนโยบายที่ไม่มีใครรับเป็นเจ้าภาพชัดเจน) ผู้ตรวจจะทำการตัดคะแนน Level 2 ทิ้งทันที! ตาราง Mapping ต้องมีเจ้าภาพครบ 100%"],"4":["การตั้ง KPI โครงการมิติเดียว (Single-Dimension KPI): หลายองค์กรมักตั้งตัวชี้วัดแผนปฏิบัติการแค่ \"ร้อยละความสำเร็จของโครงการ\" หรือ \"เบิกจ่ายงบประมาณตามเป้า\" ซึ่งผู้ตรวจมองว่าเป็นแค่ Output หรือ Process เท่านั้น ใน Level 4 บังคับว่าต้องมีครบทั้ง ความก้าวหน้า (ระหว่างทำ), ผลผลิต (ทำเสร็จได้อะไร), และผลลัพธ์ (Impact ที่เกิดต่อองค์กร) หากขาดมิติใดมิติหนึ่งไป จะไม่ผ่านระดับ 4","การตรวจสอบไขว้ข้ามหมวด SP vs HCM (Cross-Validation Trap): เกณฑ์ระบุชัดเจนว่าต้องมีความเชื่อมโยงกับระบบประเมินผลในหัวข้อ \"การบริหารทรัพยากรบุคคล (HCM)\" นั่นหมายความว่า หากฝ่ายกลยุทธ์ (ฝก.) ส่งเอกสารตาราง KPI ของสายงานให้ผู้ตรวจ แต่เมื่อผู้ตรวจเดินไปตรวจหมวด HCM แล้วพบว่า ฝ่าย HR ใช้แบบฟอร์มประเมินผลพนักงาน (PMS) ที่มีตัวชี้วัดไม่ตรงกับที่ฝ่ายกลยุทธ์ส่งมา การเชื่อมโยงนี้จะถูกตีตกทันทีครับ ฝก. และ ฝบ. (HR) ต้องใช้ฐานข้อมูลชุดเดียวกัน!"]},"scopeNote":"มุ่งเน้นไปที่ \"การแตกเป้าหมายและการผูกความรับผิดชอบ (KPI Cascading & Accountability)\" ผู้ตรวจต้องการเห็นว่า เมื่อองค์กรตั้งเป้าหมายใหญ่ไว้แล้ว เป้าหมายนั้นได้ถูกซอยย่อยลงมาเป็นตัวชี้วัดระดับแผนงาน/โครงการหรือไม่ และแผนงานเหล่านั้นมีสายงาน (ฝ่ายต่างๆ) รับเป็นเจ้าภาพครบถ้วนทุกเป้าหมายหรือไม่ ที่สำคัญที่สุดคือ ตัวชี้วัดของโครงการเหล่านี้ต้องถูกส่งต่อไปผูกกับ \"โบนัสหรือการประเมินผลงาน\" ในระบบ HR เพื่อบังคับให้คนทำงานเกิดความรับผิดชอบจริงๆ","actions":["นำระบบ IT Dashboard มาใช้จัดการ KPI (IT Integration): ฝ่ายกลยุทธ์ต้องร่วมกับฝ่าย IT พัฒนาระบบหรือใช้ Software (เช่น ERP, Power BI หรือระบบ e-KPI ขององค์กร) เข้ามาเป็นเครื่องมือหลักในการกระจาย (Cascade) และติดตามตัวชี้วัดระดับแผนงาน พร้อมแคปหน้าจอระบบส่งเป็นหลักฐานให้ TRIS","ทำผังความเชื่อมโยง KPI สู่ระบบประเมินผล HR (PMS Alignment): จัดทำเอกสารร่วมกับฝ่าย HR เพื่ออธิบายว่า ตัวชี้วัดระดับแผนงาน (Project KPI) ถูกนำไปแปลงเป็นน้ำหนักคะแนนในการประเมินผลการปฏิบัติงานรายบุคคล (Individual KPI) อย่างไร พร้อมแนบแบบฟอร์มการประเมินผลของพนักงานเป็นข้อพิสูจน์","กำหนด KPI ประเมินกระบวนการกำหนดตัวชี้วัด (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละความผิดพลาดของการกำหนดตัวชี้วัดระดับแผนงาน\" หรือ \"ความพึงพอใจของฝ่ายงานต่อการจัดทำตัวชี้วัด\" และนำผลมาปรับปรุงกระบวนการในปีถัดไป"],"dimLevels":["มีคู่มือ/กระบวนการที่ระบุขั้นตอนการกำหนดตัวชี้วัดระดับแผนงานและโครงการอย่างชัดเจน / มีการระบุ \"กรอบระยะเวลา (Timeline)\" ในการดำเนินการ","มีเอกสารสรุปตัวชี้วัดระดับองค์กร (Corporate KPIs) / มิติบังคับ: มีตารางถ่ายทอดตัวชี้วัดองค์กร ลงสู่ตัวชี้วัดระดับสายงาน โดยต้องแสดงให้เห็นว่า \"ทุกตัวชี้วัด (100%)\" ขององค์กร มีสายงานรับผิดชอบครบถ้วน ห้ามมีตัวชี้วัดใดถูกปล่อยทิ้งไว้","มิติความสอดคล้องของตัวชี้วัด: แผนปฏิบัติการระดับสายงาน มีการตั้งตัวชี้วัดที่สอดรับและผลักดันตัวชี้วัดระดับองค์กร / มิติความสอดคล้องของกิจกรรม: กิจกรรม/โครงการในระดับสายงาน มีความสอดคล้องและสนับสนุนแผนปฏิบัติการระดับองค์กร","มิติความครบถ้วนของประเภทตัวชี้วัด: ในแต่ละแผนปฏิบัติการ ต้องมีการกำหนดตัวชี้วัดครบทั้ง 3 มิติ ได้แก่ (1) ตัวชี้วัดที่แสดงความก้าวหน้า (KPI in Process / Leading Indicator) / (2) ตัวชี้วัดผลผลิต (Output) / (3) ตัวชี้วัดผลลัพธ์ (Outcome) / มิติบังคับ Cross-Enabler: มีหลักฐานยืนยันว่า ตัวชี้วัดเหล่านี้ได้ถูกส่งต่อไปบรรจุใน \"ระบบประเมินผลการปฏิบัติงาน (PMS)\" ภายใต้แผนแม่บททรัพยากรบุคคล (HCM) เรียบร้อยแล้ว","มีแนวทางการประเมินประสิทธิผลของกระบวนการกำหนดตัวชี้วัด / มีหลักฐานการนำผลประเมิน หรือจุดอ่อนที่พบ ไปปรับปรุงกระบวนการ/ระบบงานในปีถัดไป"]},{"id":"6.4","grp":"6","gname":"กระบวนการถ่ายทอดแผนปฏิบัติการ","gw":15,"gs68":2.3333,"name":"กระบวนการถ่ายทอดตัวชี้วัดระดับองค์กรสู่ตัวชี้วัดระดับแผนงานและโครงการ","w":4,"s68":2,"status":"ยังไม่เริ่ม","statusNote":"","scope":"ขอบเขตการประเมินในข้อนี้ มุ่งเน้นไปที่ \"การทำให้แผนเป็นจริง (Actionable Plan)\" โดยมีพระเอกคือ \"Gantt Chart\" ผู้ตรวจจะกางแผนปฏิบัติการดูว่า โครงการที่ตั้งมานั้นถูกซอยย่อยเป็นกิจกรรม (Work Breakdown Structure) หรือไม่ และที่สำคัญคือ หากเป็นโครงการที่ต้องทำร่วมกันหลายฝ่าย (Cross-functional) ได้มีการแบ่งเค้กความรับผิดชอบในแต่ละกิจกรรมย่อยชัดเจนหรือไม่ หรือแค่ใส่ชื่อฝ่ายหลักฝ่ายเดียวแบบเหมาเข่ง","levelSumm":["มีแนวทาง/ขั้นตอนการแปลงแผนปฏิบัติการลงสู่การปฏิบัติจริง","มิติองค์ประกอบ: แผนปฏิบัติการมีองค์ประกอบของแผนที่ดีครบถ้วน (ชื่อแผน, วัตถุประสงค์, งบประมาณ, ผู้รับผิดชอบ)","มิติการตรวจสอบความครอบคลุม (Coverage Check): มีกระบวนการ/หลักฐานการตรวจสอบ เพื่อยืนยันความมั่นใจว่า \"ทุกตัวชี้วัดในระดับองค์กร มีตัวชี้วัดระดับสายงาน และระดับบุคลากรรองรับครบถ้วน 100%\"","มิติการผูกแรงจูงใจ: มีการนำความสำเร็จของแผนงานและโครงการ ไปเชื่อมโยงเข้ากับ \"ระบบประเมินผลและแรงจูงใจ (PMS)\" ของหน่วยงานที่เกี่ยวข้อง","มีการประเมินประสิทธิผลของกระบวนการจัดทำ/แปลงแผนปฏิบัติการ"],"good":["มีการกำหนดขั้นตอนและผู้รับผิดชอบกระบวนการแปลงแผนปฏิบัติการสู่การปฏิบัติไว้อย่างชัดเจน ภายใต้ SIPOC 4 (ขั้นตอนที่ 16-17)","แผนปฏิบัติการของ กทท. มีองค์ประกอบที่ครบถ้วน มีการระบุผู้รับผิดชอบในแต่ละแผนปฏิบัติการอย่างชัดเจน","มีการจัดทำแผนการดำเนินงานในรูปแบบกิจกรรมย่อย พร้อมระบุกรอบเวลาดำเนินการที่ชัดเจนด้วย Gantt Chart เพื่อนำไปสู่การปฏิบัติงานจริง"],"gaps":["ขาดหลักฐานการตรวจสอบความสอดคล้อง (Gap ระดับ 3): แม้จะมีการกระจายเป้าหมาย (Cascade) ลงไปแล้ว แต่ยังขาดกระบวนการหรือหลักฐานที่แสดงให้เห็นถึง \"การตรวจสอบ (Verification)\" เพื่อยืนยันความสอดคล้องระหว่างแผน/ตัวชี้วัดระดับองค์กร กับแผน/ตัวชี้วัดระดับสายงานอย่างเป็นรูปธรรม","ความเชื่อมโยงกับระบบประเมินผล HR (Gap ระดับ 4): การกำหนดตัวชี้วัดที่แสดงความก้าวหน้า ผลผลิต และผลลัพธ์ของแผนปฏิบัติการ ยังไม่สามารถแสดงความเชื่อมโยงกับ ระบบประเมินผลการปฏิบัติงาน (PMS) ที่อยู่ในความรับผิดชอบของฝ่ายทรัพยากรบุคคล (ฝบ.) ได้อย่างชัดเจนและเป็นเนื้อเดียวกัน","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด ผลการประเมิน และหลักฐานการปรับปรุงกระบวนการถ่ายทอดตัวชี้วัดนี้"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอน ผู้รับผิดชอบ และกรอบเวลาชัดเจน (SIPOC 4 ขั้นตอนที่ 16-17)","ระดับ 2 (ผ่านเกณฑ์): แผนปฏิบัติการมีองค์ประกอบครบถ้วน มีผู้รับผิดชอบชัดเจน และมีการจัดทำ Gantt Chart ในแต่ละกิจกรรมย่อย","ระดับ 3 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): กทท. ระบุว่าฝ่ายกลยุทธ์องค์กร (ฝก.) เป็นผู้ตรวจสอบความถูกต้องสอดคล้องก่อนนำเสนอผู้บริหาร แต่ในมุมมองของผู้ประเมิน TRIS หลักฐานที่ส่งยังไม่สามารถแสดงรายละเอียดการตรวจสอบเพื่อสร้าง \"ความมั่นใจ\" ถึงความสอดคล้องได้อย่างเพียงพอ","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. ส่งเอกสารให้ฝ่าย HR นำไปใช้ประกอบการประเมินผลแล้ว แต่หลักฐานยังไม่แสดงความเชื่อมโยงกับระบบ PMS อย่างแนบแน่นพอในสายตาผู้ประเมิน","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลกระบวนการ"],"tris":["\"ควรมีการแสดงรายละเอียดการตรวจสอบความสอดคล้องและเชื่อมโยงระหว่างแผนปฏิบัติการระดับองค์กรลงสู่แผนปฏิบัติการระดับสายงาน รวมถึงความสอดคล้องและเชื่อมโยงระหว่างการถ่ายทอดตัวชี้วัดและเป้าหมายระดับองค์กรสู่ตัวชี้วัดและเป้าหมายระดับสายงาน เพื่อแสดงความมั่นใจถึงความสอดคล้องดังกล่าว\" (คำอธิบาย: TRIS ต้องการเห็น \"เอกสาร/แบบฟอร์มการสอบทาน (Checklist/Sign-off)\" ที่ฝ่ายกลยุทธ์ใช้ตรวจเช็คว่า KPI ของฝ่ายงานที่ส่งมานั้น สอดรับกับ KPI ขององค์กรเป๊ะๆ แบบไม่มีหลุดกรอบ เพื่อยืนยันว่าได้ตรวจสอบแล้วจริงๆ)"],"suggest":["จัดทำแบบฟอร์มตรวจสอบความสอดคล้อง (Alignment Verification Checklist): ฝ่ายกลยุทธ์ (ฝก.) ต้องสร้างแบบฟอร์มให้ผู้อำนวยการศูนย์ EVM หรือหัวหน้าสายงาน ลงนามยืนยัน (Sign-off) ร่วมกับ ฝก. ว่า \"ตัวชี้วัดระดับสายงานข้อที่... ได้ตรวจสอบแล้วว่าสอดคล้องและสนับสนุนตัวชี้วัดองค์กรข้อที่...\" เพื่อใช้เป็นหลักฐานการตรวจสอบที่จับต้องได้ (ปิด Gap ระดับ 3)","บูรณาการตัวชี้วัดแผนงานเข้าสู่ระบบประเมินผลรายบุคคล (PMS Integration): ดำเนินการคล้ายกับข้อ 6.3 คือต้องทำงานร่วมกับฝ่าย HR นำตัวชี้วัดความสำเร็จของแผนปฏิบัติการ (Project KPI) ไปผูกเป็นน้ำหนักคะแนน (Weight) ในการประเมินผลงานประจำปีของพนักงานที่รับผิดชอบโครงการนั้นจริงๆ (ปิด Gap ระดับ 4)","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): ตั้งตัวชี้วัดประเมินกระบวนการถ่ายทอดตัวชี้วัด เช่น \"ร้อยละของตัวชี้วัดสายงานที่สอดคล้องกับตัวชี้วัดองค์กรจากการส่งครั้งแรก\" และจัดทำรายงานการปรับปรุงกระบวนการในปีถัดไป"],"docs":["รายงาน/แบบฟอร์มการตรวจสอบความสอดคล้องตัวชี้วัดระดับองค์กรสู่ระดับสายงาน (KPI Alignment Verification Report): ที่มีการลงนามรับรองจากผู้ตรวจสอบ (เพื่อยืนยันระดับ 3)","เอกสารแสดงความเชื่อมโยงตัวชี้วัดโครงการกับแบบประเมินผลการปฏิบัติงานบุคคล (PMS Linkage Form): ที่ออกร่วมกับฝ่าย HR (เพื่อยืนยันระดับ 4)","รายงานการประเมินประสิทธิผลกระบวนการถ่ายทอดตัวชี้วัด: พร้อมหลักฐานการนำข้อบกพร่องไปปรับปรุง (เพื่อยืนยันระดับ 5)"],"bestprac":["ทั้ง รฟม. และ กทพ. ล้วนโดน TRIS ติงในเรื่องนี้เช่นกัน โดย รฟม. ได้รับ Feedback ว่า \"ควรมีความเชื่อมโยงกับระบบประเมินผลการปฏิบัติงานที่ปรากฏในหัวข้อการบริหารทรัพยากรบุคคลอย่างครอบคลุมและครบถ้วน\" และ กทพ. ก็ได้รับ Feedback ในลักษณะเดียวกัน"],"minReqs":{"1":["รัฐวิสาหกิจมีการกำหนด/ระบุขั้นตอนที่สำคัญของกระบวนการแปลงแผนปฏิบัติการสู่การปฏิบัติ และผู้ที่เกี่ยวข้อง รวมถึงกำหนดกรอบเวลาในการดำเนินงาน"],"2":["แผนปฏิบัติการเป็นไปตามองค์ประกอบที่ดีครบถ้วน และมีผู้รับผิดชอบในแต่ละแผนปฏิบัติการ รวมถึงมีการจัดทำแผนการดำเนินงานในกิจกรรมย่อย (Gantt Chart) เพื่อนำไปสู่การปฏิบัติ โดยเฉพาะแผนปฏิบัติการที่ต้องมีการดำเนินงานร่วมกัน จะต้องมีการระบุกิจกรรมย่อย และหน้าที่ความรับผิดชอบที่ชัดเจนของแต่ละสายงาน"],"3":["มีกระบวนการตรวจสอบความสอดคล้องของการถ่ายทอดแผนและตัวชี้วัดจากระดับองค์กรลงสู่สายงาน พร้อมทั้งมีหลักฐาน \"แสดงความมั่นใจ (Assurance)\" ว่าสอดคล้องกันครบถ้วน 100%"],"4":["แผนปฏิบัติการระดับสายงานมีการกำหนดตัวชี้วัดครบทุกมิติ (ความก้าวหน้า ผลผลิต ผลลัพธ์) โดยบังคับ \"เชื่อมโยงกับระบบประเมินผลการปฏิบัติงาน (PMS)\" ในด้านทรัพยากรบุคคล (HCM)"],"5":["มีการประเมินประสิทธิผลของกระบวนการจัดทำแผนปฏิบัติการ และนำข้อมูลไปใช้เพื่อปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก \"Gantt Chart เหมาเข่ง\" (The Superficial Gantt Trap) หลายองค์กรทำ Gantt Chart โดยเขียนแค่ชื่อโครงการ แล้วลากเส้นยาวตั้งแต่เดือน ต.ค. ถึง ก.ย. ซึ่งถือว่าผิดเกณฑ์! เกณฑ์บังคับชัดเจนว่าต้องทำในระดับ \"กิจกรรมย่อย (Sub-tasks)\" (เช่น เดือน 1 ร่าง TOR, เดือน 2 จัดซื้อ, เดือน 3 พัฒนาระบบ) หากไม่มีการแตกกิจกรรมย่อย ผู้ตรวจจะตีตก Level 2 ทันที","กับดัก \"แผนบูรณาการที่ไร้เจ้าภาพย่อย\" (The Missing Co-Owner Trap): นี่คือจุดที่ สคร. เน้นย้ำเป็นพิเศษในคู่มือคำว่า \"โดยเฉพาะแผนปฏิบัติการที่ต้องมีการดำเนินงานร่วมกัน จะต้องระบุกิจกรรมย่อย และหน้าที่ความรับผิดชอบที่ชัดเจนของแต่ละสายงาน\" หมายความว่า ถ้าเป็นโครงการพัฒนาระบบ IT ที่ฝ่าย IT เป็นเจ้าภาพหลัก แต่ต้องให้ฝ่าย HR เตรียมข้อมูล ใน Gantt Chart ตรงกิจกรรมย่อย \"การเตรียมข้อมูล\" ต้องระบุชื่อ \"ฝ่าย HR\" กำกับไว้ด้วย หากใส่ชื่อฝ่าย IT รับผิดชอบคนเดียวทั้งโครงการ ผู้ตรวจจะถือว่าการแปลงแผนไม่สะท้อนความเป็นจริง"],"3":["ระบบ Check & Balance ของ KPI (The 100% Assurance Trap) ตามหมายเหตุในคู่มือ SE-AM ระบุว่าองค์กรต้องมี \"กระบวนการตรวจสอบเพื่อแสดงความมั่นใจ (Assurance)\" ว่า KPI ระดับบนถูกถ่ายทอดลงล่างครบถ้วน ฝ่ายกลยุทธ์ต้องมีตาราง Checklist ไขว้ (Cross-check Matrix) ที่ติ๊กสอบทาน KPI ทุกตัวส่งให้ผู้ตรวจดูเป็นหลักฐานยืนยัน"]},"scopeNote":"ขอบเขตการประเมินในข้อนี้ มุ่งเน้นไปที่ \"การทำให้แผนเป็นจริง (Actionable Plan)\" โดยมีพระเอกคือ \"Gantt Chart\" ผู้ตรวจจะกางแผนปฏิบัติการดูว่า โครงการที่ตั้งมานั้นถูกซอยย่อยเป็นกิจกรรม (Work Breakdown Structure) หรือไม่ และที่สำคัญคือ หากเป็นโครงการที่ต้องทำร่วมกันหลายฝ่าย (Cross-functional) ได้มีการแบ่งเค้กความรับผิดชอบในแต่ละกิจกรรมย่อยชัดเจนหรือไม่ หรือแค่ใส่ชื่อฝ่ายหลักฝ่ายเดียวแบบเหมาเข่ง","actions":["จัดทำแบบฟอร์มตรวจสอบความสอดคล้อง (Alignment Verification Checklist): ฝ่ายกลยุทธ์ (ฝก.) ต้องสร้างแบบฟอร์มให้ผู้อำนวยการศูนย์ EVM หรือหัวหน้าสายงาน ลงนามยืนยัน (Sign-off) ร่วมกับ ฝก. ว่า \"ตัวชี้วัดระดับสายงานข้อที่... ได้ตรวจสอบแล้วว่าสอดคล้องและสนับสนุนตัวชี้วัดองค์กรข้อที่...\" เพื่อใช้เป็นหลักฐานการตรวจสอบที่จับต้องได้ (ปิด Gap ระดับ 3)","บูรณาการตัวชี้วัดแผนงานเข้าสู่ระบบประเมินผลรายบุคคล (PMS Integration): ดำเนินการคล้ายกับข้อ 6.3 คือต้องทำงานร่วมกับฝ่าย HR นำตัวชี้วัดความสำเร็จของแผนปฏิบัติการ (Project KPI) ไปผูกเป็นน้ำหนักคะแนน (Weight) ในการประเมินผลงานประจำปีของพนักงานที่รับผิดชอบโครงการนั้นจริงๆ (ปิด Gap ระดับ 4)","กำหนด KPI ประเมินกระบวนการ (ระดับ 5): ตั้งตัวชี้วัดประเมินกระบวนการถ่ายทอดตัวชี้วัด เช่น \"ร้อยละของตัวชี้วัดสายงานที่สอดคล้องกับตัวชี้วัดองค์กรจากการส่งครั้งแรก\" และจัดทำรายงานการปรับปรุงกระบวนการในปีถัดไป"],"dimLevels":["มีแนวทาง/ขั้นตอนการแปลงแผนปฏิบัติการลงสู่การปฏิบัติจริง / ระบุ \"ผู้ที่เกี่ยวข้อง\" และ \"กรอบเวลา (Timeline)\" ในแต่ละขั้นตอนอย่างชัดเจน","มิติองค์ประกอบ: แผนปฏิบัติการมีองค์ประกอบของแผนที่ดีครบถ้วน (ชื่อแผน, วัตถุประสงค์, งบประมาณ, ผู้รับผิดชอบ) / มิติบังคับ Gantt Chart: ทุกแผนปฏิบัติการต้องมีการจัดทำ \"แผนการดำเนินงานในกิจกรรมย่อย (Gantt Chart)\" / มิติบังคับแผนงานร่วม (Cross-functional): โครงการที่ต้องมีการดำเนินงานร่วมกัน ต้องระบุกิจกรรมย่อย และแยกหน้าที่ความรับผิดชอบของแต่ละสายงานกำกับไว้ใน Gantt Chart ให้ชัดเจน","มิติการผูกแรงจูงใจ: มีการนำความสำเร็จของแผนงานและโครงการ ไปเชื่อมโยงเข้ากับ \"ระบบประเมินผลและแรงจูงใจ (PMS)\" ของหน่วยงานที่เกี่ยวข้อง / มิติการตรวจสอบความครอบคลุม (Coverage Check): มีกระบวนการ/หลักฐานการตรวจสอบ เพื่อยืนยันความมั่นใจว่า \"ทุกตัวชี้วัดในระดับองค์กร มีตัวชี้วัดระดับสายงาน และระดับบุคลากรรองรับครบถ้วน 100%\"","มิติการผูกแรงจูงใจ: มีการนำความสำเร็จของแผนงานและโครงการ ไปเชื่อมโยงเข้ากับ \"ระบบประเมินผลและแรงจูงใจ (PMS)\" ของหน่วยงานที่เกี่ยวข้อง / มิติการตรวจสอบความครอบคลุม (Coverage Check): มีกระบวนการ/หลักฐานการตรวจสอบ เพื่อยืนยันความมั่นใจว่า \"ทุกตัวชี้วัดในระดับองค์กร มีตัวชี้วัดระดับสายงาน และระดับบุคลากรรองรับครบถ้วน 100%\"","มีการประเมินประสิทธิผลของกระบวนการจัดทำ/แปลงแผนปฏิบัติการ / มีหลักฐานนำข้อมูลไปใช้ปรับปรุงกระบวนการในปีถัดไป"]},{"id":"7.1","grp":"7","gname":"กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ และปรับเปลี่ยนแผนงาน","gw":15,"gs68":2.1,"name":"กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ","w":5,"s68":3,"status":"ยังไม่เริ่ม","statusNote":"","scope":"ขอบเขตการประเมินมุ่งเน้นที่ \"ระบบการเฝ้าระวังและรายงานผล\" ผู้ตรวจต้องการเห็นว่าองค์กรไม่ได้รอให้จบปีแล้วค่อยมาดูว่าได้ตามเป้าหรือไม่ แต่ต้องมีระบบติดตาม \"รายไตรมาส\" ที่ชัดเจน และต้องมีตัวชี้วัดนำ (Leading Indicator) ที่ทำหน้าที่เป็น \"ระบบเตือนภัยล่วงหน้า (Early Warning System)\" เพื่อให้ผู้บริหารไหวตัวทัน นอกจากนี้ ในการติดตามผล ต้องเชิญฝ่าย HR และฝ่ายความเสี่ยง (RM) มาร่วมรับทราบความคืบหน้าด้วย","levelSumm":["มีคู่มือ/ขั้นตอน (SIPOC) การติดตามผลสำเร็จตามแผนปฏิบัติการอย่างชัดเจน","มีหลักฐานการสื่อสารกระบวนการติดตามผลให้ทุกหน่วยงานรับทราบ","มีหลักฐานแสดงว่า ระบบติดตามผลของโครงการ (Project Level) สามารถส่งข้อมูลวิ่งกลับไปสะท้อนผลสำเร็จของตัวชี้วัดระดับองค์กร (Corporate Level) ได้อย่างสอดคล้องกัน","มิติบังคับแผนแม่บท: ในกระบวนการติดตามผล/รายงานผล ต้องแสดงให้เห็นการเชื่อมโยงข้อมูลกับ \"แผนบริหารและพัฒนาทรัพยากรบุคคล (HCM)\"","มีแนวทางการประเมินประสิทธิผลของกระบวนการติดตามผล"],"good":["มีการกำหนดกระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการไว้อย่างเป็นระบบใน SIPOC 8 พร้อมระบุกรอบเวลาดำเนินการที่ชัดเจน","มีการสื่อสารกระบวนการและรูปแบบการรายงานผลอย่างทั่วถึงผ่านหนังสือเวียนภายใน โดยกำหนดให้หน่วยงานต้องจัดทำแบบฟอร์มที่มีทั้งตัวชี้วัดกระบวนการ (KPI in Process / Leading Indicator) และค่าเป้าหมายระดับ 1-4 (Lagging Indicator)","มีการบูรณาการการติดตามผลเข้ากับการถ่ายทอดตัวชี้วัด (Cascade KPI) และกำหนดให้หน่วยงานต้องรายงานความคืบหน้า รวมถึงคาดการณ์ผลการดำเนินงานเป็นประจำทุกไตรมาส","มีการนำเสนอผลการติดตามรายไตรมาสให้คณะกรรมการฝ่ายบริหาร กทท., คณะกรรมการบริหารความเสี่ยงฯ และคณะกรรมการ กทท. (บอร์ด) รับทราบ เพื่อใช้เป็นข้อมูลในการตัดสินใจและปรับแก้ปัญหาได้ทันกาล"],"gaps":["การบูรณาการข้อมูลติดตามผลกับแผนแม่บทอื่น (Gap ระดับ 4): แม้ กทท. จะมีการนำข้อมูลไปรายงานร่วมกับคณะกรรมการความเสี่ยงฯ แต่ในมุมมองผู้ประเมินยังถือว่าขาดการบูรณาการกระบวนการติดตามผลอย่างเป็นรูปธรรมร่วมกับแผนแม่บทสำคัญอื่นๆ (เช่น แผนทรัพยากรบุคคล แผนเทคโนโลยีดิจิทัล และแผนนวัตกรรม) เพื่อให้เห็นภาพความสำเร็จที่สอดคล้องกัน","ระบบเทคโนโลยีสารสนเทศและระบบเตือนภัยล่วงหน้า: ยังขาดการนำระบบ IT เข้ามาใช้ติดตามความคืบหน้าแบบ Real-time และยังไม่เห็นภาพของ \"ระบบเตือนภัยล่วงหน้า (Early Warning System: EWS)\" หากตัวชี้วัดมีแนวโน้มจะไม่บรรลุเป้า","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด (KPI in process) และผลการประเมินประสิทธิผลของกระบวนการติดตามแผน (SIPOC 8) เอง เพื่อนำไปปรับปรุงให้ดีขึ้น"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีขั้นตอนการติดตามผล กำหนด Leading Indicator และกรอบเวลาชัดเจน (SIPOC 8)","ระดับ 2 (ผ่านเกณฑ์): สื่อสารทั่วองค์กร มีการรายงานผลรายไตรมาส และหากปรับเปลี่ยนแผนต้องขอความเห็นชอบ","ระดับ 3 (ผ่านเกณฑ์): บูรณาการกระบวนการติดตามเข้ากับการถ่ายทอดตัวชี้วัดระดับแผนงานและโครงการ","ระดับ 4 (ไม่ผ่านเกณฑ์): กทท. นำส่งหลักฐานการประชุมร่วมกับสำนักบริหารความเสี่ยงฯ (สสค.) แต่ผู้ประเมินมองว่าหลักฐานยังไม่ครอบคลุมการบูรณาการกับแผนแม่บทอื่น (เช่น HR) อย่างเพียงพอ","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานและแนวทางการประเมินประสิทธิผลกระบวนการ"],"tris":["\"ควรมีการบูรณาการกระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการกับแผนงานที่สำคัญที่ปรากฏในแผนแม่บทในหัวข้ออื่น เช่น แผนการบริหารและพัฒนาทรัพยากรบุคคล แผนการบริหารความเสี่ยง เป็นต้น\" (คำอธิบาย: TRIS ต้องการเห็นกลไกที่ว่า เมื่อฝ่ายกลยุทธ์ติดตามความคืบหน้าของยุทธศาสตร์องค์กร ข้อมูลนี้ต้องลิงก์ไปให้ฝ่าย HR ทราบด้วยว่าโครงการนี้ขาดคนหรือไม่ หรือฝ่าย IT ต้องทราบด้วยว่าระบบของโครงการนี้ติดขัดตรงไหน เป็นการมอนิเตอร์ร่วมกัน ไม่ใช่ต่างคนต่างตาม)"],"suggest":["จัดทำรายงานติดตามผลแบบบูรณาการข้ามสายงาน (Integrated Performance Report): ฝ่ายกลยุทธ์ (ฝก.) ต้องปรับแบบฟอร์มการติดตามผลรายไตรมาส โดยเพิ่มคอลัมน์ \"ผลกระทบต่อแผนแม่บท\" เช่น ให้เจ้าของโครงการระบุว่าความล่าช้านี้ส่งผลกระทบต่อแผน HR และแผน IT อย่างไร เพื่อเป็นหลักฐานการบูรณาการ","สร้างระบบเตือนภัยล่วงหน้า (Early Warning System - EWS): นำค่า Leading Indicator มาตั้งเป็นสัญญาณไฟจราจร (Traffic Light) หากโครงการไหนไฟเหลืองหรือไฟแดง ระบบต้องแจ้งเตือนอัตโนมัติให้ผู้บริหารแผนแม่บทที่เกี่ยวข้องเข้ามาช่วยแก้ปัญหา","กำหนด KPI ประเมินกระบวนการ SIPOC 8 (ระดับ 5): ตั้งตัวชี้วัดการทำงานของ ฝก. เช่น \"ร้อยละความตรงต่อเวลาของการส่งรายงานรายไตรมาส\" หรือ \"ร้อยละของโครงการที่สามารถแก้ปัญหาได้ทันหลังได้รับ Early Warning\" และนำมาปรับปรุงคู่มือ"],"docs":["รายงานผลการติดตามแผนปฏิบัติการบูรณาการร่วมกับแผนแม่บท (Integrated Monitoring Dashboard/Report): ที่ครอบคลุมทั้งแผนองค์กร แผน HR แผน IT แผนความเสี่ยง","เอกสาร/คู่มือแสดงกลไกการทำงานของระบบเตือนภัยล่วงหน้า (Early Warning System: EWS)","รายงานการประเมินประสิทธิผลกระบวนการติดตามผล (SIPOC 8): พร้อมบันทึกการปรับปรุงกระบวนการ (เพื่อยืนยันระดับ 5)"],"bestprac":["กทพ. ทำคะแนนทะลุขึ้นไปถึงระดับ 4 ได้สำเร็จ โดย TRIS ชื่นชม กทพ. ว่า \"มีการติดตามผลสำเร็จเป็นรายไตรมาส ผ่านระบบเทคโนโลยีสารสนเทศ ซึ่งเชื่อมโยงตัวชี้วัดของวัตถุประสงค์เชิงกลยุทธ์กับแผนปฏิบัติงานและแผนแม่บท\" ในขณะที่ รฟม. ได้รับข้อเสนอแนะจาก TRIS แบบขั้นแอดวานซ์ว่า \"ควรมีการพัฒนาต่อยอด Leading-Lagging Indicators ... ให้เกิดเป็นระบบเตือนภัยล่วงหน้า (Early Warning System : EWS)\"","กทท. ต้องนำข้อดีของทั้ง 2 องค์กรมารวมกัน คือ \"เปลี่ยนการติดตามผลผ่านกระดาษ/Excel มาเป็นระบบเทคโนโลยีสารสนเทศ (e-Tracking Dashboard) ที่เชื่อมโยง KPI องค์กรกับแผนแม่บท\" และเพิ่มฟังก์ชัน \"Early Warning System (EWS)\" เข้าไปในระบบ หากสร้างระบบนี้สำเร็จและใช้งานได้จริง กทท. จะก้าวข้ามไปสู่ระดับ 4.0 - 5.0 และเป็น Best Practice ของหมวดนี้อย่างสมบูรณ์แบบ"],"minReqs":{"1":["มีคู่มือ/กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ และกำหนดกรอบเวลาชัดเจน"],"2":["สื่อสารกระบวนการติดตามผลให้ทั่วถึง และดำเนินการติดตามผล \"เป็นรายไตรมาส\""],"3":["บูรณาการกระบวนการติดตามผล เข้ากับกระบวนการถ่ายทอดตัวชี้วัดระดับองค์กรลงสู่โครงการ"],"4":["กระบวนการติดตามผลต้อง \"บูรณาการร่วมกับแผนแม่บทอื่น\" โดยเฉพาะ แผนทรัพยากรบุคคล (HCM) และแผนบริหารความเสี่ยง (RM)"],"5":["ประเมินประสิทธิผลของกระบวนการติดตามผล และนำไปปรับปรุงกระบวนการในปีถัดไป"]},"subComps":{"4":["กับดัก \"ลืมเชิญเพื่อนบ้าน\" (Missing Cross-Functional Integration): จากรายงานของ กทท. ปี 68 ผู้ตรวจระบุชัดเจนว่า กทท. ติดตามผลได้ดีแล้ว \"อย่างไรก็ตาม ควรมีการบูรณาการกระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการกับแผนงานที่สำคัญที่ปรากฏในแผนแม่บทในหัวข้ออื่น เช่น แผนการบริหารและพัฒนาทรัพยากรบุคคล แผนการบริหารความเสี่ยง เป็นต้น\" วิธีแก้คือ ในการประชุมคณะกรรมการติดตามผลแผนปฏิบัติการ ต้องมีวาระที่เชื่อมโยงถึงความเสี่ยงของโครงการ และต้องมีตัวแทนจาก สสค. (ความเสี่ยง) และ ฝบ. (HR) นั่งอยู่ในคณะกรรมการชุดนี้ด้วย","กับดัก \"ขาดระบบเตือนภัยล่วงหน้า\" (The Early Warning Trap - ซ่อนอยู่ใน คู่มือคำอธิบายเกณฑ์): ในหมายเหตุของคู่มือ SE-AM ระบุว่า หากพบปัญหาองค์กรต้องมี \"การวิเคราะห์ถึง Leading Indicator หรือมีการทำระบบเตือนภัยล่วงหน้า (Early Warning System) ก่อนที่ตัวชี้วัดดังกล่าวจะไม่บรรลุเป้าหมาย\" ดังนั้น ในแบบฟอร์มการรายงานผลรายไตรมาส ต้องมีช่องให้ระบุ Leading Indicator (เช่น % ความคืบหน้าของงานจัดซื้อ) เพื่อให้ผู้บริหารเห็นสัญญาณอันตรายก่อนที่โครงการจะล้มเหลว"],"5":["กับดัก \"KPI ประเมินกระบวนการอ่อนแอ\" (Weak Process KPI): ผู้ตรวจคอมเมนต์ทั้ง กทพ. และ รฟม. เหมือนกันเป๊ะว่า \"ควรกำหนดแนวทางในการประเมินประสิทธิผลกระบวนการในทุกขั้นตอน และควรกำหนดตัวชี้วัดสำหรับการประเมินกระบวนการที่สามารถสะท้อนถึงประสิทธิภาพและประสิทธิผล\" หมายความว่า ห้ามประเมินแค่ว่า \"ส่งรายงานครบตรงเวลาไหม\" แต่ต้องประเมินด้วยว่า \"ข้อมูลในรายงานมีความถูกต้องและช่วยในการตัดสินใจของผู้บริหารได้กี่เปอร์เซ็นต์\""]},"scopeNote":"ขอบเขตการประเมินมุ่งเน้นที่ \"ระบบการเฝ้าระวังและรายงานผล\" ผู้ตรวจต้องการเห็นว่าองค์กรไม่ได้รอให้จบปีแล้วค่อยมาดูว่าได้ตามเป้าหรือไม่ แต่ต้องมีระบบติดตาม \"รายไตรมาส\" ที่ชัดเจน และต้องมีตัวชี้วัดนำ (Leading Indicator) ที่ทำหน้าที่เป็น \"ระบบเตือนภัยล่วงหน้า (Early Warning System)\" เพื่อให้ผู้บริหารไหวตัวทัน นอกจากนี้ ในการติดตามผล ต้องเชิญฝ่าย HR และฝ่ายความเสี่ยง (RM) มาร่วมรับทราบความคืบหน้าด้วย","actions":["จัดทำรายงานติดตามผลแบบบูรณาการข้ามสายงาน (Integrated Performance Report): ฝ่ายกลยุทธ์ (ฝก.) ต้องปรับแบบฟอร์มการติดตามผลรายไตรมาส โดยเพิ่มคอลัมน์ \"ผลกระทบต่อแผนแม่บท\" เช่น ให้เจ้าของโครงการระบุว่าความล่าช้านี้ส่งผลกระทบต่อแผน HR และแผน IT อย่างไร เพื่อเป็นหลักฐานการบูรณาการ","สร้างระบบเตือนภัยล่วงหน้า (Early Warning System - EWS): นำค่า Leading Indicator มาตั้งเป็นสัญญาณไฟจราจร (Traffic Light) หากโครงการไหนไฟเหลืองหรือไฟแดง ระบบต้องแจ้งเตือนอัตโนมัติให้ผู้บริหารแผนแม่บทที่เกี่ยวข้องเข้ามาช่วยแก้ปัญหา","กำหนด KPI ประเมินกระบวนการ SIPOC 8 (ระดับ 5): ตั้งตัวชี้วัดการทำงานของ ฝก. เช่น \"ร้อยละความตรงต่อเวลาของการส่งรายงานรายไตรมาส\" หรือ \"ร้อยละของโครงการที่สามารถแก้ปัญหาได้ทันหลังได้รับ Early Warning\" และนำมาปรับปรุงคู่มือ"],"dimLevels":["มีคู่มือ/ขั้นตอน (SIPOC) การติดตามผลสำเร็จตามแผนปฏิบัติการอย่างชัดเจน / ระบุ \"กรอบเวลา (Timeline)\" ของการรายงานผลไว้อย่างเป็นระบบ","มีหลักฐานการสื่อสารกระบวนการติดตามผลให้ทุกหน่วยงานรับทราบ / มิติบังคับ: มีการรวบรวมและรายงานผลการดำเนินงานตามแผนปฏิบัติการ \"เป็นรายไตรมาส (Quarterly)\" ครบถ้วน","มีหลักฐานแสดงว่า ระบบติดตามผลของโครงการ (Project Level) สามารถส่งข้อมูลวิ่งกลับไปสะท้อนผลสำเร็จของตัวชี้วัดระดับองค์กร (Corporate Level) ได้อย่างสอดคล้องกัน","มิติบังคับแผนแม่บท: ในกระบวนการติดตามผล/รายงานผล ต้องแสดงให้เห็นการเชื่อมโยงข้อมูลกับ \"แผนบริหารและพัฒนาทรัพยากรบุคคล (HCM)\" / มิติบังคับแผนแม่บท: ในกระบวนการติดตามผล/รายงานผล ต้องแสดงให้เห็นการเชื่อมโยงข้อมูลกับ \"แผนบริหารความเสี่ยง (RM)\"","มีแนวทางการประเมินประสิทธิผลของกระบวนการติดตามผล / มีผลลัพธ์และหลักฐานการนำผลไปใช้ปรับปรุงกระบวนการติดตามงานในปีถัดไป"]},{"id":"7.2","grp":"7","gname":"กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ และปรับเปลี่ยนแผนงาน","gw":15,"gs68":2.1,"name":"กระบวนการคาดการณ์ผลการดำเนินงาน","w":5,"s68":1.65,"status":"ยังไม่เริ่ม","statusNote":"","scope":"เน้นไปที่ \"ความแม่นยำและเครื่องมือที่ใช้พยากรณ์ (Forecasting Tools & Accuracy)\" รัฐวิสาหกิจต้องแสดงให้เห็นว่า การคาดการณ์ผลการดำเนินงานนั้นไม่ได้มาจากการ \"นั่งเดา หรือ นั่งเทียน\" แต่มีชุดข้อมูล (Data set) มีตัวชี้วัดนำ (Leading Indicator) และใช้เครื่องมือทางสถิติ/Data Analytics มาช่วยทำนาย และที่สำคัญคือ หากระบบทำนายว่า \"สิ้นปีนี้ตกเป้าแน่นอน\" องค์กรได้สั่งการให้ปรับเปลี่ยนแผนงาน (Actionable Insight) เพื่อกู้สถานการณ์ทันทีหรือไม่","levelSumm":["มีคู่มือ/กระบวนการ (SIPOC) สำหรับการคาดการณ์ผลการดำเนินงาน","มิติความครบถ้วน: มีหลักฐานการคาดการณ์ผลดำเนินงาน \"ครบทุกตัวชี้วัดที่สำคัญ\" ครอบคลุมทั้ง ตัวชี้วัดทางการเงินและมิใช่การเงิน","มิติการเปรียบเทียบ: นำผลการคาดการณ์มากางเทียบกับเป้าหมายองค์กร และบังคับเทียบกับ \"ผลการดำเนินงานของคู่เทียบ (Benchmark)\"","มิติบูรณาการแผนแม่บท: หลักฐานแสดงให้เห็นว่า เมื่อมีการปรับเปลี่ยนแผนจากผลการคาดการณ์ ข้อมูลดังกล่าวได้ถูกส่งไปปรับเปลี่ยนในแผนแม่บทอื่นด้วย (เช่น ส่งไปให้แผนบริหารความเสี่ยง (RM) ปรับปรุงมาตรการควบคุม)","มีแนวทางการประเมินประสิทธิผลของกระบวนการคาดการณ์ (เช่น ความแม่นยำของการพยากรณ์เทียบกับผลจริง)"],"good":["มีการกำหนดกระบวนการคาดการณ์ผลการดำเนินงานและกรอบเวลาที่ชัดเจน ไว้ในขั้นตอนที่ 1 ของ SIPOC 8 (กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ)","มีการสร้างแบบฟอร์มให้หน่วยงานรายงานความคืบหน้าและ \"คาดการณ์ผลการดำเนินงานล่วงหน้า\" เป็นประจำทุกไตรมาส","มีการกำหนดให้หน่วยงานใช้วิธีคิดในการคาดการณ์ \"อย่างน้อย 2 วิธี\" เพื่อให้เกิดความแม่นยำและใกล้เคียงความเป็นจริง","มีการนำผลการคาดการณ์มาจัดทำรายงานแบบสัญญาณไฟจราจร (Traffic Light: แดง เหลือง เขียว) เพื่อรายงานต่อคณะกรรมการฝ่ายบริหารและคณะกรรมการบริหารความเสี่ยงฯ ให้สามารถปรับแก้ Action Plan ได้ทันกาล"],"gaps":["ขาดการระบุเครื่องมือ/ที่มาของการคาดการณ์ที่ครบถ้วน (Gap ระดับ 2): แม้จะให้หน่วยงานคาดการณ์ แต่ กทท. ยังไม่ได้แสดงหลักฐานให้ผู้ประเมินเห็นชัดเจนว่า \"ใช้เครื่องมือทางสถิติหรือหลักการอะไร\" ในการคาดการณ์ และยังทำได้ \"ไม่ครบทุกตัวชี้วัดที่สำคัญ\"","ขาดการนำผลคาดการณ์ไปเทียบกับคู่เทียบเพื่อปรับกลยุทธ์ (Gap ระดับ 3): ยังขาดการนำผลที่คาดการณ์ไว้ล่วงหน้า ไปเปรียบเทียบกับ \"คู่เทียบ (Benchmark)\" เพื่อวิเคราะห์ว่าหากสิ้นปี กทท. ทำได้เท่านี้ จะชนะหรือแพ้คู่เทียบ และจะต้องปรับกลยุทธ์อย่างไร","ขาดการใช้เทคโนโลยีขั้นสูง (Data Analytics): การคาดการณ์ยังอาศัยการประเมินจากผู้ปฏิบัติงาน (Manual/แบบฟอร์ม) ขาดการนำระบบฐานข้อมูลขนาดใหญ่และโปรแกรมวิเคราะห์ข้อมูลมาช่วยพยากรณ์ล่วงหน้า","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด และผลการประเมินประสิทธิผลของกระบวนการคาดการณ์ผลการดำเนินงาน เพื่อนำไปปรับปรุง"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนและกรอบเวลาการคาดการณ์ผลการดำเนินงานไว้ใน SIPOC 8 อย่างชัดเจน","ระดับ 2 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): กทท. มีแบบฟอร์มให้คาดการณ์รายไตรมาส แต่ผู้ประเมินมองว่ายังขาดการแสดงเครื่องมือหรือที่มาของการคาดการณ์ที่ชัดเจน และยังไม่ครอบคลุมครบทุกตัวชี้วัดที่สำคัญ","ระดับ 3 (ไม่ผ่านเกณฑ์): กทท. นำผลไปรายงานเพื่อแก้ปัญหาแล้ว แต่ยังขาดการแสดงหลักฐานการปรับเปลี่ยนกลยุทธ์เมื่อพบว่าผลคาดการณ์มีความแตกต่างเมื่อ \"เทียบกับคู่เทียบ\"","ระดับ 4 (ไม่ผ่านเกณฑ์): แม้จะมีการรายงานผลคาดการณ์ให้คณะกรรมการความเสี่ยงฯ ทราบ แต่เมื่อระดับ 2 และ 3 ยังไม่สมบูรณ์ หลักฐานในระดับ 4 จึงตกไปโดยปริยาย","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการนำส่งหลักฐานการประเมินประสิทธิผลกระบวนการ"],"tris":["ผู้ประเมิน TRIS ระบุสาเหตุหลักที่ทำให้ กทท. ไม่ผ่านระดับ 2 ไว้อย่างชัดเจนว่า \"เริ่มมีกระบวนการคาดการณ์ผลการดำเนินงานขององค์กรในตัวชี้วัดที่สำคัญขององค์กร อย่างไรก็ตาม ยังไม่มีการแสดงเครื่องมือ/ที่มาในการคาดการณ์ผลการดำเนินงานตามตัวชี้วัดที่สำคัญครบทุกตัวชี้วัดที่สำคัญ\" (คำอธิบาย: TRIS ต้องการเห็นคู่มือหรือตารางที่ระบุชัดเจนว่า KPI ข้อที่ 1 ใช้สมการอะไรคาดการณ์ KPI ข้อที่ 2 ใช้โปรแกรมอะไรพยากรณ์ ไม่ใช่ปล่อยให้แต่ละฝ่ายกะเกณฑ์ตัวเลขกันมาเองแบบไม่มีหลักการที่ตรวจสอบได้)"],"suggest":["จัดทำคู่มือ \"เครื่องมือและระเบียบวิธีคาดการณ์ (Forecasting Methodology)\": ฝ่ายกลยุทธ์ต้องกำหนดเครื่องมือมาตรฐานสำหรับคาดการณ์ KPI ทุกตัว เช่น ตัวชี้วัดรายได้ใช้สมการเชิงเส้น (Regression), ตัวชี้วัดความพึงพอใจใช้สถิติย้อนหลัง (Time-series) และบังคับให้ทุกตัวชี้วัดต้องระบุที่มาของการคาดการณ์ (ปิด Gap ระดับ 2)","เพิ่มคอลัมน์ \"คู่เทียบ (Benchmark)\" ในรายงานรายไตรมาส: ในแบบฟอร์มรายงานผล นอกจากจะแสดง ค่าปัจจุบัน และ ค่าคาดการณ์สิ้นปี แล้ว ต้องเพิ่มช่อง \"เป้าหมายคู่เทียบ\" เพื่อให้เห็นว่าผลคาดการณ์ของเราจะสู้คู่เทียบได้หรือไม่ และสรุปเป็นแนวทางปรับกลยุทธ์ (ปิด Gap ระดับ 3)","กำหนด KPI ประเมินกระบวนการคาดการณ์ (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละความแม่นยำของการคาดการณ์ (Error Rate)\" เทียบกับผลที่เกิดขึ้นจริงตอนสิ้นปี และนำมาทบทวนปรับปรุงวิธีคิดในปีถัดไป"],"docs":["เอกสารคู่มือ/ตารางแสดงระเบียบวิธีและเครื่องมือคาดการณ์ผลการดำเนินงาน (KPI Forecasting Methodology Matrix): ที่ระบุวิธีการคำนวณครบ 100% ของตัวชี้วัดระดับองค์กร","รายงานคาดการณ์ผลการดำเนินงานเปรียบเทียบกับคู่เทียบ (Forecasting vs. Benchmark Report): พร้อมรายงานการประชุมที่มีมติให้ปรับกลยุทธ์เมื่อผลคาดการณ์สู้คู่เทียบไม่ได้","รายงานการประเมินความแม่นยำและประสิทธิผลของกระบวนการคาดการณ์: พร้อมหลักฐานการปรับปรุง (เพื่อยืนยันระดับ 5)"],"bestprac":["ทั้ง กทพ. และ รฟม. สอบผ่านในระดับ 2 ได้สำเร็จ เพราะมีการระบุชัดเจนว่าใช้ \"การคาดการณ์ด้วยวิธีเชิงปริมาณและเชิงคุณภาพ\" ครบถ้วนทุกตัวชี้วัด แต่ทั้งคู่ก็ไปตกม้าตายในระดับ 3 เรื่องการนำผลคาดการณ์ไปเทียบกับคู่เทียบ","ผู้ประเมิน TRIS ได้ให้คำแนะนำระดับสุดยอดกับทั้ง กทพ. และ รฟม. เหมือนกันว่า \"ควรมีการต่อยอดการพัฒนาระบบเทคโนโลยีสารสนเทศให้มีความสมบูรณ์ และนำเครื่องมือด้าน Data Analytics มาใช้สำหรับการวิเคราะห์และคาดการณ์ผลการดำเนินการที่มีความรวดเร็วและแม่นยำมากยิ่งขึ้น\""],"minReqs":{"1":["มีคู่มือ/กระบวนการคาดการณ์ผลการดำเนินงาน และระบุกรอบเวลาดำเนินการ"],"2":["สามารถคาดการณ์ผลการดำเนินงานตาม \"ตัวชี้วัดที่สำคัญได้ครบถ้วน\" ตามความถี่ที่กำหนด"],"3":["มีการคาดการณ์ผล และ \"ปรับเปลี่ยนกลยุทธ์/แผนงาน\" ในกรณีที่ผลคาดการณ์แตกต่างจากเป้าหมายหรือเมื่อเทียบกับ \"คู่เทียบ\""],"4":["กระบวนการคาดการณ์ผลสอดคล้องและนำไปสู่การปรับเปลี่ยนแผนปฏิบัติการในแผนแม่บทอื่น (เช่น แผนบริหารความเสี่ยง)"],"5":["ประเมินประสิทธิผลของกระบวนการคาดการณ์ และนำไปปรับปรุงกระบวนการ"]},"subComps":{"2":["กับดัก \"คาดการณ์ด้วยความรู้สึก\" (Missing Tools Trap - ซ่อนอยู่ใน Level 2): จาก Feedback Report ปี 68 ของ กทท. ผู้ตรวจหักคะแนนหนักมากและระบุชัดเจนว่า กทท. \"ยังไม่มีการแสดงเครื่องมือ/ที่มา ในการคาดการณ์ผลการดำเนินงานตามตัวชี้วัดที่สำคัญ\" ดังนั้น ในเอกสารรายงานผล ฝ่ายกลยุทธ์ต้องบังคับให้ทุกศูนย์ EVM ระบุคอลัมน์ \"วิธีการที่ใช้คาดการณ์\" (เช่น ใช้ Time Series, Regression, หรือ Data Analytics) ลงไปในตารางด้วยเสมอ","กับดัก \"ลืมคาดการณ์ด้านที่ไม่ใช่ตัวเงิน\" (The Non-Financial Blindspot): ผู้ตรวจระบุไว้ชัดเจนว่าต้องคาดการณ์ \"ทั้งตัวชี้วัดทางการเงิน และมิใช่การเงิน\" หลายองค์กรมักทำนายแค่รายได้หรือกำไร แต่ลืมทำนายเรื่อง \"ความพึงพอใจลูกค้า\" หรือ \"การลดระยะเวลา\" ซึ่งจะทำให้ไม่ผ่าน Level 2"],"3":["กับดัก \"ละเลยคู่เทียบตอนแก้เกม\" (The Benchmark Comparison Trap): จากคำเตือนที่ รฟม. และ กทพ. ได้รับ เกณฑ์ Level 3 บังคับว่าเวลากางผลคาดการณ์ ไม่ใช่แค่ดูว่าถึงเป้าองค์กรไหม แต่ต้องประเมินด้วยว่า \"ตัวเลขคาดการณ์ของเรา แตกต่าง/สู้คู่เทียบได้หรือไม่\" หากไม่นำค่าคู่เทียบมาวางเทียบในรายงาน จะถูกมองว่าวิเคราะห์ไม่ครบถ้วน"],"4":["ยกระดับด้วย Data Analytics (อิงจาก FD และข้อเสนอแนะคู่เทียบ): ทั้ง กทพ. รฟม. และ กทท. ได้รับคำแนะนำตรงกันว่า องค์กรควรยกระดับระบบ IT ไปสู่การใช้ Data Analytics (Predictive Analytics) เพื่อให้การคาดการณ์มีความรวดเร็ว แม่นยำ และแสดงผลแบบ Real-time ผ่านระบบ Dashboard"]},"scopeNote":"เน้นไปที่ \"ความแม่นยำและเครื่องมือที่ใช้พยากรณ์ (Forecasting Tools & Accuracy)\" รัฐวิสาหกิจต้องแสดงให้เห็นว่า การคาดการณ์ผลการดำเนินงานนั้นไม่ได้มาจากการ \"นั่งเดา หรือ นั่งเทียน\" แต่มีชุดข้อมูล (Data set) มีตัวชี้วัดนำ (Leading Indicator) และใช้เครื่องมือทางสถิติ/Data Analytics มาช่วยทำนาย และที่สำคัญคือ หากระบบทำนายว่า \"สิ้นปีนี้ตกเป้าแน่นอน\" องค์กรได้สั่งการให้ปรับเปลี่ยนแผนงาน (Actionable Insight) เพื่อกู้สถานการณ์ทันทีหรือไม่","actions":["จัดทำคู่มือ \"เครื่องมือและระเบียบวิธีคาดการณ์ (Forecasting Methodology)\": ฝ่ายกลยุทธ์ต้องกำหนดเครื่องมือมาตรฐานสำหรับคาดการณ์ KPI ทุกตัว เช่น ตัวชี้วัดรายได้ใช้สมการเชิงเส้น (Regression), ตัวชี้วัดความพึงพอใจใช้สถิติย้อนหลัง (Time-series) และบังคับให้ทุกตัวชี้วัดต้องระบุที่มาของการคาดการณ์ (ปิด Gap ระดับ 2)","เพิ่มคอลัมน์ \"คู่เทียบ (Benchmark)\" ในรายงานรายไตรมาส: ในแบบฟอร์มรายงานผล นอกจากจะแสดง ค่าปัจจุบัน และ ค่าคาดการณ์สิ้นปี แล้ว ต้องเพิ่มช่อง \"เป้าหมายคู่เทียบ\" เพื่อให้เห็นว่าผลคาดการณ์ของเราจะสู้คู่เทียบได้หรือไม่ และสรุปเป็นแนวทางปรับกลยุทธ์ (ปิด Gap ระดับ 3)","กำหนด KPI ประเมินกระบวนการคาดการณ์ (ระดับ 5): เช่น ตั้งตัวชี้วัด \"ร้อยละความแม่นยำของการคาดการณ์ (Error Rate)\" เทียบกับผลที่เกิดขึ้นจริงตอนสิ้นปี และนำมาทบทวนปรับปรุงวิธีคิดในปีถัดไป"],"dimLevels":["มีคู่มือ/กระบวนการ (SIPOC) สำหรับการคาดการณ์ผลการดำเนินงาน / ระบุความถี่และกรอบเวลาในการดำเนินการอย่างชัดเจน (เช่น รายเดือน หรือ รายไตรมาส)","มิติความครบถ้วน: มีหลักฐานการคาดการณ์ผลดำเนินงาน \"ครบทุกตัวชี้วัดที่สำคัญ\" ครอบคลุมทั้ง ตัวชี้วัดทางการเงินและมิใช่การเงิน / มิติเครื่องมือ (จุดตาย): ต้องระบุ \"ชุดข้อมูลที่ใช้, ตัวชี้วัดนำ (Leading Indicator), และเครื่องมือ/วิธีการที่ใช้ในการคาดการณ์\" (เช่น ใช้สถิติ 2 วิธีเปรียบเทียบกัน) กำกับไว้ในรายงานอย่างชัดเจน","มิติการเปรียบเทียบ: นำผลการคาดการณ์มากางเทียบกับเป้าหมายองค์กร และบังคับเทียบกับ \"ผลการดำเนินงานของคู่เทียบ (Benchmark)\" / มิติการปรับเปลี่ยน: หากผลคาดการณ์พบว่าจะตกเป้า หรือแพ้คู่เทียบ ต้องมีหลักฐานการ \"ทบทวน/ปรับเปลี่ยนแผนงานหรือกลยุทธ์ในช่วงเวลาที่เหลือของปี\" ทันที","มิติบูรณาการแผนแม่บท: หลักฐานแสดงให้เห็นว่า เมื่อมีการปรับเปลี่ยนแผนจากผลการคาดการณ์ ข้อมูลดังกล่าวได้ถูกส่งไปปรับเปลี่ยนในแผนแม่บทอื่นด้วย (เช่น ส่งไปให้แผนบริหารความเสี่ยง (RM) ปรับปรุงมาตรการควบคุม)","มีแนวทางการประเมินประสิทธิผลของกระบวนการคาดการณ์ (เช่น ความแม่นยำของการพยากรณ์เทียบกับผลจริง) / มีหลักฐานการนำผลประเมินไปใช้ปรับปรุงแบบจำลอง/กระบวนการคาดการณ์ในปีถัดไป"]},{"id":"7.3","grp":"7","gname":"กระบวนการติดตามผลสำเร็จตามแผนปฏิบัติการ และปรับเปลี่ยนแผนงาน","gw":15,"gs68":2.1,"name":"กระบวนการปรับเปลี่ยนแผนงาน (ตามปกติ และสถานการณ์เปลี่ยนแปลงอย่างรวดเร็ว)","w":5,"s68":1.65,"status":"ยังไม่เริ่ม","statusNote":"","scope":"เน้นไปที่ \"ระบบเตือนภัยและการแก้เกม (Early Warning & Plan Revision)\" องค์กรต้องแยกให้ออกระหว่าง \"การปรับแผนตามรอบปกติ (เช่น ปรับงบกลางปี)\" กับ \"การปรับแผนฉุกเฉิน (เช่น เกิดโควิด, นโยบายรัฐบาลเปลี่ยนกะทันหัน)\" ที่สำคัญที่สุดคือ เมื่อปรับแผนแล้ว ต้องลงมือทำแผนใหม่นั้นให้สำเร็จครบทุกมิติ (ไม่ใช่ปรับแผนเพื่อลดเป้าหมายหนีความผิด)","levelSumm":["มีคู่มือ/กระบวนการปรับเปลี่ยนแผนงาน \"กรณีสถานการณ์ปกติ\"","มิติบังคับ: มีการกำหนด \"Trigger Point\" (จุดที่ต้องสับสวิตช์เปลี่ยนแผน) สำหรับ \"ทุกแผนงาน\"","มีหลักฐาน/รายงานการดำเนินงานตามแผนที่ถูกปรับเปลี่ยน","เมื่อมีการปรับแผนงาน ฝ่ายกลยุทธ์ต้องมีหลักฐานการส่งต่อข้อมูลการปรับแผนนี้ ไปให้แผนแม่บทอื่นรับทราบและปรับตัวตาม (โดยเฉพาะแผนความเสี่ยง RM และแผนงบประมาณ)","มีการประเมินประสิทธิผลของกระบวนการปรับเปลี่ยนแผน (เช่น ปรับแผนแล้วอนุมัติได้ไวขึ้นหรือไม่)"],"good":["มีกระบวนการ 2 สถานการณ์ชัดเจน: มีการกำหนดกระบวนการปรับเปลี่ยนแผนงานไว้ชัดเจน ทั้งในกรณี \"สถานการณ์ปกติ\" (SIPOC 8) และ \"กรณีสถานการณ์เปลี่ยนแปลงอย่างรวดเร็ว\" (SIPOC 9)","มีการสื่อสารและตั้งกฎเกณฑ์รัดกุม: มีการชี้แจงกระบวนการปรับเปลี่ยนแผนให้ทุกฝ่ายรับทราบผ่านหนังสือเวียน โดยกำหนดเงื่อนไขว่าหากจะปรับแผน ต้องระบุสาเหตุ และต้องผ่านความเห็นชอบจากคณะกรรมการฝ่ายบริหาร กทท. และคณะกรรมการ (บอร์ด) กทท. เสียก่อน","มีกลไก Fast-track สำหรับแผนที่มีปัญหา: ฝ่ายกลยุทธ์มีกลไกติดตามประเมินผลโครงการ หากพบว่าโครงการใดได้ระดับคะแนน 1 และ 2 ภายในไตรมาสที่ 2 จะสั่งให้หน่วยงานทบทวนและสามารถปรับเปลี่ยนแผนงานได้ทันทีโดยไม่ต้องรอให้ถึงรอบไตรมาสปกติ"],"gaps":["ขาดการกำหนด \"การกระตุ้นเตือน\" (Gap ระดับ 2): ยังขาดการกำหนด \"Trigger Point\" ในทุกๆ แผนงาน ว่าสถานการณ์หรือตัวเลขตกลงไประดับไหนถึงจะเรียกว่าวิกฤตจนต้องงัดเอา SIPOC 9 มาใช้ โดยจุด Trigger นี้ยังไม่ได้ถูกนำไปผูกโยงกับตัวชี้วัดกระบวนการ (Leading Indicator) อย่างเป็นรูปธรรม","ขาดหลักฐานผลลัพธ์หลังการปรับแผน (Gap ระดับ 3): ยังไม่มีการแสดงหลักฐานเชิงประจักษ์ว่า \"เมื่อ กทท. อนุมัติให้ปรับแผนไปแล้ว โครงการนั้นสามารถส่งมอบผลงานได้ครบถ้วนทั้งมิติของ กิจกรรม ผลผลิต ผลลัพธ์ และผลกระทบ\" (ผู้ประเมินอาจมองว่าการปรับแผนคือการขอลดเป้าหมาย มากกว่าการเปลี่ยนวิธีการเพื่อคงผลลัพธ์เดิม)","การประเมินกระบวนการ (Gap ระดับ 5): ขาดแนวทาง ตัวชี้วัด และผลการประเมินประสิทธิผลของกระบวนการปรับเปลี่ยนแผน (SIPOC 9) เพื่อนำมาปรับปรุงความคล่องตัวของระบบการอนุมัติ"],"results":["ระดับ 1 (ผ่านเกณฑ์): มีการระบุขั้นตอนใน SIPOC 8 และ 9 กรอบเวลาชัดเจน และมีหนังสือเวียนแจ้งพนักงาน","ระดับ 2 (ไม่ผ่านเกณฑ์ / ได้คะแนนไม่เต็ม): แม้ กทท. จะมีการนำเสนอขอปรับเปลี่ยนแผนงานเมื่อผลงานตกเกณฑ์ แต่ผู้ประเมินมองว่า กทท. ยังขาดการกำหนด Trigger Point ที่ผูกกับ Leading Indicator ล่วงหน้าใน \"ทุกแผนงาน\"","ระดับ 3 (ไม่ผ่านเกณฑ์): กทท. ส่งรายงานผลการดำเนินงานไตรมาส 4 (หลังปรับแผน) แต่ยังไม่สามารถสะท้อนให้ผู้ประเมินเห็นภาพผลลัพธ์ที่บรรลุครบถ้วนทุกมิติอย่างชัดเจน","ระดับ 4 (ไม่ผ่านเกณฑ์): หลักฐานการเชื่อมโยงการปรับแผนกับแผนแม่บทอื่น (เช่น แผนความเสี่ยง) ส่งไปแล้ว แต่เนื่องจากระดับ 2-3 ยังไม่สมบูรณ์ คะแนนในระดับ 4 จึงตกไป","ระดับ 5 (ไม่ผ่านเกณฑ์): ไม่มีการส่งหลักฐานการประเมินประสิทธิผลและปรับปรุงกระบวนการ"],"tris":["\"ควรมีการกำหนด Trigger Point สำหรับการปรับเปลี่ยนแผนงานในกรณีสถานการณ์เปลี่ยนแปลงอย่างรวดเร็วได้ทุกแผนงาน โดยควรมีความสัมพันธ์กับ Leading Indicator ของแต่ละแผนงาน และแสดงผลลัพธ์ที่เป็นรูปธรรมจากการปรับเปลี่ยนแผนงานที่เป็นไปตามเป้าหมายครบถ้วนทั้งในรูปแบบกิจกรรม ผลผลิต ผลลัพธ์ ผลกระทบ ตามที่ได้กำหนดไว้ในเป้าหมายของแผนปฏิบัติการ\" (คำอธิบาย: TRIS ต้องการเห็น 2 จุดหลัก คือ 1. เกณฑ์สัญญาณเตือนภัยล่วงหน้า (Trigger point) ว่า Leading KPI ตกถึงจุดไหนจึงต้องเริ่มปรับแผน และ 2. รายงานตอนจบที่พิสูจน์ว่า การปรับแผนนั้นไม่ใช่การ 'หนีเป้า/ลดเป้า' แต่ปรับวิธีการเพื่อให้ 'ได้ผลลัพธ์เท่าเดิมหรือดีกว่าเดิม' ครบ 100%)"],"suggest":["เพิ่มช่อง \"Trigger Point\" ในฟอร์มเสนอโครงการ: ให้ฝ่ายกลยุทธ์บังคับทุกศูนย์ EVM ระบุล่วงหน้าตอนเสนอโครงการเลยว่า Leading Indicator ค่าไหนคือจุดวิกฤตที่ต้องขอปรับแผนฉุกเฉิน (เช่น ถ้ายอดเบิกจ่ายล่าช้ากว่าแผน 20% หรือ ยอดผู้ใช้งานตกเกิน 2 เดือน ให้ถือเป็น Trigger Point)","จัดทำรายงาน \"Post-Adjustment Success Report\" (ระดับ 3): สำหรับโครงการที่บอร์ดอนุมัติให้ปรับแผน เมื่อจบปีงบประมาณ ต้องทำรายงานสรุปแยกต่างหาก 1 หน้ากระดาษ เพื่อยืนยันว่าแผนที่ปรับปรุงใหม่นี้ สามารถส่งมอบ กิจกรรม (Activity) ผลผลิต (Output) ผลลัพธ์ (Outcome) และผลกระทบ (Impact) ได้สำเร็จครบถ้วนตามเป้าเดิม","กำหนด KPI ประเมินกระบวนการ SIPOC 9 (ระดับ 5): ตั้งตัวชี้วัดประเมินความยืดหยุ่นรวดเร็ว (Agility) ของกระบวนการขออนุมัติปรับแผน เช่น \"ระยะเวลาตั้งแต่เกิด Trigger Point จนถึงบอร์ดอนุมัติปรับแผน ต้องไม่เกิน X วัน\" และนำผลมาทบทวนลดขั้นตอนคอขวดในปีถัดไป"],"docs":["แบบฟอร์มแผนปฏิบัติการ (ปรับปรุงใหม่): ที่มีช่องระบุ Trigger Point ผูกคู่กับตัวชี้วัด Leading Indicator ครบทุกโครงการ (เพื่อยืนยันระดับ 2)","รายงานสรุปผลสัมฤทธิ์ของโครงการที่ได้รับการปรับเปลี่ยนแผน (Post-Adjustment Performance Report): ที่แจกแจงผลสำเร็จครบ 4 มิติ (กิจกรรม, ผลผลิต, ผลลัพธ์, ผลกระทบ) (เพื่อยืนยันระดับ 3)","รายงานประเมินความคล่องตัวและประสิทธิผลของกระบวนการปรับเปลี่ยนแผนงาน: พร้อมหลักฐานการแก้ไขคู่มือเพื่อลดขั้นตอน (เพื่อยืนยันระดับ 5)"],"bestprac":["กทพ. สามารถทำคะแนนผ่านระดับ 2 ได้สำเร็จ เพราะมีการกำหนด Trigger Point ผูกกับ Leading Indicator และนำไปสร้างเป็น \"ระบบเตือนภัยล่วงหน้า (EWS)\" ส่วน รฟม. ก็มีกระบวนการและ Trigger Point เช่นกัน แต่ทว่า ทั้ง กทพ. และ รฟม. ไปตกม้าตายในระดับ 3 เหมือนกันหมด คือ TRIS ให้คำแนะนำว่า \"ต้องแสดงให้เห็นถึงการปรับเปลี่ยนแผนงานที่บรรลุเป้าหมายครบถ้วนทั้ง กิจกรรม ผลผลิต ผลลัพธ์ ผลกระทบ\""],"minReqs":{"1":["มีการกำหนดกระบวนการ/กรอบเวลาการปรับเปลี่ยนแผนงานทั้ง 2 กรณี (กรณีปกติ และ กรณีสถานการณ์เปลี่ยนแปลงอย่างรวดเร็ว) พร้อมชี้แจงให้ผู้เกี่ยวข้องรับทราบ"],"2":["กำหนดจุดกระตุ้นเตือน \"Trigger Point\" สำหรับสถานการณ์เปลี่ยนแปลงรวดเร็วใน \"ทุกแผนงาน\" โดยต้องผูกกับ Leading Indicator ของแผนงานนั้นๆ"],"3":["ผลการดำเนินงานหลังจากปรับแผน สามารถบรรลุเป้าหมายครบถ้วนทั้งในรูปแบบ กิจกรรม, ผลผลิต (Output), ผลลัพธ์ (Outcome) และผลกระทบ (Impact)"],"4":["กระบวนการปรับเปลี่ยนแผนงาน ต้องแสดงความสอดคล้อง/แจ้งให้แผนแม่บทอื่นที่เกี่ยวข้องรับทราบ (เช่น นำไปปรับแผนความเสี่ยง หรือ แผน IT)"],"5":["ประเมินประสิทธิผลของกระบวนการปรับเปลี่ยนแผนงาน และนำข้อมูลไปใช้ปรับปรุงกระบวนการ"]},"subComps":{"1":["ช่องทางด่วน (Fast-track) สำหรับกรณีฉุกเฉิน กระบวนการปรับแผนแบบเปลี่ยนแปลงรวดเร็ว จะต้องใช้ระยะเวลาในการขออนุมัติ (SLA) \"สั้นกว่า\" และ \"เร็วกว่า\" การปรับแผนปกติ (เช่น มอบอำนาจให้ผู้บริหารระดับสูงอนุมัติได้ทันทีโดยไม่ต้องรอบอร์ด เพื่อให้แก้ปัญหาหน้างานได้ทัน)"],"2":["กับดัก \"Trigger Point ลอยๆ\" (The Disconnected Trigger Trap): หลายองค์กรกำหนด Trigger Point ไว้ แต่ไม่ได้ผูกกับ Leading Indicator (เช่น ไปกำหนดว่า Trigger Point คือ \"งบหมด\") ผู้ตรวจประเมินต้องการให้ Trigger Point เป็นส่วนหนึ่งของ ระบบเตือนภัยล่วงหน้า (Early Warning System) ที่ส่งสัญญาณเตือนตั้งแต่งานเริ่มมีแนวโน้มจะตกเป้า0"],"3":["กับดัก \"ปรับแผนแบบคลุมเครือ ไม่ครบ 4 มิติ\" (The Unclear Outcome Trap): จาก Feedback Report ปี 68 ของ กทพ. ผู้ตรวจคอมเมนต์ชัดเจนว่า \"ยังไม่มีความชัดเจนว่ามีการกำหนดกระบวนการปรับเปลี่ยนแผนงาน... ตามเป้าหมายครบถ้วนทั้งในรูปแบบกิจกรรม ผลผลิต ผลลัพธ์ ผลกระทบ\"แปลว่าเมื่อคุณขออนุมัติบอร์ดปรับแผนเสร็จแล้ว สิ้นปีคุณต้องทำตารางรายงานผลด้วยว่า แผนใหม่ที่ทำไปนั้น สำเร็จครบทั้ง 4 ช่อง (กิจกรรมทำอะไร, Output ได้อะไร, Outcome ได้ตามเป้าใหม่ไหม, และเกิด Impact อะไร) หากรายงานแค่ว่า \"ทำเสร็จแล้ว\" จะไม่ผ่าน Level 3"]},"scopeNote":"เน้นไปที่ \"ระบบเตือนภัยและการแก้เกม (Early Warning & Plan Revision)\" องค์กรต้องแยกให้ออกระหว่าง \"การปรับแผนตามรอบปกติ (เช่น ปรับงบกลางปี)\" กับ \"การปรับแผนฉุกเฉิน (เช่น เกิดโควิด, นโยบายรัฐบาลเปลี่ยนกะทันหัน)\" ที่สำคัญที่สุดคือ เมื่อปรับแผนแล้ว ต้องลงมือทำแผนใหม่นั้นให้สำเร็จครบทุกมิติ (ไม่ใช่ปรับแผนเพื่อลดเป้าหมายหนีความผิด)","actions":["เพิ่มช่อง \"Trigger Point\" ในฟอร์มเสนอโครงการ: ให้ฝ่ายกลยุทธ์บังคับทุกศูนย์ EVM ระบุล่วงหน้าตอนเสนอโครงการเลยว่า Leading Indicator ค่าไหนคือจุดวิกฤตที่ต้องขอปรับแผนฉุกเฉิน (เช่น ถ้ายอดเบิกจ่ายล่าช้ากว่าแผน 20% หรือ ยอดผู้ใช้งานตกเกิน 2 เดือน ให้ถือเป็น Trigger Point)","จัดทำรายงาน \"Post-Adjustment Success Report\" (ระดับ 3): สำหรับโครงการที่บอร์ดอนุมัติให้ปรับแผน เมื่อจบปีงบประมาณ ต้องทำรายงานสรุปแยกต่างหาก 1 หน้ากระดาษ เพื่อยืนยันว่าแผนที่ปรับปรุงใหม่นี้ สามารถส่งมอบ กิจกรรม (Activity) ผลผลิต (Output) ผลลัพธ์ (Outcome) และผลกระทบ (Impact) ได้สำเร็จครบถ้วนตามเป้าเดิม","กำหนด KPI ประเมินกระบวนการ SIPOC 9 (ระดับ 5): ตั้งตัวชี้วัดประเมินความยืดหยุ่นรวดเร็ว (Agility) ของกระบวนการขออนุมัติปรับแผน เช่น \"ระยะเวลาตั้งแต่เกิด Trigger Point จนถึงบอร์ดอนุมัติปรับแผน ต้องไม่เกิน X วัน\" และนำผลมาทบทวนลดขั้นตอนคอขวดในปีถัดไป"],"dimLevels":["มีคู่มือ/กระบวนการปรับเปลี่ยนแผนงาน \"กรณีสถานการณ์ปกติ\" / มีคู่มือ/กระบวนการปรับเปลี่ยนแผนงาน \"กรณีสถานการณ์เปลี่ยนแปลงรวดเร็ว (Fast-track)\" / มีหลักฐานการชี้แจง/ซักซ้อมกระบวนการปรับแผนให้ทุกฝ่ายรับทราบ","มิติบังคับ: มีการกำหนด \"Trigger Point\" (จุดที่ต้องสับสวิตช์เปลี่ยนแผน) สำหรับ \"ทุกแผนงาน\" / มิติความเชื่อมโยง: Trigger Point นั้น ต้องผูกกับค่า \"Leading Indicator\" (เช่น ถ้ายอดจัดซื้อล่าช้ากว่าแผน 20% ให้ถือเป็น Trigger Point ในการปรับแผนทันที)","มีหลักฐาน/รายงานการดำเนิ // ── LOAD ─────────────────────────────────────────────────────────────
async function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
    if(d.mr)Object.assign(spMrChk,d.mr);
    if(d.sc)Object.assign(spScChk,d.sc);
    if(d.dm)Object.assign(spDimMlt,d.dm);
    if(d.cl)Object.assign(clChecked,d.cl);
    if(d.dc)Object.assign(docCk,d.dc);
    if(d.fe)Object.assign(feInput,d.fe);
  }catch(e){}
  const remote=await ebFetchDim(DIM_KEY,4000);
  if(remote&&remote.data&&Object.keys(remote.data).length){
    try{
      const d=remote.data;
      if(d.mr)Object.assign(spMrChk,d.mr);
      if(d.sc)Object.assign(spScChk,d.sc);
      if(d.dm)Object.assign(spDimMlt,d.dm);
      if(d.cl)Object.assign(clChecked,d.cl);
      if(d.dc)Object.assign(docCk,d.dc);
      if(d.fe)Object.assign(feInput,d.fe);
      localStorage.setItem(LS_KEY,JSON.stringify(d));
    }catch(e){}
  }
  DATA.sp.subs.forEach(s=>{targets.sp[s.id]=spCalcRaw(s.id)||s.s68;});
}

function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({mr:spMrChk,sc:spScChk,dm:spDimMlt,cl:clChecked,dc:docCk,fe:feInput}));}catch(e){}

    800);
}
function exportProgress(){
  const payload=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  payload._exported=new Date().toISOString();payload._dim='SP';
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='SP_progress_'+new Date().toLocaleDateString('th-TH').replace(/\//g,'')+'.json';
  a.click();
}
function importProgress(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const exp=d._exported?new Date(d._exported).toLocaleString('th-TH'):'ไม่ระบุ';
      if(!confirm('นำเข้าข้อมูล SP (ส่งออกเมื่อ '+exp+')\nจะทับข้อมูลปัจจุบัน — ยืนยัน?'))return;
      delete d._exported;delete d._dim;
      localStorage.setItem(LS_KEY,JSON.stringify(d));
      loadState();renderAll();
    }catch(err){alert('ไฟล์ไม่ถูกต้อง');}
  };
  reader.readAsText(file);input.value='';
}
function syncHomeStatus(){
  try{
    const home=JSON.parse(localStorage.getItem('seam_status_69')||'{}');
    if(!home[DIM_KEY])home[DIM_KEY]={};
    DATA.sp.subs.forEach(s=>{
      const score=spCalcRaw(s.id);
      const gc=(s.gaps||[]).length;
      home[DIM_KEY][s.id]={level:score,hasOpenGap:gc>0,gapCount:gc};
    });
    localStorage.setItem('seam_status_69',JSON.stringify(home));
  }catch(e){}
}

// ── SCORING ──────────────────────────────────────────────────────────
function spCalcLevel(sid,L){
  const s=DATA.sp.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(spMrChk[sid]&&spMrChk[sid][L]&&spMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((spScChk[sid]&&spScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(spDimMlt[sid]&&spDimMlt[sid][L])||0;
}
function spCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=spCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

function docGetChk(sid,L,i){return !!(docCk[sid]&&docCk[sid][L]&&docCk[sid][L][i]);}
function feGet(sid,field,key){return(feInput[sid]&&feInput[sid][field]&&feInput[sid][field][key])||'';}

function feGapClosed(sid,i){const fi=feInput[sid];if(!fi||!fi.gapClosed)return null;return fi.gapClosed.hasOwnProperty(i)?fi.gapClosed[i]:null;}
function feCopyOut(outId,btn){
  const el=document.getElementById(outId);if(!el)return;
  const orig=btn.textContent;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(el.value).then(()=>{btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent=orig,1500);}).catch(()=>{el.select();document.execCommand('copy');});}
  else{el.select();document.execCommand('copy');btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent=orig,1500);}
}
function docToggle(sid,L,i,v){

  updateDocProgress(sid);
}

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.sp.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>spCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${spCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=spCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((spScChk[sid]&&spScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(spMrChk[sid]&&spMrChk[sid][L]&&spMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((spScChk[sid]&&spScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(spDimMlt[sid]&&spDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.sp[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.sp[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(spMrChk[sid]&&spMrChk[sid][L]&&spMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;

    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#7c3aed':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#7c3aed':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';

    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#7c3aed;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#7c3aed':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
