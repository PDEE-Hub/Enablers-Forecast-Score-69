// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.cm.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>cmCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${cmCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=cmCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((cmScChk[sid]&&cmScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(cmMrChk[sid]&&cmMrChk[sid][L]&&cmMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((cmScChk[sid]&&cmScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(cmDimMlt[sid]&&cmDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.cm[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.cm[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(cmMrChk[sid]&&cmMrChk[sid][L]&&cmMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#0891b2':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#0891b2':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#0891b2;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#0891b2':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=cmMrChk[sid]&&cmMrChk[sid][L]&&cmMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';
        mrH+=`<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck} ${dis} onchange="cmToggleMR('${sid}',${L},${ri},this.checked);" style="accent-color:#0891b2;"><label for="${kid}">${txt}</label></div>`;
      });
    }
    let dimH='';
    if(scs.length>0){
      const scChecked=((cmScChk[sid]&&cmScChk[sid][L])||[]).filter(Boolean).length;
      const scPct=Math.round(scChecked/scs.length*100);
      dimH=`<div class="cg-sect-lbl" style="margin-top:8px;">📊 ประเด็นที่เปิดเผย (L${L}) — <span style="color:#0891b2;">${scChecked}/${scs.length} = ${rv.toFixed(4)}</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${scPct}%;background:${scChecked===scs.length?'#0891b2':'#2a8a50'};"></div></div>`;
      scs.forEach((txt,si)=>{
        const kid=`cgsc-${sid}-${L}-${si}`;const ck=cmScChk[sid]&&cmScChk[sid][L]&&cmScChk[sid][L][si]?'checked':'';const dis=ls.bl||!ls.passedMR?'disabled':'';
        dimH+=`<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck} ${dis} onchange="cmToggleSC('${sid}',${L},${si},this.checked);" style="accent-color:#0891b2;"><label for="${kid}">${txt}</label></div>`;
      });
    }else{
      const dis=ls.bl?'disabled':'';
      dimH=`<div class="cg-sect-lbl" style="margin-top:8px;">📐 มิติที่ประเมิน (L${L})</div><div class="cg-radio-grp">`;
      [[0,'0 — ไม่ครบตามเกณฑ์'],[0.5,'0.5 — ทำได้บางส่วน'],[1,'1.0 — ครบตามมิติที่ประเมิน']].forEach(([v,lbl])=>{
        const ck=(rv===v)?'checked':'';const col=v===1?'#0891b2':v===0.5?'#c07000':'#c03020';
        dimH+=`<label style="padding:3px 6px;border-radius:5px;background:${ck?(v===1?'#e0f5e8':v===0.5?'#fef8e0':'#fee8e8'):'transparent'};border:1px solid ${ck?col:'transparent'};color:${ck?col:'#444'};font-weight:${ck?'700':'400'};cursor:${ls.bl?'not-allowed':'pointer'};"><input type="radio" name="cgdim-${sid}-${L}" value="${v}" ${ck} ${dis} onchange="cmSetDim('${sid}',${L},${v});" style="accent-color:${col};flex-shrink:0;"> ${lbl}</label>`;
      });
      dimH+='</div>';
    }
    const dimStrip=ints.length?`<div class="lvl-dim-strip">${ints.map(dimBadge).join(' ')}</div>`:'';
    lvlHTML+=`<div class="cg-lvl-row${ls.bl?' blocked':L===gapL?' is-gap':''}">
      <div class="cg-lvl-hd" style="background:${hdBg};">
        <span class="cg-lvl-num" style="background:${nBg};">L${L}</span>
        <span class="cg-lvl-summ"><span class="kt">${summ}</span>${(!ls.bl&&L===gapL)?'&nbsp;<span class="dim-gap-tag">⚠️ ช่องว่าง</span>':''}</span>
        <span style="display:flex;gap:3px;align-items:center;flex-shrink:0;">${xBtn}<span style="font-size:10px;font-weight:700;color:${sCol};min-width:28px;text-align:right;">${ls.bl?'—':rv.toFixed(2)}</span></span>
      </div>
      ${dimStrip}${xPan}
      <div class="cg-lvl-body">
        ${mrH}<div${!ls.passedMR&&mrs.length?' style="pointer-events:none;opacity:.5;"':''}>${dimH}</div>
      </div>
    </div>`;
  });

  return `<div class="cg-sim">
    <div class="cg-sim-hd">
      <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy);color:#fff;">CM</span>
      &nbsp;Sequential Gating Simulator — minReqs + SubComps
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <button onclick="if(confirm('ล้างข้อมูลทั้งหมด?'))cmClearAll()" style="font-size:11px;padding:3px 10px;border:1px solid #e0a0a0;border-radius:5px;background:#fee8e8;cursor:pointer;color:#b03020;font-weight:600;">🗑 ล้างข้อมูล</button>
        <span style="font-size:11px;font-weight:700;color:#0a4a2a;">${raw.toFixed(4)}/5.0</span>
      </span>
    </div>
    <div class="cg-scope-box">${s.scopeNote||''}</div>
    ${crossSumm}
    ${lvlHTML}
    <div class="cg-total-bar">
      <span class="cg-total-lbl">คะแนนดิบสะสม (0–5)</span>
      <span class="cg-raw">${raw.toFixed(4)}</span>
      <span class="cg-wt">× ${s.w}% = <strong>${wt.toFixed(4)} pts</strong></span>
    </div>
  </div>`;
}

// ── renderFrameB ────────────────────────────────────────────────────
function renderFrameB(s){
  const mr=s.minReqs||{};const sid=s.id;
  let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{const items=mr[L]||[];total+=items.length;items.forEach((_,i)=>{if(docGetChk(sid,L,i))done++;});  });
  const progPct=total>0?Math.round(done/total*100):0;
  const progColor=done===total&&total>0?'#0891b2':done>0?'#92400e':'#666';
  let html=`<div class="fb-prog-bar"><span style="font-size:11px;font-weight:600;color:${progColor};" id="fb-total-${sid}">${done}/${total} เอกสารพร้อมแล้ว</span><div class="fb-prog-track"><div id="fb-prog-fill-${sid}" style="height:100%;width:${progPct}%;background:${progColor};transition:width .3s;"></div></div></div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lvlDone=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const bdId=`fb-bd-${sid}-${L}`;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const shortTitle=lvlTitle.length>48?lvlTitle.slice(0,48)+'…':lvlTitle;
    const lvlColor=lvlDone===items.length?'#0891b2':lvlDone>0?'#92400e':'#0369a1';
    const lvlBg=lvlDone===items.length?'#e4f5e4':lvlDone>0?'#fef8e0':'rgba(2,132,199,.06)';
    const itemsHtml=items.map((item,i)=>{
      const isGap=item.startsWith('[แก้ไข Gap');const cleanItem=item.replace('[แก้ไข Gap สำคัญ]','').trim();
      const ckd=docGetChk(sid,L,i);const ckId=`dck-${sid}-${L}-${i}`;
      return `<label class="fb-item${isGap?' fb-item-gap':''}${ckd?' fb-item-done':''}"><input type="checkbox" id="${ckId}"${ckd?' checked':''} onchange="docToggle('${sid}',${L},${i},this.checked)">${isGap?'<span class="fb-gap-tag">⚠️ Gap</span>':''}<span class="fb-item-text">${cleanItem}</span></label>`;
    }).join('');
    html+=`<div class="doc-lvl-block"><div class="doc-lvl-hd" style="background:${lvlBg};" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="doc-lvl-badge">L${L}</span><span class="doc-lvl-title" style="color:${lvlColor};">${shortTitle}</span><span class="doc-lvl-count" id="fb-cnt-${sid}-${L}" style="color:${lvlColor};font-weight:600;">${lvlDone}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="doc-lvl-body" id="${bdId}">${itemsHtml}</div></div>`;
  });
  return html;
}

// ── renderFrameE ────────────────────────────────────────────────────
function renderFrameE(s){
  const sid=s.id;const mr=s.minReqs||{};const gaps=s.gaps||[];const outId=`fe-out-${sid}`;
  const simMax=[5,4,3,2,1].find(L=>cmCalcLevel(sid,L)>=1)||0;
  const rawScore=cmCalcRaw(sid);
  const pills=[1,2,3,4,5].map(L=>{
    const lv=cmCalcLevel(sid,L);
    const pass=lv>=1;const partial=lv>0&&lv<1;
    return `<span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;background:${pass?'#0891b2':partial?'#e3a82e':'#e0ddd8'};color:${pass||partial?'#fff':'#888'};">L${L}${partial?' ('+Math.round(lv*100)+'%)':''}</span>`;
  }).join('');
  let html=`<div class="fe-sim-row"><span style="font-size:11px;color:var(--text3);">คะแนนดิบ (Simulator):</span><div style="display:flex;gap:4px;flex-wrap:wrap;">${pills}</div><span style="font-size:11px;font-weight:700;color:#0891b2;margin-left:auto;">${rawScore.toFixed(4)}/5.0</span></div>`;
  html+=`<div class="fe-sect-lbl">สิ่งที่ดำเนินการ — กรอกต่อระดับที่ทำได้</div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const tickedCnt=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const lScore=cmCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const short=lvlTitle.length>46?lvlTitle.slice(0,46)+'…':lvlTitle;
    const note=feGet(sid,'lvlNotes',L);const bdId=`fe-bd-${sid}-${L}`;
    const badgeBg=isPass?'#0891b2':isPartial?'#e3a82e':'#94a3b8';
    html+=`<div class="fe-lvl-block${isPass?' fe-lvl-active':''}"><div class="fe-lvl-hd" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="fe-lvl-badge" style="background:${badgeBg};">L${L}</span><span class="fe-lvl-title">${short}</span><span class="fe-doc-ref">📄 ${tickedCnt}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="fe-lvl-body${isPass?' open':''}" id="${bdId}"><textarea class="fe-textarea" rows="3" placeholder="อธิบายสิ่งที่ กทท. ดำเนินการในระดับนี้..." onchange="feSet('${sid}','lvlNotes',${L},this.value)" onblur="feSet('${sid}','lvlNotes',${L},this.value)">${note}</textarea></div></div>`;
  });
  if(gaps.length){
    html+=`<div class="fe-sect-lbl" style="margin-top:12px;">ช่องว่างจาก TRIS — ปิดได้หรือยัง?</div>`;
    gaps.forEach((gap,i)=>{
      const cl=feGapClosed(sid,i);const gNote=feGet(sid,'gapNotes',i);
      html+=`<div class="fe-gap-item"><div class="fe-gap-text">⚠️ ${gap}</div><div class="fe-gap-status"><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="1"${cl===true?' checked':''} onchange="feSet('${sid}','gapClosed',${i},true)">✓ ปิดได้แล้ว</label><label class="fe-radio-lbl"><input type="radio" name="gc-${sid}-${i}" value="0"${cl===false?' checked':''} onchange="feSet('${sid}','gapClosed',${i},false)">○ อยู่ระหว่างดำเนินการ</label></div><textarea class="fe-textarea" rows="2" placeholder="อธิบายสิ่งที่ทำเพื่อปิด Gap นี้..." onchange="feSet('${sid}','gapNotes',${i},this.value)" onblur="feSet('${sid}','gapNotes',${i},this.value)">${gNote}</textarea></div>`;
    });
  }
  html+=`<div style="margin-top:14px;"><button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button><span style="font-size:11px;color:var(--text3);margin-left:8px;">รวม Simulator + เอกสาร Frame B + Notes ทั้งหมด</span></div><div style="margin-top:8px;"><textarea class="fe-output" id="${outId}" rows="14" placeholder="กด Gen Script เพื่อสร้างคำตอบ — แก้ไขได้ก่อน Copy"></textarea><button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button></div>`;
  return html;
}

// ── renderRight ──────────────────────────────────────────────────────
function renderRight(){
  const body=document.getElementById('rightBody');
  if(!focusId){body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:13px;">คลิก sub-item ด้านซ้ายเพื่อดูรายละเอียด</div>';return;}
  const s=DATA.cm.subs.find(x=>x.id===focusId);if(!s){body.innerHTML='';return;}
  const simHTML=renderSim(s);const tval=targets.cm[s.id];
  const gA=(s.gaps||[]).map(g=>`<div class="box box-red" style="margin-bottom:4px;">• ${exp(g,90)}</div>`).join('');
  const rC=(s.results||[]).map(r=>`<div class="match-row m-ok"><span>✓</span><span>${exp(r,80)}</span></div>`).join('');
  const lC=(s.gaps||[]).slice(0,3).map(g=>`<div class="match-row m-no"><span>✗</span><span style="font-size:10.5px;">${g.split(' —')[0].slice(0,70)}</span></div>`).join('');
  const dD=(s.actions||[]).map(a=>`<div style="display:flex;align-items:flex-start;gap:5px;font-size:11px;color:#333;padding:3px 0;"><span style="color:#0891b2;flex-shrink:0;">→</span><span>${exp(a,100)}</span></div>`).join('');
  body.innerHTML=`
    <div style="padding:5px 12px;font-size:11px;background:#e8f5ee;border-bottom:1px solid #c0dac8;display:flex;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:2;">
      <span style="font-weight:700;color:#0a4a2a;">ข้อ ${s.id}</span>
      <span style="color:#555;font-size:10.5px;">${s.name}</span>
      <span style="margin-left:auto;font-size:10px;background:#e0ddd4;color:#444;padding:1px 7px;border-radius:8px;">ปัจจุบัน ${fmt(s.s68)}</span>
      <span style="font-size:10px;">→</span>
      <span style="font-size:10px;background:#c5e8d5;color:#0a4a2a;padding:1px 7px;border-radius:8px;font-weight:700;">คำนวณ ${fmt(tval)}</span>
    </div>
    ${simHTML}
    <div class="frame"><div class="frame-hd fa-hd"><span class="ftag fa-tag">A</span><span style="color:#7a1010;">ช่องว่างที่ต้องปิด (TRIS)</span></div><div class="frame-bd">${gA||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame"><div class="frame-hd fb-hd"><span class="ftag fb-tag">B</span><span style="color:#102070;">เอกสารลงระบบ — แยกตามระดับ</span><a href="${DOC_DETAIL_URL}" target="_blank" style="margin-left:auto;font-size:9.5px;padding:2px 9px;border-radius:5px;background:#2a4a9a;color:#fff;text-decoration:none;font-weight:600;">📋 ดูทั้งหมด</a></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameB(s)}</div></div>
    <div class="frame"><div class="frame-hd fc-hd"><span class="ftag fc-tag">C</span><span style="color:#4a4a00;">กทท. ตอบอะไรไป / จุดแข็ง</span></div><div class="frame-bd"><div class="box box-gray" style="margin-bottom:6px;font-size:11px;">${exp((s.good||[''])[0]||'—',100)}</div><div style="font-size:9.5px;color:#888;margin:4px 0 2px;font-weight:600;">ผลที่นำเสนอ:</div>${rC}<div style="font-size:9.5px;color:#888;margin:6px 0 2px;font-weight:600;">ช่องว่างที่ยังขาด:</div>${lC}</div></div>
    <div class="frame"><div class="frame-hd fd-hd"><span class="ftag fd-tag">D</span><span style="color:#102848;">สิ่งที่ต้องดำเนินการปี 69</span></div><div class="frame-bd">${dD||'<div style="color:#999;">—</div>'}</div></div>
    <div class="frame" style="border-bottom:none;"><div class="frame-hd fe-hd"><span class="ftag fe-tag">E</span><span style="color:#0a4030;">Self-Assessment Script — ร่างคำตอบระบบ สคร.</span></div><div class="frame-bd" style="padding:6px 8px;">${renderFrameE(s)}</div></div>`;
}

// ── renderLeft ───────────────────────────────────────────────────────
function renderLeft(){
  const body=document.getElementById('leftBody');body.innerHTML='';
  document.getElementById('dimTitle').textContent=DATA.cm.dimName;
  document.getElementById('dimOrig').textContent='ปัจจุบัน '+fmt(DATA.cm.orig);
  document.getElementById('totalLbl').textContent='คะแนนรวม '+DATA.cm.dimId;
  document.getElementById('totalOrig').textContent=fmt(DATA.cm.orig);
  const grps=[...new Set(DATA.cm.subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=DATA.cm.subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.cm[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const assessed=ss.filter(s=>cmCalcRaw(s.id)>0).length;
    const tot=ss.length;const fillPct=Math.round(gs/5*100);
    const fillCol=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';
    const chkCls=assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none';
    const chkLbl=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;
    const gDiv=document.createElement('div');gDiv.className='grp';
    gDiv.innerHTML=`<div class="grp-row1"><span class="grp-id">${gid}</span><span class="grp-name">${first.gname}</span><span class="grp-wt">(${first.gw}%)</span><div class="grp-scores"><span class="chip cn" style="font-size:10px;">${fmt(first.gs68)}</span><span style="color:#999;font-size:10px;">→</span><span class="chip ${diff<-0.001?'cr':diff>0.001?'ct':'cn'}" style="font-size:10px;" id="gs-cg-${gid}">${fmt(gs)}</span></div></div><div class="grp-row2"><span class="grp-chk ${chkCls}" id="rollup-chk-${gid}">${chkLbl}</span><span class="grp-score2"><strong id="rollup-gs-${gid}" style="color:${diff>0.001?'#0891b2':diff<-0.001?'#c03020':'#555'};">${gs.toFixed(4)}</strong><span id="rollup-delta-${gid}" style="font-size:9px;color:${diff>0.001?'#0891b2':diff<-0.001?'#c03020':'#aaa'};">(${diff>=0?'+':''}${diff.toFixed(4)})</span></span><div class="grp-prog"><div class="grp-prog-fill" id="rollup-bar-${gid}" style="width:${fillPct}%;background:${fillCol};"></div></div></div>`;
    body.appendChild(gDiv);
    ss.forEach(s=>{
      const row=document.createElement('div');row.className='sub'+(focusId===s.id?' focus-cg':'');row.id='subrow-'+s.id;
      row.innerHTML=`<div class="sub-left"><div class="sub-meta"><span class="sub-num">${s.id}</span><span class="sub-name">${s.name}</span><span class="sub-wt">(${s.w}%)</span><span class="sub-now">ปี 68: ${fmt(s.s68)}</span></div></div><div class="sub-target" id="st-${s.id}"><span class="target-lbl">คำนวณ</span><input class="target-inp" id="ti-${s.id}" type="text" value="${fmt(targets.cm[s.id])}" readonly style="border-color:#ccc;"><span class="dot ${dotColor(s)}" id="dot-${s.id}"></span></div>`;
      row.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(row);
      const strip=document.createElement('div');strip.className='sstrip';
      strip.innerHTML=`<span class="sbadge ${sClass(s.status)}">${sIcon(s.status)} ${s.status}</span><span style="font-size:10px;color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px;">${s.statusNote||'ยังไม่มีข้อมูล'}</span>`;
      strip.addEventListener('click',()=>{focusId=s.id;renderAll();});body.appendChild(strip);
    });
  });
}

// ── renderChecklist ──────────────────────────────────────────────────
function renderChecklist(){
  if(!focusId){document.getElementById('clTitle').textContent='เลือก sub-item เพื่อดู Action Checklist';document.getElementById('clItems').innerHTML='';return;}
  const s=DATA.cm.subs.find(x=>x.id===focusId);if(!s)return;
  document.getElementById('clTitle').textContent=`Action Checklist — ข้อ ${s.id} · ปัจจุบัน ${fmt(targets.cm[s.id])}`;
  if(!clChecked[s.id])clChecked[s.id]=(s.actions||[]).map(()=>false);
  document.getElementById('clItems').innerHTML=(s.actions||[]).map((a,i)=>{
    const chk=clChecked[s.id][i];
    const sty=chk?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
    return `<div class="cl-item" id="clrow-${s.id}-${i}" style="${sty}"><input type="checkbox" id="cl-${s.id}-${i}" ${chk?'checked':''} onchange="toggleCL('${s.id}',${i},this.checked)"><label for="cl-${s.id}-${i}" style="flex:1;"><span id="cls-${s.id}-${i}" class="cl-short" style="-webkit-line-clamp:2;">${a}</span><span id="clb-${s.id}-${i}" class="cl-exp-btn" onclick="event.preventDefault();clExpand('${s.id}',${i})">อ่านเพิ่ม ▼</span></label></div>`;
  }).join('');
}
function toggleCL(id,i,val){
  if(!clChecked[id])clChecked[id]=[];clChecked[id][i]=val;save();
  const r=document.getElementById('clrow-'+id+'-'+i);if(!r)return;
  r.style.cssText=val?'display:flex;align-items:flex-start;gap:6px;background:#E6F8F1;border-left:3px solid #51BF8E;border-radius:5px;padding:4px 8px;margin-bottom:4px;':'display:flex;align-items:flex-start;gap:6px;background:#FFF0EE;border-left:3px solid #FF6766;border-radius:5px;padding:4px 8px;margin-bottom:4px;';
}

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.cm.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*cmCalcRaw(s.id),0);
  const delta=total-DATA.cm.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.cm[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#0891b2':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#0891b2':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>cmCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
(async function init(){
  await loadState();
  renderAll();
  syncHomeStatus();
})();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
</script>
