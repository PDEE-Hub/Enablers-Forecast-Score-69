<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — IA การตรวจสอบภายใน ปี 2569</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── PAT Editorial Light ── */
:root{
  --bg:#f8f7f4;--bg2:#f1efe9;--card:#ffffff;
  --border:#e6e3dc;--border-s:#ece9e1;
  --text:#1c1f24;--text2:#5a5f68;--text3:#9a9da3;
  --navy:#1e3a5c;--gold:#b8862f;
  --lv1:#e2554f;--lv2:#ef9483;--lv3:#e3a82e;--lv4:#5bc69a;--lv5:#1f9d6f;
  --shadow:0 1px 3px rgba(28,31,36,.06);
  --shadow-h:0 4px 12px rgba(28,31,36,.10);
  --radius:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans Thai','Inter',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Inter','Noto Sans Thai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--navy);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold);}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* DIM HEADER */
.dim-hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);}

/* CHIPS */
.chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.cn{background:var(--bg2);color:var(--text2);}
.ct{background:rgba(31,157,111,.12);color:#0f7a55;}
.cr{background:rgba(226,85,79,.10);color:#b91c1c;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 97px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--navy);color:rgba(255,255,255,.9);letter-spacing:.2px;}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:12px;font-weight:700;color:var(--navy);min-width:16px;}
.grp-name{font-size:12px;font-weight:600;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:500;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.chk-all{background:#e4f5e4;color:#64748b;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:4px;background:#d8d4cc;border-radius:2px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;border-radius:2px;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1px solid var(--border-s);transition:background .12s;}
.sub:hover{background:rgba(30,58,92,.04);}
.sub.focus-cg{background:rgba(30,58,92,.07);border-left:3px solid var(--navy);}
.sub.focus-cg .sub-target{border-left-color:var(--navy);}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:700;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--navy);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(30,58,92,.12);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.s0{background:var(--bg2);color:var(--text3);}
.s1{background:rgba(227,168,46,.15);color:#92400e;}
.s2{background:rgba(31,157,111,.12);color:#0f7a55;}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:2px solid var(--navy);background:var(--card);flex-shrink:0;box-shadow:0 -2px 8px rgba(28,31,36,.04);}
.cl-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--navy);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1px solid var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--navy);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:600;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--card);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.frame{border-bottom:1px solid var(--border);}
.frame-hd{padding:8px 16px;font-size:12px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:12px 16px;font-size:13px;line-height:1.65;}
.ftag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.fa-hd{background:rgba(30,58,92,.06);}.fa-tag{background:rgba(30,58,92,.14);color:var(--navy);}
.fb-hd{background:rgba(2,132,199,.06);}.fb-tag{background:rgba(2,132,199,.14);color:#0369a1;}
.fc-hd{background:rgba(184,134,47,.08);}.fc-tag{background:rgba(184,134,47,.18);color:#92400e;}
.fd-hd{background:rgba(71,85,105,.06);}.fd-tag{background:rgba(71,85,105,.14);color:#475569;}
.fe-hd{background:rgba(31,157,111,.07);}.fe-tag{background:rgba(31,157,111,.14);color:#0f7a55;}

.box{border-radius:5px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;}
.box-red{background:rgba(226,85,79,.08);color:#7a1010;border-left:3px solid var(--lv1);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--navy);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;}
.exp-btn:hover{background:var(--border);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:rgba(30,58,92,.05);border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;}
.cg-lvl-row{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--navy);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;overflow:hidden;min-width:0;}
.cg-lvl-summ .kt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
.cg-toggle{background:none;border:1px solid #c0b0e0;border-radius:4px;cursor:pointer;font-size:11px;color:#5a20a0;padding:1px 6px;flex-shrink:0;transition:background .1s;}
.cg-toggle:hover{background:#ece6ff;}
.cl-short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
.cl-exp-btn{font-size:9.5px;color:#5a20a0;cursor:pointer;user-select:none;margin-top:2px;display:inline-block;}
.dep-count-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px 5px;background:#f8f5ff;border-bottom:1px solid #d8ccee;}
.dep-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap;}
.dep-pill span{font-weight:400;opacity:.85;}
.cg-lvl-summ .kt{font-weight:700;color:var(--navy);}
.cg-lvl-detail{padding:8px 14px 10px;background:rgba(30,58,92,.04);border-top:1px dashed var(--border);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:5px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--navy);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--navy);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 4px 4px 0;background:rgba(226,85,79,.05);line-height:1.55;}
.cg-prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:8px;}
.cg-prog-fill{height:4px;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:5px;border:1px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:700;color:var(--navy);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(2,132,199,.06);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:rgba(2,132,199,.10);}
.doc-lvl-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#0369a1;color:#fff;flex-shrink:0;}
.doc-lvl-title{font-size:13px;font-weight:600;color:#0369a1;flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1px solid var(--border);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:#0369a1;font-weight:700;flex-shrink:0;font-family:'Inter',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:rgba(184,134,47,.08);border:1px dashed rgba(184,134,47,.4);border-radius:5px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:rgba(30,58,92,.05);border:1px solid rgba(30,58,92,.15);border-radius:5px;padding:8px 12px;font-size:13px;color:var(--navy);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:#0369a1;color:#fff;text-decoration:none;font-weight:600;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.fb-prog-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);}
.fb-prog-track{flex:1;height:4px;background:#e0ddd8;border-radius:2px;overflow:hidden;}
.fb-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.55;margin:2px 0;border:1px solid transparent;transition:background .12s;}
.fb-item:hover{background:rgba(2,132,199,.05);}
.fb-item-done{background:#f0faf0 !important;border-color:#c3e6cb !important;}
.fb-item-done .fb-item-text{color:#64748b;text-decoration:line-through;opacity:.7;}
.fb-item-gap{border-left:3px solid #d97706;}
.fb-gap-tag{font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;padding:1px 5px;border-radius:10px;flex-shrink:0;white-space:nowrap;margin-top:1px;}
.fb-item input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#0369a1;width:14px;height:14px;cursor:pointer;}
.fb-item-text{color:var(--text2);flex:1;}

/* FRAME E — Self-Assessment Input + Gen */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap;}
.fe-sect-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;}
.fe-lvl-block{margin-bottom:5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.fe-lvl-active{border-color:#86efac;}
.fe-lvl-hd{display:flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;transition:background .12s;background:var(--bg2);}
.fe-lvl-hd:hover{background:rgba(0,0,0,.03);}
.fe-lvl-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.fe-doc-ref{font-size:11px;color:#0369a1;font-weight:600;flex-shrink:0;}
.fe-lvl-body{padding:8px 11px 10px;display:none;border-top:1px solid var(--border);background:var(--bg);}
.fe-lvl-body.open{display:block;}
.fe-textarea{width:100%;box-sizing:border-box;padding:7px 10px;font-size:12.5px;line-height:1.65;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:'Noto Sans Thai',sans-serif;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:#0369a1;box-shadow:0 0 0 2px rgba(3,105,161,.1);}
.fe-gap-item{padding:8px 11px 10px;margin-bottom:5px;background:rgba(217,119,6,.05);border:1px solid rgba(217,119,6,.22);border-radius:var(--radius);}
.fe-gap-text{font-size:12.5px;color:#92400e;margin-bottom:6px;line-height:1.55;}
.fe-gap-status{display:flex;gap:14px;margin-bottom:7px;}
.fe-radio-lbl{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2);}
.fe-radio-lbl input{accent-color:#64748b;cursor:pointer;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:#1e3a5c;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.fe-gen-btn:hover{opacity:.85;}
.fe-output{width:100%;box-sizing:border-box;padding:10px 12px;font-size:12px;line-height:1.75;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:'Noto Sans Thai',sans-serif;resize:vertical;}
.fe-copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 14px;border-radius:20px;background:#0369a1;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;margin-top:6px;}
.fe-copy-btn:hover{opacity:.85;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#c9c5bc;}

/* ── Cross-Dimension Linkage Badges ── */
.dim-badge{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;letter-spacing:.4px;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .15s;}
.dim-badge:hover{opacity:.75;}
.dim-gap-tag{font-size:9px;font-weight:700;color:#b05000;padding:1px 5px;border-radius:3px;background:#fff3e0;border:1px solid #e07000;white-space:nowrap;}
.crosslink-summ{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 12px;background:#f5f0ff;border-bottom:1px solid #d8ccee;font-size:9.5px;color:#4a3a6a;}
.lvl-dim-strip{display:flex;gap:3px;flex-wrap:wrap;padding:3px 12px 4px;background:rgba(240,235,255,.6);border-bottom:1px solid #e8e0f8;}
.cg-lvl-row.is-gap>.cg-lvl-hd{border-left:3px solid #e07000;}
</style>

<style>
/* ── SM dimension accent: green ── */
:root{--dim:#64748b;--dim-lt:rgba(26,122,74,.12);}
/* structural: ใช้ navy เหมือน CG — สม่ำเสมอ ไม่ฉูดฉาด */
/* accent เฉพาะ small elements เท่านั้น */
.sub.focus-cg{border-left-color:var(--dim)!important;}

const DATA={ ia: {
  dimId:"IA",
  dimName:"การตรวจสอบภายใน",
  orig:2.7579,
  color:"#64748b",
  subs:[
  {id:"1.1",grp:"1",gname:"คณะกรรมการตรวจสอบ",gw:15.0,gs68:2.8667,name:"องค์ประกอบและคุณสมบัติ",w:2.0,s68:2.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นการกำหนดองค์ประกอบ คุณสมบัติ ความเป็นอิสระ และความเที่ยงธรรมของคณะกรรมการตรวจสอบ (AC) ให้ถูกต้องตามกฎระเบียบและแนวปฏิบัติสากล การกำหนดและนำตารางสมรรถนะความรู้ (Skill Matrix) ที่สอดคล้องกับบริบท/ความเสี่ยงขององค์กรมาใช้คัดเลือกกรรมการ รวมถึงกระบวนการประเมินผลทักษะอย่างเป็นทางการ และการนำข้อมูลป้อนกลับมาทบทวนเพื่อพัฒนาขีดความสามารถของคณะกรรมการตรวจสอบอย่างต่อเนื่อง","การกำหนดองค์ประกอบและคุณสมบัติรวมถึงความเป็นอิสระและเที่ยงธรรมของคณะกรรมการตรวจสอบไว้ในกฎบัตรคณะกรรมการตรวจสอบ","การกำหนดองค์ประกอบและคุณสมบัติของคณะกรรมการตรวจสอบครบถ้วนตามแนวปฏิบัติของคณะกรรมการตรวจสอบของรัฐวิสาหกิจ หรือ ตลาดหลักทรัพย์แห่งประเทศไทย (ตลท.) รวมทั้งกฎ ระเบียบที่เกี่ยวข้อง (สอดคล้องกับบริบทของรัฐวิสาหกิจ) ไว้ในกฎบัตรคณะกรรมการตรวจสอบ","กำหนด Skill Matrix ของคณะกรรมการตรวจสอบตามองค์ประกอบและคุณสมบัติที่กำหนด และนำไปใช้ในการสรรหา/แต่งตั้ง","การประเมินองค์ประกอบ คุณสมบัติ ประสบการณ์ และทักษะของคณะกรรมการตรวจสอบ อย่างเป็นทางการอย่างน้อยปีละ 1 ครั้ง เพื่อเสนอคณะกรรมการรัฐวิสาหกิจรับทราบ","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวนการกำหนดองค์ประกอบ และคุณสมบัติ เพื่อปรับปรุงให้สอดคล้องกับการเปลี่ยนแปลงอยู่เสมอ"],good:["การแก้ไขปัญหาความล่าช้า: สามารถสรรหาและแต่งตั้งคณะกรรมการตรวจสอบ (AC) ทดแทนตำแหน่งที่ว่างลง (จากกรณีเกษียณอายุ) ได้อย่างรวดเร็วภายใน 3 เดือน ซึ่งปิด Gap ของปีก่อนหน้าได้สำเร็จ","การจัดทำและนำ Skill Matrix ไปใช้อย่างเป็นรูปธรรม: มีการประเมินสมรรถนะหลักและความรู้ที่จำเป็น (Skill Matrix) ถึงปีละ 2 ครั้ง (รอบ 6 เดือนแรกและ 6 เดือนหลัง)","การพัฒนาทักษะแบบเจาะจง: เมื่อพบว่า AC ขาดทักษะด้านนวัตกรรมหรือ ESG ก็ได้ดำเนินการส่งเสริมให้ AC เข้ารับการอบรมหลักสูตรระดับสากลทันที เช่น หลักสูตร BOARD Essentials Program (BEP), Advanced Audit Committee Program (AACP) และหลักสูตร ESG ของ IRDP"],gaps:["\"ความเป็นอิสระ (Independence)\" อย่างแท้จริง: AC บางท่านยังคงได้รับมอบหมายให้ไปดำรงตำแหน่งในคณะอนุกรรมการชุดย่อยอื่นที่มีอำนาจพิจารณาแนวทางการบริหารงานหรือตัดสินใจในกิจการของรัฐวิสาหกิจ ซึ่งขัดต่อหลักการกำกับดูแลกิจการที่ดีด้านความเป็นอิสระของผู้ตรวจสอบ"],results:["ระดับ 1-2: สายตรวจสอบ กทท. ได้ระบุองค์ประกอบ คุณสมบัติ และความเป็นอิสระไว้ใน \"กฎบัตรและคู่มือการปฏิบัติงานของคณะกรรมการตรวจสอบ\" ปี 2568 และ 2569 ครบถ้วนตามระเบียบ สคร. และแก้ปัญหาองค์ประกอบ AC ไม่ครบโดยออกคำสั่งแต่งตั้งทดแทนได้ทันภายใน 3 เดือน","ระดับ 3: มีการจัดทำ Skill Matrix ปี 2568-2569 โดยวิเคราะห์เชื่อมโยงจากแผนวิสาหกิจ กทท., ข้อมูล SWOT Analysis, และเกณฑ์ Core Business Enablers โดยเฉพาะการแยกทักษะด้าน \"นวัตกรรม\" และ \"ESG\" ออกจากกันให้ชัดเจนเพื่อการประเมินที่ตรงจุด","ระดับ 4-5: มีการประเมิน Skill Matrix นำผลไปจัดทำแผนพัฒนา (IDP) จัดส่ง AC อบรมหลักสูตรเฉพาะทาง และนำข้อมูลป้อนกลับมาทบทวนองค์ประกอบและคุณสมบัติอย่างสม่ำเสมอ"],tris:["กทท. จะทำเอกสารและกระบวนการต่างๆ เช่น Skill Matrix และแผนการอบรมได้ครบถ้วนสมบูรณ์ แต่ กฎเหล็กข้อแรกของการตรวจสอบคือ \"ต้องไม่มีส่วนร่วมในการบริหาร\" การที่คณะกรรมการตรวจสอบได้รับมอบหมายเป็นคณะอนุกรรมการชุดอื่นที่มีอำนาจบริหารงาน (เช่น คณะกรรมการกำหนดแนวทางบริหาร กำกับดูแล เร่งรัดและติดตามการใช้ประโยชน์ที่ดิน) ทำให้ TRIS ต้องหักคะแนนและมองว่าคุณสมบัติด้านความเป็นอิสระยังดำเนินการได้ไม่สมบูรณ์"],suggest:["ทบทวนโครงสร้างการมอบหมายงานบอร์ด: รัฐวิสาหกิจ (บอร์ด กทท.) ต้องพิจารณาแนวทางในการจัดสรรกรรมการให้สามารถกำกับดูแลประเด็นที่มีความสำคัญต่อองค์กรภายใต้คณะกรรมการชุดเดียวกัน เพื่อหลีกเลี่ยงการแต่งตั้งคณะอนุกรรมการเป็นจำนวนมากเกินความจำเป็น และลดความเสี่ยงด้านการทับซ้อนที่กระทบต่อความเป็นอิสระของ AC","กทท. ควรนำเครื่องมือ AAR (การทบทวนหลังการปฏิบัติงาน) มาใช้วิเคราะห์กระบวนการประเมิน Skill Matrix ของคณะกรรมการตรวจสอบ เพื่อหา \"รากสาเหตุ (Root Cause)\" ว่าทำไมบอร์ดบางท่านยังขาดทักษะบางด้าน และนำผลนั้นมากำหนดเป็น KPI ในการจัดหลักสูตรอบรมปีถัดไป.","กทท. สามารถระบุในกฎบัตรและกระดาษคำตอบให้ชัดเจนยิ่งขึ้นว่า การสรรหา AC ขององค์กร นอกจากจะใช้ Skill Matrix ภายในแล้ว ยังสอดคล้องและดึงคุณสมบัติมาจากบัญชีรายชื่อ Director Pool ของ สคร. เพื่อยืนยันมาตรฐานระดับประเทศ"],docs:["คำสั่งแต่งตั้งคณะกรรมการ/คณะอนุกรรมการชุดต่างๆ ทั้งหมดของ กทท. ในปีล่าสุด: เพื่อใช้เป็นหลักฐานเชิงประจักษ์ ยืนยันว่ากรรมการตรวจสอบ (AC) ไม่ได้ควบตำแหน่งหรือมีรายชื่ออยู่ในคณะอนุกรรมการสายบริหารหรือสายกำหนดนโยบายองค์กรแล้ว","แบบประเมิน Skill Matrix ประจำปีและหลักฐานการสรรหา: ที่สะท้อนว่าองค์กรได้ใช้ประเด็นความท้าทายใหม่ๆ (เช่น ด้าน Cyber Security หรือ เทคโนโลยี) เข้ามาเป็นเกณฑ์พิจารณาสรรหากรรมการท่านใหม่"],bestprac:["การประเมินทักษะอย่างเป็นทางการและทำ AAR: รฟม. มีการจัดทำ After Action Review (AAR) สำหรับกระบวนการนำ Skill Matrix มาใช้ โดยกำหนดตัวชี้วัดกระบวนการ (KPI in Process) เพื่อประเมินว่ากระบวนการสรรหาและพัฒนาทักษะกรรมการนั้นมีประสิทธิภาพแค่ไหน ซึ่งลึกกว่าแค่การทำแบบประเมินทั่วไป","การเชื่อมโยงบัญชีรายชื่อกรรมการรัฐวิสาหกิจ (Director Pool): กทพ. กำหนดแนวทางการนำ Skill Matrix มาใช้คัดเลือก AC โดยยึดโยงกับการสรรหากรรมการจากบัญชีรายชื่อของกระทรวงการคลัง (Director Pool) อย่างเป็นรูปธรรมและบรรจุไว้เป็นส่วนหนึ่งของคู่มือคณะกรรมการอย่างชัดเจน"],minReqs:{"1":["กฎบัตรคณะกรรมการตรวจสอบ (ที่ระบุเรื่ององค์ประกอบ คุณสมบัติ ความเป็นอิสระ และความเที่ยงธรรมไว้อย่างชัดเจน)","คู่มือการปฏิบัติงานคณะกรรมการตรวจสอบ","วาระและรายงานการประชุมคณะกรรมการตรวจสอบ และคณะกรรมการรัฐวิสาหกิจ (ที่แสดงการพิจารณาเห็นชอบ/อนุมัติกฎบัตร)"],"2":["คำสั่งแต่งตั้งคณะกรรมการตรวจสอบ (ซึ่งหากมีกรณีว่างเว้น ต้องแสดงหลักฐานการแต่งตั้งให้แล้วเสร็จภายใน 3 เดือน)","รายงานการประชุมคณะกรรมการรัฐวิสาหกิจที่มีมติแต่งตั้งกรรมการตรวจสอบ","กฎบัตรคณะกรรมการตรวจสอบ (ที่สอดคล้องกับระเบียบกระทรวงการคลัง, คู่มือ สคร., แนวปฏิบัติ ตลท. และมาตรฐานสากล)"],"3":["ตารางสมรรถนะหลักและความรู้ที่จำเป็น (Skill Matrix) ของคณะกรรมการตรวจสอบ","เอกสารการวิเคราะห์สภาพแวดล้อม (SWOT Analysis) และแผนวิสาหกิจ เพื่อใช้เปรียบเทียบและกำหนด Skill Matrix","รายงานการประชุมคณะกรรมการรัฐวิสาหกิจ ที่แสดงให้เห็นว่ามีการนำ Skill Matrix ไปใช้ประกอบการพิจารณาสรรหา/แต่งตั้งกรรมการ"],"4":["แบบฟอร์มและบันทึกผลการประเมินตนเอง (Skill Matrix) ของคณะกรรมการตรวจสอบ ทั้งแบบ \"รายบุคคล\" และ \"ทั้งคณะ\"","รายงานการประชุมคณะกรรมการรัฐวิสาหกิจ ที่รับทราบผลการประเมินองค์ประกอบและทักษะของคณะกรรมการตรวจสอบ"],"5":["หลักฐานการพัฒนาทักษะ (เช่น วุฒิบัตร ภาพถ่าย หรือรายงานการเข้ารับการอบรมของคณะกรรมการตรวจสอบ เช่น หลักสูตรด้าน ESG, ด้านการกำกับดูแล)","เอกสาร/ตารางเปรียบเทียบการทบทวน Skill Matrix ให้สอดคล้องกับสถานการณ์ที่เปลี่ยนแปลง (เช่น การแยกทักษะด้านนวัตกรรม ออกจากด้านความยั่งยืน ESG)","รายงานการประชุมร่วมระหว่างสายตรวจสอบ สำนักเลขานุการฯ และคณะกรรมการตรวจสอบ เพื่อทบทวนการกำหนดองค์ประกอบ คุณสมบัติ และ Skill Matrix ประจำปี"]},subComps:{"1":["ข้อกำหนดด้านจำนวนและคุณสมบัติบังคับ : องค์ประกอบของคณะกรรมการตรวจสอบ ต้องมีไม่น้อยกว่า 3 คน แต่ไม่เกิน 5 คน โดยกรรมการไม่น้อยกว่า 1 ใน 3 (และอย่างน้อย 1 คน) ต้องมีความรู้และประสบการณ์ด้านการบัญชีหรือการเงิน","ความเป็นอิสระของคณะกรรมการตรวจสอบ (AC Independence) : กรรมการตรวจสอบจะต้องไม่เป็นกรรมการหรืออนุกรรมการในชุดย่อยอื่น ๆ ที่มีอำนาจในการบริหารงานรัฐวิสาหกิจ มีบทบาทในการกำหนดนโยบาย ระเบียบปฏิบัติ หรือมีอำนาจในการตัดสินใจ เพื่อหลีกเลี่ยงความขัดแย้งทางผลประโยชน์ (Conflict of Interest)"],"2":["ข้อกำหนดด้านจำนวนและคุณสมบัติบังคับ : องค์ประกอบของคณะกรรมการตรวจสอบ ต้องมีไม่น้อยกว่า 3 คน แต่ไม่เกิน 5 คน โดยกรรมการไม่น้อยกว่า 1 ใน 3 (และอย่างน้อย 1 คน) ต้องมีความรู้และประสบการณ์ด้านการบัญชีหรือการเงิน","ความเป็นอิสระของคณะกรรมการตรวจสอบ (AC Independence) : กรรมการตรวจสอบจะต้องไม่เป็นกรรมการหรืออนุกรรมการในชุดย่อยอื่น ๆ ที่มีอำนาจในการบริหารงานรัฐวิสาหกิจ มีบทบาทในการกำหนดนโยบาย ระเบียบปฏิบัติ หรือมีอำนาจในการตัดสินใจ เพื่อหลีกเลี่ยงความขัดแย้งทางผลประโยชน์ (Conflict of Interest)","เงื่อนไขระยะเวลาการแต่งตั้ง (Timeline) : กรณีที่คณะกรรมการตรวจสอบว่างเว้น รัฐวิสาหกิจต้องดำเนินการสรรหาและแต่งตั้งให้แล้วเสร็จภายใน 3 เดือน (หากล่าช้ากว่านี้โดยไม่ใช่เหตุสุดวิสัยภายนอก จะถือว่าตกเกณฑ์)"],"3":["ความครอบคลุมของ Skill Matrix : คณะกรรมการตรวจสอบในองค์รวมควรมีความรู้ครอบคลุมลักษณะดำเนินงานของรัฐวิสาหกิจ ทั้งด้านการเงินบัญชี บริหารความเสี่ยง การควบคุมภายใน ตรวจสอบภายใน กฎหมาย และควรมีทักษะเพิ่มเติมตามเทรนด์ เช่น ด้านเทคโนโลยีสารสนเทศ (IT) และด้านการพัฒนาอย่างยั่งยืน (ESG)"],"4":["ความครอบคลุมของ Skill Matrix : คณะกรรมการตรวจสอบในองค์รวมควรมีความรู้ครอบคลุมลักษณะดำเนินงานของรัฐวิสาหกิจ ทั้งด้านการเงินบัญชี บริหารความเสี่ยง การควบคุมภายใน ตรวจสอบภายใน กฎหมาย และควรมีทักษะเพิ่มเติมตามเทรนด์ เช่น ด้านเทคโนโลยีสารสนเทศ (IT) และด้านการพัฒนาอย่างยั่งยืน (ESG)","รูปแบบการประเมิน (Assessment Format) : วิธีการประเมินผลการปฏิบัติงานของคณะกรรมการตรวจสอบ ต้องมีการกำหนดรูปแบบทั้ง \"การประเมินตนเองเป็นรายบุคคล\" และ \"การประเมินทั้งคณะ\" ตามที่คู่มือตรวจสอบฯ กำหนด"]}},
  {id:"1.2",grp:"1",gname:"คณะกรรมการตรวจสอบ",gw:15.0,gs68:2.8667,name:"การปฏิบัติหน้าที่",w:12.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นไปที่ความครอบคลุมของการกำหนดอำนาจหน้าที่ของคณะกรรมการตรวจสอบ (AC) ไว้ในกฎบัตรและคู่มือปฏิบัติงาน โดยต้องสอดคล้องกับปัจจัยความเสี่ยงขององค์กรและครอบคลุมมิติที่สำคัญ (เช่น ESG, ทุจริต, IT, Enablers 7 ด้าน) รวมถึงประเมินความสามารถของ AC ในการนำแผนไปปฏิบัติจริง การติดตามข้อเสนอแนะจากหน่วยงานกำกับดูแล และกระบวนการนำผลการดำเนินงานมาทบทวนปรับปรุงกฎบัตรและแผนปฏิบัติงานให้ทันสมัยสม่ำเสมอ","การวิเคราะห์ปัจจัยภายใน/ภายนอก เพื่อจัดทำกฎบัตร รวมถึงคู่มือปฏิบัติงานของคณะกรรมการตรวจสอบ","กฎบัตรของคณะกรรมการตรวจสอบของรัฐวิสาหกิจมีความครบถ้วน (ตามประเด็นที่เกณฑ์กำหนด)","กฎบัตรของคณะกรรมการตรวจสอบของรัฐวิสาหกิจมีความครบถ้วน (ตามประเด็นที่เกณฑ์กำหนด)","การสอบทานการดำเนินงานขององค์กรในด้านต่างๆ ในทุกประเด็นที่มีความเสี่ยงสำคัญที่ส่งผลกระทบต่อวัตถุประสงค์เชิงกลยุทธ์ของรัฐวิสาหกิจ รวมถึงสอดคล้องการเปลี่ยนแปลงต่างๆ ที่มีสาระสำคัญต่อสภาพแวดล้อมของความเสี่ยงของรัฐวิสาหกิจ และมีบทบาทในการสอบทานการดำเนินงานต่าง ๆ ขององค์กร ตามเกณฑ์ Enabler ทั้ง 7 ด้าน รวมทั้งมีบทบาทในการติดตามการดำเนินงานตามข้อสังเกต/ข้อเสนอแนะตามที่หน่วยงานกำกับได้ให้ไว้กับรัฐวิสาหกิจ","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวนกฎบัตร คู่มือ และแผนปฏิบัติงานของคณะกรรมการตรวจสอบ อย่างน้อยปีละ 1 ครั้ง"],good:["การปรับตัวรับมาตรฐานสากลล่วงหน้า: กทท. สามารถทบทวนและปรับปรุงกฎบัตรและคู่มือการปฏิบัติงานของคณะกรรมการตรวจสอบ (AC) ให้สอดคล้องกับมาตรฐานการตรวจสอบภายในสากลฉบับใหม่ล่าสุด ประจำปี 2024 (IIA Standards 2024) ได้สำเร็จล่วงหน้าก่อนที่มาตรฐานจะมีผลบังคับใช้","การบูรณาการ 3 ประสาน (GRC): AC มีการประชุมหารือร่วมกับคณะกรรมการบริหารความเสี่ยงฯ (RM) และคณะกรรมการกำกับดูแลกิจการที่ดีฯ (CG) อย่างเป็นรูปธรรม เพื่อแลกเปลี่ยนและบูรณาการข้อมูลความเสี่ยงสำคัญ เช่น กฎหมาย PDPA และ ESG สำหรับใช้ในการวางแผนตรวจสอบเชิงกลยุทธ์","การสอบทานงานกำกับดูแลครบถ้วน: AC ปฏิบัติหน้าที่ครบถ้วน 100% ตามแผน โดยได้สอบทานความเสี่ยงและ Enablers ทั้ง 7 ด้าน และเชิญผู้สอบบัญชี (สตง.) รวมถึงหน่วยงานกำกับดูแล (สคร.) เข้าร่วมประชุมเพื่อติดตามข้อสังเกตอย่างสม่ำเสมอ"],gaps:["บทบาท \"เชิงรุก\" ด้านการพัฒนาอย่างยั่งยืน (ESG): แม้สายตรวจสอบจะเริ่มจัดอบรมด้าน ESG ให้แก่ AC และนำเข้าสู่แผนตรวจสอบแล้ว แต่ AC ยังขาดบทบาทเชิงรุกในการสอบทานและส่งเสริมงานด้าน ESG อย่างเป็นรูปธรรมและต่อเนื่อง","ข้อเสนอแนะเชิงกลยุทธ์ที่สร้าง \"มูลค่าเพิ่ม (Value-Added)\": ผู้ประเมินยังไม่เห็นหลักฐานเชิงประจักษ์เพียงพอที่แสดงว่า AC ได้ให้ข้อเสนอแนะเชิงนโยบายเพื่อนำไปสู่การอุดช่องโหว่หรือแก้ไขปัญหาที่รากสาเหตุ (Root Cause) เพื่อป้องกันการเกิดซ้ำ"],results:["ระดับ 1-2: มีการวิเคราะห์ปัจจัยภายใน/ภายนอก และทบทวนกฎบัตรคณะกรรมการตรวจสอบปี 2568-2569 ให้ครบถ้วนสอดคล้องกับมาตรฐาน IIA 2024 และเกณฑ์ประเมิน SE-AM ฉบับล่าสุด โดย AC ปฏิบัติงานเป็นไปตามกฎบัตรได้อย่างครบถ้วน","ระดับ 3: มีการจัดทำคู่มือการปฏิบัติงานเฉพาะของ กทท. และ AC สามารถดำเนินงานตรวจสอบและสอบทานตามแผนปฏิบัติงานที่กำหนดไว้ได้ครบถ้วน","ระดับ 4: AC ได้สอบทานความเสี่ยงที่สำคัญที่กระทบต่อวัตถุประสงค์เชิงกลยุทธ์และ Enablers ทั้ง 7 ด้าน มีการเชิญผู้สอบบัญชีและหน่วยงานกำกับดูแลร่วมประชุมเพื่อติดตามการแก้ไขข้อบกพร่อง และมีการประชุมร่วมกับบอร์ดความเสี่ยง (RM) และบอร์ดกำกับดูแลกิจการ (CG) เพื่อยกระดับงานกำกับดูแล","ระดับ 5: มีการใช้ข้อมูลป้อนกลับ (Feedback) จากการดำเนินงานและข้อกำหนดใหม่ๆ มาทบทวนกฎบัตร คู่มือ และแผนปฏิบัติงานของ AC อย่างน้อยปีละ 1 ครั้ง โดยผ่านการอนุมัติจากบอร์ด กทท. เรียบร้อย"],tris:["ถึงแม้สายตรวจสอบ กทท. จะจัดเตรียมกระดาษทำการและหลักฐานได้ครบถ้วนถึงระดับ 5 แต่ TRIS ประเมินให้คะแนนหยุดอยู่ที่การปฏิบัติหน้าที่ขั้นพื้นฐาน (ระดับ 3) เนื่องจากผู้ประเมินมองว่า AC ของ กทท. \"ยังขาดบทบาทเชิงรุกด้าน ESG\" ซึ่งเป็นเทรนด์ความยั่งยืนระดับโลก นอกจากนี้ คณะกรรมการตรวจสอบและหน่วยตรวจสอบภายใน \"ยังต้องมอบข้อเสนอแนะเชิงนโยบายหรือเชิงกลยุทธ์\" ที่แสดงให้เห็นถึงการวิเคราะห์หาสาเหตุเชิงลึกและสร้างมูลค่าเพิ่ม (Value-Added) อย่างเป็นรูปธรรมมากกว่าแค่การตรวจตามระบบปกติ"],suggest:["มุ่งเน้นผลลัพธ์ด้าน ESG: AC ต้องเพิ่มวาระการติดตามผลการตรวจสอบ \"กระบวนการบริหารจัดการความยั่งยืน (ESG)\" อย่างต่อเนื่อง และให้ข้อเสนอแนะเชิงนโยบายด้าน ESG ที่ชัดเจนในรายงานการประชุม","ยกระดับข้อเสนอแนะเชิงป้องกัน: AC ควรเน้นการให้ข้อเสนอแนะต่อฝ่ายบริหารและหน่วยรับตรวจ ในลักษณะของการควบคุมเชิงป้องกัน (Preventive Control) เพื่อไม่ให้เกิดข้อผิดพลาดซ้ำในประเด็นเดิม"],docs:["รายงานการประชุม AC (Highlight วาระ ESG และ Value-Added): ที่แสดงให้เห็นมติ หรือ \"ข้อเสนอแนะเชิงนโยบาย\" ของคณะกรรมการตรวจสอบด้านความยั่งยืน (ESG) หรือข้อสั่งการที่สั่งให้ฝ่ายบริหารนำไปแก้ปัญหาเชิงโครงสร้าง","รายงานสรุปผลการปฏิบัติตามข้อเสนอแนะของ AC: เอกสารสรุปที่สายตรวจสอบรวบรวมว่า ข้อเสนอแนะของ AC ในรอบปีที่ผ่านมา ได้ถูกนำไปปฏิบัติจนเกิดเป็น \"การสร้างมูลค่าเพิ่ม (Value-Added)\" เช่น การลดต้นทุน, การประหยัดเวลา, หรือการอุดช่องโหว่ความเสี่ยงทาง IT เป็นต้น"],bestprac:["การสอบทานแบบเจาะลึกและบูรณาการ Enablers: รฟม. มีการปฏิบัติหน้าที่สอบทานการดำเนินงานในทุกประเด็นที่มีนัยสำคัญต่อสภาพแวดล้อมความเสี่ยงขององค์กร โดยเจาะลึกเข้าไปในเกณฑ์ Enablers ทั้ง 7 ด้านอย่างละเอียด","วาระติดตามผลสัมฤทธิ์อย่างเป็นทางการ: กทพ. มีการนำข้อสังเกตหรือข้อเสนอแนะของ AC ไปกำหนดให้เป็น \"วาระติดตามผลการดำเนินงานตามมติคณะกรรมการ กทพ.\" และรายงานผลให้คณะกรรมการฯ รับทราบและติดตามผลเป็นประจำทุกไตรมาส ทำให้ข้อเสนอแนะถูกขับเคลื่อนจริง"],minReqs:{"1":["เอกสารสรุปผลการวิเคราะห์ปัจจัยภายในและภายนอก (เช่น สภาพแวดล้อมทางธุรกิจ, ความเสี่ยงองค์กร, กฎหมาย/ระเบียบใหม่) ที่นำมาใช้เป็นข้อมูลประกอบการจัดทำกฎบัตรและคู่มือปฏิบัติงานของคณะกรรมการตรวจสอบ (AC)"],"2":["กฎบัตรคณะกรรมการตรวจสอบ (ฉบับประกาศใช้) ที่มีการระบุอำนาจหน้าที่ครอบคลุมประเด็นสำคัญครบถ้วนตามเกณฑ์ (เช่น การสอบทานงบการเงิน, การบริหารความเสี่ยง/ป้องกันทุจริต, ESG, IT Security, และการประเมินตนเอง)"],"3":["คู่มือการปฏิบัติงานของคณะกรรมการตรวจสอบ (เฉพาะของรัฐวิสาหกิจ)","แผนปฏิบัติงานประจำปีของคณะกรรมการตรวจสอบ","รายงานการประชุม AC ที่แสดงให้เห็นว่ามีการประชุมและพิจารณาวาระต่างๆ ครบถ้วนตามแผนปฏิบัติงานที่วางไว้"],"4":["รายงานการประชุม AC ที่แสดงให้เห็นว่ามีการประชุมและพิจารณาวาระต่างๆ ครบถ้วนตามแผนปฏิบัติงานที่วางไว้","รายงานการประชุม AC ที่มีวาระการสอบทานการดำเนินงานขององค์กรตามเกณฑ์ Enablers ทั้ง 7 ด้าน"],"5":["หลักฐาน/วาระการประชุมที่แสดงการติดตามความคืบหน้าของการดำเนินงานตามข้อสังเกตหรือข้อเสนอแนะจากหน่วยงานกำกับดูแล (เช่น สตง., สคร.)","รายงานการประชุม AC หรือเอกสารสรุปการนำข้อมูลป้อนกลับ (Feedback) จากการดำเนินงาน หรือผลการประเมินตนเอง มาใช้ทบทวนและปรับปรุง กฎบัตร คู่มือ และแผนปฏิบัติงานของคณะกรรมการตรวจสอบ (ดำเนินการอย่างน้อยปีละ 1 ครั้ง)"]},subComps:{"2":["ความครบถ้วนขององค์ประกอบในกฎบัตร AC : กฎบัตรจะถูกประเมินว่า \"ครบถ้วน\" ก็ต่อเมื่อมีการระบุอำนาจหน้าที่ของ AC ครอบคลุมประเด็นสำคัญบังคับ ดังนี้ 1. การพิจารณางบการเงิน นโยบายบัญชี และมาตรฐานการรายงาน 2. การบริหารความเสี่ยงเพื่อป้องกันการทุจริต การควบคุมภายใน และการตรวจสอบภายใน 3. การกำกับดูแลกิจการที่ดี (CG) 4. การสอบทานแผนการตรวจสอบประจำปีของ IA 5. การพิจารณาร่วมกับผู้สอบบัญชีภายนอก และพิจารณาร่วมกับผู้ตรวจสอบภายใน (รวมถึงการประเมิน Outsource หากมี) 6. การรักษาความปลอดภัยด้านเทคโนโลยีสารสนเทศ (IT Security) / การใช้คอมพิวเตอร์ในทางที่ผิด 7. การพิจารณารายการที่อาจก่อให้เกิดความขัดแย้งทางผลประโยชน์ (Conflict of Interest) 8. การประเมินตนเองเกี่ยวกับการปฏิบัติหน้าที่","บทบาทด้านการพัฒนาอย่างยั่งยืน (ESG) : ถือเป็นประเด็นใหม่ที่เป็นจุดเน้นของ สคร. โดยคณะกรรมการตรวจสอบต้องถูกระบุบทบาทและมีหลักฐานเชิงประจักษ์ในการส่งเสริม/สอบทานการดำเนินงานด้านสิ่งแวดล้อม สังคม และการกำกับดูแล (ESG) ขององค์กร","บทบาทประเมินหน่วยงานภายนอก (Outsource) : หากรัฐวิสาหกิจมีการจ้างที่ปรึกษาภายนอกมาช่วยตรวจสอบภายใน หรือสอบทานระบบการควบคุมภายใน ซ่อนเงื่อนไขว่า AC ต้องมีบทบาทในการ \"ประเมินการปฏิบัติงานของหน่วยงานภายนอกดังกล่าวอย่างสม่ำเสมอ\" ด้วย"],"3":["การรายงานด่วนกรณีพบปัญหาสำคัญ : หากพบปัญหาหรือข้อจำกัดในการสอบบัญชี หรือประเด็นที่อาจสร้างความเสียหายร้ายแรงต่อองค์กร AC ต้องมีบทบาทในการรับรายงานและสั่งการเพื่อแก้ไขอย่างทันท่วงที"],"4":["บทบาทด้านการพัฒนาอย่างยั่งยืน (ESG) : ถือเป็นประเด็นใหม่ที่เป็นจุดเน้นของ สคร. โดยคณะกรรมการตรวจสอบต้องถูกระบุบทบาทและมีหลักฐานเชิงประจักษ์ในการส่งเสริม/สอบทานการดำเนินงานด้านสิ่งแวดล้อม สังคม และการกำกับดูแล (ESG) ขององค์กร","บทบาทประเมินหน่วยงานภายนอก (Outsource) : หากรัฐวิสาหกิจมีการจ้างที่ปรึกษาภายนอกมาช่วยตรวจสอบภายใน หรือสอบทานระบบการควบคุมภายใน ซ่อนเงื่อนไขว่า AC ต้องมีบทบาทในการ \"ประเมินการปฏิบัติงานของหน่วยงานภายนอกดังกล่าวอย่างสม่ำเสมอ\" ด้วย","การรายงานด่วนกรณีพบปัญหาสำคัญ : หากพบปัญหาหรือข้อจำกัดในการสอบบัญชี หรือประเด็นที่อาจสร้างความเสียหายร้ายแรงต่อองค์กร AC ต้องมีบทบาทในการรับรายงานและสั่งการเพื่อแก้ไขอย่างทันท่วงที"]}},
  {id:"1.3",grp:"1",gname:"คณะกรรมการตรวจสอบ",gw:15.0,gs68:2.8667,name:"การประชุมและองค์ประชุม",w:1.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินประสิทธิภาพและประสิทธิผลของกระบวนการจัดประชุมคณะกรรมการตรวจสอบ (AC) ตั้งแต่การวางแผนการประชุมล่วงหน้าที่ครอบคลุมบทบาทตามกฎบัตร ความพร้อมและการให้เวลาในการศึกษาข้อมูลของกรรมการ (การส่งเอกสารล่วงหน้าอย่างน้อย 7 วัน) ความรับผิดชอบในการเข้าร่วมประชุม คุณภาพของการประชุมที่สะท้อนผ่านข้อเสนอแนะเชิงนโยบายที่สร้างมูลค่าเพิ่ม ไปจนถึงความสามารถในการนำข้อมูลป้อนกลับจากการจัดประชุมรอบที่ผ่านมา ไปปรับปรุงกระบวนการจัดประชุมในอนาคตให้มีประสิทธิภาพมากยิ่งขึ้น","คณะกรรมการตรวจสอบกำหนดปฏิทินการประชุมและวาระการประชุมล่วงหน้าอย่างชัดเจน โดยมีความถี่ในการประชุมอย่างน้อยไตรมาสละ 1 ครั้ง และวาระประชุมคณะกรรมการตรวจสอบต้องครอบคลุมบทบาทหน้าที่ตามกฎบัตร รวมถึงระเบียบและแนวปฏิบัติที่เกี่ยวข้อง","การได้รับข้อมูลประกอบการประชุมล่วงหน้าอย่างน้อย 7 วัน","การเข้าร่วมประชุมของกรรมการตรวจสอบในการประชุมคณะกรรมการตรวจสอบทั้งหมดที่ได้จัดให้มีขึ้นในรอบปี","การมีส่วนร่วมในการแสดงความคิดเห็น และการให้ข้อเสนอแนะในเชิงนโยบายที่สร้างมูลค่าเพิ่มให้กับรัฐวิสาหกิจ","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวนกระบวนการจัดประชุมของคณะกรรมการตรวจสอบ เพื่อปรับปรุงให้มีประสิทธิภาพยิ่งขึ้น"],good:["การแก้ไขปัญหาเอกสารล่าช้าแบบก้าวกระโดด: กทท. สามารถแก้ปัญหาที่เคยถูกหักคะแนนในอดีตได้สำเร็จ โดยนำระบบ e-meeting มาใช้ และสามารถจัดส่งเอกสารประกอบการประชุมให้คณะกรรมการตรวจสอบ (AC) ล่วงหน้าได้ถึง 10 วัน (เกินกว่าเกณฑ์ที่ TRIS กำหนดไว้ที่ 7 วัน)","องค์ประชุมครบถ้วนสมบูรณ์ 100%: AC เข้าร่วมประชุมครบถ้วน 100% ในทุกครั้งที่มีการจัดประชุมตลอดทั้งปี (รวม 16 ครั้ง แบ่งเป็นวาระปกติ 11 ครั้ง และวาระลับ 5 ครั้ง)","การวางแผนล่วงหน้า: มีการกำหนดปฏิทินและวาระการประชุมล่วงหน้าตลอดปีอย่างชัดเจน"],gaps:["การบันทึกรายงานการประชุมที่สะท้อน \"มูลค่าเพิ่ม (Value-Added)\": แม้ กทท. จะจัดการประชุมได้ดีเลิศในเชิงระบบ (Logistics) แต่การบันทึกรายงานการประชุม (Minutes) อาจยังไม่สะท้อนให้ผู้ประเมินเห็นภาพชัดเจนว่า AC ได้ \"แสดงความคิดเห็นและให้ข้อเสนอแนะเชิงนโยบายที่สร้างมูลค่าเพิ่มให้กับองค์กร\" อย่างเป็นรูปธรรมในทุกๆ การประชุม"],results:["ระดับ 1: กำหนดปฏิทินและวาระการประชุมล่วงหน้า มีการประชุมเดือนละ 1 ครั้ง ครอบคลุมบทบาทตามกฎบัตร","ระดับ 2: ส่งเอกสารล่วงหน้า 10 วันก่อนการประชุม ผ่านระบบ e-meeting","ระดับ 3: AC เข้าร่วมประชุมครบ 100% ทั้ง 16 ครั้ง และมีการรายงานผลให้บอร์ด กทท. ทราบทุกเดือน","ระดับ 4: ระบุว่า AC มีส่วนร่วมในการแสดงความคิดเห็นและให้ข้อเสนอแนะเชิงนโยบายที่สร้างมูลค่าเพิ่มตามวาระที่เสนอเข้าประชุมทุกครั้ง","ระดับ 5: มีการนำข้อมูลการประชุมที่ได้ดำเนินการในปีที่ผ่านมาเป็นข้อมูลในการทบทวนปฏิทินและวาระการประชุมล่วงหน้าของปีถัดไป"],tris:["กทท. ได้คะแนนในข้อนี้ไป 3 คะแนน (จากเต็ม 5) ซึ่งหมายความว่า TRIS ยอมรับว่า กทท. ผ่านระดับ 1-3 อย่างสมบูรณ์แบบ (ปิด Gap เรื่องการส่งเอกสารและองค์ประชุมได้แล้ว) แต่สาเหตุที่ยังไม่ให้ผ่านระดับ 4 เป็นเพราะ หลักฐานเชิงประจักษ์ในเรื่อง \"ข้อเสนอแนะเชิงกลยุทธ์ที่สร้างมูลค่าเพิ่ม\" ในรายงานการประชุมอาจยังไม่เด่นชัดพอ ผู้ประเมินยังมองว่าข้อเสนอแนะส่วนใหญ่เป็นไปตามวาระปกติ (Compliance) มากกว่าการพลิกโฉมหรือสร้างนวัตกรรมให้องค์กร"],suggest:["รักษาระยะเวลาจัดส่งเอกสาร: รักษาระยะเวลาการจัดส่งเอกสารให้ AC ล่วงหน้าอย่างน้อย 7 วัน (หรือ 10 วันเหมือนเดิม) ให้เป็นมาตรฐานต่อเนื่อง","ยกระดับการเขียนรายงานการประชุม: เลขานุการ AC ต้องปรับวิธีการบันทึกรายงานการประชุม โดยเน้น Highlight หรือแยกหัวข้อ \"ข้อเสนอแนะเชิงนโยบายเพื่อสร้างมูลค่าเพิ่ม (Value-Added)\" ออกมาให้ชัดเจนในรายงาน เพื่อให้ TRIS อ่านแล้วเห็นทันทีว่า AC ได้ให้คำแนะนำที่ช่วยลดต้นทุน เพิ่มรายได้ หรือลดความเสี่ยงระดับองค์กรอย่างไร"],docs:["Log File จากระบบ e-meeting: พิมพ์ประวัติการส่งเอกสารหรือหลักฐานอิเล็กทรอนิกส์ที่ระบุ \"วันที่และเวลา\" (Timestamp) อย่างชัดเจนว่ากรรมการได้รับเอกสารก่อนวันประชุม 10 วันจริง เพื่อมัดรวมความสมบูรณ์ของระดับ 2","รายงานการประชุมที่ Highlight ข้อเสนอแนะเชิงนโยบาย: คัดเลือกรายงานการประชุมฉบับที่ดีที่สุด (Best Minutes) ในปี 2569 ที่สะท้อนการถกเถียงเชิงกลยุทธ์ และขีดเน้นข้อความที่ AC ให้คำแนะนำที่เป็น Value-Added แนบส่งให้ TRIS ดูเป็นพิเศษ"],bestprac:["เนื่องจากกระบวนการ (Process) ของ กทท. แข็งแกร่งกว่าหน่วยงานคู่เทียบแล้ว ไม่จำเป็นต้องลอกเลียนแบบกระบวนการของหน่วยงานนอก แต่ควรนำวิธี \"การแสดงหลักฐาน\" ของ กทพ. มาใช้ กล่าวคือ กทพ. มีการตั้ง \"วาระติดตามผลสัมฤทธิ์จากข้อสังเกตของ AC\" เป็นวาระประจำทุกไตรมาส กทท. ควรนำเทคนิคนี้มาใช้ โดยบันทึกในกระดาษคำตอบปี 69 ว่า “กทท. ไม่เพียงแต่ส่งเอกสารล่วงหน้า 10 วันและเข้าประชุมครบ 100% แต่ยังได้เพิ่ม 'วาระติดตามผลข้อเสนอแนะเชิงนโยบาย' อย่างเป็นทางการ เพื่อยืนยันว่ามติของ AC ถูกนำไปสร้างมูลค่าเพิ่มได้จริง”"],minReqs:{"1":["ปฏิทินการประชุมคณะกรรมการตรวจสอบที่กำหนดไว้ล่วงหน้าตลอดทั้งปี","แผนการกำหนดวาระการประชุมล่วงหน้า ที่สอดคล้องและครอบคลุมบทบาทหน้าที่ตามกฎบัตรคณะกรรมการตรวจสอบ"],"2":["หลักฐานการนำส่งวาระและเอกสารประกอบการประชุม (เช่น e-mail, บันทึกข้อความ, หรือ Log file จากระบบ e-meeting) ที่มีระบบประทับเวลา (Timestamp) ยืนยันว่าได้จัดส่งให้กรรมการล่วงหน้าไม่น้อยกว่า 7 วันก่อนวันประชุม"],"3":["รายงานการประชุมหรือตารางสรุปสถิติการเข้าร่วมประชุม (Attendance Sheet) ที่แสดงให้เห็นว่ากรรมการตรวจสอบทุกคนเข้าร่วมประชุมครบถ้วนตามที่ได้จัดให้มีขึ้นในรอบปี"],"4":["รายงานการประชุมคณะกรรมการตรวจสอบ (Minutes of Meeting) ในส่วนของข้อคิดเห็น ที่มีการบันทึก \"ข้อเสนอแนะเชิงนโยบาย\" หรือมติที่ประชุมที่แสดงให้เห็นถึงการยกระดับหรือการสร้างมูลค่าเพิ่ม (Value-Added) ให้กับองค์กรอย่างชัดเจน"],"5":["รายงานการประชุมหรือบันทึกข้อความสรุปผลการดำเนินงาน ที่แสดงถึงการนำข้อมูลปัญหา อุปสรรค หรือข้อเสนอแนะจากการจัดประชุมในปีที่ผ่านมา (Feedback) มาพิจารณาทบทวนเพื่อปรับปรุงปฏิทิน วาระ หรือรูปแบบการจัดประชุมของปีถัดไปให้มีประสิทธิภาพยิ่งขึ้น"]},subComps:{"1":["ความครอบคลุมของวาระที่กำหนดล่วงหน้า : แม้เกณฑ์จะกำหนดความถี่ขั้นต่ำไว้ที่ไตรมาสละ 1 ครั้ง แต่วาระที่ถูกจัดทำล่วงหน้าจะต้องถูกจับคู่ (Mapping) ให้เห็นว่าครอบคลุมบทบาทสำคัญในกฎบัตรครบถ้วนตลอดปี เช่น ต้องมีวาระสอบทานงบการเงิน วาระความเสี่ยง/ทุจริต วาระด้าน ESG และวาระประเมินตนเอง เป็นต้น"],"2":["นิยามของการส่งเอกสารล่วงหน้า : การส่งล่วงหน้า 7 วัน ไม่ใช่การส่งเพียง \"หนังสือเชิญประชุม\" แต่ต้องส่ง \"ข้อมูลและเอกสารประกอบการประชุมทั้งหมด\" เพื่อให้กรรมการมีเวลาศึกษาอย่างเพียงพอก่อนการพิจารณาตัดสินใจ (ซึ่ง กทท. ทำจุดนี้ได้ดีโดยการส่งล่วงหน้า 10 วันผ่านระบบ e-meeting)"],"4":["นิยามการให้ข้อเสนอแนะที่สร้างมูลค่าเพิ่ม : ข้อคิดเห็นในรายงานการประชุมต้องก้าวข้ามการ \"รับทราบ\" วาระตามปกติ แต่ต้องเป็นข้อเสนอแนะเชิงนโยบายที่องค์กรสามารถนำไปต่อยอด แก้ไขปัญหาเชิงป้องกัน หรือสร้างประโยชน์เชิงประจักษ์ได้จริง"],"5":["กระบวนการทบทวนที่เป็นรูปธรรม : การทบทวนกระบวนการจัดประชุมไม่ได้หมายถึงการเปลี่ยนแค่วันที่ในปฏิทินของปีถัดไป แต่ต้องแสดงให้ผู้ประเมินเห็นว่า ได้นำ Pain point หรือ Feedback จากปีที่ผ่านมา (เช่น วาระแน่นเกินไปในบางเดือน หรือเอกสารซับซ้อนไป) มาวิเคราะห์เพื่อปรับรูปแบบการจัดประชุมปีถัดไปให้กระชับและมีประสิทธิภาพมากขึ้น"]}},
  {id:"2.1",grp:"2",gname:"หน่วยตรวจสอบภายใน",gw:15.0,gs68:3.0944,name:"บทบาทและความรับผิดชอบของหน่วยตรวจสอบภายใน",w:3.0,s68:4.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินกระบวนการจัดทำ \"กฎบัตรการตรวจสอบภายใน (IA Charter)\" และ \"จรรยาบรรณ (Code of Ethics)\" ตั้งแต่จุดเริ่มต้นที่ต้องวิเคราะห์ปัจจัยแวดล้อมและความสอดคล้องกับกฎบัตรของ AC ไปจนถึงความครบถ้วนของเนื้อหาตามมาตรฐานสากล ประเมินกระบวนการมีส่วนร่วมที่ต้องรับฟังความคาดหวังจากผู้บริหารสูงสุด การอนุมัติจาก AC การสื่อสารทั่วทั้งองค์กร การนำบทบาทหน้าที่ที่เขียนไว้ไปปฏิบัติให้เกิดผลจริง และการทบทวนปรับปรุงกฎบัตรให้ทันสมัยอย่างน้อยปีละ 1 ครั้ง","การวิเคราะห์ปัจจัยภายใน/ภายนอก รวมถึงกฎบัตรคณะกรรมการตรวจสอบ เพื่อจัดทำกฎบัตร และจรรยาบรรณของหน่วยตรวจสอบภายใน","กฎบัตรของหน่วยตรวจสอบภายในมีความสอดคล้องกับกฎบัตรคณะกรรมการตรวจสอบ และมีความครบถ้วนตามมาตรฐานและแนวปฏิบัติที่ดี","การหารือความต้องการ ความคาดหวัง รวมถึงพันธกิจของงานตรวจสอบภายใน กับผู้บริหารสูงสุดของรัฐวิสาหกิจ เพื่อนำความเห็นมาจัดทำร่างกฎบัตร และการนำเสนอกฎบัตรต่อหัวหน้ารัฐวิสาหกิจ/คณะกรรมการตรวจสอบเพื่ออนุมัติ รวมถึงการสื่อสารกฎบัตรให้บุคคลที่เกี่ยวข้องรับทราบ","การดำเนินการตามบทบาทหน้าที่ที่ระบุไว้ในกฎบัตรอย่างครบถ้วน","การทบทวน/ปรับปรุงกฎบัตร อย่างน้อยปีละ 1 ครั้ง"],good:["การปรับปรุงกฎบัตรให้ล้ำหน้า: กทท. สามารถทบทวนและปรับปรุง \"กฎบัตรการตรวจสอบภายใน\" ให้สอดคล้องกับ มาตรฐานการตรวจสอบภายในสากลฉบับใหม่ล่าสุด ปี 2024 (IIA Standards 2024) ได้สำเร็จล่วงหน้า (ซึ่งมาตรฐานนี้มีผลบังคับใช้จริงในวันที่ 9 มกราคม 2568)","การหารือความต้องการกับผู้บริหารสูงสุด (อทร.): มีการนำแบบสอบถามและการสัมภาษณ์ไปใช้หารือความต้องการ ความคาดหวัง และพันธกิจของงาน IA กับผู้อำนวยการ กทท. (อทร.) และคณะกรรมการตรวจสอบ (AC) อย่างเป็นรูปธรรม เพื่อนำความเห็นมาจัดทำร่างกฎบัตร","การสื่อสารที่ทั่วถึง: มีการแจ้งเวียนกฎบัตรให้ผู้บริหารระดับสูงและทุกฝ่าย/สำนักรับทราบ พร้อมเผยแพร่ผ่านเว็บไซต์, ระบบ Intranet และคลังเอกสารในระบบ OA ของ กทท."],gaps:["ถึงแม้เอกสารกฎบัตรจะระบุบทบาท \"การตรวจสอบเชิงรุกและการให้คำปรึกษาเพื่อสร้างมูลค่าเพิ่ม (Value-Added)\" ไว้อย่างสวยงามตามมาตรฐานใหม่ แต่ กทท. ยังขาดการนำบทบาทเหล่านี้ไปปฏิบัติจนเกิดเป็นผลสัมฤทธิ์ที่เป็น \"รูปธรรมเชิงประจักษ์\" ในสายตาผู้ประเมิน (เช่น การให้คำปรึกษาที่สร้างผลกระทบระดับองค์กร)"],results:["ระดับ 1-2: สายตรวจสอบได้วิเคราะห์ปัจจัยภายใน/ภายนอก และปรับปรุงกฎบัตร/จรรยาบรรณของ IA ให้สอดคล้องกับกฎบัตร AC, ระเบียบ สคร. ปี 2566, เกณฑ์ SE-AM ใหม่ และมาตรฐาน IIA 2024","ระดับ 3: มีหลักฐานการหารือความคาดหวังกับ อทร. อย่างเป็นรูปธรรม กฎบัตรได้รับการอนุมัติจาก AC และบอร์ด กทท. รับทราบเรียบร้อย พร้อมทั้งมีการสื่อสารแจ้งเวียนผ่านระบบขององค์กร","ระดับ 4: ดำเนินการตามบทบาทหน้าที่ในกฎบัตรอย่างครบถ้วน โดยมีการจัดทำ \"ใบสอบทานการปฏิบัติงานตรวจสอบภายใน (Checklist)\" เสนอผู้บังคับบัญชาตามลำดับชั้นเพื่อยืนยันการทำงาน","ระดับ 5: มีการทบทวนและปรับปรุงกฎบัตรอย่างน้อยปีละ 1 ครั้ง โดย กทท. ได้จัดทำและอนุมัติกฎบัตรล่วงหน้าครอบคลุมทั้งปีงบประมาณ 2568 และ 2569 เรียบร้อยแล้ว"],tris:["ในหัวข้อนี้ TRIS ไม่พบ Gap หรือข้อบกพร่องที่รุนแรงเลย ผู้ประเมินระบุใน Feedback Report ว่าหน่วยตรวจสอบภายในมีการกำหนดกฎบัตรและจรรยาบรรณเป็นลายลักษณ์อักษรที่สอดคล้องกับหลักเกณฑ์ครบถ้วน และระบุเพียงข้อเสนอแนะสำหรับการดำเนินการต่อไปว่า \"ให้ทบทวนและปรับปรุงกฎบัตรให้เป็นปัจจุบันอย่างสม่ำเสมอ\" ซึ่งสะท้อนว่า กทท. ผ่านเกณฑ์ด้านระบบเอกสาร (Process) อย่างสมบูรณ์แบบ"],suggest:["รักษาระบบเดิมให้แข็งแกร่ง: ดำเนินการทบทวนกฎบัตรเป็นประจำทุกปีตามที่ สคร. แนะนำ","ยกระดับการเขียนกระดาษคำตอบ: ในปี 69 ไม่ต้องเน้นเขียนเรื่องการแก้เอกสารแล้ว แต่ให้เน้นเขียนอธิบายว่า \"สายตรวจสอบได้นำบทบาทหน้าที่ที่ระบุในกฎบัตรฉบับใหม่ (โดยเฉพาะบทบาทการให้คำปรึกษาเชิงรุก) ไปขับเคลื่อนจนเกิดผลลัพธ์ที่สร้างมูลค่าเพิ่ม (Value-Added) ให้องค์กรได้อย่างไรบ้าง\""],docs:["หลักฐานการหารือกับ อทร. (Interview/Survey Records): แบบฟอร์มสรุปข้อเสนอแนะหรือผลการสัมภาษณ์ อทร. ที่แสดงให้เห็นว่า ผู้บริหารสูงสุดคาดหวังให้ IA ตรวจสอบในประเด็นใดเป็นพิเศษในปีนั้นๆ","หลักฐานการสื่อสาร: บันทึกข้อความแจ้งเวียนกฎบัตร และ Screen Capture หน้าจอ Intranet/OA ที่มีการเผยแพร่กฎบัตรฉบับล่าสุด"],bestprac:["กทท. สามารถดำเนินการได้ดีเทียบเท่าและมีจุดที่เหนือกว่า Best Practice อย่าง รฟม. และ กทพ.","รฟม. โดดเด่นในเรื่องการ \"หารือความต้องการร่วมกับผู้ว่าการฯ เพื่อนำความเห็นมาจัดทำกฎบัตร และสื่อสารให้บุคคลที่เกี่ยวข้องรับทราบ\"","กทพ. โดดเด่นในการ \"กำหนดความเป็นอิสระไว้ในกฎบัตรชัดเจน แผนปฏิบัติงานยืดหยุ่นและทันต่อเทคโนโลยีที่เปลี่ยนไป\""],minReqs:{"1":["เอกสารสรุปการวิเคราะห์ปัจจัยภายใน/ภายนอก (เช่น สภาพแวดล้อมความเสี่ยงองค์กร, การเปลี่ยนแปลงมาตรฐานสากล เช่น GIAS 2024)","กฎบัตรคณะกรรมการตรวจสอบ (AC Charter) ที่นำมาใช้อ้างอิงเป็นข้อมูลประกอบการร่างกฎบัตรและจรรยาบรรณของหน่วยตรวจสอบภายใน"],"2":["กฎบัตรการตรวจสอบภายใน (IA Charter) และ ประมวลจรรยาบรรณ (Code of Ethics) ฉบับประกาศใช้ ที่มีเนื้อหาสอดคล้องกับกฎบัตรคณะกรรมการตรวจสอบ และมีองค์ประกอบหัวข้อครบถ้วนตามที่เกณฑ์/มาตรฐานวิชาชีพกำหนด"],"3":["หลักฐานการหารือ/รับฟังความเห็น (เช่น สรุปประเด็นการหารือ, แบบสอบถาม หรือบันทึกการสัมภาษณ์) ระหว่างหัวหน้าหน่วยตรวจสอบภายใน กับ ผู้บริหารสูงสุด (อทร.) เกี่ยวกับความคาดหวังและพันธกิจของงาน IA","วาระและรายงานการประชุมคณะกรรมการตรวจสอบ (AC) และ/หรือ คณะกรรมการรัฐวิสาหกิจ (Board) ที่มีมติ \"อนุมัติ\" กฎบัตรการตรวจสอบภายใน","หลักฐานการสื่อสาร/แจ้งเวียนกฎบัตรให้บุคลากรที่เกี่ยวข้องรับทราบ (เช่น บันทึกข้อความแจ้งเวียน, ภาพหน้าจอระบบ Intranet, ระบบสารบรรณอิเล็กทรอนิกส์ OA)"],"4":["รายงานประจำปีของหน่วยตรวจสอบภายใน หรือ เอกสารสรุปผลการปฏิบัติงาน (เช่น ใบสอบทานการปฏิบัติงาน) ที่แสดงหลักฐานเชิงประจักษ์ว่า หน่วยตรวจสอบภายในได้ปฏิบัติงานครอบคลุมตามอำนาจหน้าที่ที่ระบุไว้ในกฎบัตรอย่างครบถ้วน (เช่น การเข้าตรวจ Enablers, การให้คำปรึกษา)"],"5":["บันทึกข้อความหรือเอกสารสรุปประเด็นการทบทวนกฎบัตรประจำปี (เปรียบเทียบ As-is กับ To-be) ที่ชี้ให้เห็นว่ามีการนำปัจจัยใหม่ๆ หรือมาตรฐานใหม่มาปรับปรุงกฎบัตรให้ทันสมัย","รายงานการประชุมคณะกรรมการตรวจสอบ (AC) ที่มีมติอนุมัติกฎบัตรฉบับทบทวน (ต้องมีหลักฐานว่าทำอย่างน้อยปีละ 1 ครั้ง)"]},subComps:{"1":["ความครบถ้วนขององค์ประกอบบังคับในกฎบัตร IA (เกี่ยวข้องกับระดับ 2): กฎบัตรจะถูกประเมินว่า \"ครบถ้วน\" ก็ต่อเมื่อมีหัวข้อบังคับอย่างน้อย 7 ประเด็น ดังนี้ 1. พันธกิจ และวัตถุประสงค์การตรวจสอบ 2. อำนาจ และภาระหน้าที่ (ต้องระบุครอบคลุมถึง \"การป้องกันทุจริตคอร์รัปชัน\" และ \"การสอบทาน Enablers 7 ด้าน\") 3. สถานะของหน่วยตรวจสอบภายใน 4. ลักษณะความสัมพันธ์ในการรายงาน/ประสานงาน (กับ AC, ฝ่ายบริหาร, ผู้สอบบัญชี, หน่วยงานกำกับดูแล) 5. อำนาจในการเข้าถึงข้อมูล บุคลากร และทรัพย์สินที่จับต้องได้ (รวมถึงบริษัทในเครือ/ร่วม ถ้ามี) 6. มาตรฐานการปฏิบัติงาน 7. ประมวลจรรยาบรรณที่ผู้ตรวจสอบภายในควรถือปฏิบัติ","การอัปเดตตามมาตรฐานสากลใหม่ : การวิเคราะห์และทบทวนกฎบัตร ต้องสะท้อนการปรับตัวให้ทันกับมาตรฐานวิชาชีพใหม่ๆ (เช่น การอัปเดตให้สอดคล้องกับ มาตรฐานการตรวจสอบภายในสากลฉบับใหม่ Global Internal Audit Standards: GIAS 2024 ที่เริ่มบังคับใช้) หากกฎบัตรไม่มีการปรับปรุงให้ทันมาตรฐานใหม่ อาจถูกมองว่าการทบทวนขาดประสิทธิภาพ"],"3":["กระบวนการหารือเชิงรุกกับผู้บริหารสูงสุด (Consultation) : เกณฑ์ซ่อนความคาดหวังว่า IA ต้องไม่ร่างกฎบัตรเองฝ่ายเดียวแล้วส่งให้ผู้บริหารเซ็น แต่ต้องมีกระบวนการ \"เข้าไปหารือ (Consult/Interview/Survey)\" เพื่อสอบถาม \"ความต้องการและความคาดหวัง (Expectation)\" ของผู้บริหารสูงสุด (อทร.) เพื่อให้งานตรวจสอบตอบโจทย์ทิศทางธุรกิจอย่างแท้จริง"],"5":["การอัปเดตตามมาตรฐานสากลใหม่ : การวิเคราะห์และทบทวนกฎบัตร ต้องสะท้อนการปรับตัวให้ทันกับมาตรฐานวิชาชีพใหม่ๆ (เช่น การอัปเดตให้สอดคล้องกับ มาตรฐานการตรวจสอบภายในสากลฉบับใหม่ Global Internal Audit Standards: GIAS 2024 ที่เริ่มบังคับใช้) หากกฎบัตรไม่มีการปรับปรุงให้ทันมาตรฐานใหม่ อาจถูกมองว่าการทบทวนขาดประสิทธิภาพ"]}},
  {id:"2.2",grp:"2",gname:"หน่วยตรวจสอบภายใน",gw:15.0,gs68:3.0944,name:"ความเป็นอิสระและความเที่ยงธรรม",w:3.0,s68:4.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินการจัดโครงสร้างองค์กรให้หน่วยตรวจสอบภายในมีความเป็นอิสระอย่างแท้จริง ทั้งในแง่ของสายการบังคับบัญชา (ต้องรายงานตรงต่อคณะกรรมการตรวจสอบ) สถานะเทียบเท่าผู้บริหารระดับสูง การกำหนดและปฏิบัติตามนโยบายความขัดแย้งทางผลประโยชน์ (COI) อย่างเคร่งครัด การสับเปลี่ยนหมุนเวียนผู้ตรวจสอบเพื่อป้องกันความคุ้นเคยที่อาจลดความเที่ยงธรรม การประเมินความเพียงพอของทรัพยากร/อัตรากำลังคนตามเกณฑ์ขั้นต่ำ รวมไปถึงการได้รับการยอมรับในความอิสระจากทุกภาคส่วน และกระบวนการยืนยันสถานะความเป็นอิสระต่อ AC อย่างสม่ำเสมอเป็นประจำทุกปี","การกำหนดโครงสร้างหน่วยตรวจสอบภายในที่มีความเป็นอิสระ","การกำหนดนโยบายเกี่ยวกับการเปิดเผยหรือการดำเนินการเพื่อป้องกันหรือหลีกเลี่ยงผลกระทบที่มีต่อความเป็นอิสระหรือเที่ยงธรรม รวมถึงความขัดแย้งทางผลประโยชน์ของผู้ตรวจสอบภายในที่อาจเกิดขึ้น","การดำเนินการตามนโยบายเกี่ยวกับการเปิดเผยหรือการดำเนินการเพื่อป้องกันหรือหลีกเลี่ยงผลกระทบที่มีต่อความเป็นอิสระหรือเที่ยงธรรม รวมถึงความขัดแย้งทางผลประโยชน์ของผู้ตรวจสอบภายในที่อาจเกิดขึ้น","หน่วยงานตรวจสอบภายในได้รับการจัดสรรทรัพยากรอย่างเพียงพอสอดคล้องกับแผนการจัดสรรทรัพยากร หน่วยงานตรวจสอบภายในสามารถเข้าพบและเข้าร่วมเกี่ยวกับการตรวจสอบได้อย่างเป็นอิสระ และได้รับการยอมรับเกี่ยวกับความเป็นอิสระจากฝ่ายบริหารและหน่วยรับตรวจ","การทบทวนและยืนยันถึงความเป็นอิสระต่อคณะกรรมการตรวจสอบอย่างน้อยปีละครั้ง"],good:["การจัดการปัญหาเรื่อง Conflict of Interest (COI) อย่างเด็ดขาด: กทท. ปิด Gap ปี 67 ได้สำเร็จ โดยประกาศใช้แนวทางปฏิบัติการรายงานความขัดแย้งทางผลประโยชน์ที่เข้มงวด และมีการเปิดเผย COI ใน 3 วาระสำคัญ คือ 1) ประจำปี 2) เมื่อรับตำแหน่งใหม่ (ภายใน 1 เดือน) และ 3) ทุกครั้งก่อนเริ่มลงพื้นที่ตรวจสอบแต่ละโครงการ","การสับเปลี่ยนผู้ตรวจสอบ (Rotation): มีการสับเปลี่ยนผู้ตรวจสอบภายในทุกๆ 3-5 ปี อย่างเคร่งครัดเพื่อรักษาความเป็นอิสระและความเที่ยงธรรมในการปฏิบัติงาน","การจัดสรรทรัพยากรได้สูงกว่าเกณฑ์: แม้จะมีอุปสรรคเรื่องอัตรากำลัง แต่สายตรวจสอบได้รับการบรรจุคนเข้าทำงานจริง 32 อัตรา จากกรอบ 43 อัตรา (คิดเป็นร้อยละ 74.42) ซึ่งสูงกว่าเกณฑ์ขั้นต่ำของ TRIS ที่กำหนดไว้ที่ร้อยละ 70"],gaps:["การสำรวจการรับรู้ (Perception Survey) อย่างต่อเนื่อง: กทท. เพิ่งเริ่มใช้แบบสอบถามเพื่อประเมินการยอมรับด้านความเป็นอิสระจากหน่วยรับตรวจ แต่ยังขาดกระบวนการสำรวจที่ต่อเนื่องและเป็นระบบในระยะยาว (Continuous Survey) เพื่อนำข้อมูลมาวิเคราะห์หาระดับความเชื่อมั่น"],results:["ระดับ 1: โครงสร้างสายตรวจสอบรายงานขึ้นตรงต่อคณะกรรมการตรวจสอบ (AC) และการพิจารณาความดีความชอบ โยกย้าย เลื่อนตำแหน่ง ของหัวหน้าหน่วยตรวจสอบและผู้อำนวยการฝ่าย ต้องได้รับความเห็นชอบจาก AC ก่อน","ระดับ 2: ประกาศใช้แนวทางปฏิบัติการรายงานความขัดแย้งทางผลประโยชน์ (COI) ของสายตรวจสอบอย่างเป็นทางการในปี 2568","ระดับ 3: ดำเนินการเปิดเผย COI จริงในทุกระดับ ทั้งการรายงานประจำปี, เมื่อมีผู้บริหารรับตำแหน่งใหม่ (นำเสนอ AC เพื่อทราบ) และผู้ตรวจสอบเปิดเผย COI ทุกครั้งก่อนเริ่มงานตรวจสอบตามแผน","ระดับ 4: มีอัตรากำลังปฏิบัติงานจริงร้อยละ 74.42 (เกินเกณฑ์ร้อยละ 70) และได้รับการยอมรับเรื่องความเป็นอิสระจาก AC, อทร., ผู้บริหาร และหน่วยรับตรวจ ผ่านการประเมินจากแบบสอบถาม","ระดับ 5: มีการทบทวนและทำบันทึกยืนยันถึงความเป็นอิสระ (Confirmation of Independence) ต่อคณะกรรมการตรวจสอบอย่างน้อยปีละ 1 ครั้ง โดยในปี 68 เสนอผ่านการประชุม AC ครั้งที่ 11/2568"],tris:["ในหัวข้อนี้ TRIS ให้สถานะ \"ปิด Gap ได้ (Closed)\" เนื่องจาก กทท. สามารถดำเนินการเรื่องการจัดทำนโยบายเปิดเผยความขัดแย้งทางผลประโยชน์ (COI) และการสับเปลี่ยนผู้ตรวจสอบได้อย่างเป็นรูปธรรม อย่างไรก็ตาม TRIS ได้ให้ข้อเสนอแนะเพิ่มเติมสำหรับการรักษาระดับคะแนนว่า กทท. ต้อง \"ประเมินและสำรวจการรับรู้ด้านความเป็นอิสระจากหน่วยรับตรวจอย่างต่อเนื่อง\""],suggest:["ยกระดับแบบประเมินการรับรู้ (Perception Survey): พัฒนาแบบสอบถามหน่วยรับตรวจภายหลังการเข้าตรวจสอบ โดยเพิ่มหัวข้อที่ถามถึง \"การรับรู้เรื่องความเป็นอิสระและความเที่ยงธรรมของทีมตรวจสอบ\" อย่างเจาะจง และนำคะแนนส่วนนี้มาทำสรุป (Dashboard) วิเคราะห์ความเชื่อมั่นรายปี","แผนรองรับกรณีบอร์ดว่างเว้น: ในปี 68 การรายงาน COI ประจำปีสะดุดล่าช้าไปถึงเดือน พ.ย. เนื่องจากบอร์ด กทท. ลาออกและองค์ประกอบ AC ไม่ครบ ในปี 69 ควรระบุในคู่มือว่า หาก AC ว่างเว้น ให้สายตรวจสอบรายงานยืนยันความเป็นอิสระต่อ อทร. ไปพลางก่อนเพื่อรักษา Timeline"],docs:["รายงานผลการสำรวจการรับรู้ความเป็นอิสระ (Perception of Independence Survey Report): สรุปผลการประเมินจากหน่วยรับตรวจและฝ่ายบริหาร ที่ชี้ให้เห็นว่าองค์กรมีความเชื่อมั่นต่อความเป็นอิสระของสายตรวจสอบ กทท.","หลักฐานการเปิดเผย COI 3 วาระ: แนบตัวอย่างเอกสารใบรายงาน COI ก่อนเริ่มตรวจสอบของโครงการที่เป็น Highlight ของปี 69 ควบคู่กับรายงาน COI ประจำปีที่รายงานต่อ AC ได้ตรงเวลา"],bestprac:["ทั้ง กทพ., รฟม. และ กทท. ทำผลงานได้ดีในระดับที่ใกล้เคียงกัน คือสอบผ่านการสร้างโครงสร้างอิสระและการรายงาน COI ตามมาตรฐานสากล","กทพ. (Best Practice): ได้คะแนนสูงสุดในหมวดนี้ (4.3667) มีจุดเด่นคือ มีการกำหนดความเป็นอิสระไว้ในกฎบัตรอย่างชัดเจนมาก และมีแผนการปฏิบัติงานที่ \"ยืดหยุ่น (Agile) และทันต่อเทคโนโลยีที่เปลี่ยนไป\" รวมถึงมีการทบทวนยืนยันความเป็นอิสระต่อ AC เรียบร้อยสมบูรณ์","รฟม.: โครงสร้างมีความเป็นอิสระ มีการกำหนดนโยบายและดำเนินการเปิดเผยความขัดแย้งทางผลประโยชน์ครบถ้วน"],minReqs:{"1":["แผนผังโครงสร้างองค์กร (Organization Chart) ที่แสดงให้เห็นชัดเจนว่าหัวหน้าหน่วยตรวจสอบภายใน (IA) รายงานขึ้นตรงต่อคณะกรรมการตรวจสอบ (AC)","กฎบัตรหรือคู่มือปฏิบัติงานที่ระบุสถานะความเป็นอิสระ สายการบังคับบัญชา และอำนาจในการเข้าถึงข้อมูล"],"2":["เอกสารนโยบาย/แนวทางปฏิบัติการรายงานความขัดแย้งทางผลประโยชน์ (Conflict of Interest: COI) ของหน่วยตรวจสอบภายใน","เอกสารนโยบายการสับเปลี่ยนหมุนเวียนผู้ตรวจสอบ (Job Rotation) ประจำโครงการ/หน่วยรับตรวจ (ทุก 3-5 ปี)"],"3":["หลักฐานหรือแบบฟอร์มการเปิดเผยและรายงานความขัดแย้งทางผลประโยชน์ (COI) ของผู้ตรวจสอบภายในทั้ง 3 วาระ ได้แก่ 1) ประจำปี 2) เมื่อรับตำแหน่งใหม่ และ 3) ก่อนเริ่มงานตรวจสอบในแต่ละโครงการ","รายงานการประชุม AC ที่รับทราบผลการรายงาน COI","คำสั่งมอบหมายงานที่แสดงให้เห็นถึงการสับเปลี่ยนหมุนเวียนผู้ตรวจสอบตามนโยบาย"],"4":["เอกสารแผนและผลการจัดสรรอัตรากำลัง (Manpower Plan) ของสายตรวจสอบ ที่พิสูจน์ตัวเลขเชิงประจักษ์ว่ามีบุคลากรปฏิบัติงานจริง \"ไม่น้อยกว่าร้อยละ 70 ของกรอบอัตรากำลัง\"","รายงานสรุปผลการสำรวจ/แบบสอบถามการรับรู้และการยอมรับถึงความเป็นอิสระของหน่วยตรวจสอบภายใน (ประเมินโดยฝ่ายบริหารและหน่วยรับตรวจ)"],"5":["บันทึกข้อความ หรือรายงานการประชุมคณะกรรมการตรวจสอบ (AC) ที่ระบุวาระการพิจารณาทบทวนและ \"ยืนยันความเป็นอิสระ\" ของหน่วยตรวจสอบภายใน (ดำเนินการอย่างน้อยปีละ 1 ครั้ง)"]},subComps:{"1":["สถานภาพของหัวหน้า IA : หัวหน้าหน่วยตรวจสอบภายในต้องมีสถานภาพ \"อย่างน้อยเทียบเท่ากับผู้บริหารของรัฐวิสาหกิจ\" หรือหัวหน้าหน่วยงานสำคัญอื่น ๆ (เช่น ของ กทท. คือระดับผู้ช่วยผู้อำนวยการ) และสายการรายงานผลต้อง \"ขึ้นตรง\" ต่อคณะกรรมการตรวจสอบ (AC) และสำเนาถึงผู้บริหารสูงสุด (อทร.) รับทราบ"],"2":["ข้อห้ามการตรวจสอบงานตนเอง : ผู้ตรวจสอบต้องไม่ตรวจสอบงานที่ตนเคยทำหน้าที่บริหารหรือปฏิบัติงาน ภายในระยะเวลา \"1 ปี\" ก่อนการตรวจสอบ และต้องไม่เป็นกรรมการใด ๆ ในรัฐวิสาหกิจที่จะส่งผลกระทบต่อความอิสระในการให้ความเห็น","กฎเหล็กเรื่อง Job Rotation : เกณฑ์ซ่อนข้อบังคับว่า หน่วยตรวจสอบภายในต้องกำหนดนโยบายและดำเนินการ \"สับเปลี่ยนผู้ตรวจสอบ (Job Rotation)\" อย่างสม่ำเสมอ โดยทั่วไปอย่างน้อยทุก \"3 - 5 ปี\" เพื่อให้เกิดความเป็นอิสระและความเที่ยงธรรม ไม่สนิทสนมกับหน่วยรับตรวจจนเกินไป","การจัดการบุคคลภายนอก/Outsource : หากมีการจ้างที่ปรึกษาหรือบุคคลภายนอก (Outsource) เข้ามาปฏิบัติหน้าที่ IA พร้อมกับให้บริการอื่นแก่รัฐวิสาหกิจด้วย คณะกรรมการตรวจสอบต้องให้บุคคลภายนอกนั้น \"เปิดเผยรายละเอียดการปฏิบัติงานเป็นลายลักษณ์อักษร\" เพื่อยืนยันว่าไม่มีความขัดแย้งทางผลประโยชน์"],"3":["ข้อห้ามการตรวจสอบงานตนเอง : ผู้ตรวจสอบต้องไม่ตรวจสอบงานที่ตนเคยทำหน้าที่บริหารหรือปฏิบัติงาน ภายในระยะเวลา \"1 ปี\" ก่อนการตรวจสอบ และต้องไม่เป็นกรรมการใด ๆ ในรัฐวิสาหกิจที่จะส่งผลกระทบต่อความอิสระในการให้ความเห็น","กฎเหล็กเรื่อง Job Rotation : เกณฑ์ซ่อนข้อบังคับว่า หน่วยตรวจสอบภายในต้องกำหนดนโยบายและดำเนินการ \"สับเปลี่ยนผู้ตรวจสอบ (Job Rotation)\" อย่างสม่ำเสมอ โดยทั่วไปอย่างน้อยทุก \"3 - 5 ปี\" เพื่อให้เกิดความเป็นอิสระและความเที่ยงธรรม ไม่สนิทสนมกับหน่วยรับตรวจจนเกินไป","การจัดการบุคคลภายนอก/Outsource : หากมีการจ้างที่ปรึกษาหรือบุคคลภายนอก (Outsource) เข้ามาปฏิบัติหน้าที่ IA พร้อมกับให้บริการอื่นแก่รัฐวิสาหกิจด้วย คณะกรรมการตรวจสอบต้องให้บุคคลภายนอกนั้น \"เปิดเผยรายละเอียดการปฏิบัติงานเป็นลายลักษณ์อักษร\" เพื่อยืนยันว่าไม่มีความขัดแย้งทางผลประโยชน์"],"4":["ตัวเลขบังคับขั้นต่ำของอัตรากำลัง : การที่จะพิจารณาว่าได้รับการจัดสรรทรัพยากรอย่าง \"เพียงพอ\" นั้น เกณฑ์กำหนดตัวเลขเชิงประจักษ์ไว้ว่า รัฐวิสาหกิจต้องสรรหาบุคลากรเข้าหน่วยตรวจสอบภายในให้ได้ \"ไม่น้อยกว่าร้อยละ 70\" ของกรอบอัตรากำลังที่กำหนด (หากต่ำกว่านี้ จะสอบตกระดับ 4 ทันที ซึ่งของ กทท. ทำได้ 74.42% จึงผ่านเกณฑ์ข้อนี้)"]}},
  {id:"2.3",grp:"2",gname:"หน่วยตรวจสอบภายใน",gw:15.0,gs68:3.0944,name:"ความเชี่ยวชาญและความสามารถ",w:5.0,s68:2.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินการบริหารจัดการทรัพยากรบุคคลของสายตรวจสอบภายใน ตั้งแต่การวิเคราะห์ทักษะที่จำเป็นและประเมินช่องว่างสมรรถนะ (Competency Gap) เพื่อนำไปจัดทำแผนพัฒนารายบุคคล (IDP) การจัดกระบวนการสรรหา พัฒนา (อบรมไม่น้อยกว่า 40 ชม./คน/ปี ครอบคลุมทั้ง Technical & Soft Skills) และแนวทางการรักษาบุคลากรคนเก่ง (Retention) รวมถึงความสำเร็จในการผลักดันให้บุคลากรได้รับวุฒิบัตรวิชาชีพระดับสากล/ระดับประเทศให้ได้ตามสัดส่วนบังคับ (40%) ตลอดจนการประเมินคุณสมบัติหัวหน้าหน่วยตรวจสอบ และการทบทวนปรับปรุงทักษะให้ทันต่อการเปลี่ยนแปลงอย่างสม่ำเสมอ","การวิเคราะห์ทักษะ ความรู้ และความสามารถอื่นๆ ที่จำเป็นในการปฏิบัติงานตรวจสอบ รวมทั้งประเด็นที่เกิดขึ้นใหม่ๆ","การวิเคราะห์ทักษะ ความรู้ ความสามารถ และการพัฒนาผู้ตรวจสอบภายใน สอดคล้องกับการวิเคราะห์สมรรถนะหลัก สมรรถนะรายตำแหน่งที่จำเป็นต่อการดำเนินธุรกิจทั้งในปัจจุบันและในอนาคต รวมถึงการประเมินช่องว่างสมรรถนะ (Competency Gap) เพื่อนำไปประกอบการวางแผนพัฒนารายบุคคล (Individual Development Plan: IDP) ของผู้ตรวจสอบ","กำหนดแนวทาง/แผนการสรรหา การพัฒนา และรักษาบุคลากรด้านการตรวจสอบภายในที่มีความรู้ความสามารถที่จำเป็นในการปฏิบัติงานตรวจสอบ พร้อมทั้งดำเนินงานครบถ้วน มีการพัฒนาบุคลากรด้านการตรวจสอบภายในให้มีความรู้ความสามารถครบถ้วนตามทักษะที่กำหนด ทั้ง Technical Skills และ Soft Skills","การสนับสนุนเพื่อให้ผู้ตรวจสอบภายในพัฒนาตนเองในการเป็น Certified Internal Auditor (CIA) หรือประกาศนียบัตรทางวิชาชีพอื่นที่เกี่ยวข้อง โดยหน่วยตรวจสอบภายในมีผู้ตรวจสอบได้รับประกาศนียบัตรทางวิชาชีพร้อยละ 40 ของจำนวนผู้ตรวจสอบภายในทั้งหมด อีกทั้งหัวหน้าหน่วยตรวจสอบภายในมีความรู้และความสามารถเกี่ยวกับการปฏิบัติงานตรวจสอบ และมีความรู้เกี่ยวกับองค์กรเป็นอย่างดี","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวนทักษะ ความรู้ และความสามารถอื่นๆ ที่จำเป็นของหน่วยตรวจสอบภายใน อย่างสม่ำเสมอ"],good:["การประเมินทักษะและการทำแผนพัฒนารายบุคคล: มีการประเมินช่องว่างสมรรถนะ (Competency Gap) และนำผลไปจัดทำแผนพัฒนารายบุคคล (IDP) ให้กับผู้ตรวจสอบภายในอย่างชัดเจน","การสนับสนุนชั่วโมงการอบรม: มีการสนับสนุนและผลักดันให้ผู้ตรวจสอบภายในได้รับการอบรมผ่านแพลตฟอร์ม Future Skill โดยสามารถทำได้ตามเกณฑ์มาตรฐาน คือ 40 ชั่วโมง/คน/ปี","การตั้งเป้าหมายเชิงรุก: เริ่มมีการกำหนดเป้าหมายเพื่อผลักดันให้ผู้ตรวจสอบภายในสอบผ่านวุฒิบัตรวิชาชีพ (CPIAT/CIA) จำนวน 3 คน/ปี"],gaps:["สัดส่วนผู้สอบผ่านวุฒิบัตรสากล (CIA) ต่ำกว่าเกณฑ์: ปัจจุบัน กทท. มีผู้สอบผ่าน CIA เพียง 1 คน จากจำนวนผู้ตรวจสอบทั้งหมด 27 คน ซึ่งห่างไกลจากเกณฑ์ระดับ 4 ของ TRIS ที่กำหนดไว้ว่าต้องมีผู้ได้รับประกาศนียบัตรวิชาชีพร้อยละ 40 ของบุคลากรทั้งหมด","ขาดกลไกและนโยบายรักษาบุคลากร (Retention Policy): กทท. ยังขาดการสนับสนุนอย่างเป็นรูปธรรม โดยเฉพาะ \"นโยบายค่าตอบแทนวิชาชีพ\" หรือ \"สวัสดิการจูงใจ\" เพื่อรักษาผู้ตรวจสอบที่เก่งหรือได้วุฒิบัตรให้อยู่กับองค์กร"],results:["ระดับ 1: วิเคราะห์ทักษะ ความรู้ และความสามารถอื่นๆ ที่จำเป็นต่อการปฏิบัติงานตรวจสอบ","ระดับ 2: ประเมิน Competency Gap เพื่อนำไปประกอบการวางแผนพัฒนารายบุคคล (IDP)","ระดับ 3 (ไม่ผ่านสมบูรณ์): แม้ กทท. จะมีแผนสรรหาและพัฒนาบุคลากร แต่ TRIS มองว่า \"แผนการรักษาบุคลากร (Retention Plan)\" ยังไม่แข็งแกร่งและไม่เป็นรูปธรรม","ระดับ 4 (ตกเกณฑ์): เกณฑ์ระบุว่าต้องมีผู้สอบผ่าน CIA หรือประกาศนียบัตรที่เกี่ยวข้อง ร้อยละ 40 ของผู้ตรวจสอบทั้งหมด แต่ กทท. มีสัดส่วนไม่ถึงเกณฑ์ (มีเพียง 1 คน)","ระดับ 5: (ยังไม่สามารถพิจารณาได้เนื่องจากไม่ผ่านระดับก่อนหน้า)"],tris:["TRIS ประเมินสถานะ Gap ในข้อนี้ของ กทท. ว่า \"มีความเสี่ยง\" และสถานะ \"คงเดิม\" จากปี 2567 โดยระบุชัดเจนว่า ผู้ตรวจสอบที่ได้รับวุฒิบัตรสากล (CIA) ยังมีจำนวนน้อยมาก องค์กรขาดการสนับสนุนให้บุคลากรได้รับวุฒิบัตรวิชาชีพ และขาดแนวทางรักษาบุคลากรที่เก่งให้อยู่กับองค์กร"],suggest:["บูรณาการกับสายงานทรัพยากรบุคคล (HCM) ทันที: สายตรวจสอบต้องทำงานร่วมกับ HCM เพื่อศึกษาและจัดทำ \"นโยบายค่าตอบแทนวิชาชีพ (Incentive)\" สำหรับผู้ที่สอบผ่าน CIA หรือ CPIAT อย่างเป็นรูป","กำหนดแผนที่นำทาง (Roadmap) การสอบ CIA: จัดทำแผนยกระดับพนักงาน โดยระบุชื่อพนักงานเป้าหมาย (Target) ที่จะส่งสอบ CIA/CPIAT ในแต่ละปีให้ชัดเจน และติดตามผลอย่างใกล้ชิด"],docs:["เอกสารนโยบาย/หลักเกณฑ์ค่าตอบแทนวิชาชีพ: ประกาศ หรือบันทึกข้อความเกี่ยวกับการให้ค่าตอบแทนวิชาชีพ หรือสวัสดิการจูงใจสำหรับผู้ที่ได้รับวุฒิบัตรวิชาชีพตรวจสอบภายใน ที่ได้รับการอนุมัติแล้ว","แผนพัฒนารายบุคคล (IDP) เชิงลึก: ที่ไม่เพียงแต่ระบุชั่วโมงอบรม 40 ชม./คน/ปี แต่ต้องมี \"รายชื่อผู้เข้าสอบ/ผู้เตรียมตัวสอบ CIA หรือ CPIAT\" แนบไปเป็นหลักฐานเชิงประจักษ์"],bestprac:["ทั้ง รฟม. และ กทพ. ต่างก็เผชิญปัญหาเรื่องสัดส่วนคนสอบผ่านใบประกอบวิชาชีพ (CIA) ไม่ถึง 40% ตามเกณฑ์ระดับ 4 เช่นเดียวกัน แต่สิ่งที่ทำให้คู่เทียบได้คะแนนในหมวดโครงสร้าง IA ภาพรวมสูงกว่า กทท. คือ \"กระบวนการและระบบแรงจูงใจ (Retention & Incentive)\"","Best Practice ที่ กทท. ควรเรียนรู้: แม้สัดส่วนคนได้ CIA จะน้อย แต่ รฟม. มี \"แผนสรรหา พัฒนา และรักษาบุคลากรที่ครอบคลุมทั้ง Technical & Soft Skills และมีระบบแรงจูงใจที่ชัดเจน\" ซึ่งตอบโจทย์เกณฑ์ SE-AM ระดับ 3 ได้อย่างสมบูรณ์แบบ","กทพ. ทำได้ดีกว่า รฟม. และ กทท. ในแง่ของจำนวนคน โดยมีผู้ตรวจสอบภายในได้รับประกาศนียบัตรทางวิชาชีพสูงถึง ร้อยละ 36 (ใกล้เคียงเกณฑ์ร้อยละ 40 มากที่สุด)"],minReqs:{"1":["เอกสารการวิเคราะห์ทักษะ ความรู้ และความสามารถที่จำเป็นต่อการปฏิบัติงานตรวจสอบ (ครอบคลุมทักษะพื้นฐานและประเด็นที่เกิดขึ้นใหม่ๆ เช่น ทักษะด้าน IT หรือ ESG)"],"2":["เอกสารการประเมินช่องว่างสมรรถนะ (Competency Gap) ของผู้ตรวจสอบภายในทุกคน","แผนพัฒนารายบุคคล (Individual Development Plan: IDP) ที่เชื่อมโยงกับสมรรถนะหลักและสมรรถนะรายตำแหน่ง เพื่อรองรับการดำเนินธุรกิจทั้งปัจจุบันและอนาคต"],"3":["เอกสารแผนการสรรหา แผนการพัฒนา และแผนรักษาบุคลากร (Retention Plan) ด้านการตรวจสอบภายใน","หลักฐานการจัดอบรม/พัฒนาบุคลากร ทั้งด้าน Technical Skills และ Soft Skills ที่สอดคล้องกับแผน IDP","หลักฐานยืนยันชั่วโมงการอบรมวิชาชีพตรวจสอบ ไม่น้อยกว่า 40 ชั่วโมง/คน/ปี"],"4":["หลักฐานเชิงประจักษ์การสนับสนุนให้สอบวุฒิบัตรวิชาชีพ (เช่น นโยบายส่งเสริม, งบประมาณสนับสนุน)","สำเนาวุฒิบัตรวิชาชีพของผู้ตรวจสอบ (เช่น CIA, CPIAT) พร้อมตารางสรุปสัดส่วนยืนยันว่ามีผู้ได้รับวุฒิบัตร ไม่น้อยกว่าร้อยละ 40 ของผู้ตรวจสอบภายในทั้งหมด"],"5":["ประวัติการทำงาน/วุฒิการศึกษา ของหัวหน้าหน่วยตรวจสอบภายใน ที่พิสูจน์ถึงความรู้ความเข้าใจในธุรกิจและการตรวจสอบ","รายงานผลการดำเนินงาน หรือบันทึกข้อความที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จากรอบปีที่ผ่านมา มาพิจารณาทบทวนและปรับปรุงทักษะ ความรู้ ความสามารถที่จำเป็นของหน่วยตรวจสอบภายในให้ทันสมัย"]},subComps:{"3":["ข้อบังคับชั่วโมงการฝึกอบรม เกณฑ์ระบุชัดเจนว่าผู้ตรวจสอบภายในต้องได้รับการพัฒนา/ฝึกอบรมทางวิชาชีพตรวจสอบ \"ไม่น้อยกว่า 40 ชั่วโมง ต่อคน ต่อปี\" และหลักสูตรต้องสอดคล้องกับช่องว่างจากการประเมินสมรรถนะ (Gap) รวมทั้งจัดโดยองค์กรทางวิชาชีพที่ได้รับการยอมรับ","นโยบายการรักษาบุคลากร (Retention) : นอกจากการหาคนและการพัฒนาแล้ว องค์กรต้องมีกลไกหรือแผนในการรักษา (Retain) ผู้ตรวจสอบที่มีผลงานดีหรือได้รับวุฒิบัตรให้อยู่กับองค์กร (ซึ่งมักซ่อนความหมายถึงการให้ค่าตอบแทนวิชาชีพ หรือสวัสดิการสร้างแรงจูงใจ)","ความครอบคลุมของทักษะการตรวจสอบ : ทักษะที่นำมาวิเคราะห์และพัฒนา ต้องครอบคลุมไม่เพียงแค่บัญชีหรือการเงิน แต่ต้องมีทักษะสมัยใหม่ เช่น การตรวจสอบระบบสารสนเทศ (IT Audit), ความปลอดภัยทางไซเบอร์, และมนุษยสัมพันธ์หรือการติดต่อสื่อสาร (Soft Skills)"],"4":["สัดส่วนบังคับของผู้ได้รับวุฒิบัตรวิชาชีพ : การจะผ่านระดับ 4 ได้ หน่วยตรวจสอบภายในต้องมีผู้ได้รับประกาศนียบัตรทางวิชาชีพ (เช่น CIA, CPIAT, CPA, CISA, CFE ฯลฯ) \"ไม่น้อยกว่าร้อยละ 40\" ของจำนวนผู้ตรวจสอบทั้งหมด (ข้อนี้เป็นจุดตัดสำคัญที่หลายองค์กรมักตกเกณฑ์หากจำนวนคนสอบผ่านมีน้อย)","คุณสมบัติเฉพาะของหัวหน้าหน่วยตรวจสอบภายใน : หัวหน้า IA ต้องถูกประเมินว่ามีทักษะระดับผู้บริหาร เช่น ความสามารถในการสื่อสารระดับ C-suite, การคิดวิเคราะห์เชิงยุทธศาสตร์, มีมุมมองภาพรวมองค์กร, และมีความรู้ด้าน IT/Cyber Security/PDPA"]}},
  {id:"2.4",grp:"2",gname:"หน่วยตรวจสอบภายใน",gw:15.0,gs68:3.0944,name:"การประเมินและปรับปรุงคุณภาพงานตรวจสอบภายใน",w:4.0,s68:3.104,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินความสมบูรณ์ของระบบ \"การประกันและปรับปรุงคุณภาพงานตรวจสอบภายใน (Quality Assurance and Improvement Program: QAIP)\" โดยครอบคลุมตั้งแต่ การกำหนดแนวทางการประเมินจากภายใน (ประเมินโดยหน่วยรับตรวจหลังจบงาน, ประเมินตนเอง, SAR รายไตรมาส/รายปี) และการประเมินจากภายนอก (ทุก 3-5 ปี) การนำผลประเมินจากหน่วยรับตรวจไปผูกกับระบบประเมินผลงาน (KPI) ของผู้ตรวจสอบ ไปจนถึงการจัดทำ \"แผนปรับปรุง (Action Plan)\" จากข้อเสนอแนะของผู้ประเมินภายนอก และต้องมีการติดตามรายงานความคืบหน้าแผนปรับปรุงนั้นต่อคณะกรรมการตรวจสอบ (AC) อย่างเป็นระบบ เพื่อยกระดับมาตรฐานการปฏิบัติงานอย่างต่อเนื่อง","การกำหนดแนวทางการสอบทานคุณภาพของงานตรวจสอบภายในทั้งการประเมินภายในองค์กร และภายนอกองค์กร","การกำหนดแนวทางในการนำผลการปฏิบัติงานของผู้ตรวจสอบภายในโดยหน่วยรับตรวจมาประกอบการพิจารณาวัดผลงานของผู้ตรวจสอบภายใน","การดำเนินการสอบทานคุณภาพของงานตรวจสอบตามแนวทางที่กำหนดอย่างครบถ้วนทั้งภายในองค์กรและภายนอกองค์กร พร้อมทั้งรายงานผลการดำเนินงานให้คณะกรรมการตรวจสอบพิจารณา และการจัดทำแผนปรับปรุงจากผลการประเมินคุณภาพของงานตรวจสอบ (รอบถัดไป) รวมถึงการดำเนินการตามแผนปรับปรุงฯ (รอบก่อนหน้า)","การรายงานผลการดำเนินงานตามแผนปรับปรุงต่อคณะกรรมการตรวจสอบเพื่อพิจารณา หรือผู้บริหารสูงสุด หรือคณะกรรมการรัฐวิสาหกิจ (กรณีที่คณะกรรมการตรวจสอบว่างเว้น), มีการวิเคราะห์ปัจจัยภายในและภายนอก...เพื่อทบทวนแผนปรับปรุงการปฏิบัติงานตรวจสอบที่ได้จากการประเมินโดยบุคคลภายนอกให้สอดคล้องกับสถานการณ์ปัจจุบัน, และการนำผลการปฏิบัติงานของผู้ตรวจสอบภายในโดยหน่วยรับตรวจมาประกอบการพิจารณาวัดผลงานของผู้ตรวจสอบภายใน","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงกระบวนการประเมินคุณภาพงานตรวจสอบภายในอย่างสม่ำเสมอ อย่างน้อยปีละ 1 ครั้ง"],good:["กระบวนการประเมินคุณภาพที่ครบถ้วน (ทั้งภายในและภายนอก): กทท. มีการประเมินตนเอง (SAR) รายไตรมาส, การประเมินตนเองรายบุคคล, และการปฏิบัติตามเกณฑ์กรมบัญชีกลาง (Periodic Self Assessment) อย่างสม่ำเสมอ รวมทั้งผ่านการรับการประเมินจากผู้เชี่ยวชาญภายนอก (EY)","การเชื่อมโยงกับผลประเมินการทำงาน (KPI): มีการนำผลการปฏิบัติงานของผู้ตรวจสอบภายในที่ถูกประเมินโดย \"หน่วยรับตรวจ\" มาเป็นส่วนหนึ่งประกอบการพิจารณาวัดผลงาน (KPI) ประจำปีของผู้ตรวจสอบอย่างเป็นรูปธรรม","การติดตามแผนปรับปรุงอย่างต่อเนื่อง: มีการจัดทำและติดตามแผนปรับปรุง (Action Plan) 6 แผนที่ได้จากข้อเสนอแนะของ EY โดยสามารถดำเนินการเสร็จแล้ว 4 แผน และรายงานความคืบหน้าผ่าน SAR รายไตรมาสให้ อทร. และ คณะกรรมการตรวจสอบ (AC) รับทราบ"],gaps:["เครื่องมือทบทวนกระบวนการทำงานที่เป็นระบบ (Systematic Review Tool): ยังขาดการนำผลการปฏิบัติงานหรือข้อผิดพลาดที่เกิดขึ้น มาจัดเก็บและวิเคราะห์เป็น \"ข้อมูลป้อนกลับ (Feedback)\" อย่างเป็นระบบ เพื่อให้เกิดการเรียนรู้และนำไปสู่การปรับปรุงประสิทธิภาพ (Continuous Improvement)","ความทันต่อสถานการณ์ของแผนปรับปรุง: แผนปรับปรุงที่ได้จากการประเมินของ EY ขาดการนำปัจจัยภายในและภายนอกใหม่ๆ ในปัจจุบันเข้าไปวิเคราะห์ร่วมด้วย ทำให้แผนเริ่มไม่สอดคล้องกับสถานการณ์ความท้าทายปัจจุบันขององค์กร"],results:["ระดับ 1-2: กำหนดแนวทางการสอบทานคุณภาพงานตรวจสอบทั้งภายในและภายนอกไว้ในคู่มือ และนำผลประเมินจากหน่วยรับตรวจมากำหนดใน KPI ประจำปี","ระดับ 3: ดำเนินการประเมินคุณภาพครบถ้วน ทั้งการให้หน่วยรับตรวจประเมินหลังจบงาน, การทำ SAR รายไตรมาสเสนอ AC, และจัดทำแผนปรับปรุงจาก EY","ระดับ 4: รายงานความคืบหน้าการแก้ปัญหาตามแผน EY และ SAR ผ่านการประชุมคณะกรรมการตรวจสอบอย่างต่อเนื่องทุกไตรมาส (เช่น การนำเสนอ SAR Q1-Q3 ในการประชุม AC ครั้งที่ 3, 6, และ 9)","ระดับ 5: นำข้อมูลการประเมินตนเอง (Periodic Self Assessment) ไปประกอบการจัดทำแผนพัฒนาสายตรวจสอบ และนำไปวิเคราะห์ SWOT ร่วมกับการจัดทำแผนการตรวจสอบเชิงกลยุทธ์ 5 ปี (2568-2572)"],tris:["TRIS ประเมินสถานะในข้อนี้ของ กทท. ว่า \"ปิด Gap ของปี 67 ได้บางส่วน\" (เรื่องการติดตามแผน EY) แต่ได้ระบุ Gap เพิ่มเติมสำหรับปี 2568 ไว้ชัดเจนว่า \"หน่วยตรวจสอบภายในยังขาดเครื่องมือที่เป็นระบบในการประเมินและทบทวนกระบวนการทำงานเพื่อการเรียนรู้\" ซึ่งทำให้การประเมินผลหยุดอยู่แค่การทำตามรอบ (Compliance) แต่ไม่เกิดการยกระดับประสิทธิภาพหรือปรับปรุงวิธีการทำงานให้ฉลาดขึ้นอย่างแท้จริง"],suggest:["สร้างเครื่องมือจัดการความรู้และถอดบทเรียน (AAR): พัฒนาเครื่องมือที่เป็นระบบ เช่น การทำ After Action Review (AAR) ภายหลังจบการตรวจสอบในแต่ละโครงการ เพื่อนำ Feedback จากหน่วยรับตรวจมาวิเคราะห์หาข้อบกพร่อง และเรียนรู้เพื่อปรับปรุงกระบวนการทำงาน","ทบทวนแผนปรับปรุงจากภายนอกให้ทันสมัย: นำแผนปรับปรุงของ EY ที่ยังค้างอยู่ มาพิจารณาร่วมกับปัจจัยความเสี่ยงใหม่ๆ เช่น นโยบาย ESG หรือ การใช้ระบบเทคโนโลยี A2S เพื่ออัปเดตแผนปรับปรุงให้ตอบโจทย์สถานการณ์ปัจจุบัน"],docs:["รายงานทบทวนกระบวนการปฏิบัติงาน (Continuous Improvement Report): เอกสารสรุปผลการถอดบทเรียนหลังจบงาน (AAR) ที่แสดงให้เห็นการนำ Feedback หรือ Pain Point ที่พบ มาปรับปรุง \"คู่มือการทำงาน\" หรือ \"วิธีการเข้าตรวจ\" ให้ดีขึ้น","แผนปรับปรุงคุณภาพงานตรวจสอบ (Revised Action Plan): ที่ผ่านการอัปเดตและระบุปัจจัยความท้าทายใหม่ของปี 2569 ลงไปอย่างชัดเจน และได้รับการอนุมัติจาก AC"],bestprac:["รฟม. ไม่เพียงแต่นำผลประเมินคุณภาพมาวัดผลบุคลากร แต่ยังโดดเด่นในการใช้เครื่องมือประเมินเพื่อปรับปรุงกระบวนการทำงานอย่างเป็นระบบ โดย รฟม. มีการทำทบทวนหลังปฏิบัติงาน (AAR) ที่ครอบคลุมทั้งตัวชี้วัดกระบวนการนำเข้า (Leading) และผลลัพธ์ (Lagging) เพื่อสะท้อนประสิทธิภาพที่แท้จริง","กทพ. ได้รับข้อแนะนำจากผู้ประเมินในการนำผลการประเมินกระบวนการไปใช้โดยการแสดงให้เห็นภาพก่อนการปรับปรุงและหลังปรับปรุง หรือรูปแบบ \"As-is สู่ To-be\" อย่างเป็นรูปธรรม"],minReqs:{"1":["คู่มือการปฏิบัติงานตรวจสอบภายใน (ที่ระบุหมวดการประกันและปรับปรุงคุณภาพงานตรวจสอบภายใน หรือ QAIP ไว้อย่างชัดเจน ทั้งการประเมินภายในและภายนอก)"],"2":["คู่มือ/หลักเกณฑ์การประเมินผลการปฏิบัติงาน (KPI) ของผู้ตรวจสอบภายใน ที่ระบุชัดเจนว่ามีส่วนที่นำ \"คะแนนจากแบบประเมินของหน่วยรับตรวจ\" มาคำนวณเป็นผลงานด้วย"],"3":["แบบประเมินผลการปฏิบัติงานโดยหน่วยรับตรวจ (ทุกครั้งหลังปิดงาน) และแบบประเมินตนเองรายบุคคลของผู้ตรวจสอบ","รายงานประเมินตนเองของหน่วยตรวจสอบภายใน (SAR) เป็นรายไตรมาส","รายงานประเมินตนเองเป็นระยะ (Periodic Self Assessment) ประจำปี ตามรูปแบบที่กรมบัญชีกลางกำหนด","รายงานผลการประเมินคุณภาพจากผู้ประเมินภายนอกอิสระ (QAR) ที่ดำเนินการในช่วง 3-5 ปีที่ผ่านมา (เช่น รายงานจาก EY)"],"4":["แผนปรับปรุงคุณภาพงานตรวจสอบ (Action Plan) ที่จัดทำขึ้นเพื่อแก้ไขข้อบกพร่องจากผลการประเมิน","รายงานการประชุมคณะกรรมการตรวจสอบ (AC) หรือ บอร์ด กทท./อทร. (กรณี AC ว่างเว้น) ที่พิจารณารับทราบความคืบหน้าการดำเนินงานตาม \"แผนปรับปรุง (Action Plan)\"","เอกสารวิเคราะห์ปัจจัยภายใน/ภายนอก (SWOT) ที่แสดงให้เห็นว่ามีการนำปัจจัยใหม่ๆ มาทบทวน/ปรับปรุงแผนปรับปรุงของ EY ให้เป็นปัจจุบัน"],"5":["หลักฐานการสรุปคะแนนประเมิน (KPI) ประจำปีของผู้ตรวจสอบ ที่สะท้อนคะแนนจากหน่วยรับตรวจจริง","บันทึกข้อความหรือเอกสารแสดงการนำข้อมูลป้อนกลับ (Feedback) มาใช้ทบทวน/ปรับปรุง \"กระบวนการประเมินคุณภาพงานตรวจสอบ\" (เช่น การปรับกระบวนการประเมินตนเองให้สอดคล้องกับแนวทางใหม่ของกรมบัญชีกลาง) ดำเนินการอย่างน้อยปีละ 1 ครั้ง"]},subComps:{"1":["เงื่อนไขการแยกกรณีประเมิน (Split Cases) (เกี่ยวข้องกับทุกระดับ): เกณฑ์ในข้อนี้มีการซ่อนเงื่อนไขแยกการพิจารณาเป็น 2 กรณี คือ \"ปีแรกที่ได้รับการประเมินจากภายนอก\" และ \"ปีที่ 2 ถึงปีที่ 5\" ซึ่งรายละเอียดข้อกำหนดในระดับ 4 จะแตกต่างกัน (กทท. ต้องตอบกระดาษคำตอบในบริบทของ \"กรณีที่ 2\" เท่านั้น)"],"2":["ข้อผูกมัดด้าน KPI : การให้หน่วยรับตรวจประเมินความพึงพอใจหลังจบงาน ไม่ใช่แค่ทำเพื่อเก็บเป็นสถิติ แต่เกณฑ์บังคับ (ในระดับ 4) ว่าต้องมีหลักฐานแสดงให้เห็นว่านำคะแนนประเมินนั้น ไปเป็นน้ำหนักส่วนหนึ่งในการ \"ชี้วัดผลงาน (KPI) ของผู้ตรวจสอบภายใน\" จริงๆ ประจำปี"],"3":["ความถี่และความครอบคลุมของการประเมินภายใน : เกณฑ์ระบุคำว่า \"ประเมินภายในอย่างครบถ้วน\" ซึ่งซ่อนเงื่อนไขบังคับ 3 ส่วน คือ 1) ต้องให้หน่วยรับตรวจประเมินผู้ตรวจสอบ ทุกครั้ง ที่จบงาน 2) ผู้ตรวจสอบต้องประเมินตนเองรายบุคคล และ 3) หน่วย IA ต้องประเมินตนเอง (SAR) ทั้งแบบรายไตรมาส และแบบ Periodic Self Assessment ประจำปี ตามรูปแบบที่กรมบัญชีกลางกำหนด","คุณสมบัติและรอบเวลาของผู้ประเมินภายนอก : การประเมินคุณภาพจากภายนอก (QAR) ต้องทำโดยผู้เชี่ยวชาญที่เป็นอิสระ (เช่น กรมบัญชีกลาง หรือ บริษัทเอกชนที่ได้รับอนุญาต) และต้องมีรอบการประเมินอย่างน้อยทุก \"3 - 5 ปี\""],"4":["กฎเหล็กกรณีคณะกรรมการหรือ AC ว่างเว้น : เกณฑ์มีเงื่อนไขซ่อนไว้ชัดเจนว่า หากรัฐวิสาหกิจประสบปัญหาคณะกรรมการตรวจสอบ (AC) ขาดองค์ประกอบ (ซึ่ง กทท. เจอวิกฤตินี้ในปี 67-68) หน่วย IA จะต้องเปลี่ยนไปรายงานผลแผนปรับปรุงต่อ \"ผู้บริหารสูงสุด (อทร.)\" หรือ \"คณะกรรมการรัฐวิสาหกิจ (Board)\" แทน แต่หากแม้แต่ Board ก็ขาดองค์ประกอบจนไม่สามารถรับรายงานได้ รัฐวิสาหกิจนั้น \"จะไม่ได้รับการพิจารณาคะแนนที่ระดับ 4 ในประเด็นย่อยนี้อย่างเด็ดขาด\"","ข้อผูกมัดด้าน KPI : การให้หน่วยรับตรวจประเมินความพึงพอใจหลังจบงาน ไม่ใช่แค่ทำเพื่อเก็บเป็นสถิติ แต่เกณฑ์บังคับ (ในระดับ 4) ว่าต้องมีหลักฐานแสดงให้เห็นว่านำคะแนนประเมินนั้น ไปเป็นน้ำหนักส่วนหนึ่งในการ \"ชี้วัดผลงาน (KPI) ของผู้ตรวจสอบภายใน\" จริงๆ ประจำปี"]}},
  {id:"3.1",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การจัดทำคู่มือการปฏิบัติงานตรวจสอบ",w:5.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินการบริหารจัดการ \"คู่มือการปฏิบัติงานตรวจสอบภายใน (IA Manual)\" ตั้งแต่กระบวนการตั้งต้นที่ต้องวิเคราะห์ปัจจัยแวดล้อมให้คู่มือสอดคล้องกับบริบทองค์กรและมาตรฐานวิชาชีพสากล การกำหนดเนื้อหาในคู่มือให้ครบถ้วนครอบคลุมทุกมิติการตรวจสอบ (เช่น S, O, F, C, IT) กระบวนการขออนุมัติและการสื่อสารให้ผู้ปฏิบัติงานรับทราบ ไปจนถึงการมีเครื่องมือติดตามการทำงานจริง (เช่น Check List) เพื่อยืนยันว่าผู้ตรวจสอบปฏิบัติตามคู่มืออย่างเคร่งครัด และต้องมีกระบวนการทบทวนปรับปรุงคู่มือให้ทันสมัยอยู่เสมออย่างน้อยปีละ 1 ครั้ง","การวิเคราะห์ปัจจัยภายใน/ภายนอก เพื่อประกอบการจัดทำคู่มือปฏิบัติงานตรวจสอบ โดยคู่มือฯ สอดคล้องกับกฎบัตรของหน่วยตรวจสอบภายใน","คู่มือปฏิบัติงานตรวจสอบสอดคล้องกับบริบท/วัตถุประสงค์ขององค์กร รวมทั้งสอดคล้องกับแนวปฏิบัติที่ดีและมาตรฐานวิชาชีพ","การจัดทำคู่มือปฏิบัติงานตรวจสอบที่มีองค์ประกอบครบถ้วน รวมถึงมีการอนุมัติและการสื่อสารคู่มือปฏิบัติงานให้ผู้ที่เกี่ยวข้องรับทราบ","การติดตามและประเมินผลการปฏิบัติงานของผู้ตรวจสอบภายในให้มีการปฏิบัติตามคู่มือปฏิบัติงานตรวจสอบภายในอย่างครบถ้วน","การทบทวน/ปรับปรุงคู่มือปฏิบัติงานตรวจสอบภายใน อย่างน้อยปีละ 1 ครั้ง"],good:["การอัปเดตมาตรฐานสากลล่วงหน้า: กทท. มีการวิเคราะห์ปัจจัยเปลี่ยนแปลงและปรับปรุงคู่มือปฏิบัติงานตรวจสอบให้สอดคล้องกับ มาตรฐานการตรวจสอบภายในสากลฉบับใหม่ 2024 (IIA Standards 2024) และเกณฑ์ SE-AM ฉบับล่าสุดได้สำเร็จ","โครงสร้างคู่มือที่ครอบคลุม: คู่มือมีการจัดแบ่งหมวดหมู่อย่างชัดเจนถึง 3 ส่วนหลัก ได้แก่ 1) งานสนับสนุนคณะกรรมการตรวจสอบ (AC) 2) งานด้านธุรการ และ 3) งานปฏิบัติงานตรวจสอบ (ตั้งแต่ Planning ถึง Follow-up)","มีระบบควบคุมและติดตามการใช้คู่มือ (Checklist): กทท. ไม่ได้แค่ทำคู่มือแล้วเก็บไว้ แต่มีการกำหนดให้ผู้ตรวจสอบจัดทำ \"ใบสอบทานการปฏิบัติงานตามขั้นตอน (Checklist)\" เสนอผู้บังคับบัญชา เพื่อยืนยันว่าได้ทำงานตามคู่มือจริง"],gaps:["การเชื่อมโยงคู่มือกับระบบ IT: คู่มือปัจจุบันยังอิงกับกระบวนการทำงานแบบเดิมเป็นหลัก ยังขาดการนำคู่มือไปปรับปรุงและเชื่อมโยงกับขั้นตอนการทำงานบนระบบสารสนเทศใหม่ (A2S) อย่างเต็มรูปแบบ","เครื่องมือทบทวนการทำงาน (Systematic Review Tool): คู่มือยังขาดการระบุขั้นตอนหรือเครื่องมือที่เป็นระบบในการ \"ถอดบทเรียน\" (เช่น การทำ AAR) ภายหลังจบงานตรวจสอบ เพื่อนำข้อผิดพลาดมาเรียนรู้และปรับปรุงคู่มือในรอบถัดไป"],results:["ระดับ 1-2: สายตรวจสอบ กทท. ได้วิเคราะห์ปัจจัยภายใน/ภายนอก (เช่น ข้อเสนอแนะจาก EY, มาตรฐานใหม่) และจัดทำคู่มือที่สอดคล้องกับกฎบัตรและบริบทองค์กร","ระดับ 3: คู่มือฉบับประกาศใช้ปี 2568 ได้รับการอนุมัติจาก AC กทท. (ในการประชุมครั้งที่ 7/2568 เมื่อวันที่ 21 พ.ค. 68) และมีการสื่อสารแจ้งเวียนผ่านระบบ App Sheet และระบบ OA ให้พนักงานทราบทั่วถึง","ระดับ 4: ทีมตรวจสอบมีการใช้ \"กระดาษทำการสอบทานการปฏิบัติงานตามขั้นตอน\" เสนอหัวหน้าทีมและผู้ควบคุมงาน เพื่อติดตามว่าพนักงานปฏิบัติตามคู่มืออย่างเคร่งครัด","ระดับ 5: มีการทบทวนและปรับปรุงคู่มืออย่างน้อยปีละ 1 ครั้ง โดยวิเคราะห์การเปลี่ยนแปลงต่างๆ เพื่อให้อัปเดตอยู่เสมอ"],tris:["แม้ว่าสายตรวจสอบ กทท. จะกรอกกระดาษคำตอบว่าทำครบถ้วนถึงระดับ 5 แต่ TRIS ให้คะแนนหยุดอยู่ที่ระดับ 3 เนื่องจากผู้ประเมินมองว่า \"กทท. ยังขาดเครื่องมือที่เป็นระบบในการทบทวนกระบวนการทำงานเพื่อการเรียนรู้\" การทบทวนคู่มือของ กทท. ยังเป็นการทบทวนตามรอบเวลา (Compliance) แต่ยังไม่ได้เกิดจากวงจรการเรียนรู้ (Feedback Loop) จากหน้างานจริงที่มีประสิทธิภาพเพียงพอ นอกจากนี้แผนปรับปรุงกระบวนการต่างๆ ยังไม่สะท้อนการเชื่อมโยงกับสภาพแวดล้อมเทคโนโลยีที่กำลังจะเปลี่ยนไป (ระบบ A2S)"],suggest:["เชื่อมระบบ IT เข้าสู่คู่มือ: ในปี 2569 เมื่อระบบสนับสนุนงานตรวจสอบ (A2S) จาก ธอส. พร้อมใช้งาน กทท. ต้อง \"ปรับปรุงคู่มือ (Revise Manual)\" โดยแทรกขั้นตอนการวางแผน การบันทึกกระดาษทำการ และการอนุมัติผ่านระบบ A2S ลงไปเป็นมาตรฐานการทำงานใหม่ทันที","เพิ่มส่วน \"การถอดบทเรียน (AAR)\" ลงในคู่มือ: เพิ่มข้อกำหนดในคู่มือการปฏิบัติงานว่า ภายหลังสิ้นสุดการตรวจสอบทุกโครงการ ทีมตรวจสอบจะต้องทำ After Action Review (AAR) และนำผลนั้นส่งกลับมาที่ส่วนกลางเพื่ออัปเดตคู่มือ (Continuous Improvement)"],docs:["คู่มือปฏิบัติงานฉบับอัปเดตปี 2569 (Highlight ส่วน IT & AAR): แนบคู่มือฉบับใหม่ ขีดเน
