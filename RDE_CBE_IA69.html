้น (Highlight) หน้าที่มีการระบุวิธีการใช้งานระบบ A2S และหน้ากระบวนการทำ AAR หลังจบงาน","บันทึกการถอดบทเรียน (AAR Report): เอกสารสรุปปัญหาอุปสรรคจากหน้างานจริง และบันทึกข้อความที่สั่งการให้นำปัญหานั้นมาปรับปรุงข้อกำหนดในคู่มือ"],bestprac:["กทพ. มีจุดเด่นในเรื่องของความยืดหยุ่น โดยได้รับการประเมินว่ามีการ \"ทบทวนคู่มือให้ทันต่อความเปลี่ยนแปลงด้านกฎระเบียบและเทคโนโลยีดิจิทัลอย่างสม่ำเสมอ\"","กทท. ควรเขียนในกระดาษคำตอบปี 69 เลียนแบบแนวทางของ กทพ. โดยเน้นย้ำคำว่า \"Agile Manual\" หรืออธิบายว่า คู่มือของ กทท. ได้ถูกปรับโฉมใหม่ (To-be process) ทันทีเพื่อรองรับการมาถึงของระบบ A2S แสดงให้เห็นว่าองค์กรไม่ยึดติดกับกระดาษ แต่พร้อมก้าวสู่ Digital Audit อย่างเต็มรูปแบบ","รฟม. มีจุดเด่นคือการนำแนวทางการทบทวนคุณภาพงาน (เช่น AAR) ไปยึดโยงกับการวัดผลประเมินงานของผู้ตรวจสอบโดยตรง","ให้ กทท. เพิ่มกระบวนการว่า \"หากผู้ตรวจสอบทีมใดสามารถค้นพบจุดอ่อนในคู่มือเดิมจากการลงหน้างาน และเสนอแนะวิธีปฏิบัติที่ดีกว่า (Best Practice) กลับมาส่วนกลางได้ ทีมนั้นจะได้คะแนนประเมิน KPI พิเศษ\" การเขียนเช่นนี้จะตอบโจทย์ TRIS ทันทีว่าองค์กรมีเครื่องมือเรียนรู้ที่เป็นระบบตามที่ TRIS อยากเห็นในระดับ 5"],minReqs:{"1":["เอกสาร/รายงานการวิเคราะห์ปัจจัยภายในและภายนอก (SWOT) ที่ส่งผลต่อกระบวนการทำงานของหน่วยตรวจสอบภายใน","ร่างคู่มือการปฏิบัติงานตรวจสอบที่แสดงให้เห็นถึงความสอดคล้องกับ \"กฎบัตรของหน่วยตรวจสอบภายใน\""],"2":["คู่มือการปฏิบัติงานตรวจสอบที่มีเนื้อหาสอดคล้องกับบริบทองค์กร และสอดคล้องกับมาตรฐานการตรวจสอบภายในสากล (เช่น การอัปเดตให้สอดคล้องกับมาตรฐาน IIA 2024 และคู่มือของ สคร. ฉบับล่าสุด)"],"3":["คู่มือการปฏิบัติงานตรวจสอบฉบับสมบูรณ์ ที่มีองค์ประกอบหัวข้อครบถ้วนตามที่เกณฑ์กำหนด (ครอบคลุมทั้งการทำงานธุรการ การตรวจสอบ และการให้คำปรึกษา)","วาระและรายงานการประชุมคณะกรรมการตรวจสอบ (AC) ที่มีมติ \"อนุมัติ\" คู่มือการปฏิบัติงาน","หลักฐานการสื่อสารแจ้งเวียนคู่มือให้ผู้ตรวจสอบภายในและผู้ที่เกี่ยวข้องรับทราบ (เช่น บันทึกข้อความ, อีเมล, หน้าจอระบบ Intranet/App Sheet หรือรายงานการประชุมฝ่ายตรวจสอบ)"],"4":["เอกสารหรือแบบฟอร์ม \"ใบสอบทานการปฏิบัติงานตรวจสอบ (Check List)\" ของแต่ละโครงการ ที่แสดงให้เห็นว่ามีผู้ควบคุมงาน/หัวหน้าทีม ตรวจสอบและลงนามกำกับว่าผู้ตรวจสอบได้ปฏิบัติงานตามขั้นตอนในคู่มืออย่างครบถ้วนจริง"],"5":["บันทึกข้อความสรุปประเด็นการทบทวน/ปรับปรุงคู่มือ (เปรียบเทียบข้อที่เปลี่ยนแปลง) ที่เกิดจากการนำข้อมูลป้อนกลับมาวิเคราะห์ (เช่น นำข้อเสนอแนะจากผู้ประเมินภายนอก หรือมาตรฐานใหม่มาปรับปรุง)","รายงานการประชุม AC ที่มีมติอนุมัติคู่มือฉบับทบทวน (ต้องมีหลักฐานว่าดำเนินการทบทวนอย่างน้อยปีละ 1 ครั้ง)"]},subComps:{"2":["มิติการตรวจสอบที่ต้องครอบคลุม : ในกระบวนการทำงาน คู่มือต้องระบุว่าสายตรวจสอบสามารถเข้าสอบทานงานได้ครบถ้วนทั้ง 5 มิติ คือ ด้านกลยุทธ์ (S), ด้านการดำเนินงาน (O), ด้านการเงิน (F), ด้านการปฏิบัติตามกฎระเบียบ (C), และด้านเทคโนโลยีสารสนเทศ (IT)","การอัปเดตคู่มือให้ทันต่อเทคโนโลยีดิจิทัล เกณฑ์คาดหวังให้การทบทวนคู่มือไม่เป็นเพียงการเปลี่ยนปี พ.ศ. แต่ต้องนำประเด็นการเปลี่ยนแปลงด้านเทคโนโลยีดิจิทัลเข้ามาแทรกในคู่มือด้วย (เช่น การกำหนดวิธีใช้ระบบ A2S ลงในคู่มือ)"],"3":["ข้อบังคับความครบถ้วนขององค์ประกอบในคู่มือ คู่มือการปฏิบัติงานจะถูกประเมินว่า \"ครบถ้วน\" ก็ต่อเมื่อมีหัวข้อบังคับซ่อนอยู่อย่างน้อย 10 ประเด็น ได้แก่ 1) บทบาทความรับผิดชอบ 2) แนวทางปฏิบัติด้วยความระมัดระวัง 3) การประเมินกระบวนการ GRC 4) การสอบทานงานให้ครบ 5 มิติ 5) การบันทึกจัดเก็บเอกสาร 6) การสื่อสาร/รายงาน 7) การให้คำปรึกษา 8) การติดตามข้อเสนอแนะ 9) การฝึกอบรมผู้ตรวจสอบ และ 10) การวัดผลงาน (KPI)","มิติการตรวจสอบที่ต้องครอบคลุม : ในกระบวนการทำงาน คู่มือต้องระบุว่าสายตรวจสอบสามารถเข้าสอบทานงานได้ครบถ้วนทั้ง 5 มิติ คือ ด้านกลยุทธ์ (S), ด้านการดำเนินงาน (O), ด้านการเงิน (F), ด้านการปฏิบัติตามกฎระเบียบ (C), และด้านเทคโนโลยีสารสนเทศ (IT)"],"4":["เครื่องมือเชิงประจักษ์ในการติดตามการทำงาน : การจะผ่านระดับ 4 ได้ ไม่สามารถใช้เพียงคำกล่าวอ้างว่า \"ทำตามคู่มือแล้ว\" แต่เกณฑ์ซ่อนความคาดหวังให้มีเครื่องมือที่เป็นระบบ (Systematic Tool) เช่น การทำ \"ใบสอบทานการปฏิบัติงานตรวจสอบ (Check List)\" ที่มีการเซ็นรับรองตามลำดับชั้น เพื่อเป็นหลักฐานว่าไม่มีการข้ามขั้นตอนที่กำหนดไว้ในคู่มือ"],"5":["การอัปเดตคู่มือให้ทันต่อเทคโนโลยีดิจิทัล เกณฑ์คาดหวังให้การทบทวนคู่มือไม่เป็นเพียงการเปลี่ยนปี พ.ศ. แต่ต้องนำประเด็นการเปลี่ยนแปลงด้านเทคโนโลยีดิจิทัลเข้ามาแทรกในคู่มือด้วย (เช่น การกำหนดวิธีใช้ระบบ A2S ลงในคู่มือ)","การทบทวนผ่านกระบวนการเรียนรู้ (Feedback Loop) ผู้ประเมินระบุข้อสังเกตซ่อนไว้ว่า การทบทวนคู่มือควรเกิดจากการมี \"เครื่องมือที่เป็นระบบในการประเมินและทบทวนกระบวนการทำงานเพื่อนำไปสู่การปรับปรุง\" เช่น การทำ After Action Review (AAR) หลังจบงานตรวจสอบ เพื่อนำปัญหาอุปสรรคมาอัปเดตคู่มือในรอบปีถัดไป"]}},
  {id:"3.2",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การวางแผนการตรวจสอบ",w:10.0,s68:3.0944,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินความสมบูรณ์และประสิทธิผลของกระบวนการวางแผนงานตรวจสอบภายใน ทั้ง \"แผนเชิงกลยุทธ์ (ระยะยาว)\" และ \"แผนประจำปี\" โดยต้องนำปัจจัยภายนอก/ภายใน แผนวิสาหกิจ ความเสี่ยงระดับองค์กร โอกาสการเกิดทุจริต และเกณฑ์ Enablers 7 ด้าน มาบูรณาการเพื่อประเมินความเสี่ยงในระดับกิจกรรม นำไปสู่การจัดลำดับความสำคัญและจัดสรรทรัพยากร (Mandays) ที่เหมาะสม ตลอดจนการสื่อสารแผนให้ผู้เกี่ยวข้องรับทราบ และมีความยืดหยุ่นในการนำข้อมูลป้อนกลับมาทบทวนปรับเปลี่ยนแผนระหว่างปีให้ทันต่อสถานการณ์ความเสี่ยงที่เปลี่ยนไป","กำหนดกระบวนการในการจัดทำแผนการตรวจสอบเชิงกลยุทธ์และแผนการตรวจสอบประจำปีของรัฐวิสาหกิจ","การจัดทำแผนการตรวจสอบเชิงกลยุทธ์และแผนการตรวจสอบประจำปี สอดคล้องกับวัตถุประสงค์ ความเสี่ยงที่สำคัญของรัฐวิสาหกิจ และแผนของรัฐวิสาหกิจ","การวางแผนการตรวจสอบเชิงกลยุทธ์และแผนการตรวจสอบประจำปีของรัฐวิสาหกิจ การจัดทำแผนการตรวจสอบเชิงกลยุทธ์และแผนการตรวจสอบประจำปีตามฐานความเสี่ยงที่มีองค์ประกอบครบถ้วน และการอนุมัติและการสื่อสารแผนการตรวจสอบต่อผู้ที่เกี่ยวข้อง","แผนการตรวจสอบเชิงกลยุทธ์และแผนการตรวจสอบประจำปีมีการประเมินความเสี่ยงในระดับกิจกรรมการตรวจสอบอย่างครบถ้วนและเป็นระบบ (พิจารณาการนำระบบเทคโนโลยีสารสนเทศสนับสนุน) สอดคล้องกับวัตถุประสงค์ แผนยุทธศาสตร์/กลยุทธ์ และความเสี่ยงที่สำคัญของรัฐวิสาหกิจ รวมถึงเกณฑ์การประเมินทั้ง 7 หัวข้อ เพื่อมุ่งเน้นในการสร้างมูลค่าเพิ่มให้กับฝ่ายบริหาร","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ดำเนินงานในการปรับเปลี่ยนแผนการตรวจสอบ กรณีพบประเด็นสำคัญที่ส่งผลให้มีการปรับเปลี่ยนแผนการปฏิบัติงาน"],good:["การปรับแผนอย่างยืดหยุ่น (Agile Planning): กทท. ทำได้ดีเยี่ยมในการทบทวนแผนระหว่างปี เพื่อลดความซ้ำซ้อน เช่น การถอดงานตรวจโครงการ SRTO ออกเนื่องจาก สตง. เข้าตรวจแล้ว และนำประเด็น \"ความยั่งยืน (ESG)\" เข้ามาเสียบแทนในแผนปี 2568 ตามข้อเสนอแนะของ สคร. ทันที","การบูรณาการ 3 ประสาน: สายตรวจสอบ กทท. ไม่ได้คิดแผนเองฝ่ายเดียว แต่มีการจัดประชุมหารือร่วมกับ คณะกรรมการตรวจสอบ (AC), คณะกรรมการบริหารความเสี่ยงฯ (RM) และ คณะกรรมการกำกับดูแลกิจการที่ดีฯ (CG) เพื่อนำความเห็นมาจัดทำแผนตรวจสอบเชิงกลยุทธ์ 5 ปี","การขยายปัจจัยเสี่ยง: ปรับปรุงเกณฑ์ประเมินความเสี่ยงจากเดิม 4 ปัจจัย เพิ่มเป็น 12 ปัจจัยเสี่ยง ให้ครอบคลุมด้าน ESG และข้อมูลจาก สคร./สตง."],gaps:["การเชื่อมโยงฐานข้อมูลทุจริต: การประเมินความเสี่ยงยังขาดการนำ \"ฐานข้อมูลการเกิดทุจริตในอดีต\" มาตั้งเป็นเกณฑ์เพื่อจัดสรรทรัพยากรสำหรับการตรวจสอบเชิงป้องกันอย่างเป็นรูปธรรม","ยังไม่ครอบคลุมโครงการในอนาคต: แผนการตรวจสอบยังไม่สะท้อนถึงการประเมินความเสี่ยงโครงการขนาดใหญ่ที่จะเกิดขึ้นในอนาคต (เช่น โครงการท่าเรือบก - Dry Port)","ระบบเทคโนโลยี (IT) สนับสนุนงานวางแผน: กทท. ยังใช้เพียง Microsoft Excel ในการประเมินความเสี่ยง ระบบสนับสนุนงานตรวจสอบแบบครบวงจร (A2S) ยังอยู่แค่ขั้นตอนลงนาม MOU และรอจัดซื้อจัดจ้าง"],results:["ระดับ 1: กำหนดกระบวนการจัดทำแผนเชิงกลยุทธ์และแผนประจำปีไว้ในคู่มือปฏิบัติงานตรวจสอบ P08 (อนุมัติโดย AC ในการประชุมครั้งที่ 7/2568)","ระดับ 2: จัดทำแผนการตรวจสอบเชิงกลยุทธ์ 5 ปี (2566-2570) ทบทวนปี 68 สอดคล้องกับวัตถุประสงค์และความเสี่ยงองค์กร โดยใช้ข้อมูลจากการวิเคราะห์ SWOT","ระดับ 3: แผนตรวจสอบมีองค์ประกอบครบถ้วน (เป้าหมาย, กระบวนงาน, ลำดับความเสี่ยง, Mandays) ได้รับความเห็นชอบจาก อทร. และอนุมัติโดย AC ในการประชุมครั้งที่ 10/2568 พร้อมสื่อสารให้ผู้เกี่ยวข้องรับทราบล่วงหน้า 60 วัน","ระดับ 4: ดำเนินการประเมินความเสี่ยงระดับกิจกรรมโดยใช้ Excel และได้ลงนาม MOU เพื่อนำระบบ A2S มาใช้ (คาดว่าใช้ได้ปี 69) รวมถึงกำหนดแผนสอบทาน Enablers 4 ด้าน (SP, RM&IC, DT, KM&IM)","ระดับ 5: มีการใช้ Feedback จาก สตง. และ สคร. มาปรับแผนการตรวจสอบระหว่างปี (เช่น เอาเรื่อง SRTO ออก และเพิ่มเรื่อง ESG เข้าไปแทน)"],tris:["ผู้ประเมินให้คะแนน กทท. สอบผ่านในระดับ 3 (กระบวนการครบถ้วน) แต่ หักคะแนนในระดับ 4 เนื่องจากผู้ประเมินมองว่า \"การนำระบบ IT (A2S) มาสนับสนุนการปฏิบัติงานตรวจสอบยังไม่สมบูรณ์แบบและยังไม่ถูกใช้งานจริง\" นอกจากนี้ ผู้ประเมินยังระบุ Gap ชัดเจนว่า การประเมินความเสี่ยงเพื่อจัดทำแผนกลยุทธ์ \"ต้องครอบคลุมถึงกิจกรรมในอนาคต และโอกาสในการเกิดทุจริตอย่างเป็นรูปธรรม\""],suggest:["ปรับเกณฑ์ Risk Assessment: ปรับปรุงตารางเกณฑ์ประเมินความเสี่ยง (Risk Assessment) โดยเพิ่มน้ำหนักคะแนนช่อง \"ความเสี่ยงด้านการทุจริต (Fraud Risk)\" และช่อง \"โครงการในอนาคต/กลยุทธ์ใหม่\" ลงไปให้ชัดเจน","บรรจุโครงการใหม่ลงแผน: ต้องกำหนดรายชื่อโครงการในอนาคต เช่น \"โครงการพัฒนาท่าเรือบก (Dry Port)\" บรรจุลงในแผนการตรวจสอบปี 2569 อย่างเป็นทางการ","เร่งเปิดใช้งานระบบ A2S: ต้องเร่งรัดการติดตั้งและเริ่มใช้งานระบบ A2S อย่างน้อยในโมดูล \"การวางแผน (Planning)\" ให้ทันภายในไตรมาส 2-3 ของปี 2569"],docs:["คู่มือ/ตารางเกณฑ์การประเมินความเสี่ยง (Risk Assessment Matrix): ที่มีการแยกหัวข้อและน้ำหนักคะแนน \"ด้านการทุจริต\" และ \"โครงการในอนาคต\" ให้ TRIS เห็นชัดเจน","ภาพหน้าจอ (Screen Capture) ระบบ A2S: ที่แสดงให้เห็นว่าสายตรวจสอบได้ทำการบันทึกข้อมูลปัจจัยความเสี่ยง หรือจัดทำแผน Audit Program ลงในระบบ IT เรียบร้อยแล้ว (ไม่ใช่ทำใน Excel เหมือนเดิม)"],bestprac:["รฟม. มีการจัดทำแผนตรวจสอบที่อิงกลยุทธ์ตามฐานความเสี่ยงอย่างละเอียด และครอบคลุมทุกองค์ประกอบ โดยมีการประเมินความเสี่ยงระดับกิจกรรมอย่างครบถ้วนเป็นระบบ และมีการนำระบบสารสนเทศมาใช้ในการวางแผนตรวจสอบแล้ว","กทพ. เริ่มนำเทคโนโลยีสารสนเทศมาใช้ในการวางแผนการตรวจสอบ วิเคราะห์ข้อมูล รวมถึงสนับสนุนการปฏิบัติงานตรวจสอบอย่างเป็นรูปธรรม แต่อย่างไรก็ตาม แม้ กทพ. จะใช้ IT แล้ว แต่ TRIS ยังให้คำแนะนำว่า กทพ. \"ควรพัฒนาเทคโนโลยีสารสนเทศให้สามารถเชื่อมโยงกับฐานข้อมูลขององค์กร\""],minReqs:{"1":["คู่มือการปฏิบัติงานตรวจสอบภายใน (หรือเอกสารที่เทียบเท่า) ที่ระบุกระบวนการและขั้นตอนการจัดทำแผนการตรวจสอบเชิงกลยุทธ์ (ระยะยาว) และแผนการตรวจสอบประจำปีไว้อย่างชัดเจน"],"2":["เอกสารแผนการตรวจสอบเชิงกลยุทธ์ (ระยะยาว 3-5 ปี) และแผนการตรวจสอบประจำปี","หลักฐาน/ตารางการวิเคราะห์ความเชื่อมโยง ที่แสดงให้เห็นว่าแผนการตรวจสอบสอดคล้องกับ \"แผนวิสาหกิจ\", \"ความเสี่ยงที่สำคัญระดับองค์กร (Risk Profile)\", \"วัตถุประสงค์องค์กร\", และ \"โครงการในอนาคต\""],"3":["เอกสารแผนการตรวจสอบที่มีองค์ประกอบบังคับครบถ้วนตามเกณฑ์ (เช่น เป้าหมาย, ลำดับความเสี่ยง, Mandays, การให้คำปรึกษา)","วาระและรายงานการประชุมคณะกรรมการตรวจสอบ (AC) และ/หรือ ผู้บริหารสูงสุด ที่มีมติ \"อนุมัติ\" แผนการตรวจสอบ ภายในเดือนสุดท้ายของปีงบประมาณก่อนเริ่มบังคับใช้แผน","หลักฐานการสื่อสารแจ้งเวียนแผนการตรวจสอบประจำปีให้หน่วยรับตรวจและผู้ที่เกี่ยวข้องรับทราบล่วงหน้า"],"4":["เอกสารกระดาษทำการ หรือตารางประเมินความเสี่ยงระดับกิจกรรม (Activity-level Risk Assessment) ที่สอดคล้องกับเกณฑ์ Enablers ทั้ง 7 ด้าน","หลักฐานภาพหน้าจอ หรือรายงานที่แสดงถึง \"การนำระบบเทคโนโลยีสารสนเทศ (IT) มาใช้สนับสนุน\" การวิเคราะห์ข้อมูลเพื่อประเมินความเสี่ยงและจัดทำแผน"],"5":["เอกสารทบทวนและปรับเปลี่ยนแผนการตรวจสอบระหว่างปี (ฉบับปรับปรุง) ที่ชี้ให้เห็นสาเหตุการปรับแผน เช่น พบความเสี่ยงใหม่, การลดความซ้ำซ้อนกับหน่วยงานอื่น (สตง.), หรือเพิ่มประเด็นเร่งด่วน","รายงานการประชุมคณะกรรมการตรวจสอบ (AC) ที่มีมติอนุมัติ \"แผนการตรวจสอบฉบับปรับปรุง/ทบทวน\""]},subComps:{"2":["การประเมินความเสี่ยงครอบคลุมการทุจริตและอนาคต ผู้ประเมิน สคร. เน้นย้ำว่า การวิเคราะห์ความเสี่ยงเพื่อจัดทำแผน จะต้องนำ \"ฐานข้อมูลการทุจริตในอดีต\" มาเชื่อมโยงเพื่อหาระดับโอกาสเกิดทุจริต (Fraud Risk Assessment) รวมถึงต้องครอบคลุมถึงโครงการและกิจกรรมในอนาคต (เช่น โครงการก่อสร้างใหม่ หรือเรื่อง ESG)"],"3":["ความครบถ้วนขององค์ประกอบ \"แผนกลยุทธ์\" แผนการตรวจสอบเชิงกลยุทธ์จะถือว่าครบถ้วนได้ ต้องมีองค์ประกอบบังคับ ได้แก่ เป้าหมายที่เชื่อมโยงกับองค์กร, กระบวนงานหลัก/ย่อย, ความเสี่ยงที่สำคัญ, ลำดับความสำคัญ, ฝ่ายงานที่เกี่ยวข้อง, และจำนวนวันปฏิบัติงาน (Mandays) รวมตลอดแผนและรายปี","ความครบถ้วนขององค์ประกอบ \"แผนประจำปี\" ต้องมีองค์ประกอบบังคับ ได้แก่ เป้าหมายเชื่อมโยงแผนกลยุทธ์, โครงการ/กิจกรรม, วัตถุประสงค์, ระดับความเสี่ยง, ระยะเวลาการปฏิบัติงาน (Mandays) ของแต่ละโครงการ, ผู้รับผิดชอบ, และ ต้องกำหนดกิจกรรมการให้คำแนะนำปรึกษา (Consulting) ไว้ในแผนด้วย","ความน่าเชื่อถือของการจัดสรรทรัพยากร/Mandays การกำหนดจำนวนวันในการตรวจสอบ (Man-days) ต้องมีที่มาที่ไปชัดเจน ผู้ประเมินระบุว่าควรใช้ \"ข้อมูลสถิติในอดีต (เช่น ค่าเฉลี่ย 5-10 ปี)\" ของกระบวนการที่ลักษณะคล้ายคลึงกันมาประกอบการวิเคราะห์ เพื่อความน่าเชื่อถือในการจัดสรรกำลังคน","เงื่อนไขด้านระยะเวลาการอนุมัติแผน : เกณฑ์ระบุเงื่อนไขบังคับว่า หัวหน้าหน่วยตรวจสอบภายในต้องนำเสนอแผนการตรวจสอบ ตลอดจนการเปลี่ยนแปลงทรัพยากร ให้คณะกรรมการตรวจสอบ (AC) พิจารณาอนุมัติ \"ภายในเดือนสุดท้ายของปีงบประมาณหรือปีปฏิทิน\" ก่อนที่จะเริ่มบังคับใช้แผนในปีถัดไป","ความยืดหยุ่นและการทบทวนแผนระหว่างปี เกณฑ์ซ่อนความคาดหวังว่า IA ต้องติดตามการเปลี่ยนแปลงอยู่ตลอดเวลา ดังนั้น ผู้ตรวจสอบภายในต้องทบทวนแผนตรวจสอบเชิงกลยุทธ์และแผนประจำปี \"อย่างน้อยปีละ 1 ครั้ง หรือเมื่อมีเหตุการณ์สำคัญ\" (เช่น มีหน่วยงานภายนอกอย่าง สตง. เข้ามาตรวจเรื่องเดียวกัน จึงต้องปรับแผนเพื่อลดความซ้ำซ้อน)"],"4":["การประเมินความเสี่ยงครอบคลุมการทุจริตและอนาคต ผู้ประเมิน สคร. เน้นย้ำว่า การวิเคราะห์ความเสี่ยงเพื่อจัดทำแผน จะต้องนำ \"ฐานข้อมูลการทุจริตในอดีต\" มาเชื่อมโยงเพื่อหาระดับโอกาสเกิดทุจริต (Fraud Risk Assessment) รวมถึงต้องครอบคลุมถึงโครงการและกิจกรรมในอนาคต (เช่น โครงการก่อสร้างใหม่ หรือเรื่อง ESG)"],"5":["ความยืดหยุ่นและการทบทวนแผนระหว่างปี เกณฑ์ซ่อนความคาดหวังว่า IA ต้องติดตามการเปลี่ยนแปลงอยู่ตลอดเวลา ดังนั้น ผู้ตรวจสอบภายในต้องทบทวนแผนตรวจสอบเชิงกลยุทธ์และแผนประจำปี \"อย่างน้อยปีละ 1 ครั้ง หรือเมื่อมีเหตุการณ์สำคัญ\" (เช่น มีหน่วยงานภายนอกอย่าง สตง. เข้ามาตรวจเรื่องเดียวกัน จึงต้องปรับแผนเพื่อลดความซ้ำซ้อน)"]}},
  {id:"3.3",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การวางแผนการปฏิบัติงานตรวจสอบในรายละเอียด",w:5.0,s68:2.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินกระบวนการเตรียมความพร้อม \"ก่อนการลงพื้นที่ตรวจสอบ (Fieldwork)\" โดยเริ่มตั้งแต่การทำความเข้าใจกระบวนการของหน่วยรับตรวจผ่าน Flowchart การเจาะลึกประเมินความเสี่ยงและโอกาสเกิดการทุจริตในระดับกิจกรรม เพื่อออกแบบแนวทางการตรวจสอบ (Audit Program) ที่รัดกุม ประเมินความโปร่งใสและให้เวลาหน่วยรับตรวจเตรียมตัวโดยการแจ้งล่วงหน้าไม่น้อยกว่า 60 วัน ไปจนถึงความก้าวหน้าในการนำเทคโนโลยี (Data Analytics) มาวิเคราะห์ข้อมูลเชิงลึกก่อนเข้าตรวจ และการทบทวนกระบวนการเตรียมตัวอย่างต่อเนื่อง","มีการกำหนดแนวทางในการจัดทำแผนการตรวจสอบภายในในรายละเอียด โดยแผนการตรวจสอบภายในในรายละเอียดเป็นลายลักษณ์อักษร","หน่วยตรวจสอบภายในสอบทานและ/หรือจัดทำทางเดินของงาน (Flow Chart) ของกิจกรรมหลักและกิจกรรมสนับสนุน พร้อมทั้งมีการประเมินความเป็นไปได้ของการเกิดทุจริต และวิธีการในการบริหารจัดการความเสี่ยงของการทุจริตขององค์กร และมีการกำหนดแนวทางการตรวจสอบสำหรับการปฏิบัติงานตรวจสอบทุกเรื่อง","หน่วยตรวจสอบภายในมีการแจ้งแผนการปฏิบัติงานตรวจสอบล่วงหน้าอย่างเป็นทางการไม่น้อยกว่า 60 วัน ให้หน่วยรับตรวจทราบ มีการจัดทำแนวทางการตรวจสอบ (Audit Program) ตามความเสี่ยงทุกเรื่องตามแผนตรวจสอบประจำปี และมีการสอบทานและอนุมัติแนวทางการตรวจสอบ (Audit Program) ตามลำดับชั้นของการปฏิบัติงานตรวจสอบ","การนำระบบเทคโนโลยีสารสนเทศมาใช้ในการวิเคราะห์ข้อมูล เพื่อสนับสนุนการปฏิบัติตามแผนการปฏิบัติงานตรวจสอบ (Audit Program) ให้มีประสิทธิภาพ","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงกระบวนการวางแผนตรวจสอบภายในในรายละเอียด เพื่อเพิ่มประสิทธิภาพในการปฏิบัติงานตรวจสอบ"],good:["การประเมินความเสี่ยงระดับกิจกรรมและการทุจริต: กทท. มีการสอบทานและจัดทำทางเดินของงาน (Control Flowchart) สำหรับกิจกรรมหลักและกิจกรรมสนับสนุน พร้อมทั้งมีการประเมินความเสี่ยงด้านการทุจริตรายกิจกรรม (Fraud Risk) อย่างเป็นระบบ","การจัดทำ Audit Program ที่รัดกุม: มีการจัดทำแนวทางการตรวจสอบ (Audit Program) ตามความเสี่ยงครบทุกเรื่อง และผ่านการสอบทานอนุมัติตามลำดับชั้นอย่างเคร่งครัด","การแจ้งล่วงหน้าตามเกณฑ์: มีการแจ้งแผนการปฏิบัติงานตรวจสอบล่วงหน้าอย่างเป็นทางการให้หน่วยรับตรวจทราบไม่น้อยกว่า 60 วัน ผ่านระบบสารบรรณอิเล็กทรอนิกส์และ Intranet"],gaps:["ระบบ IT สนับสนุนงานตรวจสอบยังไม่พร้อมใช้งาน: แม้จะมีการลงนาม MOU กับ ธอส. เพื่อนำระบบ A2S มาใช้ แต่ปัจจุบันระบบยังอยู่ระหว่างการจัดซื้อจัดจ้างและยังไม่ได้ใช้งานจริง ทำให้การนำเทคโนโลยีมาช่วยวิเคราะห์ข้อมูล (Data Analytics) เพื่อสนับสนุนการวางแผนในรายละเอียดไม่เกิดขึ้นจริงในปีที่ประเมิน"],results:["ระดับ 1: มีการกำหนดแนวทางการจัดทำแผนการตรวจสอบในรายละเอียดเป็นลายลักษณ์อักษรไว้ในคู่มือปฏิบัติงาน (P01)","ระดับ 2: จัดทำ Control Flowchart, ประเมินความเสี่ยงระดับกิจกรรม, ประเมินโอกาสเกิดการทุจริตรายกิจกรรม (50%) + ความเสี่ยงกิจกรรมโดยรวม (50%) และกำหนดแนวทางการตรวจสอบ (Audit Program) ครบทุกโครงการ","ระดับ 3: แจ้งแผนล่วงหน้าไม่น้อยกว่า 60 วัน และสอบทาน/อนุมัติ Audit Program ตามลำดับชั้นอย่างครบถ้วน","ระดับ 4 (ตกเกณฑ์): สายตรวจสอบระบุในกระดาษคำตอบว่า มีการจัดเก็บข้อมูลในรูปแบบเอกสารอิเล็กทรอนิกส์ และ อยู่ระหว่างขออนุมัติจัดซื้อจัดจ้างระบบ A2S ซึ่งคาดว่าจะเริ่มใช้งานได้ในปีงบประมาณ 2569","ะดับ 5: ไม่ได้ประเมิน (0 คะแนน)"],tris:["ผู้ประเมิน TRIS ให้คะแนนหยุดอยู่ที่ระดับ 2.0000 และระบุสถานะ Gap ชัดเจนว่า \"คงเดิม: การใช้ IT สนับสนุนแบบครบวงจรยังอยู่ระหว่างติดตั้งระบบ\" ซึ่งหมายความว่าตราบใดที่ระบบเทคโนโลยีสารสนเทศ (เช่น A2S) ยังไม่ถูกเปิดใช้งานจริงเพื่อทำ Data Analytics วิเคราะห์ข้อมูลก่อนลงพื้นที่ตรวจ TRIS จะยังไม่ให้คะแนนผ่านในระดับ 4-5 อย่างเด็ดขาด แม้จะทำ Audit Program ในกระดาษ/Excel ได้ดีแค่ไหนก็ตาม"],suggest:["เร่งรัดการเปิดใช้งานระบบ A2S: ต้องเร่งรัดการติดตั้งและเริ่มใช้งานระบบ A2S (Upgrade Version) ให้เสร็จสิ้นภายในไตรมาส 2-3 ของปี 2569 ตามที่ผู้ประเมินแนะนำ","ประยุกต์ใช้ Data Analytics เบื้องต้น: ในระหว่างที่รอระบบ A2S เสร็จสมบูรณ์ สายตรวจสอบควรนำเครื่องมือวิเคราะห์ข้อมูล (Data Analytics) พื้นฐาน เช่น การใช้ฟังก์ชันขั้นสูงของ Excel หรือ Power BI มาใช้ดึงข้อมูลจากระบบ ERP/SAP ขององค์กร เพื่อใช้วิเคราะห์ความเสี่ยงรายกิจกรรมล่วงหน้าก่อนลงพื้นที่ตรวจสอบจริง"],docs:["Log File / Screen Capture ระบบ A2S: ภาพหน้าจอที่แสดงการนำเข้า (Input) ข้อมูลความเสี่ยงระดับกิจกรรม และการอนุมัติแนวทางการตรวจสอบ (Audit Program) ผ่านระบบ A2S อย่างเต็มรูปแบบ","รายงานการวิเคราะห์ข้อมูล (Data Analytics Report): ตัวอย่างเอกสารการดึงข้อมูลจากฐานข้อมูลของ กทท. มาวิเคราะห์เพื่อหาความผิดปกติ (Anomaly Detection) ก่อนการลงพื้นที่ปฏิบัติงานจริง เพื่อใช้เป็นหลักฐานยืนยันการทำ Data Analytics ในระดับ 4"],bestprac:["รฟม. ได้รับการชื่นชมว่ามีกระบวนการจัดทำ Audit Program ตามความเสี่ยงทุกเรื่อง และมีการสอบทานอนุมัติตามลำดับชั้นอย่างเคร่งครัด","กทท. ดำเนินการคล้าย รฟม. แล้วในเรื่องของการทำเอกสาร Audit Program แต่สิ่งที่ กทท. ต้องผลักดันให้เทียบเท่าหรือเหนือกว่า คือการแสดงให้ TRIS เห็นว่า Audit Program นั้นถูกปรับเปลี่ยนให้ \"ยืดหยุ่น (Agile)\" ตามผลการวิเคราะห์ข้อมูลใหม่ๆ ได้แบบเรียลไทม์เมื่อพบความเสี่ยงระหว่างปี","กทพ. เริ่มนำเทคโนโลยีสารสนเทศมาใช้สนับสนุนการวิเคราะห์ข้อมูลในการปฏิบัติงานตรวจสอบแล้ว ซึ่งตอบโจทย์เกณฑ์ระดับ 4 ได้ดีกว่า กทท. ที่ยังใช้เพียง Excel","ในปี 2569 เมื่อ กทท. ติดตั้งระบบ A2S แล้ว กทท. ควรเขียนในกระดาษคำตอบดักทางไปเลยว่า \"ระบบ A2S ของ กทท. ไม่เพียงแต่รองรับการทำ Audit Program แต่ได้ถูกออกแบบให้เชื่อมโยงกับ 'ฐานข้อมูลการทุจริต (Fraud Database)' ขององค์กร เพื่อให้ระบบแจ้งเตือนความเสี่ยงระดับกิจกรรมได้โดยอัตโนมัติ\""],minReqs:{"1":["คู่มือการปฏิบัติงานตรวจสอบ (IA Manual) หรือเอกสารแนวทางปฏิบัติ ที่มีการระบุขั้นตอนการจัดทำแผนการตรวจสอบในรายละเอียด (เช่น การทำ Flowchart, การทำ Audit Program) ไว้เป็นลายลักษณ์อักษร"],"2":["เอกสารทางเดินของงาน (Control Flowchart) ของทั้งกิจกรรมหลักและกิจกรรมสนับสนุนในโครงการที่จะตรวจ","กระดาษทำการหรือตารางประเมินความเสี่ยงระดับกิจกรรม ที่มีการให้น้ำหนัก/ประเมิน \"ความเป็นไปได้ของการเกิดการทุจริต (Fraud Risk)\"","แนวทางการตรวจสอบ (Audit Program) ที่ครอบคลุมความเสี่ยงครบทุกเรื่องตามแผนตรวจสอบประจำปี"],"3":["หนังสือแจ้งแผนการปฏิบัติงานตรวจสอบล่วงหน้า (พร้อมหลักฐานวันส่ง เช่น วันที่ในระบบสารบรรณ) ที่ยืนยันว่าส่งให้หน่วยรับตรวจทราบ \"ไม่น้อยกว่า 60 วัน\" ก่อนเข้าตรวจจริง","แนวทางการตรวจสอบ (Audit Program) ที่มีร่องรอย/ลายเซ็นการสอบทานและ \"อนุมัติ\" ตามลำดับชั้นอย่างเคร่งครัดก่อนเริ่มลงพื้นที่"],"4":["หลักฐาน/รายงานการนำระบบเทคโนโลยีสารสนเทศ (เช่น ระบบ A2S, Power BI, หรือฟังก์ชัน Data Analytics ใน Excel) มาใช้วิเคราะห์ข้อมูลประชากรล่วงหน้า เพื่อสนับสนุนการปรับแต่ง Audit Program ให้มีประสิทธิภาพและมุ่งเป้าได้แม่นยำขึ้น"],"5":["รายงานการประชุมหรือบันทึกข้อความ ที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จากการลงพื้นที่จริง มาวิเคราะห์เพื่อปรับปรุง \"กระบวนการวางแผนในรายละเอียด\" ในรอบปีถัดไป (เช่น การปรับแบบฟอร์ม Audit Program หรือปรับปรุงวิธีการส่งหนังสือแจ้งล่วงหน้า)"]},subComps:{"2":["ข้อบังคับด้านการประเมินการทุจริต การทำ Audit Program จะสมบูรณ์ได้ ผู้ตรวจสอบต้องแยกการประเมิน \"ความเป็นไปได้ของการเกิดทุจริต (Fraud Risk)\" ออกมาวิเคราะห์ในระดับกิจกรรมให้เห็นอย่างเป็นรูปธรรม ไม่ใช่แค่ประเมินความเสี่ยงทั่วไป"],"3":["องค์ประกอบบังคับของการแจ้งล่วงหน้า 60 วัน : เกณฑ์ระบุวัตถุประสงค์ซ่อนไว้ว่า หนังสือแจ้งล่วงหน้า 60 วัน ต้องมีเนื้อหาเบื้องต้นให้หน่วยรับตรวจทราบอย่างเพียงพอ ได้แก่ 1) วัตถุประสงค์การตรวจสอบ 2) ขอบเขตการตรวจสอบ 3) จุดมุ่งเน้น 4) ระยะเวลาเข้าตรวจ และ 5) ขอบเขตเอกสารเบื้องต้นที่ต้องเตรียม","ข้อยกเว้นกฎ 60 วัน : การนับเวลาแจ้งล่วงหน้า 60 วัน จะ \"ไม่นับรวม\" งานตรวจสอบประเภทพิเศษ (Special Audit) เช่น งานที่ได้รับมอบหมายด่วนจากบอร์ด/ผู้บริหารสูงสุด, งานที่ขยายขอบเขตฉุกเฉิน, และงานตรวจแบบไม่แจ้งล่วงหน้า (Surprise Check)"],"4":["ความสำคัญของ Data Analytics การใช้ \"IT วิเคราะห์ข้อมูล\" ในระดับ 4 ไม่ใช่แค่การมีระบบคอมพิวเตอร์เก็บเอกสาร แต่ต้องเป็นการนำเครื่องมือมา \"วิเคราะห์ข้อมูล (Data Analytics)\" เบื้องต้นก่อนลงพื้นที่ (เช่น การตรวจหาความผิดปกติของข้อมูลประชากรทั้งหมด) เพื่อช่วยกำหนด Audit Program ให้มีประสิทธิภาพ (ซึ่งจุดนี้คือสาเหตุที่ กทท. ยังติด Gap และได้คะแนนหยุดที่ 2.0000 ในรอบปีที่ผ่านมา เนื่องจากระบบยังอยู่ระหว่างการติดตั้ง)"]}},
  {id:"3.4",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การปฏิบัติงานตรวจสอบ",w:15.0,s68:3.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินประสิทธิภาพในขั้นตอน \"การลงพื้นที่ปฏิบัติงาน (Fieldwork)\" โดยพิจารณาตั้งแต่การเลือกใช้เครื่องมือ/วิธีการตรวจสอบ (Audit Tools) ที่เหมาะสม การบันทึกหลักฐานและร่องรอยการตรวจสอบลงในกระดาษทำการ (Working Papers) อย่างครบถ้วน การสรุปผลเบื้องต้น (Memo) ที่สามารถเชื่อมโยงอ้างอิงกลับไปยังกระดาษทำการหลักและย่อยได้อย่างเป็นระบบ (Cross-reference) การสอบทานงานโดยหัวหน้าทีม การใช้เทคโนโลยีสารสนเทศเข้ามายกระดับการจัดการกระดาษทำการ ไปจนถึงการนำปัญหาและข้อผิดพลาดหน้างานมาทบทวนปรับปรุงกระบวนการปฏิบัติงานตรวจสอบให้รัดกุมยิ่งขึ้นในรอบถัดไป","มีการกำหนดวิธีการตรวจสอบ (Audit Tools) สอดคล้องกับวัตถุประสงค์การตรวจสอบครบถ้วน","ดำเนินการตรวจสอบครบทุกวิธีการตรวจสอบที่กำหนดในแนวทางการตรวจสอบ พร้อมทั้งมีการจัดทำกระดาษทำการรองรับทุกวิธีการตรวจสอบ","มีการสรุปผลการปฏิบัติงานเบื้องต้น (การจัดทำ Memo สรุปผล) ครบถ้วนทุกประเด็น พร้อมทั้งสามารถเชื่อมโยงระหว่าง แนวทางการตรวจสอบ กับ กระดาษทำการได้ครบ อีกทั้งสามารถเชื่อมโยงระหว่างกระดาษทำการหลัก กับ กระดาษทำการย่อยได้ครบถ้วน","มีการสอบทานการปฏิบัติงานอย่างเป็นระบบ และมีการนำระบบเทคโนโลยีมาช่วยสนับสนุนการปฏิบัติงาน","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงกระบวนการปฏิบัติงานตรวจสอบภายใน"],good:["การกำหนดเครื่องมือและกระดาษทำการ (Working Papers) ที่เป็นระบบ: ทีมตรวจสอบมีการกำหนด Audit Tools ที่สอดคล้องกับวัตถุประสงค์ครบถ้วน โดยระบุประชากร (Population) จำนวนตัวอย่าง (Sample Size) และวิธีการสุ่มตัวอย่างที่ชัดเจน","การเชื่อมโยงข้อมูลอย่างสมบูรณ์: สามารถเชื่อมโยงระหว่าง Audit Program กับกระดาษทำการ และเชื่อมโยงกระดาษทำการหลักกับกระดาษทำการย่อยได้อย่างครบถ้วน","การประเมินระดับข้อบกพร่อง (Issue Rating): กทท. มีความโดดเด่นในการนำผลการตรวจสอบเบื้องต้นมาประเมินระดับความสำคัญของข้อบกพร่อง (Issue Rating) โดยวิเคราะห์จากรากสาเหตุ (Root Cause) และผลกระทบต่อวัตถุประสงค์อย่างชัดเจนก่อนจัดทำ Memo สรุปผล"],gaps:["การใช้เทคโนโลยี (IT) เข้ามาจัดการกระดาษทำการ: การจัดเก็บกระดาษทำการของ กทท. ยังคงเป็นรูปแบบการจัดเก็บเอกสารในแฟ้ม และจัดเก็บเป็น File อิเล็กทรอนิกส์ในคอมพิวเตอร์ส่วนกลางของฝ่ายตรวจสอบ ระบบเทคโนโลยีแบบครบวงจร (A2S) ยังอยู่แค่ขั้นตอนการขออนุมัติจัดซื้อจัดจ้าง ทำให้ยังไม่เกิดกระบวนการ \"Digital Audit\" จริงๆ ในระดับปฏิบัติการ"],results:["ระดับ 1: กำหนดวิธีการตรวจสอบ (Audit Tools) ครบถ้วน โดยอ้างอิงวัตถุประสงค์ ขอบเขต และผู้รับผิดชอบชัดเจน","ระดับ 2: ตรวจสอบครบทุกวิธีตามที่กำหนด และจัดทำ \"กระดาษทำการ\" โดยระบุหมายเลขอ้างอิง แหล่งข้อมูล วันที่จัดทำ และมีการลงนามสอบทานจากหัวหน้าทีมอย่างเคร่งครัด","ระดับ 3: สรุปผลการปฏิบัติงานเบื้องต้น (Memo) ครบทุกประเด็น เชื่อมโยงหลักฐานหลักและย่อยได้สมบูรณ์ และมีระบบประเมิน Issue Rating","ระดับ 4 (สอบตกในจุดนี้): กทท. ระบุในกระดาษคำตอบว่ามี \"การสอบทานงานเป็นระบบ\" โดยเก็บเป็น File ในโฟลเดอร์กลาง แต่ในประเด็น \"การนำระบบเทคโนโลยีมาช่วยสนับสนุน\" กทท. ต้องยอมรับตามตรงว่าระบบสนับสนุนงานตรวจสอบ (A2S) จาก ธอส. ยังอยู่ระหว่างจัดซื้อจัดจ้าง คาดว่าจะเริ่มใช้งานได้ในปี 2569"],tris:["ผู้ประเมินรับรองความครบถ้วนของกระบวนการทำงานในระดับ 1-3 อย่างไร้ข้อกังขา (คะแนนจึงได้ 3.0000) แต่สาเหตุที่ด่านระดับ 4 ไม่ผ่าน เนื่องจากเกณฑ์กำหนดชัดเจนว่าต้อง \"มีการนำระบบเทคโนโลยีมาช่วยสนับสนุนการปฏิบัติงาน\" การเก็บไฟล์เอกสาร (Word/Excel) ลงในไดรฟ์ส่วนกลาง (Shared Drive) ไม่ถือว่าเป็น Audit System ที่แท้จริง TRIS จึงระบุ Gap ในภาพรวมการปฏิบัติงานไว้ว่า \"การใช้ IT สนับสนุนแบบครบวงจรยังอยู่ระหว่างติดตั้งระบบ\""],suggest:["ปฏิบัติงานผ่านระบบ A2S 100%: เมื่อระบบ A2S ติดตั้งแล้วเสร็จ ทีมตรวจสอบต้องใช้ระบบนี้ในขั้นตอน \"Fieldwork\" อย่างเต็มรูปแบบ เช่น การสร้างกระดาษทำการแบบออนไลน์ การแนบหลักฐาน (Evidence) เข้าระบบ และการให้หัวหน้าทีมกดอนุมัติ (Approve) ผ่านระบบโดยตรง","สร้าง Memo อัตโนมัติ: นำเสนอให้เห็นว่าระบบสามารถดึงข้อมูลจากกระดาษทำการไปสร้างเป็น Memo สรุปผลเบื้องต้นได้โดยอัตโนมัติ เพื่อลดข้อผิดพลาดของมนุษย์ (Human Error)","กทท. ไม่ควรเขียนกระดาษคำตอบในปี 69 แค่ว่า \"กทท. มีระบบ A2S แล้วเหมือนกัน\" แต่ควรเขียนพุ่งเป้าไปที่การเก็บคะแนนสูงแทน ดังนี้ \"กทท. ไม่เพียงใช้งานระบบ A2S ในการทำกระดาษทำการอย่างครบวงจร (ระดับ 4) แต่สายตรวจสอบยังได้นำ 'ข้อมูลป้อนกลับ (Feedback) ระหว่างการลงพื้นที่ปฏิบัติงาน' มาปรับปรุงและเพิ่ม 'วิธีการตรวจสอบ (Audit Tools) ใหม่ๆ' ลงไปในฐานข้อมูลของระบบ A2S ทันที เพื่อยกระดับความรวดเร็วแม่นยำในการปฏิบัติงานตรวจสอบโครงการลักษณะเดียวกันในครั้งถัดไป (Continuous Improvement)\""],docs:["ภาพหน้าจอ (Screen Capture) จากระบบ A2S (Module การปฏิบัติงาน): ที่แสดงให้เห็นการบันทึกกระดาษทำการ การเชื่อมโยงหมายเลขอ้างอิง และร่องรอยการอนุมัติ (Audit Trail) ผ่านระบบของหัวหน้าทีม","Memo สรุปผลเบื้องต้น (System-Generated): ตัวอย่าง Memo ที่ถูกดึง (Export) ออกมาจากระบบสารสนเทศ A2S โดยตรง เพื่อยืนยันการทำระดับ 4 อย่างสมบูรณ์"],bestprac:["กทพ. ได้คะแนนในส่วนนี้ดีมาก เพราะ กทพ. ได้ \"นำระบบเทคโนโลยีสารสนเทศมาสนับสนุนการปฏิบัติงานตรวจสอบภายในตั้งแต่การวางแผน การปฏิบัติงาน การสอบทาน ไปจนถึงการจัดทำรายงาน\" อย่างครบวงจร ซึ่งช่วยยกระดับความน่าเชื่อถือของกระบวนการในภาพรวม","ฟม. ทำกระบวนการเหมือน กทท. เป๊ะ (กำหนด Audit Tools, สรุป Memo, โยงกระดาษทำการหลัก/ย่อย) แต่ รฟม. มีการใช้ระบบเทคโนโลยีสารสนเทศเข้ามาช่วยสนับสนุนการปฏิบัติงานแล้ว ทำให้ผ่านระดับ 4 ได้","จากข้อมูล Best Practice จะเห็นว่า กทพ. และ รฟม. ใช้ระบบ IT ได้แล้ว (ผ่านระดับ 4) แต่ TRIS ยังให้ข้อแนะนำกับทั้งสององค์กรว่า \"ควรมีการใช้ข้อมูลป้อนกลับ (Feedback) จากการดำเนินงาน มาช่วยในการปรับปรุงกระบวนการตรวจสอบภายใน\" ซึ่งก็คือ ระดับ 5 ที่คู่เทียบยังทำไม่สำเร็จสมบูรณ์"],minReqs:{"1":["เอกสารแนวทางการตรวจสอบ (Audit Program) ที่มีการกำหนด \"วิธีการตรวจสอบ (Audit Tools)\" อย่างชัดเจน สอดคล้องกับวัตถุประสงค์ (เช่น ระบุจำนวนประชากร ขนาดกลุ่มตัวอย่าง และวิธีการสุ่มตัวอย่าง)"],"2":["กระดาษทำการ (Working Papers) ของทุกโครงการ/ทุกเรื่องที่ระบุใน Audit Program ที่บันทึกร่องรอยและผลการตรวจสอบครบถ้วนสอดคล้องกับวิธีการตรวจสอบที่กำหนดไว้"],"3":["บันทึกข้อความ/เอกสารสรุปผลการปฏิบัติงานเบื้องต้น (Memo สรุปผล) ที่ระบุประเด็นข้อตรวจพบครบถ้วน","ร่องรอยการอ้างอิงไขว้ (Cross-reference) ในเอกสาร ที่แสดงการเชื่อมโยงอ้างอิงระหว่าง Audit Program ไปยังกระดาษทำการหลัก และเชื่อมโยงไปยังกระดาษทำการย่อย (Supporting Evidence) ได้ครบถ้วน"],"4":["ใบสอบทานการปฏิบัติงาน (Check List / Review Form) ที่มีลายมือชื่อสอบทานจากหัวหน้าทีมและผู้ควบคุมงานกำกับไว้ในกระดาษทำการอย่างเป็นระบบ","ภาพหน้าจอ (Screen Capture) หรือเอกสารยืนยันจากระบบเทคโนโลยีสารสนเทศ (เช่น ระบบ A2S) ที่แสดงให้เห็นการนำระบบ IT มาใช้บันทึก จัดเก็บ และสนับสนุนการทำกระดาษทำการ"],"5":["รายงานการประชุมหรือบันทึกข้อความ ที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จากการลงพื้นที่ตรวจสอบ หรือผลการสอบทานกระดาษทำการ มาวิเคราะห์เพื่อปรับปรุง \"กระบวนการปฏิบัติงานตรวจสอบ\" (เช่น ปรับปรุงแบบฟอร์มกระดาษทำการ หรือ วิธีการสุ่มตัวอย่าง)"]},subComps:{"1":["ความสมบูรณ์ของการกำหนดวิธีตรวจสอบ (Audit Tools) : การกำหนดวิธีการตรวจจะไม่สมบูรณ์หากไม่ระบุรายละเอียดเชิงปริมาณให้ชัดเจน โดยผู้ประเมินคาดหวังให้มีการระบุข้อมูล เช่น จำนวนประชากรทั้งหมด (Population) จำนวนตัวอย่างที่สุ่ม (Sample Size) และวิธีการสุ่มตัวอย่างที่ใช้ เพื่อยืนยันความน่าเชื่อถือของผลตรวจ"],"2":["องค์ประกอบบังคับของกระดาษทำการ : กระดาษทำการที่ผ่านเกณฑ์ต้องมีองค์ประกอบพื้นฐานครบถ้วน ได้แก่ หมายเลขอ้างอิง, ชื่อผู้จัดทำและผู้สอบทานพร้อมวันที่, แหล่งข้อมูล, วัตถุประสงค์, วิธีการตรวจสอบ, เครื่องหมายในการตรวจสอบ (Tick mark), ข้อสรุปผลการตรวจสอบ, และการระบุรากสาเหตุ (Root Cause)/ผลกระทบ"],"3":["ระบบการอ้างอิงไขว้ (Cross-Reference Indexing) คำว่า \"เชื่อมโยง\" ไม่ได้หมายถึงแค่การแนบเอกสารไว้ด้วยกัน แต่กระดาษทำการต้องมีระบบดัชนี (Indexing) เช่น การใส่รหัสอ้างอิง (Reference No.) ที่ทำให้ผู้อ่านสามารถสืบค้นย้อนกลับจาก Memo สรุปผล ไปยังกระดาษทำการหลัก และเจาะลึกลงไปยังหลักฐานในกระดาษทำการย่อยได้อย่างต่อเนื่องโดยไม่ขาดตอน","ระดับความสำคัญของข้อตรวจพบ (Issue Rating) ในการสรุปผลการปฏิบัติงานเบื้องต้น (Memo) นอกจากการระบุข้อบกพร่องแล้ว ผู้ตรวจสอบควรมีการประเมินระดับความสำคัญของข้อบกพร่อง (Issue Rating) ที่ตรวจพบ โดยพิจารณาจากผลกระทบที่อาจเกิดกับวัตถุประสงค์องค์กร เพื่อให้ผู้บริหารจัดลำดับความสำคัญในการแก้ไขปัญหาได้"],"4":["การใช้ IT สนับสนุนแบบครบวงจร : การใช้ Word/Excel แล้วบันทึกไฟล์ (Save) ลงในคอมพิวเตอร์ส่วนกลางหรือ Share Drive อาจยังไม่เพียงพอต่อการผ่านระดับ 4 แบบสมบูรณ์ในมุมมองผู้ประเมิน แต่เกณฑ์ซ่อนความคาดหวังถึงการมี \"ระบบสนับสนุนงานตรวจสอบ (Audit System)\" (เช่น ระบบ A2S) ที่สามารถบริหารจัดการกระดาษทำการแบบดิจิทัล และบันทึกร่องรอยการสอบทาน/อนุมัติ (Audit Trail) ในระบบได้โดยตรง"]}},
  {id:"3.5",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การสรุปผลการตรวจสอบและการจัดทำรายงาน",w:15.0,s68:2.2589,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินประสิทธิภาพใน \"ช่วงท้าย\" ของกระบวนการตรวจสอบ เริ่มตั้งแต่ความรัดกุมรอบคอบในการสรุปข้อเท็จจริง การจัดการประชุมเปิด-ปิดตรวจ การออกแบบรายงานที่สอดคล้องกับความต้องการของผู้บริหาร ความรวดเร็วในการส่งรายงานตามกรอบเวลา (SLA) ไปจนถึงความลึกซึ้งของเนื้อหารายงานที่ต้องมี \"การวิเคราะห์รากสาเหตุ (Root Cause Analysis)\" และ \"ให้ข้อเสนอแนะเชิงกลยุทธ์เชิงป้องกัน\" เพื่อสร้างมูลค่าเพิ่ม (Value-Added) รวมถึงการนำข้อผิดพลาดไปถอดบทเรียนเป็นองค์ความรู้เผยแพร่สู่องค์กร (KM)","การกำหนดแนวทางในการปฏิบัติงานตรวจสอบด้วยความระมัดระวังรอบคอบมีความครบถ้วน","ผู้ตรวจสอบดำเนินการปฏิบัติงานตรวจสอบด้วยความระมัดระวังรอบคอบเยี่ยงผู้ประกอบวิชาชีพตามแนวทางที่กำหนดอย่างครบถ้วน","การปฏิบัติงานตรวจสอบด้วยความระมัดระวังรอบคอบสอดคล้องกับมาตรฐานวิชาชีพ การนำเทคโนโลยีและเทคนิคการวิเคราะห์ข้อมูลอื่นๆ เข้ามาช่วย ในการปฏิบัติงานตรวจสอบ","หน่วยตรวจสอบภายในสามารถให้ข้อเสนอแนะในเชิงกลยุทธ์ และสามารถสร้างมูลค่าเพิ่มให้กับองค์กรได้รวมถึงการสรุปประเด็นจากการตรวจสอบเป็นองค์ความรู้ตามกระบวนการจัดการความรู้ เพื่อนำไปสู่การแลกเปลี่ยนเรียนรู้ทั้งภายในหน่วยตรวจสอบภายในและองค์ความรู้ขององค์กร","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงแนวทางในการปฏิบัติงานตรวจสอบด้วยความระมัดระวังรอบคอบ (การกำหนดวิธีการตรวจสอบ เครื่องมือการตรวจสอบ แนวทางในการติดตามการปฏิบัติงานตามข้อเสนอแนะ) เพื่อให้การปฏิบัติงานตรวจสอบมีประสิทธิภาพเพิ่มขึ้น"],good:["การสร้างมูลค่าเพิ่ม (Value-Added) เชิงประจักษ์ในบางโครงการ: กทท. สามารถสรุปผลและให้ข้อเสนอแนะที่สร้างผลกระทบเชิงบวกระดับองค์กรได้สำเร็จ เช่น การตรวจสอบด้าน GRC และ IT ที่นำไปสู่การผลักดันให้เกิดโครงสร้าง DCIO/CISO และการแก้ปัญหาระบบเบิก OT ซ้ำซ้อนโดยการฝังระบบแจ้งเตือน (Alert)","การรายงานผลตามกรอบเวลา: มีการรายงานผลการตรวจสอบเบื้องต้น (Memo) ให้หน่วยรับตรวจทราบ และรายงานผลฉบับสมบูรณ์ต่อคณะกรรมการตรวจสอบและผู้บริหารสูงสุดได้อย่างครบถ้วนตามกรอบเวลา","การถอดบทเรียนเป็นองค์ความรู้: มีการสรุปประเด็นข้อสังเกตจาก สตง. (เช่น เรื่อง พ.ร.บ. จัดซื้อจัดจ้าง) มาจัดทำเป็นองค์ความรู้ (AAR) และเผยแพร่ผ่านช่องทาง Line และ Intranet ให้พนักงานรับทราบ"],gaps:["ขาดการวิเคราะห์รากสาเหตุ (Root Cause Analysis): รายงานการตรวจสอบส่วนใหญ่ยังเน้นการระบุ \"ข้อตรวจพบ (Finding)\" และบอกให้แก้ไข แต่ยังขาดการวิเคราะห์เจาะลึกไปถึงสาเหตุที่แท้จริงที่ทำให้เกิดระบบควบคุมที่หละหลวมนั้น","ข้อเสนอแนะยังเป็น \"เชิงรับ (Reactive)\": TRIS เน้นย้ำว่า ข้อเสนอแนะในรายงานของ กทท. ยังมีลักษณะการตามแก้ไขปัญหา ลงโทษ หรือเรียกเงินคืน มากกว่าการให้ข้อเสนอแนะที่เป็น \"การควบคุมเชิงป้องกัน (Preventive Control)\" เพื่ออุดช่องโหว่ก่อนเกิดความผิดพลาดซ้ำ"],results:["ระดับ 1: มีการกำหนดแนวทางในการปฏิบัติงานตรวจสอบ สรุปผล และรายงานผลด้วยความระมัดระวังรอบคอบ ไว้ในกฎบัตรและคู่มือการปฏิบัติงานอย่างครบถ้วน","ระดับ 2: ผู้ตรวจสอบดำเนินการเปิด-ปิดการตรวจสอบ และรายงานผลการตรวจสอบภายในต่อผู้บริหารหน่วยรับตรวจ ผู้บริหารสูงสุด และคณะกรรมการตรวจสอบได้ตามแนวทางที่กำหนด","ระดับ 3: ปฏิบัติงานสอดคล้องกับมาตรฐานวิชาชีพ และระบุว่ามีการนำเทคโนโลยี/เทคนิควิเคราะห์ข้อมูลเข้ามาช่วย (แต่ระบบ A2S ยังไม่เสร็จสมบูรณ์)","ระดับ 4: สายตรวจสอบให้ข้อเสนอแนะเชิงกลยุทธ์ที่สร้างมูลค่าเพิ่ม (Value-Added) และมีการสรุปประเด็นจากการตรวจสอบเป็นองค์ความรู้เพื่อแลกเปลี่ยนเรียนรู้ภายในองค์กร","ระดับ 5: มีการใช้ข้อมูลป้อนกลับเพื่อทบทวนและปรับปรุงคู่มือปฏิบัติงานกว่า 10 รายการ เช่น การปรับปรุงจรรยาบรรณ เพิ่มแบบฟอร์มสอบถามผู้บริหาร และปรับระบบบันทึกเวลา (Timesheet)"],tris:["กทท. ให้คะแนนตนเองในกระดาษคำตอบถึงระดับ 5 แต่ TRIS กดคะแนนลงมาเหลือเพียง 2.2589 เนื่องจากผู้ประเมินตรวจพบ Gap สำคัญใน \"คุณภาพของเนื้อหารายงาน\" โดยระบุว่า \"ผู้ตรวจสอบภายในยังต้องพัฒนาความสามารถในการวิเคราะห์หาสาเหตุที่แท้จริงและผลกระทบของจุดอ่อน... เพื่อมอบข้อเสนอแนะเชิงกลยุทธ์ที่จะนำไปสู่การป้องกันไม่ให้เกิดข้อผิดพลาดซ้ำ\" . การขาดการวิเคราะห์ Root Cause อย่างเป็นระบบ ทำให้รายงานของ กทท. ไม่สามารถก้าวข้ามจากการตรวจแบบ Compliance ไปสู่การเป็นที่ปรึกษาเชิงป้องกัน (Preventive) ได้อย่างแท้จริง"],suggest:["ปรับแก้แบบฟอร์มรายงาน (Report Template) ทันที: กทท. ต้องนำแนวคิดนี้ไปปรับโครงสร้างรูปแบบรายงานการตรวจสอบใหม่ โดยบังคับให้ต้องมีหัวข้อ \"การวิเคราะห์รากสาเหตุ (Root Cause)\" และหัวข้อ \"ข้อเสนอแนะเชิงป้องกัน (Preventive Recommendations)\" ลงไปในรายงานอย่างเป็นทางการ ซึ่งถือเป็น Quick Win ที่ลงทุนต่ำแต่ได้ผลทันที","ไม่ต้องเขียนถึงขั้นสร้างนวัตกรรมใหม่: ในการตอบคำถาม TRIS ปี 69 กทท. ไม่จำเป็นต้องอ้างถึงการสร้างนวัตกรรมระดับองค์กรที่ซับซ้อน แต่ให้เขียนอธิบายว่า \"IA ตรวจพบปัญหาแล้วไม่ได้แค่บอกให้แก้ แต่ได้วิเคราะห์สาเหตุที่แท้จริงลงไปในรายงานด้วย เพื่อให้หน่วยรับตรวจแก้ที่ต้นเหตุ\""],docs:["ตัวอย่างรายงานผลการตรวจสอบ (Audit Report ฉบับที่ดีที่สุด): ที่แสดงให้เห็นหัวข้อการวิเคราะห์สาเหตุ (Root Cause) และผลกระทบอย่างชัดเจน พร้อมข้อเสนอแนะเชิงป้องกัน","คู่มือการปฏิบัติงานฉบับปรับปรุง: ที่มีการระบุให้นำกระบวนการ Root Cause Analysis มาเป็นข้อบังคับในการสรุปผลเบื้องต้น (Memo) และรายงานฉบับสมบูรณ์"],bestprac:["รฟม. มีจุดเด่นในการ \"ใช้ข้อมูลป้อนกลับจากการดำเนินงาน มาทบทวนกระบวนการปฏิบัติงานร่วมกับหน่วยรับตรวจ\" นั่นหมายความว่า การสรุปรายงานของ รฟม. ไม่ได้เกิดจากมุมมองของ IA ฝ่ายเดียว แต่เกิดจากการตกผลึกสาเหตุร่วมกับหน่วยรับตรวจ ทำให้รายงานเป็นที่ยอมรับและแก้ไขได้จริง","กทพ. ได้รับคำชมจาก TRIS เรื่องการ \"นำระบบเทคโนโลยีสารสนเทศมาสนับสนุนการปฏิบัติงานตรวจสอบภายในตั้งแต่การวางแผน การปฏิบัติงาน การสอบทาน ไปจนถึงการจัดทำรายงาน\" ระบบ IT ช่วยให้การดึงข้อมูลจากกระดาษทำการมาสร้างเป็นรายงานมีความถูกต้อง ลดความผิดพลาด และมองเห็นภาพรวมความเสี่ยงได้ชัดเจน","กทท. สามารถนำแนวทางของ รฟม. และ กทพ. มาผนวกกำลังกันได้ โดยในปี 69 กทท. ควรนำเสนอต่อ TRIS ว่า: \"สายตรวจสอบ กทท. ได้นำ ระบบ A2S มาใช้ในการดึงข้อมูลจากกระดาษทำการเพื่อออกรายงานสรุปผลเบื้องต้นโดยอัตโนมัติ (Automated Reporting) เพื่อความแม่นยำ และได้เพิ่มกระบวนการประชุมร่วมกับหน่วยรับตรวจเพื่อวิเคราะห์ Root Cause ลงในระบบ A2S ทันที ทำให้ข้อเสนอแนะที่ส่งให้ผู้บริหารสูงสุด เป็นข้อเสนอแนะเชิงป้องกันที่ผ่านการตกลงร่วมกันและสามารถอุดช่องโหว่ได้จริงอย่างยั่งยืน\""],minReqs:{"1":["กฎบัตรหรือคู่มือการปฏิบัติงานตรวจสอบภายใน ที่ระบุ \"แนวทางปฏิบัติงานด้วยความระมัดระวังรอบคอบเยี่ยงผู้ประกอบวิชาชีพ\" ไว้อย่างชัดเจน โดยต้องครอบคลุม 4 เรื่องหลัก คือ 1) การปฏิบัติงานและสอบทาน 2) การสื่อสาร/รายงานผล 3) รูปแบบรายงาน 4) การติดตามผล"],"2":["วาระและรายงานการประชุม \"เปิด-ปิดการตรวจสอบ (Entrance/Exit Meeting)\" ของทุกโครงการ","รายงานผลการตรวจสอบ (Audit Report) ฉบับสมบูรณ์ที่มีองค์ประกอบครบถ้วนตามความต้องการของผู้บริหาร (เช่น มีบทคัดย่อผู้บริหาร, ข้อตรวจพบ, Root Cause, และข้อเสนอแนะ)","เอกสาร/ทะเบียนคุมการติดตามผลการปฏิบัติตามข้อเสนอแนะ"],"3":["หลักฐานที่แสดงให้เห็นการประยุกต์ใช้ \"เทคโนโลยีหรือเทคนิคการวิเคราะห์ข้อมูล\" ในการสนับสนุนการตรวจสอบและการทำรายงาน (เช่น การดึงข้อมูลมาทำ Data Analytics ประกอบรายงาน หรือการใช้ระบบ A2S)","หลักฐานร่องรอยการส่งรายงานผลการตรวจสอบ (เช่น ข้อมูลในระบบสารบรรณ) ที่ยืนยันว่าส่งให้หน่วยรับตรวจ \"ภายใน 7 วัน\" หลังปิดตรวจ และส่งให้คณะกรรมการตรวจสอบ (AC) \"ภายใน 2 เดือน\" หลังตรวจเสร็จ"],"4":["รายงานผลการตรวจสอบ หรือเอกสารสรุปผลงาน ที่มีเนื้อหาสะท้อน \"ข้อเสนอแนะเชิงกลยุทธ์\" และการวิเคราะห์ \"รากสาเหตุ (Root Cause Analysis)\" ที่สามารถสร้างมูลค่าเพิ่มเชิงป้องกันได้อย่างเป็นรูปธรรม","เอกสารสรุปองค์ความรู้ (Knowledge Base) ที่ถอดบทเรียนจากประเด็นข้อตรวจพบ (เช่น ข้อผิดพลาด พ.ร.บ. จัดซื้อจัดจ้างฯ) นำส่งให้ระบบ KM เพื่อเผยแพร่แลกเปลี่ยนเรียนรู้ในองค์กร"],"5":["รายงานการประชุมหรือบันทึกข้อความ ที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จากหน่วยรับตรวจหรือผู้บริหาร มาทบทวนและปรับปรุง \"คู่มือ/แนวทางการสรุปผลและจัดทำรายงาน\" ให้มีประสิทธิภาพยิ่งขึ้นในรอบปีถัดไป (เช่น การปรับ Template รายงานใหม่)"]},subComps:{"1":["องค์ประกอบบังคับของ \"แนวทางปฏิบัติด้วยความระมัดระวัง\" : แนวทางจะครบถ้วนได้ต้องกำหนดกระบวนการ 4 ด้าน คือ 1. การประชุมเปิด/รวบรวมหลักฐาน/สอบทานงาน 2. การประชุมปิด/เปิดเผยข้อเท็จจริง/ส่งรายงานตามกำหนด 3. การออกแบบรูปแบบรายงาน และ 4. การติดตามข้อเสนอแนะ"],"2":["กรอบเวลาบังคับในการส่งรายงาน (SLA) : เกณฑ์ระบุเงื่อนไขด้านเวลาไว้ชัดเจนว่า 1) ต้องรายงานผลการตรวจสอบอย่างทันกาลให้หน่วยรับตรวจทราบ \"เฉลี่ยภายใน 7 วัน\" หลังการประชุมปิดตรวจ 2) หัวหน้า IA ต้องสรุปรายงานเสนอต่อคณะกรรมการตรวจสอบ (AC) \"ไม่เกิน 2 เดือน\" นับจากวันที่ตรวจเสร็จ และหากมีประเด็นทุจริต/เสียหายร้ายแรงต้องรายงานทันที","องค์ประกอบบังคับของ \"แนวทางปฏิบัติด้วยความระมัดระวัง\" : แนวทางจะครบถ้วนได้ต้องกำหนดกระบวนการ 4 ด้าน คือ 1. การประชุมเปิด/รวบรวมหลักฐาน/สอบทานงาน 2. การประชุมปิด/เปิดเผยข้อเท็จจริง/ส่งรายงานตามกำหนด 3. การออกแบบรูปแบบรายงาน และ 4. การติดตามข้อเสนอแนะ"],"3":["กรอบเวลาบังคับในการส่งรายงาน (SLA) : เกณฑ์ระบุเงื่อนไขด้านเวลาไว้ชัดเจนว่า 1) ต้องรายงานผลการตรวจสอบอย่างทันกาลให้หน่วยรับตรวจทราบ \"เฉลี่ยภายใน 7 วัน\" หลังการประชุมปิดตรวจ 2) หัวหน้า IA ต้องสรุปรายงานเสนอต่อคณะกรรมการตรวจสอบ (AC) \"ไม่เกิน 2 เดือน\" นับจากวันที่ตรวจเสร็จ และหากมีประเด็นทุจริต/เสียหายร้ายแรงต้องรายงานทันที"],"4":["คุณภาพของข้อเสนอแนะต้องถึงระดับ Root Cause การจะผ่านระดับ 4 ผู้ประเมินเน้นย้ำว่า IA ต้องไม่แค่รายงาน \"ข้อตรวจพบ (Finding)\" แล้วสั่งให้แก้ แต่ต้องวิเคราะห์เจาะลึกลงไปหา \"สาเหตุที่แท้จริง (Root Cause Analysis)\" และให้ข้อเสนอแนะที่เป็น \"การควบคุมเชิงป้องกัน (Preventive Control)\" เพื่ออุดช่องโหว่ไม่ให้เกิดซ้ำ","การแปลงรายงานสู่ KM งานตรวจสอบไม่จบแค่การทำรายงานส่งผู้บริหาร แต่เกณฑ์ซ่อนความคาดหวังว่า IA ต้องคัดกรองประเด็นที่พบเจอบ่อยๆ นำมา \"ถอดบทเรียนเป็นองค์ความรู้\" ตามกระบวนการ KM และนำไปเผยแพร่เพื่อแลกเปลี่ยนเรียนรู้ทั่วทั้งองค์กร"]}},
  {id:"3.6",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การให้ความเชื่อมั่น",w:10.0,s68:2.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมิน \"ผลสัมฤทธิ์และคุณค่า\" ที่เกิดจากการปฏิบัติงานตรวจสอบ (Assurance Services) ว่าข้อเสนอแนะของสายตรวจสอบครอบคลุมการตรวจสอบทุกประเภท (Financial, Operation, Compliance, Security/IT) และช่วยยกระดับระบบ GRC ขององค์กรได้จริงหรือไม่ ประเมินกระบวนการรับฟังเสียงสะท้อน (Feedback) ผ่านการประเมินความพึงพอใจและความเชื่อมั่นจากคณะกรรมการตรวจสอบและผู้บริหารสูงสุด ตลอดจนความสามารถขั้นสูงในการพิสูจน์ให้เห็นว่า งานตรวจสอบสร้าง \"มูลค่าเพิ่ม (Value-Added)\" และผลักดันการปรับปรุงกระบวนการทำงานในระบบย่อย (Enablers) ทั้ง 7 ด้านขององค์กรได้อย่างประจักษ์ชัด","การตรวจสอบภายในด้านการเงิน ด้านการปฏิบัติงาน และด้านการปฏิบัติตามกฎระเบียบ ข้อบังคับ ช่วยให้เกิดการปรับปรุงประสิทธิภาพ ประสิทธิผล ของการควบคุมภายใน หรือการบริหารความเสี่ยง หรือการกำกับดูแล","การตรวจสอบภายในด้านการเงิน ด้านการปฏิบัติงาน และด้านการปฏิบัติตามกฎระเบียบ ข้อบังคับ ช่วยให้เกิดการปรับปรุงประสิทธิภาพ ประสิทธิผล ของการควบคุมภายใน และการบริหารความเสี่ยง และการกำกับดูแล","การประเมินผลด้านการให้ความเชื่อมั่นของหน่วยตรวจสอบภายใน โดยคณะกรรมการตรวจสอบและผู้บริหารระดับสูง","ผลจากการปฏิบัติงานตรวจสอบด้านการให้ความเชื่อมั่น ทำให้เกิดการเพิ่มมูลค่าและยกระดับกระบวนการปฏิบัติงานของรัฐวิสาหกิจให้บรรลุเป้าหมายหรือวัตถุประสงค์ขององค์กรที่กำหนดไว้ รวมถึงการปรับปรุงการดำเนินงานขององค์กรในด้านต่างๆ ซึ่งครอบคลุมการดำเนินการตามเกณฑ์การประเมิน Enabler ทั้ง 7 ด้าน","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงแนวทางในการปฏิบัติงานตรวจสอบภายในด้านการให้ความเชื่อมั่น เพื่อให้หน่วยตรวจสอบภายในได้รับความเชื่อมั่นในการปฏิบัติงานตรวจสอบจากคณะกรรมการตรวจสอบและผู้บริหารระดับสูงอย่างมีประสิทธิภาพ ประสิทธิผลเพิ่มขึ้น"],good:["ครอบคลุมการตรวจสอบ 3 มิติหลัก: สายตรวจสอบ กทท. ดำเนินการตรวจสอบครบถ้วนทั้งด้านการเงิน (Financial), ด้านการปฏิบัติงาน (Operation), และด้านการปฏิบัติตามกฎระเบียบ (Compliance) เพื่อช่วยปรับปรุงประสิทธิภาพของการกำกับดูแลกิจการ ความเสี่ยง และการควบคุมภายใน (GRC)","การจัดทำตารางสรุป GRC ที่ชัดเจน: มีการจัดทำ \"ตารางสรุปการดำเนินการให้คำแนะนำ เพื่อการพัฒนาปรับปรุงด้าน GRC\" อย่างเป็นรูปธรรม เพื่อใช้ประเมินผลการทำงานของฝ่ายตรวจสอบ","ได้รับการประเมินความเชื่อมั่นจากผู้บริหารสูงสุด: สายตรวจสอบได้รับการประเมินผลด้านการให้ความเชื่อมั่นจากคณะกรรมการตรวจสอบ (AC) และผู้อำนวยการ กทท. (อทร.) และได้นำผลมารายงานต่อที่ประชุม AC เรียบร้อยแล้ว"],gaps:["การเพิ่มมูลค่ายังติดหล่ม \"เชิงรับ\" (Reactive): TRIS เน้นย้ำว่า การให้ความเชื่อมั่นและการให้ข้อเสนอแนะของ กทท. ยังเป็นรูปแบบการตามแก้ปัญหาหรืออุดช่องโหว่ที่เกิดขึ้นไปแล้ว ขาดการให้ความเชื่อมั่นในลักษณะ \"เชิงป้องกัน (Preventive Control)\"","ขาดการเชื่อมโยงกับ Core Business Enablers 7 ด้าน อย่างประจักษ์: แม้ กทท. จะระบุว่างานตรวจสอบช่วยยกระดับองค์กร แต่ผู้ประเมินยังไม่เห็นหลักฐานที่ชัดเจนว่า ผลการตรวจสอบนั้นเข้าไปช่วยปรับปรุงระบบงานด้านอื่นๆ เช่น ด้านเทคโนโลยี (DT), ด้านทรัพยากรบุคคล (HCM), หรือ ด้านแผนวิสาหกิจ (SP) อย่างเป็นรูปธรรม","การจัดการความรู้ (KM) ยังไม่เป็นระบบ: สายตรวจสอบยังขาดการแปลงผลลัพธ์จากการตรวจสอบไปเป็น \"องค์ความรู้ที่สำคัญ (Knowledge Base)\" เพื่อป้องกันไม่ให้เกิดข้อผิดพลาดซ้ำในหน่วยงานอื่น"],results:["ระดับ 1-2: ดำเนินการตรวจสอบตามแผนประจำปี ครอบคลุมด้านการเงิน ปฏิบัติงาน และกฎระเบียบ เพื่อยกระดับ GRC โดยมีเอกสารตารางสรุปการดำเนินการให้คำแนะนำเพื่อการพัฒนาปรับปรุงด้าน GRC เป็นหลักฐานยืนยัน","ระดับ 3: มีการประเมินผลด้านการให้ความเชื่อมั่นของหน่วยตรวจสอบภายใน โดยคณะกรรมการตรวจสอบ ผู้บริหารสูงสุด หน่วยรับตรวจ และรายงานผลการประเมินต่อ AC ในการประชุมครั้งที่ 7/2567 เรียบร้อยแล้ว","ระดับ 4 (ตกเกณฑ์): สายตรวจสอบตอบในกระดาษคำตอบว่า ผลงานทำให้เกิดการเพิ่มมูลค่าและยกระดับกระบวนการปฏิบัติงาน ครอบคลุม Enablers 7 ด้าน โดยแนบรายงานสรุปผลงานให้ความเชื่อมั่นที่เพิ่มมูลค่าเป็นหลักฐาน","ระดับ 5 (ไม่ได้ประเมิน): กทท. ไม่ได้ประเมินในระดับนี้ (ได้ 0 คะแนน) เนื่องจากยังไม่มีกระบวนการใช้ข้อมูลป้อนกลับเพื่อทบทวน/ปรับปรุงแนวทางปฏิบัติอย่างเป็นระบบ"],tris:["กทท. ส่งกระดาษคำตอบไปถึงระดับ 4 แต่ TRIS กดคะแนนลงมาเหลือ 2.0000 ซึ่งหมายความว่า TRIS ให้ผ่านแค่ระดับ 1-2 เท่านั้น สาเหตุหลักคือ TRIS มองว่า \"การจัดการ KM ของหน่วย IA ยังไม่เป็นระบบ และยังไม่ได้กำหนดองค์ความรู้ที่สำคัญชัดเจน\" นอกจากนี้ ผู้ประเมินยังคงระบุ Gap สถานะ \"คงเดิม\" ว่า หลักฐานเชิงประจักษ์ที่แสดงให้เห็นการเชื่อมโยงผลการตรวจสอบไปสู่การปรับปรุง Enablers ทั้ง 7 ด้าน ยังไม่เด่นชัดพอที่จะให้ผ่านระดับ 4 ได้"],suggest:["จัดทำตาราง Cross-Reference กับ Enablers 7 ด้าน: ในรายงานสรุปผลงานประจำปี 2569 สายตรวจสอบต้องทำตารางความเชื่อมโยง (Matrix) ชี้ให้ TRIS เห็นเป็นรายโครงการเลยว่า โครงการ A ช่วยยกระดับด้าน DT อย่างไร, โครงการ B ช่วยยกระดับด้าน SP อย่างไร เพื่อตอบโจทย์ระดับ 4 แบบตรงไปตรงมา","เปลี่ยนโทนรายงานสู่ Preventive & Best Practice: ปรับวิธีเขียนข้อเสนอแนะในรายงานผลการตรวจสอบให้เป็นรูปแบบ \"การวางระบบป้องกันล่วงหน้า\" และจัดทำเอกสาร \"ถอดบทเรียน (AAR)\" นำข้อผิดพลาดของหน่วยรับตรวจไปสร้างเป็นคู่มือแนวปฏิบัติที่ดี (Best Practice) ส่งให้ KM ขององค์กร เพื่อปิด Gap ด้านจัดการความรู้"],docs:["Dashboard หรือ ตารางสรุปการเพิ่มมูลค่าที่เชื่อมโยง Enablers 7 ด้าน: เอกสารแผ่นเดียวที่สรุปชัดเจนว่า 1 ปีที่ผ่านมา IA เข้าไปช่วยผลักดันให้ Enablers แต่ละด้านของ กทท. ดีขึ้นอย่างไรบ้าง พร้อมระบุผลสัมฤทธิ์ (Outcome) ที่จับต้องได้","คลังความรู้สายตรวจสอบ (IA Knowledge Base): ภาพหน้าจอ (Screen Capture) จากระบบ Intranet ที่แสดงให้เห็นว่าสายตรวจสอบได้นำข้อสังเกตสำคัญๆ ไปจัดทำเป็นองค์ความรู้เผยแพร่ให้พนักงานทั่วองค์กรได้เรียนรู้ เพื่อป้องกันการเกิดซ้ำ"],bestprac:["รฟม. โดดเด่นในการ \"แสดงรายละเอียดความเชื่อมโยงระหว่างผลลัพธ์การตรวจสอบ กับการเพิ่มมูลค่า/ยกระดับการปฏิบัติงานขององค์กรอย่างชัดเจน\""],minReqs:{"1":["รายงานผลการตรวจสอบ หรือ ตารางสรุปผลงาน ที่แสดงให้เห็นว่าข้อเสนอแนะจากการตรวจสอบ (ด้านการเงิน ปฏิบัติงาน หรือกฎระเบียบ) ช่วยปรับปรุงประสิทธิภาพอย่างน้อย 1 มิติ (เลือกระหว่าง การควบคุมภายใน, บริหารความเสี่ยง, หรือ การกำกับดูแล)"],"2":["รายงานผลการตรวจสอบ หรือ ตารางสรุปการดำเนินการให้คำแนะนำเพื่อการพัฒนาปรับปรุงด้าน GRC ที่แสดงให้เห็นผลสัมฤทธิ์ว่าช่วยปรับปรุงประสิทธิภาพ ครบทั้ง 3 มิติ 1. การควบคุมภายใน 2. การบริหารความเสี่ยง 3. การกำกับดูแลกิจการ"],"3":["แบบประเมินผลด้านการให้ความเชื่อมั่นของหน่วยตรวจสอบภายใน ที่ระบุหัวข้อการประเมินการเพิ่มคุณค่าและยกระดับ GRC อย่างชัดเจน","รายงานการประชุม/บันทึกข้อความ ที่แสดงให้เห็นว่าได้รับการประเมินจาก \"คณะกรรมการตรวจสอบ (AC)\" และ \"ผู้บริหารสูงสุด (อทร.)\" (ดำเนินการอย่างน้อยปีละ 1 ครั้ง)"],"4":["เอกสาร/ตารางสรุปผลงานให้ความเชื่อมั่นที่เพิ่มมูลค่า (Value-Added) ที่มีรูปแบบการเทียบเคียง (Cross-reference) ให้เห็นอย่างชัดเจนว่า ข้อตรวจพบและข้อเสนอแนะ เข้าไปช่วยยกระดับ \"เกณฑ์ Enablers ทั้ง 7 ด้าน\" อย่างเป็นรูปธรรม","รายงานผลการตรวจสอบที่แสดงให้เห็นถึงการวิเคราะห์หาสาเหตุที่แท้จริง (Root Cause Analysis) และการให้ข้อเสนอแนะเชิงป้องกัน (Preventive Control) เพื่อป้องกันข้อผิดพลาดซ้ำ"],"5":["บันทึกข้อความ หรือ รายงานการประชุม ที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จากแบบประเมินของ AC และ อทร. มาใช้วิเคราะห์เพื่อปรับปรุง \"แนวทางการให้ความเชื่อมั่น\" ในปีถัดไป และสะท้อนให้เห็นว่าได้รับคะแนนความเชื่อมั่นที่สูงขึ้น"]},subComps:{"1":["ความครอบคลุมของประเภทการให้ความเชื่อมั่น : งานตรวจสอบที่จะถูกนับเป็นการให้ความเชื่อมั่น ต้องครอบคลุมการประเมิน 4 ส่วนหลัก ได้แก่ การให้ความเชื่อมั่นด้านการเงิน (Financial Audit), ด้านการปฏิบัติงาน (Operation & Performance Audit), ด้านกฎระเบียบ (Compliance Audit), และด้านความมั่นคงปลอดภัยสารสนเทศ (Security Audit)"],"2":["ความครอบคลุมของประเภทการให้ความเชื่อมั่น : งานตรวจสอบที่จะถูกนับเป็นการให้ความเชื่อมั่น ต้องครอบคลุมการประเมิน 4 ส่วนหลัก ได้แก่ การให้ความเชื่อมั่นด้านการเงิน (Financial Audit), ด้านการปฏิบัติงาน (Operation & Performance Audit), ด้านกฎระเบียบ (Compliance Audit), และด้านความมั่นคงปลอดภัยสารสนเทศ (Security Audit)"],"3":["ประเด็นบังคับในแบบประเมินความเชื่อมั่น การที่ AC และ อทร. จะประเมินผลงาน IA จะต้องมีคำถามครอบคลุมอย่างน้อย 4 ประเด็นบังคับ คือ 1) ช่วยเพิ่มคุณค่าให้องค์กร 2) ช่วยยกระดับประสิทธิภาพ CG 3) ช่วยยกระดับประสิทธิภาพ RM และ 4) ช่วยยกระดับประสิทธิภาพ IC"],"4":["จุดตายของการเชื่อมโยงกับ Enablers 7 ด้าน การที่จะผ่านระดับ 4 ได้ ผู้ประเมินเน้นย้ำว่า \"ต้องแสดงให้เห็นหลักฐานเชิงประจักษ์อย่างชัดเจน\" ว่าผลการตรวจสอบไปช่วยปรับปรุงกระบวนการดำเนินงานตามเกณฑ์ Enablers ทั้ง 7 ด้านอย่างไรบ้าง (เช่น การทำตาราง Mapping) ซึ่งเป็นจุดที่ กทท. ได้คะแนนหยุดที่ 2.0000 เนื่องจากหลักฐานความเชื่อมโยงนี้ยังไม่เป็นระบบ","ความหมายของคำว่า \"สร้างมูลค่าเพิ่ม (Value-Added)\" ผู้ประเมินให้ความหมายเชิงลึกว่า การสร้างมูลค่าเพิ่มไม่ใช่แค่ตรวจพบแล้วสั่งแก้ แต่ต้องมีการ \"วิเคราะห์สาเหตุ (Root Cause Analysis)\" นำไปสู่ \"ข้อเสนอแนะเชิงกลยุทธ์ที่เป็นการป้องกัน (Preventive Control)\" เพื่อป้องกันไม่ให้เกิดข้อผิดพลาดซ้ำในประเด็นเดิม"],"5":["เป้าหมายการประเมินในระดับ 5 การนำข้อมูลไปปรับปรุงกระบวนการ จะต้องสะท้อนผลลัพธ์ว่า ท้ายที่สุดแล้วหน่วยตรวจสอบภายใน \"ได้รับความเชื่อมั่นจาก AC และผู้บริหารสูงสุด เพิ่มขึ้น\" (สะท้อนผ่านคะแนนประเมินที่สูงขึ้นจากรอบก่อนหน้า)"]}},
  {id:"3.7",grp:"3",gname:"หน่วยตรวจสอบภายใน (ด้านการปฏิบัติงานและผลงาน)",gw:65.0,gs68:2.5358,name:"การให้คำปรึกษา",w:5.0,s68:2.0,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินบทบาทของหน่วยตรวจสอบภายในในฐานะ \"ที่ปรึกษาองค์กร (Consulting Services)\" ครอบคลุมตั้งแต่การตั้งเป้าหมายและกำหนดแนวทางปฏิบัติที่ชัดเจน การลงมือปฏิบัติจริงแบบ \"เชิงรุก (Proactive)\" (ไม่ใช่แค่รอให้หน่วยรับตรวจมีหนังสือร้องขอมา) การได้รับการยอมรับและความเชื่อมั่นจากผู้บริหารสูงสุดและคณะกรรมการตรวจสอบ ไปจนถึงความสามารถในการพิสูจน์ให้ผู้ประเมินเห็นว่า คำปรึกษาที่ให้ไปนั้นสามารถสร้าง \"มูลค่าเพิ่ม (Value-Added)\" และยกระดับการทำงานขององค์กรครอบคลุมมิติของ Enablers ทั้ง 7 ด้านได้อย่างเป็นรูปธรรม","หน่วยตรวจสอบภายในกำหนดเป้าหมายการดำเนินงานด้านการให้คำปรึกษาอย่างชัดเจนทั้งระยะสั้น และระยะยาว","หน่วยตรวจสอบภายในกำหนดแนวทางการให้คำปรึกษาที่ชัดเจน และมีความสอดคล้องกับเป้าหมายบทบาทที่ปรึกษาในแต่ละระยะ","หน่วยตรวจสอบภายในมีการดำเนินการให้คำปรึกษาแก่ฝ่ายบริหารรูปแบบเชิงรุกครบตามแผนที่กำหนด และมีผลลัพธ์จากการดำเนินงานเป็นไปตามแผนกำหนด ตลอดจนได้รับการประเมินความเชื่อมั่นด้านการให้คำปรึกษาจากคณะกรรมการตรวจสอบ และผู้บริหารสูงสุดของรัฐวิสาหกิจ","ฝ่ายบริหารขอรับคำปรึกษาจากหน่วยตรวจสอบภายใน ซึ่งคำปรึกษาที่มอบให้แก่ฝ่ายบริหารส่งผลให้เกิดการเพิ่มมูลค่าและยกระดับกระบวนการปฏิบัติงานของรัฐวิสาหกิจให้บรรลุเป้าหมาย หรือวัตถุประสงค์ขององค์กร และครอบคลุมการดำเนินงานตามเกณฑ์การประเมิน Enabler ทั้ง 7 ด้าน","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวน/ปรับปรุงแนวทางในการปฏิบัติงานตรวจสอบด้านการให้คำปรึกษา เพื่อให้หน่วยตรวจสอบภายในมีเป้าหมายการดำเนินงานด้านการให้คำปรึกษาที่มีประสิทธิผลเพิ่มขึ้น และหน่วยตรวจสอบภายในได้รับความเชื่อมั่นใจการให้คำปรึกษาจากคณะกรรมการตรวจสอบและผู้บริหารสูงสุดอย่างมีประสิทธิภาพ ประสิทธิผลเพิ่มขึ้น"],good:["การกำหนดเป้าหมายระยะสั้น-ระยะยาวอย่างเป็นระบบ: สายตรวจสอบ กทท. มีการกำหนดเป้าหมายจำนวนงานที่ต้องให้คำปรึกษาไว้อย่างชัดเจนในแผนกลยุทธ์ เช่น ระยะสั้น (ปี 2568) กำหนดไว้ 4-5 เรื่อง/ปี, ระยะกลาง (ปี 2569-2570) 6-7 เรื่อง/ปี และระยะยาว (ปี 2571-2572) 8-9 เรื่อง/ปี","การสร้างคู่มือรองรับที่ชัดเจน: มีการกำหนดแนวทางและขอบเขตการให้คำปรึกษาไว้ในกฎบัตรและคู่มือปฏิบัติงาน (P11) โดยแบ่งเป็น 3 กรณี (ระหว่าง/หลังตรวจ, กรณีร้องขอพิเศษ, และกรณีนอกเหนือปฏิบัติงานประจำ)","สร้างผลลัพธ์ที่เป็นรูปธรรม (Quick Win): ในปีที่ผ่านมา IA ให้คำปรึกษาจนเกิดผลลัพธ์เชิงประจักษ์ เช่น การฝังระบบ Alert แจ้งเตือนการเบิก OT ซ้ำซ้อนขณะลา และการลดวันออกใบแจ้งหนี้สินค้าตกค้าง ซึ่งช่วย กทท. ประหยัดงบประมาณได้ถึง 6 แสนบาท"],gaps:["การทำงานยังติดหล่ม \"เชิงรับ\" (Reactive): งานให้คำปรึกษาส่วนใหญ่ที่ กทท. นำเสนอยังเป็นการตั้งรับ คือ \"รอให้เกิดปัญหาแล้วค่อยเข้าไปแก้\" (เช่น การให้คำปรึกษาเรื่องการแก้ไขข้อบกพร่องตามที่ สตง. ตรวจพบ) หรือ \"รอให้หน่วยรับตรวจมีคำร้องขอมา\" (เช่น การตอบข้อหารือเรื่องเบิกค่าเช่าที่พัก)","ขาดแผนการให้คำปรึกษาแบบ \"เชิงรุก\" (Proactive): ยังไม่มีการจัดทำแผนงานที่ IA เป็นผู้ริเริ่มเดินเข้าไปหาฝ่ายบริหารเพื่อเสนอแนะ \"การควบคุมเชิงป้องกัน (Preventive Control)\" ล่วงหน้า เพื่ออุดช่องโหว่ก่อนเกิดความผิดพลาด"],results:["ระดับ 1-2: กำหนดเป้าหมายจำนวนการให้คำปรึกษา (4-5 เรื่องในปี 68) และจัดทำแนวทาง/ขอบเขตไว้ในคู่มือ P11 และกฎบัตร IA อย่างชัดเจน","ระดับ 3: มีการให้คำปรึกษาตามที่มีผู้บริหาร/หน่วยงานร้องขอ รวม 4 เรื่อง (เช่น การเรียกเก็บค่าบริการ, การเบิกค่าเช่าที่พัก, การกำหนดราคากลาง, และ Cash Management) และได้รับการประเมินความเชื่อมั่นจาก AC และ อทร. เรียบร้อยแล้ว","ระดับ 4: นำเสนอผลงานที่ฝ่ายบริหารขอรับคำปรึกษาเรื่อง \"การกำหนดราคากลางในการจัดซื้อจัดจ้าง\" (ซึ่งสืบเนื่องมาจากข้อสังเกตของ สตง.) โดย IA ได้เข้าไปจัดประชุมสื่อสารให้เจ้าหน้าที่พัสดุปฏิบัติตาม พ.ร.บ. จัดซื้อจัดจ้างฯ อย่างถูกต้อง เพื่อป้องกันข้อบกพร่อง"],tris:["กทท. ส่งกระดาษคำตอบระบุความสำเร็จถึงระดับ 4 แต่ TRIS ปรับลดคะแนนให้เหลือเพียง 2.0000 เนื่องจาก TRIS มองว่ากระดาษคำตอบในระดับ 3 และ 4 ของ กทท. ยังไม่ใช่ \"การให้คำปรึกษาเชิงรุก (Proactive)\" ตามเจตนารมณ์ของเกณฑ์ TRIS ระบุสถานะ Gap อย่างชัดเจนว่า \"การสร้างมูลค่าเพิ่มยังเป็นเชิงตามแก้ไข (Reactive) มากกว่าการป้องกัน (Preventive) ควรรีบกำหนดแผนและเป้าหมายการให้คำปรึกษาแบบเชิงรุกให้ชัดเจน\""],suggest:["ประกาศ \"แผนการให้คำปรึกษาเชิงรุก (Proactive Consulting Plan)\": กทท. ต้องจัดทำแผนแยกออกมาต่างหากเลยว่า ในปี 2569 IA จะขอเข้าพบผู้บริหารสายงานใดเพื่อ \"ให้คำปรึกษาเชิงยุทธศาสตร์ล่วงหน้า\" โดยไม่ต้องรอให้เขาร้องขอ และไม่ต้องรอให้ สตง. ตรวจพบ","เน้นคำว่า Preventive Control ในรายงาน: ทุกครั้งที่ให้คำปรึกษาเสร็จ ต้องบันทึกรายงานโดยใช้คำว่า \"ได้เสนอแนะการควบคุมเชิงป้องกัน (Preventive Control)...\" เพื่อให้ตรงกับ Keyword ที่ TRIS ต้องการเห็น"],docs:["แผนงานการให้คำปรึกษาเชิงรุก (Proactive Consulting Plan): เอกสารแผนงานที่ผ่านการอนุมัติ ที่ระบุชัดเจนว่า IA จะเข้าไปเป็นที่ปรึกษา (Advisory) ให้กับโครงการใดที่เป็นโครงการใหม่ (New Initiatives) ของ กทท.","รายงานสรุปผลการให้คำปรึกษา (Consulting Report): ที่มีหัวข้อสะท้อน \"มูลค่าเพิ่ม (Value-Added) ที่เกิดขึ้นจากการป้องกันปัญหาล่วงหน้า\" อย่างเป็นรูปธรรม"],bestprac:["ในหัวข้อ 3.7 การให้คำปรึกษา พบว่า ทั้ง กทท., รฟม. และ กทพ. ต่างก็ติดกับดักในเรื่องเดียวกัน คือยังไม่สามารถพิสูจน์ \"การปฏิบัติงานเชิงรุก (Proactive)\" ได้อย่างสมบูรณ์ในสายตา TRIS"],minReqs:{"1":["ผนยุทธศาสตร์หรือแผนปฏิบัติการของสายตรวจสอบ ที่มีการระบุ \"เป้าหมายจำนวนเรื่อง/โครงการ\" ที่จะให้คำปรึกษา ทั้งในระยะสั้น (1 ปี) และระยะยาว (3-5 ปี) อย่างชัดเจน"],"2":["คู่มือการปฏิบัติงาน หรือกฎบัตรของหน่วยตรวจสอบภายใน ที่ระบุ \"แนวทางและขอบเขตการให้คำปรึกษา\" ไว้อย่างชัดเจน (เช่น แยกกรณีระหว่างการตรวจ, กรณีร้องขอพิเศษ, หรืองานคณะทำงาน)"],"3":["แผนงานการให้คำปรึกษาเชิงรุก (Proactive Consulting Plan) และรายงานผลสัมฤทธิ์ที่สามารถทำได้ครบตามแผน","แบบประเมินและสรุปผลคะแนน \"ความเชื่อมั่นด้านการให้คำปรึกษา\" ที่ประเมินโดยคณะกรรมการตรวจสอบ (AC) และผู้บริหารสูงสุด (อทร.)"],"4":["เอกสาร/รายงานการให้คำปรึกษาแก่ฝ่ายบริหาร ที่สะท้อนให้เห็นถึง \"การเพิ่มมูลค่า (Value-Added)\"","ตารางสรุปหรือเอกสารเชื่อมโยง (Mapping) ที่พิสูจน์ให้เห็นว่าผลจากการให้คำปรึกษาเข้าไปช่วยยกระดับกระบวนการทำงานขององค์กร ครอบคลุม \"เกณฑ์ Enablers ทั้ง 7 ด้าน\""],"5":["บันทึกข้อความ หรือรายงานการประชุม ที่แสดงการนำข้อมูลป้อนกลับ (Feedback) จาก AC และ อทร. มาวิเคราะห์เพื่อปรับปรุง \"เป้าหมายและแนวทางการให้คำปรึกษา\" ในรอบปีถัดไป","หลักฐานที่แสดงให้เห็นเชิงประจักษ์ว่า หน่วยตรวจสอบภายในได้รับความเชื่อมั่นจาก AC และ อทร. \"เพิ่มขึ้น\" (เช่น คะแนนประเมินสูงขึ้นจากปีก่อน)"]},subComps:{"2":["ข้อบังคับรูปแบบการให้คำปรึกษา: คู่มือหรือแนวทางการให้คำปรึกษาจะถูกประเมินว่าสมบูรณ์ ก็ต่อเมื่อครอบคลุมการทำงาน 2 รูปแบบ คือ 1) แบบเชิงรุก (Proactive) เช่น การนำผลตรวจสอบในอดีตหรือแนวโน้มธุรกิจมาวิเคราะห์เพื่อเผยแพร่ให้ความรู้เชิงป้องกันล่วงหน้า และ 2) แบบเชิงรับ (Reactive) คือการมีแนวทางรองรับการขอรับคำปรึกษาจากฝ่ายบริหาร (จุดนี้คือ Gap สำคัญที่ กทท. ต้องปิดในปี 69 เพราะที่ผ่านมาเน้นแต่เชิงรับ)"],"3":["ข้อบังคับรูปแบบการให้คำปรึกษา: คู่มือหรือแนวทางการให้คำปรึกษาจะถูกประเมินว่าสมบูรณ์ ก็ต่อเมื่อครอบคลุมการทำงาน 2 รูปแบบ คือ 1) แบบเชิงรุก (Proactive) เช่น การนำผลตรวจสอบในอดีตหรือแนวโน้มธุรกิจมาวิเคราะห์เพื่อเผยแพร่ให้ความรู้เชิงป้องกันล่วงหน้า และ 2) แบบเชิงรับ (Reactive) คือการมีแนวทางรองรับการขอรับคำปรึกษาจากฝ่ายบริหาร (จุดนี้คือ Gap สำคัญที่ กทท. ต้องปิดในปี 69 เพราะที่ผ่านมาเน้นแต่เชิงรับ)"],"4":["นิยามของการสร้างมูลค่าเพิ่ม การให้คำปรึกษาที่จะได้คะแนนระดับ 4 ต้องไม่ใช่แค่การตอบคำถามกฎระเบียบทั่วไป แต่ต้องเป็นคำปรึกษาที่ \"ช่วยเพิ่มประสิทธิภาพการตัดสินใจของฝ่ายบริหาร\" และสร้างคุณค่าให้องค์กรลดความเสี่ยงหรือลดค่าใช้จ่ายได้อย่างชัดเจน","จุดตายของการเชื่อมโยงกับ Enablers 7 ด้าน คล้ายกับหัวข้อ Assurance การให้คำปรึกษาต้องมีหลักฐานเอกสาร (เช่น ตาราง Mapping) ที่แสดงให้เห็นชัดเจนว่า คำปรึกษาเรื่อง A ไปช่วยยกระดับด้าน CG อย่างไร หรือคำปรึกษาเรื่อง B ไปช่วยลดคอขวดด้าน HCM อย่างไร หากไม่สามารถกางให้ดูครบทั้ง 7 ด้าน จะไม่ผ่านระดับ 4"],"5":["หลักฐานความเชื่อมั่นที่ \"เพิ่มขึ้น\" เกณฑ์ในระดับ 5 ซ่อนคำว่า \"ประสิทธิผลเพิ่มขึ้น\" ไว้ในตอนท้าย ซึ่งแปลว่าการนำข้อมูลป้อนกลับไปปรับปรุงกระบวนการ ต้องสะท้อนออกมาเป็นตัวเลข \"คะแนนผลการประเมินความเชื่อมั่นจาก AC และ อทร.\" ที่สูงขึ้นกว่ารอบปีที่ผ่านมาด้วย"]}},
  {id:"4.1",grp:"4",gname:"หน่วยรับตรวจ (ความรับผิดชอบของหน่วยรับตรวจ)",gw:5.0,gs68:4.25,name:"ความรับผิดชอบของหน่วยรับตรวจ",w:5.0,s68:4.25,status:"ยังไม่เริ่ม",statusNote:"",scope:null,levelSumm:["เน้นประเมินการสร้างความเข้าใจและการปฏิบัติตามบทบาทหน้าที่ของ \"หน่วยรับตรวจ (Auditees)\" ที่มีต่องานตรวจสอบภายใน เริ่มตั้งแต่การกำหนดบทบาทที่ชัดเจน การสื่อสารให้รับทราบ การให้ความร่วมมือในการจัดเตรียมข้อมูลและตอบข้อซักถามจนปิดงานได้ตามแผน ไปจนถึงการมีระบบประเมินผลความร่วมมือหลังจบงาน และที่สำคัญที่สุดคือต้องมีการนำผลประเมินนั้นมาตั้ง \"เป้าหมายการทำงานร่วมกันเชิงรุก\" (เช่น การทำข้อตกลง SLA หรือลดระยะเวลารอคอยเอกสาร) เพื่อยกระดับประสิทธิภาพการทำงานระหว่าง 2 ฝ่ายอย่างต่อเนื่อง","กำหนดบทบาทและความรับผิดชอบของหน่วยรับตรวจไว้อย่างชัดเจน","การสื่อสารบทบาทและความรับผิดชอบของหน่วยรับตรวจ เพื่อให้ผู้บริหารหน่วยรับตรวจ และพนักงานของหน่วยรับตรวจรับทราบ","หน่วยรับตรวจดำเนินการตามบทบาทและความรับผิดชอบที่กำหนด โดยให้ความร่วมมือในการประสานงานและข้อมูลอย่างครบถ้วนเพียงพอ","การประเมินการให้ความร่วมมือของหน่วยรับตรวจ เพื่อเพิ่มประสิทธิภาพในการดำเนินงานร่วมกัน และแจ้งให้ผู้บริหารสายงานของหน่วยรับตรวจ รวมทั้งคณะกรรมการตรวจสอบเพื่อทราบ","การใช้ข้อมูลป้อนกลับจากการดำเนินงาน รวมถึงข้อมูลอื่นๆ ในการทบทวนกระบวนการปฏิบัติงานร่วมกับหน่วยรับตรวจให้เป็นไปอย่างมีประสิทธิภาพและประสิทธิผลยิ่งขึ้น"],good:["การสื่อสารแบบ 360 องศา: กทท. มีการสื่อสารบทบาทของหน่วยรับตรวจอย่างชัดเจนผ่าน กฎบัตร หนังสือแจ้งเวียน ระบบ OA, Intranet และที่สำคัญคือเน้นย้ำอีกครั้งใน \"การประชุมเปิด-ปิดงานตรวจสอบ (Opening/Closing Meeting)\" ทุกครั้ง","ระบบการประเมินแบบ 2 ทาง (Bi-directional Evaluation): สายตรวจสอบไม่ได้ประเมินฝ่ายเดียว แต่เปิดให้หน่วยรับตรวจประเมินสายตรวจสอบด้วย โดยในปี 68 กทท. ได้คะแนนความพึงพอใจจากหน่วยรับตรวจสูงถึง 4.82/5.00 และสายตรวจสอบก็ประเมินความร่วมมือของหน่วยรับตรวจสูงถึง 4.84/5.00 สะท้อนถึงความสัมพันธ์อันดีเยี่ยม","การปิดงานตามแผน 100%: ได้รับความร่วมมือในการจัดเตรียมเอกสารและตอบข้อซักถามเป็นอย่างดี ทำให้สามารถดำเนินการตรวจสอบและปิดงานได้ครบถ้วนตามแผนที่กำหนดไว้ทุกเรื่อง"],gaps:["การกำหนดเป้าหมายระดับปฏิบัติการร่วมกัน (SLA): TRIS ระบุว่าแม้จะมีความร่วมมือที่ดี แต่บางครั้ง \"หน่วยรับตรวจยังให้ข้อมูลล่าช้า\" กทท. ยังขาดการกำหนด \"ข้อตกลงระดับการให้บริการ (Service Level Agreement: SLA)\" ร่วมกับหน่วยรับตรวจอย่างเป็นทางการ เช่น กำหนดชัดเจนว่าต้องส่งเอกสารภายในกี่วัน","การจัดเก็บและใช้ข้อมูลป้อนกลับเชิงลึก: การทบทวนกระบวนการยังขาดการตั้งเป้าหมายเชิงรุกที่นำไปสู่การเพิ่มประสิทธิภาพการทำงานร่วมกันอย่างเป็นรูปธรรมขั้นสุด"],results:["ระดับ 1: กำหนดบทบาทความรับผิดชอบของหน่วยรับตรวจไว้อย่างชัดเจนในกฎบัตรสายตรวจสอบ (หน้า 16)","ระดับ 2: สื่อสารบทบาทให้ผู้บริหารและพนักงานรับทราบผ่าน OA/Intranet และสำรวจการรับรู้ในการประชุมเปิด-ปิดตรวจทุกครั้ง","ระดับ 3: หน่วยรับตรวจให้ความร่วมมือครบถ้วน และ IA มีการประเมินความร่วมมือของหน่วยรับตรวจทุกครั้งที่ลงพื้นที่ (รวม 22 โครงการ)","ระดับ 4: สรุปผลการประเมินความร่วมมือแจ้งให้ผู้บริหารหน่วยรับตรวจทราบผ่านบันทึกข้อความ และรายงานให้คณะกรรมการตรวจสอบ (AC) รับทราบอย่างต่อเนื่องทุกไตรมาส","ระดับ 5: นำผลประเมิน (ที่ได้ 4.84) มาวิเคราะห์หาจุดอ่อน พบว่าข้อ \"การกำหนดบทบาท\" ได้คะแนนต่ำสุด จึงกำหนดแผนเชิงรุกในปี 69 โดยระบุรายการเอกสารเบื้องต้นที่จะตรวจไว้ในแผนเลย และแจ้งล่วงหน้า 60 วัน"],tris:["กทท. สอบผ่านด่านระดับ 1-4 อย่างสมบูรณ์แบบ (รับไปเต็มๆ 4 คะแนน) และได้เศษคะแนนจากระดับ 5 มาอีก 0.25 ทำให้จบที่ 4.2500 สาเหตุที่ TRIS ยังไม่ให้เต็ม 5 ในระดับ 5 คือ TRIS มองว่ากระบวนการนำข้อมูลป้อนกลับไปทบทวนนั้น \"ต้องมีการกำหนดเป้าหมายของการปฏิบัติงานร่วมกันอย่างชัดเจน\" มากกว่าแค่การนำคะแนนมาวิเคราะห์แล้วจบไป แต่ต้องเกิดเป็นมาตรการใหม่ที่ยกระดับความเร็วและคุณภาพในการส่งข้อมูล"],suggest:["กำหนด SLA ในการส่งเอกสาร: นำแนวคิด \"Service Level Agreement (SLA)\" ไปบังคับใช้ร่วมกับหน่วยรับตรวจ เช่น \"เมื่อมีการร้องขอเอกสารเพิ่มเติม หน่วยรับตรวจต้องจัดส่งให้ภายใน 3 วันทำการ\" และนำตัวชี้วัดนี้ไปเป็นส่วนหนึ่งของกระดาษทำการในปี 69","ทำ Joint-Process Improvement: จัดการประชุมทบทวนกระบวนการร่วมกัน (Joint Meeting) ระหว่าง IA และหน่วยรับตรวจที่มีประวัติส่งงานล่าช้า เพื่อออกแบบทางเดินเอกสาร (Flowchart) แบบใหม่ร่วมกัน ซึ่งจะตอบโจทย์เกณฑ์ระดับ 5 อย่างสมบูรณ์แบบ"],docs:["รายงานประเมินความร่วมมือที่เพิ่มเกณฑ์ SLA: แบบประเมินที่เพิ่มช่องการวัดผลเรื่อง \"ความรวดเร็วในการส่งเอกสารตามกรอบเวลา (SLA)\" อย่างชัดเจน","รายงานการประชุมร่วมปรับปรุงกระบวนการ (Joint-Meeting Minutes): บันทึกการประชุมระหว่าง IA และหน่วยรับตรวจที่สะท้อนว่าได้นำผลประเมินปี 68 มาพูดคุยเพื่อหาทางลดระยะเวลาการทำงานร่วมกันในปี 69"],bestprac:["คู่เทียบอย่าง กทพ. และ รฟม. ที่สามารถคว้าคะแนน 5.0000 (เต็ม) ในหมวดนี้ไปได้สำเร็จ","ทั้งสองหน่วยงานมีการแจ้งแผนล่วงหน้าไม่น้อยกว่า 60 วันเช่นเดียวกับ กทท. แต่จุดที่สร้างความแตกต่างคือ ทั้งคู่มี \"ระบบการประเมินความพร้อมในการให้ความร่วมมืออย่างเป็นทางการ\" และที่สำคัญคือ มีการนำข้อมูลป้อนกลับมาใช้ \"วางแผนปรับปรุงกระบวนการทำงานร่วมกันระหว่าง IA และหน่วยรับตรวจอย่างเป็นระบบ\" ไม่ใช่แค่ฝ่าย IA คิดปรับปรุงอยู่ฝ่ายเดียว","การต่อยอดไอเดียให้ กทท. สืบเนื่องจาก กทท. นั้นมีพื้นฐานที่ดีเยี่ยมอยู่แล้วจากระบบการประเมินแบบ 2 ทาง (Bi-directional) ซึ่งเหนือกว่ามาตรฐานทั่วไป ดังนั้นในการเขียนตอบ ควรเขียนสรุปสั้นๆ ให้ทรงพลังว่า \"สายตรวจสอบ กทท. ได้นำผลการประเมินที่ทำร่วมกันแบบ 2 ทาง มาบูรณาการตั้งเป็น 'ข้อตกลงความพร้อมในการรับการตรวจ (Audit Readiness SLA)' ร่วมกับฝ่ายบริหารของหน่วยรับตรวจ ซึ่งช่วยลดระยะเวลารอคอยข้อมูล (Wait Time) ลงได้จริงอย่างเป็นรูปธรรม\""],minReqs:{"1":["กฎบัตรของหน่วยตรวจสอบภายใน หรือ คู่มือปฏิบัติงาน ที่มีการระบุหัวข้อ \"บทบาทและความรับผิดชอบของหน่วยรับตรวจ\" ไว้อย่างชัดเจน (เช่น หน้าที่ในการจัดเตรียมเอกสารหลักฐาน และการตอบข้อซักถาม)"],"2":["หลักฐานการสื่อสารแจ้งเวียนบทบาทความรับผิดชอบให้หน่วยรับตรวจและพนักงานรับทราบ (เช่น บันทึกข้อความผ่านระบบ OA, ข่าวสารผ่าน Intranet, หรือวาระการแจ้งในที่ประชุมเปิดการตรวจสอบ - Opening Meeting)"],"3":["รายงานหรือบันทึกข้อความสรุปการปิดงานตรวจสอบ (Closing Meeting) ที่แสดงให้เห็นว่าได้รับความร่วมมือในการส่งเอกสารครบถ้วน และสามารถปิดตรวจได้ตามแผนที่กำหนดไว้"],"4":["แบบประเมิน \"การให้ความร่วมมือของหน่วยรับตรวจ\" ที่จัดทำหลังจบงานตรวจสอบแต่ละโครงการ","บันทึกข้อความหรือรายงานที่แสดงการนำผลประเมินความร่วมมือไปแจ้งให้ \"ผู้บริหารสายงานของหน่วยรับตรวจ\" และ \"คณะกรรมการตรวจสอบ (AC)\" รับทราบ"],"5":["รายงานการประชุม (Joint Meeting) ระหว่างหน่วยตรวจสอบภายในและหน่วยรับตรวจ ที่แสดงการนำผลประเมินจากรอบที่ผ่านมา (Feedback) มาหารือเพื่อทบทวนกระบวนการทำงานร่วมกัน","เอกสารกำหนด \"เป้าหมายและข้อตกลงการปฏิบัติงานร่วมกันอย่างชัดเจน\" เช่น การกำหนด Service Level Agreement (SLA) ระยะเวลาในการส่งเอกสาร"]},subComps:{"1":["นิยามความรับผิดชอบของหน่วยรับตรวจ : บทบาทของหน่วยรับตรวจที่จะถือว่าให้ความร่วมมืออย่างเพียงพอ ต้องครอบคลุมพฤติกรรมบังคับอย่างน้อย 3 ส่วน ได้แก่ 1) จัดเตรียมเอกสารหลักฐานให้พร้อมรับการตรวจ 2) การตอบชี้แจงและตอบข้อซักถาม และ 3) การหาข้อมูลเพิ่มเติมให้ผู้ตรวจสอบภายในได้อย่างครบถ้วน"],"3":["นิยามความรับผิดชอบของหน่วยรับตรวจ : บทบาทของหน่วยรับตรวจที่จะถือว่าให้ความร่วมมืออย่างเพียงพอ ต้องครอบคลุมพฤติกรรมบังคับอย่างน้อย 3 ส่วน ได้แก่ 1) จัดเตรียมเอกสารหลักฐานให้พร้อมรับการตรวจ 2) การตอบชี้แจงและตอบข้อซักถาม และ 3) การหาข้อมูลเพิ่มเติมให้ผู้ตรวจสอบภายในได้อย่างครบถ้วน"],"4":["การแจ้งผลการประเมินต้องทำแบบ 2 ทิศทาง : การประเมินความร่วมมือของหน่วยรับตรวจ เมื่อทำเสร็จแล้วจะต้องไม่เก็บไว้ที่ IA ฝ่ายเดียว แต่เกณฑ์บังคับชัดเจนว่าต้องแจ้งผลกลับไปยัง \"ผู้บริหารสายงานของหน่วยรับตรวจ\" (เพื่อให้ไปกำกับลูกน้องตนเอง) และต้องรายงานให้ \"คณะกรรมการตรวจสอบ (AC)\" รับทราบด้วย"],"5":["จุดตายที่ทำให้ไม่ผ่านระดับ 5 จากข้อสังเกตของผู้ประเมิน TRIS ระบุชัดเจนว่า การจะผ่านระดับ 5 ได้อย่างสมบูรณ์ ไม่ใช่แค่เอาผลประเมินมาดู แต่ \"ต้องมีการกำหนดเป้าหมายของการปฏิบัติงานร่วมกันอย่างชัดเจน\" ซึ่งสะท้อนความหมายแฝงว่า ผู้ประเมินต้องการเห็นการทำข้อตกลงระดับบริการ หรือ SLA (Service Level Agreement) ระหว่าง IA และหน่วยรับตรวจ เพื่อแก้ปัญหาการส่งข้อมูลล่าช้าอย่างเป็นรูปธรรมนั่นเองครับ"]}}

// ── SCORING ──────────────────────────────────────────────────────────
function iaCalcLevel(sid,L){
  const s=DATA.ia.subs.find(x=>x.id===sid);if(!s)return 0;
  const mrs=(s.minReqs&&s.minReqs[L])||[];
  const passedMR=mrs.length===0||mrs.every((_,i)=>!!(iaMrChk[sid]&&iaMrChk[sid][L]&&iaMrChk[sid][L][i]));
  if(!passedMR)return 0;
  const scs=(s.subComps&&s.subComps[L])||[];
  if(scs.length>0){
    const checked=((iaScChk[sid]&&iaScChk[sid][L])||[]).filter(Boolean).length;
    return checked/scs.length;
  }
  return(iaDimMlt[sid]&&iaDimMlt[sid][L])||0;
}
function iaCalcRaw(sid){
  let total=0;
  for(let L=1;L<=5;L++){
    const lScore=iaCalcLevel(sid,L);
    total+=lScore;
    if(lScore===0)break;
  }
  return Math.min(5,total);
}

// ── genScript ─────────────────────────────────────────────────────────
function genScript(sid){
  const s=DATA.ia.subs.find(x=>x.id===sid);if(!s)return'';
  const fi=feInput[sid]||{};const lvlNotes=fi.lvlNotes||{};const gapClosed=fi.gapClosed||{};const gapNotes=fi.gapNotes||{};
  const mr=s.minReqs||{};
  const simMax=[5,4,3,2,1].find(L=>iaCalcLevel(sid,L)>=1)||0;
  const lines=[];
  lines.push(`รายงานประเมินตนเอง — เกณฑ์ ${sid} ${s.name}`);
  lines.push(`ระดับที่ผ่านครบ (คาดการณ์): L${simMax||'—'}`);
  lines.push(`คะแนนดิบสะสม: ${iaCalcRaw(sid).toFixed(4)}/5.0`);
  lines.push('─'.repeat(60));lines.push('');
  lines.push(`กทท. ได้ดำเนินการตามหลักเกณฑ์ "${s.name}" โดยมีผลการดำเนินงาน ดังนี้`);lines.push('');
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lScore=iaCalcLevel(sid,L);const isPass=lScore>=1;const isPartial=lScore>0&&lScore<1;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const tickedDocs=items.filter((_,i)=>docGetChk(sid,L,i)).map(d=>d.replace('[แก้ไข Gap สำคัญ]','').trim());
    const note=lvlNotes[L]||'';
    const scs=(s.subComps&&s.subComps[L])||[];
    const scChecked=scs.length>0?((iaScChk[sid]&&iaScChk[sid][L])||[]).filter(Boolean).length:null;
    lines.push(`${isPass?'✓':isPartial?'◐':'○'} ระดับ ${L} — ${lvlTitle}`);
    if(scChecked!==null)lines.push(`   ประเด็นที่เปิดเผย: ${scChecked}/${scs.length} (${(lScore*100).toFixed(0)}%)`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}

// ── renderSim (SM Sequential Gating) ────────────────────────────────
function renderSim(s){
  const sid=s.id;
  const lvlSc=[];let gated=false;
  for(let L=1;L<=5;L++){
    if(gated){lvlSc.push({rv:0,bl:true,passedMR:false,hasSC:false});continue;}
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const passedMR=mrs.length===0||mrs.every((_,i)=>!!(iaMrChk[sid]&&iaMrChk[sid][L]&&iaMrChk[sid][L][i]));
    const scs=(s.subComps&&s.subComps[L])||[];
    let rv=0;
    if(passedMR){
      if(scs.length>0){
        const checked=((iaScChk[sid]&&iaScChk[sid][L])||[]).filter(Boolean).length;
        rv=checked/scs.length;
      }else{
        rv=(iaDimMlt[sid]&&iaDimMlt[sid][L])||0;
      }
    }
    lvlSc.push({rv,bl:false,passedMR,hasSC:scs.length>0});
    if(rv===0)gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.ia[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.ia[sid]);inp.style.borderColor=raw>=4?'#2a8a4a':raw>=3?'#5a8a00':raw>=2?'#c07000':'#c03020';}
  });

  function countMR(L){const mrs=(s.minReqs&&s.minReqs[L])||[];let t=0,c=0;mrs.forEach((_,ri)=>{t++;if(iaMrChk[sid]&&iaMrChk[sid][L]&&iaMrChk[sid][L][ri])c++;});return{tot:t,chk:c};}

  const allDimsSet=[];
  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}
  const crossSumm=allDimsSet.length?`<div class="crosslink-summ">🔗&nbsp;<strong style="margin-right:4px;">ต้องร่วมมือ:</strong>${allDimsSet.map(dimBadge).join(' ')}</div>`:'';
  const gapL=s.s68>0?(s.s68===Math.floor(s.s68)?s.s68+1:Math.ceil(s.s68)):1;

  let lvlHTML='';
  lvlSc.forEach((ls,i)=>{
    const L=i+1;
    const summ=(s.levelSumm&&s.levelSumm[L-1])||'';
    const detail=(s.dimLevels&&s.dimLevels[L-1])||'';
    const mrs=(s.minReqs&&s.minReqs[L])||[];
    const scs=(s.subComps&&s.subComps[L])||[];
    const ints=(CROSS_LINKS[sid]&&CROSS_LINKS[sid][L])||[];
    const{tot,chk}=countMR(L);
    const rv=ls.rv;
    const hdBg=ls.bl?'#eee8f8':rv>=1?'#e4f5e4':rv>0?'#fef8e8':'#f0fffa';
    const nBg=ls.bl?'#aaa':rv>=1?'#64748b':rv>0?'#2a8a50':'#1a5a3a';
    const sCol=ls.bl?'#bbb':rv>=1?'#64748b':rv>0?'#2a8a50':'#6aaa88';
    const barPct=tot>0?Math.round(chk/tot*100):0;
    const xId=`cgx-${sid}-${L}`;
    const xBtn=detail?`<button class="cg-toggle" onclick="event.stopPropagation();var e=document.getElementById('${xId}'),b=this;e.classList.toggle('open');b.textContent=e.classList.contains('open')?'▲':'▼';">▼</button>`:'';
    const xPan=detail?`<div id="${xId}" class="cg-lvl-detail">${detail}</div>`:'';
    let mrH='';
    if(mrs.length){
      mrH=`<div class="cg-sect-lbl">🔒 หลักฐานขั้นต่ำ (L${L}) <span style="color:#64748b;">${chk}/${tot} (${barPct}%)</span></div>
      <div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${barPct}%;background:${chk===tot?'#64748b':'#2a8a50'};"></div></div>`;
      mrs.forEach((txt,ri)=>{
        const kid=`cgmr-${sid}-${L}-${ri}`;const ck=iaMrChk[sid]&&iaMrChk[sid][L]&&iaMrChk[sid][L][ri]?'checked':'';const dis=ls.bl?'disabled':'';
        mrH+=`<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck} ${dis} onchange="iaToggleMR('${sid}',${L},${ri},this.checked);" style="accent-color:#64748b;"><label for="${kid}">${txt}</label></div>`;
      });
    }
    let dimH='';
    if(scs.length>0){

// ── renderFrameB ────────────────────────────────────────────────────
function renderFrameB(s){
  const mr=s.minReqs||{};const sid=s.id;
  let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{const items=mr[L]||[];total+=items.length;items.forEach((_,i)=>{if(docGetChk(sid,L,i))done++;});  });
  const progPct=total>0?Math.round(done/total*100):0;
  const progColor=done===total&&total>0?'#64748b':done>0?'#92400e':'#666';
  let html=`<div class="fb-prog-bar"><span style="font-size:11px;font-weight:600;color:${progColor};" id="fb-total-${sid}">${done}/${total} เอกสารพร้อมแล้ว</span><div class="fb-prog-track"><div id="fb-prog-fill-${sid}" style="height:100%;width:${progPct}%;background:${progColor};transition:width .3s;"></div></div></div>`;
  [1,2,3,4,5].forEach(L=>{
    const items=mr[L]||[];if(!items.length)return;
    const lvlDone=items.filter((_,i)=>docGetChk(sid,L,i)).length;
    const bdId=`fb-bd-${sid}-${L}`;
    const lvlTitle=(s.levelSumm&&s.levelSumm[L-1])||`ระดับ ${L}`;
    const shortTitle=lvlTitle.length>48?lvlTitle.slice(0,48)+'…':lvlTitle;
    const lvlColor=lvlDone===items.length?'#64748b':lvlDone>0?'#92400e':'#0369a1';
    const lvlBg=lvlDone===items.length?'#e4f5e4':lvlDone>0?'#fef8e0':'rgba(2,132,199,.06)';
    const itemsHtml=items.map((item,i)=>{
      const isGap=item.startsWith('[แก้ไข Gap');const cleanItem=item.replace('[แก้ไข Gap สำคัญ]','').trim();
      const ckd=docGetChk(sid,L,i);const ckId=`dck-${sid}-${L}-${i}`;
      return `<label class="fb-item${isGap?' fb-item-gap':''}${ckd?' fb-item-done':''}"><input type="checkbox" id="${ckId}"${ckd?' checked':''} onchange="docToggle('${sid}',${L},${i},this.checked)">${isGap?'<span class="fb-gap-tag">⚠️ Gap</span>':''}<span class="fb-item-text">${cleanItem}</span></label>`;
    }).join('');
    html+=`<div class="doc-lvl-block"><div class="doc-lvl-hd" style="background:${lvlBg};" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="doc-lvl-badge">L${L}</span><span class="doc-lvl-title" style="color:${lvlColor};">${shortTitle}</span><span class="doc-lvl-count" id="fb-cnt-${sid}-${L}" style="color:${lvlColor};font-weight:600;">${lvlDone}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="doc-lvl-body" id="${bdId}">${itemsHtml}</div></div>`;
  });
  return html;
}

// ── renderFrameE ────────────────────────────────────────────────────
function renderFrameE(s){
  const sid=s.id;const mr=s.minReqs||{};const gaps=s.gaps||[];const outId=`fe-out-${sid}`;
  const simMax=[5,4,3,2,1].find(L=>iaCalcLevel(sid,L)>=1)||0;
  const rawScore=iaCalcRaw(sid);

    const short=lvlTitle.length>46?lvlTitle.slice(0,46)+'…':lvlTitle;
    const note=feGet(sid,'lvlNotes',L);const bdId=`fe-bd-${sid}-${L}`;
    const badgeBg=isPass?'#64748b':isPartial?'#e3a82e':'#94a3b8';
    html+=`<div class="fe-lvl-block${isPass?' fe-lvl-active':''}"><div class="fe-lvl-hd" onclick="var e=document.getElementById('${bdId}');e.classList.toggle('open');"><span class="fe-lvl-badge" style="background:${badgeBg};">L${L}</span><span class="fe-lvl-title">${short}</span><span class="fe-doc-ref">📄 ${tickedCnt}/${items.length}</span><span style="font-size:10px;color:#7080b0;">▼</span></div><div class="fe-lvl-body${isPass?' open':''}" id="${bdId}"><textarea class="fe-textarea" rows="3" placeholder="อธิบายสิ่งที่ กทท. ดำเนินการในระดับนี้..." onchange="feSet('${sid}','lvlNotes',${L},this.value)" onblur="feSet('${sid}','lvlNotes',${L},this.value)">${note}</textarea></div></div>`;
  });
  if(gaps.length){
    html+=`<div class="fe-sect-lbl" style="margin-top:12px;">ช่องว่างจาก TRIS — ปิดได้หรือยัง?</div>`;

    });

  html+=`<div style="margin-top:14px;"><button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button><span style="font-size:11px;color:var(--text3);margin-left:8px;">รวม Simulator + เอกสาร Frame B + Notes ทั้งหมด</span></div><div style="margin-top:8px;"><textarea class="fe-output" id="${outId}" rows="14" placeholder="กด Gen Script เพื่อสร้างคำตอบ — แก้ไขได้ก่อน Copy"></textarea><button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button></div>`;
  return html;

// ── updateScores ─────────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.ia.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*iaCalcRaw(s.id),0);
  const delta=total-DATA.ia.orig;
  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.ia[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#64748b':diff<-0.001?'#c03020':'#555';const dEl=document.getElementById('rollup-delta-'+gid);if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#64748b':diff<-0.001?'#c03020':'#aaa';}}
    const barEl=document.getElementById('rollup-bar-'+gid);if(barEl){barEl.style.width=Math.round(gs/5*100)+'%';barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>iaCalcRaw(s.id)>0).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s);});
}

function renderAll(){renderLeft();renderRight();renderChecklist();updateScores();}
loadState();
renderAll();
syncHomeStatus();
(function(){const el=document.getElementById('depTotalBar');if(el)el.innerHTML=renderDepTotal();})();
</script>
