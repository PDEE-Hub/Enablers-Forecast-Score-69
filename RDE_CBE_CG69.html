  // ── ประเด็นที่ต้องปิด / ตรวจต่อ (own full-width row) ──────────────
  // Source-locked classification: only bracket-tagged gaps[] items get a
  // provenance badge — see 2026-08-17 audit. [Feedback 68]=F68 (real TRIS/FB68
  // finding), [พบจากฐานเอกสารของเรา]/[E — ...]=E (file exists, level not yet
  // confirmed). Untagged gaps[] text is real content but unverified provenance
  // — shown with NO badge (never guess a source). subComps[] is intentionally
  // excluded here: those are the actual Dimension checkbox items already live
  // in the L1-L5 accordion, not a separate "issue" — listing them here too
  // would duplicate them. M69 comes ONLY from unmet s.minReqs (official manual
  // columns by construction) — never from subComps/actions, since no
  // [Manual 69]-style tag exists anywhere in this data to prove provenance.
  function classifyGapItem(text){
    const m=text.match(/^\[([^\[\]]+)\]\s*/);
    if(!m) return{cls:null,tag:null,text};
    const label=m[1],rest=text.slice(m[0].length);
    if(label==='Feedback 68') return{cls:'tag-f68',tag:'F68',text:rest};
    if(label==='พบจากฐานเอกสารของเรา'||/^E\s*[—-]/.test(label)) return{cls:'tag-e',tag:'E',text:rest};
    return{cls:null,tag:null,text}; // unrecognized tag convention — don't guess
  }
  const issues=(s.gaps||[]).map(classifyGapItem);
  const mrItemsForIssues=(s.minReqs&&s.minReqs[boundaryL])||[];
  mrItemsForIssues.forEach((txt,ri)=>{
    if(!cgGetChk(sid,boundaryL,ri)) issues.push({cls:'tag-m69',tag:'M69',text:txt});
  });
  const issId=`iss-${sid}`;
  const shown=issues.slice(0,3),rest=issues.slice(3);
  const issRow=it=>`<div class="issue-row">${it.tag?`<span class="issue-tag ${it.cls}">${it.tag}</span>`:`<span class="issue-tag" style="background:var(--text3);">—</span>`}<span>${exp(it.text,90)}</span></div>`;
  const actionsHTML=(s.actions||[]).length?`<div style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px;">→ ก้าวถัดไป</div>`
    +s.actions.map(a=>`<div style="display:flex;gap:5px;font-size:12px;padding:3px 0;color:var(--text2);"><span style="color:var(--navy);flex-shrink:0;">→</span><span>${exp(a,90)}</span></div>`).join(''):'';
  const issuesCard=`<div class="card">
    <div class="card-hd">🧩 ประเด็นที่ต้องปิด / ตรวจต่อ</div>
    <div class="card-bd">
      ${shown.length?shown.map(issRow).join(''):'<div style="color:var(--text3);">— ไม่มีประเด็นค้าง —</div>'}
      ${rest.length?`<button class="detail-toggle" onclick="toggleDetail('${issId}')">▾ ดูทั้งหมด ${issues.length} ประเด็น</button><div class="detail-panel" id="${issId}">${rest.map(issRow).join('')}</div>`:''}
      ${actionsHTML}
    </div>
  </div>`;

  // ── หลักฐานตามระดับ — compact tabs + table per approved mockup (2026-08-17:
  // "Evidence จาก Accordion ยาว → Summary + Table Compact"). Same underlying
  // data/state as before (docsByLevel/docsNeeded/cgGetDoc/cgToggleDoc) — this
  // is a presentation swap only, not a logic change. ──
  const evCard=renderEvidenceCard(s);

  // ── ฐานเดิม — promoted to its own card, peer of Answer Builder ──
  const patId=`pat-${sid}`;
  const patShort=(s.good&&s.good[0])||(s.results&&s.results[0])||'ยังไม่มีข้อมูลฐานเดิมสำหรับข้อนี้';
  const patFull=[
    (s.good||[]).length?`<div style="font-size:9.5px;color:var(--text3);font-weight:700;margin:6px 0 3px;">จุดแข็ง:</div>`+s.good.map(g=>`<div class="match-row m-ok"><span>✓</span><span>${exp(g,90)}</span></div>`).join(''):'',
    (s.results||[]).length?`<div style="font-size:9.5px;color:var(--text3);font-weight:700;margin:6px 0 3px;">ผลที่นำเสนอ:</div>`+s.results.map(r=>`<div class="match-row m-ok"><span>✓</span><span>${exp(r,80)}</span></div>`).join(''):''
  ].join('');
  // Reference material, not a task to do every visit — kept to one compact
  // line + toggle rather than an always-expanded card (2026-08-17 direction).
  const patCard=`<div class="card">
    <div class="card-bd" style="padding:12px 16px;">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
        <span style="font-weight:800;color:var(--text);white-space:nowrap;">📦 ฐานเดิม</span>
        <span style="flex:1;min-width:0;">${exp(patShort,70)}</span>
      </div>
      ${((s.good&&s.good.length)||(s.results&&s.results.length))?`<button class="detail-toggle" onclick="toggleDetail('${patId}')">▾ ดูรายละเอียด</button><div class="detail-panel" id="${patId}">${patFull}</div>`:''}
    </div>
  </div>`;

  // ── Answer Builder — collapsed card is a teaser only; expanding it never
  // grows just this narrow column (that reproduced the exact Level-Workbench
  // whitespace bug on the left column). Instead it renders a separate
  // FULL-WIDTH workspace row below (see abWorkspace), matching 2026-08-17 spec.
  // Availability: only shown when there's real content to build an answer from
  // — an always-present "ช่วยร่างคำตอบ — ไม่มีข้อมูล" card was explicitly
  // rejected. No new DATA field needed; derived from content already present.
  const outId=`fe-out-${sid}`;
  const hasABContent=(s.selfAssessment&&s.selfAssessment.length)||(s.minReqs&&Object.keys(s.minReqs).length)||(s.gaps&&s.gaps.length);
  const abSteps=[['📝','บันทึกความคิดเห็นในแต่ละระดับ'],['✅','อัปเดตสถานะประเด็นที่ต้องปิด'],['✍️','สร้างร่างคำตอบจากข้อมูลที่บันทึก'],['📋','ตรวจแก้ก่อนคัดลอก']]
    .map(([ico,lbl])=>`<div class="ab-step"><div class="ab-step-ico">${ico}</div><span>${lbl}</span></div>`).join('');
  const abCard=hasABContent?`<div class="card">
    <div class="card-hd">🤖 ช่วยร่างคำตอบ (Answer Builder)</div>
    <div class="ab-steps">${abSteps}</div>
    <div class="ab-btn-row">
      <button class="ab-btn primary" onclick="openAB()">เปิดตัวช่วยร่างคำตอบ</button>
      <button class="ab-btn" onclick="abOpen=true;renderRight();var o=document.getElementById('${outId}');if(o)o.value=genScript('${sid}');">ดูตัวอย่างร่างล่าสุด</button>
    </div>
  </div>`:'';
  const abWorkspace=(abOpen&&hasABContent)?`<div class="full-row">
    <div class="card">
      <div class="card-hd" style="display:flex;align-items:center;gap:8px;">
        <span>✍️ ช่วยร่างคำตอบ — ข้อ ${sid}</span>

          <button class="ab-btn" onclick="toggleAB()">✕ ปิด</button>

  body.innerHTML=`
    <div class="sticky-mini">CG ${sid} · ${shortPhrase}</div>

      ${linkTagsHTML}
      <button class="clear-btn" style="margin-left:auto;" onclick="if(confirm('ล้างข้อมูลข้อ ${sid} ทั้งหมด?'))cgClearOne('${sid}')">🗑 ล้างข้อนี้</button>
    </div>
    <div class="workspace-row">
      <div class="context-col">${card1}${issuesCard}</div>
      ${cardL}
    </div>
    <div class="full-row">${evCard}</div>
    <div class="bottom-row">${patCard}${abCard||'<div></div>'}</div>

}

// ── Score totals ────────────────────────────────────────────────
function updateScores(){
  const subs=DATA.cg.subs;const tw=subs.reduce((a,s)=>a+s.w,0);
  const total=subs.reduce((a,s)=>a+s.w/tw*targets.cg[s.id],0);
  const delta=total-DATA.cg.orig;
  // Before anyone has ticked anything, total is mechanically 0 and delta is a
  // scary "-2.8315" that reads as "your score just got zeroed out" — it never
  // meant that, it meant "nothing entered yet". Say that plainly instead of
  // showing a misleading negative number (2026-08-18 feedback).
  const started=total>0.00005;
  document.getElementById('totalChip').textContent=started?('คาดการณ์ '+fmt(total)):'ยังไม่ประเมิน';
  document.getElementById('totalChip').className='chip '+(started?(delta>0?'ct':delta<0?'cr':'cn'):'cn');
  document.getElementById('totalFooter').textContent=started?fmt(total):'ยังไม่ประเมิน';
  document.getElementById('totalFooter').className='chip '+(started?(delta>0?'ct':delta<0?'cr':'cn'):'cn');
  document.getElementById('deltaChip').textContent=started?((delta>=0?'+':'')+fmt(delta)+' pts'):'';
  document.getElementById('deltaChip').style.color=started?(delta>0?'#1a9a50':delta<0?'#c03020':'#888'):'';
  document.getElementById('deltaFooter').textContent=started?((delta>=0?'+':'')+fmt(delta)):'';
  document.getElementById('deltaFooter').style.color=started?(delta>0?'#5fcf8a':delta<0?'#f0806a':'#888'):'';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.cg[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){const assessed=ss.filter(s=>cgDimRad[s.id]&&[1,2,3,4,5].some(L=>cgDimRad[s.id][L]>0)).length;const tot=ss.length;chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;chkEl.className='grp-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');}
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){gsEl.textContent=gs.toFixed(4);gsEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#555';}
    const dtEl=document.getElementById('rollup-delta-'+gid);
    if(dtEl){dtEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dtEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#aaa';}
    const barEl=document.getElementById('rollup-bar-'+gid);
    if(barEl){const fp=Math.round(gs/5*100);const fc=gs>=3.5?'#1f7a4a':gs>=2.5?'#f0a92e':'#b8291c';barEl.style.width=fp+'%';barEl.style.background=fc;}
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s.id);});
}

// คำนวณ L จาก checkbox ที่เช็คไว้
function calcLevelFromCheckbox(s) {
  const sid = s.id;
  const items = s.checkboxItems || [];
  const thresholds = s.checkboxThresholds || {};
  const maxL = s.checkboxMaxLevel || 5;
  let checked = 0;
  items.forEach((_, i) => { if (cgGetChkSim(sid, i)) checked++; });

  let score = 0;
  for (let L = maxL; L >= 1; L--) {
    if (checked >= (thresholds['L' + L] || 999)) { score = L; break; }
  }
  return { checked, score };
}

function renderCheckboxSim(s) {
  const sid = s.id;
  const items = s.checkboxItems || [];
  const thresholds = s.checkboxThresholds || {};
  const maxL = s.checkboxMaxLevel || 5;
  const { checked, score } = calcLevelFromCheckbox(s);

  // Level ที่เกินจาก checkbox base (maxL) เช่น L4–L5 สำหรับ 10.2 (maxL=3) หรือ L5 สำหรับ 5.3 (maxL=4)
  // ต้องยืนยันทีละระดับตามลำดับแบบ Confirmed/Not Confirmed เท่านั้น — ไม่มีคะแนนบางส่วน ห้ามชดเชยคะแนน Level ที่ยังไม่ครบ
  const extraLevels = [];
  for (let L = maxL + 1; L <= 5; L++) extraLevels.push(L);
  const hasExtraLevels = extraLevels.length > 0;
  const extraState = {};
  let extraSum = 0;
  {
    let priorOk = score >= maxL;
    extraLevels.forEach(L => {
      const selRaw = (cgDimRad[sid] && cgDimRad[sid][L]) || 0;
      const gateOk = priorOk;
      const confirmed = gateOk && selRaw >= 1;
      extraState[L] = { selRaw, gateOk, confirmed };
      extraSum += confirmed ? 1 : 0;
      priorOk = confirmed;
    });
  }
  const raw = score + extraSum;
  const wt = raw * (s.w / 100);
  targets.cg[sid] = raw; // ยังไม่ติ๊ก = 0 จริงๆ ไม่ fallback ไปคะแนนปีก่อน
  requestAnimationFrame(() => {
    const inp = document.getElementById('ti-' + sid);
    if (inp) {
      inp.value = fmt(targets.cg[sid]);
      inp.style.borderColor = targets.cg[sid] >= 4 ? '#2a8a4a' : targets.cg[sid] >= 3 ? '#5a8a00' : targets.cg[sid] >= 2 ? '#c07000' : '#c03020';
    }
  });

  // สร้าง progress bar ตาม thresholds
  const thKeys = Object.keys(thresholds).sort((a, b) => thresholds[a] - thresholds[b]);
  let progressHTML = `<div style="margin-bottom:8px;">`;
  progressHTML += `<div style="display:flex;justify-content:space-between;font-size:9px;color:#7a6a9a;margin-bottom:3px;">`;
  thKeys.forEach(lk => {
    const t = thresholds[lk];
    const pct = Math.min(100, Math.round(checked / items.length * 100));
    const reached = checked >= t;
    progressHTML += `<span style="color:${reached ? '#1a7a4a' : '#9a90b8'};font-weight:${reached ? '700' : '400'};">${lk}≥${t}</span>`;
  });
  progressHTML += `</div>`;
  const pct = Math.round(checked / items.length * 100);
  progressHTML += `<div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${pct}%;background:${score >= maxL ? '#1a7a4a' : '#b8291c'};"></div></div>`;
  progressHTML += `<div style="font-size:10px;color:#4a3a6a;margin-top:3px;">เช็คแล้ว <strong>${checked}/${items.length}</strong> ประเด็น → <strong style="color:${score >= maxL ? '#1a7a4a' : '#c07000'}">L${score || '-'}</strong></div>`;
  progressHTML += `</div>`;

  // Checkbox list
  let listHTML = `<div style="background:#f0ebff;border:1px solid #c8b8e8;border-radius:6px;padding:8px 10px;margin-bottom:8px;">`;
  listHTML += `<div class="cg-sect-lbl" style="margin-bottom:6px;">📋 ประเด็นที่เปิดเผยในรายงาน — เช็คทุกประเด็นที่มีอยู่จริง</div>`;
  items.forEach((item, i) => {
    const ck = cgGetChkSim(sid, i);
    const kid = `chksim-${sid}-${i}`;
    listHTML += `<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck ? 'checked' : ''} onchange="cgSetChkSim('${sid}',${i},this.checked);" style="accent-color:#b8291c;"><label for="${kid}" style="font-size:10.5px;">${item}</label></div>`;
  });
  listHTML += `</div>`;

  // Extra-level radios (เช่น L4–L5 สำหรับ 10.2, หรือ L5 สำหรับ 5.3) — Block จนกว่าระดับก่อนหน้าจะ Confirmed; ไม่มี partial score
  let l5HTML = '';
  extraLevels.forEach(L => {
    const { selRaw, gateOk, confirmed } = extraState[L];
    const trap = (s.subComps && s.subComps[L]) || [];
    l5HTML += `<div class="cg-lvl-row" style="border:1px solid #d4cce8;border-radius:6px;margin-bottom:6px;overflow:hidden;">
      <div class="cg-lvl-hd" style="background:${confirmed ? '#e4f5e4' : '#f0ebff'};">
        <span class="cg-lvl-num">L${L}</span>
        <span class="cg-lvl-summ"><span class="kt">${s.levelSumm[L - 1]}</span></span>
        <span style="font-size:10px;font-weight:700;color:${confirmed ? '#1a7a4a' : '#9a80c8'};">${confirmed ? '1.00' : '0.00'}</span>
      </div>
      <div class="cg-lvl-body">
        <div class="cg-sect-lbl">📐 มิติที่ประเมิน (L${L})</div>`;
    if (!gateOk) {
      l5HTML += `<div class="cg-trap">🔒 ต้องยืนยันระดับก่อนหน้าให้ครบก่อน จึงจะยืนยันสถานะ L${L} ได้ — หลักฐาน L${L} ที่มีอยู่ไม่สามารถชดเชยคะแนน Level ที่ยังไม่ครบได้</div>`;
    }
    l5HTML += `<div class="cg-radio-grp">`;
    [[0, 'ยังไม่ยืนยัน (Not Confirmed)'], [1, 'ยืนยันแล้ว — มีหลักฐานรองรับ (Confirmed)']].forEach(([v, lbl]) => {
      const ck = gateOk && selRaw === v;
      const col = v === 1 ? '#1a7a4a' : '#c03020';
      const dis = gateOk ? '' : 'disabled';
      l5HTML += `<label style="padding:3px 6px;border-radius:5px;background:${ck ? (v === 1 ? '#e0f5e8' : '#fee8e8') : 'transparent'};border:1px solid ${ck ? col : 'transparent'};color:${ck ? col : '#444'};font-weight:${ck ? '700' : '400'};cursor:${gateOk ? 'pointer' : 'not-allowed'};">
        <input type="radio" name="cgdim-${sid}-${L}" value="${v}" ${ck ? 'checked' : ''} ${dis} onchange="cgSetDim('${sid}',${L},${v});" style="accent-color:${col};"> ${lbl}</label>`;
    });
    l5HTML += `</div>`;
    if (trap.length) {
      l5HTML += `<div class="cg-sect-lbl" style="margin-top:6px;color:#7a2800;">⚠️ ข้อเสนอแนะจาก Feedback (ไม่ใช่ Manual Gate)</div>`;
      trap.forEach(t => { l5HTML += `<div class="cg-trap">• ${t}</div>`; });
    }
    l5HTML += `</div></div>`;
  });

  // Integration links
  const allLinks = [];
  for (let L = 1; L <= 5; L++) {
    const ls = (s.integLinks && s.integLinks[L]) || [];
    ls.forEach(d => { if (!allLinks.includes(d)) allLinks.push(d); });
  }
  const intB = allLinks.map(d => `<a href="${LINK_URL}" target="_blank" class="cg-int-link">🔗 ${d}</a>`).join('');
  const intSection = intB ? `<div style="margin:6px 0;display:flex;gap:4px;flex-wrap:wrap;">${intB}</div>` : '';

  // Traps (5.1)
  let trapHTML = '';
  const traps5 = (s.subComps && s.subComps[5]) || [];
  if (traps5.length && !hasExtraLevels) {
    trapHTML = `<div class="cg-sect-lbl" style="color:#7a2800;">⚠️ จุดดักคะแนน</div>`;
    traps5.forEach(t => { trapHTML += `<div class="cg-trap">• ${t}</div>`; });
  }

  return `<div class="cg-sim">
    <div class="cg-sim-hd">
      <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--chili);color:#fff;font-weight:700;">CG</span>
      &nbsp;Checkbox Simulator — เช็คประเด็นที่เปิดเผยแล้ว
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <button onclick="cgClearAll()" style="font-size:9px;padding:1px 8px;border:1.5px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;color:var(--text2);font-weight:700;">🗑 Clear</button>
        <span style="font-size:11px;font-weight:700;color:var(--chili-d);">${raw.toFixed(4)}/5.0</span>
      </span>
    </div>
    <div class="cg-scope-box">${s.scopeNote || ''}</div>
    ${progressHTML}
    ${listHTML}
    ${intSection}
    ${l5HTML}
    ${trapHTML}
    <div class="cg-total-bar">
      <span class="cg-total-lbl">คะแนนสะสม (0–5)</span>
      <span class="cg-raw">${raw.toFixed(4)}</span>
      <span class="cg-wt">× ${s.w}% = <strong>${wt.toFixed(4)} pts</strong></span>
    </div>
  </div>`;
}

</script>
</body>
</html>
