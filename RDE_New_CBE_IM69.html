<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Enablers — IM การจัดการนวัตกรรม ปี 2569</title>
<style>
@font-face{font-family:'Anakotmai';font-weight:300;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-light.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:500;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-medium.woff2') format('woff2');}
@font-face{font-family:'Anakotmai';font-weight:700;font-style:normal;src:url('https://pdee-hub.github.io/Enablers-Link-Document-69/Anakotmai/webfont/anakotmai-bold.woff2') format('woff2');}
</style>
<style>
/* ── PAT Editorial Light ── */
:root{
  --bg:#f8f7f4;--bg2:#f1efe9;--card:#ffffff;
  --border:#e6e3dc;--border-s:#ece9e1;
  --text:#1c1f24;--text2:#5a5f68;--text3:#9a9da3;
  --navy:#1e3a5c;--gold:#b8862f;
  --lv1:#e2554f;--lv2:#ef9483;--lv3:#e3a82e;--lv4:#5bc69a;--lv5:#1f9d6f;
  --shadow:0 1px 3px rgba(28,31,36,.06);
  --shadow-h:0 4px 12px rgba(28,31,36,.10);
  --radius:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Anakotmai',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;}
.sub-num,.sub-wt,.sub-now,.target-inp,.cg-raw,.cg-wt,.doc-file-code,.grp-id,.grp-wt,.cg-sect-lbl,.doc-grp-lbl,.doc-lvl-count{font-family:'Anakotmai',sans-serif;}

/* TOP NAV */
.top-nav{background:var(--navy);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--gold);}
.top-nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:13px;transition:color .15s;}
.top-nav a:hover{color:#fff;}
.top-nav h1{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);margin-left:2px;}
.top-nav .sep{color:rgba(255,255,255,.2);font-size:13px;}

/* DIM HEADER */
.dim-hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);}

/* CHIPS */
.chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.cn{background:var(--bg2);color:var(--text2);}
.ct{background:rgba(31,157,111,.12);color:#0f7a55;}
.cr{background:rgba(226,85,79,.10);color:#b91c1c;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:46% 54%;height:calc(100vh - 97px);overflow:hidden;}

/* LEFT */
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);background:var(--bg);}
.left-hd{padding:10px 16px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--navy);color:rgba(255,255,255,.9);letter-spacing:.2px;}
.left-body{flex:1;overflow-y:auto;}

/* GROUP HEADER — 2 rows */
.grp{display:flex;flex-direction:column;gap:3px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:0;z-index:2;}
.grp-row1{display:flex;align-items:center;gap:6px;}
.grp-row2{display:flex;align-items:center;gap:6px;padding-left:20px;}
.grp-id{font-size:12px;font-weight:700;color:var(--navy);min-width:16px;}
.grp-name{font-size:12px;font-weight:600;flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-wt{font-size:11px;color:var(--text3);white-space:nowrap;}
.grp-scores{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.grp-chk{font-size:9px;font-weight:500;padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.chk-all{background:#e4f5e4;color:#1a7a4a;}
.chk-part{background:#fef8e0;color:#92400e;}
.chk-none{background:#ebe8e0;color:var(--text3);}
.grp-score2{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex:1;white-space:nowrap;}
.grp-prog{width:48px;height:4px;background:#d8d4cc;border-radius:2px;overflow:hidden;flex-shrink:0;}
.grp-prog-fill{height:100%;border-radius:2px;transition:width .3s;}

/* SUB ROWS */
.sub{display:flex;align-items:stretch;cursor:pointer;border-bottom:1px solid var(--border-s);transition:background .12s;}
.sub:hover{background:rgba(30,58,92,.04);}
.sub.focus-cg{background:rgba(30,58,92,.07);border-left:3px solid var(--navy);}
.sub.focus-cg .sub-target{border-left-color:var(--navy);}
.sub-left{display:flex;align-items:center;padding:10px 10px 10px 20px;flex:1;min-width:0;}
.sub-meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;}
.sub-num{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-wt{font-size:11px;color:var(--text3);flex-shrink:0;}
.sub-now{font-size:11px;color:var(--text2);flex-shrink:0;}
.sub-name{font-size:13px;color:var(--text);flex:1;min-width:0;line-height:1.4;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dg{background:var(--lv5);}.da{background:var(--lv3);}.dr{background:var(--lv1);}

/* TARGET INPUT */
.sub-target{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 12px;flex-shrink:0;border-left:2px solid var(--border);width:96px;min-width:96px;background:var(--card);}
.target-lbl{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px;}
.target-inp{width:78px;font-size:12px;font-weight:700;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--navy);text-align:center;transition:border-color .15s,box-shadow .15s;}
.target-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(30,58,92,.12);background:#fff;}

/* SSTRIP */
.sstrip{padding:6px 12px 6px 24px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:8px;background:var(--card);cursor:pointer;transition:background .12s;}
.sstrip:hover{background:var(--bg2);}
.sbadge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.s0{background:var(--bg2);color:var(--text3);}
.s1{background:rgba(227,168,46,.15);color:#92400e;}
.s2{background:rgba(31,157,111,.12);color:#0f7a55;}

/* CHECKLIST */
.cl-wrap{padding:12px 16px;border-top:2px solid var(--navy);background:var(--card);flex-shrink:0;box-shadow:0 -2px 8px rgba(28,31,36,.04);}
.cl-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:7px;line-height:1.55;}
.cl-item input{flex-shrink:0;margin-top:3px;accent-color:var(--navy);width:14px;height:14px;}
.cl-note{font-size:11px;color:var(--text3);padding-top:6px;border-top:1px solid var(--border-s);margin-top:6px;}

/* TOTAL BAR */
.total{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--navy);color:#fff;flex-shrink:0;}
.total-lbl{font-size:13px;font-weight:600;flex:1;}
.total-note{font-size:11px;color:rgba(255,255,255,.45);}

/* RIGHT */
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--card);}
.right-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.frame{border-bottom:1px solid var(--border);}
.frame-hd{padding:8px 16px;font-size:12px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;}
.frame-bd{padding:12px 16px;font-size:13px;line-height:1.65;}
.ftag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.fa-hd{background:rgba(30,58,92,.06);}.fa-tag{background:rgba(30,58,92,.14);color:var(--navy);}
.fb-hd{background:rgba(2,132,199,.06);}.fb-tag{background:rgba(2,132,199,.14);color:#0369a1;}
.fc-hd{background:rgba(184,134,47,.08);}.fc-tag{background:rgba(184,134,47,.18);color:#92400e;}
.fd-hd{background:rgba(71,85,105,.06);}.fd-tag{background:rgba(71,85,105,.14);color:#475569;}
.fe-hd{background:rgba(31,157,111,.07);}.fe-tag{background:rgba(31,157,111,.14);color:#0f7a55;}

.box{border-radius:5px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;}
.box-red{background:rgba(226,85,79,.08);color:#7a1010;border-left:3px solid var(--lv1);}
.box-gray{background:var(--bg2);color:var(--text2);}
.match-row{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:3px 0;}
.m-ok{color:var(--lv5);}.m-no{color:var(--lv1);}
.exp-btn{border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--navy);font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.8;white-space:nowrap;transition:background .12s;}
.exp-btn:hover{background:var(--border);}

/* SIMULATOR */
.cg-sim{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
.cg-sim-hd{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cg-scope-box{background:rgba(30,58,92,.05);border-left:3px solid var(--navy);border-radius:0 5px 5px 0;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;}
.cg-lvl-row{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:opacity .2s,box-shadow .15s;background:var(--card);}
.cg-lvl-row:not(.blocked):hover{box-shadow:var(--shadow-h);}
.cg-lvl-row.blocked{opacity:.3;pointer-events:none;}
.cg-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s;}
.cg-lvl-hd:hover{background:var(--bg2);}
.cg-lvl-num{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--navy);color:#fff;flex-shrink:0;}
.cg-lvl-summ{font-size:13px;color:var(--text);flex:1;line-height:1.4;display:flex;align-items:center;gap:5px;overflow:hidden;min-width:0;}
.cg-lvl-summ .kt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
.cg-toggle{background:none;border:1px solid #c0b0e0;border-radius:4px;cursor:pointer;font-size:11px;color:#5a20a0;padding:1px 6px;flex-shrink:0;transition:background .1s;}
.cg-toggle:hover{background:#ece6ff;}
.cl-short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
.cl-exp-btn{font-size:9.5px;color:#5a20a0;cursor:pointer;user-select:none;margin-top:2px;display:inline-block;}
.dep-count-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px 5px;background:#f8f5ff;border-bottom:1px solid #d8ccee;}
.dep-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap;}
.dep-pill span{font-weight:400;opacity:.85;}
.cg-lvl-summ .kt{font-weight:700;color:var(--navy);}
.cg-lvl-detail{padding:8px 14px 10px;background:rgba(30,58,92,.04);border-top:1px dashed var(--border);font-size:13px;color:var(--text2);line-height:1.7;display:none;}
.cg-lvl-detail.open{display:block;}
.cg-lvl-body{padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--border-s);}
.cg-sect-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;}
.cg-req-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;padding:6px 10px;border-radius:5px;transition:background .1s;}
.cg-req-item:hover{background:var(--bg2);}
.cg-req-item input[type=checkbox]{flex-shrink:0;margin-top:2px;accent-color:var(--navy);width:15px;height:15px;cursor:pointer;}
.cg-int-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:opacity .15s;}
.cg-int-link:hover{opacity:.8;}
.cg-radio-grp{display:flex;flex-direction:column;gap:4px;}
.cg-radio-grp label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .12s;line-height:1.4;}
.cg-radio-grp label:hover{background:var(--bg2);}
.cg-radio-grp input[type=radio]{accent-color:var(--navy);flex-shrink:0;width:15px;height:15px;}
.cg-trap{font-size:13px;color:#7a2800;margin-bottom:6px;padding:5px 10px 5px 12px;border-left:3px solid var(--lv1);border-radius:0 4px 4px 0;background:rgba(226,85,79,.05);line-height:1.55;}
.cg-prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:8px;}
.cg-prog-fill{height:4px;border-radius:2px;transition:width .3s ease;}
.cg-total-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-radius:5px;border:1px solid var(--border);margin-top:8px;}
.cg-total-lbl{font-size:12px;color:var(--text2);flex:1;}
.cg-raw{font-size:16px;font-weight:700;color:var(--navy);}
.cg-wt{font-size:12px;color:var(--text3);}

/* FRAME B — Documents */
.doc-lvl-block{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-lvl-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(2,132,199,.06);cursor:pointer;transition:background .12s;}
.doc-lvl-hd:hover{background:rgba(2,132,199,.10);}
.doc-lvl-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#0369a1;color:#fff;flex-shrink:0;}
.doc-lvl-title{font-size:13px;font-weight:600;color:#0369a1;flex:1;}
.doc-lvl-count{font-size:11px;color:var(--text3);}
.doc-lvl-body{padding:8px 12px 12px;display:none;background:var(--bg);border-top:1px solid var(--border);}
.doc-lvl-body.open{display:block;}
.doc-grp{margin-bottom:8px;}
.doc-grp-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:flex;align-items:center;gap:6px;}
.doc-file{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);padding:3px 0 3px 8px;line-height:1.5;}
.doc-file-code{color:#0369a1;font-weight:700;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.doc-file-name{color:var(--text2);flex:1;}
.doc-missing{background:rgba(184,134,47,.08);border:1px dashed rgba(184,134,47,.4);border-radius:5px;padding:8px 12px;font-size:13px;color:#92400e;}
.doc-missing-req{background:rgba(30,58,92,.05);border:1px solid rgba(30,58,92,.15);border-radius:5px;padding:8px 12px;font-size:13px;color:var(--navy);margin-top:8px;}
.doc-all-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;background:#0369a1;color:#fff;text-decoration:none;font-weight:600;margin-top:8px;cursor:pointer;border:none;transition:opacity .15s;}
.doc-all-btn:hover{opacity:.85;}
.fb-prog-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);}
.fb-prog-track{flex:1;height:4px;background:#e0ddd8;border-radius:2px;overflow:hidden;}
.fb-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.55;margin:2px 0;border:1px solid transparent;transition:background .12s;}
.fb-item:hover{background:rgba(2,132,199,.05);}
.fb-item-done{background:#f0faf0 !important;border-color:#c3e6cb !important;}
.fb-item-done .fb-item-text{color:#1a7a4a;text-decoration:line-through;opacity:.7;}
.fb-item-gap{border-left:3px solid #d97706;}
.fb-gap-tag{font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;padding:1px 5px;border-radius:10px;flex-shrink:0;white-space:nowrap;margin-top:1px;}
.fb-item input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#0369a1;width:14px;height:14px;cursor:pointer;}
.fb-item-text{color:var(--text2);flex:1;}

/* FRAME E — Self-Assessment Input + Gen */
.fe-sim-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap;}
.fe-sect-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;}
.fe-lvl-block{margin-bottom:5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.fe-lvl-active{border-color:#86efac;}
.fe-lvl-hd{display:flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;transition:background .12s;background:var(--bg2);}
.fe-lvl-hd:hover{background:rgba(0,0,0,.03);}
.fe-lvl-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;flex-shrink:0;}
.fe-lvl-title{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.fe-doc-ref{font-size:11px;color:#0369a1;font-weight:600;flex-shrink:0;}
.fe-lvl-body{padding:8px 11px 10px;display:none;border-top:1px solid var(--border);background:var(--bg);}
.fe-lvl-body.open{display:block;}
.fe-textarea{width:100%;box-sizing:border-box;padding:7px 10px;font-size:12.5px;line-height:1.65;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;transition:border-color .15s;}
.fe-textarea:focus{outline:none;border-color:#0369a1;box-shadow:0 0 0 2px rgba(3,105,161,.1);}
.fe-gap-item{padding:8px 11px 10px;margin-bottom:5px;background:rgba(217,119,6,.05);border:1px solid rgba(217,119,6,.22);border-radius:var(--radius);}
.fe-gap-text{font-size:12.5px;color:#92400e;margin-bottom:6px;line-height:1.55;}
.fe-gap-status{display:flex;gap:14px;margin-bottom:7px;}
.fe-radio-lbl{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2);}
.fe-radio-lbl input{accent-color:#1a7a4a;cursor:pointer;}
.fe-gen-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:8px 20px;border-radius:20px;background:#1e3a5c;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.fe-gen-btn:hover{opacity:.85;}
.fe-output{width:100%;box-sizing:border-box;padding:10px 12px;font-size:12px;line-height:1.75;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:'Anakotmai',sans-serif;resize:vertical;}
.fe-copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 14px;border-radius:20px;background:#0369a1;color:#fff;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;margin-top:6px;}
.fe-copy-btn:hover{opacity:.85;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#c9c5bc;}

/* ── Cross-Dimension Linkage Badges ── */
.dim-badge{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;letter-spacing:.4px;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .15s;}
.dim-badge:hover{opacity:.75;}
.dim-gap-tag{font-size:9px;font-weight:700;color:#b05000;padding:1px 5px;border-radius:3px;background:#fff3e0;border:1px solid #e07000;white-space:nowrap;}
.crosslink-summ{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 12px;background:#f5f0ff;border-bottom:1px solid #d8ccee;font-size:9.5px;color:#4a3a6a;}
.lvl-dim-strip{display:flex;gap:3px;flex-wrap:wrap;padding:3px 12px 4px;background:rgba(240,235,255,.6);border-bottom:1px solid #e8e0f8;}

มีเดีย, การแจ้งลูกค้าในการประชุม)"],"2":["คู่มือค่านิยมหรือประกาศที่ระบุ \"พฤติกรรมพึงประสงค์ (Do & Don't)\" ด้านนวัตกรรมของผู้บริหาร","หลักฐานภาพถ่าย/รายงานการประชุมที่ผู้บริหารลงมามีส่วนร่วมจริง (เช่น เป็น Mentor โครงการ PAT DNA, เป็นประธานมอบรางวัลนวัตกรรม)","ผลการสำรวจ/ประเมินบทบาทการเป็น Role Model ด้านนวัตกรรม"],"3":["เอกสารสรุปตัวชี้วัดและเป้าหมายนวัตกรรม ที่แยกมิติ \"การเงิน (เช่น รายได้ 10 ลบ.)\" และ \"ไม่ใช่การเงิน\" ชัดเจน","ตาราง Cascade KPI: เอกสารหรือแผนภาพแสดงการถ่ายทอดเป้าหมายจากองค์กร ลงสู่สายงาน/ฝ่ายงาน และลงลึกถึง \"ผู้รับผิดชอบรายบุคคล\"","เอกสาร/แบบประเมินผลการปฏิบัติงานรายบุคคล (PMS) ที่มีหัวข้อด้านความคิดสร้างสรรค์/นวัตกรรม"],"4":["แผนภาพแสดงความเชื่อมโยงยุทธศาสตร์ (Strategy Map / Alignment Table) ระหว่างแผนแม่บท IM กับแผนวิสาหกิจและแผนแม่บทของ Enablers อื่นๆ","รายงานการประชุมคณะทำงาน/ผู้บริหาร ที่แสดงการพิจารณางานด้านนวัตกรรมร่วมกับฝ่ายอื่นๆ (เช่น ฝ่าย IM ประชุมร่วมกับฝ่าย SCM หรือ DT เพื่อนำ VOC มาตั้งเป็นโจทย์นวัตกรรม)"],"5":["รายงานการประชุมผู้บริหารระดับสูงที่มีวาระ \"ติดตามผลการดำเนินงานนวัตกรรม\" (รายไตรมาส/รายปี)","เอกสารบันทึกการทบทวนและปรับปรุง (Review & Improvement Record): เอกสารอธิบายการนำ Feedback (เช่น เสียงสะท้อนจากพนักงาน หรือผลงานที่ไม่บรรลุเป้า) มาใช้พิจารณา \"ปรับเปลี่ยน\" นโยบาย แผนงาน หรือ KPI ด้านนวัตกรรมในปีถัดไป"]},"docsNeeded":[{"level":"L3+","req":"แบบประเมิน Role Model ด้านนวัตกรรม: ต้องเป็นแบบประเมินผู้บริหารที่ \"ประเมินแยกเป็นรายบุคคล\" อย่างเป็นรูปธรรม ไม่ใช่การประเมินในภาพรวม"},{"level":"L3+","req":"เอกสารการกระจายเป้าหมาย (Cascade KPI): ต้องมีตารางหรือเอกสารที่แสดงการถ่ายทอดเป้าหมายทางการเงิน (เช่น รายได้จากนวัตกรรม 10 ล้านบาท) ลงสู่ \"ระดับรายโครงการ\" หรือ \"ผู้รับผิดชอบ\" อย่างชัดเจน เพื่อแสดงความรับผิดชอบ (Accountability)"}],"actions":["การสอบทานความเชื่อมโยงของยุทธศาสตร์อย่างเป็นระบบ กทท. ควร ทบทวนแนวทางการสอบทานความเชื่อมโยงของแผนการจัดการนวัตกรรมกับยุทธศาสตร์หลักขององค์กร และแผนงาน/แผนแม่บทที่สำคัญในด้านอื่นๆ เช่น แผนการมุ่งเน้นลูกค้าและผู้มีส่วนได้ส่วนเสีย (SCM), แผนการจัดการความรู้ (KM), แผนการพัฒนาเทคโนโลยีดิจิทัล (DT) และแผนบริหารทรัพยากรบุคคล (HCM) เพื่อให้การขับเคลื่อนนวัตกรรมเป็นไปในทิศทางเดียวกันและสนับสนุนเป้าหมายเชิงยุทธศาสตร์ขององค์กรได้อย่างมีประสิทธิภาพ","กทท. สอบผ่านระดับ 1 และ 2 มาได้เพราะผู้บริหารลงมาขับเคลื่อนเองและมีเวทีอย่าง PAT DNA แต่คะแนนมาหยุดอยู่ที่ระดับ 2 กลางๆ และไม่เต็ม 3 เพราะ ปัญหาเชิงโครงสร้างของ KPI ที่เป้าหมายด้านการเงินยังกระจุกตัวอยู่ระดับบน ไม่ถูกส่งต่อไปผูกกับผลงานรายบุคคลอย่างเข้มข้นพอ และการนำแผนไปเชื่อมโยงกับฝ่ายอื่น (ระดับ 4) ยังเป็นเพียงการจัดประชุม แต่ขาดระบบการ \"สอบทาน\" ที่เป็นมาตรฐาน หากในปีต่อไป กทท. ทำแบบประเมิน Role Model รายบุคคล และแตก KPI รายได้ลงสู่คนทำโครงการนวัตกรรมได้จริง คะแนนในข้อนี้จะสามารถทะลุระดับ 3.0 ได้อย่างแน่นอน"],"crossLinks":[{"level":1,"dim":"SP"},{"level":1,"dim":"SCM"},{"level":2,"dim":"HCM"},{"level":3,"dim":"SP"},{"level":3,"dim":"HCM"},{"level":4,"dim":"SP"},{"level":4,"dim":"SCM"},{"level":4,"dim":"DT"},{"level":4,"dim":"KM"},{"level":4,"dim":"HCM"},{"level":5,"dim":"CG"},{"level":5,"dim":"SP"}],"good":["กทท. ผ่านระดับ 1–2 ทั้งการสื่อสารวิสัยทัศน์และผู้บริหารเป็นต้นแบบอย่างเป็นรูปธรรม"],"results":["ผู้บริหารระดับสูงกำหนดและสื่อสารวิสัยทัศน์ \"ขับเคลื่อนนวัตกรรมขององค์กรเพื่อการเติบโตอย่างยั่งยืน\" ผ่านช่องทางต่างๆ เช่น สัมมนา, Line OA, เว็บไซต์","ผู้บริหารปฏิบัติตนเป็น Role Model ตามค่านิยม SMART PAT (เน้น Agility) และมีส่วนร่วมในการเป็น Mentor หรือกรรมการในเวทีประกวด PAT DNA","มีการกำหนด KPI ด้านนวัตกรรม เช่น เป้าหมายรายได้ 10 ล้านบาท และจัดทำตัวอย่างการถ่ายทอด KPI (Cascade KPI) ลงสู่ระดับสายงาน ฝ่าย และบุคคล","จัดการประชุมทบทวนแผนแม่บทนวัตกรรมร่วมกับคณะกรรมการ HR และคณะกรรมการกลั่นกรองฯ เพื่อบูรณาการแผนนวัตกรรมให้สอดคล้องกับแผนยุทธศาสตร์อื่นๆ"],"gaps":["การกำหนดและถ่ายทอด KPI : แม้ กทท. จะมีการทำเอกสาร Cascade KPI แต่ผู้ตรวจมองว่า \"เป้าหมายนวัตกรรมยังขาดความท้าทาย\" และ \"เป้าหมายทางการเงิน (10 ล้านบาท) ยังเป็นภาพรวมขององค์กรเกินไป\" กทท. จำเป็นต้องกระจายเป้าหมายนี้ลงลึกเป็น \"รายโครงการ\" หรือ \"ผู้รับผิดชอบ\" ให้ชัดเจน เพื่อให้เกิดความรับผิดชอบอย่างแท้จริง (Accountability)","การเชื่อมโย 2":["คำสั่งแต่งตั้งคณะทำงานขับเคลื่อนนวัตกรรม (เช่น Innovation Champion, คณะทำงานต่อยอดนวัตกรรม, Core IM Team, PAT DNA)","โครงสร้างองค์กรและ Job Description (JD) ที่ระบุหน้าที่ความรับผิดชอบด้านนวัตกรรมของผู้รับผิดชอบหลัก (เช่น กองวิจัยและพัฒนาองค์กร)"],"3":["รายงานการประชุม (Minutes of Meeting) ของทุกคณะทำงานที่ตั้งไว้ในระดับ 1 และ 2","[แก้ไข Gap สำคัญ] ตารางสรุปการดำเนินงาน (Checklist) ที่นำ \"ข้อบังคับในกฎบัตร\" มาเทียบกับ \"ผลงานที่ทำจริง\" เพื่อพิสูจน์ว่าทำครบถ้วนทุกข้อ"],"4":["แผนภาพแสดงระบบนวัตกรรมองค์กร (PAT-CIS) ฉบับอัปเดต","[แก้ไข Gap สำคัญ] แผนภาพโครงสร้างองค์กร (Organization Chart) ที่เอาชื่อคณะทำงานต่างๆ ไปวางแปะ (Mapping) ให้เห็นชัดเจนว่าคณะทำงานชุดไหน รับผิดชอบกลไกไหนในระบบ PAT-CIS"],"5":["รายงานผลการประเมินประสิทธิภาพโครงสร้างการทำงาน / รายงานปัญหาอุปสรรค (AAR) ของกระบวนการนวัตกรรม","บันทึก/คำสั่งปรับปรุงโครงสร้าง: เอกสารแสดงการเปลี่ยนแปลงโครงสร้างหรือกลไกการทำงาน"]},"docsNeeded":[{"level":"L3+","req":"รายงานการประชุมคณะกรรมการและคณะทำงาน IM: ต้องไฮไลต์ให้เห็นชัดเจนว่ามีการให้ \"ข้อเสนอแนะเชิงกลยุทธ์\" และ \"การติดตามผลการดำเนินงาน\" ตามบทบาทหน้าที่อย่างต่อเนื่องและเป็นรูปธรรม"}],"actions":["กทท. ต้องมีระบบติดตามผลการปฏิบัติงานของคณะทำงานตามบทบาทหน้าที่ในกฎบัตรอย่างเคร่งครัดและต้องมีการประเมินว่าคณะทำงานชุดต่างๆ (เช่น ทีมต่อยอดนวัตกรรม หรือ Innovation Champion) ทำงานได้มีประสิทธิภาพหรือไม่ หากพบปัญหาต้องมีหลักฐานว่าได้นำปัญหานั้นมาทบทวนหรือปรับปรุงโครงสร้างต่อไป"],"crossLinks":[{"level":1,"dim":"HCM"},{"level":2,"dim":"HCM"},{"level":2,"dim":"CG"},{"level":3,"dim":"ระดับนี้เป็นการพิสูจน์ว่าคณะทำงานลงมือทำงานจริง ดังนั้นหลักฐานคือ \"รายงานการประชุมคณะทำงาน\" ที่ไปขับเคลื่อนหมวดอื่นๆ (IM6.2, IM6.3)"},{"level":4,"dim":"ระบบนวัตกรรมองค์กร (CIS) (IM 6.1)"},{"level":5,"dim":"CG/ผู้บริหาร/HCM"}],"good":["กทท. ผ่านระดับ 1–2 มีโครงสร้าง Core IM Team และคณะทำงานข้ามสายงานชัดเจน","กทท. วางโครงสร้างและกฎบัตรคณะทำงานนวัตกรรมไว้ดีมาก (ผ่านระดับ 1–2 เต็ม)"],"results":["มีคำสั่งแต่งตั้งคณะกรรมการจัดการความรู้ เทคโนโลยีและนวัตกรรม (KMDTIM) และมีการจัดทำกฎบัตรที่ระบุอำ ":["L1 — กำหนดหลักเกณฑ์การจัดสรรทรัพยากรด้านนวัตกรรม เพื่อนำไปสู่การจัดสรรทรัพยากรทางการเงินและไม่ใช่การเงินได้อย่างมีประสิทธิภาพ","L2 — นำหลักเกณฑ์มาใช้จัดลำดับความสำคัญ (Prioritization) ของแผนงาน/โครงการ เพื่อจัดสรรทรัพยากรให้แต่ละโครงการอย่างเป็นระบบ","L3 — รัฐวิสาหกิจจัดสรรทรัพยากรทางการเงินและไม่ใช่การเงิน ครอบคลุมแผนการดำเนินงานด้านการจัดการนวัตกรรมที่สำคัญ","L4 — การจัดสรรทรัพยากรสอดคล้องกับแผนงานด้านการจัดการนวัตกรรม และ \"สอดคล้องกับแนวทางการจัดสรรทรัพยากรขององค์กร (แผนวิสาหกิจ)\"","L5 — การประเมิน \"ความเพียงพอของทรัพยากรระหว่างการดำเนินงาน\" เพื่อปรับปรุงการจัดสรรทรัพยากร และทบทวนเพื่อให้มั่นใจว่ามีงบ/คนพร้อมต่อการทำงานอย่างต่อเนื่องจนบรรลุเป้าหมาย"],"minReqs":{"1":["คู่มือการบริหารจัดการนวัตกรรม หรือประกาศ ที่ระบุ \"เกณฑ์การจัดสรรทรัพยากร\" ชัดเจนเป็นลายลักษณ์อักษร","ผังกระบวนการ (SIPOC) การจัดสรรทรัพยากรด้านนวัตกรรม"],"2":["เอกสาร/ตารางสรุป \"ผลการให้คะแนนและจัดลำดับความสำคัญของโครงการ (Project Ranking/Scoring)\" ประจำปี"],"3":["รายงานผลการจัดสรรงบประมาณจริง (เช่น เอกสารอนุมัติงบ 12.789 ล้านบาทให้กับโครงการนวัตกรรมที่ผ่านการคัดเลือก)","คำสั่งมอบหมายงาน/แต่งตั้งบุคลากร (เช่น คำสั่งให้กองวิจัยและพัฒนาองค์กรเป็นผู้รับผิดชอบหลัก) ซึ่งถือเป็นการจัดสรรทรัพยากรด้านบุคคล"],"4":["ตารางแสดงความเชื่อมโยง (Alignment Mapping) ระหว่าง \"แผนงบประมาณโครงการนวัตกรรม\" กับ \"แผนวิสาหกิจ/แผนยุทธศาสตร์องค์กร\""],"5":["รายงานความคืบหน้าการดำเนินงานนวัตกรรมรายไตรมาส (Q1-Q4) ที่มี \"วาระการประเมินความเพียงพอของทรัพยากร\"","บันทึกมติที่ประชุม/คำสั่งอนุมัติ \"การโยกย้าย, เพิ่มเติม, หรือชะลอทรัพยากร (Resource Re-allocation)\" ระหว่างปี"]},"docsNeeded":[{"level":"L3+","req":"เกณฑ์การจัดลำดับความสำคัญของโครงการ: ฉบับที่ปรับปรุงให้เข้มข้นขึ้น โดยสะท้อนถึงการรองรับสถานการณ์ที่มีข้อจำกัดด้านทรัพยากร และความคุ้มค่าทางการเงิน"},{"level":"L3+","req":"บันทึกการจัดสรรงบประมาณ/ทรัพยากรที่ยืดหยุ่น: เอกสารแสดงความสามารถในการปรับทรัพยากรให้โครงการสำคัญได้อย่างเหมาะสม"}],"actions":["เรียนรู้จาก Best Practice โดยมีกิจกรรมในหัวข้อนี้ คือ \"มีหลักเกณฑ์จัดลำดับความสำคัญโครงการนวัตกรรมเพื่อจัดสรรทร \"ความต้องการที่ยังไม่ถูกเติมเต็ม (Unmet Need)\" แล้วนำความต้องการนั้นมาตั้งเป็นโจทย์ในการพัฒนานวัตกรรมผลิตภัณฑ์/บริการต่อไป","levelSumm":["L1 — การรวบรวมข้อมูลที่เป็น Big data ที่เกี่ยวข้องกับกลุ่มลูกค้าทั้งในปัจจุบันแล","L2 — การรวบรวมข้อมูลที่เกิดจากการศึกษาพฤติกรรม การสัมภาษณ์กลุ่มลูกค้าทั้งในปัจจุ","L3 — การวิเคราะห์ข้อมูล (Data Analytic) เพื่อคาดการณ์ความต้องการของกลุ่มลูกค้าทั","L4 — การจัดทำ Customers/Consumers Persona, Customer/Consumers Journey ของกลุ่มลู","L5 — รัฐวิสาหกิจประเมินและปรับปรุงกระบวนการรวบรวมข้อมูลและสารสนเทศเพื่อการพัฒนาน"],"dimLevels":["L1 — การรวบรวมข้อมูลที่เป็น Big data ที่เกี่ยวข้องกับกลุ่มลูกค้าทั้งในปัจจุบันและอนาคต (Existing and Potential customers/consumers)","L2 — การรวบรวมข้อมูลที่เกิดจากการศึกษาพฤติกรรม การสัมภาษณ์กลุ่มลูกค้าทั้งในปัจจุบันและอนาคต","L3 — การวิเคราะห์ข้อมูล (Data Analytic) เพื่อคาดการณ์ความต้องการของกลุ่มลูกค้าทั้งในปัจจุบันและอนาคต","L4 — การจัดทำ Customers/Consumers Persona, Customer/Consumers Journey ของกลุ่มลูกค้า ทั้งในปัจจุบันและอนาคต เพื่อหาความต้องการของลูกค้าที่ยังไม่ถูกเติมเต็ม (Unmet Need)","L5 — รัฐวิสาหกิจประเมินและปรับปรุงกระบวนการรวบรวมข้อมูลและสารสนเทศเพื่อการพัฒนานวัตกรรมมุ่งเน้นลูกค้าและตลาด เพื่อเพิ่มประสิทธิภาพของการดำเนินการให้มีผลสำเร็จที่ดีกว่าเป้าหมายและดีขึ้นกว่าปีที่ผ่านมา"],"minReqs":{"1":["ผังกระบวนการ (SIPOC) แนวทางการรวบรวมข้อมูลลูกค้า","ภาพหน้าจอ (Screen Capture) ของระบบสารสนเทศที่เป็น Big Data (เช่น ระบบ PCS, PAT FIT, SAP, E-Gate, Marine Traffic)"],"2":["ประเด็นคำถาม/แบบฟอร์มการสัมภาษณ์เชิงลึก (In-depth Interview) หรือ Focus Group สำหรับลูกค้ากลุ่มอดีต ปัจจุบัน และอนาคต","รายงานสรุปผล/บันทึกข้อมูลการสัมภาษณ์กลุ่มลูกค้า (โดยเฉพาะการแยกรายงานผลสัมภาษณ์ของกลุ่ม \"ลูกค้าในอนาคต\" ออกมาให้เห็นชัดเจน)"],"3":["รายงานผลการวิเคราะห์ข้อมูล (Data Analytics Report) ที่สะท้อนความต้องการของลูกค้า","[แก้ไข Gap สำคัญ] ภาพหน้าจอกระบวนการนำเทคโนโลยี AI มาประมวลผลข้อมูล (เช่น การแสดงผล Dashboard ของระบบ PAT EDW ที่ใช้ Large Language Model (LLM))"],"4":["เอกสารแผนภาพเส้นทางการเดินทางของลูกค้า (Customer Journey) และจุดสัมผัสบริการ (Touch Point)","ตารางสรุปความต้องการที่ยังไม่ถูกเติมเต็ม (Unmet Need) และการระบุแนวทางการพัฒนาผลิตภัณฑ์/บริการใหม่เพื่อตอบสนองความต้องการนั้น"],"5":["รายงานผลการประเมินประสิทธิภาพของระบบการเก็บและวิเคราะห์ข้อมูล (AAR ของกระบวนการทำ Data Analytics)","หลักฐานเชิงประจักษ์ในการปรับปรุงกระบวนการ (Before & After)"]},"docsNeeded":[{"level":"L3+","req":"รายงานการพยากรณ์ความต้องการ (Predictive Data Analytics Report): รายงาน หรือ Dashboard ที่นำ Big Data และเสียงลูกค้ามาวิเคราะห์เชิงลึก เพื่อ \"พยากรณ์ (Predict)\" ความต้องการในอนาคตที่ยังไม่ถูกเติมเต็ม (Unmet Need) (ไม่ใช่แค่เอกสารสรุปการสัมภาษณ์)"},{"level":"L3+","req":"เอกสาร Customer Journey/Persona กลุ่มลูกค้าอนาคต: แผนภาพจุดสัมผัสบริการของลูกค้าอนาคตเพื่อหาความต้องการแฝง"}],"actions":["บูรณาการข้อมูลร่วมกับด้าน SCM และ DT: ต้องนำข้อมูลเสียงลูกค้า (VOC) และข้อร้องเรียนจากระบบของฝ่าย SCM รวมถึงใช้ฐานข้อมูล Big Data ขององค์กรจากฝ่ายเทคโนโลยีดิจิทัล (DT) มาตั้งเป็นโจทย์ในการวิเคราะห์และพัฒนานวัตกรรม","เรียนรู้ Best Practice จาก รฟม. (การรถไฟฟ้าขนส่งมวลชนแห่งประเทศไทย): รฟม. ได้คะแนนในข้อนี้ 2.0000 โดยมีจุดเด่นคือ \"รวบรวม Big Data ทั้งลูกค้าปัจจุบันและอนาคต นำมาทำ Data Analytic พยากรณ์ความต้องการ\" กทท. ควรจัดทำกระบวนการให้เห็นภาพชัดเจนเหมือน รฟม. ว่า \"เรานำเข้า Big Data -> เข้าสู่ระบบวิเคราะห์ (AI/Analytics) -> ได้ผลผลิตเป็น Product/Service ใหม่\"","โชว์ผลลัพธ์ของ Predictive Data Analytics ให้เป็นรูปธรรม: ในปีหน้า ต้องมีรายงาน (Report) หรือ Dashboard หน้าตาของการวิเคราะห์ที่แสดงให้เห็นชัดเจนว่า การเอา Data มาวิเคราะห์เชิงพยากรณ์นั้น ทำอย่างไร และชี้เป้า Unmet Need ได้หน้าตาเป็นแบบไหน ไม่ใช่เพียงแค่สรุปผลการสัมภาษณ์"],"crossLinks":[],"good":["กทท. ผ่านระดับ 1 รวบรวมข้อมูลผ่าน E-complaint, PCS และสัมภาษณ์ลูกค้าเชิงลึกแล้ว","กทท. ทำได้ดีในการ 'รับฟัง' แต่ต้องพัฒนาเพิ่มด้าน 'การพยากรณ์ล่วงหน้า'"],"results":["มีการรวบรวมข้อมูล Big Data จากระบบต่างๆ เช่น SAP, VCMS, CTMS, Marine Traffic, ระบบ E-Gate และมีการดำเนินโครงการ Port Community System (PCS)","รวบรวมข้อมูลจากการศึกษาพฤติกรรม สัมภาษณ์เชิงลึก (In-depth Interview) และ Focus Group กลุ่มลูกค้าปัจจุบันและลูกค้าอนาคต","วิเคราะห์ข้อมูล (Data Analytic) ด้วยเทคโนโลยี AI (Large Language Model) ภายใต้ระบบ PAT EDW และคาดการณ์ว่าลูกค้าในอนาคตจะสนใจบริการ Free Zone และ Dry Port","จัดทำ Customer Journey และ Customer Persona เพื่อหาความต้องการแฝง (Unmet Need)"],"gaps":["ปัญหาเรื่องการทำ Data Analytics สู่การพยากรณ์ : แม้ กทท. จะบอกว่ามีการสัมภาษณ์และเก็บข้อมูลต่างๆ แล้ว แต่คะแนนมาหยุดที่ 1.7500 (ไม่ผ่านระดับ 2 เต็ม) เพราะผู้ตรวจชี้ให้เห็นช่องว่าง (Gap) สำคัญว่า \"การทำ Data Analytics เพื่อพยากรณ์ (Predictive) ความต้องการของกลุ่มลูกค้าในอนาคตยังไม่ชัดเจน\"","ความต่างระหว่าง Descriptive vs. Predictive : ผู้ตรวจมองว่าข้อมูลที่ กทท. มี ยังเป็นแค่การรับฟังเสียงลูกค้า แต่ยังขาดการนำข้อมูลเหล่านั้นมาทำ \"Predictive Data Analytics\" (การวิเคราะห์ข้อมูลเชิงพยากรณ์) เชิงลึกในรูปแบบ Big Data เพื่อคาดการณ์ความต้องการในอนาคตที่ยังไม่ถูกเติมเต็ม (Unmet Need) อย่างแท้จริง"]},{"id":"4.1","grp":"4","gname":"ความรู้สู่การสร้างนวัตกรรม","gw":5.0,"gs68":1.45,"name":"การจัดการความรู้สู่การสร้างนวัตกรรม","w":5.0,"s68":1.45,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมินการเปลี่ยนบทบาทของ KM จาก \"ห้องสมุดเก็บเอกสาร\" ให้กลายเป็น \"เครื่องมือสร้างนวัตกรรม\" (Knowledge-based Innovation) โดยต้องมีการตั้งตัวชี้วัด (KPI) เทียบกับคู่แข่งระดับโลก และนำบทเรียน (AAR) หรือความรู้จากชุมชนนักปฏิบัติ (CoP) ไปต่อยอดสร้างผลิตภัณฑ์ บริการ หรือกระบวนการใหม่ที่ \"สร้างมูลค่าเพิ่ม (Value Added)\" ให้กับองค์กรได้จริง","levelSumm":["L1 — การกำหนดตัวชี้วัดที่สำคัญ (และค่าเป้าหมาย) ขององค์กรในเชิงบูรณาการ จากทุกแห","L2 — การวัดและวิเคราะห์ผลสำเร็จเชิงเปรียบเทียบในกลุ่มตัวชี้วัดที่สำคัญขององค์กร ","L3 — การกำหนดแนวทางการเรียนรู้ การจัดการความรู้ เพื่อนำไปสู่การปรับปรุงและนวัตกร","L4 — รัฐวิสาหกิจทบทวนและวิเคราะห์ระบบงานและ/หรือกระบวนการย่อย จัดเก็บในระบบฐานข้","L5 — รัฐวิสาหกิจปรับปรุงและพัฒนาระบบงานและ/หรือกระบวนการย่อย เพื่อเพิ่มประสิทธิภ"],"dimLevels":["L1 — การกำหนดตัวชี้วัดที่สำคัญ (และค่าเป้าหมาย) ขององค์กรในเชิงบูรณาการ จากทุกแหล่งทั้งภายใน ่อให้เกิดนวัตกรรมใหม่ๆ"]},{"id":"5.1","grp":"5","gname":"วัฒนธรรมเพื่อมุ่งเน้นการสร้างนวัตกรรม","gw":7.0,"gs68":1.75,"name":"การปลูกฝังค่านิยมและเสริมสร้างวัฒนธรรมที่มุ่งเน้นนวัตกรรม","w":3.5,"s68":1.75,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมินการสร้าง \"ดีเอ็นเอนวัตกรรม\" ให้ฝังรากลึกในองค์กร ผ่านการกำหนดค่านิยมที่ชัดเจน การออกแบบแผนกิจกรรมและระบบ \"รางวัล/แรงจูงใจ\" ที่ตอบโจทย์พนักงานจริงๆ การสำรวจหาช่องว่าง (Gap) ของวัฒนธรรม และที่สำคัญที่สุดคือ การพิสูจน์ให้เห็นว่า \"พฤติกรรมของพนักงานเปลี่ยนไปในทางที่ดีขึ้นจริง (Behavioral Change)\"","levelSumm":["L1 — การกำหนดค่านิยมที่สะท้อนถึงการใช้ความคิดสร้างสรรค์และการจัดการนวัตกรรมอย่าง","L2 — แผนการปลูกฝังค่านิยมและเสริมสร้างวัฒนธรรมฯ ถูกออกแบบให้ \"สอดคล้องกับบริบทแล","L3 — การดำเนินการตามแผนการปลูกฝังค่านิยมและเสริมสร้างวัฒนธรรมประจำปี \"จนบรรลุตาม","L4 — การ \"สำรวจค่านิยมและวัฒนธรรมองค์กรที่มุ่งเน้นนวัตกรรม\" เพื่อให้ทราบถึงช่องว","L5 — การนำข้อมูลป้อนกลับ (Feedback) จากการสำรวจ ไปใช้ปรับปรุงการปลูกฝังค่านิยมฯ "],"dimLevels":["L1 — การกำหนดค่านิยมที่สะท้อนถึงการใช้ความคิดสร้างสรรค์และการจัดการนวัตกรรมอย่างชัดเจน มีการสื่อสารค่านิยม และจัดทำแผนการปลูกฝังค่านิยมฯ ระยะยาวและประจำปี","L2 — แผนการปลูกฝังค่านิยมและเสริมสร้างวัฒนธรรมฯ ถูกออกแบบให้ \"สอดคล้องกับบริบทและความต้องการ\" ในแต่ละปีที่เปลี่ยนไป (เช่น การจัดสภาพแวดล้อม, การให้ค่าตอบแทน/รางวัล) และมีการถ่ายทอดแผนแก่ผู้เกี่ยวข้อง","L3 — การดำเนินการตามแผนการปลูกฝังค่านิยมและเสริมสร้างวัฒนธรรมประจำปี \"จนบรรลุตามเป้าหมายที่กำหนด\"","L4 — การ \"สำรวจค่านิยมและวัฒนธรรมองค์กรที่มุ่งเน้นนวัตกรรม\" เพื่อให้ทราบถึงช่องว่าง (Gap) ในการปรับปรุง ให้แผนสอดคล้องกับวัฒนธรรมองค์กร","L5 — การนำข้อมูลป้อนกลับ (Feedback) จากการสำรวจ ไปใช้ปรับปรุงการปลูกฝังค่านิยมฯ เพื่อเพิ่มประสิทธิภาพให้ผลสำเร็จ \"ดีกว่าเป้าหมายและดีขึ้นกว่าปีที่ผ่านมา\" และ \"ได้รับการยอมรับจากผู้มีส่วนได้ส่วนเสีย\""],"minReqs":{"1":["คู่มือค่านิยมและวัฒนธรรมองค์กร ที่ระบุค่านิยมด้านนวัตกรรมและ \"พฤติกรรมพึงประสงค์ (Do & Don't)\" ไว้อย่างชัดเจน","แผนแม่บทเสริมสร้างค่านิยมและวัฒนธรรมองค์กร (ระยะยาวและประจำปี)","แผนการสื่อสารและหลักฐานการเผยแพร่ค่านิยมไปยังผู้ที่เกี่ยวข้อง"],"2":["รายงานผลสำรวจความต้องการของบุคลากร (Need Analysis): เอกสารที่ระบุว่าพนักงานต้องการกิจกรรมรูปแบบไหน หรืออยากได้รางวัลแบบไหน","แผนปฏิบัติการที่ระบุกิจกรรมเสริมสร้างสภาพแวดล้อม และระบบแรงจูงใจ (Incentive) ที่อ้างอิงจากผลสำรวจ"],"3":["สรุปผลการดำเนินงานตามแผนปฏิบัติการเสริมสร้างค่านิยมฯ","[แก้ไข Gap สำคัญ] เอกสารแสดงผลสัมฤทธิ์ระดับ Outcome: รายงานผลประเมินตัวชี้วัด \"พฤติกรรมพึงประสงค์ที่เปลี่ยนไป\" ไม่ใช่แค่วัดจำนวนคนเข้าร่วมกิจกรรม"],"4":["รายงานผลการสำรวจค่านิยมและวัฒนธรรมองค์กร (Culture Survey) ประจำปี","บทวิเคราะห์ช่องว่าง (Culture Gap Analysis) เฉพาะมิติด้านนวัตกรรม (Agility)"],"5":["รายงานเปรียบเทียบคะแนนวัฒนธรรมองค์กร (Year-over-Year): ตารางแสดงให้เห็นว่าคะแนนพฤติกรรม A-Agility มีการเติบโตขึ้นอย่างต่อเนื่อง (เช่น จาก 4.51 เป็น 4.55)","บันทึกการทบทวนแผนปฏิบัติการในปีถัดไป (นำ Feedback ไปทำอะไรต่อ)"]},"docsNeeded":[{"level":"L3+","req":"หลักฐานการวัดผลพฤติกรรมระดับผลลัพธ์ (Outcome): เอกสารประเมินที่แสดงให้เห็น \"พฤติกรรมที่เปลี่ยนไป\" อย่างยั่งยืน (ไม่ใช่วัดแค่จำนวนพนักงานที่เข้าร่วมกิจกรรม)"},{"level":"L3+","req":"แผนเสริมสร้างวัฒนธรรมองค์กร: แผนที่ได้จากการนำผลประเมินช่องว่าง (Gap Analysis) ไปเปรียบเทียบกับแนวปฏิบัติที่ดี (Best Practice) แล้ว"}],"actions":["ทำ Benchmark ด้านวัฒนธรรม: ในแผนเสริมสร้างวัฒนธรรมปีหน้า ต้องเขียนระบุให้ชัดเจนว่า กทท. ได้นำผล Gap Analysis ไปเปรียบเทียบกับองค์กรที่เป็น Best Practice (เช่น รฟม. ที่ได้คะแนนด้านนี้ถึง 2.6250 หรือองค์กรเอกชนชั้นนำ) แล้วนำรูปแบบขององค์กรเหล่านั้นมาประยุกต์ใช้","ปรับ KPI การวัดผลให้เป็น Outcome ล้วนๆ: เปลี่ยนการรายงานผลจาก \"มีคนเข้าร่วมกิจกรรมกี่คน\" เป็น \"พฤติกรรมที่เปลี่ยนไป (Behavioral Change)\" เช่น นำผลการประเมินพฤติกรรม (Competency) ด้าน Agility ของพนักงานรายบุคคลที่เพิ่มขึ้น มาโชว์เป็นหลักฐานการเปลี่ยนแปลงพฤติกรรมที่ยั่งยืน"],"crossLinks":[],"good":["กทท. ผ่านระดับ 1–2 บางส่วน มีค่านิยม Agility แผนงาน และปรับกิจกรรมตอบโจทย์พนักงาน","กทท. จัดกิจกรรมเชิงรูปธรรม (เงินรางวัล, Site Visit) เป็นกระบวนการ (Process) ที่ดี"],"results":["ทบทวนและกำหนดค่านิยมองค์กรใหม่เป็น \"SMART PAT\" โดยเน้นที่ตัว A - Agility (พร้อมรับการเปลี่ยนแปลง ด้วยการสร้างสรรค์นวัตกรรมสิ่งใหม่) และมีการสื่อสารผ่านการจัดอบรม สื่อประชาสัมพันธ์ และแผนปฏิบัติการ","มีการสำรวจความต้องการพนักงานเพื่อปรับรูปแบบกิจกรรมให้ตรงใจ เช่น ปรับกิจกรรม PAT DNA เป็นรูปแบบ Non-classroom (ไป Site Visit ดูงานบริษัทเงินติดล้อ และ กฟผ.) และปรับของรางวัลจากทริปดูงานต่างประเทศเป็น \"เงินสด 30,000 บาท ควบคู่การอบรม\" ตามที่พนักงานเรียกร้องสูงสุดถึง 39%","วัดผลลัพธ์การเปลี่ยนพฤติกรรม พบว่าพนักงานมีการปรับเปลี่ยนพฤติกรรม 77.33% (ทะลุเป้า 70%) และสัดส่วนบุคลากรที่ให้ความคิดสร้างสรรค์เพิ่มขึ้นถึง 300%","มีการสำรวจค่านิยมและวัฒนธรรมองค์กรเพื่อหาช่องว่าง (Gap Analysis) โดยพนักงาน 100% รับรู้ค่านิยม SMART PAT และ 85.81% เห็นว่ามีการเปลี่ยนแปลงด้านความคิดสร้างสรรค์"],"gaps":["ขาดการเทียบเคียงกับแนวปฏิบัติที่ดี (Best Practice) : ผู้ตรวจระบุว่า แม้จะมีการประเมินช่องว่าง (Gap Analysis) แล้ว แต่ กทท. ต้องนำผลการวิเคราะห์นั้นไปเทียบกับ \"แนวปฏิบัติที่ดี (Best Practice)\" เพื่อนำไปสู่การจัดทำแผนเสริมสร้างวัฒนธรรมที่ครอบคลุมและมีประสิทธิภาพยิ่งขึ้น","การวัดผลที่ยังไม่สะท้อน Outcome ที่แท้จริง : ผู้ตรวจเน้นย้ำว่า การทบทวนและติดตามผลการดำเนินงานต้องเป็นไปตามเป้าหมายตัวชี้วัดทั้งในระดับผลผลิต (Output) และ ผลลัพธ์ (Outcome) . ในมุมมองผู้ตรวจ ตัวเลขพนักงานส่งไอเดียเพิ่มขึ้น หรือความพึงพอใจต่อกิจกรรม ยังเป็นเพียงผลผลิต (Output) แต่ผลลัพธ์ (Outcome) ที่แท้จริงคือ \"พฤติกรรมการทำงานที่เปลี่ยนไปอย่างยั่งยืนและสร้างมูลค่าได้จริง\""]},{"id":"5.2","grp":"5","gname":"วัฒนธรรมเพื่อมุ่งเน้นการสร้างนวัตกรรม","gw":7.0,"gs68":1.75,"name":"การยกระดับความรู้ความสามารถด้านนวัตกรรม","w":3.5,"s68":1.75,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมินการสร้าง \"ขีดความสามารถ (Capability)\" ของทีมงานขับเคลื่อนนวัตกรรมและพนักงาน โดยเริ่มตั้งแต่การประเมินว่าพนักงานยังขาดทักษะอะไร (Gap Analysis) นำไปสู่การจัดทำแผนพัฒนารายบุคคล (IDP) การจัดอบรม และ \"การนำความก้าวหน้าทางนวัตกรรมไปผูกกับระบบประเมินผล/ความก้าวหน้าในสายอาชีพ (Career Path)\" เพื่อรักษาคนเก่งไว้ในองค์กร","levelSumm":["L1 — การวิเคราะห์และประเมินช่องว่างความรู้ความสามารถและศักยภาพการใช้ความคิดสร้าง","L2 — ถ่ายทอดแผนยกระดับและพัฒนาความรู้ความสามารถและศักยภาพการใช้ความคิดสร้างสรรค์","L3 — การดำเนินการตามแผนยกระดับและพัฒนาความรู้ความสามารถฯ ได้ครบถ้วน และ \"บรรลุตา","L4 — การยกระดับความรู้ความสามารถด้านนวัตกรรม เชื่อมโยงกับ \"ระบบแรงจูงใจและความก้","L5 — การใช้ข้อมูลป้อนกลับ (Feedback) เพื่อปรับปรุงการยกระดับความรู้ความสามารถด้า"],"dimLevels":["L1 — การวิเคราะห์และประเมินช่องว่างความรู้ความสามารถและศักยภาพการใช้ความคิดสร้างสรรค์ (Gap Analysis) และจัดทำ/ทบทวนแผนยกระดับความรู้ความสามารถฯ ระยะยาวและประจำปี","L2 — ถ่ายทอดแผนยกระดับและพัฒนาความรู้ความสามารถและศักยภาพการใช้ความคิดสร้างสรรค์และจัดการนวัตกรรมองค์กรประจำปีแก่ผู้ที่เกี่ยวข้อง","L3 — การดำเนินการตามแผนยกระดับและพัฒนาความรู้ความสามารถฯ ได้ครบถ้วน และ \"บรรลุตามเป้าหมายของแผน\"","L4 — การยกระดับความรู้ความสามารถด้านนวัตกรรม เชื่อมโยงกับ \"ระบบแรงจูงใจและความก้าวหน้าในสายอาชีพ (Career Path)\" ของผู้รับผิดชอบด้านการจัดการนวัตกรรมขององค์กร","L5 — การใช้ข้อมูลป้อนกลับ (Feedback) เพื่อปรับปรุงการยกระดับความรู้ความสามารถด้านนวัตกรรม ให้มีผลสำเร็จดีกว่าเป้าหมาย และดีขึ้นกว่าปีที่ผ่านมา"],"minReqs":{"1":["คู่มือสมรรถนะองค์กร (Competency Dictionary) ที่มีการระบุทักษะด้านนวัตกรรม (Innovation Competency)","รายงานผลการประเมินช่องว่างความรู้ความสามารถ (Gap Analysis Report) ของบุคลากรรายบุคคล","แผนยกระดับและพัฒนาความรู้ความสามารถฯ (ระยะยาวและประจำปี) ที่สอดคล้องกับช่องว่างที่พบ"],"2":["บันทึกแจ้งผลการประเมินสมรรถนะรายบุคคล และการแจ้งแผนพัฒนา (IDP) ให้พนักงานรับทราบ","หลักฐานการสื่อสาร/เผยแพร่แผนพัฒนาสมรรถนะการจัดการนวัตกรรมไปยังผู้บริหารและพนักงานทั่วองค์กร"],"3":["รายงานผลการจัดการฝึกอบรม/การพัฒนาทักษะตามแผนประจำปี","[แก้ไข Gap สำคัญ] สรุปผลการประเมินความสำเร็จของการฝึกอบรม ที่วัดผลสำเร็จเชิงตัวเลข"],"4":["ระเบียบ/คู่มือการบริหารทรัพยากรบุคคล ที่ระบุหลักเกณฑ์ความก้าวหน้าในสายอาชีพ (Career Path) สำหรับ \"กลุ่มตำแหน่งงานด้านนวัตกรรม\"","ประกาศ/เกณฑ์การพิจารณาผลตอบแทน (Incentive) โบนัส หรือการเลื่อนขั้น ที่นำ \"สมรรถนะด้านนวัตกรรม\" หรือ \"ความสำเร็จในการทำโครงการนวัตกรรม\" เข้ามาเป็นส่วนหนึ่งของการพิจารณา"],"5":["รายงาน AAR / รายงานประเมินความพึงพอใจและประสิทธิภาพของหลักสูตรฝึกอบรมนวัตกรรม","ตารางเปรียบเทียบผลสมรรถนะ (Competency Score Year-over-Year): ตารางที่แสดงให้เห็นว่า สมรรถนะด้านนวัตกรรมของทีมงานในปีนี้ \"สูงกว่า\" ปีที่ผ่านมาอย่างเป็นรูปธรรม"]},"docsNeeded":[{"level":"L3+","req":"รายงานผลการวิเคราะห์ช่องว่างทักษะเชิงลึก (Innovation Gap Analysis): แบบประเมินที่เจาะจงทักษะแห่งอนาคตของทีมงานหลัก เช่น ทักษะ AI, Data Literacy และ Design Thinking"},{"level":"L3+","req":"แผนพัฒนารายบุคคล (IDP) ด้านนวัตกรรม: แผนอบรมที่ถูกออกแบบเพื่อปิดช่องว่างทักษะแห่งอนาคตของทีมงาน IM โดยเฉพาะ"}],"actions":["ทำ Innovation Gap Analysis เชิงลึก: เปลี่ยนจากการประเมินสมรรถนะแบบเดิม เป็นการเจาะจงประเมินทักษะแห่งอนาคต (Future Skills) เช่น AI & Data Literacy และ Design Thinking ให้กับทีม Core IM","เชื่อมโยงกับความก้าวหน้า (ปลดล็อกระดับ 4): ต้องให้ฝ่าย HR กำหนดหลักเกณฑ์ให้ชัดเจนว่า หากทีมงานนวัตกรรมสามารถ Upskill ทักษะแห่งอนาคตและสร้างนวัตกรรมได้สำเร็จ จะมีผลต่อ \"ความก้าวหน้าในสายอาชีพ (Career Path)\" หรือ \"ได้รับคะแนนประเมินผลงาน (PMS)\" ที่ดีขึ้นอย่างไร เพื่อสร้างแรงจูงใจที่เป็นรูปธรรม","เรียนรู้จาก Best Practice : รฟม. ได้คะแนนในหมวดนี้สูงถึง 2.6250 เพราะมีการทำ \"Gap Analysis ศักยภาพด้านนวัตกรรมแยกเป็นรายบุคคล\" และทำแผนพัฒนาระยะสั้น/ยาวที่ชัดเจน กทท. ควรถอดแบบกระบวนการนี้มาใช้"],"crossLinks":[],"good":["กทท. ผ่านระดับ 1–2 มี Gap Analysis และจัดทำ IDP พัฒนาบุคลากรได้ครบถ้วน","คะแนน 1.75 สะท้อนความจริง — กทท. ผ่านกระบวนการ 'ประเมิน-จัดอบรม-สอบวัดผล' ครบ"],"results":["มีการกำหนดสมรรถนะ (Competency) จัดทำแผนพัฒนารายบุคคล (IDP) และจัดสัมมนาทบทวนสมรรถนะตามลักษณะงาน (Functional Competency) เพื่อประเมินช่องว่าง (Gap Analysis) ของทีมงานนวัตกรรม โดยบูรณาการร่วมกับฝ่าย HR","มีการจัดทำบันทึกเผยแพร่แผนพัฒนาสมรรถนะด้านนวัตกรรม แจ้งผลการประเมินสมรรถนะ และสื่อสารไปยังผู้บริหารและพนักงานที่เกี่ยวข้อง","ดำเนินการจัดอบรมผ่าน \"โครงการพัฒนาทักษะสู่สมรรถนะแห่งอนาคต\" และบรรลุเป้าหมายที่ตั้งไว้ คือ พนักงานที่รับผิดชอบงานด้านนวัตกรรมมีผลประเมินความรู้ผ่านเกณฑ์ 80%"],"gaps":["คุณภาพของหลักสูตรไม่ตอบโจทย์อนาคต (Gap ระดับ 2 และ 3) : ผู้ตรวจระบุว่า การวิเคราะห์ Training Need ของ กทท. ยังไม่สะท้อนแนวโน้มธุรกิจในอนาคต  กทท. จัดอบรมด้านนวัตกรรมทั่วไป แต่ \"ขาดการวิเคราะห์ช่องว่างทักษะใหม่ๆ ที่จำเป็นต่ออนาคต (เช่น ทักษะด้าน AI, Data Literacy, Design Thinking) ของทีมงานนวัตกรรม\"","ขาดการเชื่อมโยงกับระบบแรงจูงใจ (Gap ระดับ 4) : กทท. ยังไม่มีการนำผลการยกระดับความรู้ความสามารถด้านนวัตกรรม ไปเชื่อมโยงกับระบบแรงจูงใจ (Incentive) หรือความก้าวหน้าในสายอาชีพ (Career Path) ของผู้รับผิดชอบด้านนวัตกรรม ซึ่ง กทท. ก็ยอมรับในกระดาษคำตอบเองว่า \"ยังไม่ดำเนินการ\""]},{"id":"6.1","grp":"6","gname":"กระบวนการนวัตกรรม","gw":15.0,"gs68":1.75,"name":"การออกแบบระบบนวัตกรรมองค์กร","w":4.0,"s68":2.0,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมินการออกแบบ \"ระบบนวัตกรรมองค์กร (Corporate Innovation System: CIS)\" ซึ่งเป็นพิมพ์เขียวภาพใหญ่ขององค์กร โดยต้องมีองค์ประกอบพื้นฐานครบถ้วน ครอบคลุมทั้งนวัตกรรมที่คิดค้นเองภายใน (Closed Innovation) และการดึงเครือข่ายพันธมิตรภายนอกมาร่วมทำ (Open Innovation) รวมถึงต้องมีการจัดพอร์ตโฟลิโอ (Innovation Portfolio) และการบริหารจัดการลิขสิทธิ์/ทรัพย์สินทางปัญญา (IP) อย่างเป็นระบบ","levelSumm":["L1 — การออกแบบระบบนวัตกรรมองค์กร (CIS) ที่สอดคล้องกับบริบทขององค์กร และครอบคลุมอ","L2 — การออกแบบระบบและกระบวนการจัดการนวัตกรรมในรูปแบบต่างๆ ที่ครอบคลุมกระบวนการนำ","L3 — การออกแบบ Innovation Portfolio และกระบวนการบริหารจัดการทรัพย์สินทางปัญญาที่","L4 — ระบบนวัตกรรมองค์กร (Corporate Innovation System: CIS) สอดคล้องกับทิศทางการด","L5 — การใช้ข้อมูลป้อนกลับ (Feedback) จากการประเมิน มาปรับปรุงระบบนวัตกรรมองค์กร "],"dimLevels":["L1 — การออกแบบระบบนวัตกรรมองค์กร (CIS) ที่สอดคล้องกับบริบทขององค์กร และครอบคลุมองค์ประกอบที่สำคัญ","L2 — การออกแบบระบบและกระบวนการจัดการนวัตกรรมในรูปแบบต่างๆ ที่ครอบคลุมกระบวนการนำความคิดสร้างสรรค์ไปสู่การสร้างนวัตกรรม ทั้งในรูปแบบนวัตกรรมแบบปิด (Closed Innovation) และนวัตกรรมแบบเปิด (Open Innovation)","L3 — การออกแบบ Innovation Portfolio และกระบวนการบริหารจัดการทรัพย์สินทางปัญญาที่เกี่ยวข้องกับการจัดการนวัตกรรม รวมทั้งการนำนวัตกรรมไปใช้ประโยชน์เชิงพาณิชย์และเชิงสังคม (Intellectual Property: IP)","L4 — ระบบนวัตกรรมองค์กร (Corporate Innovation System: CIS) สอดคล้องกับทิศทางการดำเนินธุรกิจและการดำเนินงานขององค์กรทั้งในปัจจุบันและในอนาคต และเชื่อมโยงถึงผู้มีส่วนได้ส่วนเสียตามระบบนิเวศธุรกิจ (Business Ecosystem)","L5 — การใช้ข้อมูลป้อนกลับ (Feedback) จากการประเมิน มาปรับปรุงระบบนวัตกรรมองค์กร เพื่อเพิ่มประสิทธิภาพให้ดีกว่าเป้าหมายและดีกว่าปีที่ผ่านมา"],"minReqs":{"1":["แผนภาพ/ผังระบบนวัตกรรมองค์กร (PAT-CIS) ให้ครบทั้ง 7 ด้าน ได้แก่ บทบาทผู้บริหารระดับสูง (Leadership), ยุทธศาสตร์ (Strategy), วัฒนธรรม (Culture), บุคลากร (People), กระบวนการนวัตกรรม (Process), การจัดการความรู้และเทคโนโลยี (KM & IT) , กลไกการติดตามประเมินผล (Monitoring)","คู่มือระบบนวัตกรรมองค์กรที่อธิบายความเชื่อมโยงของแต่ละองค์ประกอบ"],"2":["คู่มือ/ระเบียบการทำ Open Innovation: (เช่น เกณฑ์การคัดเลือกพันธมิตร หรือเงื่อนไขการทำ MOU นวัตกรรม)","ตารางบริหาร Innovation Portfolio: การแบ่งสัดส่วนโครงการนวัตกรรม (เช่น Core 70% / Adjacent 20% / Transformational 10%)","คู่มือ/ระเบียบการจัดการทรัพย์สินทางปัญญา (IP Policy): ระเบียบที่ระบุว่า หากพนักงานคิดค้นนวัตกรรมได้ ใครเป็นเจ้าของลิขสิทธิ์ และมีแนวทางจดสิทธิบัตรอย่างไร"],"3":["รายงานผลการดำเนินงานนวัตกรรมประจำปี ที่ยืนยันว่ามีการใช้งานระบบ PAT-CIS จริง","หลักฐานเชิงประจักษ์ด้าน Open Innovation: เช่น รายงานความสำเร็จของการร่วมมือกับกรมการขนส่งทางบกในการทำแอปพลิเคชันจัดการจราจร (LCP Traffic)","หลักฐานด้าน IP: เอกสารแสดงการยื่นขอจดลิขสิทธิ์/อนุสิทธิบัตรของผลงานนวัตกรรม กทท."],"4":["แผนภาพ Business Ecosystem: แผนภาพที่แสดงให้เห็นว่าระบบ PAT-CIS เชื่อมโยงกับ Stakeholder ภายนอก (เช่น รัฐบาล, คู่แข่ง, คู่ค้า, ชุมชน) อย่างไร","รายงานการประเมินประสิทธิผล (AAR / System Audit) ของการใช้ระบบ PAT-CIS"],"5":["รายงานทบทวนระบบ PAT-CIS ฉบับอัปเดต","ตารางเปรียบเทียบประสิทธิภาพ (Before & After): แสดงตัวชี้วัดกระบวนการ (Process KPI) ที่ดีขึ้น"]},"docsNeeded":[{"level":"L3+","req":"เอกสาร \"หลักเกณฑ์ในการคัดเลือกพันธมิตร\" (Open Innovation Criteria): ข้อนี้สำคัญมาก ต้องมีหลักเกณฑ์เป็นลายลักษณ์อักษรที่ใช้ในการคัดเลือกเครือข่ายระบบนิเวศธุรกิจ (Ecosystem)"},{"level":"L3+","req":"เอกสารระบบ PAT-CIS ฉบับปรับปรุง: แผนภาพและคู่มือที่แสดงความเชื่อมโยงกับระบบนิเวศธุรกิจอย่างชัดเจน"}],"actions":["ขยายความ Business Ecosystem ในคู่มือ PAT-CIS: ปรับปรุงแผนภาพและคำอธิบายในคู่มือให้เห็นชัดเจนว่า กทท. มีการเชื่อมโยงและแลกเปลี่ยนทรัพยากรกับใครบ้างใน Value Chain (เช่น ผู้ส่งมอบ, ลูกค้า, มหาวิทยาลัย, สตาร์ทอัพ)","จัดทำ \"หลักเกณฑ์ในการคัดเลือกพันธมิตร (Partner Selection Criteria)\" เป็นลายลักษณ์อักษร: นี่คือสิ่งที่ผู้ตรวจต้องการเห็นมากที่สุด กทท. ต้องนำเกณฑ์นี้ไปใส่เพิ่มในคู่มือบริหารจัดการนวัตกรรม โดยระบุว่า หากจะทำ Open Innovation กทท. จะพิจารณาคัดเลือกพันธมิตรจากอะไรบ้าง (เช่น ความเชี่ยวชาญด้านเทคโนโลยี, ทรัพยากรที่มี, หรือความสอดคล้องทางยุทธศาสตร์)","เรียนรู้ Best Practice : รฟม. มีจุดเด่นคือ \"ออกแบบระบบครอบคลุมทั้งนวัตกรรมแบบปิด (Closed) และแบบเปิด (Open Innovation) โดยขยายความร่วมมือกับพันธมิตรภายนอกชัดเจน\" กทท. สามารถดูโครงสร้างเอกสารของ รฟม. ในเรื่อง Open Innovation มาปรับใช้ได้เลย"],"crossLinks":[],"good":["กทท. ผ่านระดับ 1 มีโมเดล PAT-CIS และโครงสร้างการทำงานรองรับองค์กรชัดเจน","กทท. ทำได้ดีในการวางโครงสร้างภายในองค์กร (Internal Process)"],"results":["ทบทวนปรับปรุงระบบนวัตกรรมองค์กร (PAT-CIS) โดยกำหนดบทบาทหน้าที่ของคณะกรรมการ คณะทำงาน และผู้รับผิดชอบหลักอย่างชัดเจน และตั้งคณะทำงานต่อยอดนวัตกรรมเพิ่มเติม","ออกแบบกระบวนการจัดการนวัตกรรมครอบคลุมทั้งแบบปิด (Closed Innovation) เช่น โครงการ E-Complain Tracking และแบบเปิด (Open Innovation) เช่น การทำแอปพลิเคชันแก้ปัญหาจราจรร่วมกับกรมการขนส่งทางบก (MOU)","ออกแบบ Innovation Portfolio และกระบวนการบริหารจัดการทรัพย์สินทางปัญญา (IP Management) รวมถึงมีผลงานเชิงพาณิชย์สร้างรายได้แล้ว เช่น ธุรกิจ Free Zone","ระบบ PAT-CIS สอดคล้องกับทิศทางธุรกิจ และมีการระบุการเชื่อมโยงกับพันธมิตรในระบบนิเวศธุรกิจ (Business Ecosystem)"],"gaps":["ปัญหาการกำหนดเกณฑ์คัดเลือกพันธมิตร (Gap ของการทำ Open Innovation) : แม้ กทท. จะบอกว่ามี Open Innovation แต่ผู้ตรวจระบุชัดเจนว่า กทท. ยังขาดการกำหนด \"หลักเกณฑ์ (Criteria) ในการคัดเลือกพันธมิตร\" ที่เป็นระบบและเป็นทางการ (คือไปทำ MOU เลยโดยไม่ได้มีเกณฑ์มาตรฐานกางไว้ก่อนว่าทำไมถึงต้องเลือกพันธมิตรเจ้านี้)","ปัญหาความเชื่อมโยงกับ Business Ecosystem (Gap ระดับ 4) : ผู้ตรวจมองว่าระบบ CIS ของ กทท. ยังขาดความเชื่อมโยงกับระบบนิเวศธุรกิจ (Business Ecosystem) \"อย่างรอบด้าน\" การวาดภาพพันธมิตรไว้ในแผนภาพ CIS ยังไม่เพียงพอ แต่ต้องแสดงให้เห็นกลไกการแลกเปลี่ยนทรัพยากร ความรู้ และเทคโนโลยีกับพันธมิตรในคู่มืออย่างเป็นรูปธรรม"]},{"id":"6.2","grp":"6","gname":"กระบวนการนวัตกรรม","gw":15.0,"gs68":1.75,"name":"กระบวนการใช้ความคิดสร้างสรรค์สู่การสร้างนวัตกรรม","w":4.0,"s68":2.0,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมินความสามารถขององค์กรในช่วง \"ต้นน้ำ\" ของนวัตกรรม (Front End Innovation) ครอบคลุมตั้งแต่การกระตุ้นให้เกิดความคิดสร้างสรรค์ (Idea Generation) การกลั่นกรองและประเมินแนวคิด (Idea Screening and Evaluation) ไปจนถึงการตัดสินใจคัดเลือกไอเดียที่สอดคล้องกับทิศทางธุรกิจเพื่อส่งต่อไปยังขั้นตอนการพัฒนาต่อไป","levelSumm":["L1 — การกำหนดกระบวนการในช่วงแรกของการพัฒนานวัตกรรม (Front End Innovation) ที่เกิ","L2 — การดำเนินการสร้างสรรค์ความคิด (Idea Generation) การกลั่นกรองและประเมินความค","L3 — การพัฒนาแนวความคิด (Product Concept/Concept Definition) เพื่อให้สามารถตอบสน","L4 — การคัดเลือกและพัฒนานวัตกรรม \"สอดคล้องกับทิศทางการดำเนินธุรกิจขององค์กร\"","L5 — การประเมินและปรับปรุงกระบวนการใช้ความคิดสร้างสรรค์สู่การสร้างนวัตกรรม เพื่อ"],"dimLevels":["L1 — การกำหนดกระบวนการในช่วงแรกของการพัฒนานวัตกรรม (Front End Innovation) ที่เกิดจากการมีส่วนร่วมของผู้มีส่วนได้ส่วนเสีย เพื่อให้ได้มาซึ่งความคิดสร้างสรรค์","L2 — การดำเนินการสร้างสรรค์ความคิด (Idea Generation) การกลั่นกรองและประเมินความคิด (Idea Screening and Evaluation) และนำไปสู่การวิเคราะห์คัดเลือกความคิดสร้างสรรค์ที่เป็นประโยชน์","L3 — การพัฒนาแนวความคิด (Product Concept/Concept Definition) เพื่อให้สามารถตอบสนองความต้องการของลูกค้า/ผู้มีส่วนได้ส่วนเสียกลุ่มเป้าหมาย","L4 — การคัดเลือกและพัฒนานวัตกรรม \"สอดคล้องกับทิศทางการดำเนินธุรกิจขององค์กร\"","L5 — การประเมินและปรับปรุงกระบวนการใช้ความคิดสร้างสรรค์สู่การสร้างนวัตกรรม เพื่อให้มีผลสำเร็จที่ดีกว่าเป้าหมายและดีกว่าปีที่ผ่านมา"],"minReqs":{"1":["ผังกระบวนการ (SIPOC / Flowchart) แสดงขั้นตอนการรับไอเดียและการคัดกรอง","คู่มือ/เกณฑ์การคัดกรองไอเดีย (Idea Screening Criteria): เช่น เกณฑ์การตัดสินโครงการ PAT DNA ที่ระบุน้ำหนักคะแนนชัดเจน"],"2":["รายงานสรุปการจัดกิจกรรมสร้างสรรค์ไอเดีย (เช่น รายงานผลการจัดกิจกรรม PAT DNA ที่รวบรวมแนวคิดได้ 46 โครงการ)","ภาพถ่ายกิจกรรมหรือหลักฐานที่แสดงให้เห็นว่า \"บุคลากรทุกระดับ/ทุกสายงาน\" มีส่วนร่วมในการส่งไอเดีย"],"3":["รายงานผลการประเมินและคัดกรองแนวคิด (Idea Evaluation Report) (เช่น มติของคณะทำงานต่อยอดฯ ในการคัดเลือกไอเดีย)","ตารางเปรียบเทียบผลลัพธ์กับเป้าหมาย (KPI Dashboard): เช่น เป้าหมายตั้งไว้ว่าต้องได้ 30 ไอเดีย แต่ทำได้ 46 ไอเดีย (บรรลุเป้าหมาย 100%)"],"4":["ตารางความสอดคล้อง (Alignment Matrix): เอกสารที่นำไอเดีย/โครงการที่ผ่านการคัดเลือก มาจับคู่ (Mapping) กับยุทธศาสตร์องค์กร หรือปัญหาของลูกค้า (Unmet Need)"],"5":["รายงานถอดบทเรียน (AAR) หรือรายงานการประเมินประสิทธิภาพของ \"กระบวนการจัดประกวดและคัดเลือกแนวคิด\"","[แก้ไข Gap สำคัญ] เอกสารติดตามปัญหาและแนวทางปรับปรุง: บันทึกการแก้ไขปัญหาอุปสรรคที่เกิดจากกระบวนการคัดกรอง"]},"docsNeeded":[{"level":"L3+","req":"เกณฑ์คัดกรองโครงการ (Stage-Gate Criteria) ฉบับ Update: ต้องมีเอกสารคู่มือที่เพิ่มเกณฑ์การประเมินในแต่ละ Gate โดยระบุถึง \"ความใหม่ (Newness)\", \"การบริหารทรัพย์สินทางปัญญา (IP Management)\" และความคุ้มค่าทางธุรกิจ (Business Case)"}],"actions":["ปรับปรุงเกณฑ์คัดกรองไอเดีย (Upgrade Stage-Gate Criteria): นำเกณฑ์การประเมินโครงการระยะแรก (Front End) ในคู่มือมาปรับปรุง โดยเพิ่มน้ำหนักคะแนนในช่อง \"ความคุ้มค่าทางการเงิน/ผลประโยชน์เชิงพาณิชย์ (Cost-Benefit)\", \"ความใหม่ (Newness)\" และ \"ความเสี่ยง (Risk)\" ให้ชัดเจนขึ้น","ทำสรุป Lesson Learned แจ้งผู้บริหาร : รวบรวม \"ปัญหาและอุปสรรค\" จากโครงการที่เสนอไอเดียมาแล้วไปต่อไม่ได้ (ตก Gate) ทำเป็นรายงานสรุปว่าทำไมถึงตก (เช่น เทคโนโลยีไม่รองรับ หรืองบไม่พอ) เพื่อแสดงหลักฐานให้ผู้ตรวจเห็นว่า กทท. มีการติดตามปัญหาและนำมาเป็นข้อมูลป้อนกลับแล้ว","เชื่อมโยงข้อมูลเสียงลูกค้า (VOC) เป็นโจทย์ตั้งต้น: ก่อนให้พนักงานคิดไอเดีย ให้ดึงข้อมูล Pain point หรือ Unmet need จากระบบรับฟังลูกค้า (SCM) มาเป็น \"โจทย์บังคับ\" ในการประกวด PAT DNA ปีหน้า เพื่อรับประกันว่าไอเดียที่ได้จะตอบสนองลูกค้าได้จริง"],"crossLinks":[],"good":["กทท. มีช่องทางรวบรวมไอเดียชัดเจนผ่านเวที PAT DNA","กทท. ทำเรื่อง Idea Generation ได้ดีเยี่ยมจากการจัด PAT DNA"],"results":["มีการออกแบบกระบวนการพัฒนานวัตกรรมช่วงแรก (Front End Innovation) เพื่อให้ได้มาซึ่งไอเดีย โดยรับฟังเสียงจากลูกค้า (VOC) และพนักงาน","มีการดำเนินการสร้างสรรค์ความคิด (Idea Generation) และกลั่นกรองความคิด (Idea Screening) โดยในปี 2568 กทท. ได้จัดโครงการ PAT DNA สามารถรวบรวมไอเดียได้ถึง 46 โครงการ และกลั่นกรองตามเกณฑ์จนเหลือ 19 และ 9 ความคิดสร้างสรรค์ เพื่อนำไปจัดสรรทรัพยากรต่อ","มีการพัฒนาแนวความคิด (Concept Definition) นำไอเดียที่ผ่านเกณฑ์ (ผ่าน Gate 3) จำนวน 10 โครงการไปพัฒนาเพื่อตอบสนองกลุ่มเป้าหมาย","ระบุว่าการสร้างนวัตกรรมสอดคล้องกับทิศทางธุรกิจขององค์กร"],"gaps":["เกณฑ์การคัดกรองไอเดียยังไม่คมพอ (Gap ระดับ 2) : ผู้ตรวจระบุว่า กทท. ต้องกำหนดเกณฑ์คัดกรองไอเดีย (Idea Screening) ให้สามารถ \"วัดศักยภาพเชิงพาณิชย์ได้จริง\" รวมถึงควรพิจารณาในเรื่องของความใหม่ (Newness) และการบริหารจัดการทรัพย์สินทางปัญญา (IP) ในการกลั่นกรองตั้งแต่ต้นทาง","ขาดการนำเทคโนโลยีมาเป็นกลไกหลัก (Gap ระดับ 2-3) : ผู้ตรวจให้ข้อเสนอแนะว่า ควรมุ่งเน้นการส่งเสริมแนวคิดที่ต่อยอดได้จริง และ \"ควรแสดงให้เห็นการประยุกต์ใช้เทคโนโลยีเป็นกลไกหลักในการเพิ่มประสิทธิภาพกระบวนการปฏิบัติงาน\" เพื่อให้เกิดนวัตกรรม","ขาดการรวบรวมปัญหาและอุปสรรค (Gap ระดับ 3) : กทท. ยังขาดกระบวนการติดตามปัญหาและอุปสรรคที่เกิดจากการนำกระบวนการนวัตกรรมไปสู่การปฏิบัติอย่างต่อเนื่อง ผู้ตรวจต้องการให้ กทท. นำข้อผิดพลาดหรืออุปสรรคเหล่านี้มาเป็นข้อมูลป้อนกลับ (Feedback Loop) เพื่อนำไปพัฒนากระบวนการใช้ความคิดสร้างสรรค์ในปีต่อไปให้ดีขึ้น"]},{"id":"6.3","grp":"6","gname":"กระบวนการนวัตกรรม","gw":15.0,"gs68":1.75,"name":"การพัฒนานวัตกรรม","w":7.0,"s68":1.7714,"status":"ยังไม่เริ่ม","statusNote":"","scopeNote":"มุ่งเน้นประเมิน \"การลงมือสร้างนวัตกรรม\" (Development phase) โดยใช้วิธีการบริหารโครงการอย่างเป็นระบบ (เช่น Stage-Gate Model) ตั้งแต่การทำเครื่องมือต้นแบบ (Prototype), การทดสอบ (Testing), การนำเทคโนโลยีดิจิทัลมาประยุกต์ใช้ ไปจนถึงการปล่อยผลงานออกสู่การใช้งานจริง (Launch) ที่ตอบโจทย์ทิศทางธุรกิจขององค์กร","levelSumm":["L1 — การกำหนดกระบวนการพัฒนานวัตกรรมขององค์กรอย่างเป็นระบบ","L2 — การดำเนินการตามกระบวนการพัฒนานวัตกรรมในรูปแบบต่าง ๆ ตามแผนงาน และพิจารณาถึง","L3 — การดำเนินการตามกระบวนการพัฒนานวัตกรรมอย่างเป็นระบบ และ \"บรรลุผลสำเร็จตามเป้","L4 — การพัฒนานวัตกรรม \"สอดคล้องกับทิศทางการดำเนินธุรกิจ\" ขององค์กร","L5 — รัฐวิสาหกิจ \"ปรับปรุง\" การพัฒนานวัตกรรมสู่การปฏิบัติ เพื่อเพิ่มประสิทธิภาพด"],"dimLevels":["L1 — การกำหนดกระบวนการพัฒนานวัตกรรมขององค์กรอย่างเป็นระบบ","L2 — การดำเนินการตามกระบวนการพัฒนานวัตกรรมในรูปแบบต่าง ๆ ตามแผนงาน และพิจารณาถึงการ \"ประยุกต์ใช้เทคโนโลยีดิจิทัล\"","L3 — การดำเนินการตามกระบวนการพัฒนานวัตกรรมอย่างเป็นระบบ และ \"บรรลุผลสำเร็จตามเป้าหมาย\" ที่กำหนดไว้ในแผนงานประจำปี","L4 — การพัฒนานวัตกรรม \"สอดคล้องกับทิศทางการดำเนินธุรกิจ\" ขององค์กร","L5 — รัฐวิสาหกิจ \"ปรับปรุง\" การพัฒนานวัตกรรมสู่การปฏิบัติ เพื่อเพิ่มประสิทธิภาพด้านการจัดการนวัตกรรมให้มี \"ผลสำเร็จที่ดีกว่าเป้าหมายและดีกว่าปีที่ผ่านมา\""],"minReqs":{"1":["คู่มือ/ผังกระบวนการพัฒนานวัตกรรม ที่ระบุขั้นตอนชัดเจนตั้งแต่เริ่มพัฒนาจนถึงนำไปใช้งานจริง (เช่น PAT Stage-Gate 5 ขั้นตอน)"],"2":["รายงานความคืบหน้าการพัฒนานวัตกรรมที่แสดงให้เห็นว่ามีการใช้ระบบดิจิทัลเข้ามาช่วย (เช่น การพัฒนาแอป LCP Traffic)"],"3":["รายงานสรุปผลการดำเนินงานโครงการนวัตกรรม (Project Dashboard)","ตารางเปรียบเทียบผลผลิต (Output KPI): เช่น ปีนี้ตั้งเป้าพัฒนานวัตกรรมให้แล้วเสร็จ 5 โครงการ ก็ต้องมีหลักฐานว่าทำสำเร็จผ่าน Gate สุดท้ายและนำไปใช้งานจริง (Launch) ได้ครบ 5 โครงการ"],"4":["ตารางแสดงความสอดคล้อง (Alignment Matrix) ของโครงการนวัตกรรมที่พัฒนาสำเร็จ กับ Core Business หรือยุทธศาสตร์องค์กร"],"5":["รายงานถอดบทเรียน (AAR) ถึงปัญหาความล่าช้าในกระบวนการพัฒนานวัตกรรม (Stage-Gate)","เอกสารหลักฐานการปรับปรุงกระบวนการ (Process Improvement)"]},"docsNeeded":[{"level":"L3+","req":"กระดานสรุปสถานะโครงการ (Innovation Portfolio / Stage-Gate Tracking): ตารางหรือบอร์ดแสดงสถานะโครงการนวัตกรรมทั้งหมด ว่าผ่านประตูกลั่นกรอง (Gate) ใดบ้าง และโครงการใดถูกผลักดันสู่การใช้งานจริง (Launch) แล้ว"},{"level":"L3+","req":"เอกสารการคำนวณผลประโยชน์เชิงพาณิชย์ (Commercialization Value / ROI): หลักฐานการคำนวณที่แปลงผลลัพธ์ของนวัตกรรมเป็นตัวเงิน เช่น การลดเวลาทำงานได้กี่เปอร์เซ็นต์ คิดเป็นการลดต้นทุนแรงงานหรือได้รายได้กี่บาท"}],"actions":["คำนวณมูลค่าเชิงพาณิชย์ให้ทุกโครงการ (Calculate ROI/Cost-Saving): นำโครงการที่ทำเสร็จแล้ว (เช่น E-Complaint หรือ LCP Traffic) มาคำนวณว่า การลดเวลาได้ 66.67% นั้น คิดเป็นการลดต้นทุนแรงงาน หรือช่วยลดค่าเสียโอกาสให้ กทท. เป็นจำนวนเงินกี่บาท/ปี และนำตัวเลขนี้ใส่ในรายงาน","โชว์กระดาน Stage-Gate Tracking (Portfolio Board): ทำตารางสรุปว่าใน Innovation Portfolio ปัจจุบัน มีกี่โครงการ และแต่ละโครงการเดินหน้าถึง Gate ไหนแล้ว (เช่น Idea -> POC -> Develop -> Launch) เพื่อแสดงให้ผู้ตรวจเห็นว่าเรามีระบบ \"เข็น\" โปรเจกต์ออกสู่ตลาดอย่างเป็นรูปธรรม","เชื่อมโยงกับฝ่ายดิจิทัล (DT): เน้นย้ำให้เห็นชัดเจนว่า เทคโนโลยีดิจิทัลเป็น \"กลไกหลัก (Core Mechanism)\" ในการสร้างนวัตกรรมเหล่านี้ ไม่ใช่แค่ส่วนเสริม"],"crossLinks":[],"good":["กทท. ร่างกระบวนการพัฒนานวัตกรรม PAT-CIS อย่างเป็นระบบแล้ว"],"results":["มีการกำหนดกระบวนการพัฒนานวัตกรรมอย่างเป็นระบบ (PAT-CIS) จำนวน 8 องค์ประกอบ","ดำเนินการพัฒนานวัตกรรมที่มีการประยุกต์ใช้เทคโนโลยีดิจิทัล เช่น โครงการ E-Complaint Tracking ที่พัฒนาเสร็จและนำไปใช้งานจริงต้นปี 2568 สามารถเพิ่มความรวดเร็วได้ 66.67% และทีมงานได้รับรางวัลความสำเร็จ 70,000 บาท","มีโครงการนวัตกรรมที่ต่อยอดแล้วเสร็จในปี 2568 ถึง 7 โครงการ มีการรายงานผลอย่างต่อเนื่อง และโครงการ E-Complaint บรรลุตัวชี้วัด (BSC C1) ตามแผนแม่บทนวัตกรรมที่ตั้งเป้าลดเวลา 65%"],"gaps":["การพิสูจน์ \"ประโยชน์เชิงพาณิชย์และสังคม\" (Gap ระดับ 2-3) : ผู้ตรวจระบุใน Feedback Report ชัดเจนว่า กทท. “ควรแสดงให้เห็นการประยุกต์ใช้เทคโนโลยีเป็นกลไกหลัก... ที่สามารถสร้างประโยชน์เชิงพาณิชย์และ/หรือเชิงสังคมแก่รัฐวิสาหกิจ”  นั่นหมายความว่า การบอกว่าลดเวลาได้ 66.67% ยังไม่พอ function syncHomeStatus(){
  try{
    const status={};
    DATA.im.subs.forEach(s=>{
      const sid=s.id;
      const simMax=[5,4,3,2,1].find(L=>cgDimRad[sid]&&cgDimRad[sid][L]>0)||0;
      const gaps=s.gaps||[];
      const hasOpenGap=gaps.length>0&&gaps.some((_,i)=>{
        const fi=feInput[sid];
        return!(fi&&fi.gapClosed&&fi.gapClosed[i]===true);
      });
      status[sid]={level:simMax,hasOpenGap:hasOpenGap,gapCount:gaps.length};
    });
    const home=JSON.parse(localStorage.getItem('seam_status_69')||'{}');

    lines.push(`${isPass?'✓':'○'} ระดับ ${L} — ${dimTitle}`);
    if(note)lines.push(`   ${note}`);
    if(tickedDocs.length){lines.push(`   หลักฐานที่เตรียมแล้ว (${tickedDocs.length} รายการ):`);tickedDocs.forEach((d,i)=>lines.push(`   (${i+1}) ${d}`));}
    lines.push('');
  });
  const goods=s.good||[];const results=s.results||[];
  if(goods.length){lines.push('จุดแข็งขององค์กร:');goods.forEach(g=>lines.push(`• ${g}`));lines.push('');}
  if(results.length){lines.push('ผลการดำเนินงานที่นำเสนอ:');results.forEach((r,i)=>lines.push(`(${i+1}) ${r}`));lines.push('');}
  const gaps=s.gaps||[];
  if(gaps.length){
    lines.push('ช่องว่างที่ได้รับการเสนอแนะ และสถานะการปิด:');
    gaps.forEach((gap,i)=>{
      const cl=gapClosed[i];const gNote=gapNotes[i]||'';
      const st=cl===true?'✓ ปิดได้แล้ว':cl===false?'○ อยู่ระหว่างดำเนินการ':'— ยังไม่ได้ระบุ';
      lines.push(`• ${gap}`);
      lines.push(`  → ${st}${gNote?': '+gNote:''}`);
    });
  }
  return lines.join('\n');
}
function docToggle(sid,L,i,v){
  if(!docCk[sid])docCk[sid]={};
  if(!docCk[sid][L])docCk[sid][L]={};
  docCk[sid][L][i]=v;
  save();
  const inp=document.getElementById(`dck-${sid}-${L}-${i}`);
  if(inp){const lbl=inp.closest('label');if(lbl){if(v)lbl.classList.add('fb-item-done');else lbl.classList.remove('fb-item-done');}}
  updateDocProgress(sid);
}
function updateDocProgress(sid){
  const s=DATA.im.subs.find(x=>x.id===sid);
  if(!s)return;
  const mr=s.minReqs||{};
  let total=0,done=0;
  [1,2,3,4,5].forEach(L=>{

      cntEl.textContent=`${lvlDone}/${items.length}`;

      if(hdEl)hdEl.style.background=lvlDone===items.length&&items.length>0?'#e4f5e4':lvlDone>0?'#fef8e0':'rgba(2,132,199,.06)';
    }

  if(totalEl){

    totalEl.textContent=`${done}/${total} เอกสารพร้อมแล้ว`;
    totalEl.style.color=c;
    if(fillEl){fillEl.style.width=`${total>0?Math.round(done/total*100):0}%`;fillEl.style.background=c;}

}

function renderSim(s){

  let gated=false;

  for(let L=1;L<=5;L++){

    const rv=(cgDimRad[sid]&&cgDimRad[sid][L])||0;
    lvlSc.push({rv,bl:false});
    if(rv<1) gated=true;
  }
  const raw=lvlSc.reduce((a,x)=>a+x.rv,0);
  const wt=raw*(s.w/100);
  targets.im[sid]=raw;
  requestAnimationFrame(()=>{
    const inp=document.getElementById('ti-'+sid);
    if(inp){inp.value=fmt(targets.im[sid]);inp.style.borderColor=targets.im[sid]>=4?'#2a8a4a':targets.im[sid]>=3?'#5a8a00':targets.im[sid]>=2?'#c07000':'#c03020';}

  // All unique dims across levels for summary

  for(let _l=1;_l<=5;_l++){((CROSS_LINKS[sid]&&CROSS_LINKS[sid][_l])||[]).forEach(d=>{if(!allDimsSet.includes(d))allDimsSet.push(d);});}

      <span class="cg-wt">× ${s.w}% = <strong>${wt.toFixed(4)} pts</strong></span>
    </div>
  </div>`;
}

    html+=`<div class="fe-sect-lbl" style="margin-top:12px;">ช่องว่างจาก TRIS — ปิดได้หรือยัง?</div>`;
    gaps.forEach((gap,i)=>{
      const cl=feGapClosed(sid,i);
      const gNote=feGet(sid,'gapNotes',i);
      html+=`<div class="fe-gap-item">
        <div class="fe-gap-text">⚠️ ${gap}</div>
        <div class="fe-gap-status">
          <label class="fe-radio-lbl">
            <input type="radio" name="gc-${sid}-${i}" value="1"${cl===true?' checked':''}
              onchange="feSet('${sid}','gapClosed',${i},true)">
            ✓ ปิดได้แล้ว
          </label>
          <label class="fe-radio-lbl">
            <input type="radio" name="gc-${sid}-${i}" value="0"${cl===false?' checked':''}
              onchange="feSet('${sid}','gapClosed',${i},false)">
            ○ อยู่ระหว่างดำเนินการ
          </label>
        </div>
        <textarea class="fe-textarea" rows="2"
          placeholder="อธิบายสิ่งที่ทำเพื่อปิด Gap นี้..."
          onchange="feSet('${sid}','gapNotes',${i},this.value)"
          onblur="feSet('${sid}','gapNotes',${i},this.value)">${gNote}</textarea>
      </div>`;
    });
  }

  // ── Gen + Output ──
  html+=`<div style="margin-top:14px;">
    <button class="fe-gen-btn" onclick="document.getElementById('${outId}').value=genScript('${sid}');">🔄 Gen Script</button>
    <span style="font-size:11px;color:var(--text3);margin-left:8px;">ระบบจะรวม input ทั้งหมด + เอกสารที่ tick ใน Frame B + Simulator</span>
  </div>
  <div style="margin-top:8px;">
    <textarea class="fe-output" id="${outId}" rows="14"
      placeholder="กด Gen Script เพื่อสร้างคำตอบ — สามารถแก้ไขก่อน Copy ได้"></textarea>
    <button class="fe-copy-btn" onclick="feCopyOut('${outId}',this)">📋 Copy ทั้งหมด</button>
  </div>`;
  return html;
}

}

function updateScores(){
  const subs=DATA.im.subs;const tw=subs.reduce((a,s)=>a+s.w,0);

  document.getElementById('totalChip').textContent='คาดการณ์ '+fmt(total);
  document.getElementById('totalChip').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('totalFooter').textContent=fmt(total);
  document.getElementById('totalFooter').className='chip '+(delta>0?'ct':delta<0?'cr':'cn');
  document.getElementById('deltaChip').textContent=(delta>=0?'+':'')+fmt(delta)+' pts';
  document.getElementById('deltaChip').style.color=delta>0?'#1a9a50':delta<0?'#c03020':'#888';
  document.getElementById('deltaFooter').textContent=(delta>=0?'+':'')+fmt(delta);
  document.getElementById('deltaFooter').style.color=delta>0?'#5fcf8a':delta<0?'#f0806a':'#888';
  const grps=[...new Set(subs.map(s=>s.grp))];
  grps.forEach(gid=>{
    const ss=subs.filter(s=>s.grp===gid);const first=ss[0];
    const gs=ss.reduce((a,s)=>a+s.w*targets.im[s.id],0)/first.gw;
    const diff=gs-first.gs68;
    const el=document.getElementById('gs-cg-'+gid);
    if(el){el.textContent=fmt(gs);el.className='chip '+(diff<-0.001?'cr':diff>0.001?'ct':'cn');}
    // update rollup row
    const gsEl=document.getElementById('rollup-gs-'+gid);
    if(gsEl){
      gsEl.textContent=gs.toFixed(4);
      gsEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#555';
      const dEl=document.getElementById('rollup-delta-'+gid);
      if(dEl){dEl.textContent='('+(diff>=0?'+':'')+diff.toFixed(4)+')';dEl.style.color=diff>0.001?'#1a7a4a':diff<-0.001?'#c03020':'#aaa';}
    }
    const barEl=document.getElementById('rollup-bar-'+gid);
    if(barEl){
      barEl.style.width=Math.round(gs/5*100)+'%';
      barEl.style.background=gs>=3.5?'#1f9d6f':gs>=2.5?'#e3a82e':'#e2554f';
    }
    const chkEl=document.getElementById('rollup-chk-'+gid);
    if(chkEl){
      const assessed=ss.filter(s=>Object.values(cgDimRad[s.id]||{}).some(v=>v>0)||Object.values(cgChkSim[s.id]||{}).some(v=>v)).length;
      const tot=ss.length;
      chkEl.textContent=assessed===tot?`✓ ครบ ${tot}/${tot}`:`${assessed}/${tot} ข้อย่อย`;
      chkEl.className='grp-rollup-chk '+(assessed===tot?'chk-all':assessed>0?'chk-part':'chk-none');
    }
  });
  subs.forEach(s=>{const d=document.getElementById('dot-'+s.id);if(d)d.className='dot '+dotColor(s.id);});
}

// ── Checkbox Simulator (สำหรับ 5.1 และ 5.3) ────────────────────
// cgChkSim declared above near cgDimRad/cgChecked

function cgGetChkSim(sid, i) {
  return !!(cgChkSim[sid] && cgChkSim[sid][i]);
}
function cgSetChkSim(sid, i, v) {
  if (!cgChkSim[sid]) cgChkSim[sid] = {};
  cgChkSim[sid][i] = v;
  save();
  renderAll();
}

// คำนวณ L จาก checkbox ที่เช็คไว้
function calcLevelFromCheckbox(s) {
  const sid = s.id;
  const items = s.checkboxItems || [];
  const thresholds = s.checkboxThresholds || {};
  const maxL = s.checkboxMaxLevel || 5;
  let checked = 0;
  items.forEach((_, i) => { if (cgGetChkSim(sid, i)) checked++; });

  let score = 0;
  for (let L = maxL; L >= 1; L--) {
    if (checked >= (thresholds['L' + L] || 999)) { score = L; break; }
  }
  return { checked, score };
}

function renderCheckboxSim(s) {
  const sid = s.id;
  const items = s.checkboxItems || [];
  const thresholds = s.checkboxThresholds || {};
  const maxL = s.checkboxMaxLevel || 5;
  const { checked, score } = calcLevelFromCheckbox(s);

  // ถ้า 5.3 มี L5 แยกเป็น radio
  const hasL5Radio = s.checkboxMaxLevel === 4;
  const l5rv = hasL5Radio ? ((cgDimRad[sid] && cgDimRad[sid][5]) || 0) : 0;
  const raw = score + l5rv;
  const wt = raw * (s.w / 100);
  targets.im[sid] = raw;
  requestAnimationFrame(() => {
    const inp = document.getElementById('ti-' + sid);
    if (inp) {
      inp.value = fmt(targets.im[sid]);
      inp.style.borderColor = targets.im[sid] >= 4 ? '#2a8a4a' : targets.im[sid] >= 3 ? '#5a8a00' : targets.im[sid] >= 2 ? '#c07000' : '#c03020';
    }
  });

  // สร้าง progress bar ตาม thresholds
  const thKeys = Object.keys(thresholds).sort((a, b) => thresholds[a] - thresholds[b]);
  let progressHTML = `<div style="margin-bottom:8px;">`;
  progressHTML += `<div style="display:flex;justify-content:space-between;font-size:9px;color:#7a6a9a;margin-bottom:3px;">`;
  thKeys.forEach(lk => {
    const t = thresholds[lk];
    const pct = Math.min(100, Math.round(checked / items.length * 100));
    const reached = checked >= t;
    progressHTML += `<span style="color:${reached ? '#1a7a4a' : '#9a90b8'};font-weight:${reached ? '700' : '400'};">${lk}≥${t}</span>`;
  });
  progressHTML += `</div>`;
  const pct = Math.round(checked / items.length * 100);
  progressHTML += `<div class="cg-prog-bar"><div class="cg-prog-fill" style="width:${pct}%;background:${score >= maxL ? '#1a7a4a' : '#5a20a0'};"></div></div>`;
  progressHTML += `<div style="font-size:10px;color:#4a3a6a;margin-top:3px;">เช็คแล้ว <strong>${checked}/${items.length}</strong> ประเด็น → <strong style="color:${score >= maxL ? '#1a7a4a' : '#c07000'}">L${score || '-'}</strong></div>`;
  progressHTML += `</div>`;

  // Checkbox list
  let listHTML = `<div style="background:#f0ebff;border:1px solid #c8b8e8;border-radius:6px;padding:8px 10px;margin-bottom:8px;">`;
  listHTML += `<div class="cg-sect-lbl" style="margin-bottom:6px;">📋 ประเด็นที่เปิดเผยในรายงาน — เช็คทุกประเด็นที่มีอยู่จริง</div>`;
  items.forEach((item, i) => {
    const ck = cgGetChkSim(sid, i);
    const kid = `chksim-${sid}-${i}`;
    listHTML += `<div class="cg-req-item"><input type="checkbox" id="${kid}" ${ck ? 'checked' : ''} onchange="cgSetChkSim('${sid}',${i},this.checked);" style="accent-color:#5a20a0;"><label for="${kid}" style="font-size:10.5px;">${item}</label></div>`;
  });
  listHTML += `</div>`;

  // L5 radio (เฉพาะ 5.3)
  let l5HTML = '';
  if (hasL5Radio) {
    const trap = (s.subComps && s.subComps[5]) || [];
    l5HTML = `<div class="cg-lvl-row" style="border:1px solid #d4cce8;border-radius:6px;margin-bottom:6px;overflow:hidden;">
      <div class="cg-lvl-hd" style="background:${l5rv >= 1 ? '#e4f5e4' : l5rv > 0 ? '#fef8e8' : '#f0ebff'};">
        <span class="cg-lvl-num">L5</span>
        <span class="cg-lvl-summ"><span class="kt">${s.levelSumm[4]}</span></span>
        <span style="font-size:10px;font-weight:700;color:${l5rv >= 1 ? '#1a7a4a' : l5rv > 0 ? '#c07000' : '#9a80c8'};">${l5rv.toFixed(2)}</span>
      </div>
      <div class="cg-lvl-body">
        <div class="cg-sect-lbl">📐 มิติที่ประเมิน (L5)</div>
        <div class="cg-radio-grp">`;
    [[0, '0 — ไม่ครบตามเกณฑ์'], [0.5, '0.5 — ทำได้บางส่วน'], [1, '1.0 — ครบตามมิติที่ประเมิน']].forEach(([v, lbl]) => {
      const ck = l5rv === v;
      const col = v === 1 ? '#1a7a4a' : v === 0.5 ? '#c07000' : '#c03020';
      l5HTML += `<label style="padding:3px 6px;border-radius:5px;background:${ck ? (v === 1 ? '#e0f5e8' : v === 0.5 ? '#fef8e0' : '#fee8e8') : 'transparent'};border:1px solid ${ck ? col : 'transparent'};color:${ck ? col : '#444'};font-weight:${ck ? '700' : '400'};cursor:pointer;">
        <input type="radio" name="cgdim-${sid}-5" value="${v}" ${ck ? 'checked' : ''} onchange="cgSetDim('${sid}',5,${v});" style="accent-color:${col};"> ${lbl}</label>`;
    });
    l5HTML += `</div>`;
    if (trap.length) {
      l5HTML += `<div class="cg-sect-lbl" style="margin-top:6px;color:#7a2800;">⚠️ จุดดักคะแนน</div>`;
      trap.forEach(t => { l5HTML += `<div class="cg-trap">• ${t}</div>`; });
    }
    l5HTML += `</div></div>`;
  }

  // Integration links
  const allLinks = [];
  for (let L = 1; L <= 5; L++) {
    const ls = (s.integLinks && s.integLinks[L]) || [];
    ls.forEach(d => { if (!allLinks.includes(d)) allLinks.push(d); });
  }
  const intB = allLinks.map(d => `<a href="${LINK_URL}" target="_blank" class="cg-int-link">🔗 ${d}</a>`).join('');
  const intSection = intB ? `<div style="margin:6px 0;display:flex;gap:4px;flex-wrap:wrap;">${intB}</div>` : '';

  // Traps (5.1)
  let trapHTML = '';
  const traps5 = (s.subComps && s.subComps[5]) || [];
  if (traps5.length && !hasL5Radio) {
    trapHTML = `<div class="cg-sect-lbl" style="color:#7a2800;">⚠️ จุดดักคะแนน</div>`;
    traps5.forEach(t => { trapHTML += `<div class="cg-trap">• ${t}</div>`; });
  }

  return `<div class="cg-sim">
    <div class="cg-sim-hd">
      <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy);color:#fff;">IM</span>
      &nbsp;Checkbox Simulator — เช็คประเด็นที่เปิดเผยแล้ว
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <button onclick="if(confirm('ล้างข้อมูลทั้งหมด? (radio, checkbox, checklist)'))cgClearAll()" style="font-size:11px;padding:3px 10px;border:1px solid #e0a0a0;border-radius:5px;background:#fee8e8;cursor:pointer;color:#b03020;font-weight:600;">🗑 ล้างข้อมูล</button>
        <span style="font-size:11px;font-weight:700;color:#2a1558;">${raw.toFixed(4)}/5.0</span>
      </span>
    </div>
    <div class="cg-scope-box">${s.scopeNote || ''}</div>
    ${progressHTML}
    ${listHTML}
    ${intSection}
    ${l5HTML}
    ${trapHTML}
    <div class="cg-total-bar">
      <span class="cg-total-lbl">คะแนนสะสม (0–5)</span>
      <span class="cg-raw">${raw.toFixed(4)}</span>
      <span class="cg-wt">× ${s.w}% = <strong>${wt.toFixed(4)} pts</strong></span>
    </div>
  </div>`;
}

</script>
</body>
</html>
